  /v1/datasets/instrument_option_change_details/download:
    post:
      operationId: instrument_option_change_details_download
      summary: 期权企业行动 - 变更明细导出
      tags:
      - 公司行动 (Corporate Action)
      x-permission-key:
      - lb_hk_corporate.corporate_query
      x-lbonly: false
      description: |-
        将「期权企业行动 - 变更明细」数据导出为文件。`filters` 决定导出范围，`down_fields` 可限制导出字段。

        ### 导出模式

        - `mode: 0`：同步导出，成功后直接返回下载地址。
        - `mode: 1`：异步导出，先返回 `file_download_id`；随后调用 `GET /v1/datasets/download/<built-in function id>` 获取下载地址。
        - 不再需要导出记录时，可调用 `DELETE /v1/datasets/download/<built-in function id>` 删除。
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 字段同 instrument_option_change_details.yaml（query 能力）里的 filters
                  properties:
                    recondiliation_id:
                      type: string
                      description: 用于按「recondiliation_id」筛选结果。
                mode:
                  type: integer
                  default: 0
                  description: |-
                    不传时默认 0（同步）

                    **可选值：**

                    - `0` - 表示同步

                    - `1` - 表示异步
                  enum:
                  - 0
                  - 1
                  x-enum-details:
                  - value: 0
                    label: 同步
                  - value: 1
                    label: 异步
                ext:
                  type: string
                  description: |-
                    下载文件格式。不传时默认为 `csv`。

                    **可选值：**

                    - `csv` - 表示 CSV

                    - `xlsx` - 表示 Excel
                  enum:
                  - csv
                  - xlsx
                file_name:
                  type: string
                  description: 导出文件名称。不传时由服务端生成。
                remark:
                  type: string
                  description: 与本次操作一并保存的备注。
                down_fields:
                  type: array
                  description: 不传时导出全部字段；取值范围见 items.enum（同查询接口 data.list.items 的字段列表）
                  items:
                    type: string
                    enum:
                    - id
                    - account_channel
                    - origin_option_counter_id
                    - origin_option_counter_id_val
                    - new_option_counter_id
                    - new_option_counter_id_val
                    - origin_quantity
                    - new_quantity
                    - origin_id
                    - real_name
                ticket_content:
                  type: string
                  description: 模板配置了下载审核工单时，供审批人查看
                ticket_preview_url:
                  type: string
                  description: 导出审批详情地址；仅在导出需要审批时使用。
                hide:
                  type: integer
                  description: |-
                    是否在下载记录列表中隐藏本次导出记录。

                    **可选值：**

                    - `0` - 表示不隐藏

                    - `1` - 表示隐藏
                  enum:
                  - 0
                  - 1
                  x-enum-details:
                  - value: 0
                    label: 不隐藏
                  - value: 1
                    label: 隐藏
            example:
              filters: {}
              mode: 0
              ext: csv
              file_name: ''
              remark: ''
              down_fields: []
              ticket_content: ''
              ticket_preview_url: ''
              hide: 0
      responses:
        '200':
          description: 成功时返回「期权企业行动 - 变更明细导出」任务信息。同步导出直接提供下载地址；异步导出提供用于后续查询的 `file_download_id`。
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - data
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。

                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code` 判断具体结果。

                      - `401`：未登录。
                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。
                    x-enum-details:
                    - value: 0
                      label: 成功
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      url:
                        type: string
                        description: '同步模式（`mode: 0`）下返回，异步模式下为空'
                      file_download_id:
                        type: string
                        description: '异步模式（`mode: 1`）下返回，即 `GET /v1/datasets/download/{id}` / `DELETE /v1/datasets/download/{id}` 路径中的 id：GET 获取最终下载地址，DELETE 删除该导出记录。'
                      ticket_id:
                        type: string
                        description: '**返回值：** 审批工单 ID。仅在本次操作触发审批流程时返回。'
              example:
                code: 0
                message: success
                data:
                  url: https://b-api.longbridge.xyz/download/export_result.csv
                  file_download_id: ''
                  ticket_id: ''
        '400':
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
