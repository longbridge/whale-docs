  /corporate_action/refund_by_view:
    post:
      operationId: refund_by_view
      summary: 公司行动 - 按子仓视图分组发起退税
      tags:
      - 公司行动 (Corporate Action)
      x-permission-key:
      - lb_hk_corporate.corporate_query
      x-lbonly: false
      description: '在退税流程中，按所选子仓视图的分组维度发起退税。


        当调用方选择了某个子仓视图后，退税金额按该视图下的各分组分别填写并提交；每个分组给出退税金额及其覆盖的子仓账号范围。


        ### 请求参数


        - 必填：`ann_id`（企业行动预告 ID）、`view_id`（子仓视图 ID）、`groups`（退税分组列表）

        - `groups` 中每一项需给出 `group_id`（分组 ID）、`amount`（退税金额）和 `sub_position_scope`（该分组覆盖的子仓账号范围）

        - 可选：`audit_frontend_resource`（调用方提供的审计上下文）


        ### 处理结果


        成功时发起退税并返回结果，业务结果位于 `data`；请结合业务 `code` 判断是否成功。'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - ann_id
              - view_id
              - groups
              properties:
                ann_id:
                  type: string
                  description: 企业行动预告 ID，指定要发起退税的企业行动。
                view_id:
                  type: string
                  description: 子仓视图 ID，取值来自「查询退税场景下可用的子仓视图列表」返回的视图标识。
                groups:
                  type: array
                  description: 退税分组列表。每一项对应所选视图下的一个分组，分别给出退税金额及其覆盖的子仓账号范围。
                  items:
                    type: object
                    required:
                    - group_id
                    - amount
                    - sub_position_scope
                    properties:
                      group_id:
                        type: string
                        description: 分组 ID。
                      group_name:
                        type: string
                        description: 分组名称，调用方提供的分组展示名，不传时不影响退税处理。
                      amount:
                        type: string
                        description: 该分组的退税金额。以字符串形式传递金额数值。
                      sub_position_scope:
                        type: array
                        items:
                          type: string
                        description: 该分组覆盖的子仓账号范围，为子仓账号（`counterpart_account`）列表。
                audit_frontend_resource:
                  type: object
                  description: 调用方提供的审计上下文，用于记录本次操作涉及的标的与预告编号等信息，不传时不附加审计信息。
            example:
              ann_id: '117456'
              view_id: '3021'
              groups:
              - group_id: g-1
                group_name: 示例分组
                amount: '1000.00'
                sub_position_scope:
