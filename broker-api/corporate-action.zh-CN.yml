  description: 公司行动、事后调整、费用管理、美股期权企业行动等相关的后台管理接口。
paths:
  /v1/datasets/corp_action_post_adjust_announcements:
    post:
      operationId: corp_action_post_adjust_announcements
      summary: 执行后调整 - 预告列表
      tags:
      - 公司行动 (Corporate Action)
      x-permission-key:
      - corporate.after_event_adjustment_query
      x-lbonly: false
      description: '查询「执行后调整 - 预告列表」数据，可通过 `filters` 组合业务筛选条件，并使用 `page`、`page_size` 控制分页。


        ### 返回结果


        成功时返回匹配的记录列表及分页信息。各过滤字段的用途、可选值和动态数据来源见对应字段说明。'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 组合业务过滤条件。省略某个过滤字段时，不按该字段筛选。
                  properties:
                    ca_code:
                      type: string
                      description: 用于按「预告编号」筛选结果。
                page:
                  type: integer
                  description: 要查询的页码，从 `1` 开始。
                page_size:
                  type: integer
                  description: 每页返回的记录数量。
            example:
              filters: {}
              page: 1
              page_size: 20
      responses:
        '200':
          description: 成功时分页返回「执行后调整 - 预告列表」记录，以及页码、每页数量和总记录数等分页信息。
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - data
                properties:
                  code:
                    type: integer
                    description: '0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。


                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code` 判断具体结果。


                      - `401`：未登录。

                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。'
                    x-enum-details:
                    - value: 0
                      label: 成功
                  message:
                    type: string
                  data:
                    type: object
                    required:
                    - list
                    - total
                    properties:
                      list:
                        type: array
                        description: '**返回值：** 列表列表。'
                        items:
                          type: object
                          properties:
                            ca_code:
                              type: string
                              description: '**返回值：** 预告编号。'
                            ann_type:
                              type: string
                              description: '**返回值：** 预告类型。'
                            ann_type_val:
                              type: string
                              description: 字段 ann_type 的原始值：ann_type 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            origin_counter_id:
                              type: string
                              description: '**返回值：** 标的。'
                            record_date:
                              type: string
                              description: '**返回值：** 登记日期；时间或日期格式以接口实际返回值为准。'
                            payable_date:
                              type: string
                              description: '**返回值：** 支付日期；时间或日期格式以接口实际返回值为准。'
                            remark:
                              type: string
                              description: '**返回值：** 备注。'
                            adjust_count:
                              type: string
                              description: '**返回值：** 调整次数。'
                      total:
                        type: integer
                        description: '**返回值：** 符合查询条件的记录总数，用于计算分页。'
              example:
                code: 0
                message: success
                data:
                  list:
                  - ca_code: AT_BE_20260529094941_530578
                    ann_type: BE
                    ann_type_val: '4'
                    origin_counter_id: ST/US/QCOM
                    record_date: '20260518'
                    payable_date: '20260527'
                    remark: Ann Remark 111059
                    adjust_count: '3'
                  total: 0
