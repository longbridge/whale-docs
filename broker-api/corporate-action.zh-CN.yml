                      description: 参与股东大会的方式。
                      enum:
                      - 0
                      - 1
                      - 2
                      - 3
                      example: 1
                      x-enum-details:
                      - value: 0
                        label: 未指定
                      - value: 1
                        label: 委托投票
                      - value: 2
                        label: 本人出席
                      - value: 3
                        label: 委托出席
                    attendee_name:
                      type: string
                      description: 出席人姓名。
                      example: John Doe
                    attendee_identification_number:
                      type: string
                      description: 出席人证件号。
                      example: A1234567
                    attendee_address:
                      type: string
                      description: 出席人地址。
                      example: Central, Hong Kong
                    attendee_gender:
                      type: string
                      description: 出席人性别。
                      example: M
            example:
              ann_id: '12345'
              aaid: 67890
              voting_infos:
              - chosen_proxy_serial: P001
                vote: 1
              attendee_info:
                attend_type: 1
