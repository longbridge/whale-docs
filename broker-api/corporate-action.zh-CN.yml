                        enum:
                        - 0
                        - 1
                        - 2
                        - 3
                        example: 1
                        x-enum-details:
                        - value: 0
                          label: 未指定
                        - value: 1
                          label: 赞成
                        - value: 2
                          label: 反对
                        - value: 3
                          label: 弃权
