                    - exchange_rate
                    - exchange_price
                    - precision
                    - origin_divide_payout_ratio
                    - new_divide_payout_ratio
                    - surplus_value
                    - is_fractional_stock
                    - is_fractional_stock_val
                    - executive_date
                    - receive_counter_id
                    - remark
                ticket_content:
                  type: string
