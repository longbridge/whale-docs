                register_id:
                  type: string
                  description: 要修改的客户登记明细记录的唯一标识。
                  example: '1001'
                details:
                  type: array
                  description: 待修改行权数量的明细项列表，每一项对应一个事件。
                  items:
                    type: object
                    required:
