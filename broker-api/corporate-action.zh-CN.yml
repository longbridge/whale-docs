      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 字段同 instrument_option_rules.yaml（query 能力）里的 filters
                  properties:
                    origin_option_symbol:
                      type: string
                      description: 用于按「变更前代码」筛选结果。
                    state:
                      type: string
                      description: '用于按「状态」筛选结果。


                        支持多选；提交时使用英文逗号（`,`）拼接多个值。不传时不按此字段筛选。


                        **可选值：**

                        - `init` - 表示初始化

                        - `ib_confirmed` - 表示 IB 确认完成

                        - `sync_risk_system_failed` - 表示同步风控参数失败

                        - `sync_risk_system_succeed` - 表示同步风控参数成功

                        - `executing` - 表示执行中

                        - `execut_failed` - 表示执行失败

                        - `execut_succeed` - 表示执行成功'
                      example: init,ib_confirmed
                      enum:
                      - init
                      - ib_confirmed
                      - sync_risk_system_failed
                      - sync_risk_system_succeed
                      - executing
                      - execut_failed
                      - execut_succeed
                      x-enum-details:
                      - value: init
                        label: 初始化
                      - value: ib_confirmed
                        label: IB 确认完成
                      - value: sync_risk_system_failed
                        label: 同步风控参数失败
                      - value: sync_risk_system_succeed
                        label: 同步风控参数成功
                      - value: executing
                        label: 执行中
                      - value: execut_failed
                        label: 执行失败
                      - value: execut_succeed
                        label: 执行成功
                mode:
                  type: integer
                  default: 0
                  description: '不传时默认 0（同步）


                    **可选值：**

                    - `0` - 表示同步

                    - `1` - 表示异步'
                  enum:
                  - 0
                  - 1
                  x-enum-details:
                  - value: 0
                    label: 同步
                  - value: 1
                    label: 异步
                ext:
                  type: string
                  description: '下载文件格式。不传时默认为 `csv`。


                    **可选值：**

                    - `csv` - 表示 CSV

                    - `xlsx` - 表示 Excel'
                  enum:
                  - csv
                  - xlsx
                file_name:
                  type: string
                  description: 导出文件名称。不传时由服务端生成。
                remark:
                  type: string
                  description: 与本次操作一并保存的备注。
                down_fields:
                  type: array
                  description: 不传时导出全部字段；取值范围见 items.enum（同查询接口 data.list.items 的字段列表）
                  items:
                    type: string
                    enum:
                    - id
                    - account_channel
                    - origin_option_symbol
                    - option_symbol_change_to
                    - ib_option_counter_id
                    - contract_size
                    - strike_price_expr
                    - state
                    - state_val
                    - update_by
                    - updated_at
                    - contract_multiplier
                    - new_multiplier
                ticket_content:
                  type: string
                  description: 模板配置了下载审核工单时，供审批人查看
                ticket_preview_url:
                  type: string
                  description: 导出审批详情地址；仅在导出需要审批时使用。
                hide:
                  type: integer
                  description: '是否在下载记录列表中隐藏本次导出记录。


                    **可选值：**

                    - `0` - 表示不隐藏

                    - `1` - 表示隐藏'
                  enum:
                  - 0
                  - 1
                  x-enum-details:
                  - value: 0
                    label: 不隐藏
                  - value: 1
                    label: 隐藏
            example:
              filters: {}
              mode: 0
              ext: csv
              file_name: ''
              remark: ''
              down_fields: []
              ticket_content: ''
              ticket_preview_url: ''
              hide: 0
