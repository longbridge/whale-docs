  /v1/datasets/corp_action_post_adjust_announcements/download:
    post:
      operationId: corp_action_post_adjust_announcements_download
      summary: 执行后调整 - 预告列表导出
      tags:
      - 公司行动 (Corporate Action)
      x-permission-key:
      - corporate.after_event_adjustment_query
      x-lbonly: false
      description: '将「执行后调整 - 预告列表」数据导出为文件。`filters` 决定导出范围，`down_fields` 可限制导出字段。


        ### 导出模式


        - `mode: 0`：同步导出，成功后直接返回下载地址。

        - `mode: 1`：异步导出，先返回 `file_download_id`；随后调用 `GET /v1/datasets/download/{id}` 获取下载地址。

        - 不再需要导出记录时，可调用 `DELETE /v1/datasets/download/{id}` 删除。'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 字段同 corp_action_post_adjust_announcements.yaml（query 能力）里的 filters
                  properties:
                    ca_code:
                      type: string
                      description: 用于按「预告编号」筛选结果。
                mode:
                  type: integer
                  default: 0
                  description: '不传时默认 0（同步）


                    **可选值：**

                    - `0` - 表示同步

                    - `1` - 表示异步'
                  enum:
                  - 0
                  - 1
                  x-enum-details:
                  - value: 0
                    label: 同步
                  - value: 1
                    label: 异步
                ext:
                  type: string
                  description: '下载文件格式。不传时默认为 `csv`。


                    **可选值：**

                    - `csv` - 表示 CSV

                    - `xlsx` - 表示 Excel'
                  enum:
                  - csv
                  - xlsx
                file_name:
                  type: string
                  description: 导出文件名称。不传时由服务端生成。
                remark:
                  type: string
                  description: 与本次操作一并保存的备注。
                down_fields:
                  type: array
                  description: 不传时导出全部字段；取值范围见 items.enum（同查询接口 data.list.items 的字段列表）
                  items:
                    type: string
                    enum:
                    - ca_code
                    - ann_type
                    - ann_type_val
                    - origin_counter_id
                    - record_date
                    - payable_date
                    - remark
                    - adjust_count
                ticket_content:
                  type: string
                  description: 模板配置了下载审核工单时，供审批人查看
                ticket_preview_url:
                  type: string
                  description: 导出审批详情地址；仅在导出需要审批时使用。
                hide:
                  type: integer
                  description: '是否在下载记录列表中隐藏本次导出记录。


                    **可选值：**

                    - `0` - 表示不隐藏

                    - `1` - 表示隐藏'
                  enum:
                  - 0
                  - 1
                  x-enum-details:
                  - value: 0
                    label: 不隐藏
                  - value: 1
                    label: 隐藏
            example:
              filters: {}
              mode: 0
              ext: csv
              file_name: ''
              remark: ''
              down_fields: []
              ticket_content: ''
              ticket_preview_url: ''
              hide: 0
      responses:
        '200':
          description: 成功时返回「执行后调整 - 预告列表导出」任务信息。同步导出直接提供下载地址；异步导出提供用于后续查询的 `file_download_id`。
          content:
            application/json:
              schema:
                type: object
                required:
                - code
