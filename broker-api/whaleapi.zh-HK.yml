  /v2/whaleapi/account/list:
    get:
      operationId: whale_list_account_v2
      summary: 獲取賬戶列表 V2
      tags:
        - 資產賬户
      x-permission-key:
        - kyc.hk_account
      x-lbonly: false
      x-source: WhaleAPI
      parameters:
        - name: account_id
          in: query
          required: true
          schema:
            type: string
          description: 分頁 ID
        - name: page_size
          in: query
          required: true
          schema:
            type: string
          description: 一頁查詢的數量，默認 10，最多 500 條
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。

                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`
                      判斷具體結果。

                      - `401`：未登錄。
                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。選項: `0` = 成功
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      next_account_id:
                        type: string
                        description: 下一個分頁 ID
                      list:
                        type: object
                        properties:
                          member_id:
                            type: string
                            description: 用戶 ID
                          account_no:
                            type: string
                            description: 證券賬號
                          open_account_time:
                            type: string
                            description: 賬戶開通時間
                        required:
                          - member_id
                          - account_no
                          - open_account_time
                        description: 賬戶列表
                    required:
                      - next_account_id
                      - list
                    description: data數據
              example:
                code: 0
                message: success
                data:
                  next_account_id: string
                  list:
                    member_id: string
                    account_no: string
                    open_account_time: string
          description: 成功
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
          description: 未登錄或登錄狀態已失效
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
          description: 當前賬號未獲得該功能授權。請在 User Permission 中為該賬號開通相應權限
        "408":
          content:
            application/json:
