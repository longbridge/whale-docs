            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
          description: 請求處理超時。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`
      description: 該接口用於校驗指定證券賬號的交易密碼是否正確。通過傳入賬號 account_no 及加密後的交易密碼 encrypt_password，驗證通過後返回資產賬戶唯一標識 aaid 及用戶賬號 member_id
      x-mint:
        href: /zh-HK/api-reference/account_auth
        metadata:
          sidebarTitle: 交易密碼校驗
