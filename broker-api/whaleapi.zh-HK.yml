  /v1/whaleapi/account/bcan_info:
    get:
      operationId: whale_get_bcan_info_by_account_no
      summary: 獲取賬戶 Bcan 信息
      tags:
        - 資產賬户
      x-permission-key:
        - account.bcan_code_list
      x-lbonly: false
      x-source: WhaleAPI
      parameters:
        - name: account_no
          in: query
          required: true
          schema:
            type: string
          description: 證券賬號
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。

                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`
                      判斷具體結果。

                      - `401`：未登錄。
                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。選項: `0` = 成功
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      ce_no:
                        type: string
                        description: 中央編號
                      bcan_no:
                        type: string
                        description: bcan碼
                      is_agree:
                        type: boolean
                        description: "中華通同意狀態 同意: true 不同意:false"
                      hk_is_agree:
                        type: boolean
                        description: "HKIDR同意狀態 同意: true 不同意:false"
                      state:
                        type: integer
                        description: 中華通生效狀態 生效:1 失效:-1
                      hk_state:
                        type: integer
                        description: HKIDR生效狀態 生效:1 失效:-1
                    required:
                      - ce_no
                      - bcan_no
                      - is_agree
                      - hk_is_agree
                      - state
                      - hk_state
                    description: data數據
              example:
                code: 0
                message: success
                data:
                  ce_no: string
                  bcan_no: string
                  is_agree: false
                  hk_is_agree: false
                  state: 0
                  hk_state: 0
          description: 成功
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
          description: 未登錄或登錄狀態已失效
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
          description: 當前賬號未獲得該功能授權。請在 User Permission 中為該賬號開通相應權限
        "408":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
          description: 請求處理超時。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`
      description: 該接口用於查詢指定證券賬號的 BCAN（Broker-to-Client Assigned Number）相關信息。通過傳入證券賬號 account_no，返回賬戶的中央編號 ce_no、BCAN 碼 bcan_no、中華通同意狀態、HKIDR 同意狀態及兩者的生效狀態
