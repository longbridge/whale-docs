  /v1/whaleapi/asset/query_account_risk_limit_config:
    get:
      operationId: get_account_risk_limit_config
      summary: 查詢用戶限額信息
      tags:
        - 風控管理
      x-permission-key:
        - lb_hk_risk_limit_config.risk_limit_config_client_query
      x-lbonly: false
      x-source: WhaleAPI
      parameters:
        - name: account_no
          in: query
          required: true
          schema:
            type: string
          description: 證券賬號，例如：L6VQEU00121996
        - name: limit_code
          in: query
          required: false
          schema:
            type: string
          description: 不傳則返回客戶所有限額，傳參則返回指定限額
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      limits:
                        type: object
                        properties:
                          CSHB:
                            type: object
                            properties:
                              name:
                                type: string
                                description: 名稱
                              limit_type:
                                type: string
                                description: 限額類型：1-數量限額，2-金額限額
                              reject_operator:
                                type: string
                                description: 限額運算符：GreaterThanOrEqual、GreaterThan、LessThanOrEqual、LessThan
                              reject_limit:
                                type: string
                                description: 限額數值
                              currency:
                                type: string
                                description: 幣種
                            required:
                              - name
                              - limit_type
                              - reject_operator
                              - reject_limit
                              - currency
                            description: 限額代碼,作為key
                        required:
                          - CSHB
                        description: 限額
                    required:
                      - limits
                    description: 數據
              example:
                data:
                  limits:
                    CSHB:
                      name: 客户单笔卖出下单金额限额
                      limit_type: "2"
                      reject_operator: GreaterThanOrEqual
                      reject_limit: "50000000"
                      currency: USD
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
          description: 未登錄或登錄狀態已失效
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
          description: 當前賬號未獲得該功能授權。請在 User Permission 中為該賬號開通相應權限
        "408":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
          description: 請求處理超時。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`
      description: 該接口用於查詢指定證券賬號的風控限額配置詳情。通過傳入賬號 account_no，可選傳入限額代碼 limit_code 進行精確查詢，返回該賬號配置的限額信息，包括限額名稱、類型（數量或金額）、拒絕運算符及拒絕限額數值等
