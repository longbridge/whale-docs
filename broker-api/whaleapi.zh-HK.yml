                  description: 邀請碼
                stages:
                  type: array
                  items:
                    type: integer
                    description: 註冊，開戶，入金
                  description: 階段
                bound_at:
                  type: integer
                  description: 綁定時間，可選
              required:
                - open_id
                - invite_code
                - stages
                - bound_at
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
