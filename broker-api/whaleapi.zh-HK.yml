openapi: 3.1.1
info:
  title: Longport Whale 券商 API
  description: 面向使用 Longport Whale 的券商提供機構級服務端 API。
  version: 2.0.0
servers:
  - url: https://b-api.longbridge.xyz
    description: 測試環境
  - url: https://b-api.lbkrs.com
    description: 生產環境
tags:
  - name: 資產賬户
  - name: 款項管理
  - name: 證券管理
  - name: 新股認購
  - name: 基金管理
  - name: 虛擬資產管理
  - name: 清算管理
  - name: 公司行動
  - name: 風控管理
  - name: 報表管理
  - name: 經紀人管理
  - name: 會計中台
  - name: 交易面板
  - name: 公告管理
  - name: 業務參數設置
  - name: 可疑事件監控
  - name: 活動
  - name: 獎勵中心
  - name: 其他
paths:
  /v1/whaleapi/fee/estimate:
    post:
      operationId: open_api_fee_estimate
      summary: 費用預估
      tags:
        - 業務參數設置
      x-permission-key:
        - order_pots.order_pots_action
      x-lbonly: false
      x-source: WhaleAPI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                symbol:
                  type: string
                  description: 股票代碼，使用 ticker.region 格式
                side:
                  type: object
                  properties: {}
                  description: 買賣方向：買入或賣出
                price:
                  type: string
                  description: 價格
                quantity:
                  type: string
                  description: 數量
                currency:
                  type: string
                  description: "價格的幣種: USD, HKD"
                account_no:
                  type: string
                  description: 賬戶信息
              required:
                - symbol
                - price
                - quantity
                - currency
                - account_no
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。

                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`
                      判斷具體結果。

                      - `401`：未登錄。
                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。選項: `0` = 成功
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      total_amount:
                        type: string
                        description: 總金額
                      bills:
                        type: array
                        items:
                          type: object
                          properties:
                            code:
                              type: string
                              description: 費用代碼
                            name:
                              type: string
                              description: 費用名稱
                            amount:
                              type: string
                              description: 手續費金額
                            dep_code:
                              type: string
                              description: 關聯費用代碼
                        description: 詳情
                    required:
                      - total_amount
                      - bills
              example:
                code: 0
                message: success
                data:
                  total_amount: string
                  bills:
                    - code: string
                      name: string
                      amount: string
                      dep_code: string
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
          description: 未登錄或登錄狀態已失效
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
          description: 當前賬號未獲得該功能授權。請在 User Permission 中為該賬號開通相應權限
        "408":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
          description: 請求處理超時。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`
      description: 該接口用於對指定證券賬號的交易訂單進行費用預估。通過傳入股票代碼 symbol、買賣方向 side、價格 price、數量 quantity、幣種 currency 及賬號 account_no，返回該筆交易的預估總費用 total_amount 及各費用項明細列表 bills，幫助用戶在下單前瞭解交易成本構成
      x-mint:
        href: /zh-HK/api-reference/open_api_fee_estimate
        metadata:
          sidebarTitle: 費用預估
