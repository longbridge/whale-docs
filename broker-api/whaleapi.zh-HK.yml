        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
          description: 未登錄或登錄狀態已失效
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
          description: 當前賬號未獲得該功能授權。請在 User Permission 中為該賬號開通相應權限
        "408":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
          description: 請求處理超時。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`
      description: |-
        OPA 租戶為指定長橋用戶在註冊、開戶、入金階段綁定邀請碼

        ### 錯誤碼

        - `400801`：邀請碼在長橋不存在，請檢查邀請碼
        - `400803`：用戶標識校驗失敗，請檢查後重試
        - `400804`：解析不到 mid
        - `400805`：邀請類型 stage 取值不合法
        - `400806`：目標階段已綁邀請關係，邀請碼不同
        - `400807`：目標階段已綁邀請關係，邀請碼相同
        - `1901500`：長橋內部錯誤，請重試
        - `1901601`：邀請關係有誤，自己不能邀請自己
        - `1901602`：邀請關係有誤，邀請人和被邀請人不能互相綁定
        - `1901603`：該用戶已開戶，不能再綁定開戶邀請人
        - `1901604`：該用戶已入金，不能再綁定入金邀請人
      x-mint:
        href: /zh-HK/api-reference/whale_bind_invite_code
        metadata:
          sidebarTitle: 綁定指定階段的邀請碼
