                    type: string
                  data:
                    type: object
                    properties:
                      pass:
                        type: string
                        description: 是否通過 (驗證正確)
                    required:
                      - pass
                    description: 數據 (數據)
              example:
                code: 0
                message: success
                data:
                  pass: string
          description: 成功
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`
        "401":
