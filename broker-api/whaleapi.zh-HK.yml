components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "券商獲發的 ACCESS_TOKEN，通過 `Authorization: Bearer <token>` 發送。"
  schemas:
    BrokerGatewayErrorEnvelope:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          type: integer
        message:
          type: string
        data: {}
      description: Broker API Gateway 返回的錯誤響應結構。`code` 為業務錯誤碼，`message` 為錯誤信息，`data` 通常為空
security:
  - bearerAuth: []
