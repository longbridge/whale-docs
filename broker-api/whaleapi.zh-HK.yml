                        description: 是否還有更多數據
                      trades:
                        type: array
                        items:
                          type: object
                          properties:
                            order_id:
                              type: string
                              description: 訂單 ID
                            trade_id:
                              type: string
                              description: 成交 ID
                            quantity:
                              type: string
                              description: 成交數量
                            price:
                              type: string
                              description: 成交價格
                            trade_done_at:
                              type: string
                              description: 秒)
                            symbol:
                              type: string
                              description: 股票代碼，使用 ticker.region 格式
                            side:
                              type: object
                              properties: {}
                              description: 買賣方向
                          required:
