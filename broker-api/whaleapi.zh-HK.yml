      description: |-
        `group_id` 說明：

        - `2` — 資金變動（Asset Movement）
        - `6` — 交易變動（Order Status）
        - `7` — 運營活動（Activity Related）
        - `8` — 平台公告（Announcement）
        - `9` — 賬戶消息（Account Message）
        - `10` — 股價提醒（Price Movement）
        - `11` — 新股消息（IPO News）
        - `12` — 社區消息（Community）
        - `15` — 學堂（College）
        - `16` — 我的資訊（My News）
        - `17` — 今日看點（Today's Highlights）
        - `30` — 持倉日報（Holdings Daily）
        - `31` — 行情數據（Market Data）
        - `32` — 期權異動（Option Fluctuation）
        - `33` — 系統消息（System Message）
        - `34` — 海豚觀點（Dolphin Views）
        - `36` — 股票定投（Recurring Investments）
