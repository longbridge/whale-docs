  /funds/admin/toggle-fund:
    post:
      operationId: toggle_fund
      summary: Toggle Fund Visibility
      tags:
        - Fund Management
      x-permission-key:
        - fund.fund_product
      x-lbonly: false
      description: |-
        Shared by the public-fund and private-fund management lists. Use `type = fund` or `type = private`
        to distinguish them.

        ### Request parameters

        - Required: `option` (Show), `type` (Fund Type)
        - Optional: `counter_id` (Counter ID), `counter_ids` (Counter ID List), `audit_frontend_resource` (Audit Context)
        - See each field for its format, allowed values, default behavior, and business meaning.

        ### Result

        On success, the endpoint completes the described business operation. See the `200` response schema for returned data.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - option
                - type
              properties:
                counter_id:
                  type: string
                  description: Counter ID. Counter ID associated with this request.
                counter_ids:
                  type: array
                  description: Counter ID List. Submit Counter ID List as a JSON array.
                  items:
                    type: string
                option:
                  type: boolean
                  description: |-
                    Show. Boolean flag for show. this field is required.

                    **Boolean values:**
                    - `true` - The condition applies
                    - `false` - The condition does not apply
                type:
                  type: string
                  description: |-
                    Fund Type. Specifies Fund Type. This field is required.

                    **Allowed values:**
                    - `fund` - Public Fund
                    - `private` - Private Fund
                  enum:
                    - fund
                    - private
                audit_frontend_resource:
                  type: object
                  description: Audit Context. Provides audit context for this operation.
            example:
              counter_id: '123'
              option: true
              type: fund
      responses:
        '200':
          description: The request was processed successfully. The response `data` does not contain additional business fields.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
