openapi: 3.1.1
info:
  title: Longport Whale Broker API
  description: Institution-grade server-to-server API for brokers running on Longport Whale.
  version: 2.0.0
servers:
  - url: https://b-api.longbridge.xyz
    description: Test
  - url: https://b-api.lbkrs.com
    description: Production
security:
  - bearerAuth: []
tags:
  - name: Fund Management
paths:
  /portfolio/funds/batch/reject_saasorder:
    post:
      operationId: reject_saasorder
      summary: Batch Reject Fund Channel Order
      tags:
        - Fund Management
      x-permission-key:
        - fund.reject_order
      x-lbonly: false
      description: |-
        Batch-reject after selecting multiple rows in the client-order list; submitted after entering a rejection reason (client-visible) and an internal remark. Both reason and remark are serialized strings of a multilingual object {zh-CN, zh-HK, en}.

        ### Request parameters

        - Required: `ut_ids` (Order ID List), `reason` (Reject Reason (customer-facing)), `remark` (Internal Remark)
        - See each field for its format, allowed values, default behavior, and business meaning.

        ### Result

        On success, the endpoint completes the described business operation. See the `200` response schema for returned data.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - ut_ids
                - reason
                - remark
              properties:
                ut_ids:
                  type: array
                  description: Order ID List. The list of channel-order ids being batch-rejected; elements are strings, taken from the selected rows.
                  items:
                    type: string
                reason:
                  type: string
                  description: |-
                    Reject Reason (customer-facing). Rejection reason; a serialized string of a multilingual object {zh-CN, zh-HK, en} (can
                    be quickly chosen from a preset-remark library).
                remark:
                  type: string
                  description: Internal Remark. Internal remark; a serialized string of a multilingual object {zh-CN, zh-HK, en}, visible internally only.
            example:
              ut_ids:
                - '10086'
                - '10087'
              reason: '{"zh-CN":"渠道方拒绝","zh-HK":"渠道方拒絕","en":"Rejected by channel"}'
              remark: '{"zh-CN":"内部备注：额度不足","zh-HK":"內部備註：額度不足","en":"Internal note: insufficient quota"}'
      responses:
        '200':
          description: The request was processed successfully. The response `data` does not contain additional business fields.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      `0` indicates success. A non-zero value is a business error code, in which case
                      `data` is usually empty.

                      HTTP status codes use their standard semantics. A successful request normally
                      returns `200`; errors may return `400`, `401`, `403`, `408`, or another applicable
                      status. Interpret the HTTP status together with the business `code`.

                      - `401`: The user is not authenticated.
                      - `403`: The current account is not authorized to use this function. Grant access
                        through User Permission.
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: Bad request. Check the business error code in `code` and the error details in `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: The user is not authenticated, or the login session has expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: The current account is not authorized to use this feature. Grant the required permission to the account in User Permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: The request timed out. Check the business error code in `code` and the error details in `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
      x-mint:
        href: /en/api-reference/reject_saasorder
        metadata:
          sidebarTitle: Batch Reject Fund Channel Order
