      description: |-
        Submitted from the top "Create" / in-row "Edit" drawer on the Idle Cash page; create and edit reuse the same interface, differing only in whether an id is carried. Fields include topic_id, counter_id, and highlights (with an extra id when editing).

        ### Request parameters

        - Required: `topic_id` (Topic/Group ID), `counter_id` (Fund Counter ID), `highlights` (Selling Point (multi-locale))
        - Optional: `id` (Product ID), `audit_frontend_resource` (Audit Trace Info)
        - See each field for its format, allowed values, default behavior, and business meaning.

        ### Result

        On success, the endpoint completes the described business operation. See the `200` response schema for returned data.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - topic_id
                - counter_id
                - highlights
              properties:
                id:
                  type: string
                  description: |-
                    Product ID. The primary key of the idle-cash wealth-management product, passed only when editing
                    (record?.id); omitted when creating.
                topic_id:
                  type: number
                  description: |-
                    Topic/Group ID. Corresponds to Select Topic on the form. The numeric value comes from the
                    `fund_idle_money_product_topics` reference group.

                    Call `GET /v1/datasets/refs/idle_cash_product_topics` to retrieve the current data dictionary, and use the returned entry's `key` as this field's value.
                  x-value-source:
                    endpoint: GET /v1/datasets/refs/idle_cash_product_topics
                counter_id:
                  type: string
                  description: Fund Counter ID. Corresponds to the request field "Select Fund"; the fund counter_id selected via fund search.
                highlights:
                  type: string
                  description: |-
                    Selling Point (multi-locale). The multilingual "selling point" input in the form; serialized into a trilingual {en,
                    zh-CN, zh-HK} string before submission.
                audit_frontend_resource:
                  type: object
                  description: |-
                    Audit Trace Info. A caller-provided audit-tracking object containing $behavior (action description) and
                    $action (add/edit); on edit it additionally carries the original record fields.
            example:
              id: '1001'
              topic_id: 2
              counter_id: MMF001
