      summary: MMF Operation
      tags:
        - Fund Management
      x-permission-key:
        - cash_plus.mmf_fund
      x-lbonly: false
      description: |-
        Processes Operation.

        ### Request parameters

        - Required: `counter_id` (Fund Counter ID), `action` (Action), `audit_frontend_resource` (Audit Context)
        - See each field for its format, allowed values, and business meaning.

        ### Result

        On success, the endpoint completes the operation. See the `200` response schema for returned data and subsequent state information.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - counter_id
                - action
                - audit_frontend_resource
              properties:
                counter_id:
                  type: string
                  description: Fund Counter ID. The corresponding fund's counter_id, from the fund-search selection result.
                action:
                  type: string
                  description: |-
                    Action. Operation type: 0 = unpublish, 1 = publish, 9 = remove; the "Add" operation is also mapped to 1 (publish).

                    **Allowed values:**
                    - `0` - Offline
                    - `1` - Online
                    - `9` - Remove
                  enum:
                    - '0'
