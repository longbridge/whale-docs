                    **可選值：**

                    - `0` - 表示不隐藏

                    - `1` - 表示隐藏'
                  enum:
                  - 0
                  - 1
                  x-enum-details:
                  - value: 0
                    label: 不隐藏
                  - value: 1
                    label: 隐藏
