openapi: 3.1.1
info:
  title: Longport Whale 券商 API
  description: 面向使用 Longport Whale 的券商提供機構級服務端 API。
  version: 2.0.0
servers:
- url: https://b-api.longbridge.xyz
  description: 测试环境
- url: https://b-api.lbkrs.com
  description: 生产环境
security:
- bearerAuth: []
tags:
- name: 業務參數設置
paths:
  /v1/billing/myrates/markets:
    get:
      operationId: myrates_markets
      summary: 費率市場
      tags:
      - 業務參數設置
      x-permission-key:
      - billing.account_fee_info_manage
      x-lbonly: false
      description: '返回可用的費率展示市場／頁簽列表。


        這是「客户端展示」相關數據集 `tab` 過濾值的候選來源:數據集

        `booking_account_fee_info_items` / `booking_item_copywritings` 的 `tab` 取自本接口返回的

        `tabs[].tab`。候選值會動態變化，請以本接口實時返回為準。'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: 請求處理成功。`data.tabs` 為可用市場頁簽列表。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: '0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。


                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`

                      判斷具體結果。


                      - `401`：未登錄。

                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。'
                    x-enum-details:
                    - value: 0
                      label: 成功
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      tabs:
                        type: array
                        description: 可用市場頁簽列表。每項的 `tab` 即數據集 `tab` 過濾參數的取值。
                        items:
                          type: object
                          properties:
                            tab:
                              type: string
                              description: 頁簽／過濾值（市場代碼），如 `HK`、`US`、`US_OPTIONS`、`HAS`。
                            name:
                              type: string
                              description: 頁簽展示名，如 `HK`、`US Options`、`Crypto - HashKey`。
                            biz_type:
                              type: integer
                              description: 業務類型。例如 `1` 證券市場、`5` 美股期權、`9` 加密貨幣。
                            market:
                              type: string
                              description: 市場代碼。
              example:
                code: 0
                message: success
                data:
                  tabs:
                  - tab: HK
                    name: HK
                    biz_type: 1
                    market: HK
                  - tab: US
                    name: US
                    biz_type: 1
                    market: US
                  - tab: US_OPTIONS
                    name: US Options
                    biz_type: 5
                    market: US
                  - tab: HAS
                    name: Crypto - HashKey
                    biz_type: 9
                    market: HAS
        '400':
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登錄或登錄狀態已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 當前賬號未獲得該功能授權。請在 User Permission 中為該賬號開通相應權限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 請求處理超時。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
  /v1/billing/account_fee_info_item:
    post:
      operationId: account_fee_info_item_add
      summary: 新增客戶端收費展示項
      tags:
      - 業務參數設置
      x-permission-key:
      - billing.account_fee_info_manage
      x-lbonly: false
      description: '新增客戶端收費展示項。


        ### 請求參數


        - 必填：`tab`（業務線/市場 Tab）、`name`（名稱（多語言））、`conditions`（觸發條件列表）

        - 可選：`desc`（描述（多語言））

        - 各字段的格式、取值範圍和業務含義見對應字段說明。


        ### 處理結果


        成功時完成上述業務操作；後續狀態和返回數據以 `200` 響應定義為準。'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - tab
              - name
              - conditions
              properties:
                tab:
                  type: string
                  description: 業務線或市場標識。由調用方根據目標市場生成並隨請求提交。
                name:
                  type: object
                  description: 多語言名稱對象，key 為 zh-CN/zh-HK/en
                desc:
                  type: object
                  description: 多語言描述對象，key 為 zh-CN/zh-HK/en
                conditions:
                  type: array
                  description: |-
                    數組元素為 `{ field, value }` 對象。

                    - `field`：條件項 ID（費率條件字段），標識該條件針對的業務維度，例如 `'3'` 表示賬戶/櫃檯等條件。
                    - `value`：該條件項選中的取值數組（字符串）。
                  items:
                    type: string
            example:
              tab: hk_stock
              name:
                zh-CN: 示例名称
                zh-HK: 示例名稱
                en: Sample Name
              desc:
                zh-CN: 示例描述
                zh-HK: 示例描述
                en: Sample description
              conditions:
              - field: '3'
                value:
                - '1001'
      responses:
        '200':
          description: 請求處理成功。響應的 `data` 不包含額外業務字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: '0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。


                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`

                      判斷具體結果。


                      - `401`：未登錄。

                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。'
                    x-enum-details:
                    - value: 0
                      label: 成功
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登錄或登錄狀態已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 當前賬號未獲得該功能授權。請在 User Permission 中為該賬號開通相應權限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 請求處理超時。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
  /billing/org_package_ref:
    delete:
      operationId: org_package_ref_delete
      summary: 刪除機構套餐引用
      tags:
      - 業務參數設置
      x-permission-key:
      - lb_hk_charging.lb_hk_billing_org_package_ref_update
      x-lbonly: false
      description: '刪除機構套餐引用。


        ### 請求參數


        - 必填：`default_id`（記錄ID）

        - 可選：`audit_frontend_resource`（審計上下文）

        - 各字段的格式、取值範圍和業務含義見對應字段說明。


        ### 處理結果


        成功時完成上述業務操作；後續狀態和返回數據以 `200` 響應定義為準。'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - default_id
              properties:
                default_id:
                  type: string
                  description: 記錄ID，用於標識本次請求關聯的業務對象。此字段為必填項。
                audit_frontend_resource:
                  type: object
                  description: 調用方提交的審計上下文，用於記錄本次操作。
            example:
              default_id: '123'
              audit_frontend_resource: {}
      responses:
        '200':
          description: 請求處理成功。響應的 `data` 不包含額外業務字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: '0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。


                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`

                      判斷具體結果。


                      - `401`：未登錄。

                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。'
                    x-enum-details:
                    - value: 0
                      label: 成功
                  message:
                    type: string
                  data:
                    type: object
                    description: "成功時 `data` 為空對象。"
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登錄或登錄狀態已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 當前賬號未獲得該功能授權。請在 User Permission 中為該賬號開通相應權限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 請求處理超時。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
    get:
      operationId: org_package_ref_detail
      summary: 機構套餐詳情
      tags:
      - 業務參數設置
      x-permission-key:
      - lb_hk_charging.lb_hk_billing_org_package_ref_list
      x-lbonly: false
      description: '按機構 `org_id` 查找該機構的套餐引用配置詳情。


        ### 請求參數


        - 必填：`org_id`（機構 id），作為 query 參數傳遞。


        ### 處理結果


        成功時在 `data` 中返回該機構的套餐引用配置。


        > 說明：響應字段依據 `booking_org_package_refs` 數據集實體推導；測試環境暫無已配置機構，響應體未實調驗證，實際字段以接口返回為準。'
      security:
      - bearerAuth: []
      parameters:
      - name: org_id
        in: query
        required: true
        schema:
          type: string
        description: 機構 id。
        example: '3'
      responses:
        '200':
          description: 請求處理成功。`data` 為該機構的套餐引用配置。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: '0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。


                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`

                      判斷具體結果。


                      - `401`：未登錄。

                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。'
                    x-enum-details:
                    - value: 0
                      label: 成功
                  message:
                    type: string
                  data:
                    type: object
                    description: 機構套餐引用配置（字段依據數據集實體推導，未實調驗證）。
                    properties:
                      org_id:
                        type: string
                        description: 機構 id。
                      default_package_id:
                        type: string
                        description: 默認套餐 id。
                      cash_package_id:
                        type: string
                        description: 現金業務套餐 id。
                      bo_package_id:
                        type: string
                        description: BO 業務套餐 id。
                      financing_package_id:
                        type: string
                        description: 融資業務套餐 id。
                      personal_allow_item_ids:
                        type: array
                        items:
                          type: string
                        description: 該機構允許配置個性化收費的收費場景 id 列表。
                      names:
                        type: string
                        description: 關聯套餐名稱展示。
              example:
                code: 0
                message: success
                data:
                  type: object
                  properties:
                    default_package_id:
                      type: string
                    allow_package_ids:
                      type: array
                      items:
                        type: string
        '400':
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登錄或登錄狀態已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 當前賬號未獲得該功能授權。請在 User Permission 中為該賬號開通相應權限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 請求處理超時。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
    post:
      operationId: org_package_ref_add
      summary: 新增機構套餐引用
      tags:
      - 業務參數設置
      x-permission-key:
      - lb_hk_charging.lb_hk_billing_org_package_ref_update
      x-lbonly: false
      description: '新增機構套餐引用。


        ### 請求參數


        - 必填：`org_id`（機構ID）、`default_package_id`（默認套餐ID）

        - 可選：`cash_package_id`（資金套餐ID）、`financing_package_id`（融資套餐ID）、`bo_package_id`（BO 套餐ID）、`allow_package_ids`（允許套餐ID列表）、`personal_allow_item_ids`（允許個性化收費項ID列表）

        - 各字段的格式、取值範圍和業務含義見對應字段說明。


        ### 處理結果


        成功時完成上述業務操作；後續狀態和返回數據以 `200` 響應定義為準。'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - org_id
              - default_package_id
              properties:
                org_id:
                  type: string
                  description: '機構ID，用於標識本次請求關聯的業務對象。此字段為必填項。


                    候選值來自 `GET /v1/datasets/refs/member_organizations` 返回的機構列表，使用返回項的 `key` 作為本字段值。'
                  x-value-source:
                    endpoint: GET /v1/datasets/refs/member_organizations
                default_package_id:
                  type: string
                  description: '默認套餐ID，用於標識本次請求關聯的業務對象。此字段為必填項。


                    候選值來自 `GET /v1/datasets/refs/billing_packages` 返回的收費套餐(客户組)列表，使用返回項的 `key` 作為本字段值。'
                  x-value-source:
                    endpoint: GET /v1/datasets/refs/billing_packages
                cash_package_id:
                  type: string
                  description: '資金套餐ID，用於標識本次請求關聯的業務對象。


                    候選值來自 `GET /v1/datasets/refs/billing_packages` 返回的收費套餐(客户組)列表，使用返回項的 `key` 作為本字段值。'
                  x-value-source:
                    endpoint: GET /v1/datasets/refs/billing_packages
                financing_package_id:
                  type: string
                  description: '融資套餐ID，用於標識本次請求關聯的業務對象。


                    候選值來自 `GET /v1/datasets/refs/billing_packages` 返回的收費套餐(客户組)列表，使用返回項的 `key` 作為本字段值。'
                  x-value-source:
                    endpoint: GET /v1/datasets/refs/billing_packages
                bo_package_id:
                  type: string
                  description: 'BO 套餐ID，用於標識本次請求關聯的業務對象。


                    候選值來自 `GET /v1/datasets/refs/billing_packages` 返回的收費套餐(客户組)列表，使用返回項的 `key` 作為本字段值。'
                  x-value-source:
                    endpoint: GET /v1/datasets/refs/billing_packages
                allow_package_ids:
                  type: array
                  description: '允許套餐ID列表，以 JSON 數組形式提交。


                    候選值來自 `GET /v1/datasets/refs/billing_packages` 返回的收費套餐(客户組)列表，使用返回項的 `key` 作為本字段值。'
                  items:
                    type: string
                  x-value-source:
                    endpoint: GET /v1/datasets/refs/billing_packages
                personal_allow_item_ids:
                  type: array
                  description: 允許個性化收費項ID列表，以 JSON 數組形式提交。
                  items:
                    type: string
            example:
              org_id: ''
              default_package_id: ''
              cash_package_id: ''
              financing_package_id: ''
              bo_package_id: ''
              allow_package_ids: []
              personal_allow_item_ids: []
      responses:
        '200':
          description: 請求處理成功。響應的 `data` 不包含額外業務字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: '0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。


                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`

                      判斷具體結果。


                      - `401`：未登錄。

                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。'
                    x-enum-details:
                    - value: 0
                      label: 成功
                  message:
                    type: string
                  data:
                    type: object
                    description: "成功時 `data` 為空對象。"
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登錄或登錄狀態已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 當前賬號未獲得該功能授權。請在 User Permission 中為該賬號開通相應權限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 請求處理超時。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
    put:
      operationId: org_package_ref_edit
      summary: 編輯機構套餐引用
      tags:
      - 業務參數設置
