                        `key` 作為本參數值。'
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/billing_business_type_code
                    state:
                      type: string
                      description: '用於按「狀態」篩選結果。


                        **可選值：**

                        - `0` - 表示已生效

                        - `1` - 表示未生效'
