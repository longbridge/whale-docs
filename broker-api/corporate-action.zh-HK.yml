    post:
      operationId: corp_action_post_adjust_detail_announcements_download
      summary: 執行後調整 - 詳情頁表頭預告信息導出
      tags:
      - 公司行动 (Corporate Action)
      x-permission-key:
      - corporate.after_event_adjustment_query
      x-lbonly: false
      description: |-
        將「執行後調整 - 詳情頁表頭預告信息」數據導出為文件。`filters` 決定導出範圍，`down_fields` 可限制導出字段。

        ### 導出模式

        - `mode: 0`：同步導出，成功後直接返回下載地址。
        - `mode: 1`：異步導出，先返回 `file_download_id`；隨後調用 `GET /v1/datasets/download/<built-in function id>` 獲取下載地址。
        - 不再需要導出記錄時，可調用 `DELETE /v1/datasets/download/<built-in function id>` 刪除。
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 字段同 corp_action_post_adjust_detail_announcements.yaml（query 能力）裏的 filters
                  properties:
                    id:
                      type: string
                      description: 用於按「預告 ID」篩選結果。
                    ann_id:
                      type: string
                      description: 用於按「ann_id」篩選結果。
                mode:
                  type: integer
                  default: 0
                  description: |-
                    不傳時默認 0（同步）

                    **可選值：**

                    - `0` - 表示同步

                    - `1` - 表示异步
                  enum:
                  - 0
                  - 1
                  x-enum-details:
                  - value: 0
                    label: 同步
                  - value: 1
                    label: 异步
                ext:
                  type: string
                  description: |-
                    下載文件格式。不傳時默認為 `csv`。

                    **可選值：**

                    - `csv` - 表示 CSV

                    - `xlsx` - 表示 Excel
                  enum:
                  - csv
                  - xlsx
                file_name:
                  type: string
                  description: 導出文件名稱。不傳時由服務端生成。
                remark:
                  type: string
                  description: 與本次操作一並保存的備註。
                down_fields:
                  type: array
                  description: 不傳時導出全部字段；取值範圍見 items.enum（同查詢接口 data.list.items 的字段列表）
                  items:
                    type: string
                    enum:
                    - ca_code
                    - ann_type
                    - ann_type_val
                    - origin_counter_id
                    - record_date
                    - payable_date
                    - remark
                    - total_quantity
                    - headcount
                ticket_content:
                  type: string
                  description: 模板配置了下載審核工單時，供審批人查看
                ticket_preview_url:
                  type: string
                  description: 導出審批詳情地址；僅在導出需要審批時使用。
                hide:
                  type: integer
                  description: |-
                    是否在下載記錄列表中隱藏本次導出記錄。

                    **可選值：**

                    - `0` - 表示不隐藏

                    - `1` - 表示隐藏
                  enum:
                  - 0
                  - 1
                  x-enum-details:
                  - value: 0
                    label: 不隐藏
                  - value: 1
                    label: 隐藏
            example:
              filters: {}
              mode: 0
              ext: csv
              file_name: ''
              remark: ''
              down_fields: []
              ticket_content: ''
              ticket_preview_url: ''
              hide: 0
