openapi: 3.1.1
info:
  title: Whale OpenAPI (whale-openapi-docs 自动生成)
  version: 1.0.0
servers:
- url: https://b-api.longbridge.xyz
  description: 测试环境
- url: https://b-api.lbkrs.com
  description: 生产环境
security:
- bearerAuth: []
tags:
- name: 公司行动 (Corporate Action)
  description: 公司行動、事後調整、費用管理、美股期權企業行動等相關的後台管理接口。
paths:
  /v1/datasets/corp_action_post_adjust_announcements:
    post:
      operationId: corp_action_post_adjust_announcements
      summary: 執行後調整 - 預告列表
      tags:
      - 公司行动 (Corporate Action)
      x-permission-key:
      - corporate.after_event_adjustment_query
      x-lbonly: false
      description: '查詢「執行後調整 - 預告列表」數據，可通過 `filters` 組合業務篩選條件，並使用 `page`、`page_size` 控制分頁。


        ### 返回結果


        成功時返回匹配的記錄列表及分頁信息。各過濾字段的用途、可選值和動態數據來源見對應字段說明。'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 組合業務過濾條件。省略某個過濾字段時，不按該字段篩選。
                  properties:
                    ca_code:
                      type: string
                      description: 用於按「預告編號」篩選結果。
                page:
                  type: integer
                  description: 要查詢的頁碼，從 `1` 開始。
                page_size:
                  type: integer
                  description: 每頁返回的記錄數量。
            example:
              filters: {}
              page: 1
              page_size: 20
      responses:
        '200':
          description: 成功時分頁返回「執行後調整 - 預告列表」記錄，以及頁碼、每頁數量和總記錄數等分頁信息。
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - data
                properties:
                  code:
                    type: integer
                    description: '0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。


                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code` 判斷具體結果。


                      - `401`：未登錄。

                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。'
                    x-enum-details:
                    - value: 0
                      label: 成功
                  message:
                    type: string
                  data:
                    type: object
                    required:
                    - list
                    - total
                    properties:
                      list:
                        type: array
                        description: '**返回值：** 列表列表。'
                        items:
                          type: object
                          properties:
                            ca_code:
                              type: string
                              description: '**返回值：** 預告編號。'
                            ann_type:
                              type: string
                              description: '**返回值：** 預告類型。'
                            ann_type_val:
                              type: string
                              description: 字段 ann_type 的原始值：ann_type 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            origin_counter_id:
                              type: string
                              description: '**返回值：** 標的。'
                            record_date:
                              type: string
                              description: '**返回值：** 登記日期；時間或日期格式以接口實際返回值為準。'
                            payable_date:
                              type: string
                              description: '**返回值：** 支付日期；時間或日期格式以接口實際返回值為準。'
                            remark:
                              type: string
                              description: '**返回值：** 備註。'
                            adjust_count:
                              type: string
                              description: '**返回值：** 調整次數。'
                      total:
                        type: integer
                        description: '**返回值：** 符合查詢條件的記錄總數，用於計算分頁。'
              example:
                code: 0
                message: success
                data:
                  list:
                  - ca_code: AT_BE_20260529094941_530578
                    ann_type: BE
                    ann_type_val: '4'
                    origin_counter_id: ST/US/QCOM
                    record_date: '20260518'
                    payable_date: '20260527'
                    remark: Ann Remark 111059
                    adjust_count: '3'
                  total: 0
        '400':
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登錄或登錄狀態已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 當前賬號未獲得該功能授權。請在 User Permission 中為該賬號開通相應權限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 請求處理超時。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
