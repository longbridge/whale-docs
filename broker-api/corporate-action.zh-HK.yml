  /corporate_action/refund_by_view:
    post:
      operationId: refund_by_view
      summary: 公司行動 - 按子倉視圖分組發起退稅
      tags:
      - 公司行动 (Corporate Action)
      x-permission-key:
      - lb_hk_corporate.corporate_query
      x-lbonly: false
      description: '在退稅流程中，按所選子倉視圖的分組維度發起退稅。


        當調用方選擇了某個子倉視圖後，退稅金額按該視圖下的各分組分別填寫並提交；每個分組給出退稅金額及其覆蓋的子倉賬號範圍。


        ### 請求參數


        - 必填：`ann_id`（企業行動預告 ID）、`view_id`（子倉視圖 ID）、`groups`（退稅分組列表）

        - `groups` 中每一項需給出 `group_id`（分組 ID）、`amount`（退稅金額）和 `sub_position_scope`（該分組覆蓋的子倉賬號範圍）

        - 可選：`audit_frontend_resource`（調用方提供的審計上下文）


        ### 處理結果


        成功時發起退稅並返回結果，業務結果位於 `data`；請結合業務 `code` 判斷是否成功。'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - ann_id
              - view_id
              - groups
              properties:
                ann_id:
                  type: string
                  description: 企業行動預告 ID，指定要發起退稅的企業行動。
                view_id:
                  type: string
                  description: 子倉視圖 ID，取值來自「查詢退稅場景下可用的子倉視圖列表」返回的視圖標識。
                groups:
                  type: array
                  description: 退稅分組列表。每一項對應所選視圖下的一個分組，分別給出退稅金額及其覆蓋的子倉賬號範圍。
                  items:
                    type: object
                    required:
                    - group_id
                    - amount
                    - sub_position_scope
                    properties:
                      group_id:
                        type: string
                        description: 分組 ID。
                      group_name:
                        type: string
                        description: 分組名稱，調用方提供的分組展示名，不傳時不影響退稅處理。
                      amount:
                        type: string
                        description: 該分組的退稅金額。以字符串形式傳遞金額數值。
                      sub_position_scope:
                        type: array
                        items:
                          type: string
                        description: 該分組覆蓋的子倉賬號範圍，為子倉賬號（`counterpart_account`）列表。
                audit_frontend_resource:
                  type: object
                  description: 調用方提供的審計上下文，用於記錄本次操作涉及的標的與預告編號等信息，不傳時不附加審計信息。
            example:
              ann_id: '117456'
              view_id: '3021'
              groups:
              - group_id: g-1
                group_name: 示例分组
                amount: '1000.00'
                sub_position_scope:
                - ACC001
                - ACC002
              audit_frontend_resource:
                counterIDs:
                - ETF/US/DIPS
                caCodes:
                - 0882902308
      responses:
        '200':
          description: 請求處理成功。業務結果位於 `data`；`data` 的具體字段以接口實際返回為準。
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - data
                properties:
                  code:
                    type: integer
                    description: '0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。


                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code` 判斷具體結果。


                      - `401`：未登錄。

                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。'
                    x-enum-details:
                    - value: 0
                      label: 成功
                  message:
                    type: string
                  data:
                    type: object
                    description: 退稅發起結果，具體字段以接口實際返回為準。
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登錄或登錄狀態已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 當前賬號未獲得該功能授權。請在 User Permission 中為該賬號開通相應權限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 請求處理超時。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
