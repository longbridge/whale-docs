                  description: 投票指令列表。數組長度必須等於服務端返回的預案數量，且各項的 `chosen_proxy_serial` 不可重複。
                  items:
                    type: object
                    required:
                    - chosen_proxy_serial
                    - vote
                    properties:
                      chosen_proxy_serial:
                        type: string
                        description: 預案編號，對應「獲取單個股東大會的預案列表」返回的 `proxy_serial`。
                        example: P001
                      vote:
                        type: integer
                        description: 針對該預案的表決。
                        enum:
                        - 0
                        - 1
                        - 2
                        - 3
                        example: 1
                        x-enum-details:
                        - value: 0
                          label: 未指定
                        - value: 1
                          label: 贊成
                        - value: 2
                          label: 反對
                        - value: 3
                          label: 棄權
                attendee_info:
                  type: object
                  description: 出席人信息。僅當 `attend_type` 為 `1`（委託投票）或 `2`（本人出席）時生效，否則服務端不讀取以下字段；字段值只能包含英文字母和標點。
                  properties:
                    attend_type:
                      type: integer
                      description: 參與股東大會的方式。
                      enum:
                      - 0
                      - 1
                      - 2
                      - 3
                      example: 1
                      x-enum-details:
                      - value: 0
                        label: 未指定
                      - value: 1
                        label: 委託投票
                      - value: 2
                        label: 本人出席
                      - value: 3
                        label: 委託出席
                    attendee_name:
                      type: string
                      description: 出席人姓名。
                      example: John Doe
                    attendee_identification_number:
                      type: string
                      description: 出席人證件號。
                      example: A1234567
                    attendee_address:
                      type: string
                      description: 出席人地址。
                      example: Central, Hong Kong
                    attendee_gender:
                      type: string
                      description: 出席人性別。
                      example: M
            example:
              ann_id: '12345'
              aaid: 67890
              voting_infos:
