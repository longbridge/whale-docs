            schema:
              type: object
              required:
              - ann_id
              - aaid
              properties:
                ann_id:
                  type: integer
                  description: 企業行動 ID，標識目標股東大會（Voting）企業行動。
                  example: 12345
                aaid:
                  type: integer
                  description: 賬戶 ID，標識要查詢投票詳情的目標客戶賬戶。
                  example: 67890
            example:
              ann_id: 12345
              aaid: 67890
      responses:
        '200':
          description: 請求處理成功。業務結果位於 `data`，包含該客戶的出席信息與逐項投票指令。
