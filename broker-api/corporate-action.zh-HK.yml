        ### 請求參數


        - 必填：`ann_id`（企業行動 ID）、`aaid`（賬戶 ID）

        - 兩個參數共同定位目標客戶與股東大會。


        ### 返回結果


        成功時返回該客戶的出席信息（`attendee_info`）與逐項投票指令（`voting_infos`）。'
