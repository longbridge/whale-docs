  /v1/datasets/corp_action_member_fee_events/download:
    post:
      operationId: corp_action_member_fee_events_download
      summary: 客戶收費規則列表導出
      tags:
      - 公司行动 (Corporate Action)
      x-permission-key:
      - lb_hk_corporate.corporate_query
      x-lbonly: false
      description: '將「客戶收費規則列表」數據導出為文件。`filters` 決定導出範圍，`down_fields` 可限制導出字段。


        ### 導出模式


        - `mode: 0`：同步導出，成功後直接返回下載地址。

        - `mode: 1`：異步導出，先返回 `file_download_id`；隨後調用 `GET /v1/datasets/download/{id}` 獲取下載地址。

        - 不再需要導出記錄時，可調用 `DELETE /v1/datasets/download/{id}` 刪除。'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 字段同 corp_action_member_fee_events.yaml（query 能力）裏的 filters
                  properties:
                    aaid:
                      type: string
                      description: 用於按「客戶」篩選結果。
                mode:
                  type: integer
                  default: 0
                  description: '不傳時默認 0（同步）


                    **可選值：**

                    - `0` - 表示同步

                    - `1` - 表示异步'
                  enum:
                  - 0
                  - 1
                  x-enum-details:
                  - value: 0
                    label: 同步
                  - value: 1
                    label: 异步
                ext:
                  type: string
                  description: '下載文件格式。不傳時默認為 `csv`。


                    **可選值：**

                    - `csv` - 表示 CSV

                    - `xlsx` - 表示 Excel'
                  enum:
                  - csv
                  - xlsx
                file_name:
                  type: string
                  description: 導出文件名稱。不傳時由服務端生成。
                remark:
                  type: string
                  description: 與本次操作一並保存的備註。
                down_fields:
                  type: array
                  description: 不傳時導出全部字段；取值範圍見 items.enum（同查詢接口 data.list.items 的字段列表）
                  items:
                    type: string
                    enum:
                    - id
                    - member_id
                    - origin_id
                    - real_name
                    - fee_code
                    - fee_code_val
                    - ref_value_ratio
                    - min_value_ratio
                    - updated_by
                    - updated_at
                ticket_content:
                  type: string
                  description: 模板配置了下載審核工單時，供審批人查看
                ticket_preview_url:
                  type: string
                  description: 導出審批詳情地址；僅在導出需要審批時使用。
