      description: '代客戶新增、修改或刪除某個股東大會（Voting）企業行動下的投票指令與出席信息。


        ### 請求參數


        - 必填：`ann_id`（企業行動 ID）、`aaid`（賬戶 ID）、`voting_infos`（投票指令列表）

        - 可選：`attendee_info`（出席人信息）

        - `voting_infos` 的長度必須等於服務端返回的預案數量，且各項的 `chosen_proxy_serial` 不可重複。

        - `attendee_info` 僅當 `attend_type` 為 `1`（委託投票）或 `2`（本人出席）時生效，字段值只能包含英文字母和標點。


        ### 處理結果


        成功時完成投票指令的增刪改，業務結果位於 `data`；請結合業務 `code` 判斷是否成功。'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - ann_id
              - aaid
              - voting_infos
              properties:
                ann_id:
                  type: string
                  description: 企業行動 ID，標識目標股東大會（Voting）企業行動。
                  example: '12345'
