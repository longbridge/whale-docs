                      - `401`：未登錄。

                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。'
                    x-enum-details:
                    - value: 0
                      label: 成功
                  message:
                    type: string
                  data:
                    type: string
                    description: 增刪改操作的結果。
              example:
                code: 0
                message: success
                data: ''
        '400':
