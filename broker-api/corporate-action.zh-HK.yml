                    - value: 0
                      label: 成功
                  message:
                    type: string
                  data:
                    type: object
                    required:
                    - attendee_info
                    - voting_infos
                    properties:
                      attendee_info:
                        type: object
                        description: 出席人信息。
                        properties:
                          attend_type:
                            type: integer
                            description: 參與股東大會的方式。
                            enum:
                            - 0
                            - 1
                            - 2
                            - 3
                            x-enum-details:
                            - value: 0
                              label: 未指定
                            - value: 1
                              label: 委託投票
                            - value: 2
                              label: 本人出席
                            - value: 3
