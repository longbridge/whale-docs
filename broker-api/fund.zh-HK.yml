  /funds/admin/edit-fund-file:
    post:
      operationId: edit_fund_file
      summary: 編輯基金文件
      tags:
        - 基金管理
      x-permission-key:
        - fund.fund_file_update
      x-lbonly: false
      description: |-
        編輯基金文件。

        ### 請求參數

        - 必填：`id`（基金文件ID）、`name_locales`（文件展示名稱（多語言））、`link_locales`（文件鏈接（多語言））、`scenarioes`（使用場景）
        - 可選：`file_name_locales`（文件原始文件名（多語言））、`remark`（文件描述/備註）、`user_group_ids`（適用用戶分組）、`audit_frontend_resource`（審計调用方資源快照）
        - 各字段的格式、取值範圍和業務含義見對應字段說明。

        ### 處理結果

        成功時完成上述業務操作；後續狀態和返回數據以 `200` 響應定義為準。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
                - name_locales
                - link_locales
                - scenarioes
              properties:
                id:
                  type: string
                  description: 基金文件ID. 基金文件ID，用於標識本次請求關聯的業務對象。此字段為必填項。
                name_locales:
                  type: string
                  description: 文件展示名稱（多語言）. JSON 字符串，key 為語言（zh-CN/zh-HK/en），value 為對應語言的展示名稱
                link_locales:
                  type: string
                  description: 文件鏈接（多語言）. JSON 字符串，各語言環境下上傳文件的 key 與名稱，經編碼後提交
                file_name_locales:
                  type: string
                  description: 文件原始文件名（多語言）. JSON 字符串，各語言對應的原始上傳文件名
                remark:
                  type: string
                  description: 文件描述/備註. 隨本次操作保存的文件描述/備註。
                scenarioes:
                  type: string
                  description: 使用場景. 多選，提交時為選中枚舉值數組。
                  enum:
                    - popup_fund_details_subscription
                    - popup_aip_submit
                    - inline_fund_order_subscription
                    - inline_fund_order_redemption
                    - inline_fund_details_profile
                    - inline_private_fund_details_fundamental_information
                user_group_ids:
                  type: string
                  description: 適用用戶分組. 選擇的用戶分組 ID 列表
                audit_frontend_resource:
                  type: object
                  description: 審計上下文. 審計留痕對象，包含操作類型、編輯後內容及編輯前快照，供後台審計使用，非用戶直接填寫的業務字段
            example:
              id: '1001'
              name_locales: '{"zh-CN":"基金文件名称","zh-HK":"基金文件名稱","en":"Fund File Name"}'
              link_locales: '{"zh-CN":[{"uploadKey":"xxx.pdf","name":"基金文件.pdf"}]}'
              file_name_locales: '{"zh-CN":"基金文件.pdf"}'
              remark: 文件说明
              scenarioes:
                - '1'
              user_group_ids:
                - '1001'
              audit_frontend_resource:
                $action: edit
                service: form.service
      responses:
        '200':
          description: 請求處理成功。響應的 `data` 不包含額外業務字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。

                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`
                      判斷具體結果。

                      - `401`：未登錄。
                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登錄或登錄狀態已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 當前賬號未獲得該功能授權。請在 User Permission 中為該賬號開通相應權限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 請求處理超時。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
