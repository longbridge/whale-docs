                      - `401`：未登錄。
                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      failed_ids:
                        type: array
                        description: 處理失敗的訂單 ID 列表. 批量操作中處理失敗的渠道訂單 ID 列表。
                        items:
                          type: integer
              example:
                code: 0
                message: success
                data:
                  failed_ids: []
        '400':
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
