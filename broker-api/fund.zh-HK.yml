openapi: 3.1.1
info:
  title: Longport Whale 券商 API
  description: 面向使用 Longport Whale 的券商提供機構級服務端 API。
  version: 2.0.0
servers:
  - url: https://b-api.longbridge.xyz
    description: 測試環境
  - url: https://b-api.lbkrs.com
    description: 生產環境
security:
  - bearerAuth: []
tags:
  - name: 基金管理
paths:
  /portfolio/funds/batch/reject_saasorder:
    post:
      operationId: reject_saasorder
      summary: 批量拒絕基金渠道訂單
      tags:
        - 基金管理
      x-permission-key:
        - fund.reject_order
      x-lbonly: false
      description: |-
        客戶訂單列表勾選多行後批量拒絕，填寫拒絕理由（客戶可見）與內部備註後提交。reason/remark 均為多語言對象 {zh-CN, zh-HK, en} 序列化後的字符串。

        ### 請求參數

        - 必填：`ut_ids`（訂單ID列表）、`reason`（拒絕理由（客戶可見））、`remark`（內部備註）
        - 各字段的格式、取值範圍、默認行為和業務含義見對應字段說明。

        ### 處理結果

        成功時完成所述業務操作，具體返回內容見 `200` 響應定義。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - ut_ids
                - reason
                - remark
              properties:
                ut_ids:
                  type: array
                  description: 訂單ID列表. 被批量拒絕的渠道訂單 id 列表，元素為 string，取自勾選行
                  items:
                    type: string
                reason:
                  type: string
                  description: 拒絕理由（客戶可見）. 拒絕理由，多語言對象 {zh-CN, zh-HK, en} 序列化後的字符串（可從預設備註庫快捷選擇）
                remark:
                  type: string
                  description: 內部備註. 內部備註，多語言對象 {zh-CN, zh-HK, en} 序列化後的字符串，僅內部可見
            example:
              ut_ids:
                - '10086'
                - '10087'
              reason: '{"zh-CN":"渠道方拒绝","zh-HK":"渠道方拒絕","en":"Rejected by channel"}'
              remark: '{"zh-CN":"内部备注：额度不足","zh-HK":"內部備註：額度不足","en":"Internal note: insufficient quota"}'
      responses:
        '200':
          description: 請求處理成功。響應的 `data` 不包含額外業務字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。

                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`
                      判斷具體結果。

                      - `401`：未登錄。
                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登錄或登錄狀態已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 當前賬號未獲得該功能授權。請在 User Permission 中為該賬號開通相應權限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 請求處理超時。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
      x-mint:
        href: /zh-HK/api-reference/reject_saasorder
        metadata:
          sidebarTitle: 批量拒絕基金渠道訂單
