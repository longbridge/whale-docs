        批量拒絕渠道訂單。

        ### 請求參數

        - 必填：`channel_order_ids`（渠道訂單 ID 列表）
        - 可選：`reason`（拒絕原因）、`remark`（備註）
        - 各字段的格式、取值範圍和業務含義見對應字段説明。

        ### 處理結果

        返回批量操作中處理失敗的渠道訂單 ID 列表。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - channel_order_ids
              properties:
                channel_order_ids:
                  type: array
                  description: 渠道訂單 ID 列表. 用於指定「渠道訂單 ID 列表」。此字段為必填項。
                  items:
                    type: integer
                reason:
                  type: string
                  description: 拒絕原因. 用於指定「拒絕原因」。
                remark:
                  type: string
                  description: 備註. 用於指定「備註」。
            example:
              channel_order_ids: []
              reason: ''
              remark: ''
      responses:
        '200':
          description: 請求處理成功。`data.failed_ids` 為批量操作中處理失敗的渠道訂單 ID 列表。
