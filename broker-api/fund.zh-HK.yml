        返回本次調整記錄 ID。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - channel_holding_id
                - calibrated_shares
              properties:
                channel_holding_id:
                  type: integer
                  description: 渠道持倉 ID. 用於指定「渠道持倉 ID」。此字段為必填項。
                counter_id:
                  type: string
                  description: 基金代碼. 用於指定「基金代碼」。
                calibrated_shares:
                  type: string
                  description: 校準目標份額. 用於指定「校準目標份額」。此字段為必填項。
                ledger_date:
                  type: integer
                  description: 賬務日期. 賬務日期，格式 `YYYYMMDD`。
                reason:
                  type: string
                  description: 校準原因. 用於指定「校準原因」。
                attachments:
                  type: array
                  description: 校準憑證. 用於指定「校準憑證」。
                  items:
                    type: object
                    properties:
                      file_key:
                        type: string
                        description: 文件 Key. 用於指定「文件 Key」。
                      file_name:
                        type: string
                        description: 文件名. 用於指定「文件名」。
                current_shares:
                  type: string
                  description: 當前份額. 用於指定「當前份額」。
                audit_frontend_resource:
                  type: object
                  description: 審計上下文. 調用方提交的審計上下文，用於記錄本次操作。
            example:
              channel_holding_id: 0
