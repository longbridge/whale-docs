  /admin/funds/save_idle_money_product:
    post:
      operationId: save_idle_money_product
      summary: 新建/編輯閒錢理財產品
      tags:
        - 基金管理
      x-permission-key:
        - fund.idle_money
      x-lbonly: false
      description: |-
        閒錢理財 (Idle Cash) 頂部「新建」/行內「編輯」抽屜提交請求，新建和編輯複用同一接口，區別僅在於是否攜帶 id。字段包含 topic_id、counter_id、highlights（編輯時額外帶 id）。

        ### 請求參數

        - 必填：`topic_id`（所屬專題/分組ID）、`counter_id`（基金代碼）、`highlights`（賣點文案（多語言））
        - 可選：`id`（產品ID）、`audit_frontend_resource`（審計追溯信息）
        - 各字段的格式、取值範圍、默認行為和業務含義見對應字段說明。

        ### 處理結果

        成功時完成所述業務操作，具體返回內容見 `200` 響應定義。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - topic_id
                - counter_id
                - highlights
              properties:
                id:
                  type: string
                  description: 產品ID. 閒錢理財產品主鍵，僅編輯時傳入（record?.id），新建時不傳。
                topic_id:
                  type: number
                  description: |-
                    所屬專題/分組ID. 對應請求「選擇專題」字段，來自 ref-group fund_idle_money_product_topics 選項，Number。

                    請調用 `GET /v1/datasets/refs/idle_cash_product_topics` 獲取當前可用的數據字典，並使用返回項的 `key` 作為本字段值。
                  x-value-source:
                    endpoint: GET /v1/datasets/refs/idle_cash_product_topics
                counter_id:
                  type: string
                  description: 基金代碼. 對應請求「選擇基金」，通過搜索基金選中的基金 counter_id。
                highlights:
                  type: string
                  description: 賣點文案（多語言）. 對應請求「賣點」多語言輸入框，提交前序列化為 {en, zh-CN, zh-HK} 三語言字符串。
                audit_frontend_resource:
                  type: object
                  description: 審計追溯信息. 调用方審計埋點對象，包含 $behavior（操作描述）、$action（add/edit），編輯時額外攜帶原始 record 字段。
            example:
              id: '1001'
              topic_id: 2
              counter_id: MMF001
              highlights: '{"en":"Low risk, stable return","zh-CN":"低风险，收益稳健","zh-HK":"低風險，收益穩健"}'
              audit_frontend_resource:
                $behavior: 编辑闲钱理财产品
                $action: edit
      responses:
        '200':
          description: 請求處理成功。響應的 `data` 不包含額外業務字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。

                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`
