      summary: 渠道持倉手動調整
      tags:
        - 基金管理
      x-permission-key:
        - fund.fund_positions_query
      x-lbonly: false
      description: |-
        渠道持倉手動調整。

        ### 請求參數

        - 必填：`channel_holding_id`（渠道持倉 ID）、`calibrated_shares`（校準目標份額）
        - 可選：`counter_id`（基金代碼）、`ledger_date`（賬務日期）、`reason`（校準原因）、`attachments`（校準憑證）、`current_shares`（當前份額）、`audit_frontend_resource`（審計上下文）
        - 各字段的格式、取值範圍和業務含義見對應字段説明。

