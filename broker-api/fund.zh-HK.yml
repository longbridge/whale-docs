  /v1/datasets/fund_saas_orders:
    get:
      operationId: fund_saas_orders
      summary: 基金 saas 訂單
      tags:
        - 基金管理
      x-permission-key:
        - fund.ut_order
      x-lbonly: false
      description: |-
        查詢「基金 saas 訂單」數據，可通過 `filters` 組合業務篩選條件，並使用 `page`、`page_size` 和 `orderBy` 控制分頁與排序。

        ### 返回結果

        成功時返回匹配的記錄列表及分頁信息。各過濾字段的用途、可選值和動態數據來源見對應字段說明。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 過濾條件. 組合業務過濾條件。省略某個過濾字段時，不按該字段篩選。
                  properties:
                    member_id:
                      type: string
                      description: 客戶編號. 用於按「客戶編號」篩選結果。
                    origin_id:
                      type: string
                      description: 證券賬號. 用於按「證券賬號」篩選結果。
                    counter_id:
                      type: string
                      description: 基金代碼. 用於按「基金代碼」篩選結果。
                    id:
                      type: string
                      description: 訂單編號. 用於按「訂單編號」篩選結果。
                    created_at:
                      type: object
                      description: 下單時間. 用於按「下單時間」篩選結果。
                      properties:
                        gte:
                          type: string
                          description: 大於等於. 篩選範圍的下限，匹配值包含該值。
                          format: date
                        lte:
                          type: string
                          description: 小於等於. 篩選範圍的上限，匹配值包含該值。
                          format: date
                    extend_info:
                      type: string
                      description: |-
                        生成類型. 用於按「生成類型」篩選結果。

                        **可選值：**
                        - `true` - 表示自動訂單
                        - `false` - 表示手動訂單
                      enum:
                        - 'true'
                        - 'false'
                    state:
                      type: string
                      description: |-
                        訂單狀態. 用於按「訂單狀態」篩選結果。

                        **可選值：**
                        - `Init` - 表示初始態
                        - `Cutoff` - 表示已日切
                        - `Submitted` - 表示已提交
                        - `FundsSettled` - 表示贖回貨交收
                        - `Done` - 表示已完成
                        - `Canceled` - 表示已撤單
                        - `Confirmed` - 表示已確認
                        - `Rejected` - 表示拒單
                      enum:
                        - Init
                        - Cutoff
                        - Submitted
                        - FundsSettled
                        - Done
                        - Canceled
                        - Confirmed
                        - Rejected
                    trade_source:
                      type: string
                      description: |-
                        訂單來源. 用於按「訂單來源」篩選結果。

                        **可選值：** `Normal`（普通訂單）、`Admin`（後台下單）、`OB`（OB 訂單）、`WTT`、`AIP`（定投）、`ATM`（ATM 出金自動落盤）、`RMS`、`Import`（導入）
                      enum:
                        - Normal
                        - Admin
                        - OB
                        - WTT
                        - AIP
                        - ATM
                        - RMS
                        - Import
                    fund_name:
                      type: string
                      description: 基金名稱. 用於按「基金名稱」篩選結果。
                    action:
                      type: string
                      description: |-
                        訂單類型. 用於按「訂單類型」篩選結果。

                        **可選值：**
                        - `BUY` - 表示申購
                        - `SELL` - 表示贖回
                      enum:
                        - BUY
                        - SELL
                    currency:
                      type: string
                      description: |-
                        幣種. 用於按「幣種」篩選結果。

                        候選值會動態變化。請調用 `GET /v1/datasets/refs/tenant_currencies` 獲取當前可用的數據字典，並使用返回項的 `key` 作為本參數值。
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/tenant_currencies
                    settle_at:
                      type: object
                      description: 完成時間. 用於按「完成時間」篩選結果。
                      properties:
                        gte:
                          type: string
                          description: 大於等於. 篩選範圍的下限，匹配值包含該值。
                          format: date
                        lte:
                          type: string
                          description: 小於等於. 篩選範圍的上限，匹配值包含該值。
                          format: date
                    trading_day:
                      type: object
                      description: 交易日. 用於按「交易日」篩選結果。
                      properties:
                        gte:
                          type: string
                          description: 大於等於. 篩選範圍的下限，匹配值包含該值。
                          format: date
                        lte:
                          type: string
                          description: 小於等於. 篩選範圍的上限，匹配值包含該值。
                          format: date
                page:
                  type: integer
                  description: 頁碼. 要查詢的頁碼，從 `1` 開始。
                page_size:
                  type: integer
                  description: 每頁數量. 每頁返回的記錄數量。
                orderBy:
                  type: array
                  description: 排序參數. 排序規則數組；每一項定義一個排序字段及排序方向。
                  items:
                    type: object
            example:
              filters: {}
              page: 1
              page_size: 20
              orderBy: []
      responses:
        '200':
          description: 成功時分頁返回「基金 saas 訂單」記錄，以及頁碼、每頁數量和總記錄數等分頁信息。
          content:
