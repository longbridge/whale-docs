  /v1/datasets/aml_suspicious_events/download:
    post:
      operationId: aml_suspicious_events_download
      summary: Suspicious Event List Export
      tags:
      - Suspicious Incident Monitoring
      x-permission-key:
      - account.sem_query
      x-lbonly: false
      description: 'Exports Suspicious Event List data to a file. `filters` defines the export scope,
        and `down_fields` can restrict the exported columns.


        ### Export modes


        - `mode: 0`: synchronous export; the download URL is returned directly on success.

        - `mode: 1`: asynchronous export; the API first returns `file_download_id`. Call `GET /v1/datasets/download/{id}`
        to obtain the download URL.

        - When the export record is no longer needed, delete it with `DELETE /v1/datasets/download/{id}`.'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: Same fields as the filters of aml_suspicious_events.yaml (the query capability).
                  properties:
                    member_id:
                      type: string
                      description: Filters results by Client.
                    tigger_indicator:
                      type: string
                      description: 'Filters results by Trigger Indicator.


                        Multiple values are supported. Join them with commas (`,`). Omit the field to
                        disable this filter.


                        **Allowed values:**

                        - `1` - Deposit/Withdrawal Anomaly

                        - `2` - Trading Anomaly

                        - `3` - Other'
                      example: 1,2
                      enum:
                      - '1'
                      - '2'
                      - '3'
                      x-enum-details:
                      - value: '1'
                        label: Deposit/Withdrawal Anomaly
                      - value: '2'
                        label: Trading Anomaly
                      - value: '3'
                        label: Other
                    process_status:
                      type: string
                      description: 'Filters results by Review Status.


                        Multiple values are supported. Join them with commas (`,`). Omit the field to
                        disable this filter.


                        **Allowed values:**

                        - `1` - Pending Follow-up

                        - `2` - Following Up

                        - `3` - Pending Approva

                        - `4` - Completed'
                      example: 1,2
                      enum:
                      - '1'
                      - '2'
                      - '3'
                      - '4'
                      x-enum-details:
                      - value: '1'
                        label: Pending Follow-up
                      - value: '2'
                        label: Following Up
                      - value: '3'
                        label: Pending Approva
                      - value: '4'
                        label: Completed
                    created_at:
                      type: object
                      description: Filters results by Created At.
                      properties:
                        gte:
                          type: string
                          format: date
                          description: Inclusive lower bound of the filter range.
                        lte:
                          type: string
                          format: date
                          description: Inclusive upper bound of the filter range.
                    updated_at:
                      type: string
                      format: date
                      description: Filters results by Earlier Than Update Date.
                    created_by:
                      type: string
                      description: 'Filters results by Created By.


                        Values are dynamic. Call `GET /v1/datasets/refs/operators` to retrieve the current
                        data dictionary, and use the returned entry''s `key` as this parameter''s value.'
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/operators
                mode:
                  type: integer
                  default: 0
                  description: 'Defaults to `0` (synchronous mode) when omitted.


                    **Allowed values:**

                    - `0` - Sync

                    - `1` - Async'
                  enum:
                  - 0
                  - 1
                  x-enum-details:
                  - value: 0
                    label: Sync
                  - value: 1
                    label: Async
                ext:
                  type: string
                  description: 'Download file format. Defaults to `csv` when omitted.


                    **Allowed values:**

                    - `csv` - CSV

                    - `xlsx` - Excel'
                  enum:
                  - csv
                  - xlsx
                file_name:
                  type: string
                  description: Export file name. The server generates a name when omitted.
                down_fields:
                  type: array
                  description: 'When omitted, all fields are exported; allowed values are listed under
                    items.enum (the

                    same field list as the query endpoint''s data.list.items).'
                  items:
                    type: string
                    enum:
                    - event_no
                    - member_id
                    - real_name
                    - en_name
                    - origin_id
                    - last_alert_date
                    - tigger_indicator
                    - tigger_indicator_val
                    - tigger_indicator_remark
                    - remark
                    - created_at
                    - created_by
                    - created_by_val
                    - data_source
                    - data_source_val
                    - process_status
                    - process_status_val
                    - result_status
                    - result_status_val
                    - last_reviewed_by
                    - last_reviewed_by_val
                    - last_reviewed_at
                    - updated_at
                ticket_content:
                  type: string
                  description: Information shown to the approver when download approval is enabled for
                    the template.
                ticket_preview_url:
                  type: string
                  description: Export approval detail URL. Used only when the export requires approval.
                hide:
                  type: integer
                  description: 'Whether to hide this export from the download-record list.


                    **Allowed values:**

                    - `0` - Not Hidden

                    - `1` - Hidden'
                  enum:
                  - 0
                  - 1
                  x-enum-details:
                  - value: 0
                    label: Not Hidden
                  - value: 1
                    label: Hidden
            example:
              filters: {}
              mode: 0
              ext: csv
              file_name: ''
              remark: ''
              down_fields: []
              ticket_content: ''
              ticket_preview_url: ''
              hide: 0
      responses:
        '200':
          description: On success, returns information about the Suspicious Event List Export task. Synchronous
            exports provide a download URL directly; asynchronous exports provide `file_download_id` for
            subsequent status queries.
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - data
                properties:
                  code:
                    type: integer
                    description: "`0` indicates success. A non-zero value is a business error code, in\
                      \ which case\n`data` is usually empty.\n\nHTTP status codes use their standard semantics.\
                      \ A successful request normally\nreturns `200`; errors may return `400`, `401`,\
                      \ `403`, `408`, or another applicable\nstatus. Interpret the HTTP status together\
                      \ with the business `code`.\n\n- `401`: The user is not authenticated.\n- `403`:\
                      \ The current account is not authorized to use this function. Grant access\n  through\
                      \ User Permission."
                    x-enum-details:
                    - value: 0
                      label: Success
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      url:
                        type: string
                        description: 'Returned in synchronous mode (`mode: 0`); empty in asynchronous
                          mode.'
                      file_download_id:
                        type: string
                        description: 'Returned in async mode (`mode: 1`); it is the `{id}` in

                          `GET /v1/datasets/download/{id}` / `DELETE /v1/datasets/download/{id}`: GET

                          obtains the final download URL, DELETE deletes the export record.'
                      ticket_id:
                        type: string
                        description: '**Returned value:** Approval ticket ID. Returned only when the operation
                          starts an approval workflow.'
              example:
                code: 0
                message: success
                data:
                  url: https://b-api.longbridge.xyz/download/export_result.csv
                  file_download_id: ''
                  ticket_id: ''
        '400':
          description: Bad request. Check the business error code in `code` and the error details in `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: The user is not authenticated, or the login session has expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: The current account is not authorized to use this feature. Grant the required permission
            to the account in User Permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: The request timed out. Check the business error code in `code` and the error details
            in `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
      x-dataset-parent:
        method: GET
        path: /v1/datasets/aml_suspicious_events
        operationId: aml_suspicious_events
  /v1/datasets/aml_suspicious_events:
    get:
      operationId: aml_suspicious_events
      summary: Suspicious Event List
      tags:
      - Suspicious Incident Monitoring
      x-permission-key:
      - account.sem_query
      x-lbonly: false
      description: 'Queries Suspicious Event List data. Combine business filters in `filters`, and use
        `page` and `page_size` to control pagination.


        ### Response


        On success, the API returns the matching records and pagination metadata. See each filter field
        for its purpose, allowed values, and dynamic value source.'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: Combines business filters. Omit a filter field to disable that filter.
                  properties:
                    member_id:
                      type: string
                      description: Filters results by Client.
                    tigger_indicator:
                      type: string
                      description: 'Filters results by Trigger Indicator.


                        Multiple values are supported. Join them with commas (`,`). Omit the field to
                        disable this filter.


                        **Allowed values:**

                        - `1` - Deposit/Withdrawal Anomaly

                        - `2` - Trading Anomaly

                        - `3` - Other'
                      example: 1,2
                      enum:
                      - '1'
                      - '2'
                      - '3'
                      x-enum-details:
                      - value: '1'
                        label: Deposit/Withdrawal Anomaly
                      - value: '2'
                        label: Trading Anomaly
                      - value: '3'
                        label: Other
                    process_status:
                      type: string
                      description: 'Filters results by Review Status.


                        Multiple values are supported. Join them with commas (`,`). Omit the field to
                        disable this filter.


                        **Allowed values:**

                        - `1` - Pending Follow-up

                        - `2` - Following Up

                        - `3` - Pending Approva

                        - `4` - Completed'
                      example: 1,2
                      enum:
                      - '1'
                      - '2'
                      - '3'
                      - '4'
                      x-enum-details:
                      - value: '1'
                        label: Pending Follow-up
                      - value: '2'
                        label: Following Up
                      - value: '3'
                        label: Pending Approva
                      - value: '4'
                        label: Completed
                    created_at:
                      type: object
                      description: Filters results by Created At.
                      properties:
                        gte:
                          type: string
                          format: date
                          description: Inclusive lower bound of the filter range.
                        lte:
                          type: string
                          format: date
                          description: Inclusive upper bound of the filter range.
                    updated_at:
                      type: string
                      format: date
                      description: Filters results by Earlier Than Update Date.
                    created_by:
                      type: string
                      description: 'Filters results by Created By.


                        Values are dynamic. Call `GET /v1/datasets/refs/operators` to retrieve the current
                        data dictionary, and use the returned entry''s `key` as this parameter''s value.'
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/operators
                page:
                  type: integer
                  description: Page number to retrieve, starting from `1`.
                page_size:
                  type: integer
                  description: Number of records to return per page.
            example:
              filters: {}
              page: 1
              page_size: 20
      responses:
        '200':
          description: On success, returns paginated Suspicious Event List records together with pagination
            metadata such as the page number, page size, and total record count.
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - data
                properties:
                  code:
                    type: integer
                    description: "`0` indicates success. A non-zero value is a business error code, in\
                      \ which case\n`data` is usually empty.\n\nHTTP status codes use their standard semantics.\
                      \ A successful request normally\nreturns `200`; errors may return `400`, `401`,\
                      \ `403`, `408`, or another applicable\nstatus. Interpret the HTTP status together\
                      \ with the business `code`.\n\n- `401`: The user is not authenticated.\n- `403`:\
                      \ The current account is not authorized to use this function. Grant access\n  through\
                      \ User Permission."
                    x-enum-details:
                    - value: 0
                      label: Success
                  message:
                    type: string
                  data:
                    type: object
                    required:
                    - list
                    - total
                    properties:
                      list:
                        type: array
                        description: '**Returned value:** List of list.'
                        items:
                          type: object
                          properties:
                            event_no:
                              type: string
                              description: '**Returned value:** Event ID.'
                            member_id:
                              type: string
                              description: '**Returned value:** Client ID.'
                            real_name:
                              type: string
                              description: '**Returned value:** Client Chinese Name.'
                            en_name:
                              type: string
                              description: '**Returned value:** Client English Name.'
                            origin_id:
                              type: string
                              description: '**Returned value:** Securities Account.'
                            last_alert_date:
                              type: string
                              description: '**Returned value:** Last Alert Date. The date or time format
                                follows the value returned by the API.'
                            tigger_indicator:
                              type: string
                              description: '**Returned value:** Trigger Indicator.'
                            tigger_indicator_val:
                              type: string
                              description: Raw value of `tigger_indicator`. The `tigger_indicator` field
                                contains the display value resolved through a dictionary or related record;
                                this field contains the underlying code or ID.
                            tigger_indicator_remark:
                              type: string
                              description: '**Returned value:** Trigger Indicator Remark.'
                            remark:
                              type: string
                              description: '**Returned value:** Event Remark.'
                            created_at:
                              type: string
                              description: '**Returned value:** Created Time. The date or time format
                                follows the value returned by the API.'
                            created_by:
                              type: string
                              description: '**Returned value:** Created By.'
                            created_by_val:
                              type: string
                              description: Raw value of `created_by`. The `created_by` field contains
                                the display value resolved through a dictionary or related record; this
                                field contains the underlying code or ID.
                            data_source:
                              type: string
                              description: '**Returned value:** Data Source.'
                            data_source_val:
