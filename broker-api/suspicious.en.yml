openapi: 3.1.1
info:
  title: Longport Whale Broker API
  description: Institution-grade server-side APIs for brokers using Longport Whale.
  version: 2.0.0
servers:
- url: https://b-api.longbridge.xyz
  description: Testing
- url: https://b-api.lbkrs.com
  description: Production
security:
- bearerAuth: []
tags:
- name: Suspicious Incident Monitoring
paths:
  /account/kyc/import:
    post:
      operationId: kyc_import
      summary: Import KYC Suspicious Incidents
      tags:
      - Suspicious Incident Monitoring
      x-permission-key:
      - account.apply_edit_member
      - account.modify_transaction_channel
      - account.sem_update
      - account.suspend_account
      - account.update_appid
      - b2b_customer.submit_account
      - kyc.blacklist_hit_status
      - kyc.blacklist_members
      - kyc.blacklist_names
      - kyc.update_account_info
      - ticket.import_agent
      - ticket.import_relation
      x-lbonly: false
      description: 'Always set `type` to `SuspiciousIncident`.


        ### Request parameters


        - Required: `type` (File Type)

        - Optional: `s3_key` (S3 Key), `name` (Name), `filename` (File Name), `base_account_ids` (Base
        Account IDs), `audit_frontend_resource` (Audit Context)

        - See each field for its format, allowed values, default behavior, and business meaning.


        ### Result


        On success, the endpoint completes the described business operation. See the `200` response schema
        for returned data.'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - type
              properties:
                s3_key:
                  type: string
                  description: Specifies S3 Key.
                name:
                  type: string
                  description: Specifies Name.
                type:
                  type: string
                  description: This page always passes SuspiciousIncident.
                filename:
                  type: string
                  description: Name of the file to process, including its file extension.
                base_account_ids:
                  type: array
                  description: Submit Base Account IDs as a JSON array.
                  items:
                    type: string
                audit_frontend_resource:
                  type: object
                  description: Provides audit context for this operation.
            example:
              s3_key: ''
              name: ''
              type: SuspiciousIncident
              filename: ''
              base_account_ids: []
              audit_frontend_resource: {}
      responses:
        '200':
          description: The request was processed successfully. The response `data` does not contain additional
            business fields.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: "`0` indicates success. A non-zero value is a business error code, in\
                      \ which case\n`data` is usually empty.\n\nHTTP status codes use their standard semantics.\
                      \ A successful request normally\nreturns `200`; errors may return `400`, `401`,\
                      \ `403`, `408`, or another applicable\nstatus. Interpret the HTTP status together\
                      \ with the business `code`.\n\n- `401`: The user is not authenticated.\n- `403`:\
                      \ The current account is not authorized to use this function. Grant access\n  through\
                      \ User Permission."
                    x-enum-details:
                    - value: 0
                      label: Success
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: Bad request. Check the business error code in `code` and the error details in `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: The user is not authenticated, or the login session has expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: The current account is not authorized to use this feature. Grant the required permission
            to the account in User Permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: The request timed out. Check the business error code in `code` and the error details
            in `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
  /account/kyc/submit_suspicious_event:
    post:
      operationId: submit_suspicious_event
      summary: Create Suspicious Event
      tags:
      - Suspicious Incident Monitoring
      x-permission-key:
      - account.sem_update
      - kyc.suspicious_incident_monitoring
      x-lbonly: true
      description: 'Create Suspicious Event.


        ### Request parameters


        - Required: `aaid` (A/C No.)

        - Optional: `trigger_indicator` (Trigger Indicator), `trigger_remark` (Trigger Remark), `last_alert_date`
        (Last Alert Date)

        - See each field for its format, allowed values, and business meaning.


        ### Result


        On success, the endpoint completes the operation. See the `200` response schema for returned data
        and subsequent state information.'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - aaid
              properties:
                aaid:
                  type: string
                  description: Specifies A/C No.. This field is required.
                trigger_indicator:
                  type: string
                  description: Specifies Trigger Indicator.
                trigger_remark:
                  type: string
                  description: Specifies Trigger Remark.
                last_alert_date:
                  type: string
                  description: Specifies Last Alert Date.
            example:
              aaid: H00000000
              trigger_indicator: ''
              trigger_remark: ''
              last_alert_date: 2026-07-10
      responses:
        '200':
          description: The request was processed successfully. The response `data` does not contain additional
            business fields.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: "`0` indicates success. A non-zero value is a business error code, in\
                      \ which case\n`data` is usually empty.\n\nHTTP status codes use their standard semantics.\
                      \ A successful request normally\nreturns `200`; errors may return `400`, `401`,\
                      \ `403`, `408`, or another applicable\nstatus. Interpret the HTTP status together\
                      \ with the business `code`.\n\n- `401`: The user is not authenticated.\n- `403`:\
                      \ The current account is not authorized to use this function. Grant access\n  through\
                      \ User Permission."
                    x-enum-details:
                    - value: 0
                      label: Success
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: Bad request. Check the business error code in `code` and the error details in `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: The user is not authenticated, or the login session has expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: The current account is not authorized to use this feature. Grant the required permission
            to the account in User Permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: The request timed out. Check the business error code in `code` and the error details
            in `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
