                      type: string
                      description: |-
                        授權狀態. 用於按「授權狀態」篩選結果。

                        **可選值：**
                        - `0` - 表示待審核
                        - `1` - 表示開通中
                        - `2` - 表示已開通
                        - `3` - 表示已駁回
                        - `4` - 表示已關閉
                        - `5` - 表示已過期
                        - `8` - 表示已取消
                      enum:
                        - '0'
                        - '1'
                        - '2'
                        - '3'
                        - '4'
                        - '5'
                        - '8'
                    verify_state:
                      type: string
                      description: |-
                        人工確認. 用於按「人工確認」篩選結果。

                        **可選值：**
                        - `0` - 表示無需處理
                        - `1` - 表示待處理
                        - `3` - 表示已確認
                        - `4` - 表示已失效
                      enum:
                        - '0'
                        - '1'
                        - '3'
                        - '4'
                    bank_code:
                      type: string
                      description: 客戶銀行代碼. 用於按「客戶銀行代碼」篩選結果。
                    reference:
                      type: string
                      description: 參考編號. 用於按「參考編號」篩選結果。
                    currency:
                      type: string
                      description: |-
                        授權幣種. 用於按「授權幣種」篩選結果。

                        **可選值：**
                        - `HKD` - 表示港幣
                        - `CNH` - 表示離岸人民幣
                      enum:
                        - HKD
                        - CNH
                    auth_type:
                      type: string
                      description: |-
                        授權方式. 用於按「授權方式」篩選結果。

                        **可選值：**
                        - `0` - 表示未匹配
                        - `1` - 表示 App 直接發起
                        - `2` - 表示用戶網銀發起
                        - `3` - 表示銀行櫃檯發起授權
                      enum:
                        - '0'
                        - '1'
                        - '2'
                        - '3'
                    bank_sec_fail_reason:
                      type: string
                      description: 異常原因. 用於按「異常原因」篩選結果。
                    updated_at:
                      type: object
                      description: 更新時間. 用於按「更新時間」篩選結果。
                      properties:
