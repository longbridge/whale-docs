  /v1/datasets/atm_deposit_applications:
    get:
      operationId: atm_deposit_applications
      summary: 入金申請
      tags:
        - 款项管理
      x-permission-key:
        - cmbc.hk_user_deposit_application
      x-lbonly: false
      description: |-
        查詢「入金申請」數據，可通過 `filters` 組合業務篩選條件，並使用 `page`、`page_size` 和 `orderBy` 控制分頁與排序。

        ### 返回結果

        成功時返回匹配的記錄列表及分頁信息。各過濾字段的用途、可選值和動態數據來源見對應字段說明。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 過濾條件. 組合業務過濾條件。省略某個過濾字段時，不按該字段篩選。
                  properties:
                    member_id:
                      type: string
                      description: 客戶. 用於按「客戶」篩選結果。
                    search_member_id:
                      type: string
                      description: 客戶編號. 用於按「客戶編號」篩選結果。
                    currency:
                      type: string
                      description: |-
                        幣種. 用於按「幣種」篩選結果。

                        候選值會動態變化。請調用 `GET /v1/datasets/refs/tenant_currencies_by_channel` 獲取當前可用的數據字典，並使用返回項的 `key` 作為本參數值。
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/tenant_currencies_by_channel
                    channel_account:
                      type: string
                      description: 證券賬號. 用於按「證券賬號」篩選結果。
                    id:
                      type: string
                      description: 申請編號. 用於按「申請編號」篩選結果。
                    ref_state:
                      type: string
                      description: |-
                        匹配狀態. 用於按「匹配狀態」篩選結果。

                        **可選值：**
                        - `0` - 表示未匹配
                        - `1` - 表示已匹配
                      enum:
                        - '0'
                        - '1'
                    state:
                      type: string
                      description: |-
                        加款狀態. 用於按「加款狀態」篩選結果。

                        支持多選；提交時使用英文逗號（`,`）拼接多個值。不傳時不按此字段篩選。

                        **可選值：**
                        - `0` - 表示處理中
                        - `1` - 表示加款完成
                        - `2` - 表示加款失敗
                        - `3` - 表示已撤銷
                        - `5` - 表示已駁回
                        - `6` - 表示修改待審批
                        - `7` - 表示刪除待審批
                        - `8` - 表示已刪除
                        - `9` - 表示駁回待審批
                        - `100` - 表示待解凍
                        - `200` - 表示解凍待審核
                      example: 0,1
                      enum:
                        - '0'
                        - '1'
                        - '2'
                        - '3'
                        - '5'
                        - '6'
                        - '7'
                        - '8'
                        - '9'
                        - '100'
                        - '200'
                    deposit_type:
                      type: string
                      description: |-
                        入金類型. 用於按「入金類型」篩選結果。

                        **可選值：**
                        - `0` - 表示用戶加款
                        - `1` - 表示開戶入金
                      enum:
                        - '0'
                        - '1'
                    created_at:
                      type: object
                      description: 創建時間. 用於按「創建時間」篩選結果。
                      properties:
                        gte:
                          type: string
                          description: 大於等於. 篩選範圍的下限，匹配值包含該值。
                          format: date
                        lte:
                          type: string
                          description: 小於等於. 篩選範圍的上限，匹配值包含該值。
                          format: date
                    amount:
                      type: object
                      description: 金額範圍. 用於按「金額範圍」篩選結果。
                      properties:
                        gte:
                          type: number
                          description: 大於等於. 篩選範圍的下限，匹配值包含該值。
                        lte:
                          type: number
                          description: 小於等於. 篩選範圍的上限，匹配值包含該值。
                    bank_operation_type_id:
                      type: string
                      description: |-
                        入金方式. 用於按「入金方式」篩選結果。

                        候選值會動態變化。請調用 `GET /v1/datasets/refs/offline_deposit_methods` 獲取當前可用的數據字典，並使用返回項的 `key` 作為本參數值。
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/offline_deposit_methods
                    bank_id:
                      type: string
                      description: |-
                        匯款銀行. 用於按「匯款銀行」篩選結果。

                        候選值會動態變化。請調用 `GET /v1/datasets/refs/region_banks` 獲取當前可用的數據字典，並使用返回項的 `key` 作為本參數值。
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/region_banks
                    lb_bank_account_id:
                      type: string
                      description: |-
                        收款銀行. 用於按「收款銀行」篩選結果。

                        候選值會動態變化。請調用 `GET /v1/datasets/refs/receiving_bank_accounts` 獲取當前可用的數據字典，並使用返回項的 `key` 作為本參數值。
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/receiving_bank_accounts
                    detail_id:
                      type: string
                      description: 加款單號. 用於按「加款單號」篩選結果。
                    bills_id:
                      type: string
                      description: 入金賬單編號. 用於按「入金賬單編號」篩選結果。
                    initiator:
                      type: string
                      description: |-
                        來源. 用於按「來源」篩選結果。

                        **可選值：** `APP`（用戶）、`system`（系統）、`AUTO`
                      enum:
                        - APP
                        - system
                        - AUTO
                    sub_state:
                      type: string
                      description: |-
                        催辦狀態. 用於按「催辦狀態」篩選結果。

                        **可選值：**
                        - `0` - 表示未催辦
                        - `1` - 表示待處理
                        - `2` - 表示已確認
                      enum:
                        - '0'
                        - '1'
                        - '2'
                page:
                  type: integer
                  description: 頁碼. 要查詢的頁碼，從 `1` 開始。
                page_size:
                  type: integer
                  description: 每頁數量. 每頁返回的記錄數量。
                orderBy:
                  type: array
                  description: 排序參數. 排序規則數組；每一項定義一個排序字段及排序方向。
                  items:
                    type: object
            example:
              filters: {}
              page: 1
              page_size: 20
              orderBy: []
