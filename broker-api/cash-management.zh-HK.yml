        ### 請求參數

        - 必填：`channel_name`（匯率渠道）、`source_from`（匯率來源）、`base_currency`（基礎貨幣）、`other_currency`（對手方貨幣）、`record_date`（記錄日期）、`bid_rate`（買入價）、`offer_rate`（賣出價）、`average_rate`（中間價）
        - 可選：`audit_frontend_resource`（審計上下文）
        - 各字段的格式、取值範圍、默認行為和業務含義見對應字段說明。

        ### 處理結果

        成功時完成所述業務操作，具體返回內容見 `200` 響應定義。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - channel_name
                - source_from
                - base_currency
                - other_currency
                - record_date
                - bid_rate
                - offer_rate
                - average_rate
              properties:
                channel_name:
                  type: string
                  description: |-
                    匯率渠道. - 渠道/匯率類型，下拉選擇
                    - 多選時以逗號拼接為字符串

                    **可選值：**
                    - `MANUAL_CURRENT` - 表示即期匯率
                    - `MANUAL_ACCOUNT` - 表示賬面匯率
                    - `CCASS` - 表示港交所
                  example: MANUAL_CURRENT,MANUAL_ACCOUNT
                  enum:
                    - MANUAL_CURRENT
                    - MANUAL_ACCOUNT
                    - CCASS
                source_from:
                  type: string
                  description: |-
                    匯率來源. 匯率來源，單選，例如 SINGLE（單一貨幣對）

                    **可選值：**
                    - `CCASS` - 表示自動跟隨港交所
                    - `SINGLE` - 表示單筆新增
                  enum:
                    - CCASS
                    - SINGLE
                base_currency:
                  type: string
                  description: 基礎貨幣. 基準貨幣，下拉選擇（幣種列表，如 USD/HKD/CNH）
                other_currency:
                  type: string
                  description: 對手方貨幣. 對手貨幣，下拉選擇（幣種列表）
                record_date:
                  type: string
                  description: 記錄日期. 記錄日期，格式 YYYYMMDD，不能晚於當前時間
                bid_rate:
                  type: number
                  description: 買入價. 買入匯率，必須大於 0（精度按幣種對配置）
                offer_rate:
                  type: number
                  description: 賣出價. 賣出匯率，必須大於 0（精度按幣種對配置）
                average_rate:
                  type: number
                  description: 中間價. 中間匯率，必須大於 0（精度按幣種對配置）
                audit_frontend_resource:
                  type: object
                  description: 審計上下文. 自動附加的審計字段，包含 $behavior（操作描述）與 $action（固定值 add）
            example:
              channel_name: MANUAL
              source_from: SINGLE
              base_currency: USD
              other_currency: HKD
              record_date: '20260710'
              bid_rate: 7.75
              offer_rate: 7.85
              average_rate: 7.8
              audit_frontend_resource:
                $behavior: 新建参考汇率
                $action: add
      responses:
        '200':
          description: 請求處理成功。響應的 `data` 不包含額外業務字段。
          content:
