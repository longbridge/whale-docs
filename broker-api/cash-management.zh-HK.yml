                          description: 大於等於. 篩選範圍的下限，匹配值包含該值。
                          format: date
                        lte:
                          type: string
                          description: 小於等於. 篩選範圍的上限，匹配值包含該值。
                          format: date
                    app_show:
                      type: string
                      description: |-
                        客戶端是否展示. 用於按「客戶端是否展示」篩選結果。

                        **可選值：**
                        - `0` - 表示否
                        - `1` - 表示是
                      enum:
                        - '0'
                        - '1'
                    busi_type:
                      type: string
                      description: |-
                        審核狀態. 用於按「審核狀態」篩選結果。

                        **可選值：**
                        - `0` - 表示初始
                        - `45` - 表示已開通待審核
                        - `49` - 表示已關閉待審核
                        - `37` - 表示待審核
                        - `36` - 表示刪除待審批
                      enum:
                        - '0'
                        - '45'
                        - '49'
                        - '37'
                        - '36'
                page:
