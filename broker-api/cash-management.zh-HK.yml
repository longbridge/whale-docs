      x-permission-key:
        - lb_hk_edda.edda_query
      x-lbonly: false
      description: |-
        查詢「eDDA」數據，可通過 `filters` 組合業務篩選條件，並使用 `page`、`page_size` 和 `orderBy` 控制分頁與排序。

        ### 返回結果

        成功時返回匹配的記錄列表及分頁信息。各過濾字段的用途、可選值和動態數據來源見對應字段說明。
