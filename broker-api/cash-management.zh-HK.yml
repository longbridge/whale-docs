        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - file_key
              properties:
                file_key:
                  type: string
                  description: 文件Key. 文件上傳後返回的對象存儲 Key，用於定位本次請求處理的文件。此字段為必填項。
                business_type:
                  type: string
                  description: 業務類型. 用於區分本次請求適用的業務場景。
                file_name:
                  type: string
                  description: 文件名. 本次請求處理的文件名，包含文件擴展名。
                redirect_uri:
                  type: string
                  description: 回調地址. 用於指定「回調地址」。
                audit_frontend_resource:
