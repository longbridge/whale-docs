      description: |-
        銀行標準模板批量導入。

        ### 請求參數

        - 必填：`file_key`（文件Key）
        - 可選：`business_type`（業務類型）、`file_name`（文件名）、`redirect_uri`（回調地址）、`audit_frontend_resource`（審計上下文）
        - 各字段的格式、取值範圍和業務含義見對應字段說明。

        ### 處理結果

        成功時完成上述業務操作；後續狀態和返回數據以 `200` 響應定義為準。
