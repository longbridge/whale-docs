        - 必填：`id`（賬單ID）、`invisible`（是否隱藏）、`audit_frontend_resource`（審計上下文）
        - 各字段的格式、取值範圍和業務含義見對應字段說明。

        ### 處理結果

        成功時完成上述業務操作；後續狀態和返回數據以 `200` 響應定義為準。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
                - invisible
                - audit_frontend_resource
              properties:
                id:
                  type: number
                  description: 賬單ID. 賬單ID，用於標識本次請求關聯的業務對象。此字段為必填項。
                invisible:
                  type: boolean
                  description: |-
                    是否隱藏. 是否隱藏。此字段為必填項。

                    **布爾值：**
                    - `true` - 表示條件成立
                    - `false` - 表示條件不成立
                audit_frontend_resource:
                  type: object
                  description: 審計上下文. 含 $behavior/$action/currency/amount
