components:
  schemas:
    BrokerGatewayErrorEnvelope:
      type: object
      description: Broker API Gateway 返回的錯誤響應結構。`code` 為業務錯誤碼，`message` 為錯誤信息，`data` 通常為空。
      required:
        - code
        - message
        - data
      properties:
        code:
          type: integer
        message:
          type: string
        data: {}
