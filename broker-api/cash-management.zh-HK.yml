    get:
      operationId: atm_withdraw_applications
      summary: 出金申請
      tags:
        - 款项管理
      x-permission-key:
        - cmbc.user_withdraw_application
      x-lbonly: false
      description: |-
        查詢「出金申請」數據，可通過 `filters` 組合業務篩選條件，並使用 `page`、`page_size` 和 `orderBy` 控制分頁與排序。

        ### 返回結果

        成功時返回匹配的記錄列表及分頁信息。各過濾字段的用途、可選值和動態數據來源見對應字段說明。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 過濾條件. 組合業務過濾條件。省略某個過濾字段時，不按該字段篩選。
                  properties:
                    member_id:
                      type: string
                      description: 客戶. 用於按「客戶」篩選結果。
                    id:
                      type: string
                      description: 申請編號. 用於按「申請編號」篩選結果。
                    status:
                      type: string
                      description: |-
                        申請單狀態. 用於按「申請單狀態」篩選結果。

                        支持多選；提交時使用英文逗號（`,`）拼接多個值。不傳時不按此字段篩選。

                        **可選值：**
                        - `0 99` - 表示待提交
                        - `7` - 表示已提交
                        - `1` - 表示處理中
                        - `2` - 表示已拒絕
                        - `3` - 表示已撤銷
                        - `4` - 表示成功
                        - `5` - 表示失敗
                        - `6` - 表示已退回
                        - `9` - 表示修改待審批
                        - `10` - 表示刪除待審批
                        - `11` - 表示已刪除
                        - `12` - 表示駁回待審批
                        - `13` - 表示提交待審批
                      example: 0 99,7
                      enum:
                        - 0 99
                        - '7'
                        - '1'
                        - '2'
                        - '3'
                        - '4'
                        - '5'
                        - '6'
                        - '9'
                        - '10'
                        - '11'
                        - '12'
                        - '13'
                    origin:
                      type: string
                      description: |-
                        提現類型. 用於按「提現類型」篩選結果。

                        **可選值：**
                        - `0` - 表示用戶提現
                        - `1` - 表示手工提現
                        - `2` - 表示銀行端提現
                      enum:
                        - '0'
                        - '1'
                        - '2'
                    currency:
                      type: string
                      description: |-
                        幣種. 用於按「幣種」篩選結果。

