                  properties:
                    bank_account:
                      type: string
                      description: 付款方銀行賬號. 用於按「付款方銀行賬號」篩選結果。
                    id:
                      type: string
                      description: 入金賬單編號. 用於按「入金賬單編號」篩選結果。
                    bank_user_name:
                      type: string
                      description: 付款方姓名. 用於按「付款方姓名」篩選結果。
