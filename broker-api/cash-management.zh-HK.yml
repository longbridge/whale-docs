  /v1/datasets/atm_deposit_filter_rules:
    get:
      operationId: atm_deposit_filter_rules
      summary: 入金賬單設置
      tags:
        - 款项管理
      x-permission-key:
        - lb_hk_depositfilterrule.depositfilterrule_query
      x-lbonly: false
      description: |-
        查詢「入金賬單設置」數據，可通過 `filters` 組合業務篩選條件，並使用 `page`、`page_size` 和 `orderBy` 控制分頁與排序。

        ### 返回結果

        成功時返回匹配的記錄列表及分頁信息。各過濾字段的用途、可選值和動態數據來源見對應字段說明。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 過濾條件. 組合業務過濾條件。省略某個過濾字段時，不按該字段篩選。
                  properties:
                    id:
                      type: string
                      description: 入金賬單設置編號. 用於按「入金賬單設置編號」篩選結果。
                    updated_at:
                      type: object
                      description: 更新時間. 用於按「更新時間」篩選結果。
                      properties:
                        gte:
                          type: string
                          description: 大於等於. 篩選範圍的下限，匹配值包含該值。
                          format: date
                        lte:
                          type: string
                          description: 小於等於. 篩選範圍的上限，匹配值包含該值。
                          format: date
                page:
                  type: integer
                  description: 頁碼. 要查詢的頁碼，從 `1` 開始。
                page_size:
                  type: integer
                  description: 每頁數量. 每頁返回的記錄數量。
                orderBy:
                  type: array
                  description: 排序參數. 排序規則數組；每一項定義一個排序字段及排序方向。
                  items:
                    type: object
            example:
              filters: {}
              page: 1
              page_size: 20
              orderBy: []
      responses:
        '200':
          description: 成功時分頁返回「入金賬單設置」記錄，以及頁碼、每頁數量和總記錄數等分頁信息。
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。

                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`
                      判斷具體結果。

                      - `401`：未登錄。
                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。
                  message:
                    type: string
                  data:
                    type: object
                    required:
                      - list
                      - total
                    properties:
                      list:
                        type: array
                        description: 列表. **返回值：** 符合查詢條件的記錄列表。
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: 入金賬單設置編號. **返回值：** 當前記錄的唯一標識。
                            payer_bank_account:
                              type: string
                              description: 付款方銀行賬號. **返回值：** 付款方銀行賬號。
                            payer_name:
                              type: string
                              description: 付款方姓名. **返回值：** 付款方姓名。
                            currency:
                              type: string
                              description: 幣種. **返回值：** 幣種。
                            lb_bank_account:
                              type: string
                              description: 公司銀行賬號. **返回值：** 公司銀行賬號。
                            business_type:
                              type: string
                              description: 業務種類. **返回值：** 業務種類。
                            bank_remark:
                              type: string
                              description: 銀行附言. **返回值：** 銀行附言。
                            created_by:
                              type: string
                              description: 新增人. **返回值：** 新增人。
                            updated_at:
                              type: string
                              description: 更新時間. **返回值：** 更新時間；時間或日期格式以接口實際返回值為準。
                      total:
                        type: integer
                        description: 總條數. **返回值：** 符合查詢條件的記錄總數，用於計算分頁。
              example:
                code: 0
                message: success
                data:
                  list:
                    - id: '2334'
                      payer_bank_account: 示例用户
                      payer_name: ''
                      currency: ''
                      lb_bank_account: ''
                      business_type: ''
                      bank_remark: ''
                      created_by: zhuozhou.shi
                      updated_at: '1784078878'
                  total: 1
        '400':
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
