                        endpoint: GET /v1/datasets/refs/tenant_currencies_by_channel
                    bank_remark:
                      type: string
                      description: 銀行附言. 用於按「銀行附言」篩選結果。
                    amount:
                      type: object
                      description: 金額. 用於按「金額」篩選結果。
                      properties:
                        gte:
                          type: number
                          description: 大於等於. 篩選範圍的下限，匹配值包含該值。
                        lte:
                          type: number
                          description: 小於等於. 篩選範圍的上限，匹配值包含該值。
                    bank_busi_type:
                      type: string
                      description: 業務種類. 用於按「業務種類」篩選結果。
                    remark:
                      type: string
                      description: 備註. 用於按「備註」篩選結果。
                    remark_empty:
                      type: string
                      description: 備註是否為空. 用於按「備註是否為空」篩選結果。
                page:
                  type: integer
                  description: 頁碼. 要查詢的頁碼，從 `1` 開始。
                page_size:
                  type: integer
                  description: 每頁數量. 每頁返回的記錄數量。
                orderBy:
                  type: array
                  description: 排序參數. 排序規則數組；每一項定義一個排序字段及排序方向。
