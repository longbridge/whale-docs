  /v1/datasets/atm_forex_orders:
    get:
      operationId: atm_forex_orders
      summary: 客戶彙兌
      tags:
        - 款项管理
      x-permission-key:
        - lb_hk_conversion.userexchangebill_query
      x-lbonly: false
      description: |-
        查詢「客戶彙兌」數據，可通過 `filters` 組合業務篩選條件，並使用 `page`、`page_size` 和 `orderBy` 控制分頁與排序。

        ### 返回結果

        成功時返回匹配的記錄列表及分頁信息。各過濾字段的用途、可選值和動態數據來源見對應字段說明。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 過濾條件. 組合業務過濾條件。省略某個過濾字段時，不按該字段篩選。
                  properties:
                    forex_id:
                      type: string
                      description: 客戶匯兌單號. 用於按「客戶匯兌單號」篩選結果。
                    client_ordid:
                      type: string
                      description: 渠道匯兌單號. 用於按「渠道匯兌單號」篩選結果。
                    member_id:
                      type: string
                      description: 客戶編號. 用於按「客戶編號」篩選結果。
                    forex_type:
                      type: string
                      description: |-
                        匯兌類型. 用於按「匯兌類型」篩選結果。

                        **可選值：** `FROM`、`TO`
                      enum:
                        - FROM
                        - TO
                    from_currency:
                      type: string
                      description: |-
                        兌出幣種. 用於按「兌出幣種」篩選結果。

                        候選值會動態變化。請調用 `GET /v1/datasets/refs/tenant_currencies_by_channel` 獲取當前可用的數據字典，並使用返回項的 `key` 作為本參數值。
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/tenant_currencies_by_channel
                    to_currency:
                      type: string
                      description: |-
                        兌入幣種. 用於按「兌入幣種」篩選結果。

                        候選值會動態變化。請調用 `GET /v1/datasets/refs/tenant_currencies_by_channel` 獲取當前可用的數據字典，並使用返回項的 `key` 作為本參數值。
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/tenant_currencies_by_channel
                    created_at:
                      type: object
                      description: 創建時間. 用於按「創建時間」篩選結果。
                      properties:
                        gte:
                          type: string
                          description: 大於等於. 篩選範圍的下限，匹配值包含該值。
                          format: date
                        lte:
                          type: string
                          description: 小於等於. 篩選範圍的上限，匹配值包含該值。
                          format: date
                    success_time:
                      type: object
                      description: 匯兌完成時間. 用於按「匯兌完成時間」篩選結果。
                      properties:
                        gte:
                          type: string
                          description: 大於等於. 篩選範圍的下限，匹配值包含該值。
                          format: date-time
                        lte:
                          type: string
                          description: 小於等於. 篩選範圍的上限，匹配值包含該值。
                          format: date-time
                    audit_status:
                      type: string
                      description: |-
                        審核狀態. 用於按「審核狀態」篩選結果。

                        **可選值：**
                        - `WAIT_AUDIT` - 表示待審核
                        - `REJECTED_AUDIT` - 表示已駁回
                        - `APPROVED_AUDIT` - 表示已審核
                      enum:
                        - WAIT_AUDIT
                        - REJECTED_AUDIT
                        - APPROVED_AUDIT
                    origin:
                      type: string
                      description: |-
                        匯兌來源. 用於按「匯兌來源」篩選結果。

                        **可選值：**
                        - `0` - 表示用戶
                        - `1` - 表示後台人工
                        - `2` - 表示 WAS
                        - `3` - 表示自動還款
                        - `4` - 表示強制換匯
                      enum:
                        - '0'
                        - '1'
                        - '2'
                        - '3'
                        - '4'
                page:
                  type: integer
                  description: 頁碼. 要查詢的頁碼，從 `1` 開始。
                page_size:
                  type: integer
                  description: 每頁數量. 每頁返回的記錄數量。
                orderBy:
                  type: array
                  description: 排序參數. 排序規則數組；每一項定義一個排序字段及排序方向。
                  items:
                    type: object
            example:
              filters: {}
              page: 1
              page_size: 20
              orderBy: []
