      x-permission-key:
        - lb_hk_conversion.forex_ib_rates
      x-lbonly: false
      description: |-
        查詢「參考彙率」數據，可通過 `filters` 組合業務篩選條件，並使用 `page`、`page_size` 和 `orderBy` 控制分頁與排序。

