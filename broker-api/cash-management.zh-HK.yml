openapi: 3.1.1
info:
  title: Longport Whale 券商 API
  description: 面向使用 Longport Whale 的券商提供機構級服務端 API。
  version: 2.0.0
servers:
  - url: https://b-api.longbridge.xyz
    description: 測試環境
  - url: https://b-api.lbkrs.com
    description: 生產環境
security:
  - bearerAuth: []
tags:
  - name: 款项管理
paths:
  /atm/add/order/remark:
    post:
      operationId: add_order_remark
      summary: 添加賬單備註
      tags:
        - 款项管理
      x-permission-key:
        - atm.add_bill_remark
        - atm.order_remark_update
      x-lbonly: false
      description: |-
        添加賬單備註。

        ### 請求參數

        - 必填：`id`（關聯ID）、`type`（備註類型）
        - 各字段的格式、取值範圍和業務含義見對應字段說明。

        ### 處理結果

        成功時完成上述業務操作；後續狀態和返回數據以 `200` 響應定義為準。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
                - type
              properties:
                id:
                  type: string
                  description: 關聯ID. 關聯ID，用於標識本次請求關聯的業務對象。此字段為必填項。
                type:
                  type: string
                  description: 備註類型. 用於指定「備註類型」。此字段為必填項。
            example:
              id: 123
              type: '2'
      responses:
        '200':
          description: 請求處理成功。響應的 `data` 不包含額外業務字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。

                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`
                      判斷具體結果。

                      - `401`：未登錄。
                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登錄或登錄狀態已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 當前賬號未獲得該功能授權。請在 User Permission 中為該賬號開通相應權限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 請求處理超時。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
      x-mint:
        href: /zh-HK/api-reference/add_order_remark
        metadata:
          sidebarTitle: 添加賬單備註
  /atm/bills/upload:
    post:
      operationId: atm_bills_upload
      summary: 銀行賬單手動導入（通用模板）
      tags:
        - 款项管理
      x-permission-key:
        - accounting.accounting_deposit
      x-lbonly: false
      description: |-
        銀行賬單手動導入（通用模板）。

        ### 請求參數

        - 必填：`lb_bank_account_id`（LB銀行賬戶）、`file`（文件Key）、`ext`（文件後綴）
        - 各字段的格式、取值範圍和業務含義見對應字段說明。

        ### 處理結果

        成功時完成上述業務操作；後續狀態和返回數據以 `200` 響應定義為準。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - lb_bank_account_id
                - file
                - ext
              properties:
                lb_bank_account_id:
                  type: number
                  description: LB銀行賬戶. 用於指定「LB銀行賬戶」。此字段為必填項。
                file:
                  type: string
                  description: 文件Key. 文件上傳後返回的對象存儲 Key，用於定位本次請求處理的文件。此字段為必填項。
                ext:
                  type: string
                  description: 文件後綴. 如 csv/xls/xlsx
            example:
              lb_bank_account_id: 示例用户
              file: s3-key
              ext: csv
      responses:
        '200':
          description: 請求處理成功。響應的 `data` 不包含額外業務字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。

                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`
                      判斷具體結果。

                      - `401`：未登錄。
                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登錄或登錄狀態已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 當前賬號未獲得該功能授權。請在 User Permission 中為該賬號開通相應權限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 請求處理超時。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
      x-mint:
        href: /zh-HK/api-reference/atm_bills_upload
        metadata:
          sidebarTitle: 銀行賬單手動導入（通用模板）
