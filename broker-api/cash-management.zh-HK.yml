                    lb_bank_account:
                      type: string
                      description: 公司銀行賬號. 用於按「公司銀行賬號」篩選結果。
                    bank_remark:
                      type: string
                      description: 銀行附言. 用於按「銀行附言」篩選結果。
                    bill_datetime:
                      type: object
                      description: 銀行賬務日期. 用於按「銀行賬務日期」篩選結果。
                      properties:
                        gte:
                          type: string
                          description: 大於等於. 篩選範圍的下限，匹配值包含該值。
                          format: date
                        lte:
                          type: string
                          description: 小於等於. 篩選範圍的上限，匹配值包含該值。
                          format: date
                    updated_at:
                      type: object
                      description: 更新時間. 用於按「更新時間」篩選結果。
                      properties:
                        gte:
                          type: string
                          description: 大於等於. 篩選範圍的下限，匹配值包含該值。
                          format: date
                        lte:
                          type: string
                          description: 小於等於. 篩選範圍的上限，匹配值包含該值。
                          format: date
                    amount:
                      type: object
                      description: 金額. 用於按「金額」篩選結果。
                      properties:
                        gte:
                          type: number
                          description: 大於等於. 篩選範圍的下限，匹配值包含該值。
                        lte:
                          type: number
                          description: 小於等於. 篩選範圍的上限，匹配值包含該值。
                    currency:
                      type: string
                      description: |-
                        幣種. 用於按「幣種」篩選結果。

                        候選值會動態變化。請調用 `GET /v1/datasets/refs/tenant_currencies` 獲取當前可用的數據字典，並使用返回項的 `key` 作為本參數值。
