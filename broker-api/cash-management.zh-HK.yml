  /v1/datasets/atm_bank_sec_applications:
    get:
      operationId: atm_bank_sec_applications
      summary: 銀證開戶
      tags:
        - 款项管理
      x-permission-key:
        - lb_hk_banksec.banksec_query
      x-lbonly: false
      description: |-
        查詢「銀證開戶」數據，可通過 `filters` 組合業務篩選條件，並使用 `page`、`page_size` 和 `orderBy` 控制分頁與排序。

        ### 返回結果

        成功時返回匹配的記錄列表及分頁信息。各過濾字段的用途、可選值和動態數據來源見對應字段說明。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 過濾條件. 組合業務過濾條件。省略某個過濾字段時，不按該字段篩選。
                  properties:
                    aaid:
                      type: string
                      description: 客戶. 用於按「客戶」篩選結果。
                    user_bank_card_no:
                      type: string
                      description: 客戶銀行卡號. 用於按「客戶銀行卡號」篩選結果。
                    lb_bank_account_name:
                      type: string
                      description: |-
                        銀行名稱. 用於按「銀行名稱」篩選結果。

                        候選值會動態變化。請調用 `GET /v1/datasets/refs/receiving_bank_accounts_with_names` 獲取當前可用的數據字典，並使用返回項的 `key` 作為本參數值。
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/receiving_bank_accounts_with_names
                    state:
                      type: string
                      description: |-
                        狀態. 用於按「狀態」篩選結果。

                        **可選值：**
                        - `0` - 表示待審核
                        - `1` - 表示開通中
                        - `2` - 表示已開通
                        - `3` - 表示已駁回
                        - `4` - 表示已關閉
                        - `5` - 表示已過期
                        - `8` - 表示已取消
                      enum:
                        - '0'
                        - '1'
                        - '2'
                        - '3'
                        - '4'
