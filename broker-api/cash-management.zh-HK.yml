    get:
      operationId: booking_reconciliation_batches_withdraw
      summary: 出金對賬
      tags:
        - 款项管理
      x-permission-key:
        - cmbc.reconciliation_deposit_withdraw_query
      x-lbonly: false
      description: |-
        查詢「出金對賬」數據，可通過 `filters` 組合業務篩選條件，並使用 `page`、`page_size` 和 `orderBy` 控制分頁與排序。

        ### 返回結果

        成功時返回匹配的記錄列表及分頁信息。各過濾字段的用途、可選值和動態數據來源見對應字段說明。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 過濾條件. 組合業務過濾條件。省略某個過濾字段時，不按該字段篩選。
                  properties:
                    lb_bank_account_id:
                      type: string
                      description: |-
                        銀行賬號. 用於按「銀行賬號」篩選結果。

                        候選值會動態變化。請調用 `GET /v1/datasets/refs/company_bank_account_config` 獲取當前可用的數據字典，並使用返回項的 `key` 作為本參數值。
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/company_bank_account_config
                    trade_date:
                      type: string
                      description: 對賬日期. 用於按「對賬日期」篩選結果。
                      format: date
                    currency:
                      type: string
                      description: |-
                        幣種. 用於按「幣種」篩選結果。

                        候選值會動態變化。請調用 `GET /v1/datasets/refs/tenant_currencies_by_channel` 獲取當前可用的數據字典，並使用返回項的 `key` 作為本參數值。
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/tenant_currencies_by_channel
                    state:
                      type: string
                      description: |-
                        對賬結果. 用於按「對賬結果」篩選結果。

                        **可選值：**
                        - `1` - 表示平賬
                        - `2` - 表示不一致
                      enum:
                        - '1'
                        - '2'
                page:
                  type: integer
                  description: 頁碼. 要查詢的頁碼，從 `1` 開始。
                page_size:
                  type: integer
                  description: 每頁數量. 每頁返回的記錄數量。
