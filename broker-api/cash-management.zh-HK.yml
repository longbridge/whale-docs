                        - `transfer_out` - 表示轉提現出賬
                        - `withdraw` - 表示客戶提現
                      enum:
                        - deposit
                        - deposit_register
                        - transfer_in
                        - transfer_out
                        - withdraw
                    trade_date:
                      type: string
                      description: 對賬日期. 用於按「對賬日期」篩選結果。
