        ### 返回結果

        成功時返回匹配的記錄列表及分頁信息。各過濾字段的用途、可選值和動態數據來源見對應字段說明。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 過濾條件. 組合業務過濾條件。省略某個過濾字段時，不按該字段篩選。
                  properties:
                    order_id:
                      type: string
                      description: 申請編號. 用於按「申請編號」篩選結果。
                    member_id:
                      type: string
                      description: 客戶. 用於按「客戶」篩選結果。
                    to_currency:
                      type: string
                      description: |-
                        提現幣種. 用於按「提現幣種」篩選結果。

                        候選值會動態變化。請調用 `GET /v1/datasets/refs/tenant_currencies_by_channel` 獲取當前可用的數據字典，並使用返回項的 `key` 作為本參數值。
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/tenant_currencies_by_channel
                    batch_id:
                      type: string
                      description: 批次號. 用於按「批次號」篩選結果。
                    deposit_lb_bank_account_id:
                      type: string
                      description: |-
                        原入金銀行. 用於按「原入金銀行」篩選結果。

                        候選值會動態變化。請調用 `GET /v1/datasets/refs/region_banks_no_default` 獲取當前可用的數據字典，並使用返回項的 `key` 作為本參數值。
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/region_banks_no_default
                    remark:
                      type: string
                      description: 備註. 用於按「備註」篩選結果。
                    state:
                      type: string
                      description: |-
                        提現狀態. 用於按「提現狀態」篩選結果。

                        支持多選；提交時使用英文逗號（`,`）拼接多個值。不傳時不按此字段篩選。

                        **可選值：**
                        - `0` - 表示未知
                        - `1` - 表示未處理
                        - `2` - 表示處理中
                        - `3` - 表示成功
                        - `4` - 表示失敗
                        - `5` - 表示已撤銷
                        - `6` - 表示已退還
                        - `7` - 表示更新結果審批中
                        - `8` - 表示已刪除
                      example: 0,1
                      enum:
                        - '0'
                        - '1'
                        - '2'
                        - '3'
                        - '4'
                        - '5'
                        - '6'
                        - '7'
                        - '8'
                    withdraw_type:
                      type: string
                      description: |-
                        提現類型. 用於按「提現類型」篩選結果。

                        **可選值：**
                        - `1,` - 表示用戶提現
                        - `3,` - 表示入金退還
                        - `7,` - 表示原路退回
                        - `,1` - 表示手工提現
                        - `6,` - 表示銀行端提現
                      enum:
                        - 1,
                        - 3,
                        - 7,
                        - ',1'
                        - 6,
                    bills_id:
                      type: string
                      description: 出金賬單編號. 用於按「出金賬單編號」篩選結果。
                    created_at:
                      type: object
                      description: 創建時間. 用於按「創建時間」篩選結果。
                      properties:
                        gte:
                          type: string
                          description: 大於等於. 篩選範圍的下限，匹配值包含該值。
                          format: date
                        lte:
                          type: string
                          description: 小於等於. 篩選範圍的上限，匹配值包含該值。
                          format: date
                    lb_bank_channel_id:
                      type: string
                      description: |-
                        渠道. 用於按「渠道」篩選結果。

                        候選值會動態變化。請調用 `GET /v1/datasets/refs/pending_withdraw_bank_names` 獲取當前可用的數據字典，並使用返回項的 `key` 作為本參數值。
