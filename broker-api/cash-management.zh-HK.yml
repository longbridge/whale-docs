                        - `2` - 表示不一致
                        - `3` - 表示對端不存在
                        - `4` - 表示本端不存在
                      enum:
                        - '1'
                        - '2'
                        - '3'
                        - '4'
                    match_key:
                      type: string
                      description: 加款單號. 用於按「加款單號」篩選結果。
