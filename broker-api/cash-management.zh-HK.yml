        成功時返回匹配的記錄列表及分頁信息。各過濾字段的用途、可選值和動態數據來源見對應字段說明。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 過濾條件. 組合業務過濾條件。省略某個過濾字段時，不按該字段篩選。
                  properties:
                    id:
                      type: string
                      description: 參考匯率編號. 用於按「參考匯率編號」篩選結果。
                    base_currency:
                      type: string
                      description: |-
                        基準貨幣. 用於按「基準貨幣」篩選結果。

                        候選值會動態變化。請調用 `GET /v1/datasets/refs/tenant_currencies_by_channel` 獲取當前可用的數據字典，並使用返回項的 `key` 作為本參數值。
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/tenant_currencies_by_channel
                    other_currency:
                      type: string
                      description: |-
                        折算幣種. 用於按「折算幣種」篩選結果。

                        候選值會動態變化。請調用 `GET /v1/datasets/refs/tenant_currencies_by_channel` 獲取當前可用的數據字典，並使用返回項的 `key` 作為本參數值。
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/tenant_currencies_by_channel
                    record_date:
                      type: object
                      description: 發佈日期. 用於按「發佈日期」篩選結果。
                      properties:
                        gte:
                          type: string
                          description: 大於等於. 篩選範圍的下限，匹配值包含該值。
                          format: date
                        lte:
                          type: string
                          description: 小於等於. 篩選範圍的上限，匹配值包含該值。
                          format: date
                    dt:
                      type: string
                      description: 賬務日期. 用於按「賬務日期」篩選結果。
                      format: date
                    updated_at:
                      type: object
                      description: 更新時間. 用於按「更新時間」篩選結果。
                      properties:
                        gte:
                          type: string
                          description: 大於等於. 篩選範圍的下限，匹配值包含該值。
                          format: date
                        lte:
                          type: string
                          description: 小於等於. 篩選範圍的上限，匹配值包含該值。
                          format: date
                    rate_type:
                      type: string
                      description: |-
                        匯率類型. 用於按「匯率類型」篩選結果。

                        **可選值：**
                        - `ACCOUNT` - 表示賬面匯率
                        - `CCASS` - 表示港交所
                        - `CURRENT` - 表示即期匯率
                      enum:
                        - ACCOUNT
                        - CCASS
                        - CURRENT
                    source:
                      type: string
                      description: |-
                        來源. 用於按「來源」篩選結果。

                        **可選值：**
                        - `FILE` - 表示人工文件導入
                        - `MANUEL_CREATE` - 表示單筆新增
                        - `AUTO` - 表示自動獲取
                        - `COPY` - 表示自動延續上一日
                        - `CCASS` - 表示自動跟隨港交所
                      enum:
                        - FILE
                        - MANUEL_CREATE
                        - AUTO
                        - COPY
                        - CCASS
                page:
                  type: integer
                  description: 頁碼. 要查詢的頁碼，從 `1` 開始。
                page_size:
                  type: integer
                  description: 每頁數量. 每頁返回的記錄數量。
                orderBy:
                  type: array
                  description: 排序參數. 排序規則數組；每一項定義一個排序字段及排序方向。
                  items:
                    type: object
            example:
              filters: {}
              page: 1
              page_size: 20
              orderBy: []
      responses:
        '200':
          description: 成功時分頁返回「參考彙率」記錄，以及頁碼、每頁數量和總記錄數等分頁信息。
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。

                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`
                      判斷具體結果。

                      - `401`：未登錄。
                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。
                  message:
                    type: string
                  data:
                    type: object
                    required:
                      - list
                      - total
                    properties:
                      list:
                        type: array
                        description: 列表. **返回值：** 列表列表。
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: 參考匯率編號. **返回值：** 當前記錄的唯一標識。
                            source:
                              type: string
                              description: 來源. **返回值：** 來源。
                            source_val:
                              type: string
                              description: 來源（原始值）. 字段 source 的原始值：source 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            rate_type:
                              type: string
                              description: 匯率類型. **返回值：** 匯率類型。
                            rate_type_val:
                              type: string
                              description: 匯率類型（原始值）. 字段 rate_type 的原始值：rate_type 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            custom_channel_from:
                              type: string
                              description: 匯率渠道. **返回值：** 匯率渠道。
                            other_currency:
                              type: string
                              description: 折算幣種. **返回值：** 折算幣種。
                            other_currency_val:
                              type: string
                              description: 折算幣種（原始值）. 字段 other_currency 的原始值：other_currency 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            base_currency:
                              type: string
                              description: 基準貨幣. **返回值：** 基準貨幣。
                            base_currency_val:
                              type: string
                              description: 基準貨幣（原始值）. 字段 base_currency 的原始值：base_currency 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            bid_rate:
                              type: string
                              description: 買入價. **返回值：** 買入價。
                            offer_rate:
                              type: string
                              description: 賣出價. **返回值：** 賣出價。
                            average_rate:
                              type: string
                              description: 中間折算價. **返回值：** 中間折算價。
                            record_date:
                              type: string
                              description: 發佈日期. **返回值：** 發佈日期；時間或日期格式以接口實際返回值為準。
                            dt:
                              type: string
                              description: 賬務日期. **返回值：** 賬務日期。
                            created_at:
                              type: string
                              description: 創建時間. **返回值：** 創建時間；時間或日期格式以接口實際返回值為準。
                            updated_at:
                              type: string
                              description: 更新時間. **返回值：** 更新時間；時間或日期格式以接口實際返回值為準。
                            action_user:
                              type: string
                              description: 操作人. **返回值：** 操作人。
                      total:
                        type: integer
                        description: 總條數. **返回值：** 符合查詢條件的記錄總數，用於計算分頁。
              example:
                code: 0
                message: success
                data:
                  list:
                    - id: '145422'
                      source: AUTO
                      source_val: AUTO
                      rate_type: Spot rate
                      rate_type_val: CURRENT
                      custom_channel_from: 'MDAQ '
                      other_currency: USD
                      other_currency_val: USD
