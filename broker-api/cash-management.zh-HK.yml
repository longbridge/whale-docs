  /v1/datasets/atm_withdraw_cards:
    get:
      operationId: atm_withdraw_cards
      summary: 客戶銀行卡
      tags:
        - 款项管理
      x-permission-key:
        - lb_account_withdraw_card.list
        - atm.withdrawal_marking
      x-lbonly: false
      description: |-
        查詢「客戶銀行卡」數據，可通過 `filters` 組合業務篩選條件，並使用 `page`、`page_size` 和 `orderBy` 控制分頁與排序。

        ### 返回結果

        成功時返回匹配的記錄列表及分頁信息。各過濾字段的用途、可選值和動態數據來源見對應字段說明。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 過濾條件. 組合業務過濾條件。省略某個過濾字段時，不按該字段篩選。
                  properties:
                    member_id:
                      type: string
                      description: 客戶. 用於按「客戶」篩選結果。
                    member_id_list:
                      type: string
                      description: 客戶列表. 用於按「客戶列表」篩選結果。
                    raw_member_id:
                      type: string
                      description: 客戶編號. 用於按「客戶編號」篩選結果。
                    id:
                      type: string
                      description: 客戶銀行卡編號. 用於按「客戶銀行卡編號」篩選結果。
                    account_type:
                      type: string
                      description: |-
                        幣種. 用於按「幣種」篩選結果。

                        候選值會動態變化。請調用 `GET /v1/datasets/refs/company_account_types` 獲取當前可用的數據字典，並使用返回項的 `key` 作為本參數值。
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/company_account_types
                    status:
                      type: string
                      description: |-
                        認證狀態. 用於按「認證狀態」篩選結果。

                        **可選值：**
                        - `0` - 表示未認證
                        - `1` - 表示待認證
                        - `2` - 表示已認證
                      enum:
                        - '0'
                        - '1'
                        - '2'
                    account:
                      type: string
                      description: 銀行賬號. 用於按「銀行賬號」篩選結果。
                    country:
                      type: string
                      description: 國家 / 地區. 用於按「國家 / 地區」篩選結果。
                    fps_id:
                      type: string
                      description: FPS ID. 用於按「FPS ID」篩選結果。
                    created_at:
                      type: object
                      description: 創建時間. 用於按「創建時間」篩選結果。
                      properties:
                        gte:
                          type: string
                          description: 大於等於. 篩選範圍的下限，匹配值包含該值。
                          format: date
                        lte:
                          type: string
                          description: 小於等於. 篩選範圍的上限，匹配值包含該值。
                          format: date
                    name_en:
                      type: string
                      description: 銀行卡名稱. 用於按「銀行卡名稱」篩選結果。
                    region:
                      type: string
                      description: |-
                        銀行賬戶地區. 用於按「銀行賬戶地區」篩選結果。

                        候選值會動態變化。請調用 `GET /v1/datasets/refs/regions` 獲取當前可用的數據字典，並使用返回項的 `key` 作為本參數值。
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/regions
                    bank_code:
                      type: string
                      description: |-
                        銀行代碼. 用於按「銀行代碼」篩選結果。

                        候選值會動態變化。請調用 `GET /v1/datasets/refs/region_banks_code` 獲取當前可用的數據字典，並使用返回項的 `key` 作為本參數值。
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/region_banks_code
                    multi_name:
                      type: string
                      description: 銀行名稱. 用於按「銀行名稱」篩選結果。
                page:
                  type: integer
                  description: 頁碼. 要查詢的頁碼，從 `1` 開始。
                page_size:
                  type: integer
                  description: 每頁數量. 每頁返回的記錄數量。
                orderBy:
                  type: array
                  description: 排序參數. 排序規則數組；每一項定義一個排序字段及排序方向。
                  items:
                    type: object
            example:
              filters: {}
              page: 1
              page_size: 20
              orderBy: []
      responses:
        '200':
          description: 成功時分頁返回「客戶銀行卡」記錄，以及頁碼、每頁數量和總記錄數等分頁信息。
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。

                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`
                      判斷具體結果。

                      - `401`：未登錄。
                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。
                  message:
                    type: string
                  data:
                    type: object
                    required:
                      - list
