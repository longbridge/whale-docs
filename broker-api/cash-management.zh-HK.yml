                      multi_name: '{"en":"Online Banking Transfer","zh-CN":"网银转账","zh-HK":"網銀轉帳"}'
                      multi_tag: '{"en":"[\"到账时间快英文\",\"222\",\"4453\"]","zh-CN":"[\"到账时间快\",\"0手续费\",\"3ee\"]","zh-HK":"[\"到账时间快繁体\",\"333\",\"344432\"]"}'
                      multi_introduction: '{"en":"\u003cp\u003eArrive in 2 hours via Online Funds Transfer within the same bank, and 1-3 working days for Inter-Bank Transfer. No fees will be collected from Long Bridge HK Limited, but there might be charges levied by the bank.\u003c/p\u003e","zh-CN":"\u003cp\u003e网银转账是相同银行内支持2小时内到账，跨行1-3个工作日到账，长桥不收费，银行可能收费。\u003c/p\u003e\u003cp\u003e \u003c/p\u003e\u003cp\u003e \u003c/p\u003e\u003cp\u003e \u003c/p\u003e\u003cp\u003e \u003c/p\u003e\u003cp\u003e \u003c/p\u003e\u003cp\u003e \u003c/p\u003e","zh-HK":"\u003cp\u003e網銀轉\u003cstrong\u003e賬是\u003c/strong\u003e相同銀行內支持2小時內到賬，\u003cu\u003e跨行1-3個工作日到賬，長橋不收費，银行可能收费。 \u003c/u\u003e\u003c/p\u003e"}'
                      multi_fee: '{"en":"\u003cp\u003eThe specific fees are subject to the actual charges of the bank. LB securities do not charge fees.\u003c/p\u003e","zh-CN":"\u003cp\u003e具体费用请以银行实际收取为准，长桥证券不收取费用。\u003c/p\u003e","zh-HK":"\u003cp\u003e具體費用請以銀行實際收取爲準，长桥證券不收取費用。\u003c/p\u003e"}'
                      multi_account_date: '{"en":"\u003cp\u003eHong Kong local bank transfer is expected to take 1-3 business days.\u003c/p\u003e","zh-CN":"\u003cp\u003e香港本地银行转账预计 1-3 个工作日。\u003c/p\u003e\u003cp\u003e \u003c/p\u003e\u003cp\u003e \u003c/p\u003e\u003cp\u003e \u003c/p\u003e\u003cp\u003e \u003c/p\u003e\u003cp\u003e34\u003c/p\u003e\u003cp\u003e \u003c/p\u003e","zh-HK":"\u003cp\u003e香港本地銀行轉賬預計 1-3 個工作日。\u003c/p\u003e"}'
                      multi_transfer_limit: '{"en":"\u003cp\u003eThe transfer limits are subject to the bank transfer limits. There is no limit for Longbridge securities.\u003c/p\u003e","zh-CN":"\u003cp\u003e请留意银行端是否会有转账限额，长桥证券无任何限额。\u003c/p\u003e\u003cp\u003e \u003c/p\u003e\u003cp\u003e \u003c/p\u003e\u003cp\u003e \u003c/p\u003e\u003cp\u003e \u003c/p\u003e\u003cp\u003e43\u003c/p\u003e","zh-HK":"\u003cp\u003e請留意銀行端是否會有轉賬限額，长桥證券無任何限額。\u003c/p\u003e"}'
                      multi_note: '{"en":"\u003cp\u003e英文：\u003c/p\u003e\u003cp\u003e1、注意转账流程\u003c/p\u003e\u003cp\u003e2、注意到账时间\u003c/p\u003e\u003cp\u003e3、注意转账费用\u003c/p\u003e","zh-CN":"\u003cp\u003e1、注意转账流程\u003c/p\u003e\u003cp\u003e2、注意到账时间\u003c/p\u003e\u003cp\u003e3、注意转账费用\u003c/p\u003e\u003cp\u003e \u003c/p\u003e\u003cp\u003e34\u003c/p\u003e\u003cp\u003e \u003c/p\u003e\u003cp\u003e \u003c/p\u003e","zh-HK":"\u003cp\u003e繁体：\u003c/p\u003e\u003cp\u003e1、注意转账流程\u003c/p\u003e\u003cp\u003e2、注意到账时间\u003c/p\u003e\u003cp\u003e3、注意转账费用\u003c/p\u003e"}'
