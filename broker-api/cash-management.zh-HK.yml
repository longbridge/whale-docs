                              description: 客戶銀行卡編號（原始值）. 字段 id 的原始值：id 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            member_id:
                              type: string
                              description: 客戶編號. **返回值：** 客戶編號。
                            member_id_val:
                              type: string
                              description: 客戶編號（原始值）. 字段 member_id 的原始值：member_id 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            origin_ids:
                              type: string
                              description: 證券賬號. **返回值：** 證券賬號。
                            name_en:
                              type: string
                              description: 銀行賬戶姓名. **返回值：** 銀行賬戶姓名。
                            account:
                              type: string
                              description: 銀行賬號. **返回值：** 銀行賬號。
                            fps_id:
                              type: string
                              description: FPS ID. **返回值：** FPS ID。
                            account_type:
                              type: string
                              description: 幣種. **返回值：** 幣種。
                            account_type_val:
                              type: string
                              description: 幣種（原始值）. 字段 account_type 的原始值：account_type 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            bank_multi_name:
                              type: string
                              description: 銀行名稱. **返回值：** 銀行名稱。
                            nickname:
                              type: string
                              description: 別名. **返回值：** 別名。
                            bank_code:
                              type: string
                              description: 銀行代碼. **返回值：** 銀行代碼。
                            region:
                              type: string
                              description: 銀行賬戶地區. **返回值：** 銀行賬戶地區。
                            region_val:
                              type: string
                              description: 銀行賬戶地區（原始值）. 字段 region 的原始值：region 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            country:
                              type: string
                              description: 國家 / 地區. **返回值：** 國家 / 地區。
                            province:
                              type: string
                              description: 省. **返回值：** 省。
                            city:
                              type: string
                              description: 市. **返回值：** 市。
                            postal_code:
                              type: string
                              description: 郵政編碼. **返回值：** 郵政編碼。
                            swift_code:
                              type: string
                              description: Swift Code. **返回值：** Swift Code。
                            address:
                              type: string
                              description: 收款人地址. **返回值：** 收款人地址。
                            custom_material_urls:
                              type: string
                              description: 證明材料. **返回值：** 證明材料。
                            status:
                              type: string
                              description: 出金認證狀態. **返回值：** 出金認證狀態。
                            status_val:
                              type: string
                              description: 出金認證狀態（原始值）. 字段 status 的原始值：status 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            custom_show:
                              type: string
                              description: 入金見證狀態. **返回值：** 入金見證狀態。
                            created_at:
                              type: string
                              description: 創建時間. **返回值：** 創建時間；時間或日期格式以接口實際返回值為準。
                            updated_at:
                              type: string
                              description: 更新時間. **返回值：** 更新時間；時間或日期格式以接口實際返回值為準。
                            remark:
                              type: string
                              description: 客戶輸入備註. **返回值：** 客戶輸入備註。
                            admin_comment:
                              type: string
                              description: 後台備註. **返回值：** 後台備註。
                            ticket_busi_type:
                              type: string
