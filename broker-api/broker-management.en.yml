                  description: Specifies Service.
                base_account_ids:
                  type: array
                  description: Submit Base Account IDs as a JSON array.
                  items:
                    type: string
                audit_frontend_resource:
                  type: object
                  description: Provides audit context for this operation.
            example:
              s3_key: ''
              name: ''
              type: ''
              filename: ''
              service: ''
              base_account_ids: []
              audit_frontend_resource: {}
