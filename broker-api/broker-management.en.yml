  /v1/datasets/broker_relationship_accounts:
    post:
      operationId: broker_relationship_accounts
      summary: Broker Client Relationship
      tags:
      - 经纪人管理 (Broker Management)
      x-permission-key:
      - b2b_agent_manage.list_relation
      x-lbonly: false
      description: 'Queries Broker Client Relationship data. Combine business filters in `filters`, and use `page` and `page_size` to control pagination.


        ### Response


        On success, the API returns the matching records and pagination metadata. See each filter field for its purpose, allowed values, and dynamic value source.'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: Combines business filters. Omit a filter field to disable that filter.
                  properties:
                    team_code:
                      type: string
                      description: Filters results by Team Code.
                    name:
                      type: string
                      description: Filters results by Team Name.
                    broker_code:
                      type: string
                      description: 'Filters results by Broker.


                        Values are dynamic. Call `GET /v1/datasets/refs/broker_accounts` to retrieve the current data dictionary, and use the returned entry''s `key` as this parameter''s value.'
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/broker_accounts
                    member_id:
                      type: string
                      description: Filters results by Client.
                    account_type:
                      type: string
                      description: 'Filters results by Account type.


                        **Allowed values:**

                        - `M` - Margin

                        - `C` - Cash

                        - `F` - Futures'
                      enum:
                      - M
                      - C
                      - F
                      x-enum-details:
                      - value: M
                        label: Margin
                      - value: C
                        label: Cash
                      - value: F
                        label: Futures
                page:
                  type: integer
                  description: Page number to retrieve, starting from `1`.
                page_size:
                  type: integer
                  description: Number of records to return per page.
            example:
              filters: {}
              page: 1
              page_size: 20
      responses:
        '200':
          description: On success, returns paginated Broker Client Relationship records together with pagination metadata such as the page number, page size, and total record count.
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - data
                properties:
                  code:
                    type: integer
                    description: '`0` indicates success. A non-zero value is a business error code, in which case `data` is usually empty.


                      HTTP status codes use their standard semantics. A successful request normally returns `200`; errors may return `400`, `401`, `403`, `408`, or another applicable status. Interpret the HTTP status together with the business `code`.


                      - `401`: The user is not authenticated.

                      - `403`: The current account is not authorized to use this function. Grant access through User Permission.'
                    x-enum-details:
                    - value: 0
                      label: Success
                  message:
                    type: string
                  data:
                    type: object
                    required:
                    - list
                    - total
                    properties:
                      list:
                        type: array
                        description: '**Returned value:** List of list.'
                        items:
                          type: object
                          properties:
                            display_id:
                              type: string
                              description: '**Returned value:** A/C No..'
                            real_name:
                              type: string
                              description: '**Returned value:** Name.'
                            account_type:
                              type: string
                              description: '**Returned value:** Account Type.'
                            account_type_val:
                              type: string
                              description: Raw value of `account_type`. The `account_type` field contains the display value resolved through a dictionary or related record; this field contains the underlying code or ID.
                            account_state:
                              type: string
                              description: '**Returned value:** A/C Status.'
                            account_state_val:
                              type: string
                              description: Raw value of `account_state`. The `account_state` field contains the display value resolved through a dictionary or related record; this field contains the underlying code or ID.
                            account_disable:
                              type: string
                              description: '**Returned value:** A/C Frozen Status.'
                            account_disable_val:
                              type: string
                              description: Raw value of `account_disable`. The `account_disable` field contains the display value resolved through a dictionary or related record; this field contains the underlying code or ID.
                            broker_code:
                              type: string
                              description: '**Returned value:** Broker Code.'
                            team_code:
                              type: string
                              description: '**Returned value:** Team Code.'
                            broker_state:
                              type: string
                              description: '**Returned value:** Broker State.'
                            broker_state_val:
                              type: string
                              description: Raw value of `broker_state`. The `broker_state` field contains the display value resolved through a dictionary or related record; this field contains the underlying code or ID.
                      total:
                        type: integer
                        description: '**Returned value:** Total number of matching records, used for pagination.'
              example:
                code: 0
                message: success
                data:
                  list:
                  - display_id: H00000000
                    real_name: 示例用户
                    account_type: Margin
                    account_type_val: M
                    account_state: Active
                    account_state_val: '1'
                    account_disable: Unfrozen
                    account_disable_val: 'false'
                    broker_code: LB851987964599174
                    team_code: DT0001
                    broker_state: Active
                    broker_state_val: '1'
