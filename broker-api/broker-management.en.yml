  /v1/datasets/broker_relationship_accounts/download:
    post:
      operationId: broker_relationship_accounts_download
      summary: Broker Client Relationship Export
      tags:
      - 经纪人管理 (Broker Management)
      x-permission-key:
      - b2b_agent_manage.list_relation
      x-lbonly: false
      description: 'Exports Broker Client Relationship data to a file. `filters` defines the export scope, and `down_fields` can restrict the exported columns.


        ### Export modes


        - `mode: 0`: synchronous export; the download URL is returned directly on success.

        - `mode: 1`: asynchronous export; the API first returns `file_download_id`. Call `GET /v1/datasets/download/{id}` to obtain the download URL.

        - When the export record is no longer needed, delete it with `DELETE /v1/datasets/download/{id}`.'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: Same fields as the filters of broker_relationship_accounts.yaml (the query capability).
                  properties:
                    team_code:
                      type: string
                      description: Filters results by Team Code.
                    name:
                      type: string
                      description: Filters results by Team Name.
                    broker_code:
                      type: string
                      description: 'Filters results by Broker.


                        Values are dynamic. Call `GET /v1/datasets/refs/broker_accounts` to retrieve the current data dictionary, and use the returned entry''s `key` as this parameter''s value.'
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/broker_accounts
                    member_id:
                      type: string
                      description: Filters results by Client.
                    account_type:
                      type: string
                      description: 'Filters results by Account type.


                        **Allowed values:**

                        - `M` - Margin

                        - `C` - Cash

                        - `F` - Futures'
                      enum:
                      - M
                      - C
                      - F
                      x-enum-details:
                      - value: M
                        label: Margin
                      - value: C
                        label: Cash
                      - value: F
                        label: Futures
                mode:
                  type: integer
                  default: 0
                  description: 'Defaults to `0` (synchronous mode) when omitted.


                    **Allowed values:**

                    - `0` - Sync

                    - `1` - Async'
                  enum:
                  - 0
                  - 1
                  x-enum-details:
                  - value: 0
                    label: Sync
                  - value: 1
                    label: Async
                ext:
                  type: string
                  description: 'Download file format. Defaults to `csv` when omitted.


                    **Allowed values:**

                    - `csv` - CSV

                    - `xlsx` - Excel'
                  enum:
                  - csv
                  - xlsx
                file_name:
                  type: string
                  description: Export file name. The server generates a name when omitted.
                remark:
                  type: string
                  description: Remarks to save with this operation.
                down_fields:
                  type: array
                  description: 'When omitted, all fields are exported; allowed values are listed under items.enum (the

                    same field list as the query endpoint''s data.list.items).'
                  items:
                    type: string
                    enum:
                    - display_id
                    - real_name
                    - account_type
                    - account_type_val
                    - account_state
                    - account_state_val
                    - account_disable
                    - account_disable_val
                    - broker_code
                    - team_code
                    - broker_state
                    - broker_state_val
                ticket_content:
                  type: string
                  description: Information shown to the approver when download approval is enabled for the template.
                ticket_preview_url:
                  type: string
                  description: Export approval detail URL. Used only when the export requires approval.
                hide:
                  type: integer
                  description: 'Whether to hide this export from the download-record list.


                    **Allowed values:**

                    - `0` - Not Hidden

                    - `1` - Hidden'
                  enum:
                  - 0
                  - 1
                  x-enum-details:
                  - value: 0
                    label: Not Hidden
                  - value: 1
                    label: Hidden
            example:
              filters: {}
              mode: 0
              ext: csv
              file_name: ''
              remark: ''
              down_fields: []
              ticket_content: ''
              ticket_preview_url: ''
              hide: 0
      responses:
        '200':
          description: On success, returns information about the Broker Client Relationship Export task. Synchronous exports provide a download URL directly; asynchronous exports provide `file_download_id` for subsequent status queries.
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - data
                properties:
                  code:
                    type: integer
                    description: '`0` indicates success. A non-zero value is a business error code, in which case `data` is usually empty.


                      HTTP status codes use their standard semantics. A successful request normally returns `200`; errors may return `400`, `401`, `403`, `408`, or another applicable status. Interpret the HTTP status together with the business `code`.


                      - `401`: The user is not authenticated.

                      - `403`: The current account is not authorized to use this function. Grant access through User Permission.'
                    x-enum-details:
                    - value: 0
                      label: Success
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      url:
                        type: string
                        description: 'Returned in synchronous mode (`mode: 0`); empty in asynchronous mode.'
                      file_download_id:
                        type: string
                        description: 'Returned in async mode (`mode: 1`); it is the `{id}` in

                          `GET /v1/datasets/download/{id}` / `DELETE /v1/datasets/download/{id}`: GET

                          obtains the final download URL, DELETE deletes the export record.'
                      ticket_id:
                        type: string
                        description: '**Returned value:** Approval ticket ID. Returned only when the operation starts an approval workflow.'
              example:
                code: 0
                message: success
                data:
                  url: https://b-api.longbridge.xyz/download/export_result.csv
                  file_download_id: ''
                  ticket_id: ''
        '400':
          description: Bad request. Check the business error code in `code` and the error details in `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: The user is not authenticated, or the login session has expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: The current account is not authorized to use this feature. Grant the required permission to the account in User Permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: The request timed out. Check the business error code in `code` and the error details in `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
