                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      url:
                        type: string
                        description: 'Returned in synchronous mode (`mode: 0`); empty in asynchronous mode.'
                      file_download_id:
                        type: string
                        description: 'Returned in async mode (`mode: 1`); it is the `{id}` in

