      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - type
              properties:
                s3_key:
                  type: string
                  description: Specifies S3 Key.
                name:
                  type: string
                  description: Specifies Name.
                type:
                  type: string
