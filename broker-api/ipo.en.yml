  /ob/create/record:
    post:
      operationId: ob_create_record
      summary: Create OB Sync Record
      tags:
        - IPO System
      x-permission-key:
        - ipo.ob_manage
      x-lbonly: false
      description: |-
        The endpoint shared by "New" and inline "Retry" on the Subscription Record Synchronization page, used to create an OB subscription sync record.

        ### Request parameters

        - Required: `counter_id` (Counter ID), `records` (Sync Records), `records[].channel` (Origin Channel), `records[].method` (Subscription Method), `records[].ratio` (Ratio), `records[].target_method` (Target Method), `records[].target_ratio` (Target Ratio), `is_retry` (Is Retry)
        - See each field for its format, allowed values, default behavior, and business meaning.

        ### Result

        On success, the endpoint completes the described business operation. See the `200` response schema for returned data.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - counter_id
                - records
                - records[].channel
                - records[].method
                - records[].ratio
                - records[].target_method
                - records[].target_ratio
                - is_retry
              properties:
                counter_id:
                  type: string
                  description: Counter ID. Counter ID associated with this request.
                records:
                  type: array
                  description: |-
                    Sync Records. Each item is a channel sync configuration; on create it is the selected records (rows
                    with an empty channel filtered out), and on retry it is a single-element array of the
                    current row's data.
                  items:
                    type: string
                records[].channel:
                  type: string
                  description: Origin Channel. Specifies Origin Channel. This field is required.
                records[].method:
                  type: string
                  description: Subscription Method. Specifies Subscription Method. This field is required.
                records[].ratio:
                  type: string
                  description: Ratio. A percentage value; sent as a string without the % sign, e.g. "100" means 100%.
                records[].target_method:
                  type: string
                  description: Target Method. Specifies Target Method. This field is required.
                records[].target_ratio:
                  type: string
                  description: Target Ratio. Target subscription ratio, a percentage value; sent as a string without the % sign.
                is_retry:
                  type: boolean
                  description: Is Retry. Send false for a create operation; send true for a "Retry" operation.
            example:
              counter_id: '10086'
              records:
                - channel: CH001
                  method: '1'
                  ratio: '100'
                  target_method: '2'
                  target_ratio: '100'
              is_retry: false
