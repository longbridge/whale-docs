        ### Result

        Returns the ID of the created financing batch (adjustment node).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - channel
                - counter_id
                - batch_no
                - currency
                - financing_limit
                - applicant
                - cost_charge_value
                - rate_day_count
              properties:
