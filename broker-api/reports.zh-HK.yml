      x-lbonly: false
      description: |-
        查詢某一打印批次下配置的報表清單，用於查看批次內包含哪些報表及其打印設定。

        ### 請求參數

        - 通過 `filters` 組合業務篩選條件（可選欄位見下方 filters 欄位說明），並使用 `page`、`page_size`、`orderBy` 控制分頁與排序。查詢時需指定所屬批次以限定範圍。

        ### 業務說明

        - 數據為某個批量打印批次下已加入的報表明細，每條記錄對應批次中的一張報表。

        - 每條記錄包含報表名稱、檔案類型、備註以及打印條件等資訊，其中打印條件記錄該報表導出時所用的參數配置。

        - 常用於維護批次成員，核對每張報表的導出格式與篩選條件，作為批量導出前的確認依據。

        ### 返回結果

        成功時返回匹配的記錄列表及分頁資訊。返回列含義見回應定義。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  properties:
                    title:
                      type: string
                      description: |-
                        報表名稱. 用於按「報表名稱」篩選結果。
                page:
                  type: integer
                page_size:
                  type: integer
            example:
              filters: {}
              page: 1
              page_size: 20
      responses:
        '200':
          description: 分頁返回列表。
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                    description: 0 表示成功；非 0 為業務錯誤碼，此時 data 通常為空。HTTP 狀態碼本身恆為 200，請勿依賴 HTTP status 判斷成功/失敗。
                    enum:
                      - 0
                    x-enum-details:
                      - value: 0
                        label: 成功
                  message:
                    type: string
                  data:
                    type: object
                    required:
                      - list
                      - total
                    properties:
                      list:
                        type: array
                        items:
                          type: object
                          properties:
                            title:
                              type: string
                            file_type:
                              type: string
                            remark:
                              type: string
                            export_params:
