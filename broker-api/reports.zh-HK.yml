  /crs/update_crs_data:
    post:
      operationId: update_crs_data
      summary: 編輯 CRS 數據
      tags:
        - 报表管理 (Reports)
      x-permission-key:
        - report.crs_data
      x-lbonly: false
      description: |-
        編輯 CRS（Common Reporting Standard，共同申報準則）數據，含控權人資訊。

        ### 請求參數

        - 必填：`audit_frontend_resource`（呼叫方提供的審計上下文，含變更前後的支付類型、支付金額等資訊）
        - 可選：`crs_data`（CRS 數據）、`controlling_persons`（控權人列表）
        - 各欄位的格式、取值範圍和業務含義見對應欄位說明。

        ### 業務說明

        更新 CRS 申報主體數據及其關聯控權人資訊，涉及真實稅務申報數據變更。

        ### 風險提示

        此操作會變更真實稅務申報數據，呼叫前請確認目標記錄和參數無誤。

        ### 處理結果

        成功時完成數據更新；後續狀態和返回數據以 `200` 響應定義為準。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - audit_frontend_resource
              properties:
                crs_data:
                  type: object
                  description: 用於指定「CRS 數據」。
                controlling_persons:
                  type: array
                  description: 控權人列表，以 JSON 數組形式提交。
                  items:
                    type: string
                audit_frontend_resource:
                  type: object
                  description: 含 payment_type_list/payment_amount_list/before（變更前數據）
            example:
              crs_data: {}
              controlling_persons: []
              audit_frontend_resource: {}
      responses:
        '200':
          description: 請求處理成功。響應的 `data` 不包含額外業務字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。

                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`
                      判斷具體結果。

                      - `401`：未登錄。
                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。
                    x-enum-details:
                      - value: 0
                        label: 成功
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
