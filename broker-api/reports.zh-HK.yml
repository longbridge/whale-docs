    post:
      operationId: export_task_new
      summary: 新建報表導出任務
      tags:
        - 报表管理 (Reports)
      x-permission-key:
        - lb_hk_report.report_printing
      x-lbonly: false
      description: |-
        為指定報表創建一個異步導出任務，任務生成的文件可在導出記錄中查看和下載。

        ### 請求參數

        - 必填：`report_id`（報表 ID）、`file_type`（導出文件類型）、`operator`（操作人）、`columns`（導出列）、`porter_params`（查詢條件參數）
        - 可選：`paper`（紙張大小）
        - 各字段的格式、取值範圍、默認行為和業務含義見對應字段說明。

        ### 業務說明

        導出內容由 `columns`（當前報表已排序/顯示列）與 `porter_params`（當前報表的查詢條件）共同決定，即導出與調用方所見的報表數據保持一致。`file_type` 的可選類型可能因報表而異。

        ### 處理結果

        成功時創建導出任務，任務將異步生成導出文件；具體返回內容見 `200` 響應定義。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - report_id
                - file_type
                - operator
                - columns
                - porter_params
              properties:
                report_id:
                  type: string
                  description: 要生成導出任務的報表 ID。
                file_type:
                  type: string
                  description: 報表匯出檔案類型，單選；具體可選類型可能因報表而異。
                  enum:
                    - pdf
                    - csv
                    - excel
                  x-enum-details:
                    - value: pdf
                      label: PDF
                    - value: csv
                      label: CSV
                    - value: excel
                      label: Excel
                  example: pdf
                operator:
                  type: string
                  description: 發起本次操作的人員標識，用於審計追蹤。此字段為必填項。
                columns:
                  type: array
                  description: 當前報表已排序/顯示列的 dataporter_index 列表
                  items:
                    type: string
                porter_params:
                  type: object
                  description: 當前報表列表的查詢條件（去除分頁字段 page/page_size），字段結構隨報表模板不同而不同
                paper:
                  type: string
                  description: 部分報表附帶的紙張尺寸。
            example:
              report_id: RDR039
              file_type: csv
              operator: 張三
              columns:
                - account_no
                - currency
                - balance
              porter_params:
                task_id: 03631e38-6e87-11f0-9b25-ee6ff96837f2
              paper: '77'
