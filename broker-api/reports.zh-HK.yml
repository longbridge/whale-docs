  /v1/datasets/report_crs_records/download:
    post:
      operationId: report_crs_records_download
      summary: CRS 數據查詢導出
      tags:
        - 报表管理 (Reports)
      x-permission-key:
        - report.crs_data
      x-lbonly: false
      description: |-
        將「CRS 數據」數據匯出為檔案。`filters` 決定匯出範圍，`down_fields` 可限制匯出欄位。

        ### 匯出模式

        - `mode: 0`：同步匯出，成功後直接返回下載地址。
        - `mode: 1`：非同步匯出，先返回 `file_download_id`；隨後呼叫 `GET /v1/datasets/download/{id}` 取得下載地址。
        - 不再需要匯出記錄時，可呼叫 `DELETE /v1/datasets/download/{id}` 刪除。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 字段同 report_crs_records.yaml（query 能力）裏的 filters
                  properties:
                    return_year:
                      type: string
                      description: |-
                        用於按「年度」篩選結果。

                        候選值會動態變化。請調用 `GET /v1/datasets/refs/crs_return_year` 獲取當前可用的數據字典，並使用返回項的 `key` 作為本參數值。
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/crs_return_year
                    message_type:
                      type: string
                      description: 用於按「消息類型」篩選結果。
                      enum:
                        - CRS701
                        - CRS702
                      x-enum-details:
                        - value: CRS701
                          label: 新信息 [CRS701]
                        - value: CRS702
                          label: 更正消息 [CRS702]
                      example: CRS701
                    aeoi_id:
                      type: string
                      description: |-
                        用於按「編號」篩選結果。

                        候選值會動態變化。請調用 `GET /v1/datasets/refs/crs_aeoi_id` 獲取當前可用的數據字典，並使用返回項的 `key` 作為本參數值。
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/crs_aeoi_id
                    account_no:
                      type: string
                      description: 用於按「證券賬號」篩選結果。
                    batch:
                      type: string
                      description: |-
                        用於按「批次」篩選結果。

                        候選值會動態變化。請調用 `GET /v1/datasets/refs/crs_batch` 獲取當前可用的數據字典，並使用返回項的 `key` 作為本參數值。
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/crs_batch
                    client_type:
                      type: string
                      description: 用於按「客戶類型」篩選結果。
                      enum:
                        - P
                        - O
                      x-enum-details:
                        - value: P
                          label: 個人
                        - value: O
                          label: 機構
                      example: P
                    doc_type:
                      type: string
                      description: 用於按「文檔類型」篩選結果。
                      enum:
                        - OECD1
                        - OECD2
                        - OECD3
                      x-enum-details:
                        - value: OECD1
                          label: 新上傳數據 [OECD1]
                        - value: OECD2
                          label: 更正數據 [OECD2]
                        - value: OECD3
                          label: 刪除數據 [OECD3]
                      example: OECD1
                    message:
                      type: string
                      description: |-
                        用於按「消息編號」篩選結果。

                        候選值會動態變化。請調用 `GET /v1/datasets/refs/crs_message_id` 獲取當前可用的數據字典，並使用返回項的 `key` 作為本參數值。
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/crs_message_id
                    account_state:
                      type: string
                      description: |-
                        用於按「賬戶狀態」篩選結果。

                        支持多選；提交時使用英文逗號（`,`）拼接多個值。不傳時不按此字段篩選。
                      example: -1,0
                      enum:
                        - '-1'
                        - '0'
                        - '1'
                        - '99'
                        - '4'
                        - '5'
                      x-enum-details:
                        - value: '-1'
                          label: 已註銷
                        - value: '0'
                          label: 未激活
                        - value: '1'
                          label: 激活
                        - value: '99'
                          label: 凍結
                        - value: '4'
                          label: 暫停
                        - value: '5'
                          label: 休眠
                mode:
                  type: integer
                  default: 0
                  description: 不傳時默認 0（同步）
                  enum:
                    - 0
                    - 1
                  x-enum-details:
                    - value: 0
                      label: 同步
                    - value: 1
                      label: 異步
                  example: 0
                ext:
                  type: string
                  description: 下載文件格式。不傳時默認為 `csv`。
                  enum:
                    - csv
                    - xlsx
                  x-enum-details:
                    - value: csv
                      label: CSV
                    - value: xlsx
                      label: Excel
                  example: csv
                file_name:
                  type: string
                  description: 導出文件名稱。不傳時由服務端生成。
                remark:
                  type: string
                  description: 與本次操作一並保存的備註。
                down_fields:
                  type: array
                  description: 不傳時導出全部字段；取值範圍見 items.enum（同查詢接口 data.list.items 的字段列表）
                  items:
                    type: string
                    enum:
                      - id
                      - return_year
                      - batch
                      - doc_type
                      - doc_type_val
                      - aeoi_id
                      - message
                      - message_type
                      - message_type_val
                      - account_batch
                      - account_no
                      - client_type
                      - client_type_val
                      - entity_type
                      - entity_type_val
                      - tax_id
                      - tax_country
                      - last_name
                      - first_name
                      - region
                      - address
                      - birth_date
                      - total_asset
                      - currency
                      - account_state
                      - account_state_val
                      - payment_type1
                      - payment_amount1
                      - payment_type2
                      - payment_amount2
                      - payment_type3
                      - payment_amount3
                      - payment_type4
                      - payment_amount4
                      - status
                      - status_val
                      - lock
                      - lock_val
                    example: id
                ticket_content:
                  type: string
                  description: 模板配置了下載審核工單時，供審批人查看
                ticket_preview_url:
                  type: string
                  description: 導出審批詳情地址；僅在導出需要審批時使用。
                hide:
                  type: integer
                  description: 是否在下載記錄列表中隱藏本次導出記錄。
                  enum:
                    - 0
                    - 1
                  x-enum-details:
                    - value: 0
                      label: 不隱藏
                    - value: 1
                      label: 隱藏
                  example: 0
            example:
              filters: {}
              mode: 0
              ext: csv
              file_name: ''
              remark: ''
              down_fields: []
              ticket_content: ''
              ticket_preview_url: ''
              hide: 0
      responses:
        '200':
          description: 成功時返回「CRS 數據查詢導出」任務信息。同步導出直接提供下載地址；異步導出提供用於後續查詢的 `file_download_id`。
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。

                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`
                      判斷具體結果。

                      - `401`：未登錄。
                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。
                    x-enum-details:
                      - value: 0
                        label: 成功
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      url:
                        type: string
                        description: '同步模式（`mode: 0`）下返回，異步模式下為空'
                      file_download_id:
                        type: string
                        description: |-
                          異步模式（`mode: 1`）下返回，即 `GET /v1/datasets/download/{id}` /
                          `DELETE /v1/datasets/download/{id}` 路徑中的 id：GET 獲取最終下載地址，DELETE 刪除該導出記錄。
                      ticket_id:
                        type: string
                        description: '**返回值：** 審批工單 ID。僅在本次操作觸發審批流程時返回。'
              example:
                code: 0
                message: success
                data:
                  url: https://b-api.longbridge.xyz/download/export_result.csv
                  file_download_id: ''
                  ticket_id: ''
        '400':
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登錄或登錄狀態已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 當前賬號未獲得該功能授權。請在 User Permission 中為該賬號開通相應權限。
