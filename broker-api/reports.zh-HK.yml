      x-lbonly: false
      description: |-
        查詢 CRS 申報稅務管轄區配置，維護各國家 / 地區是否需要申報及其首次申報年度。

        ### 請求參數

        - 透過 `filters` 組合業務篩選條件（可選欄位見下方 filters 欄位說明），並使用 `page`、`page_size`、`orderBy` 控制分頁與排序。

        ### 業務說明

        數據為可申報稅務管轄區清單，可按稅務管轄區、首次申報年度、是否需要申報篩選。

        每條記錄包含稅務管轄區（國家 / 地區代碼及中英文名稱）、是否需要申報，以及首次申報年度。

        常用於確定 CRS 申報覆蓋的管轄區範圍，指導申報賬戶篩選與文件生成。

        ### 返回結果

        成功時返回匹配的記錄列表及分頁資訊。返回欄位含義見響應定義。
      security:
        - bearerAuth: []
      requestBody:
