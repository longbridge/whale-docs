                              description: '**返回值：** 創建人。'
                            creator_val:
                              type: string
                              description: 字段 creator 的原始值：creator 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            created_date:
                              type: string
                              description: '**返回值：** 創建日期；時間或日期格式以接口實際返回值為準。'
                      total:
                        type: integer
                        description: '**返回值：** 符合查詢條件的記錄總數，用於計算分頁。'
              example:
