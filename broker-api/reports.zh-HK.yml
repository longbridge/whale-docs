                    required:
                      - list
                      - total
                    properties:
                      list:
                        type: array
                        description: '**返回值：** 列表列表。'
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: '**返回值：** 當前記錄的唯一標識。'
                            name:
                              type: string
                              description: '**返回值：** 批次名稱。'
                            sync_sftp:
                              type: string
                              description: '**返回值：** 同步 SFTP。'
                            sync_sftp_val:
                              type: string
                              description: 字段 sync_sftp 的原始值：sync_sftp 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            auto_export_timing:
