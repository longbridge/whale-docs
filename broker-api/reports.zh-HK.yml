  /v1/datasets/report_export_history:
    post:
      operationId: report_export_history
      summary: 單個報表打印日誌
      tags:
        - 报表管理 (Reports)
      x-permission-key:
        - report.export_history_query
      x-lbonly: false
      description: |-
        查詢單個報表的導出任務日誌，用於跟蹤單份報表的生成進度並追溯操作記錄。

        ### 請求參數

        - 透過 `filters` 組合業務篩選條件（可選欄位見下方 filters 欄位說明），並使用 `page`、`page_size`、`orderBy` 控制分頁與排序。

        ### 業務說明

        數據來源為單份報表的導出任務記錄，可按報表名稱與操作日期篩選。

        每條記錄包含報表編號、報表名稱、生成狀態（進度）、操作人（系統自動導出時標記為 `System`），以及操作時間。

        常用於查看報表生成進度、確認導出是否完成並追溯操作人。

        ### 返回結果

        成功時返回匹配的記錄列表及分頁資訊。返回欄位含義見響應定義。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 組合業務過濾條件。省略某個過濾字段時，不按該字段篩選。
                  properties:
                    report_title:
                      type: string
                      description: 用於按「報表名稱」篩選結果。
                    created_at:
                      type: object
                      description: 用於按「操作日期」篩選結果。
                      properties:
                        gte:
                          type: string
                          format: date
                          description: 篩選範圍的下限，匹配值包含該值。
                        lte:
                          type: string
                          format: date
                          description: 篩選範圍的上限，匹配值包含該值。
                page:
                  type: integer
                  description: 要查詢的頁碼，從 `1` 開始。
                page_size:
                  type: integer
                  description: 每頁返回的記錄數量。
            example:
              filters: {}
              page: 1
              page_size: 20
      responses:
        '200':
          description: 成功時分頁返回「單個報表打印日誌」記錄，以及頁碼、每頁數量和總記錄數等分頁信息。
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。

                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`
                      判斷具體結果。

                      - `401`：未登錄。
                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。
                    x-enum-details:
                      - value: 0
                        label: 成功
                  message:
                    type: string
                  data:
                    type: object
                    required:
                      - list
                      - total
                    properties:
                      list:
                        type: array
                        description: '**返回值：** 列表列表。'
                        items:
                          type: object
                          properties:
                            report_id:
                              type: string
                              description: '**返回值：** 報表編號。'
                            report_title:
                              type: string
                              description: '**返回值：** 報表名稱。'
                            progress:
                              type: string
                              description: '**返回值：** 生成狀態。'
