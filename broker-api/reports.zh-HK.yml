  /v1/datasets/report_export_batches/download:
    post:
      operationId: report_export_batches_download
      summary: 批量打印列表導出
      tags:
      - 报表管理 (Reports)
      x-permission-key:
      - report.export_batches_query
      x-lbonly: false
      description: '將「批量打印列表」數據導出為文件。`filters` 決定導出範圍，`down_fields` 可限制導出字段。


        ### 導出模式


        - `mode: 0`：同步導出，成功後直接返回下載地址。

        - `mode: 1`：異步導出，先返回 `file_download_id`；隨後調用 `GET /v1/datasets/download/{id}`
        獲取下載地址。

        - 不再需要導出記錄時，可調用 `DELETE /v1/datasets/download/{id}` 刪除。'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 字段同 report_export_batches.yaml（query 能力）裏的 filters
                  properties:
                    name:
                      type: string
                      description: 用於按「批次名稱」篩選結果。
                mode:
                  type: integer
                  default: 0
                  description: '不傳時默認 0（同步）


                    **可選值：**

                    - `0` - 表示同步

                    - `1` - 表示异步'
                  enum:
                  - 0
                  - 1
                  x-enum-details:
                  - value: 0
                    label: 同步
                  - value: 1
                    label: 异步
                ext:
                  type: string
                  description: '下載文件格式。不傳時默認為 `csv`。


                    **可選值：**

                    - `csv` - 表示 CSV

                    - `xlsx` - 表示 Excel'
                  enum:
                  - csv
                  - xlsx
                file_name:
                  type: string
                  description: 導出文件名稱。不傳時由服務端生成。
                remark:
                  type: string
                  description: 與本次操作一並保存的備註。
                down_fields:
                  type: array
                  description: 不傳時導出全部字段；取值範圍見 items.enum（同查詢接口 data.list.items 的字段列表）
                  items:
                    type: string
                    enum:
                    - id
                    - name
                    - sync_sftp
                    - sync_sftp_val
                    - auto_export_timing
                    - auto_export_timing_val
                    - report_num
                    - latest_export_user
                    - latest_export_user_val
                    - latest_exported_at
                    - creator
                    - creator_val
                    - created_date
                ticket_content:
                  type: string
                  description: 模板配置了下載審核工單時，供審批人查看
                ticket_preview_url:
                  type: string
                  description: 導出審批詳情地址；僅在導出需要審批時使用。
                hide:
                  type: integer
                  description: '是否在下載記錄列表中隱藏本次導出記錄。


                    **可選值：**

                    - `0` - 表示不隐藏

                    - `1` - 表示隐藏'
                  enum:
                  - 0
                  - 1
                  x-enum-details:
                  - value: 0
                    label: 不隐藏
                  - value: 1
                    label: 隐藏
            example:
              filters: {}
              mode: 0
              ext: csv
              file_name: ''
              remark: ''
              down_fields: []
              ticket_content: ''
              ticket_preview_url: ''
              hide: 0
      responses:
        '200':
          description: 成功時返回「批量打印列表導出」任務信息。同步導出直接提供下載地址；異步導出提供用於後續查詢的 `file_download_id`。
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - data
                properties:
                  code:
                    type: integer
                    description: '0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。


                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408`
                      等，需結合業務 `code`

                      判斷具體結果。


                      - `401`：未登錄。

                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。'
                    x-enum-details:
                    - value: 0
                      label: 成功
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      url:
                        type: string
                        description: '同步模式（`mode: 0`）下返回，異步模式下為空'
                      file_download_id:
                        type: string
                        description: '異步模式（`mode: 1`）下返回，即 `GET /v1/datasets/download/{id}`
                          /

                          `DELETE /v1/datasets/download/{id}` 路徑中的 id：GET 獲取最終下載地址，DELETE
                          刪除該導出記錄。'
                      ticket_id:
                        type: string
                        description: '**返回值：** 審批工單 ID。僅在本次操作觸發審批流程時返回。'
              example:
                code: 0
