                      - OECD2
                      - OECD3
                      x-enum-details:
                      - value: OECD1
                        label: 新上傳數據 [OECD1]
                      - value: OECD2
                        label: 更正數據 [OECD2]
                      - value: OECD3
                        label: 刪除數據 [OECD3]
                    message:
