      x-lbonly: false
      description: |-
        將「單個報表列印日誌」數據匯出為檔案。`filters` 決定匯出範圍，`down_fields` 可限制匯出欄位。

        ### 匯出模式

        - `mode: 0`：同步匯出，成功後直接返回下載地址。
