        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 組合業務過濾條件。省略某個過濾字段時，不按該字段篩選。
                  properties:
                    batch_name:
                      type: string
                      description: 用於按「批次名稱」篩選結果。
                    report_title:
                      type: string
                      description: 用於按「報表名稱」篩選結果。
                    created_at:
                      type: object
                      description: 用於按「操作日期」篩選結果。
                      properties:
                        gte:
                          type: string
                          format: date
