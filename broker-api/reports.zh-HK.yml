      x-lbonly: false
      description: |-
        查詢報表批量打印的生成日誌，用於跟蹤各批次報表的導出執行情況與結果。

        ### 請求參數

        - 通過 `filters` 組合業務篩選條件（可選欄位見下方 filters 欄位說明），並使用 `page`、`page_size`、`orderBy` 控制分頁與排序。

        ### 業務說明

        - 數據來源於批量打印觸發的報表導出任務，每條記錄對應一次批次下單張報表的生成過程。

        - 每條記錄包含批次名稱、報表編號與名稱、生成狀態、是否有數據、操作人、操作時間與生成時間等資訊，可據此確認某批次的報表是否成功產出。

        - 常用於營運核對批量導出的執行歷史，排查失敗或空數據的報表，並據結果決定是否重新導出或下載。

        ### 返回結果

        成功時返回匹配的記錄列表及分頁資訊。返回列含義見回應定義。
