                  type: string
                  description: 與本次操作一並保存的備註。
                down_fields:
                  type: array
                  description: 不傳時導出全部字段；取值範圍見 items.enum（同查詢接口 data.list.items 的字段列表）
                  items:
                    type: string
                    enum:
                      - return_year
                      - member_id
                      - account_no
                      - crs501
                      - crs502
                      - crs503
                      - crs504
                    example: return_year
