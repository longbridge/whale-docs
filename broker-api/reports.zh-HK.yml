        description: 創建時間下界（含），Unix 秒級時間戳，不傳時不限制起始時間。
      - name: created_at_lt
        in: query
        required: false
        schema:
          type: integer
        example: 1706716800
        description: 創建時間上界（含），Unix 秒級時間戳，不傳時不限制結束時間。
      - name: file_types
        in: query
        required: false
        schema:
          type: string
