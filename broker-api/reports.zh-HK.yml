                        **可選值：**

                        - `CRS701` - 表示新信息 [CRS701]

                        - `CRS702` - 表示更正消息 [CRS702]'
                      enum:
                      - CRS701
                      - CRS702
                      x-enum-details:
                      - value: CRS701
                        label: 新信息 [CRS701]
                      - value: CRS702
                        label: 更正消息 [CRS702]
                    aeoi_id:
                      type: string
                      description: '用於按「編號」篩選結果。


                        候選值會動態變化。請調用 `GET /v1/datasets/refs/crs_aeoi_id` 獲取當前可用的數據字典，並使用返回項的
                        `key` 作為本參數值。'
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/crs_aeoi_id
                    account_no:
                      type: string
                      description: 用於按「證券賬號」篩選結果。
                    batch:
                      type: string
                      description: '用於按「批次」篩選結果。


                        候選值會動態變化。請調用 `GET /v1/datasets/refs/crs_batch` 獲取當前可用的數據字典，並使用返回項的
                        `key` 作為本參數值。'
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/crs_batch
                    client_type:
                      type: string
                      description: '用於按「客戶類型」篩選結果。


                        **可選值：**

                        - `P` - 表示個人

                        - `O` - 表示機構'
                      enum:
                      - P
                      - O
                      x-enum-details:
                      - value: P
                        label: 個人
                      - value: O
                        label: 機構
