      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 字段同 report_export_history.yaml（query 能力）裏的 filters
                  properties:
                    report_title:
                      type: string
                      description: 用於按「報表名稱」篩選結果。
                    created_at:
                      type: object
                      description: 用於按「操作日期」篩選結果。
                      properties:
                        gte:
                          type: string
                          format: date
                          description: 篩選範圍的下限，匹配值包含該值。
                        lte:
                          type: string
                          format: date
                          description: 篩選範圍的上限，匹配值包含該值。
                mode:
                  type: integer
                  default: 0
                  description: 不傳時默認 0（同步）
                  enum:
                    - 0
                    - 1
                  x-enum-details:
                    - value: 0
                      label: 同步
                    - value: 1
                      label: 異步
                  example: 0
                ext:
                  type: string
                  description: 下載文件格式。不傳時默認為 `csv`。
                  enum:
                    - csv
                    - xlsx
                  x-enum-details:
                    - value: csv
                      label: CSV
                    - value: xlsx
                      label: Excel
                  example: csv
                file_name:
                  type: string
                  description: 導出文件名稱。不傳時由服務端生成。
                remark:
                  type: string
                  description: 與本次操作一並保存的備註。
                down_fields:
                  type: array
                  description: 不傳時導出全部字段；取值範圍見 items.enum（同查詢接口 data.list.items 的字段列表）
                  items:
                    type: string
                    enum:
