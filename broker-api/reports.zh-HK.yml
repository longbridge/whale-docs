      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 字段同 report_crs_records.yaml（query 能力）裏的 filters
                  properties:
                    return_year:
                      type: string
                      description: '用於按「年度」篩選結果。


                        候選值會動態變化。請調用 `GET /v1/datasets/refs/crs_return_year` 獲取當前可用的數據字典，並使用返回項的
