                  type: string
                  description: 導出審批詳情地址；僅在導出需要審批時使用。
                hide:
                  type: integer
                  description: 是否在下載記錄列表中隱藏本次導出記錄。
                  enum:
                    - 0
                    - 1
                  x-enum-details:
                    - value: 0
                      label: 不隱藏
                    - value: 1
                      label: 隱藏
                  example: 0
            example:
              filters: {}
              mode: 0
              ext: csv
              file_name: ''
              remark: ''
              down_fields: []
              ticket_content: ''
              ticket_preview_url: ''
              hide: 0
