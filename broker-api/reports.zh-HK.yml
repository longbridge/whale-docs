                      x-value-source:
                        endpoint: GET /v1/datasets/refs/crs_tax_jurisdiction
                      example: AG
                    initial_reporting_year:
                      type: string
                      description: 用於按「首次申報年度」篩選結果。
                      example: --
                    report_requirement:
                      type: string
                      description: 用於按「是否需要申報」篩選結果。
                      enum:
                        - '1'
                        - '0'
                      x-enum-details:
                        - value: '1'
                          label: 是
                        - value: '0'
                          label: 否
                      example: N
                page:
                  type: integer
                  description: 要查詢的頁碼，從 `1` 開始。
                page_size:
                  type: integer
                  description: 每頁返回的記錄數量。
            example:
              filters: {}
              page: 1
              page_size: 20
      responses:
        '200':
          description: 成功時分頁返回「申報税務管轄區查詢」記錄，以及頁碼、每頁數量和總記錄數等分頁信息。
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。

                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`
                      判斷具體結果。

                      - `401`：未登錄。
                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。
                    x-enum-details:
                      - value: 0
                        label: 成功
                  message:
                    type: string
                  data:
                    type: object
                    required:
                      - list
                      - total
                    properties:
                      list:
                        type: array
                        description: '**返回值：** 列表列表。'
                        items:
                          type: object
                          properties:
                            tj_country_name:
                              type: string
                              description: '**返回值：** 税務管轄區。'
                            tj_country_code:
                              type: string
                              description: '**返回值：** 税務管轄區代碼。'
                            report_requirement:
                              type: string
                              description: '**返回值：** 是否需要申報。'
                            report_requirement_val:
                              type: string
                              description: 字段 report_requirement 的原始值：report_requirement 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            initial_reporting_year:
                              type: string
                              description: '**返回值：** 首次申報年度。'
                      total:
                        type: integer
                        description: '**返回值：** 符合查詢條件的記錄總數，用於計算分頁。'
              example:
