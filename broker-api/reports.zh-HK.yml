  /report/export_task/list:
    get:
      operationId: export_task_list
      summary: 報表導出任務列表
      tags:
        - 报表管理 (Reports)
      x-permission-key:
        - lb_hk_report.report_export_list
      x-lbonly: false
      description: |-
        分頁查詢報表匯出任務列表。

        ### 請求參數

        - 必填：`page`（頁碼，從 1 開始）、`limit`（每頁條數）
        - 可選篩選：`report_id`（報表 ID）、`parent_id`（所屬批次 ID）、`task_id`（任務 ID）、`created_at_gt` / `created_at_lt`（建立時間區間，Unix 秒級時間戳）、`file_types`（檔案類型，多值以英文逗號分隔）、`file_name`（檔名）
        - 各篩選項不傳時不參與過濾。

        ### 返回結果

        成功時在 `data.list` 返回當前頁的匯出任務列表，每個任務的欄位含義見響應定義。
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: true
          schema:
            type: integer
          example: 1
          description: 頁碼，從 1 開始。
        - name: limit
          in: query
          required: true
          schema:
            type: integer
          example: 20
          description: 每頁返回的條數。
        - name: report_id
          in: query
          required: false
          schema:
            type: string
          description: 按報表 ID 篩選，不傳時查詢全部。
        - name: parent_id
          in: query
          required: false
          schema:
            type: integer
          description: 按所屬導出批次 ID 篩選，不傳時查詢全部。
        - name: task_id
          in: query
          required: false
          schema:
            type: integer
          description: 按導出任務 ID 篩選，不傳時查詢全部。
        - name: created_at_gt
          in: query
          required: false
          schema:
            type: integer
          example: 1704038400
          description: 創建時間下界（含），Unix 秒級時間戳，不傳時不限制起始時間。
        - name: created_at_lt
          in: query
          required: false
          schema:
            type: integer
          example: 1706716800
          description: 創建時間上界（含），Unix 秒級時間戳，不傳時不限制結束時間。
        - name: file_types
          in: query
          required: false
          schema:
            type: string
          example: pdf,xlsx
          description: 按文件類型篩選，多個類型以英文逗號分隔，不傳時查詢全部。
        - name: file_name
          in: query
          required: false
          schema:
            type: string
          description: 按文件名篩選，不傳時查詢全部。
      responses:
        '200':
          description: 請求處理成功。業務結果位於 `data.list`。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。

                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`
                      判斷具體結果。

                      - `401`：未登錄。
                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。
                    x-enum-details:
                      - value: 0
                        label: 成功
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      list:
                        type: array
                        description: 當前頁的導出任務列表。
                        items:
                          type: object
                          properties:
                            task_id:
                              type: integer
                              description: 導出任務 ID。
                            title:
                              type: string
                              description: 任務標題。
                            task_name:
                              type: string
                              description: 任務名稱。
                            progress:
                              type: integer
                              description: 任務進度百分比（`0`–`100`）。
                            file_type:
                              type: string
                              description: 導出文件類型。
                            file_size:
                              type: string
                              description: 導出文件大小。
                            created_at:
                              type: integer
                              description: 創建時間，Unix 秒級時間戳。
                            succeeded_at:
                              type: integer
                              description: 完成時間，Unix 秒級時間戳；未完成時為空或 `0`。
                            subtask_num:
                              type: integer
                              description: 子任務總數。
                            subtask_succ_num:
                              type: integer
                              description: 成功的子任務數。
                            subtask_failed_num:
                              type: integer
                              description: 失敗的子任務數。
                            subtask_owned_data_num:
                              type: integer
                              description: 子任務中導出文件有數據的數量。
                            owned_data_status:
                              type: integer
                              description: 導出文件數據狀態。
                              x-enum-details:
                                - value: -1
                                  label: 無數據
                                - value: 0
                                  label: 不參與判斷
                                - value: 1
                                  label: 有數據
                            batch_name:
                              type: string
                              description: 所屬導出批次名稱。
                            report_id:
                              type: string
                              description: 報表 ID。
                            report_title:
                              type: string
                              description: 報表標題。
                            can_download:
                              type: boolean
                              description: 是否可下載。
                            is_auto_export:
                              type: integer
                              description: 是否為自動導出任務。
                            sync_sftp_status:
                              type: integer
                              description: 同步 SFTP 狀態。
                            err_msg:
                              type: string
                              description: 失敗時的錯誤信息。
                            raw_err_msg:
                              type: string
                              description: 原始錯誤信息。
              example:
                code: 0
                message: success
                data:
                  list:
                    - task_id: 1001
                      title: 月度對賬單
