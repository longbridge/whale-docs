                        lte:
                          type: string
                          format: date
                          description: 篩選範圍的上限，匹配值包含該值。
                page:
                  type: integer
                  description: 要查詢的頁碼，從 `1` 開始。
                page_size:
                  type: integer
                  description: 每頁返回的記錄數量。
