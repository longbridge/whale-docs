                    properties:
                      list:
                        type: array
                        description: '**返回值：** 符合查詢條件的記錄列表。'
                        items:
                          type: object
                          properties:
                            biz_year:
                              type: string
                              description: '**返回值：** 財務日期。'
                            broker_code:
                              type: string
                              description: '**返回值：** 經紀人。'
                            broker_team_code:
                              type: string
                              description: '**返回值：** 經紀人組。'
                            dcp_name:
                              type: string
                              description: '**返回值：** 分傭套餐。'
                            trade_amount:
                              type: string
                              description: '**返回值：** 交易金額。'
                            currency:
                              type: string
                              description: '**返回值：** 幣種。'
                            broker_commission_amount:
                              type: string
                              description: '**返回值：** 經紀人佣金。'
                            org_commission_amount:
                              type: string
                              description: '**返回值：** 經紀行佣金。'
                            commission_amount:
                              type: string
                              description: '**返回值：** 佣金總額。'
                      total:
                        type: integer
                        description: '**返回值：** 符合查詢條件的記錄總數，用於計算分頁。'
