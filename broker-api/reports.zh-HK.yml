        - 通過 `filters` 組合業務篩選條件（可選欄位見下方 filters 欄位說明），並使用 `page`、`page_size`、`orderBy` 控制分頁與排序。

        ### 業務說明

        - 每條記錄對應一個批量打印批次，一個批次可打包多張報表並統一導出。

        - 記錄包含批次名稱、導出方式（手動或定時自動）、報表數量、是否郵件通知、是否同步至 SFTP、可見成員、創建人以及最近一次導出的操作人與時間等資訊。

        - 常用於營運維護批量打印任務、核對批次的導出配置與執行情況，並作為查看批次明細或觸發導出的入口數據。

        ### 返回結果

        成功時返回匹配的記錄列表及分頁資訊。返回列含義見回應定義。
