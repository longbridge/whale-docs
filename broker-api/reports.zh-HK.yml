                              description: '**返回值：** 打印方式。'
                            auto_export_timing_val:
                              type: string
                              description: 字段 auto_export_timing 的原始值：auto_export_timing 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            report_num:
                              type: string
                              description: '**返回值：** 報表數量。'
                            latest_export_user:
                              type: string
                              description: '**返回值：** 最近導出人。'
                            latest_export_user_val:
                              type: string
                              description: 字段 latest_export_user 的原始值：latest_export_user 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            latest_exported_at:
