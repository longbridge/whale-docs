                        label: 已註銷
                      - value: '0'
                        label: 未激活
                      - value: '1'
                        label: 激活
                      - value: '99'
                        label: 凍結
                      - value: '4'
                        label: 暫停
                      - value: '5'
                        label: 休眠
                mode:
                  type: integer
                  default: 0
                  description: '不傳時默認 0（同步）


                    **可選值：**

                    - `0` - 表示同步

                    - `1` - 表示异步'
