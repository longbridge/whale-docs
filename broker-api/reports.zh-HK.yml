openapi: 3.1.1
info:
  title: Whale OpenAPI (whale-openapi-docs 自动生成)
  version: 1.0.0
servers:
- url: https://b-api.longbridge.xyz
  description: 测试环境
- url: https://b-api.lbkrs.com
  description: 生产环境
security:
- bearerAuth: []
tags:
- name: 报表管理 (Reports)
  description: 各類財務及業務報表查詢相關的後台管理接口。
paths:
  /crs/batch_delete_crs_data:
    post:
      operationId: batch_delete_crs_data
      summary: 批量刪除 CRS 數據
      tags:
      - 报表管理 (Reports)
      x-permission-key:
      - report.crs_data
      x-lbonly: false
      description: '批量刪除 CRS 數據。


        ### 請求參數


        - 必填：`id`（記錄ID列表）

        - 各字段的格式、取值範圍和業務含義見對應字段說明。


        ### 處理結果


        成功時完成上述業務操作；後續狀態和返回數據以 `200` 響應定義為準。'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              properties:
                id:
                  type: array
                  description: 記錄ID列表，以 JSON 數組形式提交。此字段為必填項。
                  items:
                    type: string
            example:
              id:
              - '123'
      responses:
        '200':
          description: 請求處理成功。響應的 `data` 不包含額外業務字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: '0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。


                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408`
                      等，需結合業務 `code`

                      判斷具體結果。


                      - `401`：未登錄。

                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。'
                    x-enum-details:
                    - value: 0
                      label: 成功
                  message:
                    type: string
                  data:
                    type: object
                    description: "成功時 `data` 為空對象。"
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登錄或登錄狀態已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 當前賬號未獲得該功能授權。請在 User Permission 中為該賬號開通相應權限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 請求處理超時。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
  /crs/generate_crs_data:
    post:
      operationId: generate_crs_data
      summary: CRS 數據生成
      tags:
      - 报表管理 (Reports)
      x-permission-key:
      - report.crs_data
      x-lbonly: false
      description: '生成 CRS（Common Reporting Standard）數據。


        ### 請求參數


        - 必填：`return_year`（申報年度）、`aeoi_id`（AEOI ID）

        - 可選：`company_name`（公司名稱）、`retain_has_asset`（是否保留有資產的數據）、`account_state`（賬戶狀態篩選）

        - 各字段的格式、取值範圍和業務含義見對應字段說明。


        ### 處理結果


        成功時觸發 CRS 數據生成；響應的 `data` 不包含額外業務字段。'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - return_year
              - aeoi_id
              properties:
                return_year:
                  type: integer
                  description: CRS 數據的申報年度。此字段為必填項。
                  example: 2024
                aeoi_id:
                  type: string
                  description: AEOI（Automatic Exchange of Information）標識。此字段為必填項。
                company_name:
                  type: string
                  description: 申報主體公司名稱。
                retain_has_asset:
                  type: boolean
                  description: 是否僅保留有資產的數據。
                account_state:
                  type: array
                  description: 按賬戶狀態篩選，以字符串數組形式提交，不傳時不按賬戶狀態過濾。
                  items:
                    type: string
            example:
              return_year: 2024
              aeoi_id: ''
              company_name: ''
              retain_has_asset: false
              account_state: []
      responses:
        '200':
          description: 請求處理成功。響應的 `data` 不包含額外業務字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: '0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。


                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408`
                      等，需結合業務 `code`

                      判斷具體結果。


                      - `401`：未登錄。

                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。'
                    x-enum-details:
                    - value: 0
                      label: 成功
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      id:
                        type: string
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登錄或登錄狀態已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 當前賬號未獲得該功能授權。請在 User Permission 中為該賬號開通相應權限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 請求處理超時。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
  /crs/get_controlling_persons:
    post:
      operationId: get_controlling_persons
      summary: 查詢實控人
      tags:
      - 报表管理 (Reports)
      x-permission-key:
      - report.crs_data
      x-lbonly: false
      description: '根據 `account_no` 查詢實控人。


        ### 請求參數


        - 必填：`account_no`（賬戶號）


        ### 處理結果


        成功時返回該賬戶對應的實控人信息；響應的 `data` 承載實控人數據。'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - account_no
              properties:
                account_no:
                  type: string
                  description: 要查詢實控人的賬戶號。此字段為必填項。
            example:
              account_no: ''
      responses:
        '200':
          description: 請求處理成功。業務結果位於 `data`，承載該賬戶的實控人信息。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: '0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。


                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408`
                      等，需結合業務 `code`

                      判斷具體結果。


                      - `401`：未登錄。

                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。'
                    x-enum-details:
                    - value: 0
                      label: 成功
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      list:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            account_no:
                              type: string
                            res_country_code:
                              type: string
                            country_code:
                              type: string
                            tin:
                              type: string
                            first_name:
                              type: string
                            last_name:
                              type: string
                            address:
                              type: string
                            birthday:
                              type: string
                            type:
                              type: string
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登錄或登錄狀態已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 當前賬號未獲得該功能授權。請在 User Permission 中為該賬號開通相應權限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 請求處理超時。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
  /v1/datasets/report_crs_records:
    post:
      operationId: report_crs_records
      summary: CRS 數據查詢
      tags:
      - 报表管理 (Reports)
      x-permission-key:
      - report.crs_data
      x-lbonly: false
      description: '查詢「CRS 數據查詢」數據，可通過 `filters` 組合業務篩選條件，並使用 `page`、`page_size` 控制分頁。


        ### 返回結果


        成功時返回匹配的記錄列表及分頁信息。各過濾字段的用途、可選值和動態數據來源見對應字段說明。'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 組合業務過濾條件。省略某個過濾字段時，不按該字段篩選。
                  properties:
                    return_year:
                      type: string
                      description: '用於按「年度」篩選結果。


                        候選值會動態變化。請調用 `GET /v1/datasets/refs/crs_return_year` 獲取當前可用的數據字典，並使用返回項的
                        `key` 作為本參數值。'
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/crs_return_year
                    message_type:
                      type: string
                      description: '用於按「消息類型」篩選結果。


                        **可選值：**

                        - `CRS701` - 表示新信息 [CRS701]

                        - `CRS702` - 表示更正消息 [CRS702]'
                      enum:
                      - CRS701
                      - CRS702
                      x-enum-details:
                      - value: CRS701
                        label: 新信息 [CRS701]
                      - value: CRS702
                        label: 更正消息 [CRS702]
                    aeoi_id:
                      type: string
                      description: '用於按「編號」篩選結果。


                        候選值會動態變化。請調用 `GET /v1/datasets/refs/crs_aeoi_id` 獲取當前可用的數據字典，並使用返回項的
                        `key` 作為本參數值。'
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/crs_aeoi_id
                    account_no:
                      type: string
                      description: 用於按「證券賬號」篩選結果。
                    batch:
                      type: string
                      description: '用於按「批次」篩選結果。


                        候選值會動態變化。請調用 `GET /v1/datasets/refs/crs_batch` 獲取當前可用的數據字典，並使用返回項的
                        `key` 作為本參數值。'
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/crs_batch
                    client_type:
                      type: string
                      description: '用於按「客戶類型」篩選結果。


                        **可選值：**

                        - `P` - 表示個人

                        - `O` - 表示機構'
                      enum:
                      - P
                      - O
                      x-enum-details:
                      - value: P
                        label: 個人
                      - value: O
                        label: 機構
                    doc_type:
                      type: string
                      description: '用於按「文檔類型」篩選結果。


                        **可選值：**

                        - `OECD1` - 表示新上傳數據 [OECD1]

                        - `OECD2` - 表示更正數據 [OECD2]

                        - `OECD3` - 表示刪除數據 [OECD3]'
                      enum:
                      - OECD1
                      - OECD2
                      - OECD3
                      x-enum-details:
                      - value: OECD1
                        label: 新上傳數據 [OECD1]
                      - value: OECD2
                        label: 更正數據 [OECD2]
                      - value: OECD3
                        label: 刪除數據 [OECD3]
                    message:
                      type: string
                      description: '用於按「消息編號」篩選結果。


                        候選值會動態變化。請調用 `GET /v1/datasets/refs/crs_message_id` 獲取當前可用的數據字典，並使用返回項的
                        `key` 作為本參數值。'
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/crs_message_id
                    account_state:
                      type: string
                      description: '用於按「賬戶狀態」篩選結果。


                        支持多選；提交時使用英文逗號（`,`）拼接多個值。不傳時不按此字段篩選。


                        **可選值：**

                        - `-1` - 表示已註銷

                        - `0` - 表示未激活

                        - `1` - 表示激活

                        - `99` - 表示凍結

                        - `4` - 表示暫停

                        - `5` - 表示休眠'
                      example: -1,0
                      enum:
                      - '-1'
                      - '0'
                      - '1'
                      - '99'
                      - '4'
                      - '5'
                      x-enum-details:
                      - value: '-1'
                        label: 已註銷
                      - value: '0'
                        label: 未激活
                      - value: '1'
                        label: 激活
                      - value: '99'
                        label: 凍結
                      - value: '4'
                        label: 暫停
                      - value: '5'
                        label: 休眠
                page:
                  type: integer
                  description: 要查詢的頁碼，從 `1` 開始。
                page_size:
                  type: integer
                  description: 每頁返回的記錄數量。
            example:
              filters: {}
              page: 1
              page_size: 20
      responses:
        '200':
          description: 成功時分頁返回「CRS 數據查詢」記錄，以及頁碼、每頁數量和總記錄數等分頁信息。
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - data
                properties:
                  code:
                    type: integer
                    description: '0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。


                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408`
                      等，需結合業務 `code`

                      判斷具體結果。


                      - `401`：未登錄。

                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。'
                    x-enum-details:
                    - value: 0
                      label: 成功
                  message:
                    type: string
                  data:
                    type: object
                    required:
                    - list
                    - total
                    properties:
                      list:
                        type: array
                        description: '**返回值：** 列表列表。'
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: '**返回值：** 當前記錄的唯一標識。'
                            return_year:
                              type: string
                              description: '**返回值：** 年度。'
                            batch:
                              type: string
                              description: '**返回值：** 批次。'
                            doc_type:
                              type: string
                              description: '**返回值：** 文檔類型。'
                            doc_type_val:
                              type: string
                              description: 字段 doc_type 的原始值：doc_type 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            aeoi_id:
                              type: string
                              description: '**返回值：** 編號。'
                            message:
                              type: string
                              description: '**返回值：** 消息編號。'
                            message_type:
                              type: string
                              description: '**返回值：** 消息類型。'
                            message_type_val:
                              type: string
                              description: 字段 message_type 的原始值：message_type 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            account_batch:
                              type: string
                              description: '**返回值：** 客戶批次。'
                            account_no:
                              type: string
                              description: '**返回值：** 證券賬號。'
                            client_type:
                              type: string
                              description: '**返回值：** 客戶類型。'
                            client_type_val:
                              type: string
                              description: 字段 client_type 的原始值：client_type 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            entity_type:
                              type: string
                              description: '**返回值：** 企業實體。'
                            entity_type_val:
                              type: string
                              description: 字段 entity_type 的原始值：entity_type 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            tax_id:
                              type: string
                              description: '**返回值：** 納税人識別號。'
                            tax_country:
                              type: string
                              description: '**返回值：** 報税國家代碼。'
                            last_name:
                              type: string
                              description: '**返回值：** 姓。'
                            first_name:
                              type: string
                              description: '**返回值：** 名。'
                            region:
                              type: string
                              description: '**返回值：** 居住國家。'
                            address:
                              type: string
                              description: '**返回值：** 客戶地址。'
                            birth_date:
                              type: string
                              description: '**返回值：** 生日；時間或日期格式以接口實際返回值為準。'
                            total_asset:
                              type: string
                              description: '**返回值：** 財務餘額。'
                            currency:
                              type: string
                              description: '**返回值：** 貨幣。'
                            account_state:
                              type: string
                              description: '**返回值：** 賬戶狀態。'
                            account_state_val:
                              type: string
                              description: 字段 account_state 的原始值：account_state 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            payment_type1:
                              type: string
                              description: '**返回值：** 支付類型 1。'
                            payment_amount1:
                              type: string
                              description: '**返回值：** 支付金額 1。'
                            payment_type2:
                              type: string
                              description: '**返回值：** 支付類型 2。'
                            payment_amount2:
                              type: string
                              description: '**返回值：** 支付金額 2。'
                            payment_type3:
                              type: string
                              description: '**返回值：** 支付類型 3。'
                            payment_amount3:
                              type: string
                              description: '**返回值：** 支付金額 3。'
                            payment_type4:
                              type: string
                              description: '**返回值：** 支付類型 4。'
                            payment_amount4:
                              type: string
                              description: '**返回值：** 支付金額 4。'
                            status:
                              type: string
                              description: '**返回值：** 狀態。'
                            status_val:
                              type: string
