                    - lock
                    - lock_val
                ticket_content:
                  type: string
                  description: 模板配置了下載審核工單時，供審批人查看
                ticket_preview_url:
                  type: string
                  description: 導出審批詳情地址；僅在導出需要審批時使用。
                hide:
                  type: integer
                  description: '是否在下載記錄列表中隱藏本次導出記錄。


                    **可選值：**

                    - `0` - 表示不隐藏

                    - `1` - 表示隐藏'
                  enum:
                  - 0
                  - 1
                  x-enum-details:
                  - value: 0
                    label: 不隐藏
                  - value: 1
                    label: 隐藏
