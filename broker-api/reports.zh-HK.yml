                  properties:
                    name:
                      type: string
                      description: 用於按「批次名稱」篩選結果。
                      example: qqqqq
                page:
                  type: integer
                  description: 要查詢的頁碼，從 `1` 開始。
                page_size:
                  type: integer
                  description: 每頁返回的記錄數量。
            example:
              filters: {}
              page: 1
              page_size: 20
      responses:
        '200':
          description: 成功時分頁返回「批量打印列表」記錄，以及頁碼、每頁數量和總記錄數等分頁信息。
