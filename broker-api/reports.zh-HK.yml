                  type: string
                  description: '下載文件格式。不傳時默認為 `csv`。


                    **可選值：**

                    - `csv` - 表示 CSV

                    - `xlsx` - 表示 Excel'
                  enum:
                  - csv
                  - xlsx
                file_name:
                  type: string
                  description: 導出文件名稱。不傳時由服務端生成。
                remark:
                  type: string
                  description: 與本次操作一並保存的備註。
                down_fields:
                  type: array
                  description: 不傳時導出全部字段；取值範圍見 items.enum（同查詢接口 data.list.items 的字段列表）
                  items:
                    type: string
                    enum:
                    - report_id
                    - report_title
                    - progress
                    - progress_val
                    - created_at
                    - creator
                    - creator_val
                ticket_content:
                  type: string
                  description: 模板配置了下載審核工單時，供審批人查看
                ticket_preview_url:
                  type: string
                  description: 導出審批詳情地址；僅在導出需要審批時使用。
                hide:
                  type: integer
                  description: '是否在下載記錄列表中隱藏本次導出記錄。


                    **可選值：**

                    - `0` - 表示不隐藏

                    - `1` - 表示隐藏'
                  enum:
                  - 0
                  - 1
                  x-enum-details:
                  - value: 0
                    label: 不隐藏
                  - value: 1
                    label: 隐藏
            example:
              filters: {}
              mode: 0
              ext: csv
              file_name: ''
              remark: ''
              down_fields: []
              ticket_content: ''
              ticket_preview_url: ''
              hide: 0
      responses:
        '200':
          description: 成功時返回「單個報表打印日誌導出」任務信息。同步導出直接提供下載地址；異步導出提供用於後續查詢的 `file_download_id`。
