        ### 業務說明

        `data` 為報表參數的完整設置內容，提交後將更新該報表在生成與查詢時使用的參數配置。

        ### 處理結果

        成功時保存報表參數設置；後續狀態和返回數據以 `200` 響應定義為準。
      security:
