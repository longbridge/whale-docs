                      x-value-source:
                        endpoint: GET /v1/datasets/refs/broker_accounts_for_select
                mode:
                  type: integer
                  default: 0
                  description: '不傳時默認 0（同步）


                    **可選值：**

                    - `0` - 表示同步

                    - `1` - 表示异步'
                  enum:
                  - 0
                  - 1
                  x-enum-details:
                  - value: 0
