                      progress: 100
                      file_type: pdf
                      file_size: 1.2MB
                      created_at: 1704038400
                      succeeded_at: 1704038460
                      subtask_num: 3
                      subtask_succ_num: 3
                      subtask_failed_num: 0
                      subtask_owned_data_num: 3
                      owned_data_status: 1
                      batch_name: 批次20250115
                      report_id: R-0001
                      report_title: 月度對賬單
                      can_download: true
                      is_auto_export: 0
                      sync_sftp_status: 0
                      err_msg: ''
                      raw_err_msg: ''
        '400':
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登錄或登錄狀態已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 當前賬號未獲得該功能授權。請在 User Permission 中為該賬號開通相應權限。
          content:
            application/json:
