        數據按財務年度、經紀人、經紀人組、分傭套餐及幣種匯總，可按財務年度、幣種、經紀人篩選。

        每條記錄包含交易金額、佣金總額、經紀人佣金、經紀行佣金及幣種。

        常用於核對各經紀人在不同分傭套餐下的年度成交規模與佣金分成情況。

        ### 返回結果

        成功時返回匹配的記錄列表及分頁資訊。返回欄位含義見響應定義。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 組合業務過濾條件。省略某個過濾字段時，不按該字段篩選。
                  properties:
                    biz_year:
                      type: string
                      description: 用於按「財務日期」篩選結果。
                      example: '2026'
                    currency:
                      type: string
                      description: |-
                        用於按「幣種」篩選結果。

                        候選值會動態變化。請調用 `GET /v1/datasets/refs/tenant_currencies` 獲取當前可用的數據字典，並使用返回項的 `key` 作為本參數值。
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/tenant_currencies
                      example: USD
                    broker_code:
                      type: string
                      description: |-
                        用於按「經紀人」篩選結果。

                        候選值會動態變化。請調用 `GET /v1/datasets/refs/broker_accounts_for_select` 獲取當前可用的數據字典，並使用返回項的 `key` 作為本參數值。
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/broker_accounts_for_select
                      example: '12'
                page:
                  type: integer
                  description: 要查詢的頁碼，從 `1` 開始。
                page_size:
                  type: integer
                  description: 每頁返回的記錄數量。
            example:
              filters: {}
              page: 1
              page_size: 20
      responses:
        '200':
          description: 成功時分頁返回「傭金年報表」記錄，以及頁碼、每頁數量和總記錄數等分頁信息。
          content:
            application/json:
              schema:
                type: object
                required:
