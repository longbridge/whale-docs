                      - value: HAS
                        label: HAS
                      - value: EU
                        label: 欧洲市场
                      - value: UT
                        label: UT
                      - value: GTMMF
                        label: GTMMF
                    currency:
                      type: string
                      description: '用于按「币种」筛选结果。


                        候选值会动态变化。请调用 `GET /v1/datasets/refs/tenant_currencies_by_channel` 获取当前可用的数据字典，并使用返回项的 `key` 作为本参数值。'
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/tenant_currencies_by_channel
                    biz_type:
                      type: string
                      description: '用于按「业务类型」筛选结果。


                        **可选值：**

                        - `-1` - 表示基金交易

                        - `1` - 表示股票交易

                        - `2` - 表示融资利息

                        - `3` - 表示存款利息

                        - `4` - 表示出金交易

                        - `5` - 表示期权交易

                        - `6` - 表示转仓手续费

                        - `7` - 表示证券组合费

                        - `8` - 表示融券

                        - `-2` - 表示 IPO

                        - `14` - 表示场外交易'
                      enum:
                      - '-1'
                      - '1'
                      - '2'
                      - '3'
