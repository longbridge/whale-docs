                  - value: 0
                    label: 同步
                  - value: 1
                    label: 异步
                ext:
                  type: string
                  description: '下载文件格式。不传时默认为 `csv`。


                    **可选值：**

                    - `csv` - 表示 CSV

                    - `xlsx` - 表示 Excel'
                  enum:
                  - csv
                  - xlsx
                file_name:
                  type: string
                  description: 导出文件名称。不传时由服务端生成。
                remark:
                  type: string
                  description: 与本次操作一并保存的备注。
                down_fields:
                  type: array
                  description: 不传时导出全部字段；取值范围见 items.enum（同查询接口 data.list.items 的字段列表）
                  items:
                    type: string
                    enum:
                    - dcp_code
                    - name
                    - non_neg
                    - non_neg_val
                    - profit_target
                    - profit_target_val
                    - op_user_name
                    - created_at
                    - updated_at
                ticket_content:
                  type: string
                  description: 模板配置了下载审核工单时，供审批人查看
                ticket_preview_url:
                  type: string
                  description: 导出审批详情地址；仅在导出需要审批时使用。
                hide:
                  type: integer
                  description: '是否在下载记录列表中隐藏本次导出记录。


                    **可选值：**

                    - `0` - 表示不隐藏

                    - `1` - 表示隐藏'
                  enum:
                  - 0
                  - 1
                  x-enum-details:
                  - value: 0
                    label: 不隐藏
                  - value: 1
                    label: 隐藏
            example:
              filters: {}
              mode: 0
              ext: csv
              file_name: ''
              remark: ''
              down_fields: []
              ticket_content: ''
              ticket_preview_url: ''
              hide: 0
      responses:
        '200':
          description: 成功时返回「分佣套餐管理导出」任务信息。同步导出直接提供下载地址；异步导出提供用于后续查询的 `file_download_id`。
