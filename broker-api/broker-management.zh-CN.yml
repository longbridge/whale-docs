openapi: 3.1.1
info:
  title: Whale OpenAPI (whale-openapi-docs 自动生成)
  version: 1.0.0
servers:
- url: https://b-api.longbridge.xyz
  description: 测试环境
- url: https://b-api.lbkrs.com
  description: 生产环境
security:
- bearerAuth: []
tags:
- name: 经纪人管理 (Broker Management)
  description: 经纪人关系、团队、分成套餐、佣金分成等经纪人业务管理接口。
paths:
  /account/import:
    post:
      operationId: account_import
      summary: 批量导入经纪人-客户关系
      tags:
      - 经纪人管理 (Broker Management)
      x-permission-key:
      - account.apply_edit_member
      - account.modify_transaction_channel
      - account.suspend_account
      - account.update_appid
      - b2b_customer.submit_account
      - kyc.update_account_info
      - ticket.import_agent
      - ticket.import_relation
      x-lbonly: false
      description: '批量导入经纪人与客户的绑定关系。先上传关系文件，再用返回的文件标识提交导入。


        ### 请求参数


        - 必填：`type`（导入文件类型）

        - 可选：`s3_key`（上传文件 S3 Key）、`name`（名称）、`filename`（文件名）、`service`（服务标识）、`base_account_ids`（基础账号ID列表）、`audit_frontend_resource`（审计上下文）

        - 各字段的格式、取值范围、默认行为和业务含义见对应字段说明。


        ### 处理结果


        成功时完成所述业务操作，具体返回内容见 `200` 响应定义。'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - type
              properties:
                s3_key:
                  type: string
                  description: 文件上传后返回的对象存储 Key，用于定位本次请求处理的文件。
                name:
                  type: string
                  description: 用于指定「名称」。
                type:
                  type: string
                  description: 用于指定「导入文件类型」。此字段为必填项。
                filename:
                  type: string
                  description: 本次请求处理的文件名，包含文件扩展名。
                service:
                  type: string
                  description: 用于指定「服务标识」。
                base_account_ids:
                  type: array
                  description: 基础账号ID列表，以 JSON 数组形式提交。
                  items:
                    type: string
                audit_frontend_resource:
                  type: object
                  description: 调用方提交的审计上下文，用于记录本次操作。
            example:
              s3_key: ''
              name: ''
              type: ''
              filename: ''
              service: ''
              base_account_ids: []
              audit_frontend_resource: {}
      responses:
        '200':
          description: 请求处理成功。响应的 `data` 不包含额外业务字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: '0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。


                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code` 判断具体结果。


                      - `401`：未登录。

                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。'
                    x-enum-details:
                    - value: 0
                      label: 成功
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登录或登录状态已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 当前账号未获得该功能授权。请在 User Permission 中为该账号开通相应权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 请求处理超时。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
  /v1/datasets/broker_relationship_accounts:
    post:
      operationId: broker_relationship_accounts
      summary: 经纪人客户关系
      tags:
      - 经纪人管理 (Broker Management)
      x-permission-key:
      - b2b_agent_manage.list_relation
      x-lbonly: false
      description: '查询「经纪人客户关系」数据，可通过 `filters` 组合业务筛选条件，并使用 `page`、`page_size` 控制分页。


        ### 返回结果


        成功时返回匹配的记录列表及分页信息。各过滤字段的用途、可选值和动态数据来源见对应字段说明。'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 组合业务过滤条件。省略某个过滤字段时，不按该字段筛选。
                  properties:
                    team_code:
                      type: string
                      description: 用于按「团队编号」筛选结果。
                    name:
                      type: string
                      description: 用于按「团队名称」筛选结果。
                    broker_code:
                      type: string
                      description: '用于按「经纪人」筛选结果。


                        候选值会动态变化。请调用 `GET /v1/datasets/refs/broker_accounts` 获取当前可用的数据字典，并使用返回项的 `key` 作为本参数值。'
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/broker_accounts
                    member_id:
                      type: string
                      description: 用于按「客户」筛选结果。
                    account_type:
                      type: string
                      description: '用于按「账户类型」筛选结果。


                        **可选值：**

                        - `M` - 表示融资账户

                        - `C` - 表示现金账户

                        - `F` - 表示期货账户'
                      enum:
                      - M
                      - C
                      - F
                      x-enum-details:
                      - value: M
                        label: 融资账户
                      - value: C
                        label: 现金账户
                      - value: F
                        label: 期货账户
                page:
                  type: integer
                  description: 要查询的页码，从 `1` 开始。
                page_size:
                  type: integer
                  description: 每页返回的记录数量。
            example:
              filters: {}
              page: 1
              page_size: 20
      responses:
        '200':
          description: 成功时分页返回「经纪人客户关系」记录，以及页码、每页数量和总记录数等分页信息。
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - data
                properties:
                  code:
                    type: integer
                    description: '0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。


                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code` 判断具体结果。


                      - `401`：未登录。

                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。'
                    x-enum-details:
                    - value: 0
                      label: 成功
                  message:
                    type: string
                  data:
                    type: object
                    required:
                    - list
                    - total
                    properties:
                      list:
                        type: array
                        description: '**返回值：** 列表列表。'
                        items:
                          type: object
                          properties:
                            display_id:
                              type: string
                              description: '**返回值：** 证券账号。'
                            real_name:
                              type: string
                              description: '**返回值：** 客户姓名。'
                            account_type:
                              type: string
                              description: '**返回值：** 账户类型。'
                            account_type_val:
                              type: string
                              description: 字段 account_type 的原始值：account_type 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            account_state:
                              type: string
                              description: '**返回值：** 账户状态。'
                            account_state_val:
                              type: string
                              description: 字段 account_state 的原始值：account_state 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            account_disable:
                              type: string
                              description: '**返回值：** 账户冻结状态。'
                            account_disable_val:
                              type: string
                              description: 字段 account_disable 的原始值：account_disable 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            broker_code:
                              type: string
                              description: '**返回值：** 经纪人编号。'
                            team_code:
                              type: string
                              description: '**返回值：** 所属团队。'
                            broker_state:
                              type: string
                              description: '**返回值：** 经纪人状态。'
                            broker_state_val:
                              type: string
                              description: 字段 broker_state 的原始值：broker_state 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                      total:
                        type: integer
                        description: '**返回值：** 符合查询条件的记录总数，用于计算分页。'
              example:
                code: 0
                message: success
                data:
                  list:
                  - display_id: H00000000
                    real_name: 示例用户
                    account_type: Margin
                    account_type_val: M
                    account_state: Active
                    account_state_val: '1'
                    account_disable: Unfrozen
                    account_disable_val: 'false'
                    broker_code: LB851987964599174
                    team_code: DT0001
                    broker_state: Active
                    broker_state_val: '1'
                  total: 1272276
        '400':
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登录或登录状态已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 当前账号未获得该功能授权。请在 User Permission 中为该账号开通相应权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 请求处理超时。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
      x-post-fallback: true
      x-dataset-download:
        method: POST
        path: /v1/datasets/broker_relationship_accounts/download
