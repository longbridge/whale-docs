                  properties:
                    name:
                      type: string
                      description: 用于按「分成套餐名称」筛选结果。
                mode:
                  type: integer
                  default: 0
                  description: '不传时默认 0（同步）


                    **可选值：**

                    - `0` - 表示同步

                    - `1` - 表示异步'
                  enum:
                  - 0
                  - 1
