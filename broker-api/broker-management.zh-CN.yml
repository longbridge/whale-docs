      x-description-hk: Broker API Gateway 返回的錯誤響應結構。`code` 為業務錯誤碼，`message` 為錯誤信息，`data` 通常為空。
      x-description-en: Error response returned by Broker API Gateway. `code` is the business error code, `message` contains the error details, and `data` is usually empty.
      required:
      - code
      - message
      - data
