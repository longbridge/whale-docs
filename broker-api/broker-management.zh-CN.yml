  /v1/datasets/broker_relationship_accounts/download:
    post:
      operationId: broker_relationship_accounts_download
      summary: 经纪人客户关系导出
      tags:
      - 经纪人管理 (Broker Management)
      x-permission-key:
      - b2b_agent_manage.list_relation
      x-lbonly: false
      description: '将「经纪人客户关系」数据导出为文件。`filters` 决定导出范围，`down_fields` 可限制导出字段。


        ### 导出模式


        - `mode: 0`：同步导出，成功后直接返回下载地址。

        - `mode: 1`：异步导出，先返回 `file_download_id`；随后调用 `GET /v1/datasets/download/{id}` 获取下载地址。

        - 不再需要导出记录时，可调用 `DELETE /v1/datasets/download/{id}` 删除。'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 字段同 broker_relationship_accounts.yaml（query 能力）里的 filters
                  properties:
                    team_code:
                      type: string
                      description: 用于按「团队编号」筛选结果。
                    name:
                      type: string
                      description: 用于按「团队名称」筛选结果。
                    broker_code:
                      type: string
                      description: '用于按「经纪人」筛选结果。


                        候选值会动态变化。请调用 `GET /v1/datasets/refs/broker_accounts` 获取当前可用的数据字典，并使用返回项的 `key` 作为本参数值。'
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/broker_accounts
                    member_id:
                      type: string
                      description: 用于按「客户」筛选结果。
                    account_type:
                      type: string
                      description: '用于按「账户类型」筛选结果。


                        **可选值：**

                        - `M` - 表示融资账户

                        - `C` - 表示现金账户

                        - `F` - 表示期货账户'
                      enum:
                      - M
                      - C
                      - F
                      x-enum-details:
                      - value: M
                        label: 融资账户
                      - value: C
                        label: 现金账户
                      - value: F
                        label: 期货账户
                mode:
                  type: integer
                  default: 0
                  description: '不传时默认 0（同步）


                    **可选值：**

                    - `0` - 表示同步

                    - `1` - 表示异步'
                  enum:
                  - 0
                  - 1
                  x-enum-details:
                  - value: 0
                    label: 同步
                  - value: 1
                    label: 异步
                ext:
                  type: string
                  description: '下载文件格式。不传时默认为 `csv`。


                    **可选值：**

                    - `csv` - 表示 CSV

                    - `xlsx` - 表示 Excel'
                  enum:
                  - csv
                  - xlsx
                file_name:
                  type: string
                  description: 导出文件名称。不传时由服务端生成。
                remark:
                  type: string
                  description: 与本次操作一并保存的备注。
                down_fields:
                  type: array
                  description: 不传时导出全部字段；取值范围见 items.enum（同查询接口 data.list.items 的字段列表）
                  items:
                    type: string
                    enum:
                    - display_id
                    - real_name
                    - account_type
                    - account_type_val
                    - account_state
                    - account_state_val
                    - account_disable
                    - account_disable_val
                    - broker_code
                    - team_code
                    - broker_state
                    - broker_state_val
                ticket_content:
                  type: string
                  description: 模板配置了下载审核工单时，供审批人查看
                ticket_preview_url:
                  type: string
                  description: 导出审批详情地址；仅在导出需要审批时使用。
                hide:
                  type: integer
                  description: '是否在下载记录列表中隐藏本次导出记录。


                    **可选值：**

                    - `0` - 表示不隐藏

                    - `1` - 表示隐藏'
                  enum:
                  - 0
                  - 1
                  x-enum-details:
                  - value: 0
                    label: 不隐藏
                  - value: 1
                    label: 隐藏
            example:
              filters: {}
              mode: 0
              ext: csv
              file_name: ''
              remark: ''
              down_fields: []
              ticket_content: ''
              ticket_preview_url: ''
              hide: 0
      responses:
        '200':
          description: 成功时返回「经纪人客户关系导出」任务信息。同步导出直接提供下载地址；异步导出提供用于后续查询的 `file_download_id`。
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - data
                properties:
                  code:
                    type: integer
                    description: '0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。


                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code` 判断具体结果。


                      - `401`：未登录。

                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。'
                    x-enum-details:
                    - value: 0
                      label: 成功
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      url:
                        type: string
                        description: '同步模式（`mode: 0`）下返回，异步模式下为空'
                      file_download_id:
                        type: string
                        description: '异步模式（`mode: 1`）下返回，即 `GET /v1/datasets/download/{id}` /

                          `DELETE /v1/datasets/download/{id}` 路径中的 id：GET 获取最终下载地址，DELETE 删除该导出记录。'
                      ticket_id:
                        type: string
                        description: '**返回值：** 审批工单 ID。仅在本次操作触发审批流程时返回。'
              example:
                code: 0
                message: success
                data:
                  url: https://b-api.longbridge.xyz/download/export_result.csv
                  file_download_id: ''
                  ticket_id: ''
        '400':
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登录或登录状态已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 当前账号未获得该功能授权。请在 User Permission 中为该账号开通相应权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 请求处理超时。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
      x-dataset-parent:
        method: POST
        path: /v1/datasets/broker_relationship_accounts
        operationId: broker_relationship_accounts
  /account/biz_assign_broker_account:
    post:
      operationId: biz_assign_broker_account
      summary: 经纪人下级管理
      tags:
      - 经纪人管理 (Broker Management)
      x-permission-key:
      - b2b_agent_manage.downline_agent
      x-lbonly: false
      description: '为指定经纪人设置其管理的下级经纪人列表。


        ### 请求参数


        - 必填：`broker_code`（经纪人编号）、`broker_codes`（管理的下级经纪人编号列表）

        - 各字段的格式、取值范围和业务含义见对应字段说明。


        ### 处理结果


        成功时更新该经纪人管理的下级经纪人列表，业务结果位于 `data`；请结合业务 `code` 判断是否成功。'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - broker_code
              - broker_codes
              properties:
                broker_code:
                  type: string
                  description: 经纪人编号。
                broker_codes:
                  type: array
                  items:
                    type: string
                  description: 管理的下级经纪人编号列表。
                  example:
                  - AE002
                  - AE003
            example:
              broker_code: AE001
              broker_codes:
              - AE002
              - AE003
      responses:
        '200':
          description: 请求处理成功。业务结果位于 `data`。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: '0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。


                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code` 判断具体结果。


                      - `401`：未登录。

                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。'
                    x-enum-details:
                    - value: 0
                      label: 成功
                  message:
                    type: string
                  data:
                    type: object
                    description: 业务结果，通常为空对象。
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登录或登录状态已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 当前账号未获得该功能授权。请在 User Permission 中为该账号开通相应权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 请求处理超时。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
  /account/biz_update_broker_account:
    post:
      operationId: biz_update_broker_account
      summary: 修改经纪人信息
      tags:
      - 经纪人管理 (Broker Management)
