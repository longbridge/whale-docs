  /v1/datasets/aml_suspicious_events:
    post:
      operationId: aml_suspicious_events
      summary: 可疑事件列表
      tags:
        - 可疑事件監控
      x-permission-key:
        - account.sem_query
      x-lbonly: false
      description: |-
        查詢「可疑事件列表」（反洗錢可疑事件）數據，可透過 `filters` 組合業務篩選條件，並使用 `page`、`page_size` 控制分頁。

        ### 返回結果

        成功時返回匹配的記錄列表及分頁資訊。各過濾欄位的用途、可選值和動態數據來源見對應欄位說明。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 組合業務過濾條件。省略某個過濾字段時，不按該字段篩選。
                  properties:
                    member_id:
                      type: string
                      description: 用於按「客戶」篩選結果。
                    tigger_indicator:
                      type: string
                      description: |-
                        用於按「觸發指標」篩選結果。

                        支持多選；提交時使用英文逗號（`,`）拼接多個值。不傳時不按此字段篩選。
                      example: Trading Anomaly
                      enum:
                        - '1'
                        - '2'
                        - '3'
                      x-enum-details:
                        - value: '1'
                          label: 出入金異常
                        - value: '2'
                          label: 交易異常
                        - value: '3'
                          label: 其他
                    process_status:
                      type: string
                      description: |-
                        用於按「審核狀態」篩選結果。

                        支持多選；提交時使用英文逗號（`,`）拼接多個值。不傳時不按此字段篩選。
                      example: Pending Follow-up
                      enum:
                        - '1'
                        - '2'
                        - '3'
                        - '4'
                      x-enum-details:
                        - value: '1'
                          label: 待跟進
                        - value: '2'
                          label: 跟進中
                        - value: '3'
                          label: 待審批
                        - value: '4'
                          label: 已完成
                    created_at:
                      type: object
                      description: 用於按「創建日期」篩選結果。
                      properties:
                        gte:
                          type: string
                          format: date
                          description: 篩選範圍的下限，匹配值包含該值。
                        lte:
                          type: string
                          format: date
                          description: 篩選範圍的上限，匹配值包含該值。
                    updated_at:
                      type: string
                      format: date
                      description: 用於按「早於更新日期」篩選結果。
                      example: '1782843342'
                    created_by:
                      type: string
                      description: |-
                        用於按「創建人」篩選結果。

                        候選值會動態變化。請調用 `GET /v1/datasets/refs/operators` 獲取當前可用的數據字典，並使用返回項的 `key` 作為本參數值。
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/operators
                      example: 張三
                page:
                  type: integer
                  description: 要查詢的頁碼，從 `1` 開始。
                page_size:
                  type: integer
                  description: 每頁返回的記錄數量。
            example:
              filters: {}
              page: 1
              page_size: 20
      responses:
        '200':
          description: 成功時分頁返回「可疑事件列表」記錄，以及頁碼、每頁數量和總記錄數等分頁信息。
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。

                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`
                      判斷具體結果。

                      - `401`：未登錄。
                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。
                    x-enum-details:
                      - value: 0
                        label: 成功
                  message:
                    type: string
                  data:
                    type: object
                    required:
                      - list
                      - total
                    properties:
                      list:
                        type: array
                        description: '**返回值：** 列表列表。'
                        items:
                          type: object
                          properties:
                            event_no:
                              type: string
                              description: '**返回值：** 事件編號。'
                            member_id:
                              type: string
                              description: '**返回值：** 客戶編號。'
                            real_name:
                              type: string
                              description: '**返回值：** 客戶中文名稱。'
                            en_name:
                              type: string
                              description: '**返回值：** 客戶英文名稱。'
                            origin_id:
                              type: string
                              description: '**返回值：** 證券帳號。'
                            last_alert_date:
                              type: string
                              description: '**返回值：** 最後警報日期；時間或日期格式以接口實際返回值為準。'
                            tigger_indicator:
                              type: string
                              description: '**返回值：** 觸發指標。'
                            tigger_indicator_val:
                              type: string
                              description: 字段 tigger_indicator 的原始值：tigger_indicator 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            tigger_indicator_remark:
                              type: string
                              description: '**返回值：** 觸發指標備註。'
                            remark:
                              type: string
                              description: '**返回值：** 事件備註。'
                            created_at:
                              type: string
                              description: '**返回值：** 創建時間；時間或日期格式以接口實際返回值為準。'
                            created_by:
                              type: string
                              description: '**返回值：** 創建人。'
                            created_by_val:
                              type: string
                              description: 字段 created_by 的原始值：created_by 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            data_source:
                              type: string
                              description: '**返回值：** 數據來源。'
                            data_source_val:
                              type: string
                              description: 字段 data_source 的原始值：data_source 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            process_status:
                              type: string
                              description: '**返回值：** 審核狀態。'
                            process_status_val:
                              type: string
                              description: 字段 process_status 的原始值：process_status 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            result_status:
                              type: string
                              description: '**返回值：** 審核結果。'
                            result_status_val:
                              type: string
                              description: 字段 result_status 的原始值：result_status 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            last_reviewed_by:
                              type: string
                              description: '**返回值：** 最後審核人。'
                            last_reviewed_by_val:
                              type: string
                              description: 字段 last_reviewed_by 的原始值：last_reviewed_by 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            last_reviewed_at:
                              type: string
                              description: '**返回值：** 最後審核時間；時間或日期格式以接口實際返回值為準。'
                            updated_at:
                              type: string
                              description: '**返回值：** 更新時間；時間或日期格式以接口實際返回值為準。'
                      total:
                        type: integer
                        description: '**返回值：** 符合查詢條件的記錄總數，用於計算分頁。'
              example:
                code: 0
                message: success
                data:
                  list:
                    - event_no: S2026063043342047
                      member_id: '101456715'
                      real_name: 張三
                      en_name: FANG GULU
                      origin_id: H00000000
                      last_alert_date: '1782843340'
                      tigger_indicator: Trading Anomaly
                      tigger_indicator_val: '2'
                      tigger_indicator_remark: ''
                      remark: ''
                      created_at: '1782843342'
