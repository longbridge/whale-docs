openapi: 3.1.1
info:
  title: Longport Whale 券商 API
  description: 面向使用 Longport Whale 的券商提供機構級服務端 API。
  version: 2.0.0
servers:
  - url: https://b-api.longbridge.xyz
    description: 測試環境
  - url: https://b-api.lbkrs.com
    description: 生產環境
security:
  - bearerAuth: []
tags:
  - name: 可疑事件監控
paths:
  /account/kyc/import:
    post:
      operationId: kyc_import
      summary: 批量導入可疑事件
      tags:
        - 可疑事件監控
      x-permission-key:
        - account.apply_edit_member
        - account.modify_transaction_channel
        - account.sem_update
        - account.suspend_account
        - account.update_appid
        - b2b_customer.submit_account
        - kyc.blacklist_hit_status
        - kyc.blacklist_members
        - kyc.blacklist_names
        - kyc.update_account_info
        - ticket.import_agent
        - ticket.import_relation
      x-lbonly: false
      description: |-
        透過上傳檔案批量匯入可疑事件（反洗錢可疑事件），一次性為多個證券帳號建立可疑事件記錄。

        ### 請求參數

        - 必填：`type`（匯入檔案類型），可疑事件匯入時固定傳入 `SuspiciousIncident`。
        - 可選：`s3_key`（已上傳檔案的 S3 Key）、`name`（名稱）、`filename`（檔名）、`base_account_ids`（基礎帳號 ID 列表）、`audit_frontend_resource`（呼叫方提供的審計上下文）。
        - 各欄位的格式、取值範圍、預設行為和業務含義見對應欄位說明。

        ### 業務說明

        匯入前應先完成檔案上傳並取得 `s3_key`，匯入內容以檔案中的記錄為準。建議先透過匯入預檢查介面確認檔案格式與資料無誤後再提交。

        ### 風險提示

        此操作會批量新建可疑事件記錄，影響後續的反洗錢審核與合規處理流程。呼叫前請確認匯入檔案內容和 `type` 無誤。

        ### 處理結果

        成功時完成批量匯入；具體返回內容見 `200` 回應定義。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - s3_key
                - type
                - admin_url
              properties:
                s3_key:
                  type: string
                  description: 文件上傳後返回的對象存儲 Key，用於定位本次請求處理的文件。
                name:
                  type: string
                  description: 用於指定「名稱」。
                type:
                  type: string
                  description: 可疑事件導入時固定傳入 `SuspiciousIncident`。
                filename:
                  type: string
                  description: 本次請求處理的文件名，包含文件擴展名。
                base_account_ids:
                  type: array
                  description: 基礎賬號ID列表，以 JSON 數組形式提交。
                  items:
                    type: string
                audit_frontend_resource:
                  type: object
                  description: 調用方提交的審計上下文，用於記錄本次操作。
                service:
                  type: string
                  description: |-
                    文件上傳所屬服務標識
                admin_url:
                  type: string
                  description: |-
                    發起導入時的管理後台頁面 URL，由調用方自動附加
            example:
              s3_key: ''
              name: ''
              type: SuspiciousIncident
              filename: ''
              base_account_ids: []
              audit_frontend_resource: {}
      responses:
        '200':
          description: 請求處理成功。響應的 `data` 不包含額外業務字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。

                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`
                      判斷具體結果。

                      - `401`：未登錄。
                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。
                    x-enum-details:
                      - value: 0
                        label: 成功
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登錄或登錄狀態已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 當前賬號未獲得該功能授權。請在 User Permission 中為該賬號開通相應權限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 請求處理超時。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
  /account/kyc/submit_suspicious_event:
    post:
      operationId: submit_suspicious_event
      summary: 新建可疑事件
      tags:
        - 可疑事件監控
      x-permission-key:
        - account.sem_update
        - kyc.suspicious_incident_monitoring
      x-lbonly: false
      description: |-
        為指定證券帳號新建一條可疑事件（反洗錢可疑事件）記錄。

        ### 請求參數

        - 必填：`aaid`（本次請求關聯的證券帳號）。
        - 可選：`trigger_indicator`（觸發指標）、`trigger_remark`（觸發備註）、`last_alert_date`（最近預警日期）。
        - 各欄位的格式、取值範圍和業務含義見對應欄位說明。

        ### 業務說明

        新建的可疑事件將進入反洗錢審核與合規處理流程，`trigger_indicator` 與 `trigger_remark` 用於說明觸發原因。

        ### 風險提示

        此操作會新建可疑事件記錄並觸發後續合規審核流程。呼叫前請確認 `aaid` 及觸發資訊無誤。

        ### 處理結果

        成功時完成可疑事件建立；後續狀態和返回數據以 `200` 回應定義為準。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - aaid
              properties:
                aaid:
                  type: string
                  description: 本次請求關聯的證券賬號。此字段為必填項。
                trigger_indicator:
                  type: string
                  description: 用於指定「觸發指標」。
                trigger_remark:
                  type: string
                  description: 用於指定「觸發備註」。
                last_alert_date:
                  type: string
                  description: 本次請求對應的最近預警日期。請按接口約定的日期格式提交。
            example:
              aaid: H00000000
              trigger_indicator: ''
              trigger_remark: ''
              last_alert_date: 2026-07-10
      responses:
        '200':
          description: 請求處理成功。響應的 `data` 不包含額外業務字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。

                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`
                      判斷具體結果。

                      - `401`：未登錄。
                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。
                    x-enum-details:
                      - value: 0
                        label: 成功
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      event_id:
                        type: string
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登錄或登錄狀態已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 當前賬號未獲得該功能授權。請在 User Permission 中為該賬號開通相應權限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 請求處理超時。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
  /account/kyc/edit_suspicious_event:
    post:
      operationId: edit_suspicious_event
      summary: 編輯可疑事件
      tags:
        - 可疑事件監控
      x-permission-key:
        - account.sem_update
        - kyc.suspicious_incident_monitoring
      x-lbonly: false
      description: |-
        編輯已存在的可疑事件（反洗錢可疑事件）記錄，更新其觸發資訊與預警日期。

        ### 請求參數

        - 必填：`event_id`（事件 ID，標識待編輯的可疑事件）、`aaid`（關聯的證券帳號）、`trigger_indicator`（觸發指標）、`trigger_remark`（觸發備註）、`last_alert_date`（最近預警日期）。
        - 可選：`audit_frontend_resource`（呼叫方提供的審計上下文）。
        - 各欄位的格式、取值範圍和業務含義見對應欄位說明。

        ### 業務說明

        透過 `event_id` 定位目標可疑事件，並以本次請求提交的欄位值覆蓋原有內容。

        ### 風險提示

        此操作會修改已有可疑事件記錄，影響後續的反洗錢審核與合規處理。呼叫前請確認 `event_id` 指向正確的記錄且各欄位無誤。

        ### 處理結果

        成功時完成可疑事件更新；後續狀態和返回數據以 `200` 回應定義為準。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - event_id
                - aaid
                - trigger_indicator
                - trigger_remark
                - last_alert_date
              properties:
                event_id:
                  type: string
                  description: 事件ID，用於標識本次請求關聯的業務對象。此字段為必填項。
                aaid:
                  type: string
                  description: 本次請求關聯的證券賬號。此字段為必填項。
                trigger_indicator:
                  type: string
                  description: 用於指定「觸發指標」。此字段為必填項。
                trigger_remark:
                  type: string
                  description: 用於指定「觸發備註」。此字段為必填項。
                last_alert_date:
                  type: string
                  description: 本次請求對應的最近預警日期。請按接口約定的日期格式提交。此字段為必填項。
                audit_frontend_resource:
                  type: object
                  description: 調用方提交的審計上下文，用於記錄本次操作。
            example:
              event_id: '123'
              aaid: H00000000
              trigger_indicator: ''
              trigger_remark: ''
              last_alert_date: 2026-07-10
              audit_frontend_resource: {}
      responses:
        '200':
          description: 請求處理成功。響應的 `data` 不包含額外業務字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。

                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`
                      判斷具體結果。

                      - `401`：未登錄。
                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。
                    x-enum-details:
                      - value: 0
                        label: 成功
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登錄或登錄狀態已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 當前賬號未獲得該功能授權。請在 User Permission 中為該賬號開通相應權限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 請求處理超時。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
  /v1/datasets/aml_suspicious_events/download:
    post:
      operationId: aml_suspicious_events_download
      summary: 可疑事件列表導出
      tags:
        - 可疑事件監控
      x-permission-key:
        - account.sem_query
      x-lbonly: false
      description: |-
        將「可疑事件列表」數據匯出為檔案。`filters` 決定匯出範圍，`down_fields` 可限制匯出欄位。

        ### 請求參數

        - 本介面無必填參數，可選參數見下方欄位說明。
        - 各欄位的格式、取值範圍和業務含義見對應欄位說明。

        ### 匯出模式

        - `mode: 0`：同步匯出，成功後直接返回下載地址。
        - `mode: 1`：非同步匯出，先返回 `file_download_id`；隨後呼叫 `GET /v1/datasets/download/{id}` 取得下載地址。
        - 不再需要匯出記錄時，可呼叫 `DELETE /v1/datasets/download/{id}` 刪除。

        ### 返回結果

        成功時返回下載地址或非同步匯出任務標識，匯出範圍與欄位內容由 `filters` 和 `down_fields` 決定。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 字段同 aml_suspicious_events.yaml（query 能力）裏的 filters
                  properties:
                    member_id:
                      type: string
                      description: 用於按「客戶」篩選結果。
                    tigger_indicator:
                      type: string
                      description: |-
                        用於按「觸發指標」篩選結果。

                        支持多選；提交時使用英文逗號（`,`）拼接多個值。不傳時不按此字段篩選。
                      example: 1,2
                      enum:
                        - '1'
                        - '2'
                        - '3'
                      x-enum-details:
                        - value: '1'
                          label: 出入金異常
                        - value: '2'
                          label: 交易異常
                        - value: '3'
                          label: 其他
                    process_status:
                      type: string
                      description: |-
                        用於按「審核狀態」篩選結果。

                        支持多選；提交時使用英文逗號（`,`）拼接多個值。不傳時不按此字段篩選。
                      example: 1,2
                      enum:
                        - '1'
                        - '2'
                        - '3'
                        - '4'
                      x-enum-details:
                        - value: '1'
                          label: 待跟進
                        - value: '2'
                          label: 跟進中
                        - value: '3'
                          label: 待審批
                        - value: '4'
                          label: 已完成
                    created_at:
                      type: object
                      description: 用於按「創建日期」篩選結果。
                      properties:
                        gte:
                          type: string
                          format: date
                          description: 篩選範圍的下限，匹配值包含該值。
                        lte:
                          type: string
                          format: date
                          description: 篩選範圍的上限，匹配值包含該值。
                    updated_at:
                      type: string
                      format: date
                      description: 用於按「早於更新日期」篩選結果。
                    created_by:
                      type: string
                      description: |-
                        用於按「創建人」篩選結果。

                        候選值會動態變化。請調用 `GET /v1/datasets/refs/operators` 獲取當前可用的數據字典，並使用返回項的 `key` 作為本參數值。
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/operators
                mode:
                  type: integer
                  default: 0
                  description: 不傳時默認 0（同步）
                  enum:
                    - 0
                    - 1
                  x-enum-details:
                    - value: 0
                      label: 同步
                    - value: 1
                      label: 異步
                  example: 0
                ext:
                  type: string
                  description: 下載文件格式。不傳時默認為 `csv`。
                  enum:
                    - csv
                    - xlsx
                  x-enum-details:
                    - value: csv
                      label: CSV
                    - value: xlsx
                      label: Excel
                  example: csv
                file_name:
                  type: string
                  description: 導出文件名稱。不傳時由服務端生成。
                down_fields:
                  type: array
                  description: 不傳時導出全部字段；取值範圍見 items.enum（同查詢接口 data.list.items 的字段列表）
                  items:
                    type: string
                    enum:
                      - event_no
                      - member_id
                      - real_name
                      - en_name
                      - origin_id
                      - last_alert_date
                      - tigger_indicator
                      - tigger_indicator_val
                      - tigger_indicator_remark
                      - remark
                      - created_at
                      - created_by
                      - created_by_val
                      - data_source
                      - data_source_val
                      - process_status
                      - process_status_val
                      - result_status
                      - result_status_val
                      - last_reviewed_by
                      - last_reviewed_by_val
                      - last_reviewed_at
                      - updated_at
                    example: event_no
                ticket_content:
                  type: string
                  description: 模板配置了下載審核工單時，供審批人查看
                ticket_preview_url:
                  type: string
                  description: 導出審批詳情地址；僅在導出需要審批時使用。
                hide:
                  type: integer
                  description: 是否在下載記錄列表中隱藏本次導出記錄。
                  enum:
                    - 0
                    - 1
                  x-enum-details:
                    - value: 0
                      label: 不隱藏
                    - value: 1
                      label: 隱藏
                  example: 0
            example:
              filters: {}
              mode: 0
              ext: csv
              file_name: ''
              remark: ''
              down_fields: []
              ticket_content: ''
              ticket_preview_url: ''
              hide: 0
      responses:
        '200':
          description: 成功時返回「可疑事件列表導出」任務信息。同步導出直接提供下載地址；異步導出提供用於後續查詢的 `file_download_id`。
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。

                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`
                      判斷具體結果。

                      - `401`：未登錄。
                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。
                    x-enum-details:
                      - value: 0
                        label: 成功
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      url:
                        type: string
                        description: '同步模式（`mode: 0`）下返回，異步模式下為空'
                      file_download_id:
                        type: string
                        description: |-
                          異步模式（`mode: 1`）下返回，即 `GET /v1/datasets/download/{id}` /
