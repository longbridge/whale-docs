components:
  schemas:
    BrokerGatewayErrorEnvelope:
      type: object
      description: Broker API Gateway 返回的錯誤響應結構。`code` 為業務錯誤碼，`message` 為錯誤信息，`data` 通常為空。
      required:
        - code
        - message
        - data
      properties:
        code:
          type: integer
          description: '`0` 表示成功;非 0 為業務錯誤碼(此時 `data` 通常為空)。下方為常見錯誤碼,具體介面可能只返回其中一部分;需結合 HTTP status 判斷。'
          enum:
            - 0
            - 401010
            - 403000
            - 3001001
            - 3001004
            - 3001006
            - 408
            - 404000
          x-enum-details:
            - value: 0
              label: 成功
            - value: 401010
              label: token 無效或已過期
            - value: 403000
              label: 無權限(具體權限碼見 message)
            - value: 3001001
              label: 服務繁忙，請稍後重試
            - value: 3001004
              label: 過濾條件格式無法識別
            - value: 3001006
              label: 缺少必填參數(message 含欄位名)
            - value: 408
              label: 請求逾時
            - value: 404000
              label: 路由不存在
        message:
          type: string
        data: {}
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
