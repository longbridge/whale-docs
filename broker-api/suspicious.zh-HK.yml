                      created_by_val: '12965'
                      data_source: Manual Entry
                      data_source_val: single
                      process_status: Pending Follow-up
                      process_status_val: '1'
                      result_status: ''
                      result_status_val: ''
                      last_reviewed_by: ''
                      last_reviewed_by_val: ''
                      last_reviewed_at: '0'
                      updated_at: '1782843342'
                  total: 135
        '400':
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
