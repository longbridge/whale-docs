openapi: 3.1.1
info:
  title: Longport Whale 券商 API
  description: 面向使用 Longport Whale 的券商提供機構級服務端 API。
  version: 2.0.0
servers:
- url: https://b-api.longbridge.xyz
  description: 测试环境
- url: https://b-api.lbkrs.com
  description: 生产环境
security:
- bearerAuth: []
tags:
- name: 可疑事件監控
paths:
  /account/kyc/import:
    post:
      operationId: kyc_import
      summary: 批量導入可疑事件
      tags:
      - 可疑事件監控
      x-permission-key:
      - account.apply_edit_member
      - account.modify_transaction_channel
      - account.sem_update
      - account.suspend_account
      - account.update_appid
      - b2b_customer.submit_account
      - kyc.blacklist_hit_status
      - kyc.blacklist_members
      - kyc.blacklist_names
      - kyc.update_account_info
      - ticket.import_agent
      - ticket.import_relation
      x-lbonly: false
      description: 'type 固定傳 SuspiciousIncident。


        ### 請求參數


        - 必填：`type`（導入文件類型）

        - 可選：`s3_key`（上傳文件 S3 Key）、`name`（名稱）、`filename`（文件名）、`base_account_ids`（基礎賬號ID列表）、`audit_frontend_resource`（審計上下文）

        - 各字段的格式、取值範圍、默認行為和業務含義見對應字段說明。


        ### 處理結果


        成功時完成所述業務操作，具體返回內容見 `200` 響應定義。'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - type
              properties:
                s3_key:
                  type: string
                  description: 文件上傳後返回的對象存儲 Key，用於定位本次請求處理的文件。
                name:
                  type: string
                  description: 用於指定「名稱」。
                type:
                  type: string
                  description: 可疑事件導入時固定傳入 `SuspiciousIncident`。
                filename:
                  type: string
                  description: 本次請求處理的文件名，包含文件擴展名。
                base_account_ids:
                  type: array
                  description: 基礎賬號ID列表，以 JSON 數組形式提交。
                  items:
                    type: string
                audit_frontend_resource:
                  type: object
                  description: 調用方提交的審計上下文，用於記錄本次操作。
            example:
              s3_key: ''
              name: ''
              type: SuspiciousIncident
              filename: ''
              base_account_ids: []
              audit_frontend_resource: {}
      responses:
        '200':
          description: 請求處理成功。響應的 `data` 不包含額外業務字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: '0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。


                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`

                      判斷具體結果。


                      - `401`：未登錄。

                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。'
                    x-enum-details:
                    - value: 0
                      label: 成功
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登錄或登錄狀態已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 當前賬號未獲得該功能授權。請在 User Permission 中為該賬號開通相應權限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 請求處理超時。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
  /account/kyc/submit_suspicious_event:
    post:
      operationId: submit_suspicious_event
      summary: 新建可疑事件
      tags:
      - 可疑事件監控
      x-permission-key:
      - account.sem_update
      - kyc.suspicious_incident_monitoring
      x-lbonly: true
      description: '新建可疑事件。


        ### 請求參數


        - 必填：`aaid`（證券賬號）

        - 可選：`trigger_indicator`（觸發指標）、`trigger_remark`（觸發備註）、`last_alert_date`（最近預警日期）

        - 各字段的格式、取值範圍和業務含義見對應字段說明。


        ### 處理結果


        成功時完成上述業務操作；後續狀態和返回數據以 `200` 響應定義為準。'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - aaid
              properties:
                aaid:
                  type: string
                  description: 本次請求關聯的證券賬號。此字段為必填項。
                trigger_indicator:
                  type: string
                  description: 用於指定「觸發指標」。
                trigger_remark:
                  type: string
                  description: 用於指定「觸發備註」。
                last_alert_date:
                  type: string
                  description: 本次請求對應的最近預警日期。請按接口約定的日期格式提交。
            example:
              aaid: H00000000
              trigger_indicator: ''
              trigger_remark: ''
              last_alert_date: 2026-07-10
      responses:
        '200':
          description: 請求處理成功。響應的 `data` 不包含額外業務字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: '0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。


                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`

                      判斷具體結果。


                      - `401`：未登錄。

                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。'
                    x-enum-details:
                    - value: 0
                      label: 成功
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登錄或登錄狀態已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 當前賬號未獲得該功能授權。請在 User Permission 中為該賬號開通相應權限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 請求處理超時。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
  /account/kyc/edit_suspicious_event:
    post:
      operationId: edit_suspicious_event
      summary: 編輯可疑事件
      tags:
      - 可疑事件監控
      x-permission-key:
      - account.sem_update
      - kyc.suspicious_incident_monitoring
