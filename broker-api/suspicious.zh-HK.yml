        ### 請求參數


        - 必填：`event_id`（事件ID）、`aaid`（證券賬號）、`trigger_indicator`（觸發指標）、`trigger_remark`（觸發備註）、`last_alert_date`（最近預警日期）

        - 可選：`audit_frontend_resource`（審計上下文）

        - 各字段的格式、取值範圍和業務含義見對應字段說明。


        ### 處理結果


        成功時完成上述業務操作；後續狀態和返回數據以 `200` 響應定義為準。'
      security:
      - bearerAuth: []
      requestBody:
        required: true
