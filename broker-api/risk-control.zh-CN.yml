        每条记录对应一条预警，包含客户与证券账号、预警类型与状态、触发/转平仓/截止时间、应追缴保证金、含贷权益值（ELV）、初始/维持/平仓保证金、净资产比率、含贷权益值与维持保证金比值、持仓总市值、可平仓股票及是否持有末日期权等风控指标。

        支持按客户、持仓股票、末日期权、账户类型等多维筛选，服务于追缴与平仓决策。

