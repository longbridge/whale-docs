  /v1/risk_monitoring/update_exchange_rule_v2:
    post:
      operationId: update_exchange_rule_v2
      summary: 编辑借币提醒换汇规则
      tags:
        - 风控管理
      x-lbonly: false
      description: |-
        编辑借币提醒换汇规则。

        ### 请求参数

        - 必填：`main`（主币种换汇规则）、`other`（其他币种换汇规则）、`is_display`（是否展示/启用）
        - 可选：`front_payload`（调用方变更差异）、`audit_frontend_resource`（调用方审计上下文）
        - 各字段的格式、取值范围和业务含义见对应字段说明。

        ### 业务说明

        编辑借币提醒的换汇规则。

        ### 处理结果

        成功时完成上述业务操作；后续状态和返回数据以 `200` 响应定义为准。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - main
                - other
                - is_display
              properties:
                main:
                  type: object
                  description: 主币种换汇规则. 包含 debt(欠款金额阈值)、avail_with_draw(可提现金额阈值)、currency(账户主币种，只读展示不可编辑)三个字段，均为字符串数值
                other:
                  type: array
                  description: |-
                    其他币种换汇规则. 数组，每项 {currency: 币种代码（取值来自 global_currency_which_support_exchange 动态枚举，非固定）, debt:
                    欠款金额阈值, avail_with_draw: 可提现金额阈值}，可增删多条

                    请调用 `GET /v1/datasets/refs/tenant_exchange_currencies` 获取当前可用的数据字典，并使用返回项的 `key` 作为本字段值。
                  x-value-source:
                    endpoint: GET /v1/datasets/refs/tenant_exchange_currencies
                  items:
                    type: string
                is_display:
                  type: boolean
                  description: |-
                    是否展示/启用. - 单选
                    - 提交时字符串 'true'/'false' 转为布尔值
                    - 为 false 时其余金额字段禁用
                  enum:
                    - 'true'
                    - 'false'
                front_payload:
                  type: object
                  description: 前端变更差异. 非核心业务字段，type 固定为 data_diff，记录 is_display/debt/avail_with_draw/other 变更前后值，用于审批工单展示
                audit_frontend_resource:
                  type: object
                  description: 审计上下文. 非核心业务字段，携带提交时的 is_display 值
            example:
              main:
                debt: '1000'
                avail_with_draw: '500'
                currency: HKD
              other:
                - currency: USD
                  debt: '200'
                  avail_with_draw: '100'
              is_display: true
              front_payload:
                type: data_diff
                data:
                  - label: 是否展示
                    key: is_display
                    before_value: 关闭
                    after_value: 开启
              audit_frontend_resource:
                is_display: true
      responses:
        '200':
          description: 请求处理成功。响应的 `data` 不包含额外业务字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。

                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`
                      判断具体结果。

                      - `401`：未登录。
                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登录或登录状态已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 当前账号未获得该功能授权。请在 User Permission 中为该账号开通相应权限。
