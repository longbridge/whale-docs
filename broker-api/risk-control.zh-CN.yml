  /v1/risk_monitoring/exchange_v2:
    post:
      operationId: exchange_v2
      summary: 手动换汇（借币还款）
      tags:
        - 风控管理
      x-permission-key:
        - margin_call.risk_debt_info
      x-lbonly: false
      description: |-
        为客户手动执行换汇，用于借币还款。

        ### 请求参数

        - 必填：`aaid`（账户 ID）、`exchange_books`（换汇明细列表）、`exchange_books.from_currency`（兑出币种）、`exchange_books.to_currency`（兑入币种）
        - 可选：`exchange_books.from_amount`（兑出金额）、`exchange_books.to_amount`（兑入金额）
        - 各字段的格式、取值范围和业务含义见对应字段说明。

        ### 业务说明

        按换汇明细列表逐笔为客户执行货币兑换，用于归还借币；每笔需指定兑出与兑入币种及金额。

        ### 风险提示

        此操作直接产生真实资金换汇与还款，不可撤销。调用前请核对账户、币种与金额。

        ### 处理结果

        成功时完成手动换汇还款；后续状态和返回数据以 `200` 响应定义为准。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - aaid
                - exchange_books
                - exchange_books.from_currency
                - exchange_books.to_currency
              properties:
                aaid:
                  type: number
                  description: 账户ID. 调用方由所选记录 record.aaid_val 程序化带出，非请求可编辑字段
                exchange_books:
                  type: array
                  description: 换汇明细列表. 动态换汇行数组，可添加多组换汇记录；每行结构见 exchange_books 的子字段（from_currency 等）。
                  items:
                    type: string
                exchange_books.from_currency:
                  type: string
                  description: 兑换币种. 可选值，可选项为该客户现金账本里持有的币种
                exchange_books.to_currency:
                  type: string
                  description: |-
                    被兑换币种。可选值来自后端支持兑换的币种数据字典，请以接口返回的可选项为准。
                exchange_books.from_amount:
                  type: string
                  description: 兑换金额. from_amount / to_amount 二选一提交：用户最后编辑的字段保留，另一个按汇率计算后在调用方被剔除
                exchange_books.to_amount:
                  type: string
                  description: 被兑换金额. 同 from_amount，二者互斥，仅提交其一
            example:
              aaid: H00000000
              exchange_books:
                - from_currency: USD
                  to_currency: HKD
                  from_amount: '100.00'
      responses:
        '200':
          description: 请求处理成功。响应的 `data` 不包含额外业务字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。

                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`
                      判断具体结果。

                      - `401`：未登录。
                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登录或登录状态已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 当前账号未获得该功能授权。请在 User Permission 中为该账号开通相应权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 请求处理超时。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
