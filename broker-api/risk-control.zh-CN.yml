  /risk/v1/update_block_record:
    post:
      operationId: update_block_record
      summary: 更新黑名单记录状态/备注
      tags:
        - 风控管理
      x-lbonly: false
      description: |-
        更新一条黑名单记录的状态与备注。

        ### 请求参数

        - 必填：`id`（记录 ID）、`remark`（备注）、`status`（状态）
        - 可选：`audit_frontend_resource`（调用方审计信息）
        - 各字段的格式、取值范围和业务含义见对应字段说明。

        ### 业务说明

        按 `id` 定位目标黑名单记录，并更新其 `status` 与 `remark`。`status` 的变更会影响该记录是否继续生效。

        ### 风险提示

        此操作会改变黑名单记录的生效状态，可能影响目标对象的相关业务限制。调用前请确认记录 ID 和状态无误。

        ### 处理结果

        成功时完成黑名单记录状态/备注更新；后续状态和返回数据以 `200` 响应定义为准。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
                - remark
                - status
              properties:
                id:
                  type: number
                  description: 记录ID. 记录ID，用于标识本次请求关联的业务对象。此字段为必填项。
                remark:
                  type: string
                  description: 备注. 随本次操作保存的备注。此字段为必填项。
                status:
                  type: number
                  description: 状态. 本次请求要设置的目标状态。此字段为必填项。
                audit_frontend_resource:
                  type: object
                  description: 审计上下文. 调用方提交的审计上下文，用于记录本次操作。
            example:
              id: 123
              remark: ''
              status: 1
              audit_frontend_resource: {}
      responses:
        '200':
          description: 请求处理成功。响应的 `data` 不包含额外业务字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。

                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`
                      判断具体结果。

                      - `401`：未登录。
                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。
                  message:
                    type: string
                  data:
                    type: object
                    description: 成功时 `data` 为空对象。
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登录或登录状态已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 当前账号未获得该功能授权。请在 User Permission 中为该账号开通相应权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 请求处理超时。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
