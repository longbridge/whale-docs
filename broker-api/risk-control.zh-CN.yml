                        - US
                        - HK
                        - UK
                        - SH
                        - SZ
                        - SG
                        - KR
                        - JP
                        - AU
                        - DE
                        - CA
                        - TH
                        - ID
                        - MY
                        - TR
                        - NA
                        - OSL
                        - HAS
                        - EU
                        - UT
                        - GTMMF
                page:
                  type: integer
                  description: 页码. 要查询的页码，从 `1` 开始。
                page_size:
                  type: integer
                  description: 每页数量. 每页返回的记录数量。
                orderBy:
                  type: array
                  description: 排序参数. 排序规则数组；每一项定义一个排序字段及排序方向。
                  items:
                    type: object
            example:
              filters: {}
              page: 1
              page_size: 20
              orderBy: []
