                      rlc: 411,153,000
                      elc: 722,537,000
                      status: Success
                      status_val: '3'
                      op_user: system
                      created_at: '1780299488'
                  total: 127
        '400':
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
