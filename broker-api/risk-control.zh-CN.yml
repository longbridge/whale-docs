                              description: 其他币种已占用融资额度. **返回值：** 其他币种已占用融资额度。
                            updated_at:
                              type: string
                              description: 更新日期. **返回值：** 更新日期；时间或日期格式以接口实际返回值为准。
                            created_at:
                              type: string
                              description: 创建日期. **返回值：** 创建日期；时间或日期格式以接口实际返回值为准。
                            aaid:
                              type: string
                              description: Aaid. **返回值：** Aaid。
                            aaid_val:
                              type: string
                              description: Aaid（原始值）. 字段 aaid 的原始值：aaid 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                      total:
                        type: integer
                        description: 总条数. **返回值：** 符合查询条件的记录总数，用于计算分页。
