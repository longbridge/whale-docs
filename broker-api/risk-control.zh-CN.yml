    post:
      operationId: index_level_operate
      summary: 新增/编辑指数级别
      tags:
        - 风控管理
      x-lbonly: false
      description: |-
        指数级别 (Index Level) 场景共用一个接口处理四种动作：新增（operation=0，提交 index_code/index_name/index_type/remark）、编辑（operation=1，额外带 id）、删除（operation=2，字段沿用 stock_level 而非 index_type，属历史命名遗留）、初始化数据（operation=3，仅传 operation）。

        ### 请求参数

        - 必填：`index_code`（指数编码）、`index_name`（指数名）、`index_type`（指数级别类型）、`operator`（操作人）、`operation`（操作类型）
        - 可选：`remark`（备注）、`id`（记录ID）
        - 各字段的格式、取值范围、默认行为和业务含义见对应字段说明。

        ### 处理结果

        成功时完成所述业务操作，具体返回内容见 `200` 响应定义。
