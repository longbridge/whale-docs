                - dimension
                - value
                - block_type_list
                - operator
              properties:
                dimension:
                  type: integer
                  description: |-
                    维度类型. 名单维度。

                    **可选值：**
                    - `0` - 表示证券账号
                    - `1` - 表示客户编号
                  enum:
                    - '0'
                    - '1'
