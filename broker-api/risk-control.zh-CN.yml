      description: |-
        查询「多维度限额」数据，可通过 `filters` 组合业务筛选条件，并使用 `page`、`page_size` 和 `orderBy` 控制分页与排序。

        ### 返回结果

        成功时返回匹配的记录列表及分页信息。各过滤字段的用途、可选值和动态数据来源见对应字段说明。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 过滤条件. 组合业务过滤条件。省略某个过滤字段时，不按该字段筛选。
                  properties:
                    code:
                      type: string
                      description: |-
                        限额代码. 用于按「限额代码」筛选结果。

                        候选值会动态变化。请调用 `GET /v1/datasets/refs/risk_limit_codes_multi_dimension` 获取当前可用的数据字典，并使用返回项的 `key` 作为本参数值。
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/risk_limit_codes_multi_dimension
                    market:
                      type: string
                      description: |-
                        市场. 用于按「市场」筛选结果。

                        **可选值：** `US`、`HK`、`UK`、`SH`、`SZ`、`SG`、`KR`、`JP`、`AU`、`DE`、`CA`、`TH`、`ID`、`MY`、`TR`、`NA`、`OSL`、`HAS`、`EU`、`UT`、`GTMMF`
                      enum:
                        - US
                        - HK
                        - UK
                        - SH
                        - SZ
                        - SG
                        - KR
                        - JP
                        - AU
                        - DE
                        - CA
                        - TH
                        - ID
                        - MY
                        - TR
                        - NA
                        - OSL
                        - HAS
                        - EU
                        - UT
                        - GTMMF
                    counter_id:
                      type: string
                      description: 证券代码. 用于按「证券代码」筛选结果。
                    is_apply:
                      type: string
                      description: |-
                        生效状态. 用于按「生效状态」筛选结果。

                        **可选值：**
                        - `true` - 表示生效中
                        - `false` - 表示已失效
                      enum:
                        - 'true'
                        - 'false'
                    aaid:
                      type: string
                      description: 客户. 用于按「客户」筛选结果。
                page:
                  type: integer
                  description: 页码. 要查询的页码，从 `1` 开始。
                page_size:
                  type: integer
                  description: 每页数量. 每页返回的记录数量。
                orderBy:
                  type: array
                  description: 排序参数. 排序规则数组；每一项定义一个排序字段及排序方向。
                  items:
                    type: object
            example:
              filters: {}
              page: 1
              page_size: 20
              orderBy: []
      responses:
        '200':
          description: 成功时分页返回「多维度限额」记录，以及页码、每页数量和总记录数等分页信息。
