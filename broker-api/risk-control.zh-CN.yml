  /v1/datasets/risk_elc_stock_levels:
    post:
      operationId: risk_elc_stock_levels
      summary: 假设性压力测试价格跌幅
      tags:
        - 风控管理
      x-permission-key:
        - lb_hk_margin_call.risk_monitoring_stock_level_query
      x-lbonly: false
      description: |-
        查询假设性压力测试下按股票分层汇总的持仓市值，用于评估在设定价格跌幅情景下的持仓风险敞口。

        ### 请求参数

        - 本数据集不提供业务过滤字段，`filters` 传空对象即可；仍可使用 `page`、`page_size`、`orderBy` 控制分页与排序。

        ### 业务说明

        - 数据对应某一压力测试口径：在假设价格跌幅（`x`%）情景下，按股票分层（`stock_level`，如 Tier 1/Tier 2）聚合。
        - 每条记录包含股票分层、币种、股票数量合计、总市值及占比，并附快照日期与更新时间。
        - 用于风控压力测试，衡量各分层持仓在假设跌幅下的规模与集中度。

        ### 返回结果

        成功时返回匹配的记录列表及分页信息。返回列含义见响应定义。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 过滤条件. 组合业务过滤条件。省略某个过滤字段时，不按该字段筛选。
                  properties:
                page:
                  type: integer
                  description: 页码. 要查询的页码，从 `1` 开始。
                page_size:
                  type: integer
                  description: 每页数量. 每页返回的记录数量。
                orderBy:
                  type: array
                  description: 排序参数. 排序规则数组；每一项定义一个排序字段及排序方向。
                  items:
                    type: object
            example:
              filters: {}
              page: 1
              page_size: 20
              orderBy: []
      responses:
        '200':
          description: 成功时分页返回「ELC 持仓明细」记录，以及页码、每页数量和总记录数等分页信息。
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。

                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`
                      判断具体结果。

                      - `401`：未登录。
                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。
                  message:
                    type: string
                  data:
                    type: object
                    required:
                      - list
                      - total
                    properties:
                      list:
                        type: array
                        description: 列表. **返回值：** 列表列表。
                        items:
                          type: object
                          properties:
                            stock_level:
                              type: string
                              description: 股票级别. **返回值：** 股票级别。
                            stock_level_val:
                              type: string
                              description: 股票级别（原始值）. 字段 stock_level 的原始值：stock_level 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            stock_sum:
                              type: string
                              description: 股票级别合计市值. **返回值：** 股票级别合计市值。
                            total_market_value:
                              type: string
                              description: 抵押品池总市值. **返回值：** 抵押品池总市值。
                            ratio:
                              type: string
                              description: 占比（%）. **返回值：** 占比（%）。
                            currency:
                              type: string
                              description: 币种. **返回值：** 币种。
                            created_at:
                              type: string
                              description: 更新时间. **返回值：** 更新时间；时间或日期格式以接口实际返回值为准。
                      total:
                        type: integer
                        description: 总条数. **返回值：** 符合查询条件的记录总数，用于计算分页。
              example:
                code: 0
                message: success
                data:
                  list:
                    - stock_level: Tier 2
                      stock_level_val: '1'
