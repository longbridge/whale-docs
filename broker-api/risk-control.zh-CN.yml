  /v1/datasets/risk_elc_stress_tests:
    get:
      operationId: risk_elc_stress_tests
      summary: ELC 压力测试
      tags:
        - 风控管理
      x-permission-key:
        - lb_hk_margin_call.risk_monitoring_stock_level_query
      x-lbonly: false
      description: |-
        查询「ELC 压力测试」数据，可通过 `filters` 组合业务筛选条件，并使用 `page`、`page_size` 和 `orderBy` 控制分页与排序。

        ### 返回结果

        成功时返回匹配的记录列表及分页信息。各过滤字段的用途、可选值和动态数据来源见对应字段说明。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 过滤条件. 组合业务过滤条件。省略某个过滤字段时，不按该字段筛选。
                  properties:
                    created_at:
                      type: object
                      description: 创建时间. 用于按「创建时间」筛选结果。
                      properties:
                        gte:
                          type: string
                          description: 大于等于. 筛选范围的下限，匹配值包含该值。
                          format: date
                        lte:
                          type: string
                          description: 小于等于. 筛选范围的上限，匹配值包含该值。
                          format: date
                    status:
                      type: string
                      description: |-
                        计算结果. 用于按「计算结果」筛选结果。

                        支持多选；提交时使用英文逗号（`,`）拼接多个值。不传时不按此字段筛选。

                        **可选值：**
                        - `1` - 表示处理中
                        - `2` - 表示处理失败
                        - `3` - 表示处理成功
                      example: 1,2
                      enum:
                        - '1'
                        - '2'
                        - '3'
                page:
                  type: integer
                  description: 页码. 要查询的页码，从 `1` 开始。
                page_size:
                  type: integer
                  description: 每页数量. 每页返回的记录数量。
                orderBy:
                  type: array
                  description: 排序参数. 排序规则数组；每一项定义一个排序字段及排序方向。
                  items:
                    type: object
            example:
              filters: {}
              page: 1
              page_size: 20
              orderBy: []
      responses:
        '200':
          description: 成功时分页返回「ELC 压力测试」记录，以及页码、每页数量和总记录数等分页信息。
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。

                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`
                      判断具体结果。

                      - `401`：未登录。
                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。
                  message:
                    type: string
                  data:
                    type: object
                    required:
                      - list
                      - total
                    properties:
                      list:
                        type: array
                        description: 列表. **返回值：** 列表列表。
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: 任务编号. **返回值：** 当前记录的唯一标识。
                            currency:
                              type: string
                              description: 币种. **返回值：** 币种。
                            lc:
                              type: string
                              description: 速动资金. **返回值：** 速动资金。
                            rlc:
                              type: string
                              description: 规定速动资金. **返回值：** 规定速动资金。
                            elc:
                              type: string
                              description: 速动资金盈余. **返回值：** 速动资金盈余。
                            status:
                              type: string
                              description: 计算结果. **返回值：** 计算结果。
                            status_val:
                              type: string
                              description: 计算结果（原始值）. 字段 status 的原始值：status 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            op_user:
                              type: string
                              description: 操作人. **返回值：** 操作人。
                            created_at:
                              type: string
                              description: 创建时间. **返回值：** 创建时间；时间或日期格式以接口实际返回值为准。
                      total:
                        type: integer
                        description: 总条数. **返回值：** 符合查询条件的记录总数，用于计算分页。
              example:
                code: 0
                message: success
