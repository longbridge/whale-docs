  /v1/datasets/risk_global_limits:
    post:
      operationId: risk_global_limits
      summary: 全局限额
      tags:
        - 风控管理
      x-permission-key:
        - lb_hk_risk_limit_config.risk_limit_config_global_query
      x-lbonly: false
      description: |-
        查询全局交易限额，是风控交易限额体系的基础配置，按限额类型定义各类下单管控规则的默认阈值。

        ### 请求参数

        - 通过 `filters` 组合业务筛选条件（可选字段见下方 filters 字段说明），并使用 `page`、`page_size`、`orderBy` 控制分页与排序。

        ### 业务说明

        - 数据来源为全局限额配置，每条记录由限额代码 `code` 标识一类风控规则，`name` 为规则名称，`type` 为限额类型（如股票等）。

        - 每类限额设有提示、审核、拒绝三档阈值（`level_warn`/`level_audit`/`level_reject`）及各自的比较运算符，组合成 `condition_warn`、`condition_audit`、`condition_reject`，命中时分别提示、转人工审核或直接拒绝下单。

        - 记录还包含限额币种 `currency`、启用标识 `enable`、备注、操作人 `last_update_user` 与更新时间。

        - 常用于风控人员查看与维护全局层面的下单限额规则。

        ### 返回结果

        成功时返回匹配的记录列表及分页信息。返回列含义见响应定义。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 过滤条件. 组合业务过滤条件。省略某个过滤字段时，不按该字段筛选。
                  properties:
                    type:
                      type: string
                      description: 限额类型. 用于按「限额类型」筛选结果。
                      enum:
                        - client
                        - company
                        - stock
                        - user
                        - other
                        - multiple
                      x-enum-details:
                        - value: client
                          label: 客户
                        - value: company
                          label: 公司
                        - value: stock
                          label: 证券
                        - value: user
                          label: 交易员
                        - value: other
                          label: 其他
                        - value: multiple
                          label: 多维度
                      example: User
                    enable:
                      type: string
                      description: 是否启用. 用于按「是否启用」筛选结果。
                      enum:
                        - 'true'
                        - 'false'
                      x-enum-details:
                        - value: 'true'
                          label: 已启用
                        - value: 'false'
                          label: 未启用
                      example: Activated
                    code:
                      type: string
                      description: |-
                        限额代码. 用于按「限额代码」筛选结果。

                        候选值会动态变化。请调用 `GET /v1/datasets/refs/risk_limit_codes_global` 获取当前可用的数据字典，并使用返回项的 `key` 作为本参数值。
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/risk_limit_codes_global
                      example: UBB
                page:
                  type: integer
                  description: 页码. 要查询的页码，从 `1` 开始。
                page_size:
                  type: integer
                  description: 每页数量. 每页返回的记录数量。
                orderBy:
                  type: array
                  description: 排序参数. 排序规则数组；每一项定义一个排序字段及排序方向。
                  items:
                    type: object
            example:
              filters: {}
              page: 1
              page_size: 20
              orderBy: []
      responses:
        '200':
          description: 成功时分页返回「全局交易限额」记录，以及页码、每页数量和总记录数等分页信息。
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。

                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`
                      判断具体结果。

                      - `401`：未登录。
                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。
                  message:
                    type: string
                  data:
                    type: object
                    required:
                      - list
                      - total
                    properties:
                      list:
                        type: array
                        description: 列表. **返回值：** 列表列表。
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: 序号. **返回值：** 当前记录的唯一标识。
                            code:
                              type: string
                              description: 限额代码. **返回值：** 限额代码。
                            code_v2:
                              type: string
                              description: 限额名称. **返回值：** 限额名称。
                            code_v2_val:
                              type: string
                              description: 限额名称（原始值）. 字段 code_v2 的原始值：code_v2 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            currency:
                              type: string
                              description: 限额币种. **返回值：** 限额币种。
                            enable:
                              type: string
                              description: 启用标识. **返回值：** 表示启用标识。
                            enable_val:
                              type: string
                              description: 启用标识（原始值）. 字段 enable 的原始值：enable 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            type:
                              type: string
                              description: 限额类型. **返回值：** 限额类型。
                            type_val:
                              type: string
                              description: 限额类型（原始值）. 字段 type 的原始值：type 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            condition_warn:
                              type: string
                              description: 提示条件. **返回值：** 提示条件。
                            condition_audit:
                              type: string
                              description: 审核条件. **返回值：** 审核条件。
                            condition_reject:
                              type: string
                              description: 拒绝条件. **返回值：** 拒绝条件。
                            updated_at:
                              type: string
                              description: 更新时间. **返回值：** 更新时间；时间或日期格式以接口实际返回值为准。
                            last_update_user:
                              type: string
                              description: 操作人. **返回值：** 操作人。
                            account_channel:
                              type: string
                              description: 渠道. **返回值：** 渠道。
                      total:
                        type: integer
                        description: 总条数. **返回值：** 符合查询条件的记录总数，用于计算分页。
              example:
                code: 0
                message: success
                data:
                  list:
                    - id: '6063'
                      code: UBB
                      code_v2: Trader's Single Buy Order Amount Limit
                      code_v2_val: UBB
                      currency: HKD
                      enable: Activated
                      enable_val: 'true'
                      type: User
                      type_val: user
                      condition_warn: Unlimited
                      condition_audit: '>=1.00'
                      condition_reject: Unlimited
                      updated_at: '1784017190'
                      last_update_user: user@example.com
                      account_channel: longport_test
                  total: 48
        '400':
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登录或登录状态已失效。
          content:
