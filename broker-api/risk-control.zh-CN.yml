  /v1/risk_monitoring/simulate_margin_call_cal_v3:
    post:
      operationId: simulate_margin_call_cal_v3
      summary: Margin Call 压力测试计算
      tags:
        - 风控管理
      x-lbonly: false
      description: |-
        按给定的假设参数发起一次 Margin Call 压力测试计算，评估在设定行情冲击下客户或组合的 Margin Call 风险。

        ### 请求参数

        - 必填：`simulate_cal_type`（计算维度）、`cal_type`（计算类型）、`is_filter`（是否使用豁免规则）、`remark`（自定义数据标题）
        - 可选：`task_id`（批次号）、`market`（市场）、`stock_group_id`（股票组 ID）、`counter_id`（股票代码）、`price_limit`（涨跌幅）、`index_price_limit_info`（指数级别跌幅设置）
        - 各字段的格式、取值范围和业务含义见对应字段说明。

        ### 业务说明

        `simulate_cal_type` 与 `cal_type` 决定计算维度与口径；`price_limit` 与 `index_price_limit_info` 设定价格冲击假设；`is_filter` 控制是否套用豁免规则。计算为异步任务，结果通过对应预计算列表/详情查询。

        ### 风险提示

        此操作会触发风控压力测试计算任务并生成结果数据。调用前请确认假设参数设置合理。

        ### 处理结果

        成功时提交压力测试计算任务；后续状态和返回数据以 `200` 响应定义为准。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - simulate_cal_type
                - cal_type
                - is_filter
                - remark
              properties:
                simulate_cal_type:
                  type: integer
                  description: |-
                    计算维度. enum SimulateCalType { 0=按批次号计算 1=按照股票组计算 2=按照市场计算 (Market) 3=按照股票计算 (Stock) 4=按指数级别计算
                    }，决定下方 task_id/stock_group_id/market/counter_id/index_price_limit_info 中哪个字段生效
                  enum:
                    - '0'
                    - '1'
                    - '2'
                    - '3'
                    - '4'
                  x-enum-details:
                    - value: '0'
                      label: 按批次号计算
                    - value: '1'
                      label: 按照股票组计算
                    - value: '2'
                      label: 按照市场计算
                    - value: '3'
                      label: 按照股票计算
                    - value: '4'
                      label: 按指数级别计算
                  example: '0'
                task_id:
                  type: string
                  description: 批次号. 仅 simulate_cal_type=0 时使用
                market:
                  type: string
                  description: 市场. 仅 simulate_cal_type=2 时使用，如 HK/US
                stock_group_id:
                  type: integer
                  description: 股票组ID. 仅 simulate_cal_type=1 时使用
                counter_id:
                  type: string
                  description: 股票代码. 仅 simulate_cal_type=3 时使用
                price_limit:
                  type: string
                  description: 涨跌幅. 假设的价格变动百分比，如 -10 表示下跌 10%
                index_price_limit_info:
                  type: object
                  description: 指数级别跌幅设置. 仅 simulate_cal_type=4 时使用，子字段 tier1_price_limit/tier2_price_limit/other_price_limit 分别对应指数级别1/级别2/其他级别的假设跌幅
                cal_type:
                  type: integer
                  description: |-
                    计算类型。
                  enum:
                    - 0
                    - 1
                    - 2
                  items:
                    type: string
                  x-enum-details:
                    - value: 0
                      label: 全量计算
                    - value: 1
                      label: margin call 计算
                    - value: 2
                      label: 非速冻资金盈余计算
                  example: 0
                is_filter:
                  type: boolean
                  description: |-
                    是否使用豁免规则. 是否使用豁免规则。此字段为必填项。

                    **布尔值：**
                    - `true` - 表示条件成立
                    - `false` - 表示条件不成立
                remark:
                  type: string
                  description: 自定义数据标题. 用于指定「自定义数据标题」。此字段为必填项。
            example:
              simulate_cal_type: 1
              task_id: ''
              market: HK
              stock_group_id: 0
              counter_id: ''
              price_limit: '-10'
              index_price_limit_info:
                tier1_price_limit: '-10'
                tier2_price_limit: '-15'
                other_price_limit: '-20'
              cal_type:
                - '1'
              is_filter: false
              remark: 2026Q3 压力测试
      responses:
        '200':
          description: 请求处理成功。业务结果位于 `data`，包含 `task_id` 字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。

                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`
                      判断具体结果。

                      - `401`：未登录。
                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      task_id:
                        type: string
                        description: 批次号. 本次压力测试计算生成的批次号
              example:
                code: 0
                message: success
                data:
                  task_id: string
        '400':
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登录或登录状态已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 当前账号未获得该功能授权。请在 User Permission 中为该账号开通相应权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 请求处理超时。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
      x-mint:
        href: /zh-CN/api-reference/simulate_margin_call_cal_v3
        metadata:
          sidebarTitle: Margin Call 压力测试计算
