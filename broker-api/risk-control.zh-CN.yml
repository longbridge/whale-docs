    get:
      operationId: account_credits
      summary: 授信额度查询
      tags:
        - 风控管理
      x-permission-key:
        - lb_hk_credit_limit.client_credit_limit_query
      x-lbonly: false
      description: |-
        查询「授信额度查询」数据，可通过 `filters` 组合业务筛选条件，并使用 `page`、`page_size` 和 `orderBy` 控制分页与排序。

        ### 返回结果

        成功时返回匹配的记录列表及分页信息。各过滤字段的用途、可选值和动态数据来源见对应字段说明。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 过滤条件. 组合业务过滤条件。省略某个过滤字段时，不按该字段筛选。
                  properties:
                    finance_amount:
                      type: object
                      description: 融资额度. 用于按「融资额度」筛选结果。
                      properties:
                        gte:
                          type: integer
                          description: 大于等于. 筛选范围的下限，匹配值包含该值。
                        lte:
                          type: integer
                          description: 小于等于. 筛选范围的上限，匹配值包含该值。
                    state:
                      type: string
                      description: |-
                        账户状态. 用于按「账户状态」筛选结果。

                        **可选值：**
                        - `-1` - 表示已注销
                        - `1` - 表示正常
                      enum:
                        - '-1'
                        - '1'
                    member_account_type:
                      type: string
                      description: |-
                        账户类型. 用于按「账户类型」筛选结果。

                        **可选值：**
                        - `M` - 表示融资账户
                        - `C` - 表示现金账户
                        - `F` - 表示期货账户
                      enum:
                        - M
                        - C
                        - F
                    account_mark:
                      type: string
                      description: |-
                        账户标识. 用于按「账户标识」筛选结果。

                        **可选值：**
                        - `dt` - 表示 Day Trade
                      enum:
                        - dt
                    member_id:
                      type: string
                      description: 客户. 用于按「客户」筛选结果。
                    credit_group_name:
                      type: string
                      description: 授信组. 用于按「授信组」筛选结果。
                page:
                  type: integer
                  description: 页码. 要查询的页码，从 `1` 开始。
                page_size:
                  type: integer
                  description: 每页数量. 每页返回的记录数量。
                orderBy:
                  type: array
                  description: 排序参数. 排序规则数组；每一项定义一个排序字段及排序方向。
                  items:
                    type: object
            example:
              filters: {}
              page: 1
              page_size: 20
              orderBy: []
      responses:
        '200':
          description: 成功时分页返回「授信额度查询」记录，以及页码、每页数量和总记录数等分页信息。
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。

                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`
                      判断具体结果。

                      - `401`：未登录。
                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。
                  message:
                    type: string
                  data:
                    type: object
                    required:
                      - list
                      - total
                    properties:
                      list:
                        type: array
                        description: 列表. **返回值：** 列表列表。
                        items:
                          type: object
                          properties:
                            member_id:
                              type: string
                              description: 客户编号. **返回值：** 客户编号。
                            real_name:
                              type: string
                              description: 姓名. **返回值：** 姓名。
                            member_account_type:
                              type: string
                              description: 账户类型. **返回值：** 账户类型。
                            member_account_type_val:
                              type: string
                              description: 账户类型（原始值）. 字段 member_account_type 的原始值：member_account_type 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            account_mark:
                              type: string
                              description: 账户标识. **返回值：** 账户标识。
                            account_mark_val:
                              type: string
                              description: 账户标识（原始值）. 字段 account_mark 的原始值：account_mark 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            client_type:
                              type: string
                              description: 客户类型. **返回值：** 客户类型。
                            client_type_val:
                              type: string
                              description: 客户类型（原始值）. 字段 client_type 的原始值：client_type 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            credit_group_name:
                              type: string
                              description: 授信组. **返回值：** 授信组。
                            client_detail_type:
                              type: string
                              description: 客户子类型. **返回值：** 客户子类型。
                            client_detail_type_val:
                              type: string
                              description: 客户子类型（原始值）. 字段 client_detail_type 的原始值：client_detail_type 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            origin_id:
                              type: string
                              description: 证券账号. **返回值：** 证券账号。
                            account_type:
                              type: string
                              description: 账号类型. **返回值：** 账号类型。
                            account_type_val:
                              type: string
                              description: 账号类型（原始值）. 字段 account_type 的原始值：account_type 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            state:
                              type: string
                              description: 账户状态. **返回值：** 账户状态。
                            state_val:
                              type: string
                              description: 账户状态（原始值）. 字段 state 的原始值：state 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            account_channel:
                              type: string
                              description: 柜台渠道. **返回值：** 柜台渠道。
                            credit_currency:
                              type: string
                              description: 主币种. **返回值：** 主币种。
                            finance_amount:
                              type: string
                              description: 融资额度. **返回值：** 融资额度。
                            used_finance:
                              type: string
                              description: 已占用总融资额度. **返回值：** 已占用总融资额度。
                            main_used_finance:
                              type: string
                              description: 主币种已占用融资额度. **返回值：** 主币种已占用融资额度。
                            other_used_finance:
                              type: string
                              description: 其他币种已占用融资额度. **返回值：** 其他币种已占用融资额度。
                            updated_at:
                              type: string
                              description: 更新日期. **返回值：** 更新日期；时间或日期格式以接口实际返回值为准。
                            created_at:
                              type: string
                              description: 创建日期. **返回值：** 创建日期；时间或日期格式以接口实际返回值为准。
                            aaid:
                              type: string
                              description: Aaid. **返回值：** Aaid。
                            aaid_val:
                              type: string
                              description: Aaid（原始值）. 字段 aaid 的原始值：aaid 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                      total:
                        type: integer
                        description: 总条数. **返回值：** 符合查询条件的记录总数，用于计算分页。
