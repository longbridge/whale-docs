                              description: 总额度. **返回值：** 总额度。
                            used_finance_amount:
                              type: string
                              description: 已占用额度. **返回值：** 已占用额度。
                      total:
                        type: integer
                        description: 总条数. **返回值：** 符合查询条件的记录总数，用于计算分页。
