            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
      x-mint:
        href: /zh-CN/api-reference/client_batch_apply
        metadata:
          sidebarTitle: 批量申请客户交易限额
