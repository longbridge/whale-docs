          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: 0 表示成功；非 0 为业务错误码，此时 data 通常为空。HTTP 状态码本身恒为 200，请勿依赖 HTTP status 判断成功/失败。
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      ticket_id:
                        type: string
