                      enum:
                        - FirstMarginCall
                        - FirstForceCall
                        - EndMarginCall
                        - EndForceCall
                        - DailyRecord
                        - PushAppMsg
                        - PushEmailMsg
                        - PushSmsMsg
                        - ForceCallToMarginCall
                        - MarginCallToForceCall
                      x-enum-details:
                        - value: FirstMarginCall
                          label: 首次触发追收预警
                        - value: FirstForceCall
                          label: 首次触发平仓预警
                        - value: EndMarginCall
                          label: 结束追收预警
                        - value: EndForceCall
                          label: 结束平仓预警
                        - value: DailyRecord
                          label: 每日定时记录
                        - value: PushAppMsg
                          label: App 消息通知
                        - value: PushEmailMsg
                          label: 邮件消息通知
                        - value: PushSmsMsg
                          label: 短信消息通知
                        - value: ForceCallToMarginCall
                          label: 平仓预警转追收预警
                        - value: MarginCallToForceCall
                          label: 追收预警转平仓预警
                      example: End Day Margin Call
                    risk_monitoring_log_id:
                      type: string
                      description: 预警记录. 用于按「预警记录」筛选结果。
                      example: '834619'
                    is_day_of_overdue:
                      type: string
                      description: 是否逾期. 用于按「是否逾期」筛选结果。
                      enum:
                        - 'true'
                        - 'false'
                      x-enum-details:
                        - value: 'true'
                          label: 是
                        - value: 'false'
                          label: 否
                      example: 'true'
                    created_at:
                      type: object
                      description: 记录日期. 用于按「记录日期」筛选结果。
                      properties:
                        gte:
                          type: string
                          description: 大于等于. 筛选范围的下限，匹配值包含该值。
                          format: date
                        lte:
                          type: string
                          description: 小于等于. 筛选范围的上限，匹配值包含该值。
                          format: date
                page:
                  type: integer
                  description: 页码. 要查询的页码，从 `1` 开始。
                page_size:
                  type: integer
                  description: 每页数量. 每页返回的记录数量。
                orderBy:
                  type: array
                  description: 排序参数. 排序规则数组；每一项定义一个排序字段及排序方向。
                  items:
                    type: object
