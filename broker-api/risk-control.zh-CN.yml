      x-lbonly: false
      description: |-
        查询融资授信分组列表，用于按分组维度管理多个账户共享的授信额度。

        ### 请求参数

        - 通过 `filters` 组合业务筛选条件（可选字段见下方 filters 字段说明），并使用 `page`、`page_size`、`orderBy` 控制分页与排序。

        ### 业务说明

        - 每条记录代表一个授信分组，聚合组内多个客户账户的额度。
        - 包含分组编号、分组名称、性质、国家/地区、备注，以及分组总额度与组内已占用融资额度。
        - 常用于以分组为单位查看整体授信规模与额度使用情况。

        ### 返回结果

        成功时返回匹配的记录列表及分页信息。返回列含义见响应定义。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 过滤条件. 组合业务过滤条件。省略某个过滤字段时，不按该字段筛选。
                  properties:
                    aaid:
                      type: string
