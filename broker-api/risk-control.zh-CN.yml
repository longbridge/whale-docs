      x-lbonly: false
      description: |-
        对所选持仓批量发起强制平仓。

        ### 请求参数

        - 必填：`logid_list`（预警记录 ID 列表）、`op_user`（操作员）、`is_intraday_credit`（是否日内融）、`audit_frontend_resource`（调用方审计上下文）
        - 可选：`counter_id`（标的代码）
        - 各字段的格式、取值范围和业务含义见对应字段说明。

        ### 业务说明

        针对预警记录列表对应的持仓批量执行强制平仓；传入 `counter_id` 时可限定平仓的标的。

        ### 风险提示

        此操作对真实客户持仓批量强制平仓，将直接产生实际成交，风险极高且不可逆。调用前务必核对预警记录、标的与操作员。

        ### 处理结果

        成功时提交批量强平；后续状态和返回数据以 `200` 响应定义为准。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - logid_list
                - op_user
                - is_intraday_credit
                - audit_frontend_resource
              properties:
                logid_list:
                  type: array
                  description: 预警记录ID列表. 预警记录ID列表，以 JSON 数组形式提交。此字段为必填项。
                  items:
                    type: string
                op_user:
                  type: string
                  description: 操作员. 发起本次操作的操作员标识，用于审计追踪。此字段为必填项。
                counter_id:
                  type: string
                  description: 标的代码. 证券或基金标的代码，用于定位本次请求处理的标的。
                is_intraday_credit:
                  type: boolean
                  description: |-
                    是否日内融. 是否日内融。此字段为必填项。

                    **布尔值：**
                    - `true` - 表示条件成立
                    - `false` - 表示条件不成立
                audit_frontend_resource:
                  type: object
                  description: 审计上下文. 含 $behavior/$action/aaids
            example:
              logid_list:
                - '123'
              op_user: ''
              counter_id: ''
              is_intraday_credit: false
              audit_frontend_resource:
                $behavior: ''
                $action: ''
                aaids:
