      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 过滤条件
                  properties:
                page:
                  type: integer
                  description: 页码
                page_size:
                  type: integer
                  description: 每页数量
                orderBy:
                  type: array
                  description: 排序参数
                  items:
                    type: object
            example:
              filters: {}
              page: 1
              page_size: 20
              orderBy: []
      responses:
        '200':
          description: 分页返回列表。
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                    description: 0 表示成功；非 0 为业务错误码，此时 data 通常为空。HTTP 状态码本身恒为 200，请勿依赖 HTTP status 判断成功/失败。
                    enum:
                      - 0
                  message:
                    type: string
                  data:
                    type: object
                    required:
                      - list
                      - total
                    properties:
                      list:
                        type: array
                        description: 列表
                        items:
                          type: object
                          properties:
                            short_fall:
                              type: string
                              description: ShortFall
                            buffer:
                              type: string
                              description: Buffer
                            x:
                              type: string
                              description: X
                      total:
                        type: integer
                        description: 总条数
              example:
                code: 0
                message: success
                data:
                  list:
                    - short_fall: string
                      buffer: string
                      x: string
                  total: 1
        '400': *id005
        '401': *id006
        '403': *id007
        '408': *id008
      x-dataset-download:
        method: POST
        path: /v1/datasets/risk_elc_dropbyx/download
        operationId: risk_elc_dropbyx_download
      x-mint:
        href: /zh-CN/api-reference/risk_elc_dropbyx
        metadata:
          sidebarTitle: ELC TopN 股票 DropByX
