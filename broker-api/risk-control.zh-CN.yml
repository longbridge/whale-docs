                    properties:
                      list:
                        type: array
                        description: 列表. **返回值：** 列表列表。
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: 预警编号. **返回值：** 当前记录的唯一标识。
                            real_name:
                              type: string
                              description: 姓名. **返回值：** 姓名。
                            origin_id:
                              type: string
                              description: 证券账号. **返回值：** 证券账号。
                            account_type:
                              type: string
                              description: 账户类型. **返回值：** 账户类型。
                            account_type_val:
                              type: string
                              description: 账户类型（原始值）. 字段 account_type 的原始值：account_type 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            alert_date:
                              type: string
                              description: 预警时间. **返回值：** 预警时间；时间或日期格式以接口实际返回值为准。
                            end_date:
                              type: string
                              description: 截止时间. **返回值：** 截止时间；时间或日期格式以接口实际返回值为准。
                            message_status:
                              type: string
                              description: 消息状态. **返回值：** 消息状态。
                            message_status_val:
                              type: string
                              description: 消息状态（原始值）. 字段 message_status 的原始值：message_status 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            counter_id:
                              type: string
                              description: 证券代码. **返回值：** 证券代码。
                            counter_id_val:
                              type: string
                              description: 证券代码（原始值）. 字段 counter_id 的原始值：counter_id 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            stock_name:
                              type: string
                              description: 证券名称. **返回值：** 证券名称。
                            warning_quantity:
                              type: string
                              description: 应追缴数量. **返回值：** 应追缴数量。
                            status:
                              type: string
                              description: 状态. **返回值：** 状态。
                            status_val:
                              type: string
                              description: 状态（原始值）. 字段 status 的原始值：status 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            remark:
