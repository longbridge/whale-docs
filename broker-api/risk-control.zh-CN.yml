      operationId: stock_index_operate
      summary: 修改股票指数操作
      tags:
        - 风控管理
      x-lbonly: false
      description: |-
        维护股票与指数的对应关系，通过 `operation` 区分具体动作，用于压力测试中股票所属指数级别的归类。

        ### 请求参数

        - 必填：`operation`（操作类型）、`id`（记录 ID）
        - 可选：`stock_code`（股票代码）、`index_code`（指数代码）、`operator`（操作人）
        - 各字段的格式、取值范围和业务含义见对应字段说明。

        ### 业务说明

        `operation` 决定新增、编辑或删除等具体动作，`id` 定位目标记录，`stock_code` 与 `index_code` 建立股票到指数的映射关系。

        ### 风险提示

        此操作会变更压力测试所用的股票指数映射，影响相关风控计算。调用前请确认操作类型和参数无误。

        ### 处理结果

        成功时完成所述业务操作；后续状态和返回数据以 `200` 响应定义为准。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - operation
                - id
              properties:
                operation:
                  type: integer
                  description: 操作类型. enum Operation { 0=Create 1=Edit 2=Delete 3=New }；编辑固定传 1，删除固定传 2（调用方未见 Create=0/New=3 的调用场景）
                  enum:
                    - '0'
                    - '1'
                    - '2'
                    - '3'
                  x-enum-details:
                    - value: '0'
                      label: Create
                    - value: '1'
                      label: Edit
                    - value: '2'
                      label: Delete
                    - value: '3'
                      label: New
                  example: '0'
                stock_code:
                  type: string
                  description: 股票代码. 编辑请求 counter_id 输入框（disabled，展示用）
                index_code:
                  type: string
                  description: 指数代码. 编辑请求 index_code 输入框
                id:
                  type: integer
                  description: 记录ID. 所选股票指数记录的主键ID，程序化带出
                operator:
                  type: string
                  description: 操作人. 当前登录操作员账号，编辑/删除均带上
            example:
              operation: 1
              stock_code: 700.HK
              index_code: HSI
              id: 10086
              operator: user@example.com
      responses:
        '200':
          description: 请求处理成功。响应的 `data` 不包含额外业务字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。

                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`
                      判断具体结果。

                      - `401`：未登录。
                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登录或登录状态已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 当前账号未获得该功能授权。请在 User Permission 中为该账号开通相应权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 请求处理超时。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
      x-mint:
        href: /zh-CN/api-reference/stock_index_operate
        metadata:
          sidebarTitle: 修改股票指数操作
  /v1/datasets/risk_elc_dropbyx:
