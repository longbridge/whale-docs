                              description: 性质. **返回值：** 性质。
                            country:
                              type: string
                              description: 国家/地区. **返回值：** 国家/地区。
                            remark:
                              type: string
                              description: 备注. **返回值：** 备注。
                            group_credit:
                              type: string
                              description: 总额度. **返回值：** 总额度。
                            used_finance_amount:
