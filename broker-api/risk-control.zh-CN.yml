        - 另含 `op_user` 创建人、`remark` 备注及创建、更新时间，是在全局期权保证金系数之外为个别客户设置的差异化配置。

        ### 返回结果

        成功时返回匹配的记录列表及分页信息。返回列含义见响应定义。
