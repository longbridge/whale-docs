        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - index_code
                - index_name
                - index_type
                - operator
                - operation
              properties:
                index_code:
                  type: string
                  description: 指数编码. 用于指定「指数编码」。此字段为必填项。
                index_name:
                  type: string
                  description: 指数名. 用于指定「指数名」。此字段为必填项。
                index_type:
                  type: integer
                  description: 指数级别类型. 指数级别，单选：0=Tier1，1=Tier2，2=Other。删除操作沿用字段名 stock_level（取该记录的 stock_level_val），属历史命名遗留。
                  enum:
                    - '0'
                    - '1'
                    - '2'
                remark:
                  type: string
                  description: 备注. 随本次操作保存的备注。
                operator:
                  type: string
                  description: 操作人. 当前登录操作员账号，新增/编辑/删除均带上
                operation:
                  type: integer
                  description: |-
                    操作类型. 操作类型：0=新增，1=编辑，2=删除，3=初始化数据（仅传 operation=3，无其它字段）

                    **可选值：**
                    - `0` - 表示新增
                    - `1` - 表示编辑
                    - `2` - 表示删除
                    - `3` - 表示初始化数据
                  enum:
                    - '0'
                    - '1'
                    - '2'
                    - '3'
                id:
                  type: integer
                  description: 记录ID. 仅编辑（operation=1）和删除（operation=2）时传，新增（operation=0）和初始化（operation=3）不传
