  /risk_limit/v2/global/update:
    post:
      operationId: risk_limit_global_update
      summary: 更新全局限额
      tags:
        - 风控管理
      x-permission-key:
        - lb_hk_risk_limit_config.risk_limit_config_global_update
      x-lbonly: false
      description: |-
        更新全局（按限额类型与币种）的一条交易限额配置，配置项包括预警（`condition_warn`）、审核（`condition_audit`）和拒绝（`condition_reject`）阈值。

        ### 请求参数

        - 必填：`type`（限额类型）、`code`（限额类型）、`currency`（币种）
        - 各字段的格式、取值范围和业务含义见对应字段说明。

        ### 业务说明

        限额按币种（`currency`）与限额类型（`code`）区分。当交易触及对应阈值时，会分别触发预警、进入审核或被直接拒绝。

        ### 风险提示

        此操作会变更真实的风控限额配置，直接影响后续交易能否通过风控校验。调用前请确认目标对象、币种、限额类型和各阈值无误。

        ### 处理结果

        成功时完成限额配置的写入；后续状态和返回数据以 `200` 响应定义为准。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - type
                - code
                - currency
              properties:
                type:
                  type: string
                  description: 限额类型
                code:
                  type: string
                  description: 限额类型. 限额类型标识。
                currency:
                  type: string
                  description: 币种
                name:
                  type: string
                  description: 名称
                condition_warn:
                  type: object
                  description: 预警条件.
                  properties:
                    operator:
