    get:
      operationId: risk_member_groups
      summary: 客户组查询
      tags:
        - 风控管理
      x-permission-key:
        - credit_limit.client_group_query
      x-lbonly: false
      description: |-
        查询「客户组查询」数据，可通过 `filters` 组合业务筛选条件，并使用 `page`、`page_size` 和 `orderBy` 控制分页与排序。

        ### 返回结果

        成功时返回匹配的记录列表及分页信息。各过滤字段的用途、可选值和动态数据来源见对应字段说明。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 过滤条件. 组合业务过滤条件。省略某个过滤字段时，不按该字段筛选。
                  properties:
                    name:
                      type: string
                      description: 客户组名称. 用于按「客户组名称」筛选结果。
                    account_no_list:
                      type: string
                      description: 证券帐号. 用于按「证券帐号」筛选结果。
                    business_type:
                      type: string
                      description: |-
                        业务类型. 用于按「业务类型」筛选结果。

                        **可选值：**
                        - `1` - 表示保证金
                        - `2` - 表示报表
                        - `3` - 表示风控参数
                      enum:
                        - '1'
                        - '2'
                        - '3'
                page:
                  type: integer
                  description: 页码. 要查询的页码，从 `1` 开始。
                page_size:
                  type: integer
                  description: 每页数量. 每页返回的记录数量。
                orderBy:
                  type: array
                  description: 排序参数. 排序规则数组；每一项定义一个排序字段及排序方向。
                  items:
                    type: object
            example:
              filters: {}
              page: 1
              page_size: 20
              orderBy: []
      responses:
        '200':
          description: 成功时分页返回「客户组查询」记录，以及页码、每页数量和总记录数等分页信息。
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。

                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`
                      判断具体结果。

                      - `401`：未登录。
                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。
                  message:
                    type: string
                  data:
                    type: object
                    required:
                      - list
                      - total
                    properties:
                      list:
                        type: array
                        description: 列表. **返回值：** 列表列表。
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: 客户组 ID. **返回值：** 当前记录的唯一标识。
                            business_type:
                              type: string
                              description: 业务类型. **返回值：** 业务类型。
                            business_type_val:
                              type: string
                              description: 业务类型（原始值）. 字段 business_type 的原始值：business_type 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            name:
                              type: string
                              description: 客户组名称. **返回值：** 客户组名称。
                            count:
                              type: string
                              description: 客户数量. **返回值：** 客户数量。
                            remark:
                              type: string
                              description: 备注. **返回值：** 备注。
                            updated_at:
                              type: string
                              description: 更新时间. **返回值：** 更新时间；时间或日期格式以接口实际返回值为准。
                            op_user:
                              type: string
                              description: 操作人. **返回值：** 操作人。
                      total:
                        type: integer
                        description: 总条数. **返回值：** 符合查询条件的记录总数，用于计算分页。
              example:
                code: 0
                message: success
                data:
                  list:
                    - id: '1139'
                      business_type: Margin
                      business_type_val: '1'
                      name: NANA测试
                      count: '1'
