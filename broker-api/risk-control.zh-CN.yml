                      counter_name_val: ''
                      market: US
                      market_val: US
                      condition_warn: Unlimited
                      condition_audit: Unlimited
                      condition_reject: Unlimited
                      updated_at: '1773748714'
                      last_update_user: user@example.com
                      is_apply: Invalid
                      is_apply_val: 'false'
                  total: 118
        '400':
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
