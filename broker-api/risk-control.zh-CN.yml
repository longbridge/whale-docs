                  properties:
                    code:
                      type: string
                      description: |-
                        限额代码. 用于按「限额代码」筛选结果。

                        候选值会动态变化。请调用 `GET /v1/datasets/refs/risk_limit_codes_stock` 获取当前可用的数据字典，并使用返回项的 `key` 作为本参数值。
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/risk_limit_codes_stock
                      example: SDSB
                    market:
                      type: string
                      description: |-
                        市场. 用于按「市场」筛选结果。

                        **可选值：** `US`、`HK`、`UK`、`SH`、`SZ`、`SG`、`KR`、`JP`、`AU`、`DE`、`CA`、`TH`、`ID`、`MY`、`TR`、`NA`、`OSL`、`HAS`、`EU`、`UT`、`GTMMF`
                      enum:
                        - US
                        - HK
                        - UK
                        - SH
                        - SZ
                        - SG
                        - KR
                        - JP
                        - AU
                        - DE
                        - CA
                        - TH
                        - ID
                        - MY
                        - TR
                        - NA
                        - OSL
                        - HAS
                        - EU
                        - UT
                        - GTMMF
                      example: US
                    counter_id:
                      type: string
                      description: 证券代码. 用于按「证券代码」筛选结果。
                      example: ST/US/BABA
                    is_apply:
                      type: string
                      description: 生效状态. 用于按「生效状态」筛选结果。
                      enum:
                        - 'true'
                        - 'false'
                      x-enum-details:
                        - value: 'true'
                          label: 生效中
                        - value: 'false'
                          label: 已失效
                      example: Invalid
                page:
                  type: integer
                  description: 页码. 要查询的页码，从 `1` 开始。
                page_size:
                  type: integer
                  description: 每页数量. 每页返回的记录数量。
                orderBy:
                  type: array
                  description: 排序参数. 排序规则数组；每一项定义一个排序字段及排序方向。
                  items:
                    type: object
            example:
              filters: {}
              page: 1
              page_size: 20
              orderBy: []
      responses:
        '200':
          description: 成功时分页返回「证券限额」记录，以及页码、每页数量和总记录数等分页信息。
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。

                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`
                      判断具体结果。

                      - `401`：未登录。
                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。
                  message:
                    type: string
                  data:
                    type: object
                    required:
                      - list
                      - total
                    properties:
                      list:
                        type: array
                        description: 列表. **返回值：** 列表列表。
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: 序号. **返回值：** 当前记录的唯一标识。
                            code:
                              type: string
                              description: 限额代码. **返回值：** 限额代码。
                            name:
                              type: string
                              description: 限额名称. **返回值：** 限额名称。
                            enable:
                              type: string
                              description: 启用标识. **返回值：** 表示启用标识。
                            enable_val:
                              type: string
                              description: 启用标识（原始值）. 字段 enable 的原始值：enable 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            currency:
                              type: string
                              description: 限额币种. **返回值：** 限额币种。
                            counter_id:
                              type: string
                              description: 证券代码. **返回值：** 证券代码。
                            counter_id_val:
                              type: string
                              description: 证券代码（原始值）. 字段 counter_id 的原始值：counter_id 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            counter_name:
                              type: string
                              description: 证券名称. **返回值：** 证券名称。
                            counter_name_val:
                              type: string
                              description: 证券名称（原始值）. 字段 counter_name 的原始值：counter_name 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            market:
                              type: string
                              description: 市场. **返回值：** 市场。
                            market_val:
                              type: string
                              description: 市场（原始值）. 字段 market 的原始值：market 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            condition_warn:
                              type: string
                              description: 提示条件. **返回值：** 提示条件。
                            condition_audit:
                              type: string
                              description: 审核条件. **返回值：** 审核条件。
                            condition_reject:
                              type: string
                              description: 拒绝条件. **返回值：** 拒绝条件。
                            updated_at:
                              type: string
                              description: 更新时间. **返回值：** 更新时间；时间或日期格式以接口实际返回值为准。
                            last_update_user:
                              type: string
                              description: 操作人. **返回值：** 操作人。
                            is_apply:
                              type: string
                              description: 生效状态. **返回值：** 表示生效状态。
                            is_apply_val:
                              type: string
                              description: 生效状态（原始值）. 字段 is_apply 的原始值：is_apply 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                      total:
                        type: integer
                        description: 总条数. **返回值：** 符合查询条件的记录总数，用于计算分页。
              example:
                code: 0
                message: success
                data:
                  list:
                    - id: '47147'
                      code: SDSB
                      name: 股票单日累计下单卖出金额限额
                      enable: Not Activated
                      enable_val: 'false'
                      currency: USD
                      counter_id: ST/US/BABA
