  /v1/datasets/risk_trader_limits:
    post:
      operationId: risk_trader_limits
      summary: 交易员限额
      tags:
        - 风控管理
      x-permission-key:
        - lb_hk_risk_limit_config.risk_limit_config_trader_query
      x-lbonly: false
      description: |-
        查询交易员限额，即按交易员账号维度设置的下单风控限额配置。

        ### 请求参数

        - 通过 `filters` 组合业务筛选条件（可选字段见下方 filters 字段说明），并使用 `page`、`page_size`、`orderBy` 控制分页与排序。

        ### 业务说明

        - 每条记录由限额代码 `code` 与交易员（`trader` 账号、`trader_join` 编号）共同确定，`name` 为限额名称。

        - 各条限额设有提示、审核、拒绝三档阈值（`level_warn`/`level_audit`/`level_reject`）及比较运算符，组合成 `condition_warn`、`condition_audit`、`condition_reject`，用于对该交易员的下单进行提示、审核或拒绝。

        - 记录还含限额币种、启用标识 `enable`、生效状态 `is_apply`、操作人 `last_update_user` 与更新时间。

        - 常用于按交易员核对与维护其专属的下单限额。

        ### 返回结果

        成功时返回匹配的记录列表及分页信息。返回列含义见响应定义。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 过滤条件. 组合业务过滤条件。省略某个过滤字段时，不按该字段筛选。
                  properties:
                    code:
                      type: string
                      description: |-
                        限额代码. 用于按「限额代码」筛选结果。

                        候选值会动态变化。请调用 `GET /v1/datasets/refs/risk_limit_codes_trader` 获取当前可用的数据字典，并使用返回项的 `key` 作为本参数值。
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/risk_limit_codes_trader
                      example: UBB
                    trader:
                      type: string
                      description: 交易员. 用于按「交易员」筛选结果。
                      example: LBtaiyang
                    is_apply:
                      type: string
                      description: 生效状态. 用于按「生效状态」筛选结果。
                      enum:
                        - 'true'
                        - 'false'
                      x-enum-details:
                        - value: 'true'
                          label: 生效中
                        - value: 'false'
                          label: 已失效
                      example: Invalid
                page:
                  type: integer
                  description: 页码. 要查询的页码，从 `1` 开始。
                page_size:
                  type: integer
                  description: 每页数量. 每页返回的记录数量。
                orderBy:
                  type: array
                  description: 排序参数. 排序规则数组；每一项定义一个排序字段及排序方向。
                  items:
                    type: object
            example:
              filters: {}
              page: 1
              page_size: 20
              orderBy: []
      responses:
        '200':
          description: 成功时分页返回「交易员限额」记录，以及页码、每页数量和总记录数等分页信息。
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。

                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`
                      判断具体结果。

                      - `401`：未登录。
                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。
                  message:
                    type: string
                  data:
                    type: object
                    required:
                      - list
                      - total
                    properties:
                      list:
                        type: array
                        description: 列表. **返回值：** 列表列表。
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: 序号. **返回值：** 当前记录的唯一标识。
                            code:
                              type: string
                              description: 限额代码. **返回值：** 限额代码。
                            name:
                              type: string
                              description: 限额名称. **返回值：** 限额名称。
                            enable:
                              type: string
                              description: 启用标识. **返回值：** 表示启用标识。
                            enable_val:
                              type: string
                              description: 启用标识（原始值）. 字段 enable 的原始值：enable 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            currency:
                              type: string
                              description: 限额币种. **返回值：** 限额币种。
                            trader:
                              type: string
                              description: 交易员账号. **返回值：** 交易员账号。
                            trader_val:
                              type: string
                              description: 交易员账号（原始值）. 字段 trader 的原始值：trader 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            trader_join:
                              type: string
                              description: 交易员编号. **返回值：** 交易员编号。
                            condition_warn:
                              type: string
                              description: 提示条件. **返回值：** 提示条件。
                            condition_audit:
                              type: string
                              description: 审核条件. **返回值：** 审核条件。
                            condition_reject:
                              type: string
                              description: 拒绝条件. **返回值：** 拒绝条件。
                            updated_at:
                              type: string
                              description: 更新时间. **返回值：** 更新时间；时间或日期格式以接口实际返回值为准。
                            last_update_user:
                              type: string
                              description: 操作人. **返回值：** 操作人。
                            is_apply:
                              type: string
                              description: 生效状态. **返回值：** 表示生效状态。
                            is_apply_val:
                              type: string
                              description: 生效状态（原始值）. 字段 is_apply 的原始值：is_apply 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                      total:
                        type: integer
                        description: 总条数. **返回值：** 符合查询条件的记录总数，用于计算分页。
              example:
                code: 0
                message: success
                data:
                  list:
                    - id: '21241'
                      code: UBB
                      name: UBB_auto_test_2097.85USD
                      enable: Activated
                      enable_val: 'true'
                      currency: USD
                      trader: LBtaiyang
                      trader_val: '13740185'
                      trader_join: '13740185'
                      condition_warn: Unlimited
                      condition_audit: '>=2,097.85'
                      condition_reject: '>=2,099.85'
                      updated_at: 2026-07-14 16:56
                      last_update_user: user@example.com
                      is_apply: Invalid
                      is_apply_val: 'false'
                  total: 8812
        '400':
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登录或登录状态已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 当前账号未获得该功能授权。请在 User Permission 中为该账号开通相应权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 请求处理超时。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
