          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。

                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`
                      判断具体结果。

                      - `401`：未登录。
                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。
                  message:
                    type: string
                  data:
                    type: object
                    required:
                      - list
                      - total
                    properties:
                      list:
                        type: array
                        description: 列表. **返回值：** 列表列表。
                        items:
                          type: object
                          properties:
                            due_date:
                              type: string
                              description: 行权日. **返回值：** 行权日；时间或日期格式以接口实际返回值为准。
                            status:
                              type: string
                              description: 处理状态. **返回值：** 处理状态。
                            status_val:
                              type: string
                              description: 处理状态（原始值）. 字段 status 的原始值：status 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            option_count:
                              type: string
                              description: 期权标的数量. **返回值：** 期权标的数量。
                            total_option_holding_num:
                              type: string
                              description: 持仓总张数. **返回值：** 持仓总张数。
                            exercised_option_count:
                              type: string
                              description: 行权标的数. **返回值：** 行权标的数。
                            advance_exercise_option_count:
                              type: string
                              description: 提前行权标的数. **返回值：** 提前行权标的数。
                            expired_option_count:
                              type: string
                              description: 放弃行权标的数. **返回值：** 放弃行权标的数。
                            partially_exercised_option_count:
                              type: string
                              description: 部分行权标的数. **返回值：** 部分行权标的数。
                            handled_option_count:
                              type: string
                              description: 已处理标的数. **返回值：** 已处理标的数。
                            settlement_channel_code:
                              type: string
                              description: 结算渠道. **返回值：** 结算渠道。
                            settlement_channel_code_val:
                              type: string
                              description: 结算渠道（原始值）. 字段 settlement_channel_code 的原始值：settlement_channel_code 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                      total:
                        type: integer
                        description: 总条数. **返回值：** 符合查询条件的记录总数，用于计算分页。
              example:
                code: 0
                message: success
                data:
                  list:
                    - due_date: 2026-07-14
                      status: Processed
                      status_val: handled
                      option_count: '1'
                      total_option_holding_num: '10'
                      exercised_option_count: '1'
                      advance_exercise_option_count: '0'
                      expired_option_count: '0'
