      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 过滤条件. 组合业务过滤条件。省略某个过滤字段时，不按该字段筛选。
                  properties:
                    finance_amount:
                      type: object
                      description: 融资额度. 用于按「融资额度」筛选结果。
                      properties:
                        gte:
                          type: integer
                          description: 大于等于. 筛选范围的下限，匹配值包含该值。
                        lte:
                          type: integer
                          description: 小于等于. 筛选范围的上限，匹配值包含该值。
                    state:
                      type: string
                      description: |-
                        账户状态. 用于按「账户状态」筛选结果。

                        **可选值：**
                        - `-1` - 表示已注销
                        - `1` - 表示正常
                      enum:
                        - '-1'
                        - '1'
                    member_account_type:
                      type: string
                      description: |-
                        账户类型. 用于按「账户类型」筛选结果。

                        **可选值：**
                        - `M` - 表示融资账户
                        - `C` - 表示现金账户
                        - `F` - 表示期货账户
                      enum:
                        - M
                        - C
                        - F
                    account_mark:
                      type: string
                      description: |-
                        账户标识. 用于按「账户标识」筛选结果。

                        **可选值：**
                        - `dt` - 表示 Day Trade
                      enum:
                        - dt
                    member_id:
                      type: string
                      description: 客户. 用于按「客户」筛选结果。
                    credit_group_name:
                      type: string
                      description: 授信组. 用于按「授信组」筛选结果。
                page:
                  type: integer
                  description: 页码. 要查询的页码，从 `1` 开始。
                page_size:
                  type: integer
                  description: 每页数量. 每页返回的记录数量。
                orderBy:
                  type: array
                  description: 排序参数. 排序规则数组；每一项定义一个排序字段及排序方向。
                  items:
                    type: object
            example:
              filters: {}
              page: 1
              page_size: 20
              orderBy: []
