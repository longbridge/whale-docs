  /risk/v1/batch_reset_credit_task_v3:
    post:
      operationId: batch_reset_credit_task_v3
      summary: 导入批量调整授信任务
      tags:
        - 风控管理
      x-lbonly: false
      description: |-
        导入文件后提交，批量调整客户授信额度。

        ### 请求参数

        - 必填：`s3_key`（文件对象存储 Key）、`audit_frontend_resource`（调用方审计上下文）
        - 各字段的格式、取值范围和业务含义见对应字段说明。

        ### 业务说明

        先将 CSV/Excel 文件上传至对象存储，再以其 `s3_key` 提交批量授信调整任务，由后台按文件内容批量处理。

        ### 风险提示

        此操作触发真实批量授信额度变更，影响范围大。调用前请确认文件内容与 `s3_key` 无误。

        ### 处理结果

        成功时提交批量调整授信任务；后续状态和返回数据以 `200` 响应定义为准。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - s3_key
                - audit_frontend_resource
              properties:
                s3_key:
                  type: string
                  description: 文件对象存储Key. 批量调整授信的 CSV/Excel 文件上传后返回的对象 Key，服务端据此解析生成批量调整授信任务
                audit_frontend_resource:
                  type: object
                  description: 审计上下文. 审计留痕字段，包含上传文件名，供审计日志展示
            example:
              s3_key: credit_management/20260710/credit_batch_change_v2.xlsx
              audit_frontend_resource:
                file_name: credit_batch_change_v2.xlsx
      responses:
        '200':
          description: 请求处理成功。响应的 `data` 不包含额外业务字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。

                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`
                      判断具体结果。

                      - `401`：未登录。
                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。
                  message:
                    type: string
                  data:
                    type: object
                    description: 成功时 `data` 为空对象。
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登录或登录状态已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 当前账号未获得该功能授权。请在 User Permission 中为该账号开通相应权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 请求处理超时。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
      x-mint:
        href: /zh-CN/api-reference/batch_reset_credit_task_v3
        metadata:
          sidebarTitle: 导入批量调整授信任务
  /risk/v1/trade_credit/modify:
    post:
      operationId: trade_credit_modify
      summary: 修改客户交易额度
      tags:
        - 风控管理
      x-lbonly: false
      description: |-
        新增或修改客户的交易额度配置。

        ### 请求参数

        - 必填：`aaid`（客户资金账户 ID）、`trade_credit_type`（额度类型）、`trade_credit_map`（币种额度映射）、`expired_at`（到期时间）、`action`（操作类型）
        - 可选：`remark`（备注）、`audit_frontend_resource`（调用方审计上下文）
        - 各字段的格式、取值范围和业务含义见对应字段说明。

        ### 业务说明

        按 `action` 指定的操作类型对指定账户的交易额度进行新增或修改，额度按币种映射设定，并受 `expired_at` 到期时间约束。

        ### 风险提示

        此操作变更真实交易额度。调用前请核对账户、额度类型、各币种金额与到期时间。

        ### 处理结果

        成功时完成交易额度的新增或修改；后续状态和返回数据以 `200` 响应定义为准。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - aaid
                - trade_credit_type
                - trade_credit_map
                - expired_at
                - action
              properties:
                aaid:
                  type: string
                  description: 客户资金账户ID(AAID). 请求 member_query_aaid 组件选择的客户资金账号，编辑时禁用不可改
                trade_credit_type:
                  type: string
                  description: |-
                    额度类型。可选值来自后端数据字典；常见取值：`0`（单一货币交易额度）、`1`（多货币交易额度）。
                  enum:
                    - '0'
                    - '1'
                  x-enum-details:
                    - value: '0'
                      label: 单一货币交易额度
                    - value: '1'
                      label: 多货币交易额度
                  example: '0'
                trade_credit_map:
                  type: object
                  description: 币种额度映射. 币种->额度键值对，如 {"HKD":"100000"}；trade_credit_type=0 时仅含单一币种，=1 时可含多币种。
                expired_at:
                  type: number
                  description: 到期时间. unix 时间戳（秒），date-picker 选择日期后，时分秒取提交时的当前时间
                remark:
                  type: string
                  description: 备注. textarea，最长 100 字符
                action:
                  type: number
                  description: 操作类型. 0=新增 (add) 1=编辑 (edit)，由调用方根据是否传入 item 记录自动计算
                  enum:
                    - '0'
                    - '1'
                  x-enum-details:
                    - value: '0'
                      label: 新增
                    - value: '1'
                      label: 编辑
                  example: '0'
                audit_frontend_resource:
                  type: object
                  description: 审计上下文. 非核心业务字段，携带变更前 (before)与变更后 (value)数据及 $action/$behavior，用于风控审批工单展示
            example:
              aaid: H00000000
              trade_credit_type: '1'
              trade_credit_map:
                HKD: '100000'
                USD: '50000'
              expired_at: 1751328000
              remark: 客户申请提升交易额度
              action: 0
              audit_frontend_resource:
                aaid: H00000000
                expired_at: 1748736000
                remark: ''
                trade_credit_type: '0'
                trade_credit_map: '{"HKD":"50000"}'
                value:
                  aaid: H00000000
                  trade_credit_type: '1'
                  trade_credit_map:
                    - key: HKD
                      value: '100000'
                add: true
                edit:
                $action: add
                $behavior: 新增客户交易额度
      responses:
        '200':
          description: 请求处理成功。响应的 `data` 不包含额外业务字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。

                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`
                      判断具体结果。

                      - `401`：未登录。
                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      ticket_id:
                        type: string
                        description: 工单ID，该接口接入了工单审批功能
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登录或登录状态已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 当前账号未获得该功能授权。请在 User Permission 中为该账号开通相应权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 请求处理超时。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
      x-mint:
        href: /zh-CN/api-reference/trade_credit_modify
        metadata:
          sidebarTitle: 修改客户交易额度
