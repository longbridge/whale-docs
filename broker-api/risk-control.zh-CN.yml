  /v1/option_exercise_manger/check_exercise_data:
    post:
      operationId: check_exercise_data
      summary: 确认执行行权对账
      tags:
        - 风控管理
      x-lbonly: false
      description: |-
        确认执行行权对账。

        ### 请求参数

        - 必填：`due_date`（到期日）、`check_type`（检查类型）、`settlement_channel_code`（结算渠道代码）
        - 可选：`file_key`（文件Key）
        - 各字段的格式、取值范围和业务含义见对应字段说明。

        ### 业务说明

        涉及真实行权对账确认，风险极高。

        ### 风险提示

        > 此操作可能引起真实资金、持仓或交易状态变化。调用前请确认目标记录和参数无误。

        ### 处理结果

        成功时完成上述业务操作；后续状态和返回数据以 `200` 响应定义为准。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - due_date
                - check_type
                - settlement_channel_code
              properties:
                file_key:
                  type: string
                  description: 文件Key. 文件上传后返回的对象存储 Key，用于定位本次请求处理的文件。
                due_date:
                  type: string
                  description: 到期日. 用于指定「到期日」。此字段为必填项。
                check_type:
                  type: string
                  description: 检查类型. 用于指定「检查类型」。此字段为必填项。
                settlement_channel_code:
                  type: string
                  description: 结算渠道代码. 用于指定「结算渠道代码」。此字段为必填项。
            example:
              file_key: ''
              due_date: 2026-07-10
              check_type: ''
              settlement_channel_code: ''
      responses:
        '200':
          description: 请求处理成功。响应的 `data` 不包含额外业务字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。

                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`
                      判断具体结果。

                      - `401`：未登录。
                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登录或登录状态已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 当前账号未获得该功能授权。请在 User Permission 中为该账号开通相应权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 请求处理超时。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
      x-mint:
        href: /zh-CN/api-reference/check_exercise_data
        metadata:
          sidebarTitle: 确认执行行权对账
