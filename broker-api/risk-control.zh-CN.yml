openapi: 3.1.1
info:
  title: Longport Whale 券商 API
  description: 面向使用 Longport Whale 的券商提供机构级服务端 API。
  version: 2.0.0
servers:
  - url: https://b-api.longbridge.xyz
    description: 测试环境
  - url: https://b-api.lbkrs.com
    description: 生产环境
security:
  - bearerAuth: []
tags:
  - name: 风控管理
paths:
  /risk/v1/account_credits/manually_create:
    post:
      operationId: manually_create_account_credit
      summary: 人工新增授信客户
      tags:
        - 风控管理
      x-permission-key:
        - credit_limit.credit_clients_add
      x-lbonly: false
      description: 人工为指定证券账号新增一条授信客户记录，设置其授信额度。写操作，直接产生真实授信额度变更。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - aaid
                - credit_limit
              properties:
                aaid:
                  type: string
                  description: 证券账号
                credit_limit:
                  type: number
                  description: 授信额度
                remark:
                  type: string
                  description: 备注
            example:
              aaid: H00000000
              credit_limit: 100000
              remark: ''
      responses:
        '200':
          description: 未实调，响应字段以真实接口为准。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: 0 表示成功；非 0 为业务错误码，此时 data 通常为空。HTTP 状态码本身恒为 200，请勿依赖 HTTP status 判断成功/失败。
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
      x-mint:
        href: /zh-CN/api-reference/manually_create_account_credit
        metadata:
          sidebarTitle: 人工新增授信客户
  /risk/v1/admin_credit_adjust/apply:
    post:
      operationId: admin_credit_adjust_apply
      summary: 后台提交调整授信额度申请
      tags:
        - 风控管理
      x-permission-key:
        - lb_hk_credit_limit.client_credit_limit_apply
      x-lbonly: false
      description: 后台提交一条客户授信额度调整申请，进入审核流程。写操作。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - aaid
                - member_id
                - credit_currency
                - before_credit_amount
                - after_credit_amount
                - applicant
              properties:
                aaid:
                  type: string
                  description: 证券账号
                member_id:
                  type: string
                  description: 用户 ID
                credit_currency:
                  type: string
                  description: 授信币种
                before_credit_amount:
                  type: string
                  description: 调整前额度
                after_credit_amount:
                  type: string
                  description: 调整后额度
                applicant:
                  type: string
                  description: 申请人
                remark:
                  type: string
                  description: 备注
            example:
              aaid: H00000000
              member_id: '1000000000000000000'
              credit_currency: HKD
              before_credit_amount: '0'
              after_credit_amount: '100000'
              applicant: user@example.com
              remark: ''
      responses:
        '200':
          description: 未实调，响应字段以真实接口为准。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: 0 表示成功；非 0 为业务错误码，此时 data 通常为空。HTTP 状态码本身恒为 200，请勿依赖 HTTP status 判断成功/失败。
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
      x-mint:
        href: /zh-CN/api-reference/admin_credit_adjust_apply
        metadata:
          sidebarTitle: 后台提交调整授信额度申请
  /risk/v1/delete_canceled_account_credit:
    post:
      operationId: delete_canceled_account_credit
      summary: 删除已取消的客户授信额度
      tags:
        - 风控管理
      x-lbonly: false
      description: |-
        删除已取消的客户授信额度。

        ### 请求参数

        - 必填：`aaid_list`（证券账号列表）、`audit_frontend_resource`（审计上下文）
        - 各字段的格式、取值范围和业务含义见对应字段说明。

        ### 业务说明

        涉及真实授信额度变更。

        ### 处理结果

        成功时完成上述业务操作；后续状态和返回数据以 `200` 响应定义为准。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - aaid_list
                - audit_frontend_resource
              properties:
                aaid_list:
                  type: array
                  description: 证券账号列表. 证券账号列表，以 JSON 数组形式提交。此字段为必填项。
                  items:
                    type: string
                audit_frontend_resource:
                  type: object
                  description: 审计上下文. 含 $behavior/credit_amount
            example:
              aaid_list:
                - '123'
              audit_frontend_resource:
                $behavior: ''
                credit_amount: ''
      responses:
        '200':
          description: 请求处理成功。响应的 `data` 不包含额外业务字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。

                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`
                      判断具体结果。

                      - `401`：未登录。
                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登录或登录状态已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 当前账号未获得该功能授权。请在 User Permission 中为该账号开通相应权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 请求处理超时。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
      x-mint:
        href: /zh-CN/api-reference/delete_canceled_account_credit
        metadata:
          sidebarTitle: 删除已取消的客户授信额度
