                            stock_name:
                              type: string
                              description: 证券名称. **返回值：** 证券名称。
                            market:
                              type: string
                              description: 市场. **返回值：** 市场。
                            im_factor:
                              type: string
                              description: 初始保证金率（%）. **返回值：** 初始保证金率（%）。
                            mm_factor:
                              type: string
                              description: 维持保证金率（%）. **返回值：** 维持保证金率（%）。
                            fm_factor:
                              type: string
                              description: 强平保证金率（%）. **返回值：** 强平保证金率（%）。
                            mcm_factor:
                              type: string
                              description: Margincall 保证金（%）. **返回值：** Margincall 保证金（%）。
                            available:
