  /risk/v1/batch_reset_credit_task_v3:
    post:
      operationId: batch_reset_credit_task_v3
      summary: 导入批量调整授信任务
      tags:
        - 风控管理
      x-lbonly: false
      description: |-
        上传 CSV/Excel 文件后提交，批量调整客户授信额度。涉及真实批量授信额度变更，请谨慎操作。

        ### 请求参数

        - 必填：`s3_key`（文件对象存储Key）、`audit_frontend_resource`（审计调用方附加信息）
        - 各字段的格式、取值范围、默认行为和业务含义见对应字段说明。

        ### 处理结果

        成功时完成所述业务操作，具体返回内容见 `200` 响应定义。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - s3_key
                - audit_frontend_resource
              properties:
                s3_key:
                  type: string
                  description: 文件对象存储Key. 批量调整授信的 CSV/Excel 文件上传后返回的对象 Key，服务端据此解析生成批量调整授信任务
                audit_frontend_resource:
                  type: object
                  description: 审计上下文. 审计留痕字段，包含上传文件名，供审计日志展示
            example:
              s3_key: credit_management/20260710/credit_batch_change_v2.xlsx
              audit_frontend_resource:
                file_name: credit_batch_change_v2.xlsx
      responses:
        '200':
          description: 请求处理成功。响应的 `data` 不包含额外业务字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。

                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`
                      判断具体结果。

