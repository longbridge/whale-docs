                      enum:
                        - handled
                        - waittohandle
                        - waittocheck
                      x-enum-details:
                        - value: handled
                          label: 已处理
                        - value: waittohandle
                          label: 待处理
                        - value: waittocheck
                          label: 待对账
                      example: Processed
                    settlement_channel_code:
                      type: string
                      description: 结算渠道. 用于按「结算渠道」筛选结果。
                      enum:
                        - '3'
                        - '26'
                      x-enum-details:
                        - value: '3'
                          label: ib
                        - value: '26'
                          label: atomic
                      example: Lb Hk
                page:
                  type: integer
                  description: 页码. 要查询的页码，从 `1` 开始。
                page_size:
                  type: integer
                  description: 每页数量. 每页返回的记录数量。
                orderBy:
                  type: array
                  description: 排序参数. 排序规则数组；每一项定义一个排序字段及排序方向。
                  items:
                    type: object
            example:
              filters: {}
              page: 1
              page_size: 20
              orderBy: []
