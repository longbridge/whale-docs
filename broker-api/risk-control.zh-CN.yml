  /v1/datasets/holding_short_stock_margin_logs:
    post:
      operationId: holding_short_stock_margin_logs
      summary: 空头股票追收
      tags:
        - 风控管理
      x-permission-key:
        - lb_hk_margin_call.margin_call_query
      x-lbonly: false
      description: |-
        查询空头（卖空）股票追收预警记录，用于风控对卖空持仓触发的股票追缴进行监控与消息跟进。

        ### 请求参数

        - 通过 `filters` 组合业务筛选条件（可选字段见下方 filters 字段说明），并使用 `page`、`page_size`、`orderBy` 控制分页与排序。

