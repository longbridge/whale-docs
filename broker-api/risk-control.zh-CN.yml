        - 每条记录包含客户账号、`证券代码`、预警日期、追收状态、发送给客户的消息状态与备注等信息。

        - 支持按客户、预警日期、证券、消息状态与备注筛选，其中消息状态与备注支持多选。

        - 供风控人员批量向相关客户发送追收消息并跟进处理进度。

        ### 返回结果

        成功时返回匹配的记录列表及分页信息。返回列含义见响应定义。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
