                  type: number
                  description: 生效日期
                remark:
                  type: string
                  description: 备注
                operator:
                  type: string
                  description: operator
                source:
                  type: string
                  description: source
                policy:
                  type: number
                  description: 策略类型
                audit_frontend_resource:
                  type: object
                  description: audit_frontend_resource
      responses:
