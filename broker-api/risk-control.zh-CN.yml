  /v1/datasets/account_credits:
    post:
      operationId: account_credits
      summary: 客户额度
      tags:
        - 风控管理
      x-permission-key:
        - lb_hk_credit_limit.client_credit_limit_query
      x-lbonly: false
      description: |-
        查询客户融资授信额度台账，用于风控查看每个客户账户当前的授信与融资额度情况。

        ### 请求参数

        - 通过 `filters` 组合业务筛选条件（可选字段见下方 filters 字段说明），并使用 `page`、`page_size`、`orderBy` 控制分页与排序。

        ### 业务说明

        - 数据按客户证券账户逐户汇总，覆盖账户所属柜台、账户类型、账户标识、客户类型及所属授信组。
        - 每条记录包含授信额度、融资额度、已占用融资额度、最大历史占用额度，以及授信状态与授信、融资生效时间。
        - 常用于监控客户的融资额度使用与授信状态，为额度管理与风险评估提供依据。

        ### 返回结果

        成功时返回匹配的记录列表及分页信息。返回列含义见响应定义。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 过滤条件. 组合业务过滤条件。省略某个过滤字段时，不按该字段筛选。
                  properties:
                    finance_amount:
                      type: object
                      description: 融资额度. 用于按「融资额度」筛选结果。
                      properties:
                        gte:
                          type: integer
                          description: 大于等于. 筛选范围的下限，匹配值包含该值。
                        lte:
                          type: integer
                          description: 小于等于. 筛选范围的上限，匹配值包含该值。
                    state:
                      type: string
                      description: 账户状态. 用于按「账户状态」筛选结果。
                      enum:
                        - '-1'
                        - '1'
                      x-enum-details:
                        - value: '-1'
                          label: 已注销
                        - value: '1'
                          label: 正常
                      example: Active
                    member_account_type:
                      type: string
                      description: 账户类型. 用于按「账户类型」筛选结果。
                      enum:
                        - M
                        - C
                        - F
                      x-enum-details:
                        - value: M
                          label: 融资账户
                        - value: C
                          label: 现金账户
                        - value: F
                          label: 期货账户
                      example: M
                    account_mark:
                      type: string
                      description: 账户标识. 用于按「账户标识」筛选结果。
                      enum:
                        - dt
                      x-enum-details:
                        - value: dt
                          label: Day Trade
                      example: dt
                    member_id:
                      type: string
                      description: 客户. 用于按「客户」筛选结果。
                    credit_group_name:
                      type: string
                      description: 授信组. 用于按「授信组」筛选结果。
                      example: tet
                page:
                  type: integer
                  description: 页码. 要查询的页码，从 `1` 开始。
                page_size:
                  type: integer
                  description: 每页数量. 每页返回的记录数量。
                orderBy:
                  type: array
                  description: 排序参数. 排序规则数组；每一项定义一个排序字段及排序方向。
                  items:
                    type: object
            example:
              filters: {}
              page: 1
              page_size: 20
              orderBy: []
      responses:
        '200':
          description: 成功时分页返回「授信额度查询」记录，以及页码、每页数量和总记录数等分页信息。
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
