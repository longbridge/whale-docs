                  type: object
                  description: 过滤条件. 组合业务过滤条件。省略某个过滤字段时，不按该字段筛选。
                  properties:
                    aaid:
                      type: string
                      description: 客户. 用于按「客户」筛选结果。
                    alert_date:
                      type: string
                      description: 预警日期. 用于按「预警日期」筛选结果。
                      format: date
                    counter_id:
                      type: string
                      description: 证券代码. 用于按「证券代码」筛选结果。
                    message_status:
                      type: string
                      description: |-
                        消息状态. 用于按「消息状态」筛选结果。

                        支持多选；提交时使用英文逗号（`,`）拼接多个值。不传时不按此字段筛选。
                      example: 0,1
                      enum:
                        - '0'
                        - '1'
                      x-enum-details:
                        - value: '0'
                          label: 已发送
                        - value: '1'
                          label: 待发送
                    remark:
                      type: string
                      description: |-
                        备注. 用于按「备注」筛选结果。

                        支持多选；提交时使用英文逗号（`,`）拼接多个值。不传时不按此字段筛选。
                      example: 2,1
                      enum:
                        - '2'
                        - '1'
                        - '3'
                        - '4'
                        - '5'
                      x-enum-details:
                        - value: '2'
                          label: 沽空池不足
                        - value: '1'
                          label: 用户未开通沽空权限
                        - value: '3'
                          label: 日内融账号
                        - value: '4'
                          label: 人工禁止沽空
                        - value: '5'
                          label: HKEX 不可卖空
                page:
                  type: integer
                  description: 页码. 要查询的页码，从 `1` 开始。
                page_size:
                  type: integer
                  description: 每页数量. 每页返回的记录数量。
                orderBy:
                  type: array
                  description: 排序参数. 排序规则数组；每一项定义一个排序字段及排序方向。
