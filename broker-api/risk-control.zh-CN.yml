      x-lbonly: false
      description: |-
        查询「融券持仓概览」数据，可通过 `filters` 组合业务筛选条件，并使用 `page`、`page_size` 和 `orderBy` 控制分页与排序。

        ### 返回结果

        成功时返回匹配的记录列表及分页信息。各过滤字段的用途、可选值和动态数据来源见对应字段说明。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 过滤条件. 组合业务过滤条件。省略某个过滤字段时，不按该字段筛选。
                  properties:
                    counter_id:
                      type: string
                      description: 证券代码. 用于按「证券代码」筛选结果。
                    market:
                      type: string
                      description: |-
                        市场. 用于按「市场」筛选结果。

                        支持多选；提交时使用英文逗号（`,`）拼接多个值。不传时不按此字段筛选。

                        **可选值：**
                        - `US` - 美股
                        - `HK` - 港股
                        - `CN` - 表示沪深
                        - `SG` - 新加坡
                        - `VAHK` - 表示虚拟资产
                        - `CNHK` - 表示沪深港通
                      example: US,HK
                      enum:
                        - US
                        - HK
                        - CN
                        - SG
                        - VAHK
                        - CNHK
                page:
                  type: integer
                  description: 页码. 要查询的页码，从 `1` 开始。
                page_size:
                  type: integer
                  description: 每页数量. 每页返回的记录数量。
                orderBy:
                  type: array
                  description: 排序参数. 排序规则数组；每一项定义一个排序字段及排序方向。
                  items:
                    type: object
            example:
              filters: {}
              page: 1
              page_size: 20
              orderBy: []
      responses:
        '200':
          description: 成功时分页返回「融券持仓概览」记录，以及页码、每页数量和总记录数等分页信息。
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。

                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`
                      判断具体结果。

                      - `401`：未登录。
                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。
                  message:
                    type: string
                  data:
                    type: object
                    required:
                      - list
                      - total
                    properties:
                      list:
                        type: array
                        description: 列表. **返回值：** 列表列表。
                        items:
                          type: object
                          properties:
                            counter_id:
                              type: string
                              description: 证券代码. **返回值：** 证券代码。
                            counter_id_val:
                              type: string
                              description: 证券代码（原始值）. 字段 counter_id 的原始值：counter_id 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            market:
                              type: string
                              description: 市场. **返回值：** 市场。
                            market_val:
                              type: string
                              description: 市场（原始值）. 字段 market 的原始值：market 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            counter_name:
                              type: string
                              description: 证券名称. **返回值：** 证券名称。
                            available:
                              type: string
                              description: 融券池数量 (IB). **返回值：** 融券池数量 (IB)。
                            client_count:
                              type: string
                              description: 持仓客户数. **返回值：** 持仓客户数。
                            total:
                              type: string
                              description: 持仓总数. **返回值：** 持仓总数。
                            status:
                              type: string
                              description: 状态. **返回值：** 状态。
                            status_val:
                              type: string
                              description: 状态（原始值）. 字段 status 的原始值：status 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            remark:
                              type: string
                              description: 备注. **返回值：** 备注。
                      total:
                        type: integer
                        description: 总条数. **返回值：** 符合查询条件的记录总数，用于计算分页。
              example:
                code: 0
                message: success
                data:
                  list:
                    - counter_id: ETF/HK/2800
                      counter_id_val: ''
                      market: HK
