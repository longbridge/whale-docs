                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。
                  message:
                    type: string
                  data:
                    type: object
                    required:
                      - list
                      - total
                    properties:
                      list:
                        type: array
                        description: 列表. **返回值：** 列表列表。
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: 序号. **返回值：** 当前记录的唯一标识。
                            code:
                              type: string
                              description: 限额代码. **返回值：** 限额代码。
                            name:
                              type: string
                              description: 限额名称. **返回值：** 限额名称。
                            enable:
                              type: string
                              description: 启用标识. **返回值：** 表示启用标识。
                            enable_val:
                              type: string
                              description: 启用标识（原始值）. 字段 enable 的原始值：enable 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            currency:
                              type: string
                              description: 限额币种. **返回值：** 限额币种。
                            aaid:
                              type: string
                              description: 证券账号. **返回值：** 证券账号。
                            aaid_val:
                              type: string
                              description: 证券账号（原始值）. 字段 aaid 的原始值：aaid 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            counter_id:
                              type: string
                              description: 证券代码. **返回值：** 证券代码。
                            counter_id_val:
                              type: string
                              description: 证券代码（原始值）. 字段 counter_id 的原始值：counter_id 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            counter_name:
                              type: string
                              description: 证券名称. **返回值：** 证券名称。
                            counter_name_val:
                              type: string
                              description: 证券名称（原始值）. 字段 counter_name 的原始值：counter_name 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            stock_group_id:
                              type: string
                              description: 股票组. **返回值：** 股票组。
                            stock_group_id_val:
                              type: string
                              description: 股票组（原始值）. 字段 stock_group_id 的原始值：stock_group_id 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            market:
                              type: string
                              description: 市场. **返回值：** 市场。
                            market_val:
                              type: string
                              description: 市场（原始值）. 字段 market 的原始值：market 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            condition_warn:
                              type: string
                              description: 提示条件. **返回值：** 提示条件。
                            condition_audit:
                              type: string
                              description: 审核条件. **返回值：** 审核条件。
                            condition_reject:
                              type: string
                              description: 拒绝条件. **返回值：** 拒绝条件。
                            updated_at:
                              type: string
                              description: 更新时间. **返回值：** 更新时间；时间或日期格式以接口实际返回值为准。
                            last_update_user:
                              type: string
                              description: 操作人. **返回值：** 操作人。
                            is_apply:
                              type: string
                              description: 生效状态. **返回值：** 表示生效状态。
                            is_apply_val:
                              type: string
                              description: 生效状态（原始值）. 字段 is_apply 的原始值：is_apply 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            remark:
                              type: string
                              description: 备注. **返回值：** 备注。
                      total:
                        type: integer
                        description: 总条数. **返回值：** 符合查询条件的记录总数，用于计算分页。
              example:
                code: 0
                message: success
                data:
                  list:
                    - id: '100977'
                      code: CSGHM
                      name: 股票组持仓数量限额
                      enable: Not Activated
                      enable_val: 'false'
                      currency: ''
                      aaid: H00000000
                      aaid_val: '10000000'
                      counter_id: ''
                      counter_id_val: ''
                      counter_name: ''
                      counter_name_val: ''
                      stock_group_id: '12369'
                      stock_group_id_val: '12369'
                      market: ''
                      market_val: ''
                      condition_warn: Unlimited
                      condition_audit: Unlimited
                      condition_reject: '>=20,001.00'
                      updated_at: '1780900581'
                      last_update_user: user@example.com
                      is_apply: Invalid
                      is_apply_val: 'false'
                      remark: ''
                  total: 3249
        '400':
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登录或登录状态已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 当前账号未获得该功能授权。请在 User Permission 中为该账号开通相应权限。
          content:
