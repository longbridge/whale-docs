  /v1/risk_monitoring/index_level_operate:
    post:
      operationId: index_level_operate
      summary: 新增/编辑指数级别
      tags:
        - 风控管理
      x-lbonly: false
      description: |-
        指数级别 (Index Level) 的统一维护接口，通过 `operation` 区分新增、编辑、删除和初始化数据四种动作。

        ### 请求参数

        - 必填：`index_code`（指数编码）、`index_name`（指数名）、`index_type`（指数级别类型）、`operator`（操作人）、`operation`（操作类型）
        - 可选：`remark`（备注）、`id`（记录 ID）
        - 各字段的格式、取值范围、默认行为和业务含义见对应字段说明。

        ### 业务说明

        `operation` 控制具体动作：新增（`0`）提交指数编码/名称/级别类型/备注；编辑（`1`）额外带 `id`；删除（`2`）字段沿用 stock_level 命名（历史遗留）；初始化数据（`3`）仅传 `operation`。

        ### 风险提示

        此操作会变更压力测试所用的指数级别配置，影响相关风控计算。调用前请确认操作类型和参数无误。

        ### 处理结果

        成功时完成所述业务操作；后续状态和返回数据以 `200` 响应定义为准。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - index_code
                - index_name
                - index_type
                - operator
                - operation
              properties:
                index_code:
                  type: string
                  description: 指数编码. 用于指定「指数编码」。此字段为必填项。
                index_name:
                  type: string
                  description: 指数名. 用于指定「指数名」。此字段为必填项。
                index_type:
                  type: integer
                  description: 指数级别类型. 指数级别，单选：0=Tier1，1=Tier2，2=Other。删除操作沿用字段名 stock_level（取该记录的 stock_level_val），属历史命名遗留。
                  enum:
                    - '0'
                    - '1'
                    - '2'
                  example: '0'
                remark:
                  type: string
                  description: 备注. 随本次操作保存的备注。
                operator:
                  type: string
                  description: 操作人. 当前登录操作员账号，新增/编辑/删除均带上
                operation:
                  type: integer
                  description: 操作类型. 操作类型：0=新增，1=编辑，2=删除，3=初始化数据（仅传 operation=3，无其它字段）
                  enum:
                    - '0'
                    - '1'
                    - '2'
                    - '3'
                  x-enum-details:
                    - value: '0'
                      label: 新增
                    - value: '1'
                      label: 编辑
                    - value: '2'
                      label: 删除
                    - value: '3'
                      label: 初始化数据
                  example: '0'
                id:
                  type: integer
                  description: 记录ID. 仅编辑（operation=1）和删除（operation=2）时传，新增（operation=0）和初始化（operation=3）不传
            example:
              index_code: HSI
              index_name: 恒生指数
              index_type: 0
              remark: 港股一级指数
              operator: user@example.com
              operation: 1
              id: 10086
      responses:
        '200':
          description: 请求处理成功。响应的 `data` 不包含额外业务字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。

                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`
                      判断具体结果。

                      - `401`：未登录。
                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登录或登录状态已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 当前账号未获得该功能授权。请在 User Permission 中为该账号开通相应权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 请求处理超时。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
