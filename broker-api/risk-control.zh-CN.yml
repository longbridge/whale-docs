  /risk/v1/account_stock_margin_ratio/create:
    post:
      operationId: account_stock_margin_ratio_create
      summary: 新建客户多头保证金
      tags:
        - 风控管理
      x-permission-key:
        - credit_management.option_stock_margin_ratio_query
      x-lbonly: false
      description: |-
        为指定客户新建一条多头股票保证金比例记录，覆盖该客户在某证券上的保证金率配置。

        ### 请求参数

        - 本接口无必填参数约束，可选参数见下方字段说明。
        - 各字段的格式、取值范围和业务含义见对应字段说明。

        ### 业务说明

        保证金比例包括初始（`im_factor`）、维持（`mm_factor`）、强平（`fm_factor`）及 Margin Call（`mcm_factor`）等档位，可设置失效日期（`expire_at`）。新建后即成为该客户对应证券的生效保证金配置。

        ### 风险提示

        此操作直接产生真实的保证金配置变更，影响该客户的融资额度、维持保证金和强平判定。调用前请确认目标客户、证券及各保证金率无误。

        ### 处理结果

        成功时完成保证金记录的新建；后续状态和返回数据以 `200` 响应定义为准。
      security:
        - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: 0 表示成功；非 0 为业务错误码，此时 data 通常为空。HTTP 状态码本身恒为 200，请勿依赖 HTTP status 判断成功/失败。
