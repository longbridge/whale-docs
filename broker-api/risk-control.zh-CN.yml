      summary: 快照
      tags:
        - 风控管理
      x-permission-key:
        - lb_hk_margin_call.margin_call_history_query
      x-lbonly: false
      description: |-
        查询保证金预警记录的快照备份，记录追缴与强平生命周期中各关键节点上客户的风控状态。

        ### 请求参数

        - 通过 `filters` 组合业务筛选条件（可选字段见下方 filters 字段说明），并使用 `page`、`page_size`、`orderBy` 控制分页与排序。

        ### 业务说明

        - 快照在预警生命周期的关键节点生成，备份原因涵盖首次 Margin Call、首次强平、结束、每日留档、App 推送以及 Margin Call 与强平之间的状态转换等。
        - 每条记录关联一条预警编号，包含账号、柜台渠道、快照记录时间、预警时间、截止日期、预警类型、币种，以及净资产比率、应追缴保证金、现金、持仓总市值、股权资产、含贷权益值和初始/维持/平仓保证金。
        - 记录还给出逾期天数与近 30 日逾期天数，便于跟踪客户追缴逾期情况。
        - 可按客户、备份原因、预警记录、是否逾期与记录日期筛选。

        ### 返回结果

        成功时返回匹配的记录列表及分页信息。返回列含义见响应定义。
