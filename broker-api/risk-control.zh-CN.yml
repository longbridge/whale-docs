        ### 请求参数

        - 必填：`list`（批量操作的限额配置记录列表）、`is_apply`（是否生效）
        - 可选：`audit_frontend_resource`（调用方审计日志信息）
        - 各字段的格式、取值范围、默认行为和业务含义见对应字段说明。

        ### 风险提示

        > 此操作可能影响真实业务数据或资产状态。调用前请核对目标记录、金额、数量和操作类型。

        ### 处理结果

        成功时完成所述业务操作，具体返回内容见 `200` 响应定义。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - list
                - is_apply
              properties:
                list:
                  type: array
                  description: |-
                    批量操作的限额配置记录列表. 每项字段含义：counter_id 柜台号，aaid 客户账户ID（本客户维度的关键字段），code 证券代码（通常为空），trader/trader_name
