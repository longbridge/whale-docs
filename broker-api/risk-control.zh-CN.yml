        - lb_hk_margin_call.margin_call_query
      x-lbonly: false
      description: |-
        查询最新一批不良信贷客户记录，用于风控团队监控存在信用风险的客户并跟进处理。

        ### 请求参数

        - 通过 `filters` 组合业务筛选条件（可选字段见下方 filters 字段说明），并使用 `page`、`page_size`、`orderBy` 控制分页与排序。

        ### 业务说明

        - 数据取自最近一日的不良信贷留档，每条记录对应一名客户，包含证券账户、账户类型、币种、交易额度与融资金额。
        - 记录汇总客户的信用风险画像：当前 Margin Call 状态、历史 Margin Call 次数、历史被强平次数、当前不良信贷标记、30 日内未结清天数与长期未结清次数。
        - 可按客户、当前 Margin Call 状态、历史不良信贷与当前不良信贷筛选。

        ### 返回结果

        成功时返回匹配的记录列表及分页信息。返回列含义见响应定义。
      security:
        - bearerAuth: []
