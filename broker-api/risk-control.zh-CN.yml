  /v1/datasets/risk_block_lists:
    get:
      operationId: risk_block_lists
      summary: 黑名单
      tags:
        - 风控管理
      x-permission-key:
        - lb_hk_credit_limit.credit_block_list_query
      x-lbonly: false
      description: |-
        查询「风控黑名单」数据，可通过 `filters` 组合业务筛选条件，并使用 `page`、`page_size` 和 `orderBy` 控制分页与排序。

        ### 返回结果

        成功时返回匹配的记录列表及分页信息。各过滤字段的用途、可选值和动态数据来源见对应字段说明。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 过滤条件. 组合业务过滤条件。省略某个过滤字段时，不按该字段筛选。
                  properties:
                    dimension:
                      type: string
                      description: |-
                        名单维度. 用于按「名单维度」筛选结果。

                        **可选值：**
                        - `0` - 表示证券账号
                        - `1` - 表示客户编号
                      enum:
                        - '0'
                        - '1'
                    value:
                      type: string
                      description: 名单值. 用于按「名单值」筛选结果。
                    block_type:
                      type: string
                      description: |-
                        业务标签. 用于按「业务标签」筛选结果。

                        **可选值：**
                        - `1` - 表示授信
                        - `2` - 表示资产调拨
                        - `3` - 表示授信动态调额
                        - `4` - 表示自动平仓
                      enum:
                        - '1'
                        - '2'
                        - '3'
                        - '4'
                    status:
                      type: string
                      description: |-
                        状态. 用于按「状态」筛选结果。

                        **可选值：**
                        - `0` - 表示已启用
                        - `1` - 表示已停用
                      enum:
                        - '0'
                        - '1'
                page:
                  type: integer
                  description: 页码. 要查询的页码，从 `1` 开始。
                page_size:
                  type: integer
                  description: 每页数量. 每页返回的记录数量。
                orderBy:
                  type: array
                  description: 排序参数. 排序规则数组；每一项定义一个排序字段及排序方向。
                  items:
                    type: object
            example:
              filters: {}
              page: 1
              page_size: 20
              orderBy: []
      responses:
        '200':
          description: 成功时分页返回「风控黑名单」记录，以及页码、每页数量和总记录数等分页信息。
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。

                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`
                      判断具体结果。

                      - `401`：未登录。
                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。
                  message:
                    type: string
                  data:
                    type: object
                    required:
                      - list
                      - total
                    properties:
                      list:
                        type: array
                        description: 列表. **返回值：** 列表列表。
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: 编号. **返回值：** 当前记录的唯一标识。
                            dimension:
                              type: string
                              description: 名单维度. **返回值：** 名单维度。
                            dimension_val:
                              type: string
                              description: 名单维度（原始值）. 字段 dimension 的原始值：dimension 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            value:
                              type: string
                              description: 名单值. **返回值：** 名单值。
                            block_type:
                              type: string
                              description: 业务标签. **返回值：** 业务标签。
                            block_type_val:
                              type: string
                              description: 业务标签（原始值）. 字段 block_type 的原始值：block_type 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            status:
                              type: string
                              description: 状态. **返回值：** 状态。
                            status_val:
                              type: string
                              description: 状态（原始值）. 字段 status 的原始值：status 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            account_channel:
                              type: string
                              description: 柜台渠道. **返回值：** 柜台渠道。
                            created_at:
                              type: string
                              description: 创建时间. **返回值：** 创建时间；时间或日期格式以接口实际返回值为准。
                            operator:
                              type: string
                              description: 创建人. **返回值：** 创建人。
                            remark:
                              type: string
                              description: 备注. **返回值：** 备注。
                            updated_by:
                              type: string
                              description: 更新人. **返回值：** 更新人。
                            updated_at:
                              type: string
                              description: 更新时间. **返回值：** 更新时间；时间或日期格式以接口实际返回值为准。
                      total:
                        type: integer
                        description: 总条数. **返回值：** 符合查询条件的记录总数，用于计算分页。
              example:
                code: 0
                message: success
                data:
                  list:
                    - id: '146484'
                      dimension: Member ID
                      dimension_val: '1'
                      value: '2077584585014521856'
                      block_type: Credit
                      block_type_val: '1'
                      status: Enabled
                      status_val: '0'
                      account_channel: lb
                      created_at: '1784169760'
                      operator: 示例用户
                      remark: ''
                      updated_by: ''
                      updated_at: '1784169760'
                  total: 6265
        '400':
