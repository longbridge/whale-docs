openapi: 3.1.1
info:
  title: Longport Whale 券商 API
  description: 面向使用 Longport Whale 的券商提供机构级服务端 API。
  version: 2.0.0
servers:
  - url: https://b-api.longbridge.xyz
    description: 测试环境
  - url: https://b-api.lbkrs.com
    description: 生产环境
security:
  - bearerAuth: []
tags:
  - name: 风控管理
paths:
  /risk/v1/account_credits/manually_create:
    post:
      operationId: manually_create_account_credit
      summary: 人工新增授信客户
      tags:
        - 风控管理
      x-permission-key:
        - credit_limit.credit_clients_add
      x-lbonly: false
      description: |-
        人工为指定证券账号新增一条授信客户记录，并设置其授信额度。

        ### 请求参数

        - 必填：`aaid`（证券账号）、`credit_limit`（授信额度）
        - 各字段的格式、取值范围和业务含义见对应字段说明。

        ### 业务说明

        调用后该账号即成为授信客户，授信额度立即生效。

        ### 风险提示

        此操作直接产生真实授信额度变更。调用前请确认目标证券账号与额度金额无误。

        ### 处理结果

        成功时完成新增授信客户操作；后续状态和返回数据以 `200` 响应定义为准。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - aaid
                - credit_limit
              properties:
                aaid:
                  type: string
                  description: 证券账号
                credit_limit:
                  type: number
                  description: 授信额度
                remark:
                  type: string
                  description: 备注
            example:
              aaid: H00000000
              credit_limit: 100000
              remark: ''
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: 0 表示成功；非 0 为业务错误码，此时 data 通常为空。HTTP 状态码本身恒为 200，请勿依赖 HTTP status 判断成功/失败。
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      ticket_id:
                        type: string
              example:
                code: 0
                message: success
                data: {}
        '400': &id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`
        '401': &id002
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
          description: 未登录或登录状态已失效
        '403': &id003
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
          description: 当前账号未获得该功能授权。请在 User Permission 中为该账号开通相应权限
        '408': &id004
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
          description: 请求处理超时。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`
      x-mint:
        href: /zh-CN/api-reference/manually_create_account_credit
        metadata:
          sidebarTitle: 人工新增授信客户
  /risk/v1/admin_credit_adjust/apply:
    post:
      operationId: admin_credit_adjust_apply
      summary: 后台提交调整授信额度申请
      tags:
        - 风控管理
      x-permission-key:
        - lb_hk_credit_limit.client_credit_limit_apply
      x-lbonly: false
      description: |-
        后台提交一条客户授信额度调整申请，进入审核流程。

        ### 请求参数

        - 必填：`aaid`（证券账号）、`member_id`（用户 ID）、`credit_currency`（授信币种）、`before_credit_amount`（调整前额度）、`after_credit_amount`（调整后额度）、`applicant`（申请人）
        - 各字段的格式、取值范围和业务含义见对应字段说明。

        ### 业务说明

        本接口仅提交申请，额度不会立即变更；须经审核通过后才实际生效。

        ### 风险提示

        审核通过后将产生真实授信额度变更。请确认调整前后额度、币种与申请人信息无误。

        ### 处理结果

        成功时生成一条待审核的额度调整申请；后续状态和返回数据以 `200` 响应定义为准。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - aaid
                - member_id
                - credit_currency
                - before_credit_amount
                - after_credit_amount
                - applicant
              properties:
                aaid:
                  type: string
                  description: 证券账号
                member_id:
                  type: string
                  description: 用户 ID
                credit_currency:
                  type: string
                  description: 授信币种
                before_credit_amount:
                  type: string
                  description: 调整前额度
                after_credit_amount:
                  type: string
                  description: 调整后额度
                applicant:
                  type: string
                  description: 申请人
                remark:
                  type: string
                  description: 备注
            example:
              aaid: H00000000
              member_id: '101456715'
              credit_currency: HKD
              before_credit_amount: '0'
              after_credit_amount: '100000'
              applicant: user@example.com
              remark: ''
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: 0 表示成功；非 0 为业务错误码，此时 data 通常为空。HTTP 状态码本身恒为 200，请勿依赖 HTTP status 判断成功/失败。
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      apply_id:
                        type: string
                      review_status:
                        type: integer
              example:
                code: 0
                message: success
                data: {}
        '400': *id001
        '401': *id002
        '403': *id003
        '408': *id004
      x-mint:
        href: /zh-CN/api-reference/admin_credit_adjust_apply
        metadata:
          sidebarTitle: 后台提交调整授信额度申请
  /risk/v1/delete_canceled_account_credit:
    post:
      operationId: delete_canceled_account_credit
      summary: 删除已取消的客户授信额度
      tags:
        - 风控管理
      x-lbonly: false
      description: |-
        删除已取消状态的客户授信额度记录。

        ### 请求参数

        - 必填：`aaid_list`（证券账号列表）、`audit_frontend_resource`（调用方审计上下文）
        - 各字段的格式、取值范围和业务含义见对应字段说明。

        ### 业务说明

        仅可删除处于已取消状态的授信额度记录，支持按账号列表批量删除。

        ### 风险提示

        此操作删除真实授信额度记录，不可恢复。调用前请确认待删除的证券账号列表无误。

        ### 处理结果

        成功时删除指定的已取消授信额度记录；后续状态和返回数据以 `200` 响应定义为准。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - aaid_list
                - audit_frontend_resource
              properties:
                aaid_list:
                  type: array
                  description: 证券账号列表. 证券账号列表，以 JSON 数组形式提交。此字段为必填项。
                  items:
                    type: string
                audit_frontend_resource:
                  type: object
                  description: 审计上下文. 含 $behavior/credit_amount
            example:
              aaid_list:
                - '123'
              audit_frontend_resource:
                $behavior: ''
                credit_amount: ''
      responses:
        '200':
          description: 请求处理成功。响应的 `data` 不包含额外业务字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。

                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`
                      判断具体结果。

                      - `401`：未登录。
                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。
                  message:
                    type: string
                  data:
                    type: object
                    description: 成功时 `data` 为空对象。
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登录或登录状态已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 当前账号未获得该功能授权。请在 User Permission 中为该账号开通相应权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 请求处理超时。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
      x-mint:
        href: /zh-CN/api-reference/delete_canceled_account_credit
        metadata:
          sidebarTitle: 删除已取消的客户授信额度
  /risk/v1/admin_credit_adjust/review_flow_ticket:
    post:
      operationId: admin_credit_adjust_review_flow_ticket
      summary: 后台提交授信额度审核工单
      tags:
        - 风控管理
      x-permission-key:
        - lb_hk_credit_limit.client_credit_limit_approve
      x-lbonly: false
      description: |-
        后台就客户授信额度调整申请提交审核工单，做出审批通过或驳回的处理。

        ### 请求参数

        - 本接口无必填参数，具体请求字段见下方字段说明。

        ### 业务说明

        对已提交的额度调整申请执行审批。审批通过后额度调整才实际生效；驳回则申请作废。

        ### 风险提示

        审批通过将触发真实授信额度变更。请确认对应申请与审批结论无误。

        ### 处理结果

        成功时完成审核处理并推进申请状态；后续状态和返回数据以 `200` 响应定义为准。
      security:
        - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: 0 表示成功；非 0 为业务错误码，此时 data 通常为空。HTTP 状态码本身恒为 200，请勿依赖 HTTP status 判断成功/失败。
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      ticket_id:
                        type: string
              example:
                code: 0
                message: success
                data: {}
        '400': *id001
        '401': *id002
        '403': *id003
        '408': *id004
      x-mint:
        href: /zh-CN/api-reference/admin_credit_adjust_review_flow_ticket
        metadata:
          sidebarTitle: 后台提交授信额度审核工单
  /risk/v1/hit_fps_configs:
    get:
      operationId: query_account_hit_fps_configs
      summary: 查询用户已命中的 FPS 规则
      tags:
        - 风控管理
      x-lbonly: false
      description: |-
        查询指定证券账号已命中的 FPS（快速支付系统）风控规则配置。

        ### 请求参数

        - 本接口无必填参数，可选参数见下方字段说明。
        - 传入 `aaid` 时按该证券账号过滤命中的 FPS 规则。

        ### 返回结果

        成功时返回该账号已命中的 FPS 风控规则配置列表。字段含义见下方响应定义。
      security:
        - bearerAuth: []
      parameters:
        - name: aaid
          in: query
          required: true
          description: 证券账号
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: 0 表示成功；非 0 为业务错误码，此时 data 通常为空。HTTP 状态码本身恒为 200，请勿依赖 HTTP status 判断成功/失败。
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      original_fps:
                        type: string
                      final_fps:
                        type: string
                      list:
                        type: array
                        items:
                          type: object
                          properties:
                            config_title:
                              type: string
                            option_name:
                              type: string
                            fps_change:
                              type: string
              example:
                code: 0
                message: success
                data: {}
        '400': *id001
        '401': *id002
        '403': *id003
        '408': *id004
      x-mint:
        href: /zh-CN/api-reference/query_account_hit_fps_configs
        metadata:
          sidebarTitle: 查询用户已命中的 FPS 规则
  /risk/v1/fps_config_records:
    post:
      operationId: fps_config_records
      summary: 保存客户 FPS 命中配置
      tags:
        - 风控管理
      x-permission-key:
        - lb_hk_credit_limit.client_fps_manage
      x-lbonly: false
      description: |-
        保存一组客户 FPS（快速支付系统）命中规则配置。

        ### 请求参数

        - 必填：`fps_config_records`（FPS 规则配置列表）
        - 可选：`audit_frontend_resource`（调用方审计上下文）
        - 各字段的格式、取值范围和业务含义见对应字段说明。

        ### 业务说明

        批量保存客户 FPS 命中配置项，用于设定相关风控规则的命中处理策略。

        ### 处理结果

        成功时保存所提交的 FPS 配置；后续状态和返回数据以 `200` 响应定义为准。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fps_config_records
              properties:
                fps_config_records:
                  type: array
                  description: |-
                    FPS 规则配置列表. FPS 规则配置数组。每项包含：

                    - `config_field` - 配置维度，例如客户类型或风险等级。可用维度以 FPS 配置查询结果为准。
                    - `option_value` - 配置维度的具体值；必须属于所选 `config_field` 的可用值集。
                    - `fps_change` - FPS 分值调整量，以数值字符串提交，支持正数、负数和小数。
                  items:
                    type: string
                audit_frontend_resource:
                  type: object
                  description: 审计上下文. 包含 value（将 config_field/option_value 转换为中文 label 展示的数组）、$behavior（固定文案“编辑客户 FPS 规则配置”）、$action（固定为 edit），用于后端审计日志记录
            example:
              fps_config_records:
                - config_field: client_type
                  option_value: person
                  fps_change: '0.1'
                - config_field: risk_level
                  option_value: high
                  fps_change: '-0.2'
              audit_frontend_resource:
                value:
                  - config_field: 客户类型
                    option_value: 个人
                    fps_change: '0.1'
                  - config_field: 风险等级
                    option_value: 高
                    fps_change: '-0.2'
                $behavior: 编辑客户 FPS 规则配置
                $action: edit
      responses:
        '200':
          description: 请求处理成功。响应的 `data` 不包含额外业务字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。

                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`
                      判断具体结果。

                      - `401`：未登录。
                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。
                  message:
                    type: string
                  data:
                    type: object
                    description: 成功时 `data` 为空对象。
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登录或登录状态已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 当前账号未获得该功能授权。请在 User Permission 中为该账号开通相应权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 请求处理超时。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
      x-mint:
        href: /zh-CN/api-reference/fps_config_records
        metadata:
          sidebarTitle: 保存客户 FPS 命中配置
  /risk/v1/create_credit_group_review:
    post:
      operationId: create_credit_group_review
      summary: 新建授信组
      tags:
        - 风控管理
      x-lbonly: false
      description: |-
        新建一个授信组并提交审核。

        ### 请求参数

        - 本接口无必填参数，具体请求字段见下方字段说明。

        ### 业务说明

        创建授信组的申请进入审核流程，审核通过后授信组才正式生效。

        ### 风险提示

        审核通过后将影响相关账户的授信管理。调用前请确认授信组配置无误。

        ### 处理结果

        成功时生成待审核的新建授信组申请；后续状态和返回数据以 `200` 响应定义为准。
      security:
        - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: 0 表示成功；非 0 为业务错误码，此时 data 通常为空。HTTP 状态码本身恒为 200，请勿依赖 HTTP status 判断成功/失败。
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      ticket_id:
                        type: string
              example:
                code: 0
                message: success
                data: {}
        '400': *id001
        '401': *id002
        '403': *id003
        '408': *id004
      x-mint:
        href: /zh-CN/api-reference/create_credit_group_review
        metadata:
          sidebarTitle: 新建授信组
  /risk/v1/modify_credit_group_review:
    post:
      operationId: modify_credit_group_review
      summary: 编辑授信组额度
      tags:
        - 风控管理
      x-lbonly: false
      description: |-
        编辑指定授信组的额度配置并提交审核。

        ### 请求参数

        - 必填：`group_id`（授信组 ID）
        - 各字段的格式、取值范围和业务含义见对应字段说明。

        ### 业务说明

        修改授信组的额度配置须经审核，审核通过后新配置才生效。

        ### 风险提示

        审核通过将变更真实授信组额度，影响组内账户可用授信。调用前请确认组 ID 与额度配置无误。

        ### 处理结果

        成功时生成待审核的授信组额度修改申请；后续状态和返回数据以 `200` 响应定义为准。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - group_id
              properties:
                group_id:
                  type: number
                  description: 授信组ID
                group_credit:
                  type: number
                  description: 调整后额度
                audit_frontend_resource:
                  type: object
                  description: audit_frontend_resource
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
