  /v1/risk_monitoring/batch_push_message:
    post:
      operationId: batch_push_message
      summary: 批量推送风控预警消息
      tags:
        - 风控管理
      x-lbonly: false
      description: |-
        按证券账号列表批量推送风控预警消息。

        ### 请求参数

        - 必填：`aaid_list`（证券账号列表）、`push_msg_type`（推送消息类型）、`audit_frontend_resource`（调用方审计上下文）
        - 各字段的格式、取值范围和业务含义见对应字段说明。

        ### 业务说明

        对列表中的每个证券账号按指定消息类型推送风控预警通知。

        ### 风险提示

        此操作向真实客户批量发送通知，无法撤回。调用前请确认账号列表与消息类型无误。

        ### 处理结果

        成功时完成批量消息推送；后续状态和返回数据以 `200` 响应定义为准。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - aaid_list
                - push_msg_type
                - audit_frontend_resource
              properties:
                aaid_list:
                  type: array
                  description: 证券账号列表. 证券账号列表，以 JSON 数组形式提交。此字段为必填项。
                  items:
                    type: string
                push_msg_type:
                  type: string
                  description: 推送消息类型. 用于指定「推送消息类型」。此字段为必填项。
                  enum:
                    - '1'
                    - '2'
                  x-enum-details:
                    - value: '1'
                      label: App 消息
                    - value: '2'
                      label: 邮件消息
                  example: '1'
                audit_frontend_resource:
                  type: object
                  description: 审计上下文. 审计信息，含消息 ID 列表与推送消息类型
            example:
              aaid_list:
                - '123'
              push_msg_type: '1'
              audit_frontend_resource:
                ids:
                  - '123'
                push_msg_type: '1'
      responses:
        '200':
          description: 请求处理成功。响应的 `data` 不包含额外业务字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。

                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`
                      判断具体结果。

                      - `401`：未登录。
                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登录或登录状态已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 当前账号未获得该功能授权。请在 User Permission 中为该账号开通相应权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 请求处理超时。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
      x-mint:
        href: /zh-CN/api-reference/batch_push_message
        metadata:
          sidebarTitle: 批量推送风控预警消息
