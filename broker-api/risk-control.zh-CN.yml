    post:
      operationId: account_stock_opt_margin_ratio_create
      summary: 新建客户股票期权保证金
      tags:
        - 风控管理
      x-permission-key:
        - credit_management.option_stock_margin_ratio_query
      x-lbonly: false
      description: |-
        为指定客户新建一条股票期权保证金系数记录，用于设定该客户特定标的的期权保证金上下限。

        ### 请求参数

        - 本接口无必填参数，可选参数见下方字段说明。
        - 各字段的格式、取值范围和业务含义见对应字段说明。

        ### 业务说明

        记录通常包含客户、股票代码，以及初始、维持、强平保证金系数的上限与下限，用于该客户期权持仓的保证金计算。

        ### 风险提示

        此操作会新增客户级股票期权保证金配置，直接影响该客户期权持仓的保证金要求。调用前请确认目标客户和参数无误。

        ### 处理结果

        成功时完成新建操作；后续状态和返回数据以 `200` 响应定义为准。
      security:
        - bearerAuth: []
