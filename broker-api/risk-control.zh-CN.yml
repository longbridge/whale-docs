                  type: string
                  description: 维度值. 对应 dimension 类型的账户号或会员ID值；输入后会实时校验是否已授信
                block_type_list:
                  type: array
                  description: 拉黑类型列表. 多选，元素为数字。
                  enum:
                    - '1'
                    - '2'
                    - '3'
                    - '4'
                  items:
                    type: string
                remark:
                  type: string
                  description: 备注. 随本次操作保存的备注。
                operator:
                  type: string
                  description: 操作人. 操作人，调用方自动填充当前登录用户名，非请求可见字段
                audit_frontend_resource:
                  type: object
                  description: 审计上下文. 审计留痕字段，非业务参数，包含 dimension_name(维度名称)、display_block_types(拉黑类型文案，逗号分隔)、$behavior(操作描述)
            example:
              dimension: 0
              value: '6225880000000000'
              block_type_list:
                - 1
                - 2
              remark: 涉嫌洗钱风险，加入黑名单
              operator: user@example.com
              audit_frontend_resource:
                dimension_name: 账户号
                display_block_types: 禁止交易,禁止入金
                $behavior: 新增黑名单
      responses:
        '200':
          description: 请求处理成功。响应的 `data` 不包含额外业务字段。
