  /risk/v1/trade_credit/modify:
    post:
      operationId: trade_credit_modify
      summary: 修改客户交易额度
      tags:
        - 风控管理
      x-lbonly: false
      description: |-
        新增或修改客户的交易额度配置。涉及真实交易额度变更。

        ### 请求参数

        - 必填：`aaid`（客户资金账户ID(AAID)）、`trade_credit_type`（额度类型）、`trade_credit_map`（币种额度映射）、`expired_at`（到期时间）、`action`（操作类型）
        - 可选：`remark`（备注）、`audit_frontend_resource`（调用方审计上下文）
        - 各字段的格式、取值范围、默认行为和业务含义见对应字段说明。

        ### 风险提示

        > 此操作可能影响真实业务数据或资产状态。调用前请核对目标记录、金额、数量和操作类型。

        ### 处理结果

        成功时完成所述业务操作，具体返回内容见 `200` 响应定义。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - aaid
                - trade_credit_type
                - trade_credit_map
                - expired_at
                - action
              properties:
                aaid:
                  type: string
                  description: 客户资金账户ID(AAID). 请求 member_query_aaid 组件选择的客户资金账号，编辑时禁用不可改
                trade_credit_type:
                  type: string
                  description: |-
                    额度类型. 单选组，取值来自 options.trade_credit_type_ref，常见 0=单一货币交易额度，1=多货币交易额度

                    **可选值：**
                    - `0` - 表示单一货币交易额度
                    - `1` - 表示多货币交易额度
                  enum:
                    - '0'
                    - '1'
                trade_credit_map:
                  type: object
                  description: 币种额度映射. 币种->额度键值对，如 {"HKD":"100000"}；trade_credit_type=0 时仅含单一币种，=1 时可含多币种。
                expired_at:
                  type: number
                  description: 到期时间. unix 时间戳（秒），date-picker 选择日期后，时分秒取提交时的当前时间
                remark:
                  type: string
                  description: 备注. textarea，最长 100 字符
                action:
                  type: number
                  description: |-
                    操作类型. 0=新增 (add) 1=编辑 (edit)，由调用方根据是否传入 item 记录自动计算

                    **可选值：**
                    - `0` - 表示新增
                    - `1` - 表示编辑
                  enum:
                    - '0'
                    - '1'
                audit_frontend_resource:
                  type: object
                  description: 审计上下文. 非核心业务字段，携带变更前 (before)与变更后 (value)数据及 $action/$behavior，用于风控审批工单展示
            example:
              aaid: H00000000
              trade_credit_type: '1'
              trade_credit_map:
                HKD: '100000'
                USD: '50000'
              expired_at: 1751328000
              remark: 客户申请提升交易额度
              action: 0
              audit_frontend_resource:
                aaid: H00000000
                expired_at: 1748736000
                remark: ''
                trade_credit_type: '0'
                trade_credit_map: '{"HKD":"50000"}'
                value:
                  aaid: H00000000
                  trade_credit_type: '1'
                  trade_credit_map:
                    - key: HKD
                      value: '100000'
                add: true
                edit: null
                $action: add
                $behavior: 新增客户交易额度
      responses:
        '200':
          description: 请求处理成功。响应的 `data` 不包含额外业务字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。

                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`
                      判断具体结果。

                      - `401`：未登录。
                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登录或登录状态已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 当前账号未获得该功能授权。请在 User Permission 中为该账号开通相应权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 请求处理超时。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
