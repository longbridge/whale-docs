        - 数据来源于客户维度的股票融资保证金率配置，每条记录对应「某客户 + 某证券」的一组保证金系数。

        - 记录包含客户信息（`member_id`、`aaid` 证券账号、`account_type` 账户类型、`account_mark` 账户标识）、证券信息（`counter_id`、股票名称、`market` 市场），以及初始保证金 `im_factor`、维持保证金 `mm_factor`、强平保证金 `fm_factor`、Margin Call 保证金 `mcm_factor`（均为百分比）。

        - 另含 `status` 状态、`remark` 备注和创建、更新、过期时间，供风控核对与调整客户融资授信条件。

