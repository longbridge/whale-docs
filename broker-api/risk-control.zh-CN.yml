                  description: 过滤条件. 组合业务过滤条件。省略某个过滤字段时，不按该字段筛选。
                  properties:
                    aaid:
                      type: string
                      description: 客户. 用于按「客户」筛选结果。
                    risk_status:
                      type: string
                      description: |-
                        当前 Margin Call 状态. 用于按「当前 Margin Call 状态」筛选结果。

                        **可选值：** `Y`、`N`
                      enum:
                        - Y
                        - N
                      example: Y
                    history_bad_record_status:
                      type: string
                      description: |-
                        历史不良信贷. 用于按「历史不良信贷」筛选结果。

                        **可选值：** `Y`、`N`
                      enum:
                        - Y
                        - N
                      example: Y
                    bad_record_status:
                      type: string
                      description: |-
                        当前不良信贷. 用于按「当前不良信贷」筛选结果。

                        **可选值：** `Y`、`N`
                      enum:
                        - Y
                        - N
                      example: Y
                page:
                  type: integer
                  description: 页码. 要查询的页码，从 `1` 开始。
                page_size:
                  type: integer
                  description: 每页数量. 每页返回的记录数量。
                orderBy:
                  type: array
                  description: 排序参数. 排序规则数组；每一项定义一个排序字段及排序方向。
                  items:
                    type: object
            example:
              filters: {}
              page: 1
              page_size: 20
              orderBy: []
      responses:
        '200':
          description: 成功时分页返回「不良信贷记录」记录，以及页码、每页数量和总记录数等分页信息。
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。

                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`
                      判断具体结果。

                      - `401`：未登录。
                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。
                  message:
                    type: string
                  data:
                    type: object
                    required:
                      - list
                      - total
                    properties:
                      list:
                        type: array
                        description: 列表. **返回值：** 列表列表。
                        items:
                          type: object
                          properties:
                            origin_id:
                              type: string
                              description: 证券账户. **返回值：** 证券账户。
                            account_type:
                              type: string
                              description: 账户类型. **返回值：** 账户类型。
                            account_type_val:
                              type: string
                              description: 账户类型（原始值）. 字段 account_type 的原始值：account_type 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            currency:
                              type: string
                              description: 币种. **返回值：** 币种。
                            trade_credit:
                              type: string
                              description: 交易额度. **返回值：** 交易额度。
                            finance_amount:
                              type: string
                              description: 融资金额. **返回值：** 融资金额。
                            risk_status:
                              type: string
                              description: 当前 Margin Call 状态. **返回值：** 当前 Margin Call 状态。
                            margin_count:
                              type: string
                              description: 历史 Margin Call 次数. **返回值：** 历史 Margin Call 次数。
                            order_count:
                              type: string
                              description: 历史被强平次数. **返回值：** 历史被强平次数。
                            aaid:
                              type: string
                              description: 历史不良信贷. **返回值：** 历史不良信贷。
                            aaid_val:
                              type: string
                              description: 历史不良信贷（原始值）. 字段 aaid 的原始值：aaid 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            bad_record_status:
                              type: string
                              description: 当前不良信贷. **返回值：** 当前不良信贷。
                            monthly_bad_credit_count:
                              type: string
                              description: 30 日内未结清天数. **返回值：** 30 日内未结清天数。
                            long_term_margin_count:
                              type: string
                              description: 长期未结清次数. **返回值：** 长期未结清次数。
                            created_at:
                              type: string
                              description: 创建时间. **返回值：** 创建时间；时间或日期格式以接口实际返回值为准。
                      total:
                        type: integer
                        description: 总条数. **返回值：** 符合查询条件的记录总数，用于计算分页。
              example:
                code: 0
                message: success
                data:
                  list:
                    - origin_id: H00000000
                      account_type: Margin Client
