  /risk_limit/v1/client_group/batch_apply:
    post:
      operationId: client_group_batch_apply
      summary: 批量申请客户类别（组）交易限额
      tags:
        - 风控管理
      x-permission-key:
        - lb_hk_risk_limit_config.risk_limit_config_client_update
      x-lbonly: false
      description: |-
        由行内操作项或悬浮批量操作栏调用，两种场景仅传入值不同。此操作会更改真实交易限额的生效状态，风险较高。

        ### 请求参数

        - 必填：`list`（批量操作的限额配置记录列表）、`is_apply`（是否生效）
        - 可选：`audit_frontend_resource`（调用方审计日志信息）
        - 各字段的格式、取值范围、默认行为和业务含义见对应字段说明。

        ### 风险提示

        > 此操作可能影响真实业务数据或资产状态。调用前请核对目标记录、金额、数量和操作类型。

        ### 处理结果

        成功时完成所述业务操作，具体返回内容见 `200` 响应定义。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - list
                - is_apply
              properties:
                list:
                  type: array
                  description: |-
                    批量操作的限额配置记录列表. 每项字段含义：counter_id 柜台号，aaid 客户账户ID，code 证券代码（本客户组维度通常为空），trader/trader_name 交易员ID/名称，
                    client_group/client_group_name 客户类别（组）ID/名称，stock_group 股票分组ID。
                  items:
                    type: string
                is_apply:
                  type: boolean
                  description: |-
                    是否生效. 批量设置目标记录是否生效。

                    **可选值：**
                    - `true` - 表示批量生效
                    - `false` - 表示批量失效
                  enum:
                    - 'true'
                    - 'false'
                audit_frontend_resource:
                  type: object
                  description: '审计上下文. 非业务参数，仅供后端审计记录使用。$action: ''add''(生效)|''delete''(失效)；$behavior: 审计行为描述文案。'
            example:
              list:
                - counter_id: '1'
                  aaid: H00000000
                  code: ''
                  trader: ''
                  trader_name: ''
                  client_group: '1'
                  client_group_name: VIP客户组
                  stock_group: ''
              is_apply: true
              audit_frontend_resource:
                $action: add
