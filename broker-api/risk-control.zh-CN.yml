  /risk_limit/v1/trader/batch_apply:
    post:
      operationId: trader_batch_apply
      summary: 批量申请交易员交易限额
      tags:
        - 风控管理
      x-permission-key:
        - lb_hk_risk_limit_config.risk_limit_config_trader_update
      x-lbonly: false
      description: |-
        批量申请交易员交易限额。

        ### 请求参数

        - 必填：`list`（交易员限额记录列表）、`is_apply`（是否生效）
        - 可选：`audit_frontend_resource`（审计调用方资源）
        - 各字段的格式、取值范围和业务含义见对应字段说明。

        ### 风险提示

        > 此操作可能引起真实资金、持仓或交易状态变化。调用前请确认目标记录和参数无误。

        ### 处理结果

        成功时完成上述业务操作；后续状态和返回数据以 `200` 响应定义为准。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - list
                - is_apply
              properties:
                list:
                  type: array
                  description: |-
                    交易员限额记录列表. 批量勾选（或单条）的限额记录，元素字段：counter_id(柜台ID)、aaid(账户AAID)、code(标的代码)、trader(交易员账号)、trader_name(交易员名称)、
                    client_group(客户分组ID)、client_group_name(客户分组名称)、stock_group(证券分组ID)
                  items:
                    type: string
                is_apply:
                  type: boolean
                  description: |-
                    是否生效. true=批量生效（申请启用限额），false=批量失效（撤销/停用限额）

                    **可选值：**
                    - `true` - 表示批量生效
                    - `false` - 表示批量失效
                  enum:
                    - 'true'
                    - 'false'
                audit_frontend_resource:
                  type: object
                  description: 审计上下文. 调用方埋点用审计信息，含 $action(add/delete) 与 $behavior(操作描述文案，如“限额生效”“限额失效”)
            example:
              list:
                - counter_id: '1000021'
                  aaid: H00000000
                  code: 700.HK
                  trader: T00123
                  trader_name: 张三
                  client_group: CG001
                  client_group_name: 机构客户组A
                  stock_group: SG001
              is_apply: true
              audit_frontend_resource:
                $action: add
                $behavior: 限额生效
      responses:
        '200':
          description: 请求处理成功。响应的 `data` 不包含额外业务字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。

                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`
                      判断具体结果。

                      - `401`：未登录。
                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登录或登录状态已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 当前账号未获得该功能授权。请在 User Permission 中为该账号开通相应权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 请求处理超时。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
