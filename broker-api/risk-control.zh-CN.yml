      x-lbonly: false
      description: |-
        查询集中度风险测试（ELC）中 TopN 股票在不同下跌幅度情景下的缺口测算结果。

        ### 请求参数

        - 本数据集不提供业务过滤字段，`filters` 传空对象即可；仍可使用 `page`、`page_size`、`orderBy` 控制分页与排序。
        - 数据取自最近一次集中度风险测试任务。

        ### 业务说明

        - 数据来源于集中度风险测试的 DropByX 测算，模拟股价按不同幅度下跌时的风险敞口。
        - 一条记录对应一档下跌幅度情景，包含下跌比例（`X`）、缺口（ShortFall）与缓冲（Buffer）。
        - 用于评估在集中持仓下，标的价格大幅下跌对整体抵押与偿付能力的冲击。

        ### 返回结果

        成功时返回匹配的记录列表及分页信息。返回列含义见响应定义。
      security:
