        - 数据来源于待行权期权仓位，按行权日、结算渠道聚合。
        - 每条记录对应一个（行权日，结算渠道），包含期权标的数量、持仓总张数，以及行权标的数、提前行权标的数、放弃行权标的数、部分行权标的数、已处理标的数。
        - 处理状态区分待核对、待处理、已处理，用于掌握各行权日的整体处理进度并进一步下钻明细。

        ### 返回结果

        成功时返回匹配的记录列表及分页信息。返回列含义见响应定义。
      security:
