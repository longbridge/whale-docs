                      enum:
                        - '0'
                        - '1'
                        - '2'
                        - '3'
                        - '4'
                      x-enum-details:
                        - value: '0'
                          label: '>='
                        - value: '1'
                          label: '>'
                        - value: '2'
                          label: <=
                        - value: '3'
                          label: <
                        - value: '4'
                          label: 无限
                    quota:
                      type: string
                      description: 阈值。
                condition_audit:
                  type: object
                  description: 审核条件.
                  properties:
                    operator:
                      type: string
                      description: 运算符。
                      enum:
                        - '0'
                        - '1'
                        - '2'
                        - '3'
                        - '4'
                      x-enum-details:
                        - value: '0'
                          label: '>='
                        - value: '1'
                          label: '>'
                        - value: '2'
                          label: <=
                        - value: '3'
                          label: <
                        - value: '4'
                          label: 无限
                    quota:
                      type: string
                      description: 阈值。
                condition_reject:
                  type: object
                  description: 拒绝条件.
                  properties:
                    operator:
                      type: string
                      description: 运算符。
                      enum:
                        - '0'
                        - '1'
                        - '2'
                        - '3'
                        - '4'
                      x-enum-details:
                        - value: '0'
                          label: '>='
                        - value: '1'
                          label: '>'
                        - value: '2'
                          label: <=
                        - value: '3'
                          label: <
                        - value: '4'
                          label: 无限
                    quota:
                      type: string
                      description: 阈值。
            example:
              code: ''
              currency: HKD
              condition_warn:
                quota: '0'
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: 0 表示成功；非 0 为业务错误码，此时 data 通常为空。HTTP 状态码本身恒为 200，请勿依赖 HTTP status 判断成功/失败。
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      ticket_id:
                        type: string
                        description: 工单ID，该接口接入了工单审批功能
              example:
                code: 0
                message: success
                data: {}
        '400': *id001
        '401': *id002
        '403': *id003
        '408': *id004
