                  message:
                    type: string
                  data:
                    type: object
                    required:
                      - list
                      - total
                    properties:
                      list:
                        type: array
                        description: 列表. **返回值：** 列表列表。
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: 预警编号. **返回值：** 当前记录的唯一标识。
                            account_channel:
                              type: string
                              description: 柜台渠道. **返回值：** 柜台渠道。
                            aaid:
                              type: string
                              description: 账号. **返回值：** 账号。
                            aaid_val:
                              type: string
                              description: 账号（原始值）. 字段 aaid 的原始值：aaid 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            alert_type:
                              type: string
                              description: 预警类型. **返回值：** 预警类型。
                            alert_type_val:
                              type: string
                              description: 预警类型（原始值）. 字段 alert_type 的原始值：alert_type 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            status:
                              type: string
                              description: 状态. **返回值：** 状态。
                            status_val:
                              type: string
                              description: 状态（原始值）. 字段 status 的原始值：status 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            reason:
                              type: string
                              description: 原因. **返回值：** 原因。
                            reason_val:
                              type: string
                              description: 原因（原始值）. 字段 reason 的原始值：reason 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            comment:
                              type: string
                              description: 备注. **返回值：** 备注。
                            alert_date:
                              type: string
                              description: 预警日期. **返回值：** 预警日期；时间或日期格式以接口实际返回值为准。
                            end_date:
