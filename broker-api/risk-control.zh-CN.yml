  /risk_limit/v1/stock/batch_apply:
    post:
      operationId: stock_batch_apply
      summary: 批量申请证券交易限额
      tags:
        - 风控管理
      x-permission-key:
        - lb_hk_risk_limit_config.risk_limit_config_stock_update
      x-lbonly: false
      description: |-
        批量申请一组证券交易限额的生效状态，通过 `is_apply` 控制目标记录是启用还是停用。

        ### 请求参数

        - 必填：`list`（批量操作的限额配置记录列表）、`is_apply`（是否生效）
        - 可选：`audit_frontend_resource`（调用方审计上下文）
        - 各字段的格式、取值范围和业务含义见对应字段说明。

        ### 业务说明

        `list` 中的每条记录标识一条已存在的限额配置。此接口只批量切换生效状态，不修改各限额的阈值。

        ### 风险提示

        此操作会更改真实交易限额的生效状态，直接影响后续交易能否通过风控校验。调用前请核对目标记录列表和 `is_apply` 取值。

        ### 处理结果

        成功时完成批量生效状态变更；后续状态和返回数据以 `200` 响应定义为准。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - list
                - is_apply
              properties:
                list:
                  type: array
                  description: |-
                    批量操作的限额配置记录列表. 每项字段含义：counter_id 柜台号，aaid 客户账户ID（通常为空），code 证券代码（本证券维度的关键字段），trader/trader_name
                    交易员ID/名称， client_group/client_group_name 客户类别（组）ID/名称，stock_group 股票分组ID。
                  items:
                    type: string
                is_apply:
                  type: boolean
                  description: 是否生效. 批量设置目标记录是否生效。
                  enum:
                    - 'true'
                    - 'false'
                  x-enum-details:
                    - value: 'true'
                      label: 批量生效
                    - value: 'false'
                      label: 批量失效
                  example: 'true'
                audit_frontend_resource:
                  type: object
                  description: '审计上下文. 非业务参数，仅供后端审计记录使用。$action: ''add''(生效)|''delete''(失效)；$behavior: 审计行为描述文案。'
            example:
              list:
                - counter_id: '1'
                  aaid: ''
                  code: AAPL.US
                  trader: ''
                  trader_name: ''
                  client_group: ''
                  client_group_name: ''
                  stock_group: '1'
              is_apply: true
              audit_frontend_resource:
                $action: add
                $behavior: 限额生效
      responses:
        '200':
          description: 请求处理成功。响应的 `data` 不包含额外业务字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。

                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`
                      判断具体结果。

                      - `401`：未登录。
                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。
                  message:
                    type: string
                  data:
                    type: object
                    description: 成功时 `data` 为空对象。
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登录或登录状态已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 当前账号未获得该功能授权。请在 User Permission 中为该账号开通相应权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 请求处理超时。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
