  /risk_limit/v1/multiple/apply:
    post:
      operationId: multiple_apply
      summary: 批量申请多维度交易限额
      tags:
        - 风控管理
      x-lbonly: false
      description: |-
        批量申请一组多维度交易限额的生效状态，通过 `is_apply` 控制目标记录是启用还是停用。

        ### 请求参数

        - 必填：`list`（多维度限额记录列表）、`is_apply`（是否生效）
        - 可选：`audit_frontend_resource`（调用方审计上下文）
        - 各字段的格式、取值范围和业务含义见对应字段说明。

        ### 业务说明

        `list` 中的每条记录标识一条已存在的限额配置。此接口只批量切换生效状态，不修改各限额的阈值。

        ### 风险提示

        此操作会更改真实交易限额的生效状态，直接影响后续交易能否通过风控校验。调用前请核对目标记录列表和 `is_apply` 取值。

        ### 处理结果

        成功时完成批量生效状态变更；后续状态和返回数据以 `200` 响应定义为准。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - list
                - is_apply
              properties:
                list:
                  type: array
                  description: |-
                    多维度限额记录列表. 批量勾选（或单条）的限额记录，元素字段：counter_id(柜台ID)、aaid(账户AAID)、code(标的代码)、trader(交易员账号)、trader_name(交易员名称)、
                    client_group(客户分组ID)、client_group_name(客户分组名称)、stock_group(证券分组ID)
                  items:
                    type: string
                is_apply:
                  type: boolean
                  description: 是否生效. true=批量生效（申请启用限额），false=批量失效（撤销/停用限额）
                  enum:
                    - 'true'
                    - 'false'
                  x-enum-details:
                    - value: 'true'
                      label: 批量生效
                    - value: 'false'
                      label: 批量失效
                  example: 'true'
                audit_frontend_resource:
                  type: object
                  description: '审计上下文. 审计信息，含操作类型($action: add/delete)与行为描述($behavior)'
            example:
              list:
                - counter_id: '1000021'
                  aaid: H00000000
                  code: 700.HK
                  trader: T00123
                  trader_name: 张三
                  client_group: CG001
                  client_group_name: 机构客户组A
                  stock_group: SG001
              is_apply: true
              audit_frontend_resource:
                $action: add
                $behavior: 限额生效
      responses:
        '200':
          description: 请求处理成功。响应的 `data` 不包含额外业务字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。

                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`
                      判断具体结果。

                      - `401`：未登录。
                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。
                  message:
                    type: string
                  data:
                    type: object
                    description: 成功时 `data` 为空对象。
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登录或登录状态已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 当前账号未获得该功能授权。请在 User Permission 中为该账号开通相应权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 请求处理超时。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
      x-mint:
        href: /zh-CN/api-reference/multiple_apply
        metadata:
          sidebarTitle: 批量申请多维度交易限额
