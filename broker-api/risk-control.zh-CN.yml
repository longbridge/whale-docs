        ### 请求参数

        - 必填：`counter_id`（标的代码）、`haircut`（折扣率）
        - 可选：`include_indexes`（包含指数）、`exclude_indexes`（排除指数）、`include_exchanges`（包含交易所）、`exclude_exchanges`（排除交易所）、`priority`（优先级）
