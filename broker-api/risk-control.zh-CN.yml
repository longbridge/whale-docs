      x-permission-key:
        - lb_hk_risk_limit_config.risk_limit_config_stock_query
      x-lbonly: false
      description: |-
        查询证券限额，即按单只证券维度设置的下单风控限额配置。

        ### 请求参数

        - 通过 `filters` 组合业务筛选条件（可选字段见下方 filters 字段说明），并使用 `page`、`page_size`、`orderBy` 控制分页与排序。

        ### 业务说明

        - 每条记录由限额代码 `code` 与证券 `counter_id`、市场 `market` 共同确定，`counter_name` 为证券名称，`name` 为限额名称。

        - 各条限额设有提示、审核、拒绝三档阈值及比较运算符，组合成 `condition_warn`、`condition_audit`、`condition_reject`，命中时分别提示、审核或拒绝下单。

        - 记录还含限额币种、启用标识 `enable`、生效状态 `is_apply`、操作人与更新时间。

        - 常用于针对特定证券维护统一的下单限额。

        ### 返回结果

        成功时返回匹配的记录列表及分页信息。返回列含义见响应定义。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
