        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - main
                - other
                - is_display
              properties:
                main:
                  type: object
                  description: 主币种换汇规则. 包含 debt(欠款金额阈值)、avail_with_draw(可提现金额阈值)、currency(账户主币种，只读展示不可编辑)三个字段，均为字符串数值
                other:
                  type: array
                  description: |-
                    其他币种换汇规则. 数组，每项 {currency: 币种代码（候选值随业务变化，非固定）, debt:；请调用 `GET /v1/datasets/refs/tenant_exchange_currencies` 获取当前可用取值
                    欠款金额阈值, avail_with_draw: 可提现金额阈值}，可增删多条

                    请调用 `GET /v1/datasets/refs/tenant_exchange_currencies` 获取当前可用的数据字典，并使用返回项的 `key` 作为本字段值。
                  x-value-source:
                    endpoint: GET /v1/datasets/refs/tenant_exchange_currencies
                  items:
                    type: string
                is_display:
                  type: boolean
                  description: |-
                    是否展示/启用. - 单选
                    - 提交时字符串 'true'/'false' 转为布尔值
                    - 为 false 时其余金额字段禁用
                  enum:
                    - 'true'
                    - 'false'
                  example: 'true'
                front_payload:
                  type: object
                  description: 前端变更差异. 非核心业务字段，type 固定为 data_diff，记录 is_display/debt/avail_with_draw/other 变更前后值，用于审批工单展示
                audit_frontend_resource:
                  type: object
                  description: 审计上下文. 非核心业务字段，携带提交时的 is_display 值
            example:
              main:
                debt: '1000'
                avail_with_draw: '500'
                currency: HKD
              other:
                - currency: USD
                  debt: '200'
                  avail_with_draw: '100'
              is_display: true
              front_payload:
                type: data_diff
                data:
                  - label: 是否展示
                    key: is_display
                    before_value: 关闭
                    after_value: 开启
              audit_frontend_resource:
                is_display: true
      responses:
        '200':
          description: 请求处理成功。响应的 `data` 不包含额外业务字段。
          content:
            application/json:
              schema:
                type: object
                properties:
