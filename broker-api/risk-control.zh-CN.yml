        - 各条限额设有提示、审核、拒绝三档阈值及比较运算符，组合成 `condition_warn`、`condition_audit`、`condition_reject`，命中时分别提示、审核或拒绝下单。

        - 记录还含限额币种、启用标识 `enable`、生效状态 `is_apply`、备注、操作人与更新时间。

        - 常用于针对单个客户维护其专属的下单限额。

        ### 返回结果

        成功时返回匹配的记录列表及分页信息。返回列含义见响应定义。
