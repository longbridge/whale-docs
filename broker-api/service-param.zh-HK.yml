                    lookup_category:
                      type: string
                      description: '用於按「備註使用方」篩選結果。


                        **可選值：**

                        - `setting_remark_deposit` - 表示入金

                        - `setting_remark_withdrawal` - 表示出金

                        - `setting_remark_securitiesdeposit` - 表示證券存入

                        - `setting_remark_securitieswithdrawal` - 表示證券取出

                        - `setting_remark_accountadjustment` - 表示調賬

                        - `setting_remark_withdrawal_reject` - 表示出金拒絕理由

                        - `setting_remark_deposit_reject` - 表示入金拒絕理由

                        - `setting_remark_withdrawal_card_reject` - 表示拒絕客戶綁卡

                        - `setting_remark_fund` - 表示基金

                        - `setting_remark_otc_derivatives` - 表示場外衍生品

                        - `setting_remark_deposit_matching` - 表示入金匹配'
                      enum:
                      - setting_remark_deposit
                      - setting_remark_withdrawal
                      - setting_remark_securitiesdeposit
                      - setting_remark_securitieswithdrawal
                      - setting_remark_accountadjustment
                      - setting_remark_withdrawal_reject
                      - setting_remark_deposit_reject
                      - setting_remark_withdrawal_card_reject
                      - setting_remark_fund
                      - setting_remark_otc_derivatives
                      - setting_remark_deposit_matching
                      x-enum-details:
                      - value: setting_remark_deposit
                        label: 入金
                      - value: setting_remark_withdrawal
                        label: 出金
                      - value: setting_remark_securitiesdeposit
                        label: 證券存入
                      - value: setting_remark_securitieswithdrawal
                        label: 證券取出
                      - value: setting_remark_accountadjustment
                        label: 調賬
                      - value: setting_remark_withdrawal_reject
                        label: 出金拒絕理由
                      - value: setting_remark_deposit_reject
                        label: 入金拒絕理由
                      - value: setting_remark_withdrawal_card_reject
                        label: 拒絕客戶綁卡
                      - value: setting_remark_fund
                        label: 基金
                      - value: setting_remark_otc_derivatives
                        label: 場外衍生品
                      - value: setting_remark_deposit_matching
                        label: 入金匹配
                mode:
                  type: integer
                  default: 0
                  description: '不傳時默認 0（同步）


                    **可選值：**

                    - `0` - 表示同步

                    - `1` - 表示异步'
                  enum:
                  - 0
                  - 1
                  x-enum-details:
                  - value: 0
