  /v1/datasets/va_coin_configs/download:
    post:
      operationId: va_coin_configs_download
      summary: 加密貨幣導出
      tags:
      - 業務參數設置
      x-permission-key:
      - atm.crypto_currency_inquiry
      x-lbonly: false
      description: '將「加密貨幣」數據導出為文件。`filters` 決定導出範圍，`down_fields` 可限制導出字段。


        ### 導出模式


        - `mode: 0`：同步導出，成功後直接返回下載地址。

        - `mode: 1`：異步導出，先返回 `file_download_id`；隨後調用 `GET /v1/datasets/download/{id}` 獲取下載地址。

        - 不再需要導出記錄時，可調用 `DELETE /v1/datasets/download/{id}` 刪除。'
