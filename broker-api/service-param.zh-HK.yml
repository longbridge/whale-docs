        - 必填：`original_limit`（出金賬戶限額類型）、`lb_bank_channel_id`（出金銀行渠道ID）、`package_type`（出金方式/套餐類型）、`batch_max_count`（單批最大筆數）、`charge_type`（手續費承擔方式）、`single_quota_currency_amount`（單筆限額（按幣種））、`single_quota_currency_amount_keys`（單筆限額行索引）、`currency`（幣種（逗號分隔））、`support_region`（支持地區（逗號分隔））、`support_bank_ids`（支持銀行ID列表）、`sec_auth`（二次驗證方式）、`priority`（優先級）、`service_time`（服務時間（本方時區））、`lb_service_time`（服務時間（LB側時區））、`version`（接口版本標記）、`action_in`（操作入口標記）

        - 可選：`fee_bank_account_id`（手續費賬戶）、`status`（規則狀態）、`remark`（備註）、`rule_codes`（命中的AML出金規則（僅 certain
        sites））、`original_limit_bank_accounts`（原始限額出金賬戶列表（僅 certain sites 且 original_limit=1））、`name`（銀行渠道名稱（冗餘展示字段））、`audit_frontend_resource`（调用方審計日誌附加信息）

