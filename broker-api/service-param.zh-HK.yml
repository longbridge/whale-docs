      x-lbonly: false
      description: '新增一條日限額配置。


        為指定的公司銀行名稱、銀行賬號與出金方式組合設置某一幣種的每日出金初始額度和日剩餘額度警戒線。


        ### 請求參數


        - 配置字段統一包裹在 `params` 對象中提交。

        - 必填：`params.lb_bank_name`（公司銀行名稱）、`params.lb_bank_account_ids`（銀行賬號）、`params.bank_operation_types_ids`（出金方式）、`params.currency`（幣種）、`params.limit_amount`（初始額度）、`params.alarm_amount`（日剩餘額度警戒線）。

        - 可選：`params.remark`（備註）。

        - 各字段的格式、取值範圍、默認行為和業務含義見對應字段說明。


        ### 處理結果


        成功時新增該日限額配置，`data` 不包含額外業務字段。'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - params
              properties:
                params:
                  type: object
                  description: 日限額配置的字段集合。
                  required:
                  - lb_bank_name
                  - lb_bank_account_ids
                  - bank_operation_types_ids
                  - currency
                  - limit_amount
                  - alarm_amount
