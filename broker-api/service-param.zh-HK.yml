                      enum:
                      - '0'
                      - '1'
                      - '2'
                      - '3'
                      x-enum-details:
                      - value: '0'
                        label: 無
                      - value: '1'
                        label: 大額換匯
                      - value: '2'
                        label: 小額換匯（匯兌池內）
                      - value: '3'
                        label: 小額換匯（超匯兌池）
