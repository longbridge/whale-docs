openapi: 3.1.1
info:
  title: Longport Whale 券商 API
  description: 面向使用 Longport Whale 的券商提供機構級服務端 API。
  version: 2.0.0
servers:
- url: https://b-api.longbridge.xyz
  description: 测试环境
- url: https://b-api.lbkrs.com
  description: 生产环境
security:
- bearerAuth: []
tags:
- name: 業務參數設置
paths:
  /clearing/upsert_clearing_ready_setting:
    post:
      operationId: upsert_clearing_ready_setting
      summary: 新增/編輯清算前準備檢查項設置
      tags:
      - 業務參數設置
      x-permission-key:
      - lb_hk_clearing.clearing_busin_step_edit
      x-lbonly: false
      description: '並以 審計模板中的真實 payload 示例交叉核對，涉及真實清算前準備檢查項配置變更。


        ### 請求參數


        - 必填：`task_code`（任務編碼）、`task_name`（任務名稱）

        - 可選：`process_mode`（失敗後處理方式）、`is_enable`（是否啓用）、`audit_frontend_resource`（審計上下文）

        - 各字段的格式、取值範圍、默認行為和業務含義見對應字段說明。


        ### 處理結果


        成功時完成所述業務操作，具體返回內容見 `200` 響應定義。'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - task_code
              - task_name
              properties:
                task_code:
                  type: string
                  description: 該值不可由用戶修改；調用方必須使用目標記錄的 `task_code_val`。
                task_name:
                  type: string
                  description: 提交時取當前行記錄的 task_code 字段值（展示名），與請求只讀輸入框內容一致。
                process_mode:
                  type: string
                  description: '清算前檢查失敗後的處理方式。


                    候選值會動態變化。請調用 `GET /v1/datasets/refs/clear_ready_process_mode`

                    獲取當前可用的數據字典，並使用返回項的 `key` 作為本字段值。


                    **可選值：**

                    - `0` - 表示僅提醒

                    - `1` - 表示工單審核

                    - `2` - 表示強制校驗'
                  x-value-source:
                    endpoint: GET /v1/datasets/refs/clear_ready_process_mode
                  enum:
                  - '0'
                  - '1'
                  - '2'
                  x-enum-details:
                  - value: '0'
                    label: 僅提醒
                  - value: '1'
                    label: 工單審核
                  - value: '2'
                    label: 強制校驗
                is_enable:
                  type: boolean
                  description: 開關組件（switch），提交前會做 values.is_enable === true || values.is_enable === 'true'
                    的布爾轉換。
                audit_frontend_resource:
                  type: object
                  description: '非業務字段，僅用於審計日誌展示變更前後狀態，調用方應構造為 {...currentItem, after_enable, before_enable
                    }，包含

                    before_enable/after_enable 兩個布爾值，分別對應變更前後的啓用狀態。'
            example:
              task_code: ready_ibond_check
              task_name: IBOND 交易檢查
              process_mode: '1'
              is_enable: false
      responses:
        '200':
          description: 請求處理成功。響應的 `data` 不包含額外業務字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: '0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。


                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`

                      判斷具體結果。


                      - `401`：未登錄。

                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。'
                    x-enum-details:
                    - value: 0
                      label: 成功
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登錄或登錄狀態已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 當前賬號未獲得該功能授權。請在 User Permission 中為該賬號開通相應權限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 請求處理超時。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
  /clearing/update_system_config:
    post:
      operationId: update_system_config
      summary: 修改清算系統配置
      tags:
      - 業務參數設置
      x-permission-key:
      - lb_hk_clearing.clearing_busin_step_edit
      x-lbonly: false
      description: '修改清算系統配置。


        ### 請求參數


        - 必填：`config_code`（配置代碼）、`config_value`（配置值）

        - 各字段的格式、取值範圍和業務含義見對應字段說明。


        ### 處理結果


        成功時完成上述業務操作；後續狀態和返回數據以 `200` 響應定義為準。'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - config_code
              - config_value
              properties:
                config_code:
                  type: number
                  description: 用於指定「配置代碼」。此字段為必填項。
                config_value:
                  type: string
                  description: 用於指定「配置值」。此字段為必填項。
            example:
              config_code: 1
              config_value: ''
      responses:
        '200':
          description: 請求處理成功。響應的 `data` 不包含額外業務字段。
