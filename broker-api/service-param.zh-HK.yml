        - 可選：`audit_frontend_resource`（调用方審計日誌載荷）

        - 各字段的格式、取值範圍、默認行為和業務含義見對應字段說明。


        ### 處理結果


        成功時完成所述業務操作，具體返回內容見 `200` 響應定義。'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              - lb_bank_account_info
              properties:
                id:
                  type: string
                  description: 銀行賬戶ID，用於標識本次請求關聯的業務對象。此字段為必填項。
                lb_bank_account_info:
                  type: object
