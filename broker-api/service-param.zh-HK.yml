  /atm/currency/config:
    put:
      operationId: atm_currency_config_edit
      summary: 編輯幣種設置
      tags:
      - 業務參數設置
      x-permission-key:
      - atm.update_current_config
      x-lbonly: false
      description: '編輯幣種設置。


        ### 請求參數


        - 必填：`id`（配置ID）、`currency_iso`（幣種代碼）、`currency`（幣種標識）、`icon`（圖標標識）、`logo`（Logo）、`support_withdraw`（支持出金）、`support_exchange`（支持換匯）、`min_withdrawal_amount`（最低出金金額）、`min_exchange_amount`（最低換匯金額）、`exchange_rate_precision`（匯率精度）、`amount_precision`（金額精度）、`amount_round_mode`（金額舍入方式）、`standard_money`（是否本位幣）、`abbreviation_multi_name`（簡稱多語言）、`multi_name`（全稱多語言）、`json_config`（展示與業務開關配置）

        - 可選：`cash_amount`（最低入金金額）、`remarks`（備註）、`audit_frontend_resource`（調用方提交的審計日誌載荷）

        - 各字段的格式、取值範圍和業務含義見對應字段說明。


        ### 處理結果


        成功時完成上述業務操作；後續狀態和返回數據以 `200` 響應定義為準。'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              - currency_iso
              - currency
              - icon
              - logo
              - support_withdraw
              - support_exchange
              - min_withdrawal_amount
              - min_exchange_amount
              - exchange_rate_precision
              - amount_precision
              - amount_round_mode
              - standard_money
              - abbreviation_multi_name
              - multi_name
              - json_config
              properties:
                id:
                  type: string
                  description: 配置ID，用於標識本次請求關聯的業務對象。此字段為必填項。
                currency_iso:
                  type: string
                  description: 用於指定「幣種代碼」。此字段為必填項。
                currency:
                  type: string
                  description: 用於指定「幣種標識」。此字段為必填項。
                icon:
                  type: string
                  description: 用於指定「圖標標識」。此字段為必填項。
                logo:
                  type: string
                  description: 用於指定「Logo」。此字段為必填項。
                cash_amount:
                  type: string
                  description: 用於指定「最低入金金額」。
                support_withdraw:
                  type: string
                  description: '最終併入 json_config


                    **可選值：**

                    - `yes` - 表示是

                    - `no` - 表示否'
                  enum:
                  - 'yes'
                  - 'no'
                  x-enum-details:
                  - value: 'yes'
                    label: 是
                  - value: 'no'
                    label: 否
                support_exchange:
                  type: string
                  description: '最終併入 json_config


                    **可選值：**

                    - `yes` - 表示是

                    - `no` - 表示否'
                  enum:
                  - 'yes'
                  - 'no'
                  x-enum-details:
                  - value: 'yes'
                    label: 是
                  - value: 'no'
                    label: 否
                min_withdrawal_amount:
                  type: string
                  description: 用於指定「最低出金金額」。此字段為必填項。
                min_exchange_amount:
                  type: string
                  description: 用於指定「最低換匯金額」。此字段為必填項。
                exchange_rate_precision:
                  type: number
                  description: 用於指定「匯率精度」。此字段為必填項。
                amount_precision:
                  type: string
                  description: '金額保留的小數位數。此字段為必填項。


                    **可選值：**

                    - `0` - 表示 0 位小數

                    - `1` - 表示 1 位小數

                    - `2` - 表示 2 位小數'
                  enum:
                  - '0'
                  - '1'
                  - '2'
                amount_round_mode:
                  type: string
                  description: 用於指定「金額舍入方式」。此字段為必填項。
                standard_money:
                  type: string
                  description: '用於指定「是否本位幣」。此字段為必填項。


                    **可選值：**

                    - `yes` - 表示是

                    - `no` - 表示否'
                  enum:
                  - 'yes'
                  - 'no'
                  x-enum-details:
                  - value: 'yes'
                    label: 是
                  - value: 'no'
                    label: 否
                remarks:
                  type: string
                  description: 隨本次操作保存的備註。
                abbreviation_multi_name:
                  type: string
                  description: JSON 字符串 {zh-CN, zh-HK, en}
                multi_name:
                  type: string
                  description: JSON 字符串 {zh-CN, zh-HK, en}
                json_config:
                  type: string
                  description: JSON 字符串 {app_show, support_withdraw, support_exchange, support_deposit}
                audit_frontend_resource:
                  type: object
                  description: 用於指定「調用方提交的審計日誌載荷」。
            example:
              id: '1'
              currency_iso: USD
              currency: USD
              icon: ''
              logo: ''
              cash_amount: '0'
              support_withdraw: 'yes'
              support_exchange: 'yes'
              min_withdrawal_amount: '0'
              min_exchange_amount: '0'
              exchange_rate_precision: 2
              amount_precision: '2'
              amount_round_mode: ''
              standard_money: 'no'
              remarks: ''
              abbreviation_multi_name: '{"zh-CN":"","zh-HK":"","en":"USD"}'
              multi_name: '{"zh-CN":"","zh-HK":"","en":"USD"}'
              json_config: '{"app_show":"yes","support_withdraw":"yes","support_exchange":"yes","support_deposit":"yes"}'
              audit_frontend_resource: {}
      responses:
        '200':
          description: 請求處理成功。響應的 `data` 不包含額外業務字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: '0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。


                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`

                      判斷具體結果。


                      - `401`：未登錄。

                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。'
                    x-enum-details:
                    - value: 0
                      label: 成功
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登錄或登錄狀態已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 當前賬號未獲得該功能授權。請在 User Permission 中為該賬號開通相應權限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 請求處理超時。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
