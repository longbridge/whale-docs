      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 字段同 va_coin_configs.yaml（query 能力）裏的 filters
                  properties:
                    coin:
                      type: string
                      description: 用於按「貨幣代碼」篩選結果。
                    pi_verify:
                      type: string
                      description: '用於按「PI 認證」篩選結果。


                        **可選值：**

                        - `yes` - 表示需要

                        - `no` - 表示不需要'
                      enum:
                      - 'yes'
                      - 'no'
                      x-enum-details:
                      - value: 'yes'
                        label: 需要
                      - value: 'no'
                        label: 不需要
                mode:
                  type: integer
                  default: 0
                  description: '不傳時默認 0（同步）


                    **可選值：**

                    - `0` - 表示同步

                    - `1` - 表示异步'
                  enum:
                  - 0
                  - 1
                  x-enum-details:
                  - value: 0
                    label: 同步
                  - value: 1
                    label: 异步
                ext:
                  type: string
                  description: '下載文件格式。不傳時默認為 `csv`。


                    **可選值：**

                    - `csv` - 表示 CSV

                    - `xlsx` - 表示 Excel'
                  enum:
                  - csv
                  - xlsx
                file_name:
                  type: string
                  description: 導出文件名稱。不傳時由服務端生成。
                down_fields:
                  type: array
                  description: 不傳時導出全部字段；取值範圍見 items.enum（同查詢接口 data.list.items 的字段列表）
                  items:
                    type: string
                    enum:
                    - id
                    - coin
                    - chain_types
                    - chain_types_val
                    - name_zh_cn
                    - name_zh_hk
                    - name_en
                    - custom_name
                    - icon
                    - conversion_currency
                    - conversion_rate
                    - daily_withdraw_limit
                    - weekly_withdraw_limit
                    - max_per_withdraw
                    - min_per_withdraw
                    - support_withdraw
                    - custom_withdrawal_function
                    - custom_deposit_function
                    - pi_verify
                    - pi_verify_val
                    - require_tag
                    - require_tag_val
                    - deposit_need_micro_verification
                    - quantity_precision
                    - quantity_round_mode_query
                    - quantity_round_mode_query_val
                    - updater
                    - remark
                    - created_at
                    - updated_at
                    - custom_time
                ticket_content:
                  type: string
                  description: 模板配置了下載審核工單時，供審批人查看
                ticket_preview_url:
                  type: string
                  description: 導出審批詳情地址；僅在導出需要審批時使用。
                hide:
                  type: integer
                  description: '是否在下載記錄列表中隱藏本次導出記錄。


                    **可選值：**

                    - `0` - 表示不隐藏

                    - `1` - 表示隐藏'
                  enum:
                  - 0
                  - 1
                  x-enum-details:
                  - value: 0
                    label: 不隐藏
                  - value: 1
                    label: 隐藏
            example:
