    post:
      operationId: company_credit_cfg_reset
      summary: 重置公司授信配置
      tags:
      - 業務參數設置
      x-lbonly: false
      description: '提交，重置公司級授信配置。涉及公司級真實授信配置變更。


        ### 請求參數


        - 必填：`credit_currency`（授信幣種）、`cp_credit_total`（公司授信總額度）、`cp_total_finance`（公司融資總額度）、`cp_credit_used_warning`（授信已用預警閾值）、`cp_total_finance_used_warning`（融資已用預警閾值）

        - 可選：`audit_frontend_resource`（審批工單展示資源）

