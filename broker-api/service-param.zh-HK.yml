                        作為本參數值。'
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/company_bank_names
                      example: BOC_HK
                    lb_bank_account_ids:
                      type: string
                      description: '銀行賬號，可多選。以英文逗號連接多個銀行賬號 id，例如 `1001,1002`；傳 `all` 表示適用於該公司銀行名稱下的全部賬號。此字段為必填項。


                        候選值隨所選 `lb_bank_name` 變化。'
                      example: 1001,1002
                    bank_operation_types_ids:
                      type: string
                      description: '出金方式，可多選。以英文逗號連接多個出金方式 id，例如 `10,20`；傳 `all` 表示適用於全部出金方式。此字段為必填項。


                        候選值隨所選 `lb_bank_name` 及 `lb_bank_account_ids` 變化。'
                      example: 10,20
                    currency:
                      type: string
                      description: '幣種。此字段為必填項。


                        該字典按賬戶渠道過濾。候選值會動態變化，請調用 `GET /v1/datasets/refs/tenant_currencies_by_channel` 獲取當前可用的數據字典，並使用返回項的
                        `key` 作為本參數值。'
