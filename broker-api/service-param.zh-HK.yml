  /forex/query_support_currency:
    post:
      operationId: query_support_currency
      summary: 查詢幣種對配置
      tags:
      - 業務參數設置
      x-permission-key:
      - lb_hk_conversion.support_currency_update
      x-lbonly: false
      description: '查詢「幣種對 (Currency Pairs)」配置列表。所有過濾字段均為可選，請求體傳空對象或省略某個字段時返回全部幣種對配置。


        ### 請求參數


        - `created_at`：按創建時間過濾，不傳時查詢全部。

        - `from_currency`：按借記/兌出幣種 (Debit Currency) 過濾，不傳時查詢全部。

        - `to_currency`：按貸記/兌入幣種 (Credit Currency) 過濾，不傳時查詢全部。


        ### 返回結果


        成功時在 `data.support_currency_resp` 中按源幣種分組返回幣種對配置記錄列表。各字段含義見 `200` 響應字段說明。'
      security:
      - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                created_at:
                  type: string
                  description: '按「創建時間」過濾，取值為 `起始,結束` 逗號連接的日期區間字符串，例如 `2026-07-01,2026-07-01`。


                    不傳時查詢全部。'
                  example: 2026-07-01,2026-07-01
                from_currency:
                  type: string
                  description: '按「兌出幣種」（借記/源幣種）過濾，取值為三位貨幣代碼。


                    候選值會動態變化。請調用 `GET /v1/datasets/refs/atm_ref_currency_iso` 獲取當前可用的數據字典，並使用返回項的 `key`
                    作為本參數值。


                    不傳時查詢全部。'
                  example: USD
                  x-value-source:
                    endpoint: GET /v1/datasets/refs/atm_ref_currency_iso
                to_currency:
                  type: string
                  description: '按「兌入幣種」（貸記/目標幣種）過濾，取值為三位貨幣代碼。


                    候選值會動態變化。請調用 `GET /v1/datasets/refs/atm_ref_currency_iso` 獲取當前可用的數據字典，並使用返回項的 `key`
                    作為本參數值。


                    不傳時查詢全部。'
                  example: HKD
                  x-value-source:
                    endpoint: GET /v1/datasets/refs/atm_ref_currency_iso
            example:
              from_currency: USD
              to_currency: HKD
              created_at: 2026-07-01,2026-07-01
      responses:
        '200':
          description: 請求處理成功。`data.support_currency_resp` 為按源幣種分組的幣種對配置記錄列表。
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - data
                properties:
                  code:
                    type: integer
                    description: '0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。


                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`

                      判斷具體結果。


                      - `401`：未登錄。

                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。'
                    x-enum-details:
                    - value: 0
                      label: 成功
                  message:
                    type: string
                  data:
                    type: object
                    required:
                    - support_currency_resp
                    properties:
                      support_currency_resp:
                        type: array
                        description: '**返回值：** 符合查詢條件的幣種對配置記錄列表，按源幣種分組，每一項對應一個源幣種及其全部目標幣種。'
                        items:
                          type: object
                          properties:
                            from_currency:
                              type: string
                              description: '**返回值：** 兌出幣種（借記/源幣種），三位貨幣代碼。'
                            to_currency:
                              type: string
                              description: '**返回值：** 該源幣種下的目標幣種配置，為一段 JSON 編碼的字符串。解析後為對象，其 `id_to_ccy`
                                字段是目標幣種數組，數組每一項包含：


                                - `id`：該「源幣種-目標幣種」記錄的唯一標識，用於編輯或刪除。

                                - `to_ccy`：兌入幣種（貸記/目標幣種），三位貨幣代碼。

                                - `default_currency`：是否為該源幣種的默認目標幣種，`true` 表示默認。'
                            created_at:
                              type: string
                              description: '**返回值：** 創建時間；時間或日期格式以接口實際返回值為準。'
              example:
                code: 0
                message: success
                data:
                  support_currency_resp:
                  - from_currency: USD
                    to_currency: '{"id_to_ccy":[{"id":"1001","to_ccy":"HKD","default_currency":true},{"id":"1002","to_ccy":"JPY","default_currency":false}]}'
                    created_at: '1780480167'
                  - from_currency: HKD
                    to_currency: '{"id_to_ccy":[{"id":"1003","to_ccy":"USD","default_currency":true}]}'
                    created_at: '1780480200'
        '400':
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登錄或登錄狀態已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 當前賬號未獲得該功能授權。請在 User Permission 中為該賬號開通相應權限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 請求處理超時。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
