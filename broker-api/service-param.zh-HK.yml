                        endpoint: GET /v1/datasets/refs/tenant_currencies_by_channel
                      example: HKD
                    limit_amount:
                      type: string
                      description: 每日初始額度，以字符串形式傳遞的金額數值。此字段為必填項。
                      example: '1000000'
                    alarm_amount:
                      type: string
                      description: 日剩餘額度警戒線，以字符串形式傳遞的金額數值。當日剩餘額度低於該值時觸發預警。此字段為必填項。
                      example: '100000'
                    remark:
                      type: string
                      description: 備註，可選。用於記錄本次配置的補充說明。
                      example: 香港账户日限额
            example:
              params:
