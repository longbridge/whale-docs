  /v1/datasets/atm_forex_amount_configs:
    get:
      operationId: atm_forex_amount_configs
      summary: 大額限制
      tags:
      - 業務參數設置
      x-permission-key:
      - lb_hk_conversion.amount_config_query
      x-lbonly: false
      description: '查詢「大額限制」數據，可通過 `filters` 組合業務篩選條件，並使用 `page`、`page_size` 控制分頁。


        ### 返回結果


        成功時返回匹配的記錄列表及分頁信息。各過濾字段的用途、可選值和動態數據來源見對應字段說明。'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 組合業務過濾條件。省略某個過濾字段時，不按該字段篩選。
                  properties: null
                page:
                  type: integer
                  description: 要查詢的頁碼，從 `1` 開始。
                page_size:
                  type: integer
                  description: 每頁返回的記錄數量。
            example:
              filters: {}
              page: 1
              page_size: 20
      responses:
        '200':
          description: 成功時分頁返回「大額限制」記錄，以及頁碼、每頁數量和總記錄數等分頁信息。
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - data
                properties:
                  code:
                    type: integer
                    description: '0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。


                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`

                      判斷具體結果。


                      - `401`：未登錄。

                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。'
                    x-enum-details:
                    - value: 0
                      label: 成功
                  message:
                    type: string
                  data:
                    type: object
                    required:
                    - list
                    - total
                    properties:
                      list:
                        type: array
                        description: '**返回值：** 列表列表。'
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: '**返回值：** 當前記錄的唯一標識。'
                            currency:
                              type: string
                              description: '**返回值：** 幣種。'
                            currency_val:
                              type: string
                              description: 字段 currency 的原始值：currency 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            amount:
                              type: string
                              description: '**返回值：** 大額起始點。'
                            created_at:
                              type: string
                              description: '**返回值：** 創建時間；時間或日期格式以接口實際返回值為準。'
                            updated_at:
                              type: string
                              description: '**返回值：** 更新時間；時間或日期格式以接口實際返回值為準。'
                      total:
                        type: integer
                        description: '**返回值：** 符合查詢條件的記錄總數，用於計算分頁。'
              example:
                code: 0
                message: success
                data:
                  list:
