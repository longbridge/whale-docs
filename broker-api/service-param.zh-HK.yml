            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
    post:
      operationId: atm_lb_bankaccount_add
      summary: 新增公司銀行賬戶
      tags:
      - 業務參數設置
      x-permission-key:
      - lb_hk_fund.companybank_update
      x-lbonly: false
      description: '新增公司銀行賬戶。


        ### 請求參數


        - 必填：`nature_type`（賬戶性質）、`currency`（幣種）、`account_name`（賬戶名稱）、`region`（地區）、`bank_id`（銀行ID）、`bank_account`（銀行賬號）、`bank_name`（銀行名稱）、`bank_region`（銀行所在地區）、`swift_code`（Swift
        Code）、`bank_addr`（銀行地址）、`simple_name`（簡稱）、`deposit_types`（入金方式列表）、`withdraw_types`（出金方式列表）、`version`（版本）

        - 可選：`bank_code`（銀行代碼）、`connect_customer_id`（聯行號/Connect Customer ID）、`net_customer_id`（Net Customer
        ID）、`intermediary_swift_code`（中間行 Swift Code）、`support_exchange`（是否支持換匯）、`remark`（備註）

        - 各字段的格式、取值範圍和業務含義見對應字段說明。


        ### 處理結果


        成功時完成上述業務操作；後續狀態和返回數據以 `200` 響應定義為準。'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - nature_type
              - currency
              - account_name
              - region
              - bank_id
              - bank_account
              - bank_name
              - bank_region
              - swift_code
              - bank_addr
              - simple_name
              - deposit_types
              - withdraw_types
              - version
              properties:
                nature_type:
                  type: string
                  description: 用於指定「賬戶性質」。此字段為必填項。
                currency:
                  type: string
                  description: 本次請求使用的幣種代碼。此字段為必填項。
                account_name:
                  type: string
                  description: 用於指定「賬戶名稱」。此字段為必填項。
                region:
                  type: string
                  description: 用於指定「地區」。此字段為必填項。
                bank_id:
                  type: string
                  description: 銀行ID，用於標識本次請求關聯的業務對象。此字段為必填項。
                bank_account:
                  type: string
                  description: 用於指定「銀行賬號」。此字段為必填項。
                bank_code:
                  type: string
                  description: 用於指定「銀行代碼」。
                bank_name:
                  type: string
                  description: 用於指定「銀行名稱」。此字段為必填項。
                bank_region:
                  type: string
                  description: 用於指定「銀行所在地區」。此字段為必填項。
                swift_code:
                  type: string
                  description: 用於指定「Swift Code」。此字段為必填項。
                bank_addr:
                  type: string
                  description: 用於指定「銀行地址」。此字段為必填項。
                connect_customer_id:
                  type: string
                  description: 聯行號/Connect Customer ID，用於標識本次請求關聯的業務對象。
                net_customer_id:
                  type: string
                  description: Net Customer ID，用於標識本次請求關聯的業務對象。
                simple_name:
                  type: string
                  description: 用於指定「簡稱」。此字段為必填項。
                intermediary_swift_code:
                  type: string
                  description: 用於指定「中間行 Swift Code」。
                deposit_types:
                  type: array
                  description: 數組元素 {name, id}，提交前過濾掉 name/id 為空的項
                  items:
                    type: string
                withdraw_types:
                  type: array
                  description: 數組元素 {name, id, support_bank}，提交前過濾掉 name/id 為空的項
                  items:
                    type: string
                support_exchange:
                  type: string
                  description: '用於指定「是否支持換匯」。


                    **可選值：**

                    - `yes` - 表示是

                    - `no` - 表示否'
                  enum:
                  - 'yes'
                  - 'no'
                  x-enum-details:
                  - value: 'yes'
                    label: 是
                  - value: 'no'
                    label: 否
                remark:
                  type: string
                  description: 隨本次操作保存的備註。
                version:
                  type: number
                  description: 固定傳入 1，兼容老接口
            example:
              nature_type: ''
              currency: USD
              account_name: ''
              region: ''
              bank_id: ''
              bank_account: ''
              bank_code: ''
              bank_name: ''
              bank_region: ''
              swift_code: ''
              bank_addr: ''
              connect_customer_id: ''
              net_customer_id: ''
              simple_name: ''
              intermediary_swift_code: ''
              deposit_types: []
              withdraw_types: []
              support_exchange: 'yes'
              remark: ''
              version: 1
      responses:
        '200':
          description: 請求處理成功。響應的 `data` 不包含額外業務字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: '0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。


                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`

                      判斷具體結果。


                      - `401`：未登錄。

                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。'
                    x-enum-details:
                    - value: 0
                      label: 成功
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登錄或登錄狀態已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 當前賬號未獲得該功能授權。請在 User Permission 中為該賬號開通相應權限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 請求處理超時。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
    get:
      operationId: atm_lb_bankaccount_detail
      summary: 公司銀行賬户詳情
      tags:
      - 業務參數設置
      x-permission-key:
      - lb_hk_fund.companybank_query
      x-lbonly: false
      description: '按 `id` 查詢單條公司銀行賬户的完整配置詳情。


        ### 請求參數


        - 必填：`id`（公司銀行賬户 id），作為查詢參數傳入。


        ### 處理結果


        成功時在 `data` 中返回該公司銀行賬户的完整配置，字段與「新增/編輯公司銀行賬户」的請求字段一致。各字段含義見 `200` 響應字段說明。'
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: query
        required: true
        schema:
          type: string
        description: 公司銀行賬户 id，作為查詢參數傳入。
      responses:
        '200':
          description: 請求處理成功。`data` 為該公司銀行賬户的完整配置。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: '0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。


                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`

                      判斷具體結果。


                      - `401`：未登錄。

                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。'
                    x-enum-details:
                    - value: 0
                      label: 成功
                  message:
                    type: string
                  data:
                    type: object
                    description: 公司銀行賬户的完整配置。
                    properties:
                      nature_type:
                        type: string
                        description: 賬户性質。常見取值：`client`（客户賬户）、`house`（自營賬户）。
                      account_type_id:
                        type: string
                        description: 賬户類型 id。
                      lb_company_id:
                        type: string
                        description: 所屬公司 id。
                      account_name:
                        type: string
                        description: 賬户名稱。
                      bank_account:
                        type: string
                        description: 銀行賬號。
