              - start_time
              - from_currency
              - to_currency
              - default_effective
              properties:
                id:
                  type: string
                  description: 配置ID，用於標識本次請求關聯的業務對象。此字段為必填項。
                action_user:
                  type: string
                  description: 用於指定「操作用戶」。
                channel_name:
                  type: string
                  description: service_strategy=BATCH（批量策略）時提交前會被刪除，不下發
                end_time:
                  type: string
                  description: 非默認生效時為區間選擇器 end_time 的 unix 秒；默認生效時固定傳 '0'
                start_time:
                  type: string
                  description: 同 end_time 邏輯
                from_currency:
                  type: string
                  description: 用於指定「原幣種」。此字段為必填項。
                to_currency:
                  type: string
                  description: 用於指定「目標幣種」。此字段為必填項。
                is_default:
                  type: string
                  description: 用於指定「是否默認」。
                rate_source:
                  type: string
                  description: 用於指定「匯率來源」。
                rate_use_in:
                  type: string
                  description: 用於指定「匯率使用場景」。
                reference_rate:
                  type: string
                  description: 用於指定「參考匯率」。
                service_strategy:
                  type: string
                  description: 用於指定「服務策略」。
                spread_mode:
                  type: string
                  description: 用於指定「加點方式」。
                spread_value:
                  type: array
                  description: 數組元素 {start_value, end_value}，由請求 range_value 區間拆分而來
                  items:
                    type: string
                default_effective:
                  type: string
                  description: 用於指定「是否默認生效（不限時間段）」。此字段為必填項。
                audit_frontend_resource:
                  type: object
                  description: 用於指定「調用方提交的審計日誌載荷」。
            example:
              id: '1'
              action_user: ''
              channel_name: ''
              end_time: '0'
              start_time: '0'
              from_currency: USD
              to_currency: HKD
              is_default: 'true'
              rate_source: ''
              rate_use_in: ''
              reference_rate: ''
              service_strategy: ''
              spread_mode: ''
              spread_value:
              - start_value: '0'
                end_value: ''
              default_effective: 'true'
              audit_frontend_resource: {}
      responses:
