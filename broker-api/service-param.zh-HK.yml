        成功時完成所述業務操作，具體返回內容見 `200` 響應定義。'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - credit_currency
              - cp_credit_total
              - cp_total_finance
              - cp_credit_used_warning
              - cp_total_finance_used_warning
              properties:
                credit_currency:
                  type: string
                  description: 授信幣種。更新已有記錄時必須保持原值，不可修改。
