                      - `401`：未登錄。

                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。'
                    x-enum-details:
                    - value: 0
                      label: 成功
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
