                  type: object
                  description: 字段同 atm_remark_templates.yaml（query 能力）裏的 filters
                  properties:
                    id:
                      type: string
                      description: 用於按「編號」篩選結果。
                    config_value_multi_lang:
                      type: string
                      description: 用於按「備註」篩選結果。
