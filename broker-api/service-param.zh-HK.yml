                        - `VALUE` - 表示值

                        - `RATE` - 表示比率'
                      enum:
                      - VALUE
                      - RATE
                      x-enum-details:
                      - value: VALUE
                        label: 值
                      - value: RATE
                        label: 比率
                mode:
                  type: integer
                  default: 0
                  description: '不傳時默認 0（同步）


                    **可選值：**

                    - `0` - 表示同步

                    - `1` - 表示异步'
                  enum:
                  - 0
                  - 1
                  x-enum-details:
                  - value: 0
                    label: 同步
                  - value: 1
                    label: 异步
                ext:
                  type: string
                  description: '下載文件格式。不傳時默認為 `csv`。


                    **可選值：**

                    - `csv` - 表示 CSV

                    - `xlsx` - 表示 Excel'
                  enum:
