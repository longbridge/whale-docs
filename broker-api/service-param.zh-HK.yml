    put:
      operationId: modify_lookup
      summary: 編輯出入金備註預定義
      tags:
      - 業務參數設置
      x-permission-key:
      - atm.modify_lookup
      x-lbonly: false
      description: '編輯出入金備註預定義。


        ### 請求參數


        - 必填：`id`（備註預定義ID）、`category`（備註類型）、`value_cn`（備註內容(簡體中文)）、`value_hk`（備註內容(繁體中文)）、`value_en`（備註內容(英文)）、`priority`（優先級）

        - 可選：`audit_frontend_resource`（審計上下文）

        - 各字段的格式、取值範圍和業務含義見對應字段說明。


        ### 處理結果


        成功時完成上述業務操作；後續狀態和返回數據以 `200` 響應定義為準。'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              - category
              - value_cn
              - value_hk
              - value_en
              - priority
              properties:
                id:
                  type: string
                  description: 備註預定義ID，用於標識本次請求關聯的業務對象。此字段為必填項。
                category:
                  type: string
                  description: '編輯時該字段禁用不可修改；取值來自 atm_remark_category 動態枚舉，已知取值：setting_remark_deposit-入金，

                    setting_remark_securitiesdeposit-證券入金，setting_remark_securitieswithdrawal-證券出金，

                    setting_remark_withdrawal-出金，setting_remark_accountadjustment-賬戶調整，setting_remark_withdrawal_reject-出金拒絕，

                    setting_remark_deposit_reject-入金拒絕，setting_remark_deposit_matching-入金匹配


                    **可選值：**

                    - `setting_remark_deposit` - 表示入金

                    - `setting_remark_withdrawal` - 表示出金

                    - `setting_remark_securitiesdeposit` - 表示證券存入

                    - `setting_remark_securitieswithdrawal` - 表示證券取出

                    - `setting_remark_accountadjustment` - 表示調賬

                    - `setting_remark_withdrawal_reject` - 表示出金拒絕理由

                    - `setting_remark_deposit_reject` - 表示入金拒絕理由

                    - `setting_remark_withdrawal_card_reject` - 表示拒絕客戶綁卡

                    - `setting_remark_fund` - 表示基金

                    - `setting_remark_otc_derivatives` - 表示場外衍生品

                    - `setting_remark_deposit_matching` - 表示入金匹配


                    請調用 `GET /v1/datasets/refs/atm_remark_category` 獲取當前可用的數據字典，並使用返回項的 `key` 作為本字段值。'
                  enum:
                  - setting_remark_deposit
                  - setting_remark_withdrawal
                  - setting_remark_securitiesdeposit
                  - setting_remark_securitieswithdrawal
                  - setting_remark_accountadjustment
                  - setting_remark_withdrawal_reject
                  - setting_remark_deposit_reject
                  - setting_remark_withdrawal_card_reject
                  - setting_remark_fund
                  - setting_remark_otc_derivatives
                  - setting_remark_deposit_matching
