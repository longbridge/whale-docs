                    - channel_name
                    - channel_name_val
                    - from_currency
                    - from_currency_val
                    - to_currency
                    - to_currency_val
                    - spread_mode
                    - spread_mode_val
                    - spread_value
                    - effective_time
                    - updated_at
                    - action_user
