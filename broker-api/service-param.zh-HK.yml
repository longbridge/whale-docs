                    label: 出金
                  - value: setting_remark_securitiesdeposit
                    label: 證券存入
                  - value: setting_remark_securitieswithdrawal
                    label: 證券取出
                  - value: setting_remark_accountadjustment
                    label: 調賬
                  - value: setting_remark_withdrawal_reject
                    label: 出金拒絕理由
                  - value: setting_remark_deposit_reject
                    label: 入金拒絕理由
                  - value: setting_remark_withdrawal_card_reject
                    label: 拒絕客戶綁卡
                  - value: setting_remark_fund
                    label: 基金
                  - value: setting_remark_otc_derivatives
                    label: 場外衍生品
                  - value: setting_remark_deposit_matching
                    label: 入金匹配
                value_cn:
                  type: string
                  description: 最長 128 字符；當 category 為 setting_remark_withdrawal_reject 或 setting_remark_deposit_reject
                    時最長 500 字符
                value_hk:
                  type: string
                  description: 長度限制同 value_cn
                value_en:
                  type: string
                  description: 長度限制同 value_cn
                priority:
                  type: number
                  description: 取值範圍 1-999999
                audit_frontend_resource:
                  type: object
                  description: 修改前記錄快照，用於審計追蹤，非用戶填寫字段
            example:
              id: '101'
              category: setting_remark_deposit
              value_cn: 银行转账入金
              value_hk: 銀行轉賬入金
              value_en: Bank Transfer Deposit
              priority: 10
      responses:
