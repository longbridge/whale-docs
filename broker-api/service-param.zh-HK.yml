      description: '編輯支持換匯幣種對配置（含設為默認）。


        ### 請求參數


        - 必填：`UpdateSupportCurrency`（幣種對變更列表）、`UpdateSupportCurrency[].from_currency`（源幣種）、`UpdateSupportCurrency[].to_currency`（目標幣種）、`UpdateSupportCurrency[].action`（操作類型）

        - 可選：`UpdateSupportCurrency[].id`（幣種對子項ID）、`UpdateSupportCurrency[].default_currency`（是否設為默認目標幣種）、`audit_frontend_resource`（審計快照（變更前後目標幣種列表））

        - 各字段的格式、取值範圍和業務含義見對應字段說明。


        ### 處理結果


        成功時完成上述業務操作；後續狀態和返回數據以 `200` 響應定義為準。'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - UpdateSupportCurrency
              - UpdateSupportCurrency[].from_currency
              - UpdateSupportCurrency[].to_currency
              - UpdateSupportCurrency[].action
              properties:
                UpdateSupportCurrency:
                  type: array
                  description: '每項包含 id/from_currency/to_currency/action/default_currency； 中新增項 action=1、變更

                    to_currency 的項 action=2、被移除的舊項 action=3； 中固定傳單項 action=2 並附加 default_currency=true

                    用於設為默認目標幣種'
                  items:
                    type: string
                UpdateSupportCurrency[].id:
                  type: string
                  description: 已存在的目標幣種記錄 ID，新增（action=1）時為空
                UpdateSupportCurrency[].from_currency:
                  type: string
                  description: 用於指定「源幣種」，三位貨幣代碼。候選值來自 ref `tenant_currencies_for_exchange`。此字段為必填項。
                  x-value-source:
                    endpoint: GET /v1/datasets/refs/tenant_currencies_for_exchange
                UpdateSupportCurrency[].to_currency:
                  type: string
                  description: 用於指定「目標幣種」，三位貨幣代碼。候選值來自 ref `tenant_currencies_for_exchange`。此字段為必填項。
                  x-value-source:
                    endpoint: GET /v1/datasets/refs/tenant_currencies_for_exchange
                UpdateSupportCurrency[].action:
                  type: number
                  description: '操作類型。


                    **可選值：**

                    - `1` - 表示新增

                    - `2` - 表示修改/設為默認

                    - `3` - 表示刪除'
                  enum:
                  - '1'
                  - '2'
                  - '3'
                  x-enum-details:
                  - value: '1'
                    label: 新增
                  - value: '2'
                    label: 修改/設為默認
                  - value: '3'
                    label: 刪除
                UpdateSupportCurrency[].default_currency:
                  type: boolean
                  description: 僅 「設為默認」場景會傳 true
                audit_frontend_resource:
                  type: object
                  description: 僅 編輯場景傳入，包含 before/after 兩個目標幣種數組，用於後台審計留痕
            example:
              UpdateSupportCurrency:
              - id: '101'
                from_currency: USD
                to_currency: HKD
                action: 2
                default_currency: true
              audit_frontend_resource:
                after:
                - HKD
                - JPY
                before:
                - HKD
      responses:
