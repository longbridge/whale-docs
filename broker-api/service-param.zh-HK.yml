  /forex/rate_reference_update:
    post:
      operationId: rate_reference_update
      summary: 編輯參考匯率配置
      tags:
      - 業務參數設置
      x-permission-key:
      - lb_hk_conversion.rate_reference_update
      x-lbonly: false
      description: '編輯參考匯率配置。


        ### 請求參數


        - 必填：`id`（參考匯率記錄ID）、`channel_name`（換匯渠道）、`from_currency`（源幣種）、`to_currency`（目標幣種）、`spread_mode`（加點方式）、`bp`（加點數值）

        - 可選：`audit_frontend_resource`（審計快照（編輯前原始數據））

        - 各字段的格式、取值範圍和業務含義見對應字段說明。


        ### 處理結果


        成功時完成上述業務操作；後續狀態和返回數據以 `200` 響應定義為準。'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              - channel_name
              - from_currency
              - to_currency
              - spread_mode
              - bp
              properties:
                id:
                  type: string
                  description: 待編輯的參考匯率記錄 ID，來自列表行數據，編輯時必傳
                channel_name:
                  type: string
                  description: 匯率來源渠道代碼，下拉框選項來自调用方 ref `spot_forex_sources`
                from_currency:
                  type: string
                  description: 三位貨幣代碼，下拉框選項來自调用方 ref `tenant_currencies_for_exchange`
                to_currency:
                  type: string
                  description: 三位貨幣代碼，下拉框選項來自调用方 ref `tenant_currencies_for_exchange`，與 from_currency
                    互斥
                spread_mode:
                  type: string
                  description: '枚舉來自调用方 ref `forex_spread_mode`；调用方邏輯中值為 RATE 時按比例(%)加點，其餘取值按固定值加點


                    **可選值：**

                    - `VALUE` - 表示值

                    - `RATE` - 表示比率'
                  enum:
                  - VALUE
                  - RATE
                  x-enum-details:
                  - value: VALUE
                    label: 值
                  - value: RATE
                    label: 比率
                bp:
                  type: string
                  description: 取值範圍 0-100，最多 4 位小數（调用方請求校驗正則 /^\d+(\.\d{1,4})?$/），當 spread_mode 為 RATE
                    時表示百分比加點，否則表示固定值加點
                audit_frontend_resource:
                  type: object
                  description: 編輯前的原始記錄快照（调用方 originData/queryData），僅用於後台審計留痕，非業務字段
            example:
              id: '12345'
              channel_name: CIBC
              from_currency: USD
              to_currency: HKD
              spread_mode: RATE
              bp: '0.5'
              audit_frontend_resource:
                channel_name: CIBC
                from_currency: USD
                to_currency: HKD
                bp: '0.3'
                spread_mode: RATE
      responses:
        '200':
          description: 請求處理成功。響應的 `data` 不包含額外業務字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: '0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。


                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`

                      判斷具體結果。


                      - `401`：未登錄。

                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。'
                    x-enum-details:
                    - value: 0
                      label: 成功
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登錄或登錄狀態已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 當前賬號未獲得該功能授權。請在 User Permission 中為該賬號開通相應權限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 請求處理超時。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
