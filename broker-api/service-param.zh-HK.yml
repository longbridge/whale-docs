  /risk/v1/account_credit_cfg/add_review:
    post:
      operationId: account_credit_cfg_add_review
      summary: 新增用戶授信配置(提交審核)
      tags:
      - 業務參數設置
      x-lbonly: false
      description: '為指定證券賬號新增一條用戶級(per-account)授信配置，並提交審核。


        該接口不會立即生效：提交成功後會生成一張審批工單，配置在審批通過後才落地。工單 ID 通過 `200` 響應的 `data.ticket_id` 返回。


        ### 請求參數


        - 賬戶範圍：`member_id`（會員 ID）、`aaid`（證券賬號）用於定位目標客戶，均為必填。

        - 授信主體：`credit_type`（授信類型）、`credit_currency`（幣種）確定授信配置的適用範圍。

        - 額度與係數：`applicable`、`auto_credit_limit`、`credit_coefficient`、`ccf`、`credit_fps` 等描述授信額度與計算參數。

        - 係數規則：`credit_coefficient_rule_list` 為可選的分段授信係數規則；配置了規則時應同時將 `is_enable_credit_coefficient_rule`
        置為 `true`。

        - 動態調額：`dynamic_credit_limit_adjustment_status` 開啓後需提供 `max_dynamic_credit_limit`、`min_dynamic_credit_limit`。

        - 各字段的格式、取值範圍和業務含義見對應字段說明。


        ### 處理結果


        成功時生成審批工單並在 `data.ticket_id` 返回工單 ID；配置需待工單審批通過後生效。'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - member_id
              - aaid
              - credit_type
              - credit_currency
              - applicable
              - auto_credit_limit
              - ccf
              - auto_credit
              - credit_coefficient
              properties:
                member_id:
                  type: string
                  description: 目標客戶的會員 ID，用於定位被授信的客戶。此字段為必填項。
                  example: '1000000000000000000'
                aaid:
                  type: string
                  description: 目標客戶的證券賬號。此字段為必填項。
                  example: H00000000
                credit_type:
                  type: string
                  description: '授信類型，取值來自「授信類型」數據字典。此字段為必填項。


                    示例：`1` 表示 Margin Credit Limit（保證金授信額度）。'
                  example: '1'
                credit_currency:
                  type: string
                  description: 授信額度的幣種。此字段為必填項。
                  example: HKD
                applicable:
                  type: integer
                  description: App 端可申請的最大授信額度，需為 `1000` 的整數倍。此字段為必填項。
                  example: 1000000
                auto_credit_limit:
                  type: integer
                  description: 系統自動授信的最大限額，需為 `1000` 的整數倍。此字段為必填項。
                  example: 1000000
                net_asset_ratio:
                  type: string
                  description: 申報淨資產倍數，以字符串形式傳入。僅當 `credit_type` 為 `1`（保證金授信額度）時需要提供，其它授信類型不傳。
                  example: '1'
                credit_fps:
                  type: number
                  description: 賬戶基礎信息分析係數（FPS），取值範圍 `0`–`1`。僅當 `credit_type` 為 `1`（保證金授信額度）時需要提供。
                  example: 0.3
                ccf:
                  type: number
                  description: 信用轉換因子（CCF），以小數形式傳入。界面按百分比錄入（`0`–`100`），提交時須除以 `100` 轉換為小數，例如界面填 `100%`
                    時傳 `1`。此字段為必填項。
                  example: 1
                auto_credit:
                  type: boolean
                  description: 是否開啓自動授信：`true` 開啓，`false` 關閉。此字段為必填項。
                  example: true
                credit_coefficient:
                  type: number
                  description: 默認授信係數（乘數）。此字段為必填項。
                  example: 1
                is_enable_credit_coefficient_rule:
                  type: boolean
                  description: 是否啓用分段授信係數規則。當 `credit_coefficient_rule_list` 非空時應置為 `true`。
                  example: true
                credit_coefficient_rule_list:
                  type: array
                  description: 分段授信係數規則數組。每一項按指定指標（如客戶淨資產）的取值區間匹配一個授信係數；不配置分段規則時可省略或傳空數組。
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        description: 規則匹配的指標類型，取值來自「授信係數規則類型」數據字典，例如 `0` 表示客戶淨資產。
                        example: '0'
                      coefficient:
                        type: string
                        description: 該區間命中時使用的授信係數。
                        example: '1.5'
                      left_operator:
                        type: string
                        description: 區間下界的比較運算符；表示不限時使用「無限制」標記。
                        example: '0'
                      right_operator:
                        type: string
                        description: 區間上界的比較運算符；表示不限時使用「無限制」標記。
                        example: '1'
                      left_value:
                        type: string
                        description: 區間下界的值；下界不限時可為空。
                        example: '0'
                      right_value:
                        type: string
                        description: 區間上界的值；上界不限時可為空。
                        example: '1000000'
            example:
              member_id: '1000000000000000000'
              aaid: H00000000
              credit_type: '1'
              credit_currency: HKD
              applicable: 1000000
              auto_credit_limit: 1000000
              net_asset_ratio: '1'
              credit_fps: 0.3
              ccf: 1
              auto_credit: true
              credit_coefficient: 1
              is_enable_credit_coefficient_rule: true
              credit_coefficient_rule_list:
              - type: '0'
                coefficient: '1.5'
                left_operator: '0'
                right_operator: '1'
                left_value: '0'
                right_value: '1000000'
      responses:
        '200':
          description: 請求處理成功。提交審核後生成審批工單，`data.ticket_id` 為生成的工單 ID。
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - data
                properties:
                  code:
                    type: integer
                    description: '0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。


                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`

                      判斷具體結果。


                      - `401`：未登錄。

                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。'
                    x-enum-details:
                    - value: 0
                      label: 成功
                  message:
                    type: string
                  data:
                    type: object
                    description: 提交審核的處理結果。
                    properties:
                      ticket_id:
                        type: string
                        description: 提交審核後生成的審批工單 ID，可憑此跟蹤審批進度。
              example:
                code: 0
                message: success
                data:
                  ticket_id: '100001'
        '400':
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登錄或登錄狀態已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 當前賬號未獲得該功能授權。請在 User Permission 中為該賬號開通相應權限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 請求處理超時。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
