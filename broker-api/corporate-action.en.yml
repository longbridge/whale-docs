                  properties:
                    ca_code:
                      type: string
                      description: Filters results by Ca Code.
                mode:
                  type: integer
                  default: 0
                  description: 'Defaults to `0` (synchronous mode) when omitted.


                    **Allowed values:**

                    - `0` - Sync

                    - `1` - Async'
                  enum:
                  - 0
                  - 1
                  x-enum-details:
                  - value: 0
                    label: Sync
                  - value: 1
                    label: Async
                ext:
                  type: string
                  description: 'Download file format. Defaults to `csv` when omitted.


                    **Allowed values:**

                    - `csv` - CSV

                    - `xlsx` - Excel'
                  enum:
                  - csv
                  - xlsx
                file_name:
                  type: string
                  description: Export file name. The server generates a name when omitted.
                remark:
                  type: string
                  description: Remarks to save with this operation.
                down_fields:
                  type: array
                  description: 'When omitted, all fields are exported; allowed values are listed under items.enum (the

                    same field list as the query endpoint''s data.list.items).'
                  items:
                    type: string
                    enum:
                    - ca_code
                    - ann_type
                    - ann_type_val
                    - origin_counter_id
                    - record_date
                    - payable_date
                    - remark
                    - adjust_count
                ticket_content:
                  type: string
                  description: Information shown to the approver when download approval is enabled for the template.
                ticket_preview_url:
                  type: string
                  description: Export approval detail URL. Used only when the export requires approval.
                hide:
                  type: integer
                  description: 'Whether to hide this export from the download-record list.


                    **Allowed values:**

                    - `0` - Not Hidden

                    - `1` - Hidden'
                  enum:
                  - 0
                  - 1
                  x-enum-details:
                  - value: 0
                    label: Not Hidden
                  - value: 1
                    label: Hidden
            example:
              filters: {}
              mode: 0
              ext: csv
              file_name: ''
              remark: ''
              down_fields: []
              ticket_content: ''
              ticket_preview_url: ''
              hide: 0
