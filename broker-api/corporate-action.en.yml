        ### Request parameters


        - Required: `ann_id` (corporate-action announcement ID), `view_id` (sub-position view ID), `groups` (refund group list)

        - Each item in `groups` must provide `group_id` (group ID), `amount` (refund amount), and `sub_position_scope` (the sub-position accounts covered by the group)

        - Optional: `audit_frontend_resource` (caller-provided audit context)


        ### Result


        On success, the refund is initiated and the result is returned in `data`. Interpret the outcome together with the business `code`.'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - ann_id
              - view_id
              - groups
              properties:
                ann_id:
                  type: string
                  description: Corporate-action announcement ID identifying the corporate action to refund.
                view_id:
                  type: string
                  description: Sub-position view ID. Use a view identifier returned by the sub-position view list (tax refund) endpoint.
                groups:
                  type: array
                  description: Refund group list. Each item corresponds to a group under the selected view, giving its refund amount and the sub-position accounts it covers.
                  items:
                    type: object
                    required:
