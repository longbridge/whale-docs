      x-permission-key:
      - lb_hk_corporate.corporate_query
      x-lbonly: false
      description: 'Adds, modifies, or deletes a client''s voting instructions and attendance details under a shareholders'' meeting (Voting) corporate action.


        ### Request parameters


        - Required: `ann_id` (announcement ID), `aaid` (account ID), and `voting_infos` (voting instruction list).

        - Optional: `attendee_info` (attendee details).

        - `voting_infos` must have the same length as the number of proposals returned by the server, and each item''s `chosen_proxy_serial` must be unique.

        - `attendee_info` only takes effect when `attend_type` is `1` (proxy voting) or `2` (attend in person); its field values may contain English letters and punctuation only.


        ### Result


        On success, the voting instructions are updated and the result is returned in `data`. Interpret the outcome together with the business `code`.'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - ann_id
              - aaid
              - voting_infos
              properties:
                ann_id:
                  type: string
                  description: Announcement ID identifying the target shareholders' meeting (Voting) corporate action.
                  example: '12345'
                aaid:
                  type: integer
                  description: Account ID identifying the target client account whose voting instructions are edited.
                  example: 67890
                voting_infos:
                  type: array
                  description: List of voting instructions. The array length must equal the number of proposals returned by the server, and each `chosen_proxy_serial` must be unique.
                  items:
                    type: object
                    required:
                    - chosen_proxy_serial
                    - vote
