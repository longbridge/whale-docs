                      chosen_proxy_serial:
                        type: string
                        description: Proxy serial identifying the proposal; matches `proxy_serial` returned by "Query Voting Info".
                        example: P001
                      vote:
                        type: integer
                        description: Vote cast on this proposal.
                        enum:
                        - 0
                        - 1
                        - 2
                        - 3
                        example: 1
                        x-enum-details:
                        - value: 0
                          label: Unspecified
                        - value: 1
                          label: Approve
                        - value: 2
                          label: Against
                        - value: 3
                          label: Abstention
                attendee_info:
                  type: object
                  description: Attendee details. Only takes effect when `attend_type` is `1` (proxy voting) or `2` (attend in person); otherwise the server ignores the following fields. Field values may contain English letters and punctuation only.
                  properties:
                    attend_type:
                      type: integer
                      description: Way of participating in the shareholders' meeting.
                      enum:
                      - 0
                      - 1
                      - 2
                      - 3
                      example: 1
                      x-enum-details:
                      - value: 0
                        label: Unspecified
                      - value: 1
                        label: Proxy Voting
                      - value: 2
                        label: Attend In Person
                      - value: 3
                        label: Attend By Proxy
                    attendee_name:
                      type: string
                      description: Attendee's name.
                      example: John Doe
                    attendee_identification_number:
                      type: string
                      description: Attendee's identification number.
                      example: A1234567
                    attendee_address:
                      type: string
                      description: Attendee's address.
                      example: Central, Hong Kong
                    attendee_gender:
                      type: string
                      description: Attendee's gender.
                      example: M
