                    **Allowed values:**

                    - `0` - Not Hidden

                    - `1` - Hidden
                  enum:
                  - 0
                  - 1
                  x-enum-details:
                  - value: 0
                    label: Not Hidden
                  - value: 1
                    label: Hidden
