      x-permission-key:
      - lb_hk_corporate.corporate_query
      x-lbonly: false
      description: 'Submits a corporate-action rounding-difference adjustment (V2). A single request may include both

        tax-and-fee adjustments (`tax_fee_items`) and difference adjustments (`diff_items`), with `group_id`

        identifying the group this adjustment belongs to.


        ### Request parameters


        - Required: `tax_fee_items` (tax-and-fee adjustment list), `diff_items` (difference adjustment list), `group_id` (group ID)

        - See each field for its format, allowed values, and business meaning.


        ### Result


        On success, the rounding-difference adjustment is completed. See the `200` response schema for returned data.'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - tax_fee_items
