                      amount:
                        type: string
                        description: Refund amount for the group, passed as a numeric string.
                      sub_position_scope:
                        type: array
                        items:
                          type: string
                        description: Sub-position accounts covered by the group, as a list of sub-position account identifiers (`counterpart_account`).
                audit_frontend_resource:
                  type: object
                  description: Caller-provided audit context recording information such as the securities and announcement codes involved in this operation. No audit information is attached when omitted.
