                  data:
                    type: object
                    required:
                      - list
                      - total
                    properties:
                      list:
                        type: array
                        description: 列表. **返回值：** 列表列表。
                        items:
                          type: object
                          properties:
                            'no':
                              type: string
                              description: 合約號. **返回值：** 合約號。
                            ledger_date:
                              type: string
                              description: 賬務日期. **返回值：** 賬務日期；時間或日期格式以接口實際返回值為準。
                            trade_date:
                              type: string
                              description: 交易日期. **返回值：** 交易日期；時間或日期格式以接口實際返回值為準。
                            aaid:
                              type: string
                              description: 證券賬號. **返回值：** 證券賬號。
                            aaid_val:
                              type: string
                              description: 證券賬號（原始值）. 字段 aaid 的原始值：aaid 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            settlement_account:
                              type: string
                              description: 大賬號. **返回值：** 大賬號。
                            settlement_channel:
                              type: string
                              description: 結算渠道. **返回值：** 結算渠道。
                            settlement_channel_val:
                              type: string
                              description: 結算渠道（原始值）. 字段 settlement_channel 的原始值：settlement_channel 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            market:
                              type: string
                              description: 市場. **返回值：** 市場。
                            counter_id:
                              type: string
                              description: 證券代碼. **返回值：** 證券代碼。
                            direction:
                              type: string
                              description: 交易方向. **返回值：** 交易方向。
                            direction_val:
                              type: string
                              description: 交易方向（原始值）. 字段 direction 的原始值：direction 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            trade_quantity:
                              type: string
                              description: 交易數量. **返回值：** 交易數量。
                            trade_amount:
                              type: string
                              description: 交易金額. **返回值：** 交易金額。
                            currency:
                              type: string
                              description: 幣種. **返回值：** 幣種。
                            bill_amount:
                              type: string
                              description: 實收金額. **返回值：** 實收金額。
                            calculate_out_amount:
