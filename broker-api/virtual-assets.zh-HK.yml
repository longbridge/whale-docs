openapi: 3.1.1
info:
  title: Longport Whale 券商 API
  description: 面向使用 Longport Whale 的券商提供機構級服務端 API。
  version: 2.0.0
servers:
  - url: https://b-api.longbridge.xyz
    description: 測試環境
  - url: https://b-api.lbkrs.com
    description: 生產環境
security:
  - bearerAuth: []
tags:
  - name: 虛擬資產管理
paths:
  /billing/va/current_busin:
    get:
      operationId: billing_va_current_busin
      summary: 查詢當前虛擬資產清算業務狀態
      tags:
        - 虛擬資產管理
      x-permission-key:
        - lb_hk_clearing.billing_va_contracts
      x-lbonly: false
      description: |-
        查詢當前虛擬資產清算業務狀態。

        ### 請求參數

        該接口不接收業務參數。

        ### 處理結果

        成功時返回查詢結果；響應字段及其含義見 `200` 響應定義。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 請求處理成功。業務結果位於 `data`，包含 `records` 字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。

                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`
                      判斷具體結果。

                      - `401`：未登錄。
                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      records:
                        type: array
                        description: 清算步驟列表. **返回值：** 清算步驟列表列表。
                        items:
                          type: object
                          properties:
                            state:
                              type: number
                              description: |-
                                步驟狀態. 0=待執行 1=執行中 2=成功 3=失敗

                                **可選值：**
                                - `0` - 表示待執行
                                - `1` - 表示執行中
                                - `2` - 表示成功
                                - `3` - 表示失敗
                              enum:
                                - '0'
                                - '1'
                                - '2'
                                - '3'
              example:
                code: 0
                message: success
                data:
                  records:
                    - state: 0
        '400':
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登錄或登錄狀態已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 當前賬號未獲得該功能授權。請在 User Permission 中為該賬號開通相應權限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 請求處理超時。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
      x-mint:
        href: /zh-HK/api-reference/billing_va_current_busin
        metadata:
          sidebarTitle: 查詢當前虛擬資產清算業務狀態
  /billing/va/trigger:
    post:
      operationId: billing_va_trigger
      summary: 觸發虛擬資產清算
      tags:
        - 虛擬資產管理
      x-permission-key:
        - lb_hk_clearing.billing_va_contracts
      x-lbonly: false
      description: |-
        觸發虛擬資產清算。

        ### 請求參數

        - 必填：`biz_date`（業務日期）
        - 各字段的格式、取值範圍和業務含義見對應字段說明。

        ### 處理結果

        成功時完成上述業務操作；後續狀態和返回數據以 `200` 響應定義為準。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - biz_date
              properties:
                biz_date:
                  type: string
                  description: 業務日期. 本次請求對應的業務日期。請按接口約定的日期格式提交。此字段為必填項。
            example:
              biz_date: 2026-07-10
      responses:
        '200':
          description: 請求處理成功。響應的 `data` 不包含額外業務字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。

                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`
                      判斷具體結果。

                      - `401`：未登錄。
                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登錄或登錄狀態已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 當前賬號未獲得該功能授權。請在 User Permission 中為該賬號開通相應權限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 請求處理超時。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
      x-mint:
        href: /zh-HK/api-reference/billing_va_trigger
        metadata:
          sidebarTitle: 觸發虛擬資產清算
  /billing/va/pass_trade_match:
    post:
      operationId: va_pass_trade_match
      summary: 交易匹配審核
      tags:
        - 虛擬資產管理
      x-permission-key:
        - lb_hk_clearing.billing_va_contracts
      x-lbonly: false
      description: 對指定業務日期的虛擬資產成交配對進行人工審核通過（交易匹配審核）。寫操作。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - biz_date
              properties:
                biz_date:
                  type: integer
                  description: 業務日期. 清算業務日期，整型（`YYYYMMDD`）。
            example:
              biz_date: 20260101
      responses:
        '200':
          description: 未實調，響應字段以真實接口為準。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: 0 表示成功；非 0 為業務錯誤碼，此時 data 通常為空。HTTP 狀態碼本身恆為 200，請勿依賴 HTTP status 判斷成功/失敗。
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
      x-mint:
        href: /zh-HK/api-reference/va_pass_trade_match
        metadata:
          sidebarTitle: 交易匹配審核
