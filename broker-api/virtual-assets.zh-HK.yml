                        - `3` - 表示待收費
                        - `4` - 表示待交收
                        - `5` - 表示交收完成
                        - `6` - 表示券已交收
                        - `1` - 表示初始化
                        - `-1` - 表示--
                      enum:
                        - '2'
                        - '3'
                        - '4'
                        - '5'
                        - '6'
                        - '1'
                        - '-1'
                    currency:
                      type: string
                      description: |-
                        幣種. 用於按「幣種」篩選結果。

