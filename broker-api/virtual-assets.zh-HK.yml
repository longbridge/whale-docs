                  properties:
                    'no':
                      type: string
                      description: 合約號. 用於按「合約號」篩選結果。
                    aaid:
                      type: string
                      description: 客戶. 用於按「客戶」篩選結果。
                    contract.trade_date:
                      type: object
                      description: 交易日期. 用於按「交易日期」篩選結果。
                      properties:
                        gte:
                          type: string
                          description: 大於等於. 篩選範圍的下限，匹配值包含該值。
                          format: date
                        lte:
                          type: string
                          description: 小於等於. 篩選範圍的上限，匹配值包含該值。
