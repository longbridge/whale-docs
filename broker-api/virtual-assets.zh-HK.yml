      operationId: va_coin_deposit_records
      summary: 入幣記錄
      tags:
        - 虛擬資產管理
      x-permission-key:
        - atm.va_coin_deposit_records_inquiry
      x-lbonly: false
      description: |-
        查詢「入幣記錄」數據，可通過 `filters` 組合業務篩選條件，並使用 `page`、`page_size` 和 `orderBy` 控制分頁與排序。

        ### 返回結果

        成功時返回匹配的記錄列表及分頁信息。各過濾字段的用途、可選值和動態數據來源見對應字段說明。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 過濾條件. 組合業務過濾條件。省略某個過濾字段時，不按該字段篩選。
                  properties:
                    id:
                      type: string
                      description: 編號. 用於按「編號」篩選結果。
                    order_no:
                      type: string
                      description: 加款單號. 用於按「加款單號」篩選結果。
                    member_id:
                      type: string
                      description: 客戶編號. 用於按「客戶編號」篩選結果。
                    module_member_id:
                      type: string
                      description: 客戶編號. 用於按「客戶編號」篩選結果。
                    account_no:
                      type: string
                      description: 證券賬號. 用於按「證券賬號」篩選結果。
                    coin:
                      type: string
                      description: 貨幣代碼. 用於按「貨幣代碼」篩選結果。
                    status:
                      type: string
                      description: |-
                        狀態. 用於按「狀態」篩選結果。

                        支持多選；提交時使用英文逗號（`,`）拼接多個值。不傳時不按此字段篩選。

                        **可選值：**
                        - `pending_auth` - 表示錢包地址認證中
                        - `processing` - 表示處理中
                        - `success` - 表示成功
                        - `failed` - 表示失敗
                        - `canceling` - 表示撤銷中
                        - `cancelled` - 表示撤銷成功
                        - `cancel_failed` - 表示撤銷失敗
                        - `refunding` - 表示退款中
                        - `refunded` - 表示退款成功
                        - `refund_failed` - 表示退款失敗
                      example: pending_auth,processing
                      enum:
                        - pending_auth
                        - processing
                        - success
                        - failed
                        - canceling
                        - cancelled
                        - cancel_failed
                        - refunding
                        - refunded
                        - refund_failed
                    created_at:
                      type: object
                      description: 創建時間. 用於按「創建時間」篩選結果。
                      properties:
                        gte:
                          type: string
                          description: 大於等於. 篩選範圍的下限，匹配值包含該值。
                          format: date
                        lte:
                          type: string
                          description: 小於等於. 篩選範圍的上限，匹配值包含該值。
                          format: date
                    client_wallet_address:
                      type: string
                      description: 客戶錢包地址. 用於按「客戶錢包地址」篩選結果。
                page:
                  type: integer
                  description: 頁碼. 要查詢的頁碼，從 `1` 開始。
                page_size:
                  type: integer
                  description: 每頁數量. 每頁返回的記錄數量。
                orderBy:
                  type: array
                  description: 排序參數. 排序規則數組；每一項定義一個排序字段及排序方向。
                  items:
                    type: object
            example:
              filters: {}
              page: 1
              page_size: 20
              orderBy: []
      responses:
        '200':
          description: 成功時分頁返回「入幣記錄」記錄，以及頁碼、每頁數量和總記錄數等分頁信息。
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。

                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`
                      判斷具體結果。

                      - `401`：未登錄。
                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。
                  message:
                    type: string
                  data:
                    type: object
                    required:
                      - list
                      - total
                    properties:
                      list:
                        type: array
                        description: 列表. **返回值：** 列表列表。
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: 編號. **返回值：** 當前記錄的唯一標識。
                            order_no:
                              type: string
                              description: 加款單號. **返回值：** 加款單號。
                            account_no:
                              type: string
                              description: 證券賬號. **返回值：** 證券賬號。
                            member_id:
                              type: string
                              description: 客戶編號. **返回值：** 客戶編號。
                            client_name:
                              type: string
                              description: 客戶姓名. **返回值：** 客戶姓名。
                            channel_wallet_id:
                              type: string
                              description: 存管賬戶. **返回值：** 存管賬戶。
                            client_wallet_address:
                              type: string
                              description: 客戶錢包地址. **返回值：** 客戶錢包地址。
                            coin:
                              type: string
                              description: 貨幣代碼. **返回值：** 貨幣代碼。
                            chain_type:
                              type: string
                              description: 鏈類型. **返回值：** 鏈類型。
                            pricing_currency:
                              type: string
                              description: 計價貨幣. **返回值：** 計價貨幣。
                            quantity:
                              type: string
                              description: 數量. **返回值：** 數量。
                            deposit_to_address:
                              type: string
                              description: 充值地址. **返回值：** 充值地址。
                            status:
                              type: string
                              description: 狀態. **返回值：** 狀態。
                            status_val:
                              type: string
                              description: 狀態（原始值）. 字段 status 的原始值：status 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            upstream_broker:
                              type: string
                              description: 渠道. **返回值：** 渠道。
                            channel_status_text:
                              type: string
                              description: 渠道返回信息 - 狀態. **返回值：** 渠道返回信息 - 狀態。
                            channel_failure_reason:
                              type: string
                              description: 渠道返回信息 - 失敗原因. **返回值：** 渠道返回信息 - 失敗原因。
                            channel_refund_order_id:
                              type: string
                              description: 渠道返回信息 - 退款單號. **返回值：** 渠道返回信息 - 退款單號。
                            custom_channel_info:
                              type: string
                              description: 渠道返回信息. **返回值：** 渠道返回信息。
                            chain_transaction_id:
                              type: string
                              description: 流水號 - 區塊鏈唯一識別號. **返回值：** 流水號 - 區塊鏈唯一識別號。
                            channel_message_id:
                              type: string
                              description: 流水號 - 消息唯一識別號. **返回值：** 流水號 - 消息唯一識別號。
                            channel_deposit_order_id:
                              type: string
                              description: 流水號 - 轉賬流水號. **返回值：** 流水號 - 轉賬流水號。
                            custom_serial_no:
                              type: string
                              description: 流水號. **返回值：** 流水號。
                            created_at:
                              type: string
                              description: 時間 - 創建時間. **返回值：** 時間 - 創建時間；時間或日期格式以接口實際返回值為準。
                            channel_created_time_formatted:
                              type: string
                              description: 時間 - 轉賬發起時間. **返回值：** 時間 - 轉賬發起時間。
                            channel_credited_time_formatted:
                              type: string
                              description: 時間 - 渠道入賬時間. **返回值：** 時間 - 渠道入賬時間。
                            channel_modify_time:
                              type: string
                              description: 時間 - 轉賬修改時間. **返回值：** 時間 - 轉賬修改時間；時間或日期格式以接口實際返回值為準。
                            updated_at:
                              type: string
                              description: 時間 - 更新時間. **返回值：** 時間 - 更新時間；時間或日期格式以接口實際返回值為準。
                            custom_time:
                              type: string
                              description: 時間. **返回值：** 時間；時間或日期格式以接口實際返回值為準。
                      total:
                        type: integer
                        description: 總條數. **返回值：** 符合查詢條件的記錄總數，用於計算分頁。
              example:
                code: 0
                message: success
                data:
                  list:
                    - id: '2853'
                      order_no: DP17841361836072752628611527561
                      account_no: H00000000
                      member_id: '1000000000000000000'
                      client_name: 示例用户
                      channel_wallet_id: '1990756460896751873'
                      client_wallet_address: 示例地址 Example Address
                      coin: SOL
                      chain_type: Solana
                      pricing_currency: USD
                      quantity: '1.00000000'
                      deposit_to_address: 示例地址 Example Address
                      status: Success
                      status_val: success
                      upstream_broker: HASHKEY
                      channel_status_text: ''
                      channel_failure_reason: ''
                      channel_refund_order_id: ''
                      custom_channel_info: ''
                      chain_transaction_id: 832eaa86f3d4bb770e3a5bb72407de9582732f86afb087cb72e2d669396c1309
                      channel_message_id: ''
                      channel_deposit_order_id: D680885207578329660
                      custom_serial_no: |-
                        Block Chain Hash: 832eaa86f3d4bb770e3a5bb72407de9582732f86afb087cb72e2d669396c1309
                        Transfer ID: D680885207578329660
                      created_at: '2026-07-16 01:23:03'
                      channel_created_time_formatted: '2026-07-16 01:21:10'
                      channel_credited_time_formatted: '2026-07-16 01:21:11'
                      channel_modify_time: ''
                      updated_at: '2026-07-16 01:24:03'
                      custom_time: |-
