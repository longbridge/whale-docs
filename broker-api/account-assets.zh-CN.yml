        href: /zh-CN/api-reference/query_account_balances_summary
        metadata:
          sidebarTitle: 总资产及账面总现金
  /v1/portfolio/query_equity_holding_summary:
    post:
      operationId: query_equity_holding_summary
      summary: 资产总览持仓
      tags:
        - 资产账户
      x-permission-key:
        - asset.summary_query
      x-lbonly: false
      description: |-
        资产总览持仓。

        ### 请求参数

        - 必填：`equity_type`（资产类型）
        - 可选：`client_types`（客户类型）、`account_types`（账户类型）、`broker_codes`（经纪人）、`page`（页码）、`page_size`（每页数量）
        - 各字段的格式、取值范围和业务含义见对应字段说明。

        ### 处理结果

        成功时完成上述业务操作；后续状态和返回数据以 `200` 响应定义为准。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - equity_type
              properties:
                client_types:
                  type: string
                  description: |-
                    客户类型。

                    - 多值使用英文逗号 `,` 拼接
                    - 不传时查询全部
                    - 示例：`1,2`

                    **可选值：**
                    - `1` - 表示个人客户
                    - `2` - 表示企业客户
                    - `3` - 表示联名客户
                  example: 1,2
                  enum:
                    - "1"
                    - "2"
                    - "3"
                account_types:
                  type: string
                  description: |-
                    账户类型。

                    - 多值使用英文逗号 `,` 拼接
                    - 不传时查询全部
                    - 示例：`M,C`

                    > 注意：账户类型与 `equity_type` 的非法组合（如期货账户 `F` 与基金 `FUND` ）会返回 `400`。

                    **可选值：**
                    - `M` - 表示融资账户
                    - `C` - 表示现金账户
                    - `F` - 表示期货账户
                  example: M,C
                  enum:
                    - M
                    - C
                    - F
                broker_codes:
                  type: string
                  description: |-
                    经纪人. 按经纪人（AE）代码过滤。

                    - 多值使用英文逗号 `,` 拼接
                    - 不传时查询全部
                    - `=` 表示未分配经纪人
                    - 示例：`=,LBtestwbwhale123`

                    完整的 AE 代码列表可通过 `GET /v1/datasets/refs/broker_accounts` 查询，具体取值随租户和环境变化。

                    **当前文档列出的取值：**
                    - `=` - 表示未分配
                  enum:
                    - =
                equity_type:
                  type: string
                  description: |-
                    资产类型. 持仓汇总的资产类型筛选条件，仅支持单值。

                    取值来自 `equity_holding_summary_equity_type` 动态枚举，非固定值。

                    请调用 `GET /v1/datasets/refs/equity_holding_summary_equity_type` 获取当前可用的数据字典，并使用返回项的 `key` 作为本字段值。

                    **当前文档列出的取值：**
                    - `STOCK` - 表示股票
                    - `OPTION` - 表示期权
                    - `FUND` - 表示基金
                    - `BOND` - 表示债券
                    - `MMF` - 表示余额通
                    - `OTC` - 表示其他
                    - `CRYPTO` - 表示加密货币
                    - `WM` - 表示场外衍生品
                  enum:
                    - STOCK
                    - OPTION
                    - FUND
                    - BOND
                    - MMF
                    - OTC
                    - CRYPTO
                    - WM
                page:
                  type: number
                  description: 页码. 要查询的页码，从 `1` 开始。
                page_size:
                  type: number
                  description: 每页数量. 每页返回的最大记录数，应为正整数。
            example:
              client_types: 2,1
              account_types: M,C
              broker_codes: =,LBtestwbwhale123
              page: 1
              page_size: 20
              equity_type: STOCK
      responses:
        "200":
          description: 请求处理成功。业务结果位于 `data`，包含 `total_holdings`、`page`、`page_size`、`total_page`、`total` 字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。

                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`
                      判断具体结果。

                      - `401`：未登录。
                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      total_holdings:
                        type: array
                        description: 持仓列表. **返回值：** 持仓列表列表。
                        items:
                          type: object
                          properties:
                            counter_id:
                              type: string
                              description: 证券代码. **返回值：** 证券代码。
                            equity_type:
                              type: string
                              description: 资产类型. 同请求 equity_type，取值见 equity_holding_summary_equity_type
                            counter_name:
                              type: string
                              description: 证券名称. 本地化名称，随 Accept-Language 返回
                            total_quantity:
                              type: string
                              description: 持仓数量. **返回值：** 持仓数量。
                            last_done:
                              type: string
                              description: 收盘价. **返回值：** 收盘价。
                            market_value:
                              type: string
                              description: 持仓总市值. **返回值：** 持仓总市值。
                            settled:
                              type: string
                              description: 已结算. **返回值：** 已结算。
                            unsettle:
                              type: string
                              description: 待结算. **返回值：** 待结算。
                            trade_0:
                              type: string
                              description: T+0 待交收数量. **返回值：** T+0 待交收数量。
                            trade_1:
                              type: string
                              description: T+1 待交收数量. **返回值：** T+1 待交收数量。
                            trade_2:
                              type: string
                              description: T+2 待交收数量. **返回值：** T+2 待交收数量。
                            trade_n:
                              type: string
                              description: T+N 待交收数量. **返回值：** T+N 待交收数量。
                            symbol:
                              type: string
                              description: 标的代码，部分持仓为空
                      page:
                        type: number
                        description: 当前页码. **返回值：** 当前页码。
                      page_size:
                        type: number
                        description: 每页数量. **返回值：** 当前响应每页的记录数。
                      total_page:
                        type: number
                        description: 总页数. **返回值：** 查询结果的总页数。
                      total:
                        type: number
                        description: 总条数. **返回值：** 符合查询条件的记录总数，用于计算分页。
              example:
                code: 0
                message: success
                data:
                  total_holdings:
                    - counter_id: string
                      equity_type: string
                      counter_name: string
                      total_quantity: string
                      last_done: string
                      market_value: string
                      settled: string
                      unsettle: string
                      trade_0: string
                      trade_1: string
                      trade_2: string
                      trade_n: string
                      symbol: string
                  page: 0
                  page_size: 0
                  total_page: 0
                  total: 0
        "400":
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
