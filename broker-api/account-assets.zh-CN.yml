        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 过滤条件. 组合业务过滤条件。省略某个过滤字段时，不按该字段筛选。
                  properties:
                    aaid:
                      type: string
                      description: 客户. 用于按「客户」筛选结果。
                    direction:
                      type: string
                      description: |-
                        调账类型. 用于按「调账类型」筛选结果。

                        **可选值：**
                        - `DEBIT` - 表示出账
                        - `CREDIT` - 表示入账
                      enum:
                        - DEBIT
                        - CREDIT
                    ticket_status:
                      type: string
                      description: |-
                        状态. 用于按「状态」筛选结果。

                        **可选值：**
                        - `WAIT` - 表示待提交审批
                        - `WAIT_APPROVE` - 表示审批中
                        - `REJECTED` - 表示拒绝
                        - `CLOSE` - 表示关闭
                        - `REVOKING` - 表示撤销审批中
                        - `REVOKED` - 表示已撤销
                        - `SUCCESS` - 表示调账成功
                        - `FAILED` - 表示调账失败
                        - `PROCESS` - 表示调账处理中
                      enum:
                        - WAIT
                        - WAIT_APPROVE
                        - REJECTED
                        - CLOSE
                        - REVOKING
                        - REVOKED
                        - SUCCESS
                        - FAILED
                        - PROCESS
                    request_id:
                      type: string
                      description: 批次号. 用于按「批次号」筛选结果。
                    counter_id:
                      type: string
                      description: 股票. 用于按「股票」筛选结果。
                    finish_at:
                      type: object
                      description: 完成时间. 用于按「完成时间」筛选结果。
                      properties:
                        gte:
                          type: string
                          format: date
                          description: 大于等于. 筛选范围的下限，匹配值包含该值。
                        lte:
                          type: string
                          format: date
                          description: 小于等于. 筛选范围的上限，匹配值包含该值。
                page:
                  type: integer
                  description: 页码. 要查询的页码，从 `1` 开始。
                page_size:
                  type: integer
                  description: 每页数量. 每页返回的记录数量。
            example:
              filters: {}
              page: 1
              page_size: 20
