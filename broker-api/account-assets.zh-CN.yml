openapi: 3.1.1
info:
  title: Longport Whale 券商 API
  description: 面向使用 Longport Whale 的券商提供机构级服务端 API。
  version: 2.0.0
servers:
  - url: https://b-api.longbridge.xyz
    description: 测试环境
  - url: https://b-api.lbkrs.com
    description: 生产环境
security:
  - bearerAuth: []
tags:
  - name: 资产账户
  - name: 款项管理
  - name: 证券管理
  - name: 新股认购
  - name: 基金管理
  - name: 虚拟资产管理
  - name: 清算管理
  - name: 公司行动
  - name: 风控管理
  - name: 报表管理
  - name: 经纪人管理
  - name: 会计中台
  - name: 交易面板
  - name: 公告管理
  - name: 业务参数设置
  - name: 可疑事件监控
  - name: 活动
  - name: 奖励中心
  - name: 其他
paths:
  /v1/whaleapi/asset/detail_info:
    post:
      operationId: esop_get_account_asset_info
      summary: 账户资产查询
      tags:
        - 资产账户
      x-permission-key:
        - admin.general_whale_api
      x-lbonly: false
      x-source: WhaleAPI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                account_no:
                  type: string
                  description: 账户。账户
                currency:
                  type: string
                  description: 币种：HKD、USD。币种：HKD、USD
              required:
                - account_no
                - currency
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。

                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`
                      判断具体结果。

                      - `401`：未登录。
                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。选项: `0` = 成功
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      total_asset:
                        type: string
                        description: 总资产,不包含基金、债券、otc以及在途资金。总资产,不包含基金、债券、otc以及在途资金
                      total_cash:
                        type: string
                        description: 总现金,不包含余额通。总现金,不包含余额通
                      total_mv:
                        type: string
                        description: 总持仓市值,[股票、期权、数字货币市值]。总持仓市值,[股票、期权、数字货币市值]
                      mv_list:
                        type: array
                        items:
                          type: object
                          properties:
                            currency:
                              type: string
                              description: 币种。币种
                            mv:
                              type: string
                              description: 市值。市值
                            market:
                              type: string
                              description: 市场。市场
                          required:
                            - currency
                            - mv
                            - market
                        description: 市值列表。市值列表
                      margin_info:
                        type: object
                        properties:
                          im:
                            type: string
                            description: 初始保证金。初始保证金
                          mm:
                            type: string
                            description: 维持保证金。维持保证金
                          fm:
                            type: string
                            description: 强平保证金。强平保证金
                          mcm:
                            type: string
                            description: margincall保证金。margincall保证金
                        required:
                          - im
                          - mcm
                          - fm
                          - mm
                        description: 保证金。保证金
                    required:
                      - total_asset
                      - total_cash
                      - total_mv
                      - mv_list
                      - margin_info
                    description: 返回数据
              example:
                code: 0
                message: success
                data:
                  total_asset: string
                  total_cash: string
                  total_mv: string
                  mv_list:
                    - currency: string
                      mv: string
                      market: string
                  margin_info:
                    im: string
                    mm: string
                    fm: string
                    mcm: string
          description: 字段来自 Whale OpenAPI 已发布规范（whale-openapi/Whale-openapi.json）中该接口的真实 responses 定义
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
          description: 未登录或登录状态已失效
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
          description: 当前账号未获得该功能授权。请在 User Permission 中为该账号开通相应权限
        "408":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
          description: 请求处理超时。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`
      description: 该接口用于查询指定证券账号的总资产概况。通过传入账号 account_no 及币种 currency，返回账户的总资产 total_asset、总现金 total_cash 及各市场、各币种下的持仓市值列表 mv_list。需注意总资产不包含基金、债券、OTC 及在途资金
      x-mint:
        href: /zh-CN/api-reference/esop_get_account_asset_info
        metadata:
          sidebarTitle: 账户资产查询
  /v1/whaleapi/asset/cash_info:
    get:
      operationId: esop_get_account_cash_info
      summary: 账户现金查询
      tags:
        - 资产账户
      x-permission-key:
        - admin.general_whale_api
      x-lbonly: false
      x-source: WhaleAPI
      parameters:
        - name: account_no
          in: query
          required: true
          schema:
            type: string
          description: 证券账号
        - name: currency
          in: query
          required: false
          schema:
            type: string
          description: 货币
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。

                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`
                      判断具体结果。

                      - `401`：未登录。
                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。选项: `0` = 成功
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      total_cash:
                        type: string
                        description: 总现金,不包含余额通。总现金,不包含余额通
                      total_available_cash:
                        type: string
                        description: 总可用现金,包含余额通。总可用现金,包含余额通
                      total_withdraw_cash:
                        type: string
                        description: 总可提现金,包含余额通。总可提现金,包含余额通
                      cash_list:
                        type: array
                        items:
                          type: object
                          properties:
                            currency:
                              type: string
                              description: 币种。币种
                            cash_amount:
                              type: string
                              description: 现金总额。现金总额
                            available_amount:
                              type: string
                              description: 可用总额。可用总额
                            withdraw_amount:
                              type: string
                              description: 可提总额。可提总额
                          required:
                            - currency
                            - cash_amount
                            - available_amount
                            - withdraw_amount
                        description: 现金列表。现金列表
                    required:
                      - total_cash
                      - total_available_cash
                      - total_withdraw_cash
                      - cash_list
              example:
                code: 0
                message: success
                data:
                  total_cash: "140131.0000"
                  total_available_cash: "140036.0000"
                  total_withdraw_cash: "140036.0000"
                  cash_list:
                    - currency: USD
                      cash_amount: "10000.0000"
                      available_amount: "10000.0000"
                      withdraw_amount: "10000"
          description: 字段来自 Whale OpenAPI 已发布规范（whale-openapi/Whale-openapi.json）中该接口的真实 responses 定义
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
          description: 未登录或登录状态已失效
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
          description: 当前账号未获得该功能授权。请在 User Permission 中为该账号开通相应权限
        "408":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
          description: 请求处理超时。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`
      description: 该接口用于查询指定证券账号的现金余额信息。通过传入证券账号 account_no，可选传入币种 currency 进行筛选，返回账户的总现金 total_cash、总可用现金 total_available_cash、总可提现金 total_withdraw_cash，以及各币种下的现金明细列表 cash_list。与全量现金查询接口不同，该接口支持按币种过滤
      x-mint:
        href: /zh-CN/api-reference/esop_get_account_cash_info
        metadata:
          sidebarTitle: 账户现金查询
  /v1/whaleapi/asset/stock_info:
    get:
      operationId: esop_get_account_stock_info
      summary: 账户持仓查询
      tags:
        - 资产账户
      x-permission-key:
        - admin.general_whale_api
      x-lbonly: false
      x-source: WhaleAPI
      parameters:
        - name: account_no
          in: query
          required: true
          schema:
            type: string
          description: 账户信息
        - name: currency
          in: query
          required: false
          schema:
            type: string
          description: 币种
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。

                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`
                      判断具体结果。

                      - `401`：未登录。
                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。选项: `0` = 成功
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      stock_list:
                        type: array
                        items:
                          type: object
                          properties:
                            symbol:
                              type: string
                              description: 证券标的。证券标的
                            market:
                              type: string
                              description: 市场。市场
                            currency:
                              type: string
                              description: 币种。币种
                            total_quantity:
                              type: string
                              description: 仓位数量。仓位数量
                            available_quantity:
                              type: string
                              description: 仓位可用数量。仓位可用数量
                            last_done:
                              type: string
                              description: 最新价格。最新价格
                            pre_close:
                              type: string
                              description: 昨日收盘价格。昨日收盘价格
                            average_cost_price:
                              type: string
                              description: 买入成本。买入成本
                            diluted_cost_cost:
                              type: string
                              description: 摊薄成本。摊薄成本
                            init_quantity:
                              type: string
                              description: 开盘前初始持仓。开盘前初始持仓
                            pl_info:
                              type: object
                              properties:
                                currency:
                                  type: string
                                  description: 币种。币种
                                amount:
                                  type: string
                                  description: 金额。金额
                              description: t-1日资产盈亏 对象为map,key为currency,value为金额。t-1日资产盈亏 对象为map,key为currency,value为金额
                            buy_amount:
                              type: string
                              description: 当日买入总额。当日买入总额
                            sell_amount:
                              type: string
                              description: 当日卖出总额。当日卖出总额
                          required:
                            - symbol
                            - market
                            - currency
                            - total_quantity
                            - available_quantity
                            - last_done
                            - pre_close
                            - average_cost_price
                            - diluted_cost_cost
                            - init_quantity
                            - buy_amount
                            - sell_amount
                        description: 持仓列表[只包含多头股票]。持仓列表[只包含多头股票]
                    required:
                      - stock_list
              example:
                code: 0
                message: success
                data:
                  stock_list:
                    - symbol: TSLA.US
                      market: US
                      currency: USD
                      total_quantity: "3000"
                      available_quantity: "3000"
                      last_done: "202.040"
                      pre_close: "214.240"
                      average_cost_price: "0.300"
                      diluted_cost_cost: "0.300"
                      init_quantity: "13"
                      pl_info:
                        currency: string
                        amount: string
                      buy_amount: string
                      sell_amount: string
          description: 字段来自 Whale OpenAPI 已发布规范（whale-openapi/Whale-openapi.json）中该接口的真实 responses 定义
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
          description: 未登录或登录状态已失效
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
          description: 当前账号未获得该功能授权。请在 User Permission 中为该账号开通相应权限
        "408":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
          description: 请求处理超时。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`
      description: 该接口用于查询指定证券账号的当前股票持仓详情。通过传入证券账号 account_no，可选传入币种 currency 进行筛选，返回各持仓标的的数量、成本价、最新价、当日买卖金额等详细信息。需注意该接口仅返回多头股票持仓，不包含空头及其他资产类型
      x-mint:
        href: /zh-CN/api-reference/esop_get_account_stock_info
        metadata:
          sidebarTitle: 账户持仓查询
