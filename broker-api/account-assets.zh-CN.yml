  /v1/portfolio/query_account_balances_summary:
    get:
      operationId: query_account_balances_summary
      summary: 总资产及账面总现金
      tags:
        - 资产账户
      x-permission-key:
        - asset.summary_query
      x-lbonly: false
      description: |-
        查询总资产的类型与币种占比，以及账面总现金明细。资产类型标签会根据 `Accept-Language` 返回对应语言。

        请调用 `GET /v1/datasets/refs/equity_type_summary` 获取当前可用的资产类型字典。

        ### 请求参数

        - 可选：`client_types`（client_types）、`account_types`（account_types）、`broker_codes`（broker_codes）
        - 各字段的格式、取值范围、默认行为和业务含义见对应字段说明。

        ### 处理结果

        成功时返回查询结果，具体结构见 `200` 响应定义。
      security:
        - bearerAuth: []
      parameters:
        - name: client_types
          in: query
          required: false
          schema:
            type: string
          description: |-
            客户类型。

            - 多值使用英文逗号 `,` 拼接
            - 不传时查询全部
            - 示例：`1,2`
          example: 2,1
        - name: account_types
          in: query
          required: false
          schema:
            type: string
          description: |-
            账户类型。

            - 多值使用英文逗号 `,` 拼接
            - 不传时查询全部
            - 示例：`F,C`
          example: F,C
        - name: broker_codes
          in: query
          required: false
          schema:
            type: string
          description: |-
            按经纪人（AE）代码过滤。

            - 多值使用英文逗号 `,` 拼接
            - 不传时查询全部
            - `=` 表示未分配经纪人
            - 示例：`=,LBtestwbwhale123`

            完整的 AE 代码列表可通过 `GET /v1/datasets/refs/broker_accounts` 查询，具体取值随租户和环境变化。
          example: =,LBtestwbwhale123
      responses:
        "200":
          description: 请求处理成功。业务结果位于 `data`，包含 `total_assets`、`total_asset_type`、`total_asset_currency`、`total_balance` 字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。

                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`
                      判断具体结果。

                      - `401`：未登录。
                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      total_assets:
                        type: array
                        description: 总资产（各币种）. 各币种总资产，用于顶部总资产展示与币种切换
                        items:
                          type: object
                          properties:
                            currency:
                              type: string
                              description: 币种. 如 HKD/USD/CNY/SGD
                            amount:
                              type: string
                              description: 总资产金额. 该币种总资产金额（decimal 字符串）
                      total_asset_type:
                        type: array
                        description: 总资产按类型占比. 按资产类型的占比（总资产类型饼图）
                        items:
                          type: object
                          properties:
                            equity_type:
                              type: string
                              description: |-
                                资产类型的 `key`，例如 `CASH`、`US`、`HK`、`CN`、`OTHER` 或 `FUND`。

                                完整取值可通过 `GET /v1/datasets/refs/equity_type_summary` 动态获取。
                            name:
                              type: string
                              description: 资产类型名称. 资产类型的本地化展示名称，随 Accept-Language 返回（如 现金 / Cash）
                            ratio:
                              type: string
                              description: 占比，使用 decimal 字符串表示；取值乘以 `100` 后为百分比。
                      total_asset_currency:
                        type: array
                        description: 总资产按币种占比. 按币种的占比（总资产币种饼图）
                        items:
                          type: object
                          properties:
                            currency:
                              type: string
                              description: 币种. **返回值：** 币种。
                            ratio:
                              type: string
                              description: 占比. 使用 decimal 字符串表示，取值范围为 `0` 至 `1`；取值乘以 `100` 后为百分比。
                      total_balance:
                        type: array
                        description: 账面总现金明细（按币种，对应「账面总现金」表格）
                        items:
                          type: object
                          properties:
                            currency:
                              type: string
                              description: 币种. **返回值：** 币种。
                            book_balance:
                              type: string
                              description: 账面总现金. decimal 字符串
                            settled_amount:
                              type: string
                              description: 已结算. **返回值：** 已结算。
                            unsettle_amount:
                              type: string
                              description: 待结算. **返回值：** 待结算。
                            trade_0:
                              type: string
                              description: T+0 待交收金额. **返回值：** T+0 待交收金额。
                            trade_1:
                              type: string
                              description: T+1 待交收金额. **返回值：** T+1 待交收金额。
                            trade_2:
                              type: string
                              description: T+2 待交收金额. **返回值：** T+2 待交收金额。
                            trade_n:
                              type: string
                              description: T+N 待交收金额. **返回值：** T+N 待交收金额。
              example:
                code: 0
                message: success
                data:
                  total_assets:
                    - currency: string
                      amount: string
                  total_asset_type:
                    - equity_type: string
                      name: string
                      ratio: string
                  total_asset_currency:
                    - currency: string
                      ratio: string
                  total_balance:
                    - currency: string
                      book_balance: string
                      settled_amount: string
                      unsettle_amount: string
                      trade_0: string
                      trade_1: string
                      trade_2: string
                      trade_n: string
        "400":
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
        "401":
          description: 未登录或登录状态已失效。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
        "403":
          description: 当前账号未获得该功能授权。请在 User Permission 中为该账号开通相应权限。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
        "408":
          description: 请求处理超时。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
