                      - member_id
                      - real_name
                      - origin_id
                      - account_type
                      - biz_code
                      - biz_code_val
                      - counter_id
                      - statement_no
                      - report_direction
                      - report_direction_val
                      - quantity
                      - after_quantity
                      - updated_at
                      - multilingual_remark
