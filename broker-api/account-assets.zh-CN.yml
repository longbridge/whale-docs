                        type: string
                        description: 总现金,包含余额通。总现金,包含余额通
                      total_available_cash:
                        type: string
                        description: 总可用现金,包含余额通。总可用现金,包含余额通
                      total_withdraw_cash:
                        type: object
                        properties: {}
                        description: 总可提现金,包含余额通。总可提现金,包含余额通
                      total_settled_balance:
