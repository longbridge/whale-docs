        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 过滤条件. 组合业务过滤条件。省略某个过滤字段时，不按该字段筛选。
                  properties:
                    aaid:
                      type: string
                      description: 客户. 用于按「客户」筛选结果。
                    aaid_list:
                      type: string
                      description: 客户列表. 用于按「客户列表」筛选结果。
                    counter_id:
                      type: string
                      description: 股票代码. 用于按「股票代码」筛选结果。
                    account_type:
                      type: string
                      description: |-
                        账户类型. 用于按「账户类型」筛选结果。

                        **可选值：** `SETTLEMENT`、`BUSINESS`、`EXTERNAL`、`INTERNAL`
                      enum:
                        - SETTLEMENT
                        - BUSINESS
                        - EXTERNAL
                        - INTERNAL
                    updated_at:
                      type: object
                      description: 更新时间. 用于按「更新时间」筛选结果。
                      properties:
                        gte:
                          type: string
                          format: date
                          description: 大于等于. 筛选范围的下限，匹配值包含该值。
                        lte:
                          type: string
                          format: date
                          description: 小于等于. 筛选范围的上限，匹配值包含该值。
                    done_at:
                      type: object
                      description: 业务时间. 用于按「业务时间」筛选结果。
                      properties:
                        gte:
                          type: string
                          format: date-time
                          description: 大于等于. 筛选范围的下限，匹配值包含该值。
                        lte:
                          type: string
                          format: date-time
                          description: 小于等于. 筛选范围的上限，匹配值包含该值。
                    biz_code:
                      type: string
                      description: |-
                        业务码. 用于按「业务码」筛选结果。

                        候选值会动态变化。请调用 `GET /v1/datasets/refs/biz_code_to_name` 获取当前可用的数据字典，并使用返回项的 `key` 作为本参数值。
                    transfer_biz_name:
                      type: string
                      description: 业务码名称. 用于按「业务码名称」筛选结果。
                mode:
                  type: integer
                  default: 0
                  description: |-
                    导出模式. 不传时默认 0（同步）

                    **可选值：**
                    - `0` - 表示同步
                    - `1` - 表示异步
                  enum:
                    - 0
                    - 1
                ext:
                  type: string
                  description: |-
                    下载扩展名. 下载文件格式。不传时默认为 `csv`。

                    **可选值：**
                    - `csv` - 表示 CSV
                    - `xlsx` - 表示 Excel
                  enum:
                    - csv
                    - xlsx
                file_name:
                  type: string
                  description: 下载文件名称. 导出文件名称。不传时由服务端生成。
                down_fields:
                  type: array
                  description: 指定下载字段. 不传时导出全部字段；取值范围见 items.enum（同查询接口 data.list.items 的字段列表）
                  items:
                    type: string
                    enum:
                      - id
                      - id_val
                      - done_at
                      - member_id
                      - real_name
                      - origin_id
                      - account_type
                      - biz_code
                      - biz_code_val
                      - counter_id
                      - statement_no
                      - report_direction
                      - report_direction_val
                      - quantity
                      - last_business_quantity
                      - last_settlement_quantity
                      - total_quantity
                      - updated_at
                      - multilingual_remark
                ticket_content:
                  type: string
                  description: 工单备注. 模板配置了下载审核工单时，供审批人查看
                ticket_preview_url:
                  type: string
                  description: 工单审核界面详情 url. 导出审批详情地址；仅在导出需要审批时使用。
                hide:
                  type: integer
                  description: |-
                    是否隐藏下载记录. 是否在下载记录列表中隐藏本次导出记录。

                    **可选值：**
                    - `0` - 表示不隐藏
                    - `1` - 表示隐藏
                  enum:
                    - 0
                    - 1
            example:
              filters: {}
              mode: 0
              ext: csv
              file_name: ""
              down_fields: []
              ticket_content: ""
              ticket_preview_url: ""
              hide: 0
      responses:
        "200":
          description: 成功时返回「股票账户明细导出」任务信息。同步导出直接提供下载地址；异步导出提供用于后续查询的 `file_download_id`。
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。

                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`
                      判断具体结果。

                      - `401`：未登录。
                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      url:
                        type: string
                        description: "下载地址. 同步模式（`mode: 0`）下返回，异步模式下为空"
                      file_download_id:
                        type: string
                        description: |-
                          文件下载ID. 异步模式（`mode: 1`）下返回，即 `GET /v1/datasets/download/{id}` /
                          `DELETE /v1/datasets/download/{id}` 路径中的 id：GET 获取最终下载地址，DELETE 删除该导出记录。
                      ticket_id:
                        type: string
                        description: 工单 ID. **返回值：** 审批工单 ID。仅在本次操作触发审批流程时返回。
              example:
                code: 0
