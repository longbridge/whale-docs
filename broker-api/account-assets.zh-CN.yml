  /v1/datasets/account_cash_balances:
    get:
      operationId: account_cash_balances
      summary: 现金账户余额
      tags:
        - 资产账户
      x-permission-key:
        - account_balance.account
      x-lbonly: false
      description: |-
        查询「现金账户余额」数据，可通过 `filters` 组合业务筛选条件，并使用 `page` 和 `page_size` 控制分页。

        ### 返回结果

        成功时返回匹配的记录列表及分页信息。各过滤字段的用途、可选值和动态数据来源见对应字段说明。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 过滤条件. 组合业务过滤条件。省略某个过滤字段时，不按该字段筛选。
                  properties:
                    aaid:
                      type: string
                      description: 客户. 用于按「客户」筛选结果。
                    currency:
                      type: string
                      description: |-
                        币种. 用于按「币种」筛选结果。

                        候选值会动态变化。请调用 `GET /v1/datasets/refs/tenant_currencies_by_channel` 获取当前可用的数据字典，并使用返回项的 `key` 作为本参数值。
                    account_type:
                      type: string
                      description: |-
                        账户类型. 用于按「账户类型」筛选结果。

                        **可选值：** `SETTLEMENT`、`BUSINESS`、`EXTERNAL`、`INTERNAL`
                      enum:
                        - SETTLEMENT
                        - BUSINESS
                        - EXTERNAL
                        - INTERNAL
                    updated_at:
                      type: object
                      description: 更新时间. 用于按「更新时间」筛选结果。
                      properties:
                        gte:
                          type: string
                          format: date
                          description: 大于等于. 筛选范围的下限，匹配值包含该值。
                        lte:
                          type: string
                          format: date
                          description: 小于等于. 筛选范围的上限，匹配值包含该值。
                page:
                  type: integer
                  description: 页码. 要查询的页码，从 `1` 开始。
                page_size:
                  type: integer
                  description: 每页数量. 每页返回的记录数量。
            example:
              filters: {}
              page: 1
              page_size: 20
      responses:
        "200":
          description: 成功时分页返回「现金账户余额」记录，以及页码、每页数量和总记录数等分页信息。
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。

                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`
                      判断具体结果。

                      - `401`：未登录。
                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。
                  message:
                    type: string
                  data:
                    type: object
                    required:
                      - list
                      - total
                    properties:
                      list:
                        type: array
                        description: 列表. **返回值：** 列表列表。
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: 编号. **返回值：** 当前记录的唯一标识。
                            member_id:
                              type: string
                              description: 客户编号. **返回值：** 客户编号。
                            real_name:
                              type: string
                              description: 客户姓名. **返回值：** 客户姓名。
                            real_name_val:
                              type: string
                              description: 客户姓名（原始值）. 字段 real_name 的原始值：real_name 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            origin_id:
                              type: string
                              description: 证券账号. **返回值：** 证券账号。
                            account_type:
                              type: string
                              description: 账户类型. **返回值：** 账户类型。
                            currency:
                              type: string
                              description: 币种. **返回值：** 币种。
                            currency_val:
                              type: string
                              description: 币种（原始值）. 字段 currency 的原始值：currency 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            custom_unavailable_amount:
                              type: string
                              description: 冻结资金. **返回值：** 冻结资金。
                            book_balance:
                              type: string
                              description: 总余额. **返回值：** 总余额。
                            updated_at:
                              type: string
                              description: 更新时间. **返回值：** 更新时间；时间或日期格式以接口实际返回值为准。
                      total:
                        type: integer
                        description: 总条数. **返回值：** 符合查询条件的记录总数，用于计算分页。
              example:
                code: 0
                message: success
                data:
                  list:
                    - id: "7496263"
                      member_id: "1000000000000000000"
                      real_name: 示例用户
                      real_name_val: ""
                      origin_id: H00000000
                      account_type: SETTLEMENT
                      currency: CNH
                      currency_val: CNH
                      custom_unavailable_amount: ""
                      book_balance: 1,000,000,000.00
                      updated_at: "1784185026"
                  total: 0
