                      判断具体结果。

                      - `401`：未登录。
                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      ticket_id:
                        type: string
                        description: 审批工单号. **返回值：** 审批工单 ID。仅在本次操作触发审批流程时返回。
              example:
                code: 0
                message: success
                data:
                  ticket_id: string
        "400":
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
