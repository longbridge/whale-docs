      summary: 编辑业务码
      tags:
        - 资产账户
      x-lbonly: false
      description: |-
        编辑业务码。

        ### 请求参数

        - 必填：`biz_code`（业务码）
        - 可选：`visible`（是否可见）、`business_type`（业务类型）、`account_type`（账户类型）、`action_type`（动作类型）、`language`（多语言名称）、`remark`（备注）
        - 各字段的格式、取值范围和业务含义见对应字段说明。

        ### 处理结果

        成功时完成上述业务操作；后续状态和返回数据以 `200` 响应定义为准。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - biz_code
              properties:
                biz_code:
                  type: string
                  description: 业务码. 编辑时不可更改，用于定位记录
                visible:
                  type: boolean
                  description: |-
                    是否可见。

                    **布尔值：**
                    - `true` - 表示条件成立
                    - `false` - 表示条件不成立
                business_type:
                  type: string
                  description: 业务类型. 用于区分本次请求适用的业务场景。
                account_type:
                  type: string
                  description: 账户类型. 用于指定「账户类型」。
                action_type:
                  type: string
                  description: 动作类型. 用于指定「动作类型」。
                language:
                  type: string
                  description: 多语言名称. 用于指定「多语言名称」。
                remark:
                  type: string
                  description: 备注. 随本次操作保存的备注。
            example:
              biz_code: LCUSTOM001
              visible: true
              business_type: "1"
              account_type: "1"
              action_type: "1"
              language: '{"zh-CN":"自定义业务码","en":"Custom Biz Code"}'
              remark: ""
