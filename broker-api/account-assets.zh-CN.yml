                  properties:
                    aaid:
                      type: string
                      description: 客户. 用于按「客户」筛选结果。
                    counter_id:
                      type: string
                      description: 债券代码. 用于按「债券代码」筛选结果。
                    account_type:
                      type: string
                      description: |-
                        账户类型. 用于按「账户类型」筛选结果。

                        **可选值：** `SETTLEMENT`、`BUSINESS`、`EXTERNAL`、`INTERNAL`
                      enum:
                        - SETTLEMENT
                        - BUSINESS
                        - EXTERNAL
                        - INTERNAL
                    updated_at:
                      type: object
                      description: 更新时间. 用于按「更新时间」筛选结果。
                      properties:
                        gte:
                          type: string
                          format: date
                          description: 大于等于. 筛选范围的下限，匹配值包含该值。
                        lte:
                          type: string
                          format: date
                          description: 小于等于. 筛选范围的上限，匹配值包含该值。
                    done_at:
                      type: object
                      description: 业务时间. 用于按「业务时间」筛选结果。
