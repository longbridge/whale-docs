                      - nominee
                      - own
                      - transfer_quantity
                      - equity_type
                      - transfer_type
                      - transfer_type_val
                      - remark
                      - ticket_status
                      - ticket_status_val
                      - created_at
                      - updated_at
                      - comment
                      - ticket_id
                      - ticket_creator
                      - ticket_creator_val
                      - ticket_approved
                      - ticket_approved_val
                      - source_type
                      - source_type_val
                ticket_content:
                  type: string
                  description: 工单备注. 模板配置了下载审核工单时，供审批人查看
                ticket_preview_url:
                  type: string
                  description: 工单审核界面详情 url. 导出审批详情地址；仅在导出需要审批时使用。
                hide:
                  type: integer
                  description: |-
                    是否隐藏下载记录. 是否在下载记录列表中隐藏本次导出记录。

                    **可选值：**
                    - `0` - 表示不隐藏
                    - `1` - 表示隐藏
                  enum:
                    - 0
                    - 1
            example:
              filters: {}
              mode: 0
              ext: csv
              file_name: ""
              down_fields: []
              ticket_content: ""
              ticket_preview_url: ""
              hide: 0
      responses:
        "200":
          description: 成功时返回「账户间转仓查询导出」任务信息。同步导出直接提供下载地址；异步导出提供用于后续查询的 `file_download_id`。
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。

                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`
                      判断具体结果。

                      - `401`：未登录。
                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      url:
                        type: string
                        description: "下载地址. 同步模式（`mode: 0`）下返回，异步模式下为空"
                      file_download_id:
                        type: string
                        description: |-
                          文件下载ID. 异步模式（`mode: 1`）下返回，即 `GET /v1/datasets/download/{id}` /
                          `DELETE /v1/datasets/download/{id}` 路径中的 id：GET 获取最终下载地址，DELETE 删除该导出记录。
                      ticket_id:
                        type: string
                        description: 工单 ID. **返回值：** 审批工单 ID。仅在本次操作触发审批流程时返回。
              example:
                code: 0
                message: success
                data:
                  url: https://b-api.longbridge.xyz/download/export_result.csv
                  file_download_id: ""
                  ticket_id: ""
        "400":
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
        "401":
          description: 未登录或登录状态已失效。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
        "403":
          description: 当前账号未获得该功能授权。请在 User Permission 中为该账号开通相应权限。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
        "408":
          description: 请求处理超时。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
