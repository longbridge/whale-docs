          sidebarTitle: 账户现金详情查询【定制非通用】
  /v1/whaleapi/asset/all_cash:
    get:
      operationId: get_tenant_account_cash
      summary: 获取所有用户现金信息
      tags:
        - 资产账户
      x-permission-key:
        - admin.general_whale_api
      x-lbonly: false
      x-source: WhaleAPI
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
          description: 页码
        - name: size
          in: query
          required: false
          schema:
            type: integer
          description: 每页数量
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。

                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`
                      判断具体结果。

                      - `401`：未登录。
                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。选项: `0` = 成功
                  message:
                    type: string
                  data:
