  /v1/datasets/account_temporary_adjust_cash_list:
    get:
      operationId: account_temporary_adjust_cash_list
      summary: 后台临时调账列表
      tags:
        - 资产账户
      x-permission-key:
        - cash_temp_adjust_query.query
      x-lbonly: false
      description: |-
        查询「后台临时调账列表」数据，可通过 `filters` 组合业务筛选条件，并使用 `page` 和 `page_size` 控制分页。

        ### 返回结果

        成功时返回匹配的记录列表及分页信息。各过滤字段的用途、可选值和动态数据来源见对应字段说明。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 过滤条件. 组合业务过滤条件。省略某个过滤字段时，不按该字段筛选。
                  properties:
                    aaid:
                      type: string
                      description: 客户. 用于按「客户」筛选结果。
                    direction:
                      type: string
                      description: |-
                        调账类型. 用于按「调账类型」筛选结果。

                        **可选值：**
                        - `DEBIT` - 表示出账
                        - `CREDIT` - 表示入账
                      enum:
                        - DEBIT
                        - CREDIT
                    biz_code:
                      type: string
                      description: |-
                        业务类型. 用于按「业务类型」筛选结果。

                        **可选值：**
                        - `LCTPCR` - 表示现金临时调增 [LCTPCR]
                        - `LCTPDR` - 表示现金临时调减 [LCTPDR]
                      enum:
                        - LCTPCR
                        - LCTPDR
                    ticket_status:
                      type: string
                      description: |-
                        审核状态. 用于按「审核状态」筛选结果。

                        **可选值：**
                        - `WAIT_APPROVE` - 表示审批中
                        - `APPROVED` - 表示通过
                        - `REJECTED` - 表示拒绝
                        - `CLOSE` - 表示关闭
                        - `NONE` - 表示无需审批
                      enum:
                        - WAIT_APPROVE
                        - APPROVED
                        - REJECTED
                        - CLOSE
                        - NONE
                    status:
                      type: string
                      description: |-
                        状态. 用于按「状态」筛选结果。

                        **可选值：**
                        - `ADJUSTED` - 表示已调账
                        - `EXPIRED` - 表示已失效
                        - `FAILED` - 表示调账失败
                        - `EXPIRE_FAILED` - 表示失效失败
                      enum:
                        - ADJUSTED
                        - EXPIRED
                        - FAILED
                        - EXPIRE_FAILED
                page:
                  type: integer
                  description: 页码. 要查询的页码，从 `1` 开始。
                page_size:
                  type: integer
                  description: 每页数量. 每页返回的记录数量。
            example:
              filters: {}
              page: 1
              page_size: 20
