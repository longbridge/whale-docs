                            settled_balance:
                              type: string
                              description: 結算現金。結算現金
                            unsettled_balance:
                              type: string
                              description: 待結算現金。待結算現金
                          required:
                            - currency
                            - cash_amount
                            - available_amount
                            - withdraw_amount
                            - settled_balance
                            - unsettled_balance
                        description: 現金列表。現金列表
                    required:
                      - total_cash
                      - total_available_cash
                      - total_withdraw_cash
                      - total_settled_balance
                      - total_unsettled_balance
                      - max_finance
                      - available_finance
