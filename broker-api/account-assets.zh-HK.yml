                  total_settled_balance: string
                  total_unsettled_balance: string
                  max_finance: string
                  available_finance: string
                  cash_list:
                    - currency: USD
                      cash_amount: "10000.0000"
                      available_amount: "10000.0000"
                      withdraw_amount: "10000"
                      settled_balance: string
                      unsettled_balance: string
          description: 字段來自 Whale OpenAPI 已發佈規範（whale-openapi/Whale-openapi.json）中該接口的真實 responses 定義
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
          description: 未登錄或登錄狀態已失效
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
          description: 當前賬號未獲得該功能授權。請在 User Permission 中為該賬號開通相應權限
        "408":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
          description: 請求處理超時。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`
      description: 該接口用於查詢指定證券賬號的現金詳情信息，為定製化非通用接口。在標準現金查詢基礎上，額外返回已結算現金 settled_balance、待結算現金 unsettled_balance、最大融資額度 max_finance 及可用融資額度 available_finance 等擴展字段
      x-mint:
        href: /zh-HK/api-reference/esop_get_ob_account_cash_info
        metadata:
          sidebarTitle: 賬戶現金詳情查詢【定製非通用】
  /v1/whaleapi/asset/all_cash:
    get:
      operationId: get_tenant_account_cash
      summary: 獲取所有用戶現金信息
      tags:
        - 資產賬户
      x-permission-key:
        - account_balance.account
      x-lbonly: false
