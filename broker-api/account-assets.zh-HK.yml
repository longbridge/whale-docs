                    **可選值：**
                    - `csv` - 表示 CSV
                    - `xlsx` - 表示 Excel
                  enum:
                    - csv
                    - xlsx
                file_name:
                  type: string
                  description: 下載文件名稱. 導出文件名稱。不傳時由服務端生成。
                down_fields:
                  type: array
