  /v1/datasets/account_cash_balances:
    get:
      operationId: account_cash_balances
      summary: 現金賬戶餘額
      tags:
        - 資產賬户
      x-permission-key:
        - account_balance.account
      x-lbonly: false
      description: |-
        查詢「現金賬戶餘額」數據，可通過 `filters` 組合業務篩選條件，並使用 `page` 和 `page_size` 控制分頁。

        ### 返回結果

        成功時返回匹配的記錄列表及分頁信息。各過濾字段的用途、可選值和動態數據來源見對應字段說明。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 過濾條件. 組合業務過濾條件。省略某個過濾字段時，不按該字段篩選。
                  properties:
                    aaid:
                      type: string
                      description: 客戶. 用於按「客戶」篩選結果。
                    currency:
                      type: string
                      description: |-
                        幣種. 用於按「幣種」篩選結果。

                        候選值會動態變化。請調用 `GET /v1/datasets/refs/tenant_currencies_by_channel` 獲取當前可用的數據字典，並使用返回項的 `key` 作為本參數值。
                    account_type:
                      type: string
                      description: |-
                        賬戶類型. 用於按「賬戶類型」篩選結果。

                        **可選值：** `SETTLEMENT`、`BUSINESS`、`EXTERNAL`、`INTERNAL`
                      enum:
                        - SETTLEMENT
                        - BUSINESS
                        - EXTERNAL
                        - INTERNAL
                    updated_at:
                      type: object
                      description: 更新時間. 用於按「更新時間」篩選結果。
                      properties:
                        gte:
                          type: string
                          format: date
                          description: 大於等於. 篩選範圍的下限，匹配值包含該值。
                        lte:
                          type: string
                          format: date
                          description: 小於等於. 篩選範圍的上限，匹配值包含該值。
                page:
                  type: integer
                  description: 頁碼. 要查詢的頁碼，從 `1` 開始。
                page_size:
                  type: integer
                  description: 每頁數量. 每頁返回的記錄數量。
            example:
              filters: {}
              page: 1
              page_size: 20
      responses:
        "200":
          description: 成功時分頁返回「現金賬戶餘額」記錄，以及頁碼、每頁數量和總記錄數等分頁信息。
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。

                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`
                      判斷具體結果。

                      - `401`：未登錄。
                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。
                  message:
                    type: string
                  data:
                    type: object
                    required:
                      - list
                      - total
                    properties:
                      list:
                        type: array
                        description: "**返回值：** 列表列表。"
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: 編號. **返回值：** 當前記錄的唯一標識。
                            member_id:
                              type: string
                              description: 客戶編號. **返回值：** 客戶編號。
                            real_name:
                              type: string
                              description: 客戶姓名. **返回值：** 客戶姓名。
                            real_name_val:
                              type: string
                              description: 客戶姓名（原始值）. 字段 real_name 的原始值：real_name 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            origin_id:
                              type: string
                              description: 證券賬號. **返回值：** 證券賬號。
                            account_type:
                              type: string
                              description: 賬戶類型. **返回值：** 賬戶類型。
                            currency:
                              type: string
                              description: 幣種. **返回值：** 幣種。
                            currency_val:
                              type: string
                              description: 幣種（原始值）. 字段 currency 的原始值：currency 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            custom_unavailable_amount:
                              type: string
                              description: 凍結資金. **返回值：** 凍結資金。
                            book_balance:
                              type: string
                              description: 總餘額. **返回值：** 總餘額。
                            updated_at:
                              type: string
                              description: 更新時間. **返回值：** 更新時間；時間或日期格式以接口實際返回值為準。
                      total:
                        type: integer
                        description: 總條數. **返回值：** 符合查詢條件的記錄總數，用於計算分頁。
              example:
                code: 0
                message: success
                data:
                  list:
                    - id: "7496263"
                      member_id: "1000000000000000000"
                      real_name: 示例用户
                      real_name_val: ""
                      origin_id: H00000000
                      account_type: SETTLEMENT
                      currency: CNH
                      currency_val: CNH
                      custom_unavailable_amount: ""
                      book_balance: 1,000,000,000.00
                      updated_at: "1784185026"
                  total: 0
        "400":
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
        "401":
          description: 未登錄或登錄狀態已失效。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
        "403":
          description: 當前賬號未獲得該功能授權。請在 User Permission 中為該賬號開通相應權限。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
        "408":
          description: 請求處理超時。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
      x-dataset-download:
        method: POST
        path: /v1/datasets/account_cash_balances/download
        operationId: account_cash_balances_download
      x-mint:
        href: /zh-HK/api-reference/account_cash_balances
        metadata:
          sidebarTitle: 現金賬戶餘額
      x-post-fallback: true
