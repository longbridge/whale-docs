        - 不再需要導出記錄時，可調用 `DELETE /v1/datasets/download/{id}` 刪除。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 過濾條件. 組合業務過濾條件。省略某個過濾字段時，不按該字段篩選。
                  properties:
                    aaid:
                      type: string
                      description: 客戶. 用於按「客戶」篩選結果。
                    unfreeze_ticket_status:
                      type: string
                      description: |-
                        審核狀態. 用於按「審核狀態」篩選結果。

                        **可選值：**
                        - `WAIT` - 表示待提交審批
                        - `WAIT_APPROVE` - 表示審批中
                        - `APPROVED` - 表示通過
                        - `REJECTED` - 表示拒絕
                        - `CLOSE` - 表示關閉
                      enum:
                        - WAIT
                        - WAIT_APPROVE
                        - APPROVED
                        - REJECTED
                        - CLOSE
                    account_type:
                      type: string
                      description: |-
                        賬戶類型. 用於按「賬戶類型」篩選結果。

                        **可選值：** `SETTLEMENT`
                      enum:
                        - SETTLEMENT
                    status:
                      type: string
                      description: |-
                        凍結狀態. 用於按「凍結狀態」篩選結果。

