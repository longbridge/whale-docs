  /v1/datasets/account_temporary_adjust_cash_list:
    get:
      operationId: account_temporary_adjust_cash_list
      summary: 後台臨時調賬列表
      tags:
        - 資產賬户
      x-permission-key:
        - cash_temp_adjust_query.query
      x-lbonly: false
      description: |-
        查詢「後台臨時調賬列表」數據，可通過 `filters` 組合業務篩選條件，並使用 `page` 和 `page_size` 控制分頁。

        ### 返回結果

        成功時返回匹配的記錄列表及分頁信息。各過濾字段的用途、可選值和動態數據來源見對應字段說明。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 過濾條件. 組合業務過濾條件。省略某個過濾字段時，不按該字段篩選。
                  properties:
                    aaid:
                      type: string
                      description: 客戶. 用於按「客戶」篩選結果。
                    direction:
                      type: string
                      description: |-
                        調賬類型. 用於按「調賬類型」篩選結果。

                        **可選值：**
                        - `DEBIT` - 表示出賬
                        - `CREDIT` - 表示入賬
                      enum:
                        - DEBIT
                        - CREDIT
                    biz_code:
                      type: string
                      description: |-
                        業務類型. 用於按「業務類型」篩選結果。

                        **可選值：**
                        - `LCTPCR` - 表示現金臨時調增 [LCTPCR]
                        - `LCTPDR` - 表示現金臨時調減 [LCTPDR]
                      enum:
                        - LCTPCR
                        - LCTPDR
                    ticket_status:
                      type: string
                      description: |-
                        審核狀態. 用於按「審核狀態」篩選結果。

                        **可選值：**
                        - `WAIT_APPROVE` - 表示審批中
                        - `APPROVED` - 表示通過
                        - `REJECTED` - 表示拒絕
                        - `CLOSE` - 表示關閉
                        - `NONE` - 表示無需審批
                      enum:
                        - WAIT_APPROVE
                        - APPROVED
                        - REJECTED
                        - CLOSE
                        - NONE
                    status:
                      type: string
                      description: |-
                        狀態. 用於按「狀態」篩選結果。

                        **可選值：**
                        - `ADJUSTED` - 表示已調賬
                        - `EXPIRED` - 表示已失效
                        - `FAILED` - 表示調賬失敗
                        - `EXPIRE_FAILED` - 表示失效失敗
                      enum:
                        - ADJUSTED
                        - EXPIRED
                        - FAILED
                        - EXPIRE_FAILED
                page:
                  type: integer
                  description: 頁碼. 要查詢的頁碼，從 `1` 開始。
                page_size:
                  type: integer
                  description: 每頁數量. 每頁返回的記錄數量。
            example:
              filters: {}
              page: 1
              page_size: 20
