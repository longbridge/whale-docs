                  type: string
                  description: 工單備註. 模板配置了下載審核工單時，供審批人查看
                ticket_preview_url:
                  type: string
                  description: 工單審核界面詳情 url. 導出審批詳情地址；僅在導出需要審批時使用。
                hide:
                  type: integer
                  description: |-
                    是否隱藏下載記錄. 是否在下載記錄列表中隱藏本次導出記錄。

                    **可選值：**
                    - `0` - 表示不隐藏
                    - `1` - 表示隐藏
                  enum:
                    - 0
                    - 1
            example:
              filters: {}
              mode: 0
              ext: csv
              file_name: ""
              down_fields: []
              ticket_content: ""
              ticket_preview_url: ""
              hide: 0
      responses:
        "200":
          description: 成功時返回「手工調賬 - 期權導出」任務信息。同步導出直接提供下載地址；異步導出提供用於後續查詢的 `file_download_id`。
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。

                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`
                      判斷具體結果。

                      - `401`：未登錄。
                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      url:
                        type: string
                        description: "下載地址. 同步模式（`mode: 0`）下返回，異步模式下為空"
                      file_download_id:
                        type: string
