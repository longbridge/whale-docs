              filters: {}
              mode: 0
              ext: csv
              file_name: ""
              down_fields: []
              ticket_content: ""
              ticket_preview_url: ""
              hide: 0
      responses:
        "200":
          description: 成功時返回「OTC 其他賬戶明細導出」任務信息。同步導出直接提供下載地址；異步導出提供用於後續查詢的 `file_download_id`。
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。

                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`
                      判斷具體結果。

                      - `401`：未登錄。
                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      url:
                        type: string
                        description: "下載地址. 同步模式（`mode: 0`）下返回，異步模式下為空"
                      file_download_id:
                        type: string
                        description: |-
                          文件下載ID. 異步模式（`mode: 1`）下返回，即 `GET /v1/datasets/download/{id}` /
                          `DELETE /v1/datasets/download/{id}` 路徑中的 id：GET 獲取最終下載地址，DELETE 刪除該導出記錄。
                      ticket_id:
                        type: string
                        description: 工單 ID. **返回值：** 審批工單 ID。僅在本次操作觸發審批流程時返回。
              example:
                code: 0
                message: success
                data:
                  url: https://b-api.longbridge.xyz/download/export_result.csv
                  file_download_id: ""
                  ticket_id: ""
        "400":
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
        "401":
          description: 未登錄或登錄狀態已失效。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
        "403":
          description: 當前賬號未獲得該功能授權。請在 User Permission 中為該賬號開通相應權限。
          content:
            application/json:
              schema:
