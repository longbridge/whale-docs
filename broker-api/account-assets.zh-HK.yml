        成功時完成所述業務操作，具體返回內容見 `200` 響應定義。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
                - account_channel
                - biz_group
                - group_name
                - group_info
                - biz_code_list
                - op_user
              properties:
                id:
                  type: string
                  description: 分組記錄 ID，用於標識本次請求關聯的業務對象。此字段為必填項。
                account_channel:
                  type: string
                  description: 所屬渠道. 用於指定「所屬渠道」。此字段為必填項。
                biz_group:
                  type: string
                  description: 業務所屬. 用於指定「業務所屬」。此字段為必填項。
                group_name:
                  type: string
                  description: 分組名稱. 用於指定「分組名稱」。此字段為必填項。
                group_info:
                  type: string
                  description: 分組説明. 用於指定「分組説明」。此字段為必填項。
                biz_code_list:
                  type: array
                  description: 分組內業務碼列表，以 JSON 數組形式提交。此字段為必填項。
                  items:
                    type: string
                account_channel_list:
                  type: array
                  description: 同步渠道列表，以 JSON 數組形式提交。
                  items:
                    type: string
                op_user:
                  type: string
                  description: 發起本次操作的人員標識，用於審計追蹤。此字段為必填項。
            example:
              id: "123"
              account_channel: longport_test
              biz_group: "1"
              group_name: 示例分组
              group_info: 分组说明
              biz_code_list:
                - LCUSTOM001
                - LCUSTOM002
              account_channel_list:
