                      - custodian
                      - custodian_val
                      - sub_position_no_name
                      - sub_position_no_name_val
                      - street
                      - nominee
                      - own
                      - incurred_quantity
                      - cost_amount
                      - cost_currency
                      - position_side
                      - ticket_status
                      - ticket_status_val
                      - ticket_creator
                      - ticket_creator_val
                      - ticket_approved
                      - ticket_approved_val
                      - remark
                      - inner_remark
                      - result
                      - result_val
                      - created_at
                      - user_ledger_date
                      - third_flag
                      - third_flag_val
                      - finish_at
                      - ticket_id
                      - request_id
                      - revoke_request_id
                      - app_notify
                      - app_notify_val
                      - email_notify
                      - email_notify_val
