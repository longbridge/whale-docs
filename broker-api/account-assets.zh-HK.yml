        - 不再需要導出記錄時，可調用 `DELETE /v1/datasets/download/{id}` 刪除。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 過濾條件. 組合業務過濾條件。省略某個過濾字段時，不按該字段篩選。
                  properties:
                    aaid:
                      type: string
                      description: 客戶. 用於按「客戶」篩選結果。
                    currency:
                      type: string
                      description: |-
                        幣種. 用於按「幣種」篩選結果。

                        候選值會動態變化。請調用 `GET /v1/datasets/refs/tenant_currencies_by_channel` 獲取當前可用的數據字典，並使用返回項的 `key` 作為本參數值。
                    account_type:
                      type: string
                      description: |-
                        賬戶類型. 用於按「賬戶類型」篩選結果。

                        **可選值：** `SETTLEMENT`、`BUSINESS`、`EXTERNAL`、`INTERNAL`
                      enum:
                        - SETTLEMENT
                        - BUSINESS
                        - EXTERNAL
                        - INTERNAL
                    updated_at:
                      type: object
                      description: 更新時間. 用於按「更新時間」篩選結果。
                      properties:
                        gte:
                          type: string
                          format: date
                          description: 大於等於. 篩選範圍的下限，匹配值包含該值。
                        lte:
                          type: string
                          format: date
                          description: 小於等於. 篩選範圍的上限，匹配值包含該值。
                mode:
                  type: integer
                  default: 0
                  description: |-
                    導出模式. 不傳時默認 0（同步）

                    **可選值：**
                    - `0` - 表示同步
                    - `1` - 表示异步
                  enum:
                    - 0
                    - 1
                ext:
                  type: string
                  description: |-
                    下載擴展名. 下載文件格式。不傳時默認為 `csv`。

                    **可選值：**
                    - `csv` - 表示 CSV
                    - `xlsx` - 表示 Excel
                  enum:
                    - csv
                    - xlsx
