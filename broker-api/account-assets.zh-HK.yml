openapi: 3.1.1
info:
  title: Longport Whale 券商 API
  description: 面向使用 Longport Whale 的券商提供機構級服務端 API。
  version: 2.0.0
servers:
  - url: https://b-api.longbridge.xyz
    description: 測試環境
  - url: https://b-api.lbkrs.com
    description: 生產環境
security:
  - bearerAuth: []
tags:
  - name: 資產賬户
  - name: 款項管理
  - name: 證券管理
  - name: 新股認購
  - name: 基金管理
  - name: 虛擬資產管理
  - name: 清算管理
  - name: 公司行動
  - name: 風控管理
  - name: 報表管理
  - name: 經紀人管理
  - name: 會計中台
  - name: 交易面板
  - name: 公告管理
  - name: 業務參數設置
  - name: 可疑事件監控
  - name: 活動
  - name: 獎勵中心
  - name: 其他
paths:
  /v1/whaleapi/asset/detail_info:
    post:
      operationId: esop_get_account_asset_info
      summary: 賬戶資產查詢
      tags:
        - 資產賬户
      x-permission-key:
        - portfolio.asset
      x-lbonly: false
      x-source: WhaleAPI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                account_no:
                  type: string
                  description: 賬戶。賬戶
                currency:
                  type: string
                  description: 幣種：HKD、USD。幣種：HKD、USD
              required:
                - account_no
                - currency
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。

                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`
                      判斷具體結果。

                      - `401`：未登錄。
                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。選項: `0` = 成功
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      total_asset:
                        type: string
                        description: 總資產,不包含基金、債券、otc以及在途資金。總資產,不包含基金、債券、otc以及在途資金
                      total_cash:
                        type: string
                        description: 總現金,不包含餘額通。總現金,不包含餘額通
                      total_mv:
                        type: string
                        description: 總持倉市值,[股票、期權、數字貨幣市值]。總持倉市值,[股票、期權、數字貨幣市值]
                      mv_list:
                        type: array
                        items:
                          type: object
                          properties:
                            currency:
                              type: string
                              description: 幣種。幣種
                            mv:
                              type: string
                              description: 市值。市值
                            market:
                              type: string
                              description: 市場。市場
                          required:
                            - currency
                            - mv
                            - market
                        description: 市值列表。市值列表
                      margin_info:
                        type: object
                        properties:
                          im:
                            type: string
                            description: 初始保證金。初始保證金
                          mm:
                            type: string
                            description: 維持保證金。維持保證金
                          fm:
                            type: string
                            description: 強平保證金。強平保證金
                          mcm:
                            type: string
                            description: margincall保證金。margincall保證金
                        required:
                          - im
                          - mcm
                          - fm
                          - mm
                        description: 保證金。保證金
                    required:
                      - total_asset
                      - total_cash
                      - total_mv
                      - mv_list
                      - margin_info
                    description: 返回數據
              example:
                code: 0
                message: success
                data:
                  total_asset: string
                  total_cash: string
                  total_mv: string
                  mv_list:
                    - currency: string
                      mv: string
                      market: string
                  margin_info:
                    im: string
                    mm: string
                    fm: string
                    mcm: string
          description: 字段來自 Whale OpenAPI 已發佈規範（whale-openapi/Whale-openapi.json）中該接口的真實 responses 定義
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
          description: 未登錄或登錄狀態已失效
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
          description: 當前賬號未獲得該功能授權。請在 User Permission 中為該賬號開通相應權限
        "408":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
          description: 請求處理超時。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`
      description: 該接口用於查詢指定證券賬號的總資產概況。通過傳入賬號 account_no 及幣種 currency，返回賬戶的總資產 total_asset、總現金 total_cash 及各市場、各幣種下的持倉市值列表 mv_list。需注意總資產不包含基金、債券、OTC 及在途資金
      x-mint:
        href: /zh-HK/api-reference/esop_get_account_asset_info
        metadata:
          sidebarTitle: 賬戶資產查詢
  /v1/whaleapi/asset/cash_info:
    get:
      operationId: esop_get_account_cash_info
      summary: 賬戶現金查詢
      tags:
        - 資產賬户
      x-permission-key:
        - portfolio.asset
      x-lbonly: false
      x-source: WhaleAPI
      parameters:
        - name: account_no
          in: query
          required: true
          schema:
            type: string
          description: 證券賬號
        - name: currency
          in: query
          required: false
          schema:
            type: string
          description: 貨幣
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。

                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`
                      判斷具體結果。

                      - `401`：未登錄。
                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。選項: `0` = 成功
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      total_cash:
                        type: string
                        description: 總現金,不包含餘額通。總現金,不包含餘額通
                      total_available_cash:
                        type: string
                        description: 總可用現金,包含餘額通。總可用現金,包含餘額通
                      total_withdraw_cash:
                        type: string
                        description: 總可提現金,包含餘額通。總可提現金,包含餘額通
                      cash_list:
                        type: array
                        items:
                          type: object
                          properties:
                            currency:
                              type: string
                              description: 幣種。幣種
                            cash_amount:
                              type: string
                              description: 現金總額。現金總額
                            available_amount:
                              type: string
                              description: 可用總額。可用總額
                            withdraw_amount:
                              type: string
                              description: 可提總額。可提總額
                          required:
                            - currency
                            - cash_amount
                            - available_amount
                            - withdraw_amount
                        description: 現金列表。現金列表
                    required:
                      - total_cash
                      - total_available_cash
                      - total_withdraw_cash
                      - cash_list
              example:
                code: 0
                message: success
                data:
                  total_cash: "140131.0000"
                  total_available_cash: "140036.0000"
                  total_withdraw_cash: "140036.0000"
                  cash_list:
                    - currency: USD
                      cash_amount: "10000.0000"
                      available_amount: "10000.0000"
                      withdraw_amount: "10000"
          description: 字段來自 Whale OpenAPI 已發佈規範（whale-openapi/Whale-openapi.json）中該接口的真實 responses 定義
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
          description: 未登錄或登錄狀態已失效
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
          description: 當前賬號未獲得該功能授權。請在 User Permission 中為該賬號開通相應權限
        "408":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
          description: 請求處理超時。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`
      description: 該接口用於查詢指定證券賬號的現金餘額信息。通過傳入證券賬號 account_no，可選傳入幣種 currency 進行篩選，返回賬戶的總現金 total_cash、總可用現金 total_available_cash、總可提現金 total_withdraw_cash，以及各幣種下的現金明細列表 cash_list。與全量現金查詢接口不同，該接口支持按幣種過濾
      x-mint:
        href: /zh-HK/api-reference/esop_get_account_cash_info
        metadata:
          sidebarTitle: 賬戶現金查詢
  /v1/whaleapi/asset/stock_info:
    get:
      operationId: esop_get_account_stock_info
      summary: 賬戶持倉查詢
      tags:
        - 資產賬户
      x-permission-key:
        - portfolio.asset
      x-lbonly: false
      x-source: WhaleAPI
      parameters:
        - name: account_no
          in: query
          required: true
          schema:
            type: string
          description: 賬戶信息
        - name: currency
          in: query
          required: false
          schema:
            type: string
          description: 幣種
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。

                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`
                      判斷具體結果。

                      - `401`：未登錄。
                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。選項: `0` = 成功
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      stock_list:
                        type: array
                        items:
                          type: object
                          properties:
                            symbol:
                              type: string
                              description: 證券標的。證券標的
                            market:
                              type: string
                              description: 市場。市場
                            currency:
                              type: string
                              description: 幣種。幣種
                            total_quantity:
                              type: string
                              description: 倉位數量。倉位數量
                            available_quantity:
                              type: string
                              description: 倉位可用數量。倉位可用數量
                            last_done:
                              type: string
                              description: 最新價格。最新價格
                            pre_close:
                              type: string
                              description: 昨日收盤價格。昨日收盤價格
                            average_cost_price:
                              type: string
                              description: 買入成本。買入成本
                            diluted_cost_cost:
                              type: string
                              description: 攤薄成本。攤薄成本
                            init_quantity:
                              type: string
                              description: 開盤前初始持倉。開盤前初始持倉
                            pl_info:
                              type: object
                              properties:
                                currency:
                                  type: string
                                  description: 幣種。幣種
                                amount:
                                  type: string
                                  description: 金額。金額
                              description: t-1日資產盈虧 對象為map,key為currency,value為金額。t-1日資產盈虧 對象為map,key為currency,value為金額
                            buy_amount:
                              type: string
                              description: 當日買入總額。當日買入總額
                            sell_amount:
                              type: string
                              description: 當日賣出總額。當日賣出總額
                          required:
                            - symbol
                            - market
                            - currency
                            - total_quantity
                            - available_quantity
                            - last_done
                            - pre_close
                            - average_cost_price
                            - diluted_cost_cost
                            - init_quantity
                            - buy_amount
                            - sell_amount
                        description: 持倉列表[只包含多頭股票]。持倉列表[只包含多頭股票]
                    required:
                      - stock_list
              example:
                code: 0
                message: success
                data:
                  stock_list:
                    - symbol: TSLA.US
                      market: US
                      currency: USD
                      total_quantity: "3000"
                      available_quantity: "3000"
                      last_done: "202.040"
                      pre_close: "214.240"
                      average_cost_price: "0.300"
                      diluted_cost_cost: "0.300"
                      init_quantity: "13"
                      pl_info:
                        currency: string
                        amount: string
                      buy_amount: string
                      sell_amount: string
          description: 字段來自 Whale OpenAPI 已發佈規範（whale-openapi/Whale-openapi.json）中該接口的真實 responses 定義
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
          description: 未登錄或登錄狀態已失效
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
          description: 當前賬號未獲得該功能授權。請在 User Permission 中為該賬號開通相應權限
        "408":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
          description: 請求處理超時。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`
      description: 該接口用於查詢指定證券賬號的當前股票持倉詳情。通過傳入證券賬號 account_no，可選傳入幣種 currency 進行篩選，返回各持倉標的的數量、成本價、最新價、當日買賣金額等詳細信息。需注意該接口僅返回多頭股票持倉，不包含空頭及其他資產類型
      x-mint:
        href: /zh-HK/api-reference/esop_get_account_stock_info
        metadata:
          sidebarTitle: 賬戶持倉查詢
