        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 過濾條件. 組合業務過濾條件。省略某個過濾字段時，不按該字段篩選。
                  properties:
                    aaid:
                      type: string
                      description: 客戶. 用於按「客戶」篩選結果。
                    counter_id:
                      type: string
                      description: OTC 代碼. 用於按「OTC 代碼」篩選結果。
                    account_type:
                      type: string
                      description: |-
                        賬戶類型. 用於按「賬戶類型」篩選結果。

                        **可選值：** `SETTLEMENT`、`BUSINESS`、`EXTERNAL`、`INTERNAL`
                      enum:
                        - SETTLEMENT
                        - BUSINESS
                        - EXTERNAL
                        - INTERNAL
                    updated_at:
                      type: object
                      description: 更新時間. 用於按「更新時間」篩選結果。
                      properties:
                        gte:
                          type: string
                          format: date
                          description: 大於等於. 篩選範圍的下限，匹配值包含該值。
                        lte:
                          type: string
                          format: date
                          description: 小於等於. 篩選範圍的上限，匹配值包含該值。
                    done_at:
                      type: object
                      description: 業務時間. 用於按「業務時間」篩選結果。
                      properties:
                        gte:
                          type: string
                          format: date
                          description: 大於等於. 篩選範圍的下限，匹配值包含該值。
                        lte:
                          type: string
                          format: date
                          description: 小於等於. 篩選範圍的上限，匹配值包含該值。
                    biz_code:
                      type: string
                      description: |-
                        業務碼. 用於按「業務碼」篩選結果。

                        候選值會動態變化。請調用 `GET /v1/datasets/refs/biz_code_to_name` 獲取當前可用的數據字典，並使用返回項的 `key` 作為本參數值。
                    transfer_biz_name:
                      type: string
                      description: 業務碼名稱. 用於按「業務碼名稱」篩選結果。
                mode:
                  type: integer
                  default: 0
                  description: |-
                    導出模式. 不傳時默認 0（同步）

                    **可選值：**
                    - `0` - 表示同步
                    - `1` - 表示异步
                  enum:
                    - 0
                    - 1
                ext:
                  type: string
                  description: |-
                    下載擴展名. 下載文件格式。不傳時默認為 `csv`。

                    **可選值：**
                    - `csv` - 表示 CSV
                    - `xlsx` - 表示 Excel
                  enum:
                    - csv
                    - xlsx
                file_name:
                  type: string
                  description: 下載文件名稱. 導出文件名稱。不傳時由服務端生成。
                down_fields:
                  type: array
                  description: 指定下載字段. 不傳時導出全部字段；取值範圍見 items.enum（同查詢接口 data.list.items 的字段列表）
                  items:
                    type: string
                    enum:
                      - id
                      - id_val
                      - done_at
                      - member_id
                      - real_name
                      - origin_id
                      - account_type
                      - biz_code
                      - biz_code_val
                      - counter_id
                      - statement_no
                      - report_direction
                      - report_direction_val
                      - quantity
                      - after_quantity
                      - updated_at
                      - multilingual_remark
                ticket_content:
                  type: string
                  description: 工單備註. 模板配置了下載審核工單時，供審批人查看
                ticket_preview_url:
                  type: string
                  description: 工單審核界面詳情 url. 導出審批詳情地址；僅在導出需要審批時使用。
                hide:
                  type: integer
                  description: |-
                    是否隱藏下載記錄. 是否在下載記錄列表中隱藏本次導出記錄。

                    **可選值：**
                    - `0` - 表示不隐藏
                    - `1` - 表示隐藏
                  enum:
                    - 0
                    - 1
