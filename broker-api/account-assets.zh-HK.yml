                  type: object
                  description: 過濾條件. 組合業務過濾條件。省略某個過濾字段時，不按該字段篩選。
                  properties:
                    aaid:
                      type: string
                      description: 客戶. 用於按「客戶」篩選結果。
                    aaid_list:
                      type: string
                      description: 客戶列表. 用於按「客戶列表」篩選結果。
