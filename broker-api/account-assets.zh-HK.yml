                    - 不傳時查詢全部
                    - 示例：`M,C`

                    > 注意：賬戶類型與 `equity_type` 的非法組合（如期貨賬戶 `F` 與基金 `FUND` ）會返回 `400`。

                    **可選值：**
                    - `M` - 表示融資賬戶
                    - `C` - 表示現金賬戶
                    - `F` - 表示期貨賬戶
                  example: M,C
                  enum:
                    - M
                    - C
                    - F
                broker_codes:
                  type: string
                  description: |-
                    經紀人. 按經紀人（AE）代碼過濾。

                    - 多值使用英文逗號 `,` 拼接
                    - 不傳時查詢全部
