  /v1/portfolio/query_account_balances_summary:
    get:
      operationId: query_account_balances_summary
      summary: 總資產及賬面總現金
      tags:
        - 資產賬户
      x-permission-key:
        - asset.summary_query
      x-lbonly: false
      description: |-
        查詢總資產的類型與幣種佔比，以及賬面總現金明細。資產類型標籤會根據 `Accept-Language` 返回對應語言。

        ### 請求參數

        - 可選：`client_types`（client_types）、`account_types`（account_types）、`broker_codes`（broker_codes）
        - 各字段的格式、取值範圍、默認行為和業務含義見對應字段說明。

        ### 處理結果

        成功時返回查詢結果，具體結構見 `200` 響應定義。
      security:
        - bearerAuth: []
      parameters:
        - name: client_types
          in: query
          required: false
          schema:
            type: string
          description: |-
            客戶類型。

            - 多值使用英文逗號 `,` 拼接
            - 不傳時查詢全部
            - 示例：`1,2`
          example: 2,1
        - name: account_types
          in: query
          required: false
          schema:
            type: string
          description: |-
            賬戶類型。

            - 多值使用英文逗號 `,` 拼接
            - 不傳時查詢全部
            - 示例：`F,C`
          example: F,C
        - name: broker_codes
          in: query
          required: false
          schema:
            type: string
          description: |-
            按經紀人（AE）代碼過濾。

            - 多值使用英文逗號 `,` 拼接
            - 不傳時查詢全部
            - `=` 表示未分配經紀人
            - 示例：`=,LBtestwbwhale123`

            完整的 AE 代碼列表可通過 `GET /v1/datasets/refs/broker_accounts` 查詢，具體取值隨租戶和環境變化。
          example: =,LBtestwbwhale123
      responses:
        "200":
          description: 請求處理成功。業務結果位於 `data`，包含 `total_assets`、`total_asset_type`、`total_asset_currency`、`total_balance` 字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。

                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`
                      判斷具體結果。

                      - `401`：未登錄。
                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      total_assets:
                        type: array
                        description: 總資產（各幣種）. 各幣種總資產，用於頂部總資產展示與幣種切換
                        items:
                          type: object
                          properties:
                            currency:
                              type: string
                              description: 幣種. 如 HKD/USD/CNY/SGD
                            amount:
                              type: string
                              description: 總資產金額. 該幣種總資產金額（decimal 字符串）
                      total_asset_type:
                        type: array
                        description: 總資產按類型佔比. 按資產類型的佔比（總資產類型餅圖）
                        items:
                          type: object
                          properties:
                            equity_type:
                              type: string
                              description: 資產類型分類。
                              enum: [CASH, US, HK, CN, OTHER, FUND]
                              x-enum-details:
                                - value: CASH
                                  label: 現金
                                - value: US
                                  label: 美股
                                - value: HK
                                  label: 港股
                                - value: CN
                                  label: 滬深
                                - value: OTHER
                                  label: 其他
                                - value: FUND
                                  label: 基金
                            name:
                              type: string
                              description: 資產類型名稱. 資產類型的本地化展示名稱，隨 Accept-Language 返回（如 現金 / Cash）
                            ratio:
                              type: string
                              description: 佔比，使用 decimal 字符串表示；取值乘以 `100` 後為百分比。
                      total_asset_currency:
                        type: array
                        description: 總資產按幣種佔比. 按幣種的佔比（總資產幣種餅圖）
                        items:
                          type: object
                          properties:
                            currency:
                              type: string
                              description: 幣種. **返回值：** 幣種。
                            ratio:
                              type: string
                              description: 佔比. 使用 decimal 字符串表示，取值範圍為 `0` 至 `1`；取值乘以 `100` 後為百分比。
                      total_balance:
                        type: array
                        description: 賬面總現金明細（按幣種，對應「賬面總現金」表格）
                        items:
                          type: object
                          properties:
                            currency:
                              type: string
                              description: 幣種. **返回值：** 幣種。
                            book_balance:
                              type: string
                              description: 賬面總現金. decimal 字符串
                            settled_amount:
                              type: string
                              description: 已結算. **返回值：** 已結算。
                            unsettle_amount:
                              type: string
                              description: 待結算. **返回值：** 待結算。
                            trade_0:
                              type: string
                              description: T+0 待交收金額. **返回值：** T+0 待交收金額。
                            trade_1:
                              type: string
                              description: T+1 待交收金額. **返回值：** T+1 待交收金額。
                            trade_2:
                              type: string
                              description: T+2 待交收金額. **返回值：** T+2 待交收金額。
                            trade_n:
                              type: string
                              description: T+N 待交收金額. **返回值：** T+N 待交收金額。
              example:
                code: 0
                message: success
                data:
                  total_assets:
                    - currency: string
                      amount: string
                  total_asset_type:
                    - equity_type: string
                      name: string
                      ratio: string
                  total_asset_currency:
                    - currency: string
                      ratio: string
                  total_balance:
                    - currency: string
                      book_balance: string
                      settled_amount: string
                      unsettle_amount: string
                      trade_0: string
                      trade_1: string
                      trade_2: string
                      trade_n: string
        "400":
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
        "401":
          description: 未登錄或登錄狀態已失效。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
        "403":
          description: 當前賬號未獲得該功能授權。請在 User Permission 中為該賬號開通相應權限。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
        "408":
          description: 請求處理超時。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
      x-mint:
        href: /zh-HK/api-reference/query_account_balances_summary
        metadata:
          sidebarTitle: 總資產及賬面總現金
  /v1/portfolio/query_equity_holding_summary:
    post:
      operationId: query_equity_holding_summary
      summary: 資產總覽持倉
      tags:
        - 資產賬户
