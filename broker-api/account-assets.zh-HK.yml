  /v1/datasets/atm_omnibus_holding_transfers:
    get:
      operationId: atm_omnibus_holding_transfers
      summary: 賬戶間轉倉查詢
      tags:
        - 資產賬户
      x-permission-key:
        - portfolio.omnibus_transfer_equity_holding_change_query
      x-lbonly: false
      description: |-
        查詢「賬戶間轉倉查詢」數據，可通過 `filters` 組合業務篩選條件，並使用 `page` 和 `page_size` 控制分頁。

        ### 返回結果

        成功時返回匹配的記錄列表及分頁信息。各過濾字段的用途、可選值和動態數據來源見對應字段說明。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 過濾條件. 組合業務過濾條件。省略某個過濾字段時，不按該字段篩選。
                  properties:
                    from_aaid:
                      type: string
                      description: 轉出方. 用於按「轉出方」篩選結果。
                    to_aaid:
                      type: string
                      description: 轉入方. 用於按「轉入方」篩選結果。
                    transfer_no:
                      type: string
                      description: 流水單號. 用於按「流水單號」篩選結果。
                    transfer_type:
                      type: string
                      description: |-
                        轉倉類型. 用於按「轉倉類型」篩選結果。

                        **可選值：**
                        - `1` - 表示轉給子賬戶
                        - `0` - 表示轉給主賬戶
                      enum:
                        - "1"
                        - "0"
                    counter_id:
                      type: string
                      description: 證券代碼. 用於按「證券代碼」篩選結果。
                    ticket_status:
                      type: string
                      description: |-
                        審核狀態. 用於按「審核狀態」篩選結果。

                        **可選值：**
                        - `WAIT` - 表示待提交審批
                        - `WAIT_APPROVE` - 表示審批中
                        - `APPROVED` - 表示通過
                        - `REJECTED` - 表示拒絕
                        - `CLOSE` - 表示關閉
                      enum:
                        - WAIT
                        - WAIT_APPROVE
                        - APPROVED
                        - REJECTED
                        - CLOSE
                page:
                  type: integer
                  description: 頁碼. 要查詢的頁碼，從 `1` 開始。
                page_size:
                  type: integer
                  description: 每頁數量. 每頁返回的記錄數量。
            example:
              filters: {}
              page: 1
              page_size: 20
