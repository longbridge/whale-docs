                    **當前文檔列出的取值：**
                    - `=` - 表示未分配
                  enum:
                    - =
                equity_type:
                  type: string
                  description: 資產類型. 持倉匯總的資產類型篩選條件，僅支持單值。
                  enum:
                    - STOCK
                    - OPTION
                    - FUND
                    - BOND
                    - MMF
                    - OTC
                    - CRYPTO
                    - WM
                  x-enum-details:
                    - value: STOCK
                      label: 股票
                    - value: OPTION
                      label: 期權
                    - value: FUND
                      label: 基金
                    - value: BOND
                      label: 債券
                    - value: MMF
                      label: 餘額通
                    - value: OTC
                      label: 其他
                    - value: CRYPTO
                      label: 加密貨幣
                    - value: WM
                      label: 場外衍生品
                page:
                  type: number
                  description: 頁碼. 要查詢的頁碼，從 `1` 開始。
                page_size:
                  type: number
                  description: 每頁數量. 每頁返回的最大記錄數，應為正整數。
            example:
              client_types: 2,1
              account_types: M,C
              broker_codes: =,LBtestwbwhale123
              page: 1
              page_size: 20
              equity_type: STOCK
      responses:
        "200":
          description: 請求處理成功。業務結果位於 `data`，包含 `total_holdings`、`page`、`page_size`、`total_page`、`total` 字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。

                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`
                      判斷具體結果。

                      - `401`：未登錄。
                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      total_holdings:
