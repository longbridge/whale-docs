  /v1/datasets/clearing_adjust_bonds:
    get:
      operationId: clearing_adjust_bonds
      summary: 手工調賬 - 債券
      tags:
        - 資產賬户
      x-permission-key:
        - bond_change_ticket.list
      x-lbonly: false
      description: |-
        查詢「手工調賬 - 債券」數據，可通過 `filters` 組合業務篩選條件，並使用 `page` 和 `page_size` 控制分頁。

        ### 返回結果

        成功時返回匹配的記錄列表及分頁信息。各過濾字段的用途、可選值和動態數據來源見對應字段說明。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 過濾條件. 組合業務過濾條件。省略某個過濾字段時，不按該字段篩選。
                  properties:
                    aaid:
                      type: string
                      description: 客戶. 用於按「客戶」篩選結果。
                    direction:
                      type: string
                      description: |-
                        調賬類型. 用於按「調賬類型」篩選結果。

                        **可選值：**
                        - `DEBIT` - 表示出賬
                        - `CREDIT` - 表示入賬
                      enum:
                        - DEBIT
                        - CREDIT
                    ticket_status:
                      type: string
                      description: |-
                        狀態. 用於按「狀態」篩選結果。

                        **可選值：**
                        - `WAIT` - 表示待提交審批
                        - `WAIT_APPROVE` - 表示審批中
                        - `REJECTED` - 表示拒絕
                        - `CLOSE` - 表示關閉
                        - `REVOKING` - 表示撤銷審批中
                        - `REVOKED` - 表示已撤銷
                        - `SUCCESS` - 表示調賬成功
                        - `FAILED` - 表示調賬失敗
                        - `PROCESS` - 表示調賬處理中
                      enum:
                        - WAIT
                        - WAIT_APPROVE
                        - REJECTED
                        - CLOSE
                        - REVOKING
                        - REVOKED
                        - SUCCESS
                        - FAILED
                        - PROCESS
                    request_id:
                      type: string
                      description: 批次號. 用於按「批次號」篩選結果。
                    finish_at:
                      type: object
                      description: 完成時間. 用於按「完成時間」篩選結果。
                      properties:
                        gte:
                          type: string
                          format: date
                          description: 大於等於. 篩選範圍的下限，匹配值包含該值。
                        lte:
                          type: string
                          format: date
                          description: 小於等於. 篩選範圍的上限，匹配值包含該值。
                page:
                  type: integer
                  description: 頁碼. 要查詢的頁碼，從 `1` 開始。
                page_size:
                  type: integer
                  description: 每頁數量. 每頁返回的記錄數量。
            example:
              filters: {}
              page: 1
              page_size: 20
      responses:
