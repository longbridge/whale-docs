                  type: integer
                  default: 0
                  description: |-
                    導出模式. 不傳時默認 0（同步）

                    **可選值：**
                    - `0` - 表示同步
                    - `1` - 表示异步
                  enum:
                    - 0
                    - 1
                ext:
                  type: string
                  description: |-
                    下載擴展名. 下載文件格式。不傳時默認為 `csv`。

                    **可選值：**
                    - `csv` - 表示 CSV
                    - `xlsx` - 表示 Excel
                  enum:
                    - csv
                    - xlsx
                file_name:
                  type: string
                  description: 下載文件名稱. 導出文件名稱。不傳時由服務端生成。
                down_fields:
                  type: array
                  description: 指定下載字段. 不傳時導出全部字段；取值範圍見 items.enum（同查詢接口 data.list.items 的字段列表）
                  items:
                    type: string
                    enum:
                      - id
                      - id_val
                      - done_at
                      - member_id
                      - real_name
                      - real_name_val
                      - origin_id
                      - account_type
                      - biz_code
                      - biz_code_val
                      - currency
                      - currency_val
                      - report_direction
                      - report_direction_val
                      - amount
                      - after_balance
                      - total_balance
                      - ref_no
                      - statement_no
                      - updated_at
                      - multilingual_remark
                ticket_content:
                  type: string
                  description: 工單備註. 模板配置了下載審核工單時，供審批人查看
                ticket_preview_url:
                  type: string
                  description: 工單審核界面詳情 url. 導出審批詳情地址；僅在導出需要審批時使用。
                hide:
                  type: integer
                  description: |-
