                              description: 待結算. **返回值：** 待結算。
                            trade_0:
                              type: string
                              description: T+0 待交收數量. **返回值：** T+0 待交收數量。
                            trade_1:
                              type: string
                              description: T+1 待交收數量. **返回值：** T+1 待交收數量。
                            trade_2:
                              type: string
                              description: T+2 待交收數量. **返回值：** T+2 待交收數量。
