                        候選值會動態變化。請調用 `GET /v1/datasets/refs/tenant_currencies` 獲取當前可用的數據字典，並使用返回項的 `key` 作為本參數值。
                    account_type:
                      type: string
                      description: |-
                        賬戶類型. 用於按「賬戶類型」篩選結果。

                        **可選值：** `SETTLEMENT`、`BUSINESS`、`EXTERNAL`、`INTERNAL`
                      enum:
                        - SETTLEMENT
                        - BUSINESS
                        - EXTERNAL
                        - INTERNAL
                    updated_at:
                      type: object
                      description: 更新時間. 用於按「更新時間」篩選結果。
                      properties:
                        gte:
                          type: string
                          format: date
                          description: 大於等於. 篩選範圍的下限，匹配值包含該值。
                        lte:
                          type: string
                          format: date
                          description: 小於等於. 篩選範圍的上限，匹配值包含該值。
                    done_at:
                      type: object
                      description: 業務時間. 用於按「業務時間」篩選結果。
                      properties:
                        gte:
                          type: string
                          format: date-time
                          description: 大於等於. 篩選範圍的下限，匹配值包含該值。
                        lte:
                          type: string
                          format: date-time
                          description: 小於等於. 篩選範圍的上限，匹配值包含該值。
                    biz_code:
                      type: string
                      description: |-
                        業務碼. 用於按「業務碼」篩選結果。

                        候選值會動態變化。請調用 `GET /v1/datasets/refs/biz_code_to_name` 獲取當前可用的數據字典，並使用返回項的 `key` 作為本參數值。
                    transfer_biz_name:
                      type: string
                      description: 業務碼名稱. 用於按「業務碼名稱」篩選結果。
                    ref_no:
                      type: string
                      description: 業務訂單號. 用於按「業務訂單號」篩選結果。
