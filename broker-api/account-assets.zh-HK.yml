                        items:
                          type: object
                          properties:
                            counter_id:
                              type: string
                              description: 證券代碼. **返回值：** 證券代碼。
                            equity_type:
                              type: string
                              description: 資產類型，取值同請求參數 `equity_type`。
                              enum: [STOCK, OPTION, FUND, BOND, MMF, OTC, CRYPTO, WM]
                              x-enum-details:
                                - value: STOCK
                                  label: 股票
                                - value: OPTION
                                  label: 期權
                                - value: FUND
                                  label: 基金
                                - value: BOND
                                  label: 債券
                                - value: MMF
                                  label: 餘額通
                                - value: OTC
                                  label: 其他
                                - value: CRYPTO
                                  label: 加密貨幣
                                - value: WM
                                  label: 場外衍生品
                            counter_name:
                              type: string
                              description: 證券名稱. 本地化名稱，隨 Accept-Language 返回
                            total_quantity:
