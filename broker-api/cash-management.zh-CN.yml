                      x-enum-details:
                        - value: =,
                          label: 未知
                        - value: ~waiting_request/waiting_response
                          label: 风控处理中
                        - value: finish,=
                          label: 未命中
                        - value: finish,!=
                          label: 命中
                      example: =,
                    audit_limit_time:
                      type: object
                      description: 预计处理时间. 用于按「预计处理时间」筛选结果。
                      properties:
                        gte:
                          type: string
                          description: 大于等于. 筛选范围的下限，匹配值包含该值。
                          format: date
