                              description: 入金方式. **返回值：** 入金方式。
                            bank_operation_type_id_val:
                              type: string
                              description: 入金方式（原始值）. 字段 bank_operation_type_id 的原始值：bank_operation_type_id 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
