  /v1/datasets/atm_deposit_applications:
    post:
      operationId: atm_deposit_applications
      summary: 入金申请
      tags:
        - 款项管理
      x-permission-key:
        - cmbc.hk_user_deposit_application
      x-lbonly: false
      description: |-
        查询「入金申请」数据，可通过 `filters` 组合业务筛选条件，并使用 `page`、`page_size`、`orderBy` 控制分页与排序。

        ### 返回结果

        成功时返回匹配的记录列表及分页信息。各过滤字段的用途、可选值和动态数据来源见对应字段说明。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 过滤条件. 组合业务过滤条件。省略某个过滤字段时，不按该字段筛选。
                  properties:
                    member_id:
                      type: string
                      description: 客户. 用于按「客户」筛选结果。
                    search_member_id:
                      type: string
                      description: 客户编号. 用于按「客户编号」筛选结果。
                    currency:
                      type: string
                      description: |-
                        币种. 用于按「币种」筛选结果。

                        候选值会动态变化。请调用 `GET /v1/datasets/refs/tenant_currencies_by_channel` 获取当前可用的数据字典，并使用返回项的 `key` 作为本参数值。
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/tenant_currencies_by_channel
                    channel_account:
                      type: string
                      description: 证券账号. 用于按「证券账号」筛选结果。
                    id:
                      type: string
                      description: 申请编号. 用于按「申请编号」筛选结果。
                    ref_state:
                      type: string
                      description: 匹配状态. 用于按「匹配状态」筛选结果。
                      enum:
                        - '0'
                        - '1'
                      x-enum-details:
                        - value: '0'
                          label: 未匹配
                        - value: '1'
                          label: 已匹配
                      example: '0'
                    state:
                      type: string
                      description: |-
                        加款状态. 用于按「加款状态」筛选结果。

                        支持多选；提交时使用英文逗号（`,`）拼接多个值。不传时不按此字段筛选。
                      example: 0,1
                      enum:
                        - '0'
                        - '1'
                        - '2'
                        - '3'
                        - '5'
                        - '6'
                        - '7'
                        - '8'
                        - '9'
                        - '100'
                        - '200'
                      x-enum-details:
                        - value: '0'
                          label: 处理中
                        - value: '1'
                          label: 加款完成
                        - value: '2'
                          label: 加款失败
                        - value: '3'
                          label: 已撤销
                        - value: '5'
                          label: 已驳回
                        - value: '6'
                          label: 修改待审批
                        - value: '7'
                          label: 删除待审批
                        - value: '8'
                          label: 已删除
                        - value: '9'
                          label: 驳回待审批
                        - value: '100'
                          label: 待解冻
                        - value: '200'
                          label: 解冻待审核
                    deposit_type:
                      type: string
                      description: 入金类型. 用于按「入金类型」筛选结果。
                      enum:
                        - '0'
                        - '1'
                      x-enum-details:
                        - value: '0'
                          label: 用户加款
                        - value: '1'
                          label: 开户入金
                      example: '0'
                    created_at:
                      type: object
                      description: 创建时间. 用于按「创建时间」筛选结果。
                      properties:
                        gte:
                          type: string
                          description: 大于等于. 筛选范围的下限，匹配值包含该值。
                          format: date
                        lte:
                          type: string
                          description: 小于等于. 筛选范围的上限，匹配值包含该值。
                          format: date
                    amount:
                      type: object
                      description: 金额范围. 用于按「金额范围」筛选结果。
                      properties:
                        gte:
                          type: number
                          description: 大于等于. 筛选范围的下限，匹配值包含该值。
                        lte:
                          type: number
                          description: 小于等于. 筛选范围的上限，匹配值包含该值。
                    bank_operation_type_id:
                      type: string
                      description: |-
                        入金方式. 用于按「入金方式」筛选结果。

                        候选值会动态变化。请调用 `GET /v1/datasets/refs/offline_deposit_methods` 获取当前可用的数据字典，并使用返回项的 `key` 作为本参数值。
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/offline_deposit_methods
                    bank_id:
                      type: string
                      description: |-
                        汇款银行. 用于按「汇款银行」筛选结果。

                        候选值会动态变化。请调用 `GET /v1/datasets/refs/region_banks` 获取当前可用的数据字典，并使用返回项的 `key` 作为本参数值。
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/region_banks
                    lb_bank_account_id:
                      type: string
                      description: |-
                        收款银行. 用于按「收款银行」筛选结果。

                        候选值会动态变化。请调用 `GET /v1/datasets/refs/receiving_bank_accounts` 获取当前可用的数据字典，并使用返回项的 `key` 作为本参数值。
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/receiving_bank_accounts
                    detail_id:
                      type: string
                      description: 加款单号. 用于按「加款单号」筛选结果。
                    bills_id:
                      type: string
                      description: 入金账单编号. 用于按「入金账单编号」筛选结果。
                    initiator:
                      type: string
                      description: |-
                        来源. 用于按「来源」筛选结果。

                        **可选值：** `APP`（用户）、`system`（系统）、`AUTO`
                      enum:
                        - APP
                        - system
                        - AUTO
                      example: APP
                    sub_state:
                      type: string
                      description: 催办状态. 用于按「催办状态」筛选结果。
                      enum:
                        - '0'
                        - '1'
                        - '2'
                      x-enum-details:
                        - value: '0'
                          label: 未催办
                        - value: '1'
                          label: 待处理
                        - value: '2'
                          label: 已确认
                      example: '0'
                page:
                  type: integer
                  description: 页码. 要查询的页码，从 `1` 开始。
                page_size:
                  type: integer
                  description: 每页数量. 每页返回的记录数量。
                orderBy:
                  type: array
                  description: 排序参数. 排序规则数组；每一项定义一个排序字段及排序方向。
                  items:
                    type: object
            example:
              filters: {}
              page: 1
              page_size: 20
              orderBy: []
