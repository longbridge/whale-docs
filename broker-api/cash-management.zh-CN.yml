                        - `2` - 表示已开通
                        - `3` - 表示已驳回
                        - `4` - 表示已关闭
                        - `5` - 表示已过期
                        - `8` - 表示已取消
                      enum:
                        - '0'
                        - '1'
                        - '2'
                        - '3'
                        - '4'
                        - '5'
                        - '8'
                    bank_sec_agr_no:
                      type: string
                      description: 协议编号. 用于按「协议编号」筛选结果。
                    created_at:
                      type: object
                      description: 创建时间. 用于按「创建时间」筛选结果。
                      properties:
                        gte:
                          type: string
                          description: 大于等于. 筛选范围的下限，匹配值包含该值。
                          format: date
                        lte:
                          type: string
                          description: 小于等于. 筛选范围的上限，匹配值包含该值。
                          format: date
