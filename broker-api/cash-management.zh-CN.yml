        - 各字段的格式、取值范围和业务含义见对应字段说明。

        ### 处理结果

        成功时完成上述业务操作；后续状态和返回数据以 `200` 响应定义为准。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
                - channel_name
                - base_currency
                - other_currency
                - record_date
                - bid_rate
                - offer_rate
                - average_rate
              properties:
                id:
                  type: string
                  description: 汇率记录ID. 待编辑的参考汇率记录主键，来自列表行数据 record.id
                source:
                  type: string
                  description: |-
                    汇率来源. 只读字段，取自记录本身；下拉枚举来自 ref rate_source。

                    **可选值：**
                    - `FILE` - 表示人工文件导入
                    - `MANUEL_CREATE` - 表示单笔新增
                    - `AUTO` - 表示自动获取
                    - `COPY` - 表示自动延续上一日
                    - `CCASS` - 表示自动跟随港交所
                  enum:
                    - FILE
                    - MANUEL_CREATE
                    - AUTO
                    - COPY
                    - CCASS
                channel_name:
                  type: string
                  description: |-
                    渠道/汇率类型. 只读字段（编辑态 disabled），提交时若为多选会以逗号拼接成字符串；下拉枚举来自 ref manual_forex_change_type，如 MANUAL_CURRENT/MANUAL_ACCOUNT/CCASS。

                    **可选值：**
                    - `MANUAL_CURRENT` - 表示即期汇率
                    - `MANUAL_ACCOUNT` - 表示账面汇率
                    - `CCASS` - 表示港交所
                  example: MANUAL_CURRENT,MANUAL_ACCOUNT
                  enum:
                    - MANUAL_CURRENT
                    - MANUAL_ACCOUNT
                    - CCASS
                base_currency:
                  type: string
                  description: 基准货币. 只读字段（编辑态 disabled），默认取自 atm_currency_config 的 standard_money 币种
                other_currency:
                  type: string
                  description: 对手货币. 只读字段（编辑态 disabled）
                record_date:
                  type: string
                  description: 记录日期. 只读字段（编辑态 disabled），提交前转换为 YYYYMMDD 格式字符串
                bid_rate:
                  type: number
                  description: 买入汇率. 需 > 0，精度由 getCurrencyRateAccuracy 接口返回的 rate_precision 决定
                offer_rate:
                  type: number
                  description: 卖出汇率. 需 > 0，精度由 getCurrencyRateAccuracy 接口返回的 rate_precision 决定
                average_rate:
                  type: number
                  description: 平均汇率. 需 > 0，精度由 getCurrencyRateAccuracy 接口返回的 rate_precision 决定
                audit_frontend_resource:
                  type: object
                  description: 审计上下文. 调用方自动附带的审计信息，编辑场景下包含 $behavior/$action='edit'/bid_rate/offer_rate/average_rate（编辑前旧值）
            example:
              id: '10086'
              source: MANUAL_CURRENT
              channel_name: MANUAL_CURRENT
              base_currency: HKD
              other_currency: USD
              record_date: '20260713'
              bid_rate: 7.75
              offer_rate: 7.85
              average_rate: 7.8
              audit_frontend_resource: {}
      responses:
        '200':
          description: 请求处理成功。响应的 `data` 不包含额外业务字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
