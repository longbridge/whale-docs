        - cmbc.user_withdraw_application
      x-lbonly: false
      description: |-
        查询「出金申请」数据，可通过 `filters` 组合业务筛选条件，并使用 `page`、`page_size`、`orderBy` 控制分页与排序。

        ### 返回结果

        成功时返回匹配的记录列表及分页信息。各过滤字段的用途、可选值和动态数据来源见对应字段说明。
