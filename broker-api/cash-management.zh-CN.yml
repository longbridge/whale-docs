                        - `0` - 表示初始
                        - `46` - 表示通过待审核
                        - `45` - 表示已开通待审核
                        - `50` - 表示驳回待审核
                        - `49` - 表示已关闭待审核
                      enum:
                        - '0'
                        - '46'
                        - '45'
                        - '50'
                        - '49'
