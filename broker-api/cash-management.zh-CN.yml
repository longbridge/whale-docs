      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
                - invisible
                - audit_frontend_resource
              properties:
                id:
                  type: number
                  description: 账单ID. 账单ID，用于标识本次请求关联的业务对象。此字段为必填项。
                invisible:
                  type: boolean
                  description: |-
                    是否隐藏. 是否隐藏。此字段为必填项。

                    **布尔值：**
                    - `true` - 表示条件成立
                    - `false` - 表示条件不成立
