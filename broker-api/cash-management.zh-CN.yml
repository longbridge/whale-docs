  /v1/datasets/atm_withdraw_applications:
    get:
      operationId: atm_withdraw_applications
      summary: 出金申请
      tags:
        - 款项管理
      x-permission-key:
        - cmbc.user_withdraw_application
      x-lbonly: false
      description: |-
        查询「出金申请」数据，可通过 `filters` 组合业务筛选条件，并使用 `page`、`page_size` 和 `orderBy` 控制分页与排序。

        ### 返回结果

        成功时返回匹配的记录列表及分页信息。各过滤字段的用途、可选值和动态数据来源见对应字段说明。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 过滤条件. 组合业务过滤条件。省略某个过滤字段时，不按该字段筛选。
                  properties:
                    member_id:
                      type: string
                      description: 客户. 用于按「客户」筛选结果。
                    id:
                      type: string
                      description: 申请编号. 用于按「申请编号」筛选结果。
                    status:
                      type: string
                      description: |-
                        申请单状态. 用于按「申请单状态」筛选结果。

                        支持多选；提交时使用英文逗号（`,`）拼接多个值。不传时不按此字段筛选。

                        **可选值：**
                        - `0 99` - 表示待提交
                        - `7` - 表示已提交
                        - `1` - 表示处理中
                        - `2` - 表示已拒绝
                        - `3` - 表示已撤销
                        - `4` - 表示成功
                        - `5` - 表示失败
                        - `6` - 表示已退回
                        - `9` - 表示修改待审批
                        - `10` - 表示删除待审批
                        - `11` - 表示已删除
                        - `12` - 表示驳回待审批
                        - `13` - 表示提交待审批
                      example: 0 99,7
                      enum:
                        - 0 99
                        - '7'
                        - '1'
                        - '2'
                        - '3'
                        - '4'
                        - '5'
                        - '6'
                        - '9'
                        - '10'
                        - '11'
                        - '12'
                        - '13'
                    origin:
                      type: string
                      description: |-
                        提现类型. 用于按「提现类型」筛选结果。

                        **可选值：**
                        - `0` - 表示用户提现
                        - `1` - 表示手工提现
                        - `2` - 表示银行端提现
                      enum:
                        - '0'
                        - '1'
                        - '2'
                    currency:
                      type: string
                      description: |-
                        币种. 用于按「币种」筛选结果。

                        候选值会动态变化。请调用 `GET /v1/datasets/refs/tenant_currencies` 获取当前可用的数据字典，并使用返回项的 `key` 作为本参数值。
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/tenant_currencies
                    state:
                      type: string
                      description: |-
                        打包状态. 用于按「打包状态」筛选结果。

                        **可选值：**
                        - `0` - 表示已打包
                        - `1` - 表示审批中
                        - `2` - 表示已审核
                        - `4` - 表示已完成
                        - `5` - 表示已撤销
                      enum:
                        - '0'
                        - '1'
                        - '2'
                        - '4'
                        - '5'
                    wd_id:
                      type: string
                      description: 提现单号. 用于按「提现单号」筛选结果。
                    created_at:
                      type: object
                      description: 创建时间. 用于按「创建时间」筛选结果。
                      properties:
                        gte:
                          type: string
                          description: 大于等于. 筛选范围的下限，匹配值包含该值。
                          format: date
                        lte:
                          type: string
                          description: 小于等于. 筛选范围的上限，匹配值包含该值。
                          format: date
                    approval_at:
                      type: object
                      description: 审核时间. 用于按「审核时间」筛选结果。
                      properties:
                        gte:
                          type: string
                          description: 大于等于. 筛选范围的下限，匹配值包含该值。
                          format: date
                        lte:
                          type: string
                          description: 小于等于. 筛选范围的上限，匹配值包含该值。
                          format: date
                    wb_created_at:
                      type: object
                      description: 打包时间. 用于按「打包时间」筛选结果。
                      properties:
                        gte:
                          type: string
                          description: 大于等于. 筛选范围的下限，匹配值包含该值。
                          format: date
                        lte:
                          type: string
                          description: 小于等于. 筛选范围的上限，匹配值包含该值。
                          format: date
                    anti_cheat_task_status:
                      type: string
                      description: |-
                        风控状态. 用于按「风控状态」筛选结果。

                        **可选值：**
                        - `=,` - 表示未知
                        - `~waiting_request/waiting_response` - 表示风控处理中
                        - `finish,=` - 表示未命中
                        - `finish,!=` - 表示命中
                      enum:
                        - =,
                        - ~waiting_request/waiting_response
                        - finish,=
                        - finish,!=
                    audit_limit_time:
                      type: object
                      description: 预计处理时间. 用于按「预计处理时间」筛选结果。
                      properties:
                        gte:
                          type: string
                          description: 大于等于. 筛选范围的下限，匹配值包含该值。
                          format: date
                        lte:
                          type: string
                          description: 小于等于. 筛选范围的上限，匹配值包含该值。
                          format: date
                    amount:
                      type: object
                      description: 金额. 用于按「金额」筛选结果。
                      properties:
                        gte:
                          type: number
                          description: 大于等于. 筛选范围的下限，匹配值包含该值。
                        lte:
                          type: number
                          description: 小于等于. 筛选范围的上限，匹配值包含该值。
                    remark:
                      type: string
                      description: 备注. 用于按「备注」筛选结果。
                    hit_rules:
                      type: string
                      description: |-
                        命中规则. 用于按「命中规则」筛选结果。

                        候选值会动态变化。请调用 `GET /v1/datasets/refs/risk_rule_indicators_withdraw` 获取当前可用的数据字典，并使用返回项的 `key` 作为本参数值。
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/risk_rule_indicators_withdraw
                    not_rule:
                      type: string
                      description: |-
                        未命中规则. 用于按「未命中规则」筛选结果。

                        候选值会动态变化。请调用 `GET /v1/datasets/refs/risk_rule_indicators_withdraw` 获取当前可用的数据字典，并使用返回项的 `key` 作为本参数值。
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/risk_rule_indicators_withdraw
                    to_bank_name:
                      type: string
                      description: |-
                        收款银行. 用于按「收款银行」筛选结果。

                        候选值会动态变化。请调用 `GET /v1/datasets/refs/region_banks_by_name_key` 获取当前可用的数据字典，并使用返回项的 `key` 作为本参数值。
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/region_banks_by_name_key
                page:
                  type: integer
                  description: 页码. 要查询的页码，从 `1` 开始。
                page_size:
                  type: integer
                  description: 每页数量. 每页返回的记录数量。
                orderBy:
                  type: array
                  description: 排序参数. 排序规则数组；每一项定义一个排序字段及排序方向。
                  items:
                    type: object
            example:
              filters: {}
              page: 1
              page_size: 20
              orderBy: []
      responses:
        '200':
          description: 成功时分页返回「出金申请」记录，以及页码、每页数量和总记录数等分页信息。
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。

                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`
                      判断具体结果。

                      - `401`：未登录。
                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。
                  message:
                    type: string
                  data:
                    type: object
                    required:
                      - list
                      - total
                    properties:
                      list:
                        type: array
                        description: 列表. **返回值：** 列表列表。
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: 申请编号. **返回值：** 当前记录的唯一标识。
                            id_val:
                              type: string
                              description: 申请编号（原始值）. 字段 id 的原始值：id 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            wd_id:
                              type: string
                              description: 提现单号. **返回值：** 提现单号。
                            member_id:
                              type: string
                              description: 客户编号. **返回值：** 客户编号。
                            member_id_val:
                              type: string
                              description: 客户编号（原始值）. 字段 member_id 的原始值：member_id 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            channel_account:
                              type: string
                              description: 证券账号. **返回值：** 证券账号。
                            lookup_value:
                              type: string
                              description: 可提参考值. **返回值：** 可提参考值。
                            custom_withdraw_amount_from_server:
                              type: string
                              description: 提现金额. **返回值：** 提现金额。
                            wd_to_amount:
                              type: string
                              description: 客户申请金额. **返回值：** 客户申请金额。
                            wd_fee:
                              type: string
                              description: 手续费. **返回值：** 手续费。
                            tax_down:
                              type: string
                              description: 消费税. **返回值：** 消费税。
                            wd_payment_amount:
                              type: string
                              description: 出账金额. **返回值：** 出账金额。
                            currency:
                              type: string
                              description: 币种. **返回值：** 币种。
                            custom_to_bank_name_from_server:
                              type: string
                              description: 收款银行. **返回值：** 收款银行。
                            wc_created_at_for_custom:
                              type: string
                              description: 绑定时间. **返回值：** 绑定时间。
                            hit_rules:
                              type: string
                              description: 命中规则. **返回值：** 命中规则。
                            hit_rules_val:
                              type: string
                              description: 命中规则（原始值）. 字段 hit_rules 的原始值：hit_rules 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            audit_rule_id:
                              type: string
                              description: 自动审核规则. **返回值：** 自动审核规则。
                            audit_rule_id_val:
                              type: string
                              description: 自动审核规则（原始值）. 字段 audit_rule_id 的原始值：audit_rule_id 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
