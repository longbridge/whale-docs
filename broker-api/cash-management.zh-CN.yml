        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 过滤条件. 组合业务过滤条件。省略某个过滤字段时，不按该字段筛选。
                  properties:
                    member_id:
                      type: string
                      description: 客户. 用于按「客户」筛选结果。
                    id:
                      type: string
                      description: 申请编号. 用于按「申请编号」筛选结果。
                    status:
                      type: string
                      description: |-
                        申请单状态. 用于按「申请单状态」筛选结果。

                        支持多选；提交时使用英文逗号（`,`）拼接多个值。不传时不按此字段筛选。
                      example: 0 99,7
                      enum:
                        - 0 99
                        - '7'
                        - '1'
                        - '2'
                        - '3'
                        - '4'
                        - '5'
                        - '6'
                        - '9'
                        - '10'
                        - '11'
                        - '12'
                        - '13'
                      x-enum-details:
                        - value: 0 99
                          label: 待提交
                        - value: '7'
                          label: 已提交
                        - value: '1'
                          label: 处理中
                        - value: '2'
                          label: 已拒绝
                        - value: '3'
                          label: 已撤销
                        - value: '4'
                          label: 成功
                        - value: '5'
                          label: 失败
                        - value: '6'
                          label: 已退回
                        - value: '9'
                          label: 修改待审批
                        - value: '10'
                          label: 删除待审批
                        - value: '11'
                          label: 已删除
                        - value: '12'
                          label: 驳回待审批
                        - value: '13'
                          label: 提交待审批
                    origin:
                      type: string
                      description: 提现类型. 用于按「提现类型」筛选结果。
                      enum:
                        - '0'
                        - '1'
                        - '2'
                      x-enum-details:
                        - value: '0'
                          label: 用户提现
                        - value: '1'
                          label: 手工提现
                        - value: '2'
                          label: 银行端提现
                      example: '0'
                    currency:
                      type: string
                      description: |-
                        币种. 用于按「币种」筛选结果。

                        候选值会动态变化。请调用 `GET /v1/datasets/refs/tenant_currencies` 获取当前可用的数据字典，并使用返回项的 `key` 作为本参数值。
