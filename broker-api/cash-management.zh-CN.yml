  /forex/rate/create:
    post:
      operationId: rate_create
      summary: 新建参考汇率
      tags:
        - 款项管理
      x-permission-key:
        - lb_hk_conversion.forex_ib_rates
      x-lbonly: false
      description: |-
        新建参考汇率。提交时对记录日期做 YYYYMMDD 格式化、渠道多选转逗号字符串，并附带审计信息。数据变更类接口。

        ### 请求参数

        - 必填：`channel_name`（汇率渠道）、`source_from`（汇率来源）、`base_currency`（基础货币）、`other_currency`（对手方货币）、`record_date`（记录日期）、`bid_rate`（买入价）、`offer_rate`（卖出价）、`average_rate`（中间价）
        - 可选：`audit_frontend_resource`（审计上下文）
        - 各字段的格式、取值范围、默认行为和业务含义见对应字段说明。

        ### 处理结果

        成功时完成所述业务操作，具体返回内容见 `200` 响应定义。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - channel_name
                - source_from
                - base_currency
                - other_currency
                - record_date
                - bid_rate
                - offer_rate
                - average_rate
              properties:
                channel_name:
                  type: string
                  description: |-
                    汇率渠道. - 渠道/汇率类型，下拉选择
                    - 多选时以逗号拼接为字符串

                    **可选值：**
                    - `MANUAL_CURRENT` - 表示即期汇率
                    - `MANUAL_ACCOUNT` - 表示账面汇率
                    - `CCASS` - 表示港交所
                  example: MANUAL_CURRENT,MANUAL_ACCOUNT
                  enum:
                    - MANUAL_CURRENT
                    - MANUAL_ACCOUNT
                    - CCASS
                source_from:
                  type: string
                  description: |-
                    汇率来源. 汇率来源，单选，例如 SINGLE（单一货币对）

                    **可选值：**
                    - `CCASS` - 表示自动跟随港交所
                    - `SINGLE` - 表示单笔新增
                  enum:
                    - CCASS
                    - SINGLE
                base_currency:
                  type: string
                  description: 基础货币. 基准货币，下拉选择（币种列表，如 USD/HKD/CNH）
                other_currency:
                  type: string
                  description: 对手方货币. 对手货币，下拉选择（币种列表）
                record_date:
                  type: string
                  description: 记录日期. 记录日期，格式 YYYYMMDD，不能晚于当前时间
                bid_rate:
                  type: number
                  description: 买入价. 买入汇率，必须大于 0（精度按币种对配置）
                offer_rate:
                  type: number
                  description: 卖出价. 卖出汇率，必须大于 0（精度按币种对配置）
                average_rate:
                  type: number
                  description: 中间价. 中间汇率，必须大于 0（精度按币种对配置）
                audit_frontend_resource:
                  type: object
                  description: 审计上下文. 自动附加的审计字段，包含 $behavior（操作描述）与 $action（固定值 add）
            example:
              channel_name: MANUAL
              source_from: SINGLE
              base_currency: USD
              other_currency: HKD
              record_date: '20260710'
              bid_rate: 7.75
              offer_rate: 7.85
              average_rate: 7.8
              audit_frontend_resource:
                $behavior: 新建参考汇率
                $action: add
      responses:
        '200':
          description: 请求处理成功。响应的 `data` 不包含额外业务字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。

                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`
                      判断具体结果。

                      - `401`：未登录。
                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
