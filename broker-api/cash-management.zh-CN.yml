                        endpoint: GET /v1/datasets/refs/tenant_currencies
                    state:
                      type: string
                      description: 打包状态. 用于按「打包状态」筛选结果。
                      enum:
                        - '0'
                        - '1'
                        - '2'
                        - '4'
                        - '5'
                      x-enum-details:
                        - value: '0'
                          label: 已打包
                        - value: '1'
                          label: 审批中
                        - value: '2'
                          label: 已审核
                        - value: '4'
                          label: 已完成
                        - value: '5'
                          label: 已撤销
                      example: '0'
                    wd_id:
                      type: string
                      description: 提现单号. 用于按「提现单号」筛选结果。
                    created_at:
                      type: object
                      description: 创建时间. 用于按「创建时间」筛选结果。
                      properties:
                        gte:
                          type: string
                          description: 大于等于. 筛选范围的下限，匹配值包含该值。
                          format: date
                        lte:
                          type: string
                          description: 小于等于. 筛选范围的上限，匹配值包含该值。
                          format: date
                    approval_at:
                      type: object
                      description: 审核时间. 用于按「审核时间」筛选结果。
                      properties:
