                              description: 银行附言. **返回值：** 银行附言。
                            created_by:
                              type: string
                              description: 新增人. **返回值：** 新增人。
                            updated_at:
                              type: string
                              description: 更新时间. **返回值：** 更新时间；时间或日期格式以接口实际返回值为准。
                      total:
