openapi: 3.1.1
info:
  title: Longport Whale 券商 API
  description: 面向使用 Longport Whale 的券商提供机构级服务端 API。
  version: 2.0.0
servers:
  - url: https://b-api.longbridge.xyz
    description: 测试环境
  - url: https://b-api.lbkrs.com
    description: 生产环境
security:
  - bearerAuth: []
tags:
  - name: 款项管理
paths:
  /atm/add/order/remark:
    post:
      operationId: add_order_remark
      summary: 添加账单备注
      tags:
        - 款项管理
      x-permission-key:
        - atm.add_bill_remark
        - atm.order_remark_update
      x-lbonly: false
      description: |-
        为指定账单记录添加备注信息。

        ### 请求参数

        - 必填：`id`（关联 ID）、`type`（备注类型）
        - 各字段的格式、取值范围和业务含义见对应字段说明。

        ### 处理结果

        成功时完成上述业务操作；后续状态和返回数据以 `200` 响应定义为准。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
                - type
              properties:
                id:
                  type: string
                  description: 关联ID. 关联ID，用于标识本次请求关联的业务对象。此字段为必填项。
                type:
                  type: string
                  description: |-
                    备注类型。
                  enum:
                    - '1'
                    - '2'
                    - '3'
                    - '102'
                    - '103'
                    - '104'
                    - '105'
                    - '200'
                    - '202'
                    - '203'
                    - '204'
                    - '207'
                    - '208'
                  x-enum-details:
                    - value: '1'
                      label: 入金
                    - value: '2'
                      label: 银行账单
                    - value: '3'
                      label: 银行卡
                    - value: '102'
                      label: 入金匹配
                    - value: '103'
                      label: 转出仓位
                    - value: '104'
                      label: 转入明细
                    - value: '105'
                      label: 出金申请
                    - value: '200'
                      label: 出金/转入
                    - value: '202'
                      label: 取出明细
                    - value: '203'
                      label: 跨券商调拨
                    - value: '204'
                      label: 跨券商授权
                    - value: '207'
                      label: 入金用户明细
                    - value: '208'
                      label: 转体现审核
                  example: '1'
            example:
              id: 123
              type: '2'
      responses:
        '200':
          description: 请求处理成功。响应的 `data` 不包含额外业务字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。

                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`
                      判断具体结果。

                      - `401`：未登录。
                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400': &id001
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401': &id002
          description: 未登录或登录状态已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403': &id003
          description: 当前账号未获得该功能授权。请在 User Permission 中为该账号开通相应权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408': &id004
          description: 请求处理超时。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
      x-mint:
        href: /zh-CN/api-reference/add_order_remark
        metadata:
          sidebarTitle: 添加账单备注
  /atm/bills/upload:
    post:
      operationId: atm_bills_upload
      summary: 银行账单手动导入（通用模板）
      tags:
        - 款项管理
      x-permission-key:
        - accounting.accounting_deposit
      x-lbonly: false
      description: |-
        按通用模板手动导入某个长桥收款银行账户的银行账单文件，用于后续对账与打标。

        ### 请求参数

        - 必填：`lb_bank_account_id`（LB 银行账户）、`file`（文件 Key）、`ext`（文件后缀）
        - 各字段的格式、取值范围和业务含义见对应字段说明。

        ### 业务说明

        导入的账单将进入对账流程，请确认文件与目标银行账户匹配。

        ### 处理结果

        成功时完成上述业务操作；后续状态和返回数据以 `200` 响应定义为准。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - lb_bank_account_id
                - file
                - ext
              properties:
                lb_bank_account_id:
                  type: number
                  description: LB银行账户. 用于指定「LB银行账户」。此字段为必填项。
                file:
                  type: string
                  description: 文件Key. 文件上传后返回的对象存储 Key，用于定位本次请求处理的文件。此字段为必填项。
                ext:
                  type: string
                  description: 文件后缀. 如 csv/xls/xlsx
            example:
              lb_bank_account_id: 张三
              file: s3-key
              ext: csv
      responses:
        '200':
          description: 请求处理成功。响应的 `data` 不包含额外业务字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。

                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`
                      判断具体结果。

                      - `401`：未登录。
                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登录或登录状态已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 当前账号未获得该功能授权。请在 User Permission 中为该账号开通相应权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 请求处理超时。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
      x-mint:
        href: /zh-CN/api-reference/atm_bills_upload
        metadata:
          sidebarTitle: 银行账单手动导入（通用模板）
  /atm/bank/bill/update/visible:
