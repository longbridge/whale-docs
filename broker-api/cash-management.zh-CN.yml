                    - MANUAL_ACCOUNT
                    - CCASS
                  x-enum-details:
                    - value: MANUAL_CURRENT
                      label: 即期汇率
                    - value: MANUAL_ACCOUNT
                      label: 账面汇率
                    - value: CCASS
                      label: 港交所
                source_from:
                  type: string
                  description: 汇率来源. 汇率来源，单选，例如 SINGLE（单一货币对）
                  enum:
                    - CCASS
                    - SINGLE
                  x-enum-details:
                    - value: CCASS
                      label: 自动跟随港交所
                    - value: SINGLE
                      label: 单笔新增
                  example: CCASS
