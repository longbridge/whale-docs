                      type: string
                      description: |-
                        原入金银行. 用于按「原入金银行」筛选结果。

                        候选值会动态变化。请调用 `GET /v1/datasets/refs/region_banks_no_default` 获取当前可用的数据字典，并使用返回项的 `key` 作为本参数值。
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/region_banks_no_default
                    remark:
                      type: string
                      description: 备注. 用于按「备注」筛选结果。
                    state:
                      type: string
                      description: |-
                        提现状态. 用于按「提现状态」筛选结果。

                        支持多选；提交时使用英文逗号（`,`）拼接多个值。不传时不按此字段筛选。

                        **可选值：**
                        - `0` - 表示未知
                        - `1` - 表示未处理
                        - `2` - 表示处理中
                        - `3` - 表示成功
                        - `4` - 表示失败
                        - `5` - 表示已撤销
                        - `6` - 表示已退还
                        - `7` - 表示更新结果审批中
                        - `8` - 表示已删除
                      example: 0,1
                      enum:
                        - '0'
                        - '1'
                        - '2'
                        - '3'
                        - '4'
                        - '5'
                        - '6'
                        - '7'
                        - '8'
                    withdraw_type:
                      type: string
                      description: |-
                        提现类型. 用于按「提现类型」筛选结果。

                        **可选值：**
                        - `1,` - 表示用户提现
                        - `3,` - 表示入金退还
                        - `7,` - 表示原路退回
                        - `,1` - 表示手工提现
                        - `6,` - 表示银行端提现
                      enum:
                        - 1,
                        - 3,
                        - 7,
                        - ',1'
                        - 6,
                    bills_id:
                      type: string
                      description: 出金账单编号. 用于按「出金账单编号」筛选结果。
                    created_at:
                      type: object
                      description: 创建时间. 用于按「创建时间」筛选结果。
                      properties:
                        gte:
                          type: string
                          description: 大于等于. 筛选范围的下限，匹配值包含该值。
                          format: date
                        lte:
                          type: string
                          description: 小于等于. 筛选范围的上限，匹配值包含该值。
                          format: date
                    lb_bank_channel_id:
                      type: string
                      description: |-
                        渠道. 用于按「渠道」筛选结果。

                        候选值会动态变化。请调用 `GET /v1/datasets/refs/pending_withdraw_bank_names` 获取当前可用的数据字典，并使用返回项的 `key` 作为本参数值。
