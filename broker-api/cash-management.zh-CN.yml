  /v1/atm/import/batch/withdraw/file:
    post:
      operationId: import_batch_withdraw_file
      summary: 银行标准模板批量导入
      tags:
        - 款项管理
      x-permission-key:
        - accounting.accounting_deposit
        - atm.import_batch_withdraw
        - atm.rollover_stock_limit_update
      x-lbonly: false
      description: |-
        按银行标准模板批量导入出金文件，用于批量创建出金处理记录。

        ### 请求参数

        - 必填：`file_key`（文件 Key）
        - 可选：`business_type`（业务类型）、`file_name`（文件名）、`redirect_uri`（回调地址）、`audit_frontend_resource`（审计上下文）
        - 各字段的格式、取值范围和业务含义见对应字段说明。

        ### 业务说明

        导入的文件涉及批量出金，请确认文件内容准确无误。

        ### 风险提示

        此操作可能引起真实资金、持仓或交易状态变化。调用前请确认目标记录和参数无误。

        ### 处理结果

        成功时完成上述业务操作；后续状态和返回数据以 `200` 响应定义为准。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - file_key
              properties:
                file_key:
                  type: string
                  description: 文件Key. 文件上传后返回的对象存储 Key，用于定位本次请求处理的文件。此字段为必填项。
                business_type:
                  type: string
                  description: 业务类型. 用于区分本次请求适用的业务场景。
                file_name:
                  type: string
                  description: 文件名. 本次请求处理的文件名，包含文件扩展名。
                redirect_uri:
                  type: string
                  description: 回调地址. 用于指定「回调地址」。
                audit_frontend_resource:
                  type: object
                  description: 审计上下文. 调用方提交的审计上下文，用于记录本次操作。
            example:
              file_key: s3-key
              business_type: ''
              file_name: bills.xlsx
      responses:
        '200':
          description: 请求处理成功。响应的 `data` 不包含额外业务字段。
          content:
            application/json:
              schema:
