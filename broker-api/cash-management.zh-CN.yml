    get:
      operationId: atm_deposit_match_details
      summary: 入金匹配
      tags:
        - 款项管理
      x-permission-key:
        - cmbc.hk_deposit_detail
      x-lbonly: false
      description: |-
        查询「入金匹配」数据，可通过 `filters` 组合业务筛选条件，并使用 `page`、`page_size` 和 `orderBy` 控制分页与排序。

        ### 返回结果

        成功时返回匹配的记录列表及分页信息。各过滤字段的用途、可选值和动态数据来源见对应字段说明。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 过滤条件. 组合业务过滤条件。省略某个过滤字段时，不按该字段筛选。
                  properties:
                    bank_account:
                      type: string
                      description: 付款方银行账号. 用于按「付款方银行账号」筛选结果。
                    id:
                      type: string
                      description: 入金账单编号. 用于按「入金账单编号」筛选结果。
                    bank_user_name:
                      type: string
                      description: 付款方姓名. 用于按「付款方姓名」筛选结果。
                    currency:
                      type: string
                      description: |-
                        币种. 用于按「币种」筛选结果。

                        候选值会动态变化。请调用 `GET /v1/datasets/refs/tenant_currencies_by_channel` 获取当前可用的数据字典，并使用返回项的 `key` 作为本参数值。
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/tenant_currencies_by_channel
                    bank_remark:
                      type: string
                      description: 银行附言. 用于按「银行附言」筛选结果。
                    amount:
                      type: object
                      description: 金额. 用于按「金额」筛选结果。
                      properties:
                        gte:
                          type: number
                          description: 大于等于. 筛选范围的下限，匹配值包含该值。
                        lte:
                          type: number
                          description: 小于等于. 筛选范围的上限，匹配值包含该值。
                    bank_busi_type:
                      type: string
                      description: 业务种类. 用于按「业务种类」筛选结果。
                    remark:
                      type: string
                      description: 备注. 用于按「备注」筛选结果。
                    remark_empty:
                      type: string
                      description: 备注是否为空. 用于按「备注是否为空」筛选结果。
                page:
                  type: integer
                  description: 页码. 要查询的页码，从 `1` 开始。
                page_size:
                  type: integer
                  description: 每页数量. 每页返回的记录数量。
                orderBy:
                  type: array
                  description: 排序参数. 排序规则数组；每一项定义一个排序字段及排序方向。
                  items:
                    type: object
            example:
              filters: {}
              page: 1
              page_size: 20
              orderBy: []
      responses:
        '200':
          description: 成功时分页返回「入金匹配」记录，以及页码、每页数量和总记录数等分页信息。
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。

                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`
                      判断具体结果。

                      - `401`：未登录。
                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。
                  message:
                    type: string
                  data:
                    type: object
                    required:
                      - list
                      - total
                    properties:
                      list:
                        type: array
                        description: 列表. **返回值：** 列表列表。
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: 入金账单编号. **返回值：** 当前记录的唯一标识。
                            bank_account:
                              type: string
                              description: 付款方银行账号. **返回值：** 付款方银行账号。
                            bank_user_name:
                              type: string
                              description: 付款方姓名. **返回值：** 付款方姓名。
                            currency:
                              type: string
                              description: 币种. **返回值：** 币种。
                            currency_val:
                              type: string
                              description: 币种（原始值）. 字段 currency 的原始值：currency 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
