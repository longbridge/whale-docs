  /v1/datasets/atm_forex_orders:
    get:
      operationId: atm_forex_orders
      summary: 客户汇兑
      tags:
        - 款项管理
      x-permission-key:
        - lb_hk_conversion.userexchangebill_query
      x-lbonly: false
      description: |-
        查询「客户汇兑」数据，可通过 `filters` 组合业务筛选条件，并使用 `page`、`page_size` 和 `orderBy` 控制分页与排序。

        ### 返回结果

        成功时返回匹配的记录列表及分页信息。各过滤字段的用途、可选值和动态数据来源见对应字段说明。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 过滤条件. 组合业务过滤条件。省略某个过滤字段时，不按该字段筛选。
                  properties:
                    forex_id:
                      type: string
                      description: 客户汇兑单号. 用于按「客户汇兑单号」筛选结果。
                    client_ordid:
                      type: string
                      description: 渠道汇兑单号. 用于按「渠道汇兑单号」筛选结果。
                    member_id:
                      type: string
                      description: 客户编号. 用于按「客户编号」筛选结果。
                    forex_type:
                      type: string
                      description: |-
                        汇兑类型. 用于按「汇兑类型」筛选结果。

                        **可选值：** `FROM`、`TO`
                      enum:
                        - FROM
                        - TO
                    from_currency:
                      type: string
                      description: |-
                        兑出币种. 用于按「兑出币种」筛选结果。

                        候选值会动态变化。请调用 `GET /v1/datasets/refs/tenant_currencies_by_channel` 获取当前可用的数据字典，并使用返回项的 `key` 作为本参数值。
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/tenant_currencies_by_channel
                    to_currency:
                      type: string
                      description: |-
                        兑入币种. 用于按「兑入币种」筛选结果。

                        候选值会动态变化。请调用 `GET /v1/datasets/refs/tenant_currencies_by_channel` 获取当前可用的数据字典，并使用返回项的 `key` 作为本参数值。
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/tenant_currencies_by_channel
                    created_at:
                      type: object
                      description: 创建时间. 用于按「创建时间」筛选结果。
                      properties:
                        gte:
                          type: string
                          description: 大于等于. 筛选范围的下限，匹配值包含该值。
                          format: date
                        lte:
                          type: string
                          description: 小于等于. 筛选范围的上限，匹配值包含该值。
                          format: date
                    success_time:
                      type: object
                      description: 汇兑完成时间. 用于按「汇兑完成时间」筛选结果。
                      properties:
                        gte:
                          type: string
                          description: 大于等于. 筛选范围的下限，匹配值包含该值。
                          format: date-time
                        lte:
                          type: string
                          description: 小于等于. 筛选范围的上限，匹配值包含该值。
                          format: date-time
                    audit_status:
                      type: string
                      description: |-
                        审核状态. 用于按「审核状态」筛选结果。

                        **可选值：**
                        - `WAIT_AUDIT` - 表示待审核
                        - `REJECTED_AUDIT` - 表示已驳回
                        - `APPROVED_AUDIT` - 表示已审核
                      enum:
                        - WAIT_AUDIT
                        - REJECTED_AUDIT
                        - APPROVED_AUDIT
                    origin:
                      type: string
                      description: |-
                        汇兑来源. 用于按「汇兑来源」筛选结果。

                        **可选值：**
                        - `0` - 表示用户
                        - `1` - 表示后台人工
                        - `2` - 表示 WAS
                        - `3` - 表示自动还款
                        - `4` - 表示强制换汇
                      enum:
                        - '0'
                        - '1'
                        - '2'
                        - '3'
                        - '4'
                page:
                  type: integer
                  description: 页码. 要查询的页码，从 `1` 开始。
                page_size:
                  type: integer
                  description: 每页数量. 每页返回的记录数量。
                orderBy:
                  type: array
                  description: 排序参数. 排序规则数组；每一项定义一个排序字段及排序方向。
                  items:
                    type: object
            example:
              filters: {}
              page: 1
              page_size: 20
              orderBy: []
      responses:
