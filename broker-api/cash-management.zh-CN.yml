      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - channel_name
                - source_from
                - base_currency
                - other_currency
                - record_date
                - bid_rate
                - offer_rate
                - average_rate
              properties:
                channel_name:
                  type: string
                  description: |-
                    汇率渠道. - 渠道/汇率类型，从可选值中选择
                    - 多选时以逗号拼接为字符串
                  example: MANUAL_CURRENT,MANUAL_ACCOUNT
                  enum:
