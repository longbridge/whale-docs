                        endpoint: GET /v1/datasets/refs/receiving_bank_accounts_with_names
                    states:
                      type: string
                      description: 提现状态. 用于按「提现状态」筛选结果。
                    batch_state:
                      type: string
                      description: |-
                        批次状态. 用于按「批次状态」筛选结果。

                        **可选值：**
                        - `0` - 表示已打包
                        - `1` - 表示审批中
                        - `2` - 表示已审核
                        - `4` - 表示已完成
                        - `5` - 表示已撤销
                      enum:
                        - '0'
                        - '1'
                        - '2'
                        - '4'
                        - '5'
                    bank_channel_serial_no:
                      type: string
                      description: 网银流水号. 用于按「网银流水号」筛选结果。
                    hit_rules:
                      type: string
                      description: |-
                        命中规则. 用于按「命中规则」筛选结果。

                        候选值会动态变化。请调用 `GET /v1/datasets/refs/risk_rule_indicators_withdraw` 获取当前可用的数据字典，并使用返回项的 `key` 作为本参数值。
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/risk_rule_indicators_withdraw
                page:
                  type: integer
                  description: 页码. 要查询的页码，从 `1` 开始。
                page_size:
                  type: integer
                  description: 每页数量. 每页返回的记录数量。
                orderBy:
                  type: array
                  description: 排序参数. 排序规则数组；每一项定义一个排序字段及排序方向。
                  items:
                    type: object
            example:
              filters: {}
              page: 1
              page_size: 20
              orderBy: []
      responses:
        '200':
