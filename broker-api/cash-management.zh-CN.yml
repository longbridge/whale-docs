        - 款项管理
      x-permission-key:
        - accounting.accounting_deposit
      x-lbonly: false
      description: |-
        银行账单手动导入（通用模板）。

        ### 请求参数

        - 必填：`lb_bank_account_id`（LB银行账户）、`file`（文件Key）、`ext`（文件后缀）
        - 各字段的格式、取值范围和业务含义见对应字段说明。

        ### 处理结果

        成功时完成上述业务操作；后续状态和返回数据以 `200` 响应定义为准。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - lb_bank_account_id
                - file
                - ext
              properties:
                lb_bank_account_id:
                  type: number
                  description: LB银行账户. 用于指定「LB银行账户」。此字段为必填项。
                file:
                  type: string
                  description: 文件Key. 文件上传后返回的对象存储 Key，用于定位本次请求处理的文件。此字段为必填项。
                ext:
                  type: string
                  description: 文件后缀. 如 csv/xls/xlsx
