  /v1/datasets/atm_withdraw_cards:
    get:
      operationId: atm_withdraw_cards
      summary: 客户银行卡
      tags:
        - 款项管理
      x-permission-key:
        - lb_account_withdraw_card.list
        - atm.withdrawal_marking
      x-lbonly: false
      description: |-
        查询「客户银行卡」数据，可通过 `filters` 组合业务筛选条件，并使用 `page`、`page_size` 和 `orderBy` 控制分页与排序。

        ### 返回结果

        成功时返回匹配的记录列表及分页信息。各过滤字段的用途、可选值和动态数据来源见对应字段说明。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 过滤条件. 组合业务过滤条件。省略某个过滤字段时，不按该字段筛选。
                  properties:
                    member_id:
                      type: string
                      description: 客户. 用于按「客户」筛选结果。
                    member_id_list:
                      type: string
                      description: 客户列表. 用于按「客户列表」筛选结果。
                    raw_member_id:
                      type: string
                      description: 客户编号. 用于按「客户编号」筛选结果。
                    id:
                      type: string
                      description: 客户银行卡编号. 用于按「客户银行卡编号」筛选结果。
                    account_type:
                      type: string
                      description: |-
                        币种. 用于按「币种」筛选结果。

                        候选值会动态变化。请调用 `GET /v1/datasets/refs/company_account_types` 获取当前可用的数据字典，并使用返回项的 `key` 作为本参数值。
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/company_account_types
                    status:
                      type: string
                      description: |-
                        认证状态. 用于按「认证状态」筛选结果。

                        **可选值：**
                        - `0` - 表示未认证
                        - `1` - 表示待认证
                        - `2` - 表示已认证
                      enum:
                        - '0'
                        - '1'
                        - '2'
                    account:
                      type: string
                      description: 银行账号. 用于按「银行账号」筛选结果。
                    country:
                      type: string
                      description: 国家 / 地区. 用于按「国家 / 地区」筛选结果。
                    fps_id:
                      type: string
                      description: FPS ID. 用于按「FPS ID」筛选结果。
                    created_at:
                      type: object
                      description: 创建时间. 用于按「创建时间」筛选结果。
                      properties:
                        gte:
                          type: string
                          description: 大于等于. 筛选范围的下限，匹配值包含该值。
                          format: date
                        lte:
                          type: string
                          description: 小于等于. 筛选范围的上限，匹配值包含该值。
                          format: date
                    name_en:
                      type: string
                      description: 银行卡名称. 用于按「银行卡名称」筛选结果。
                    region:
                      type: string
                      description: |-
                        银行账户地区. 用于按「银行账户地区」筛选结果。

                        候选值会动态变化。请调用 `GET /v1/datasets/refs/regions` 获取当前可用的数据字典，并使用返回项的 `key` 作为本参数值。
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/regions
                    bank_code:
                      type: string
                      description: |-
                        银行代码. 用于按「银行代码」筛选结果。

                        候选值会动态变化。请调用 `GET /v1/datasets/refs/region_banks_code` 获取当前可用的数据字典，并使用返回项的 `key` 作为本参数值。
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/region_banks_code
                    multi_name:
                      type: string
                      description: 银行名称. 用于按「银行名称」筛选结果。
                page:
                  type: integer
                  description: 页码. 要查询的页码，从 `1` 开始。
                page_size:
                  type: integer
                  description: 每页数量. 每页返回的记录数量。
                orderBy:
                  type: array
                  description: 排序参数. 排序规则数组；每一项定义一个排序字段及排序方向。
                  items:
                    type: object
