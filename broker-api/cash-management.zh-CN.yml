        仅未匹配的账单可冻结。

        ### 风险提示

        此操作可能引起真实资金、持仓或交易状态变化。调用前请确认目标记录和参数无误。

        ### 处理结果

        成功时完成上述业务操作；后续状态和返回数据以 `200` 响应定义为准。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
                - audit_frontend_resource
              properties:
                id:
                  type: string
                  description: 账单ID. 账单ID，用于标识本次请求关联的业务对象。此字段为必填项。
                audit_frontend_resource:
                  type: object
                  description: 审计上下文. 含 $behavior/$action/currency/amount，由调用方按固定结构组装
            example:
              id: 123
      responses:
        '200':
