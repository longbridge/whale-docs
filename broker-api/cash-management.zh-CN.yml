                        endpoint: GET /v1/datasets/refs/pending_withdraw_bank_names
                    charge_type:
                      type: string
                      description: |-
                        费用承担方式. 用于按「费用承担方式」筛选结果。

                        **可选值：** `SHA`、`OUR`、`BEN`
                      enum:
                        - SHA
                        - OUR
                        - BEN
                    id:
                      type: string
                      description: 提现单号. 用于按「提现单号」筛选结果。
                    to_bank_account:
                      type: string
                      description: 收款方账号. 用于按「收款方账号」筛选结果。
                    to_bank_name:
                      type: string
                      description: 收款方银行. 用于按「收款方银行」筛选结果。
                    to_name:
                      type: string
                      description: 收款方名称. 用于按「收款方名称」筛选结果。
                    amount:
                      type: object
                      description: 申请金额. 用于按「申请金额」筛选结果。
                      properties:
                        gte:
                          type: number
                          description: 大于等于. 筛选范围的下限，匹配值包含该值。
                        lte:
                          type: number
                          description: 小于等于. 筛选范围的上限，匹配值包含该值。
                    updated_at:
                      type: object
                      description: 更新时间. 用于按「更新时间」筛选结果。
                      properties:
                        gte:
                          type: string
                          description: 大于等于. 筛选范围的下限，匹配值包含该值。
                          format: date-time
                        lte:
                          type: string
                          description: 小于等于. 筛选范围的上限，匹配值包含该值。
                          format: date-time
                    account_at:
                      type: object
                      description: 出账日期. 用于按「出账日期」筛选结果。
                      properties:
                        gte:
                          type: string
                          description: 大于等于. 筛选范围的下限，匹配值包含该值。
                          format: date-time
                        lte:
                          type: string
                          description: 小于等于. 筛选范围的上限，匹配值包含该值。
                          format: date-time
                    bank_name:
                      type: string
                      description: |-
                        公司银行. 用于按「公司银行」筛选结果。

