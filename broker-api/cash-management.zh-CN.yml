  /v1/datasets/booking_reconciliation_batches_withdraw:
    post:
      operationId: booking_reconciliation_batches_withdraw
      summary: 出金对账
      tags:
        - 款项管理
      x-permission-key:
        - cmbc.reconciliation_deposit_withdraw_query
      x-lbonly: false
      description: |-
        查询「出金对账批次」数据，可通过 `filters` 组合业务筛选条件，并使用 `page`、`page_size`、`orderBy` 控制分页与排序。

        ### 返回结果

        成功时返回匹配的记录列表及分页信息。各过滤字段的用途、可选值和动态数据来源见对应字段说明。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 过滤条件. 组合业务过滤条件。省略某个过滤字段时，不按该字段筛选。
                  properties:
                    lb_bank_account_id:
                      type: string
                      description: |-
                        银行账号. 用于按「银行账号」筛选结果。

                        候选值会动态变化。请调用 `GET /v1/datasets/refs/company_bank_account_config` 获取当前可用的数据字典，并使用返回项的 `key` 作为本参数值。
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/company_bank_account_config
                    trade_date:
                      type: string
                      description: 对账日期. 用于按「对账日期」筛选结果。
                      format: date
                    currency:
                      type: string
                      description: |-
                        币种. 用于按「币种」筛选结果。

                        候选值会动态变化。请调用 `GET /v1/datasets/refs/tenant_currencies_by_channel` 获取当前可用的数据字典，并使用返回项的 `key` 作为本参数值。
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/tenant_currencies_by_channel
                    state:
                      type: string
                      description: 对账结果. 用于按「对账结果」筛选结果。
                      enum:
                        - '1'
                        - '2'
                      x-enum-details:
                        - value: '1'
                          label: 平账
                        - value: '2'
                          label: 不一致
                      example: '1'
                page:
                  type: integer
                  description: 页码. 要查询的页码，从 `1` 开始。
                page_size:
                  type: integer
                  description: 每页数量. 每页返回的记录数量。
                orderBy:
                  type: array
                  description: 排序参数. 排序规则数组；每一项定义一个排序字段及排序方向。
                  items:
                    type: object
            example:
              filters: {}
              page: 1
              page_size: 20
              orderBy: []
      responses:
        '200':
          description: 成功时分页返回「出金对账」记录，以及页码、每页数量和总记录数等分页信息。
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。

                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`
                      判断具体结果。

                      - `401`：未登录。
                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。
                  message:
                    type: string
                  data:
                    type: object
                    required:
                      - list
                      - total
                    properties:
                      list:
                        type: array
                        description: 列表. **返回值：** 列表列表。
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: 核对编号. **返回值：** 当前记录的唯一标识。
                            trade_date:
                              type: string
                              description: 对账日期. **返回值：** 对账日期；时间或日期格式以接口实际返回值为准。
                            lb_simple_name:
                              type: string
                              description: 银行简称. **返回值：** 银行简称。
                            lb_bank_account:
                              type: string
                              description: 银行账号. **返回值：** 银行账号。
                            lb_bank_name:
                              type: string
                              description: 银行名称. **返回值：** 银行名称。
                            currency:
                              type: string
                              description: 币种. **返回值：** 币种。
                            upstream_amount:
                              type: string
                              description: 本端累计金额. **返回值：** 本端累计金额。
                            upstream_count:
                              type: string
                              description: 本端累计笔数. **返回值：** 本端累计笔数。
                            downstream_amount:
                              type: string
                              description: 对端累计金额. **返回值：** 对端累计金额。
                            downstream_count:
                              type: string
                              description: 对端累计笔数. **返回值：** 对端累计笔数。
                            flat_count:
                              type: string
                              description: 平账笔数. **返回值：** 平账笔数。
                            flat_amount:
                              type: string
                              description: 平账金额. **返回值：** 平账金额。
                            state:
                              type: string
                              description: 对账结果. **返回值：** 对账结果。
                            state_val:
                              type: string
                              description: 对账结果（原始值）. 字段 state 的原始值：state 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            created_at:
                              type: string
                              description: 创建时间. **返回值：** 创建时间；时间或日期格式以接口实际返回值为准。
                      total:
                        type: integer
                        description: 总条数. **返回值：** 符合查询条件的记录总数，用于计算分页。
              example:
                code: 0
                message: success
                data:
                  list:
                    - id: '167149'
                      trade_date: '20260716'
                      lb_simple_name: '111'
                      lb_bank_account: 张三
                      lb_bank_name: 353-353 China Minsheng Bank Corp.,
                      currency: HKD
                      upstream_amount: 7,769.89
                      upstream_count: '28'
