  /ob/create/record:
    post:
      operationId: ob_create_record
      summary: 创建OB申购同步记录
      tags:
        - 新股认购
      x-permission-key:
        - ipo.ob_manage
      x-lbonly: false
      description: |-
        申购记录同步 (Subscription Record Synchronization) 的「新建」和行内「重试」共用的接口，用于创建 OB 申购同步记录。

        ### 请求参数

        - 必填：`counter_id`（标的代码）、`records`（同步记录列表）、`records[].channel`（原渠道）、`records[].method`（认购方式）、`records[].ratio`（认购比例）、`records[].target_method`（目标认购方式）、`records[].target_ratio`（目标认购比例）、`is_retry`（是否重试）
        - 各字段的格式、取值范围、默认行为和业务含义见对应字段说明。

        ### 处理结果

        成功时完成所述业务操作，具体返回内容见 `200` 响应定义。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - counter_id
                - records
                - records[].channel
                - records[].method
                - records[].ratio
                - records[].target_method
                - records[].target_ratio
                - is_retry
              properties:
                counter_id:
                  type: string
                  description: 标的代码. 证券或基金标的代码，用于定位本次请求处理的标的。此字段为必填项。
                records:
                  type: array
                  description: 同步记录列表. 每项为一条渠道同步配置；新建时为勾选的记录（过滤掉渠道为空的行），重试时为当前行数据组成的单元素数组
                  items:
                    type: string
                records[].channel:
                  type: string
                  description: 原渠道. 用于指定「原渠道」。此字段为必填项。
                records[].method:
                  type: string
                  description: 认购方式. 用于指定「认购方式」。此字段为必填项。
                records[].ratio:
                  type: string
                  description: 认购比例. 百分比数值，去掉 % 符号后传字符串，如 "100" 表示 100%
                records[].target_method:
                  type: string
                  description: 目标认购方式. 用于指定「目标认购方式」。此字段为必填项。
                records[].target_ratio:
                  type: string
                  description: 目标认购比例. 目标认购比例，百分比数值，去掉 % 符号后传字符串
                is_retry:
                  type: boolean
                  description: 是否重试. 新建操作传 false；「重试」操作传 true
            example:
              counter_id: '10086'
              records:
                - channel: CH001
                  method: '1'
                  ratio: '100'
                  target_method: '2'
                  target_ratio: '100'
              is_retry: false
      responses:
        '200':
          description: 请求处理成功。响应的 `data` 不包含额外业务字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。

                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`
                      判断具体结果。

                      - `401`：未登录。
                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登录或登录状态已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 当前账号未获得该功能授权。请在 User Permission 中为该账号开通相应权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 请求处理超时。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
