openapi: 3.1.1
info:
  title: Longport Whale 券商 API
  description: 面向使用 Longport Whale 的券商提供机构级服务端 API。
  version: 2.0.0
servers:
  - url: https://b-api.longbridge.xyz
    description: 测试环境
  - url: https://b-api.lbkrs.com
    description: 生产环境
security:
  - bearerAuth: []
tags:
  - name: 新股认购
paths:
  /v2/ipo/subscription/detail:
    get:
      operationId: ipo_hk_subscription_detail
      summary: 港股认购信息详情
      tags:
        - 新股认购
      x-permission-key:
        - ipo.subscription_manage
      x-lbonly: false
      description: |-
        港股认购信息详情。

        ### 请求参数

        - 必填：`counter_id`（标的 ID）
        - 各字段的格式、取值范围和业务含义见对应字段说明。

        ### 处理结果

        返回查询结果，字段见 `200` 响应定义。
      security:
        - bearerAuth: []
      parameters:
        - name: counter_id
          in: query
          required: true
          description: 用于指定「标的 ID」。此字段为必填项。
          schema:
            type: string
      responses:
        '200':
          description: 请求处理成功。`data` 为该标的的港股认购配置详情。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。

                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`
                      判断具体结果。

                      - `401`：未登录。
                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        description: ID. 用于指定「ID」。
                      counter_id:
                        type: string
                        description: 标的 ID. 用于指定「标的 ID」。
                      can_subscribe:
                        type: integer
                        description: 是否可认购. 用于指定「是否可认购」。
                      apply_start_date:
                        type: string
                        description: 认购开始日. 用于指定「认购开始日」。
                      cash_end_date:
                        type: string
                        description: 现金截止日. 用于指定「现金截止日」。
                      margin_end_date:
                        type: string
                        description: 融资截止日. 用于指定「融资截止日」。
                      charge_date:
                        type: string
                        description: 扣款日. 用于指定「扣款日」。
                      tags:
                        type: object
                        description: 标签. 用于指定「标签」。
                        properties:
                          zh_cn:
                            type: array
                            description: 简体中文. 用于指定「简体中文」。
                            items:
                              type: string
                          zh_hk:
                            type: array
                            description: 繁体中文. 用于指定「繁体中文」。
                            items:
                              type: string
                          en:
                            type: array
                            description: 英文. 用于指定「英文」。
                            items:
                              type: string
                      subscription_method:
                        type: object
                        description: 认购方式. 用于指定「认购方式」。
                        properties:
                          zh_cn:
                            type: string
                            description: 简体中文. 用于指定「简体中文」。
                          zh_hk:
                            type: string
                            description: 繁体中文. 用于指定「繁体中文」。
                          en:
                            type: string
                            description: 英文. 用于指定「英文」。
                      buying_power:
                        type: object
                        description: 购买力. 用于指定「购买力」。
                        properties:
                          zh_cn:
                            type: string
                            description: 简体中文. 用于指定「简体中文」。
                          zh_hk:
                            type: string
                            description: 繁体中文. 用于指定「繁体中文」。
                          en:
                            type: string
                            description: 英文. 用于指定「英文」。
                      financing_interest:
                        type: object
                        description: 融资利息. 用于指定「融资利息」。
                        properties:
                          zh_cn:
                            type: string
                            description: 简体中文. 用于指定「简体中文」。
                          zh_hk:
                            type: string
                            description: 繁体中文. 用于指定「繁体中文」。
                          en:
                            type: string
                            description: 英文. 用于指定「英文」。
                      cut_off_time:
                        type: object
                        description: 截止时间. 用于指定「截止时间」。
                        properties:
                          zh_cn:
                            type: string
                            description: 简体中文. 用于指定「简体中文」。
                          zh_hk:
                            type: string
                            description: 繁体中文. 用于指定「繁体中文」。
                          en:
                            type: string
                            description: 英文. 用于指定「英文」。
                      financing_estimate:
                        type: object
                        description: 融资预估. 用于指定「融资预估」。
                        properties:
                          zh_cn:
                            type: string
                            description: 简体中文. 用于指定「简体中文」。
                          zh_hk:
                            type: string
                            description: 繁体中文. 用于指定「繁体中文」。
                          en:
                            type: string
                            description: 英文. 用于指定「英文」。
                      notice:
                        type: object
                        description: 提示. 用于指定「提示」。
                        properties:
                          zh_cn:
                            type: string
                            description: 简体中文. 用于指定「简体中文」。
                          zh_hk:
                            type: string
                            description: 繁体中文. 用于指定「繁体中文」。
                          en:
                            type: string
                            description: 英文. 用于指定「英文」。
                      user_group_ids:
                        type: array
                        description: 用户分群 ID 列表. 用于指定「用户分群 ID 列表」。
                        items:
                          type: integer
                      pi_certification:
                        type: integer
                        description: PI 认证. 用于指定「PI 认证」。
                      rate_id:
                        type: integer
                        description: 费率 ID. 用于指定「费率 ID」。
                      cash_channel:
                        type: string
                        description: 现金渠道. 用于指定「现金渠道」。
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登录或登录状态已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 当前账号未获得该功能授权。请在 User Permission 中为该账号开通相应权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 请求处理超时。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
