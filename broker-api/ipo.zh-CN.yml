                                type: string
                                description: 简体中文. 用于指定「简体中文」。
                              zh_hk:
                                type: string
                                description: 繁体中文. 用于指定「繁体中文」。
                              en:
                                type: string
                                description: 英文. 用于指定「英文」。
                          financing_interest:
                            type: object
                            description: 融资利息. 用于指定「融资利息」。
                            properties:
