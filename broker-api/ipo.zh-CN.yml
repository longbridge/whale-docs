  /v2/ipo/margin/edit:
    post:
      operationId: ipo_margin_edit
      summary: 编辑融资批次
      tags:
        - 新股认购
      x-permission-key:
        - ipo.financing_batch
      x-lbonly: false
      description: |-
        编辑融资批次。

        ### 请求参数

        - 必填：`id`（批次索引号）、`financing_limit`（用户单笔融资上限）、`cost_charge_value`（计费值）、`rate_day_count`（年利率天数）
        - 可选：`cost_rate`（成本费率）、`interest_start_at`（计息开始时间）、`interest_end_at`（计息结束时间）、`interest_days`（计息天数）、`financing_multiple`（用户融资倍数）、`label`（特殊标签）、`parent`（父节点 ID）、`ended_at`（截止时间戳）、`lb_interest_days`（长桥成本计息天数）、`minimum_amount`（最低可用融资金额）、`display_label`（专属融资池展示名称）、`start_at`（融资池启用时间）、`financing_min`（融资下限）、`cost_charge_mode`（成本计费方式）、`cost_charge_note`（成本计费备注）、`bank_ratio`（银行融资比例）、`minimum_cash`（最低认购本金）
        - 各字段的格式、取值范围和业务含义见对应字段说明。

        ### 处理结果

        返回被修改的融资批次 ID。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
                - financing_limit
                - cost_charge_value
                - rate_day_count
              properties:
                id:
                  type: integer
                  description: 批次索引号. 用于指定「批次索引号」。此字段为必填项。
                cost_rate:
                  type: string
                  description: 成本费率. 用于指定「成本费率」。
