openapi: 3.1.1
info:
  title: Whale OpenAPI (whale-openapi-docs 自动生成)
  version: 1.0.0
servers:
- url: https://b-api.longbridge.xyz
  description: 测试环境
- url: https://b-api.lbkrs.com
  description: 生产环境
security:
- bearerAuth: []
tags:
- name: 交易面板
  description: 订单管理、基金下单/批量下单等交易面板相关的后台管理接口。
paths:
  /ut/order/admin/submit:
    post:
      operationId: fund_order_submit
      summary: 后台代客提交基金订单
      tags:
      - 交易面板
      x-permission-key:
      - lb_hk_order_pots.ut_order_submit
      x-lbonly: false
      description: '后台代客提交基金订单。


        ### 请求参数


        - 必填：`aaid`（客户资产账号）、`member_id`（客户ID）、`account_channel`（账户渠道）、`currency`（币种）、`counter_id`（基金代码）、`action`（买卖方向）

        - 可选：`fund_channel`（基金渠道）、`amount`（买入金额）、`units`（卖出份额）、`fee`（手续费）、`remark`（备注）

        - 各字段的格式、取值范围和业务含义见对应字段说明。


        ### 处理结果


        成功时完成上述业务操作；后续状态和返回数据以 `200` 响应定义为准。'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - aaid
              - member_id
              - account_channel
              - currency
              - counter_id
              - action
              properties:
                aaid:
                  type: string
                  description: 用于指定「客户资产账号」。此字段为必填项。
                member_id:
                  type: string
                  description: 客户 ID，由所选客户信息补充
                account_channel:
                  type: string
                  description: 账户渠道，取所选客户的开户渠道
                currency:
                  type: string
                  description: 本次请求使用的币种代码。此字段为必填项。
                fund_channel:
                  type: string
                  description: '基金渠道，取值来自 fund_channel 动态枚举，非固定


                    请调用 `GET /v1/datasets/refs/fund_channel` 获取当前可用的数据字典，并使用返回项的 `key` 作为本字段值。'
                  x-value-source:
                    endpoint: GET /v1/datasets/refs/fund_channel
                counter_id:
                  type: string
                  description: 基金内部代码，通过基金搜索选择
                action:
                  type: string
                  description: '交易方向，默认 BUY（买入）


                    **可选值：**

                    - `BUY` - 表示买入

                    - `SELL` - 表示卖出'
                  enum:
                  - BUY
                  - SELL
                  x-enum-details:
                  - value: BUY
                    label: 买入
                  - value: SELL
                    label: 卖出
                amount:
                  type: number
                  description: 申购金额，仅买入 (action=BUY)时必填
                units:
                  type: number
                  description: 赎回份额，仅卖出 (action=SELL)时必填，受可卖份额及份额精度校验
                fee:
                  type: number
                  description: 手续费，仅买入 (action=BUY)时必填
                remark:
                  type: string
                  description: 随本次操作保存的备注。
            example:
              aaid: H00000000
              member_id: '1000000000000000000'
              account_channel: lb
              currency: USD
              fund_channel: ''
              counter_id: ''
              action: BUY
              amount: '1000'
              fee: '0'
              remark: ''
      responses:
        '200':
          description: 请求处理成功。响应的 `data` 不包含额外业务字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: '0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。


                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`

                      判断具体结果。


                      - `401`：未登录。

                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。'
                    x-enum-details:
                    - value: 0
                      label: 成功
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登录或登录状态已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 当前账号未获得该功能授权。请在 User Permission 中为该账号开通相应权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 请求处理超时。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
