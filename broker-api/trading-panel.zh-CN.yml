        ### 导出模式


        - `mode: 0`：同步导出，成功后直接返回下载地址。

        - `mode: 1`：异步导出，先返回 `file_download_id`；随后调用 `GET /v1/datasets/download/{id}` 获取下载地址。

        - 不再需要导出记录时，可调用 `DELETE /v1/datasets/download/{id}` 删除。'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 字段同 fund_frontend_member_orders.yaml（query 能力）里的 filters
                  properties:
                    member_id:
                      type: string
                      description: 用于按「客户编号」筛选结果。
                    state:
                      type: string
                      description: '用于按「状态」筛选结果。


                        **可选值：**

                        - `Init` - 表示初始态

                        - `Cutoff` - 表示已日切

                        - `Submitted` - 表示已提交

                        - `FundsSettled` - 表示赎回货交收

                        - `Done` - 表示已完成

                        - `Canceled` - 表示已撤单

                        - `Confirmed` - 表示已确认

                        - `Rejected` - 表示拒单'
                      enum:
                      - Init
                      - Cutoff
                      - Submitted
                      - FundsSettled
                      - Done
                      - Canceled
                      - Confirmed
                      - Rejected
                      x-enum-details:
                      - value: Init
                        label: 初始态
                      - value: Cutoff
                        label: 已日切
                      - value: Submitted
                        label: 已提交
                      - value: FundsSettled
                        label: 赎回货交收
                      - value: Done
                        label: 已完成
                      - value: Canceled
                        label: 已撤单
                      - value: Confirmed
                        label: 已确认
                      - value: Rejected
                        label: 拒单
                mode:
                  type: integer
                  default: 0
                  description: '不传时默认 0（同步）


                    **可选值：**

                    - `0` - 表示同步

                    - `1` - 表示异步'
                  enum:
                  - 0
                  - 1
                  x-enum-details:
                  - value: 0
                    label: 同步
                  - value: 1
                    label: 异步
                ext:
                  type: string
                  description: '下载文件格式。不传时默认为 `csv`。


                    **可选值：**

                    - `csv` - 表示 CSV

                    - `xlsx` - 表示 Excel'
                  enum:
                  - csv
                  - xlsx
                file_name:
                  type: string
                  description: 导出文件名称。不传时由服务端生成。
                down_fields:
                  type: array
                  description: 不传时导出全部字段；取值范围见 items.enum（同查询接口 data.list.items 的字段列表）
                  items:
                    type: string
                    enum:
                    - id
                    - member_id
                    - member_id_val
                    - aaid
                    - aaid_val
                    - action
                    - action_val
                    - trade_source
                    - trade_source_val
                    - counter_id
                    - fund_all_name
                    - state
                    - state_val
                    - created_at
                    - apply_amount
                    - confirmed_shares
                    - apply_shares
                    - confirmed_amount
                    - currency
                    - fee
                    - record_remark
                ticket_content:
                  type: string
                  description: 模板配置了下载审核工单时，供审批人查看
                ticket_preview_url:
                  type: string
                  description: 导出审批详情地址；仅在导出需要审批时使用。
                hide:
                  type: integer
                  description: '是否在下载记录列表中隐藏本次导出记录。


                    **可选值：**

                    - `0` - 表示不隐藏

                    - `1` - 表示隐藏'
                  enum:
                  - 0
                  - 1
                  x-enum-details:
                  - value: 0
                    label: 不隐藏
                  - value: 1
                    label: 隐藏
            example:
              filters: {}
              mode: 0
              ext: csv
              file_name: ''
              remark: ''
              down_fields: []
              ticket_content: ''
              ticket_preview_url: ''
              hide: 0
      responses:
        '200':
          description: 成功时返回「基金前台订单导出」任务信息。同步导出直接提供下载地址；异步导出提供用于后续查询的 `file_download_id`。
          content:
