  /ob/create/record:
    post:
      operationId: ob_create_record
      summary: 創建OB申購同步記錄
      tags:
        - 新股认购
      x-permission-key:
        - ipo.ob_manage
      x-lbonly: false
      description: |-
        申購記錄同步 (Subscription Record Synchronization) 的「新建」和行內「重試」共用的接口，用於創建 OB 申購同步記錄。

        ### 請求參數

        - 必填：`counter_id`（標的代碼）、`records`（同步記錄列表）、`records[].channel`（原渠道）、`records[].method`（認購方式）、`records[].ratio`（認購比例）、`records[].target_method`（目標認購方式）、`records[].target_ratio`（目標認購比例）、`is_retry`（是否重試）
        - 各字段的格式、取值範圍、默認行為和業務含義見對應字段說明。

        ### 處理結果

        成功時完成所述業務操作，具體返回內容見 `200` 響應定義。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - counter_id
                - records
                - records[].channel
                - records[].method
                - records[].ratio
                - records[].target_method
                - records[].target_ratio
                - is_retry
              properties:
                counter_id:
                  type: string
                  description: 標的代碼. 證券或基金標的代碼，用於定位本次請求處理的標的。此字段為必填項。
                records:
                  type: array
                  description: 同步記錄列表. 每項為一條渠道同步配置；新建時為勾選的記錄（過濾掉渠道為空的行），重試時為當前行數據組成的單元素數組
                  items:
                    type: string
                records[].channel:
                  type: string
                  description: 原渠道. 用於指定「原渠道」。此字段為必填項。
                records[].method:
                  type: string
                  description: 認購方式. 用於指定「認購方式」。此字段為必填項。
                records[].ratio:
                  type: string
                  description: 認購比例. 百分比數值，去掉 % 符號後傳字符串，如 "100" 表示 100%
                records[].target_method:
                  type: string
                  description: 目標認購方式. 用於指定「目標認購方式」。此字段為必填項。
                records[].target_ratio:
                  type: string
                  description: 目標認購比例. 目標認購比例，百分比數值，去掉 % 符號後傳字符串
                is_retry:
                  type: boolean
                  description: 是否重試. 新建操作傳 false；「重試」操作傳 true
            example:
              counter_id: '10086'
              records:
                - channel: CH001
                  method: '1'
                  ratio: '100'
                  target_method: '2'
                  target_ratio: '100'
              is_retry: false
      responses:
        '200':
          description: 請求處理成功。響應的 `data` 不包含額外業務字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。

                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`
                      判斷具體結果。

                      - `401`：未登錄。
                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登錄或登錄狀態已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 當前賬號未獲得該功能授權。請在 User Permission 中為該賬號開通相應權限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 請求處理超時。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
