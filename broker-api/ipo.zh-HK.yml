openapi: 3.1.1
info:
  title: Longport Whale 券商 API
  description: 面向使用 Longport Whale 的券商提供機構級服務端 API。
  version: 2.0.0
servers:
  - url: https://b-api.longbridge.xyz
    description: 測試環境
  - url: https://b-api.lbkrs.com
    description: 生產環境
security:
  - bearerAuth: []
tags:
  - name: 新股认购
paths:
  /v2/ipo/subscription/detail:
    get:
      operationId: ipo_hk_subscription_detail
      summary: 港股認購信息詳情
      tags:
        - 新股认购
      x-permission-key:
        - ipo.subscription_manage
      x-lbonly: false
      description: |-
        港股認購信息詳情。

        ### 請求參數

        - 必填：`counter_id`（標的 ID）
        - 各字段的格式、取值範圍和業務含義見對應字段説明。

        ### 處理結果

        返回查詢結果，字段見 `200` 響應定義。
      security:
        - bearerAuth: []
      parameters:
        - name: counter_id
          in: query
          required: true
          description: 用於指定「標的 ID」。此字段為必填項。
          schema:
            type: string
      responses:
        '200':
          description: 請求處理成功。`data` 為該標的的港股認購配置詳情。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。

                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`
                      判斷具體結果。

                      - `401`：未登錄。
                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        description: ID. 用於指定「ID」。
                      counter_id:
                        type: string
                        description: 標的 ID. 用於指定「標的 ID」。
                      can_subscribe:
                        type: integer
                        description: 是否可認購. 用於指定「是否可認購」。
                      apply_start_date:
                        type: string
                        description: 認購開始日. 用於指定「認購開始日」。
                      cash_end_date:
                        type: string
                        description: 現金截止日. 用於指定「現金截止日」。
                      margin_end_date:
                        type: string
                        description: 融資截止日. 用於指定「融資截止日」。
                      charge_date:
                        type: string
                        description: 扣款日. 用於指定「扣款日」。
                      tags:
                        type: object
                        description: 標籤. 用於指定「標籤」。
                        properties:
                          zh_cn:
                            type: array
                            description: 簡體中文. 用於指定「簡體中文」。
                            items:
                              type: string
                          zh_hk:
                            type: array
                            description: 繁體中文. 用於指定「繁體中文」。
                            items:
                              type: string
                          en:
                            type: array
                            description: 英文. 用於指定「英文」。
                            items:
                              type: string
                      subscription_method:
                        type: object
                        description: 認購方式. 用於指定「認購方式」。
                        properties:
                          zh_cn:
                            type: string
                            description: 簡體中文. 用於指定「簡體中文」。
                          zh_hk:
                            type: string
                            description: 繁體中文. 用於指定「繁體中文」。
                          en:
                            type: string
                            description: 英文. 用於指定「英文」。
                      buying_power:
                        type: object
                        description: 購買力. 用於指定「購買力」。
                        properties:
                          zh_cn:
                            type: string
                            description: 簡體中文. 用於指定「簡體中文」。
                          zh_hk:
                            type: string
                            description: 繁體中文. 用於指定「繁體中文」。
                          en:
                            type: string
                            description: 英文. 用於指定「英文」。
                      financing_interest:
                        type: object
                        description: 融資利息. 用於指定「融資利息」。
                        properties:
                          zh_cn:
                            type: string
                            description: 簡體中文. 用於指定「簡體中文」。
                          zh_hk:
                            type: string
                            description: 繁體中文. 用於指定「繁體中文」。
                          en:
                            type: string
                            description: 英文. 用於指定「英文」。
                      cut_off_time:
                        type: object
                        description: 截止時間. 用於指定「截止時間」。
                        properties:
                          zh_cn:
                            type: string
                            description: 簡體中文. 用於指定「簡體中文」。
                          zh_hk:
                            type: string
                            description: 繁體中文. 用於指定「繁體中文」。
                          en:
                            type: string
                            description: 英文. 用於指定「英文」。
                      financing_estimate:
                        type: object
                        description: 融資預估. 用於指定「融資預估」。
                        properties:
                          zh_cn:
                            type: string
                            description: 簡體中文. 用於指定「簡體中文」。
                          zh_hk:
                            type: string
                            description: 繁體中文. 用於指定「繁體中文」。
                          en:
                            type: string
                            description: 英文. 用於指定「英文」。
                      notice:
                        type: object
                        description: 提示. 用於指定「提示」。
                        properties:
                          zh_cn:
                            type: string
                            description: 簡體中文. 用於指定「簡體中文」。
                          zh_hk:
                            type: string
                            description: 繁體中文. 用於指定「繁體中文」。
                          en:
                            type: string
                            description: 英文. 用於指定「英文」。
                      user_group_ids:
                        type: array
                        description: 用戶分羣 ID 列表. 用於指定「用戶分羣 ID 列表」。
                        items:
                          type: integer
                      pi_certification:
                        type: integer
                        description: PI 認證. 用於指定「PI 認證」。
                      rate_id:
                        type: integer
                        description: 費率 ID. 用於指定「費率 ID」。
                      cash_channel:
                        type: string
                        description: 現金渠道. 用於指定「現金渠道」。
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登錄或登錄狀態已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 當前賬號未獲得該功能授權。請在 User Permission 中為該賬號開通相應權限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 請求處理超時。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
      x-mint:
        href: /zh-HK/api-reference/ipo_hk_subscription_detail
        metadata:
          sidebarTitle: 港股認購信息詳情
  /ipo/get-doc:
