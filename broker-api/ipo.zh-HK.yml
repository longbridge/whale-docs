                                description: 繁體中文. 用於指定「繁體中文」。
                              en:
                                type: string
                                description: 英文. 用於指定「英文」。
                          buying_power:
                            type: object
                            description: 購買力. 用於指定「購買力」。
                            properties:
                              zh_cn:
                                type: string
                                description: 簡體中文. 用於指定「簡體中文」。
                              zh_hk:
                                type: string
                                description: 繁體中文. 用於指定「繁體中文」。
                              en:
                                type: string
                                description: 英文. 用於指定「英文」。
                          financing_interest:
                            type: object
                            description: 融資利息. 用於指定「融資利息」。
                            properties:
                              zh_cn:
                                type: string
                                description: 簡體中文. 用於指定「簡體中文」。
                              zh_hk:
                                type: string
                                description: 繁體中文. 用於指定「繁體中文」。
                              en:
                                type: string
                                description: 英文. 用於指定「英文」。
                          cut_off_time:
                            type: object
                            description: 截止時間. 用於指定「截止時間」。
                            properties:
                              zh_cn:
                                type: string
                                description: 簡體中文. 用於指定「簡體中文」。
                              zh_hk:
                                type: string
                                description: 繁體中文. 用於指定「繁體中文」。
                              en:
                                type: string
                                description: 英文. 用於指定「英文」。
                          financing_estimate:
                            type: object
                            description: 融資預估. 用於指定「融資預估」。
                            properties:
                              zh_cn:
                                type: string
                                description: 簡體中文. 用於指定「簡體中文」。
                              zh_hk:
                                type: string
                                description: 繁體中文. 用於指定「繁體中文」。
                              en:
                                type: string
                                description: 英文. 用於指定「英文」。
                          notice:
                            type: object
                            description: 提示. 用於指定「提示」。
                            properties:
                              zh_cn:
                                type: string
                                description: 簡體中文. 用於指定「簡體中文」。
                              zh_hk:
                                type: string
                                description: 繁體中文. 用於指定「繁體中文」。
                              en:
                                type: string
                                description: 英文. 用於指定「英文」。
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登錄或登錄狀態已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 當前賬號未獲得該功能授權。請在 User Permission 中為該賬號開通相應權限。
          content:
            application/json:
              schema:
