                        items:
                          type: object
                          properties:
                            ob_channel:
                              type: string
                              description: OB 租戶. **返回值：** OB 租戶。
                            account_no:
                              type: string
                              description: 證券賬號. **返回值：** 證券賬號。
                            support_method:
                              type: string
                              description: 支持類型. **返回值：** 支持類型。
                            remark:
                              type: string
                              description: 備註. **返回值：** 備註。
                      total:
                        type: integer
                        description: 總條數. **返回值：** 符合查詢條件的記錄總數，用於計算分頁。
              example:
                code: 0
                message: success
