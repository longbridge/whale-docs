                      description: 簡體中文. 用於指定「簡體中文」。
                    zh_hk:
                      type: string
                      description: 繁體中文. 用於指定「繁體中文」。
                    en:
                      type: string
                      description: 英文. 用於指定「英文」。
            example:
              counter_id: ''
              tags: {}
              subscription_method: {}
              buying_power: {}
              financing_interest: {}
              cut_off_time: {}
              financing_estimate: {}
