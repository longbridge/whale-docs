                      description: 簡體中文. 用於指定「簡體中文」。
                    zh_hk:
                      type: string
                      description: 繁體中文. 用於指定「繁體中文」。
                    en:
                      type: string
                      description: 英文. 用於指定「英文」。
                financing_interest:
                  type: object
                  description: 融資利息. 用於指定「融資利息」。
                  properties:
                    zh_cn:
                      type: string
                      description: 簡體中文. 用於指定「簡體中文」。
                    zh_hk:
                      type: string
                      description: 繁體中文. 用於指定「繁體中文」。
                    en:
                      type: string
                      description: 英文. 用於指定「英文」。
                cut_off_time:
                  type: object
                  description: 截止時間. 用於指定「截止時間」。
                  properties:
                    zh_cn:
                      type: string
                      description: 簡體中文. 用於指定「簡體中文」。
                    zh_hk:
                      type: string
                      description: 繁體中文. 用於指定「繁體中文」。
                    en:
                      type: string
                      description: 英文. 用於指定「英文」。
                financing_estimate:
                  type: object
                  description: 融資預估. 用於指定「融資預估」。
                  properties:
                    zh_cn:
                      type: string
                      description: 簡體中文. 用於指定「簡體中文」。
                    zh_hk:
                      type: string
                      description: 繁體中文. 用於指定「繁體中文」。
                    en:
