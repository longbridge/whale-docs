  /v2/billing/exchange_contract:
    post:
      operationId: exchange_contract_v2
      summary: 新建客户合约
      x-verified: verified
      tags:
        - 清算管理
      x-permission-key:
        - lb_hk_clearing.contract_manage_edit
      x-lbonly: false
      description: |-
        新建一笔客户股票交易合约（清算/交收合约）。

        ### 请求参数

        - 必填：`trade_date`（交易日）、`counter_id`（标的）、`direction`（买卖方向）、`currency`（交易币种）、`aaid`（证券账号）、`settlement_channel`（结算渠道）、`open_close`（开平仓）、`position`（仓位方向）、`trade_dones`（成交明细列表）
        - 其余为可选项，如结算子仓、交易阶段、下单渠道、托管商、预计交收日、结算币种、汇率、发行价等。
        - 各字段的格式、取值范围和业务含义见对应字段说明。

        ### 业务说明

        每条成交明细通过 `order_seq` 关联对应委托。合约建立后将进入清算与交收流程。

        ### 风险提示

        此操作可能引起真实资金、持仓或交易状态变化。调用前请确认目标记录和参数无误。

        ### 处理结果

        成功时完成上述业务操作；后续状态和返回数据以 `200` 响应定义为准。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - trade_date
                - counter_id
                - direction
                - currency
                - aaid
                - settlement_channel
                - open_close
                - position
                - trade_dones
              properties:
                trade_date:
                  type: string
                  description: 本次请求对应的交易日期。请按接口约定的日期格式提交。此字段为必填项。
                counter_id:
                  type: string
                  description: 用于指定「标的」。此字段为必填项。
                direction:
                  type: string
                  description: 本次业务处理的方向。此字段为必填项。
                currency:
                  type: string
                  description: 用于指定「交易币种」。此字段为必填项。
                aaid:
                  type: string
                  description: 本次请求关联的证券账号。此字段为必填项。
                settlement_channel:
                  type: string
                  description: 用于指定「结算渠道」。此字段为必填项。
                settlement_account:
                  type: string
                  description: 用于指定「结算子仓」。
                stage:
                  type: string
                  description: 用于指定「交易阶段」。
                order_source:
                  type: string
                  description: 用于指定「下单渠道/代理商」。
                custodian_id:
                  type: string
                  description: 托管商ID，用于标识本次请求关联的业务对象。
                expected_equity_settlement_date:
                  type: string
                  description: 用于指定「预计券交收日」。
                expected_balance_settlement_date:
                  type: string
                  description: 用于指定「预计钱交收日」。
                currency_setl:
                  type: string
                  description: 用于指定「结算币种」。
                trade_to_setl_exchange_rate:
                  type: string
                  description: 用于指定「交易转结算汇率」。
                otcr_flag:
                  type: string
                  description: |-
                    用于指定「OTCR 报表标识」。
                  enum:
                    - '1'
                    - '0'
                  x-enum-details:
                    - value: '1'
                      label: 是（上报 OTCR）
                    - value: '0'
                      label: 否（不上报 OTCR）
                  example: '1'
                open_close:
                  type: string
                  description: 用于指定「开平仓」。此字段为必填项。
                  enum:
                    - OPEN
                    - CLOSE
                  x-enum-details:
                    - value: OPEN
                      hk: 開倉
                      label: 开仓
                    - value: CLOSE
                      hk: 平倉
                      label: 平仓
                  example: OPEN
                position:
                  type: string
                  description: 用于指定「仓位方向」。此字段为必填项。
                  enum:
                    - LONG
                    - SHORT
                  x-enum-details:
