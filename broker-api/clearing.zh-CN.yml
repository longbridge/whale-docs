      responses:
        '200':
          description: 成功时分页返回「文件导入」记录，以及页码、每页数量和总记录数等分页信息。
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。

                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`
                      判断具体结果。

                      - `401`：未登录。
                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。
                    x-enum-details:
                      - value: 0
                        label: 成功
                  message:
                    type: string
                  data:
                    type: object
                    required:
                      - list
                      - total
                    properties:
                      list:
                        type: array
                        description: '**返回值：** 列表列表。'
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: '**返回值：** 当前记录的唯一标识。'
                            file_type:
                              type: string
                              description: '**返回值：** 文件类型。'
                            file_type_val:
                              type: string
                              description: 字段 file_type 的原始值：file_type 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            file_name:
                              type: string
                              description: '**返回值：** 文件名。'
                            market:
                              type: string
                              description: '**返回值：** 市场。'
                            biz_date:
                              type: string
                              description: '**返回值：** 文件日期；时间或日期格式以接口实际返回值为准。'
                            op_user_id:
                              type: string
                              description: '**返回值：** 导入人。'
                            state:
                              type: string
                              description: '**返回值：** 状态。'
                            state_val:
                              type: string
                              description: 字段 state 的原始值：state 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            created_at:
                              type: string
                              description: '**返回值：** 创建时间；时间或日期格式以接口实际返回值为准。'
                            updated_at:
                              type: string
                              description: '**返回值：** 更新时间；时间或日期格式以接口实际返回值为准。'
                      total:
                        type: integer
                        description: '**返回值：** 符合查询条件的记录总数，用于计算分页。'
              example:
                code: 0
                message: success
                data:
                  list:
                    - id: '162232'
                      file_type: IB（settlement_iblite_hk)
                      file_type_val: '96'
                      file_name: IB LITE 20260702 (1).csv
                      market: US
                      biz_date: 2026-07-02
                      op_user_id: user@example.com
                      state: Resolved
                      state_val: '3'
                      created_at: '1784180196'
                      updated_at: '1784180196'
                  total: 19323
        '400':
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登录或登录状态已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 当前账号未获得该功能授权。请在 User Permission 中为该账号开通相应权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 请求处理超时。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
