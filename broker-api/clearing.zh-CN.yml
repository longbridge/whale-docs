        - 可选：`ids`（结单 ID 列表）、`type`（结单类型）、`dt`（结单日期）、`total_notify_allowed`（是否允许总通知）
        - 各字段的格式、取值范围和业务含义见对应字段说明。

        ### 业务说明

        可按 `ids` 指定具体结单，或按 `type` 与 `dt` 圈定发送范围。`force_send` 控制是否忽略默认的发送限制强制下发。

        ### 风险提示

        此操作会向客户实际发送结单及通知。调用前请确认发送范围和参数无误。

        ### 处理结果

        成功时完成结单批量发送；后续状态和返回数据以 `200` 响应定义为准。
      security:
