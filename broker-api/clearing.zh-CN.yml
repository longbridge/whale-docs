                - end_date
                - lang
                - refresh_data
              properties:
                aaid:
                  type: string
                  description: type=member_query_aaid 组件选择
                begin_date:
                  type: string
                  description: 使用 `dt` 表示日期区间；提交时将起止日期分别写入 `begin_date` 和 `end_date`。
