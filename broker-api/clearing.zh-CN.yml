                      lang_val: hk-EN
                      member_name: "lb "
                      broker_code: LB851987964599174
                      account_mark: ""
                      ledger_date: "20260714"
                      generated_at: "2026-07-16 11:44:15"
                      sender: ""
                  total: 4857885

        "400":
          description: |-
            请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
