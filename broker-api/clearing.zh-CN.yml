              properties:
                ids:
                  type: array
                  description: 结单ID列表，以 JSON 数组形式提交。
                  items:
                    type: string
                type:
                  type: string
                  description: |-
                    用于指定「结单类型」。取值来自后端数据字典（动态维护），非固定枚举；请以接口实际返回的可选项为准。
                dt:
                  type: string
                  description: 本次请求对应的结单日期。请按接口约定的日期格式提交。
                total_notify_allowed:
                  type: boolean
                  description: |-
