                lang:
                  type: string
                  description: 可选值，枚举来自 ref statement_language_key
                  enum:
                    - '0'
                    - '1'
                    - '2'
                    - '3'
                    - '4'
                  x-enum-details:
                    - value: '0'
                      hk: 跟隨系統
                      label: 跟随系统
                    - value: '1'
                      label: 英文
                    - value: '2'
                      hk: 簡體中文
                      label: 简体中文
                    - value: '3'
                      hk: 繁體中文
                      label: 繁体中文
                    - value: '4'
                      hk: 繁體中文 & 英文
                      label: 繁体中文 & 英文
                  example: '0'
                remark:
                  type: string
                  description: 随本次操作保存的备注。
                refresh_data:
                  type: integer
                  description: |-
                    用于指定「是否刷新数据」。
                  enum:
                    - 0
                    - 1
                  x-enum-details:
                    - value: 0
                      label: 不刷新数据
                    - value: 1
                      label: 刷新数据
                  example: 0
            example:
              aaid: H00000000
              begin_date: '20260101'
              end_date: '20260131'
              lang: ''
              remark: ''
              refresh_data: 0
      responses:
        '200':
          description: 请求处理成功。响应的 `data` 不包含额外业务字段。
