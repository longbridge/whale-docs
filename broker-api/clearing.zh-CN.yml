  /billing/stock_exchange_contract/revise/recalc:
    post:
      operationId: stock_exchange_contract_revise_recalc
      summary: 重算合约修正费用（不保存）
      x-verified: verified
      tags:
        - 清算管理
      x-permission-key:
        - lb_hk_clearing.contract_revise
      x-lbonly: false
      description: |-
        根据原合约及本次修改后的字段重新计算费用，仅返回计算结果，不写入数据库。

        ### 请求参数

        - 必填：`old_contract_id`（原合约 ID）
        - 可选：`counter_id`、`direction`、`currency`、`aaid`、`settlement_channel`、`settlement_account`、`stage`、`trade_date`、`order_source` 等修正后字段。
        - 各字段的格式、取值范围和业务含义见对应字段说明。

        ### 业务说明

        本接口仅用于预览修正后的费用，不产生任何真实变更。

        ### 处理结果

        成功时返回重新计算的费用明细，字段含义见下方响应定义。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - old_contract_id
              properties:
                old_contract_id:
                  type: string
                  description: 原合约ID，用于标识本次请求关联的业务对象。此字段为必填项。
                counter_id:
                  type: string
                  description: 证券或基金标的代码，用于定位本次请求处理的标的。
                direction:
                  type: string
                  description: 本次业务处理的方向。
                currency:
                  type: string
                  description: 本次请求使用的币种代码。
                aaid:
                  type: string
                  description: 本次请求关联的证券账号。
                settlement_channel:
                  type: string
                  description: 用于指定「结算渠道」。
                settlement_account:
                  type: string
                  description: 用于指定「结算子仓」。
                stage:
                  type: string
                  description: 用于指定「交易阶段」。
                trade_date:
                  type: string
                  description: 本次请求对应的交易日期。请按接口约定的日期格式提交。
                order_source:
                  type: string
                  description: 用于指定「订单来源/代理商」。
            example:
              old_contract_id: '123'
              counter_id: ST/US/AAPL
              direction: ''
              currency: HKD
              aaid: H00000000
              settlement_channel: ''
              settlement_account: ''
              stage: ''
              trade_date: 2026-07-10
              order_source: ''
      responses:
        '200':
          description: 请求处理成功。业务结果位于 `data`，包含 `bills`、`total_amount`、`discounts` 字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。

