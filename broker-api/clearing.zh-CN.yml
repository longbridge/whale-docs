        - 各字段的格式、取值范围和业务含义见对应字段说明。

        ### 业务说明

        按 `begin_date` 至 `end_date` 的区间为 `aaid` 生成临时结单，语言由 `lang` 指定。`refresh_data` 控制是否在生成前刷新底层数据。

        ### 处理结果

