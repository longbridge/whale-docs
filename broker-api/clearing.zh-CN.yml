      x-lbonly: false
      description: |-
        查询「上手文件快捷导入」数据，可通过 `filters` 组合业务筛选条件，并使用 `page`、`page_size` 控制分页。

        ### 返回结果

        成功时返回匹配的记录列表及分页信息。各过滤字段的用途、可选值和动态数据来源见对应字段说明。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: |-
                    组合业务过滤条件。省略某个过滤字段时，不按该字段筛选。
                  properties:
