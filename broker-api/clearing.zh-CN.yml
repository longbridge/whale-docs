                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      bills:
                        type: array
                        description: 重新计算后的费用明细数组；每项费用的字段结构见数组元素定义。
                        items:
                          type: string
                      total_amount:
                        type: number
                        description: 费用合计
                      discounts:
                        type: array
                        description: 折扣明细数组
                        items:
                          type: string
              example:
                code: 0
                message: success
                data:
                  bills: []
                  total_amount: 0
                  discounts: []
        '400':
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
