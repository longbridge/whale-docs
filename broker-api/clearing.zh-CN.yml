                      label: 英文
                    - value: "2"
                      hk: 簡體中文
                      label: 简体中文
                    - value: "3"
                      hk: 繁體中文
                      label: 繁体中文
                    - value: "4"
                      hk: "繁體中文 & 英文"
                      label: "繁体中文 & 英文"
