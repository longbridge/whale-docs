  /v1/datasets/booking_mails:
    get:
      operationId: booking_mails
      summary: 计费邮件
      x-verified: verified
      tags:
        - 清算管理
      x-lbonly: false
      description: |-
        查询「计费邮件」数据，可通过 `filters` 组合业务筛选条件，并使用 `page`、`page_size` 控制分页。

        ### 返回结果

        成功时返回匹配的记录列表及分页信息。各过滤字段的用途、可选值和动态数据来源见对应字段说明。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: |-
                    组合业务过滤条件。省略某个过滤字段时，不按该字段筛选。
                  properties:
                    ledger_date:
                      type: object
                      description: |-
                        用于按「消息日期」筛选结果。
                      properties:
                        gte:
                          type: string
                          format: date
                          description: |-
                            筛选范围的下限，匹配值包含该值。
                        lte:
                          type: string
                          format: date
                          description: |-
                            筛选范围的上限，匹配值包含该值。
                    Aaid:
                      type: string
                      description: |-
                        用于按「客户」筛选结果。
                    state:
                      type: string
                      description: |-
                        用于按「状态」筛选结果。

                        支持多选；提交时使用英文逗号（`,`）拼接多个值。不传时不按此字段筛选。

                        **可选值：**
                        - `0` - 表示待发送
                        - `1` - 表示发送成功
                        - `2` - 表示发送失败
                        - `3` - 表示发送中
                      example: "0,1"
                      enum: ["0", "1", "2", "3"]
                      x-enum-details:
                        - value: "0"
                          hk: 待發送
                          label: 待发送
                        - value: "1"
                          hk: 發送成功
                          label: 发送成功
                        - value: "2"
                          hk: 發送失敗
                          label: 发送失败
                        - value: "3"
                          hk: 發送中
                          label: 发送中
                page:
                  type: integer
                  description: |-
                    要查询的页码，从 `1` 开始。
                page_size:
                  type: integer
                  description: |-
                    每页返回的记录数量。
            example:
              filters: {}
              page: 1
              page_size: 20
      responses:
        "200":
          description: |-
            成功时分页返回「计费邮件」记录，以及页码、每页数量和总记录数等分页信息。
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。

                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`
                      判断具体结果。

                      - `401`：未登录。
                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。
                    x-enum-details:
                      - value: 0
                        label: 成功
                  message:
                    type: string
                  data:
                    type: object
                    required:
                      - list
                      - total
                    properties:
                      list:
                        type: array
                        description: |-
                          **返回值：** 列表列表。
                        items:
                          type: object
                          properties:
                            ledger_date:
                              type: string
                              description: |-
                                **返回值：** 消息日期；时间或日期格式以接口实际返回值为准。
                            origin_id:
                              type: string
                              description: |-
                                **返回值：** 证券账号。
                            client_detail_type:
                              type: string
                              description: |-
                                **返回值：** 客户账户子类型。
                            real_name:
                              type: string
                              description: |-
                                **返回值：** 客户姓名。
                            lang:
                              type: string
                              description: |-
                                **返回值：** 语言。
                            lang_val:
                              type: string
                              description: |-
                                字段 lang 的原始值：lang 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            billing_item_modify:
                              type: string
                              description: |-
                                **返回值：** 收费场景更新。
                            billing_item_modify_val:
                              type: string
                              description: |-
                                字段 billing_item_modify 的原始值：billing_item_modify 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            dft_package_modify:
                              type: string
                              description: |-
                                **返回值：** 全局客户组更新。
                            dft_package_modify_val:
                              type: string
                              description: |-
                                字段 dft_package_modify 的原始值：dft_package_modify 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            common_package_modify:
                              type: string
                              description: |-
                                **返回值：** 普通客户组更新。
                            common_package_modify_val:
                              type: string
                              description: |-
                                字段 common_package_modify 的原始值：common_package_modify 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            personal_package_modify:
                              type: string
                              description: |-
                                **返回值：** 客户计费更新。
                            personal_package_modify_val:
                              type: string
                              description: |-
                                字段 personal_package_modify 的原始值：personal_package_modify 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            config_updated_at:
                              type: string
                              description: |-
                                **返回值：** 配置更新时间；时间或日期格式以接口实际返回值为准。
                            mail_send_at:
                              type: string
                              description: |-
                                **返回值：** 邮件发送时间；时间或日期格式以接口实际返回值为准。
                            state:
                              type: string
                              description: |-
                                **返回值：** 状态。
                            state_val:
                              type: string
                              description: |-
                                字段 state 的原始值：state 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                      total:
                        type: integer
                        description: |-
                          **返回值：** 符合查询条件的记录总数，用于计算分页。
              example:
                code: 0
                message: success
                data:
                  list:
                    - ledger_date: "20260714"
                      origin_id: H00000000
                      client_detail_type: OB
                      real_name: 示例用户
                      lang: Simplified Chinese
                      lang_val: zh-CN
                      billing_item_modify: "NO"
                      billing_item_modify_val: "false"
                      dft_package_modify: "YES"
                      dft_package_modify_val: "true"
                      common_package_modify: "YES"
                      common_package_modify_val: "true"
                      personal_package_modify: "NO"
