                            bill_currency:
                              type: string
                              description: '**返回值：** 收费币种。'
                            fee_rate_currency:
                              type: string
                              description: '**返回值：** 费率币种。'
                            metric_type:
                              type: string
                              description: '**返回值：** 计费类型。'
                            metric_type_val:
