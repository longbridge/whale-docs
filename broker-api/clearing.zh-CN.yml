  /v1/datasets/atm_statement_histories:
    get:
      operationId: atm_statement_histories
      summary: 结单
      x-verified: verified
      tags:
        - 清算管理
      x-permission-key:
        - b2b_statement.list
        - account.statement_history
      x-lbonly: false
      description: |-
        查询「结单」数据，可通过 `filters` 组合业务筛选条件，并使用 `page`、`page_size` 控制分页。

        ### 返回结果

        成功时返回匹配的记录列表及分页信息。各过滤字段的用途、可选值和动态数据来源见对应字段说明。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: |-
                    组合业务过滤条件。省略某个过滤字段时，不按该字段筛选。
                  properties:
                    dt:
                      type: string
                      description: |-
                        用于按「结单日期」筛选结果。
                    aaid:
                      type: string
                      description: |-
                        用于按「客户」筛选结果。
                    file_type:
                      type: string
                      description: |-
                        用于按「结单类型」筛选结果。

                        **可选值：**
                        - `0` - 表示日结单
                        - `1` - 表示月结单
                        - `2` - 表示临时结单
                      enum: ["0", "1", "2"]
                      x-enum-details:
                        - value: "0"
                          hk: 日結單
                          label: 日结单
                        - value: "1"
                          hk: 月結單
                          label: 月结单
                        - value: "2"
                          hk: 臨時結單
                          label: 临时结单
                    lang:
                      type: string
                      description: |-
                        用于按「语言」筛选结果。

                        **可选值：**
                        - `en` - 表示英文
                        - `zh-CN` - 表示简体中文
                        - `zh-HK` - 表示繁体中文
                        - `hk-EN` - 表示繁体 + 英文
                      enum: ["en", "zh-CN", "zh-HK", "hk-EN"]
                      x-enum-details:
                        - value: "en"
                          label: 英文
                        - value: "zh-CN"
                          hk: 簡體中文
                          label: 简体中文
                        - value: "zh-HK"
                          hk: 繁體中文
                          label: 繁体中文
                        - value: "hk-EN"
                          hk: 繁體 + 英文
                          label: 繁体 + 英文
                    statement_send:
                      type: string
                      description: |-
                        用于按「线下发送」筛选结果。

                        **可选值：**
                        - `-1` - 表示是
                        - `1` - 表示否
                      enum: ["-1", "1"]
                      x-enum-details:
                        - value: "-1"
                          label: 是
                        - value: "1"
                          label: 否
                    state:
                      type: string
                      description: |-
                        用于按「状态」筛选结果。

                        **可选值：**
                        - `-1` - 表示生成失败
                        - `0` - 表示生成中
                        - `1` - 表示生成成功
                        - `2` - 表示已发送
                        - `3` - 表示重新生成待发送
                      enum: ["-1", "0", "1", "2", "3"]
                      x-enum-details:
                        - value: "-1"
                          hk: 生成失敗
                          label: 生成失败
                        - value: "0"
                          label: 生成中
                        - value: "1"
                          label: 生成成功
                        - value: "2"
                          hk: 已發送
                          label: 已发送
                        - value: "3"
                          hk: 重新生成待發送
                          label: 重新生成待发送
                    broker_code:
                      type: string
                      description: |-
                        用于按「经纪人账号」筛选结果。

                        候选值会动态变化。请调用 `GET /v1/datasets/refs/report_broker_accounts` 获取当前可用的数据字典，并使用返回项的 `key` 作为本参数值。
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/report_broker_accounts
                    da_flag:
                      type: string
                      description: |-
                        用于按「账户标识」筛选结果。

                        **可选值：**
                        - `1` - 表示 Discretionary
                        - `2` - 表示 Virtual Account
                      enum: ["1", "2"]
                      x-enum-details:
                        - value: "1"
                          label: Discretionary
                        - value: "2"
                          label: Virtual Account
                    ledger_date:
                      type: string
                      description: |-
                        用于按「生成日期 (系统日期)」筛选结果。
                    disable_batch_send:
                      type: string
                      description: |-
                        用于按「批量发送」筛选结果。

                        支持多选；提交时使用英文逗号（`,`）拼接多个值。不传时不按此字段筛选。

                        **可选值：**
                        - `0` - 表示支持批量发送
                        - `1` - 表示仅支持单笔发送
                      example: "0,1"
                      enum: ["0", "1"]
                      x-enum-details:
                        - value: "0"
                          hk: 支持批量發送
                          label: 支持批量发送
                        - value: "1"
                          hk: 僅支持單筆發送
                          label: 仅支持单笔发送
                page:
                  type: integer
                  description: |-
                    要查询的页码，从 `1` 开始。
                page_size:
                  type: integer
                  description: |-
                    每页返回的记录数量。
            example:
              filters: {}
              page: 1
              page_size: 20
      responses:
        "200":
          description: |-
            成功时分页返回「结单」记录，以及页码、每页数量和总记录数等分页信息。
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。

                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`
                      判断具体结果。

                      - `401`：未登录。
                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。
                    x-enum-details:
                      - value: 0
                        label: 成功
                  message:
                    type: string
                  data:
                    type: object
                    required:
                      - list
                      - total
                    properties:
                      list:
                        type: array
                        description: |-
                          **返回值：** 列表列表。
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: |-
                                **返回值：** 当前记录的唯一标识。
                            dt:
                              type: string
                              description: |-
                                **返回值：** 结单日期。
                            member_id:
                              type: string
                              description: |-
                                **返回值：** 客户编号。
                            account_no:
                              type: string
                              description: |-
                                **返回值：** 证券账号。
                            statement_account_name:
                              type: string
                              description: |-
                                **返回值：** 账户名称。
                            file_type:
                              type: string
                              description: |-
                                **返回值：** 结单类型。
                            file_type_val:
                              type: string
                              description: |-
                                字段 file_type 的原始值：file_type 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            state:
                              type: string
                              description: |-
                                **返回值：** 状态。
                            state_val:
                              type: string
                              description: |-
                                字段 state 的原始值：state 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            disable_batch_send:
                              type: string
                              description: |-
                                **返回值：** 批量发送。
                            disable_batch_send_val:
                              type: string
                              description: |-
                                字段 disable_batch_send 的原始值：disable_batch_send 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            statement_send:
                              type: string
                              description: |-
                                **返回值：** 线下发送。
                            statement_send_val:
                              type: string
                              description: |-
                                字段 statement_send 的原始值：statement_send 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            email_post_id:
                              type: string
                              description: |-
                                **返回值：** 邮件消息 ID。
                            notice:
                              type: string
                              description: |-
                                **返回值：** 结单提醒。
                            lang:
                              type: string
                              description: |-
                                **返回值：** 语言。
                            lang_val:
                              type: string
                              description: |-
                                字段 lang 的原始值：lang 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            member_name:
                              type: string
                              description: |-
                                **返回值：** 客户姓名。
                            broker_code:
                              type: string
                              description: |-
                                **返回值：** 经纪人账号。
                            account_mark:
                              type: string
                              description: |-
                                **返回值：** 账户标识。
                            ledger_date:
                              type: string
                              description: |-
                                **返回值：** 生成日期 (系统日期)；时间或日期格式以接口实际返回值为准。
                            generated_at:
                              type: string
                              description: |-
                                **返回值：** 生成时间；时间或日期格式以接口实际返回值为准。
                            sender:
                              type: string
                              description: |-
                                **返回值：** 发送人。
                      total:
                        type: integer
                        description: |-
                          **返回值：** 符合查询条件的记录总数，用于计算分页。
              example:
                code: 0
                message: success
                data:
                  list:
                    - id: "17205343"
                      dt: 20260714-20260714
                      member_id: "1000000000000000000"
                      account_no: H00000000
                      statement_account_name: ""
                      file_type: Temp Statement
                      file_type_val: "2"
                      state: Created Successfully
                      state_val: "1"
                      disable_batch_send: Enable Batch Send
                      disable_batch_send_val: "0"
                      statement_send: "NO"
