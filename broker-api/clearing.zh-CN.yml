  /v1/datasets/clearing_internal_check_summaries:
    get:
      operationId: clearing_internal_check_summaries
      summary: 清算 - 清算内部对账汇总
      x-verified: verified
      tags:
        - 清算管理
      x-permission-key:
        - lb_hk_clearing.clearing_busin_steps
      x-lbonly: false
      description: |-
        查询「清算 - 清算内部对账汇总」数据，可通过 `filters` 组合业务筛选条件，并使用 `page`、`page_size` 控制分页。

        ### 返回结果

        成功时返回匹配的记录列表及分页信息。各过滤字段的用途、可选值和动态数据来源见对应字段说明。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: |-
                    组合业务过滤条件。省略某个过滤字段时，不按该字段筛选。
                  properties:
                    ledger_date:
                      type: string
                      format: date
                      description: |-
                        用于按「执行日期」筛选结果。
                    task_code:
                      type: string
                      description: |-
                        用于按「任务名称」筛选结果。

                        **可选值：**
                        - `opposite_trade_details` - 表示交易对账（清算 VS 上手）
                        - `check_lending_settle_price_ready` - 表示存在融券结算价为 0 的标的
                        - `dawn_settlement_account_balance_changes` - 表示资金变动对账（清算 VS 资产服务）
                        - `dawn_settlement_equity_holding_changes` - 表示持仓变动对账（清算 VS 资产服务）
                        - `billing_outstandings` - 表示待交收合约对账（清算 VS 计费）
                        - `clearing_custodian_efficient` - 表示同客户、同标的跨子仓
                        - `clearing_custodian_equity_holdings` - 表示持仓对账（清算&仓位）
                        - `clearing_lending_fee_rates` - 表示融券利率缺失检查
                        - `billing_interests` - 表示待结算利息对账（清算 VS 计费）
                        - `billing_interest_settlements` - 表示利息结算对账（清算 VS 计费）
                        - `clearing_account_balance_outstandings` - 表示待交收资金对账（清算 VS 计费）
                        - `clearing_equity_holding_outstandings` - 表示待交收持仓对账（清算 VS 计费）
                        - `billing_lending_interests` - 表示待结算融券利息对账（清算 VS 计费）
                        - `billing_lending_interest_settlements` - 表示融券利息结算对账（清算 VS 计费）
                        - `billing_custodian_fee` - 表示待结算证券组合费对账（清算 VS 计费）
                        - `billing_va_custodian_fee` - 表示待结算虚拟资产托管费对账（清算 VS 计费）
                        - `extra_opposite_position_details` - 表示持仓对账（按子仓）（清算 VS 上手）
                        - `extra_dawn_settlement_account_balances` - 表示日切后资金余额对账（清算 VS 资产服务）
                        - `extra_dawn_settlement_equity_holdings` - 表示日切后持仓余额对账（清算 VS 资产服务）
                        - `trade_reconciliation_after_billing` - 表示计费后交易对账（流水管理 VS 清算）
                        - `clearing_reconciliation_of_holding` - 表示持仓对账（清算当日 VS 上日 + 变动 ）
                        - `clearing_reconciliation_of_balance` - 表示资金余额检查（清算当日 VS 上日 + 变动）
                        - `billing_va_custodian_fee_settlements` - 表示虚拟资产托管费结算对账（清算 VS 计费）
                        - `billing_custodian_fee_settlements` - 表示证券组合费结算对账（清算 VS 计费）
                        - `dawn_frozen_account_balance_changes` - 表示现金手工冻结对账（清算 VS 资产服务）
                        - `dawn_frozen_equity_holding_changes` - 表示持仓手工冻结对账（清算 VS 资产服务）
