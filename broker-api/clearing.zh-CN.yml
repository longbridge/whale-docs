                    - `true` - 表示条件成立
                    - `false` - 表示条件不成立
                force_send:
                  type: boolean
                  description: |-
                    是否强制发送。此字段为必填项。

                    **布尔值：**
                    - `true` - 表示条件成立
                    - `false` - 表示条件不成立
