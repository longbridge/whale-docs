        - 必填：`org_id`（机构ID）、`action_in`（动作类型）、`en`（英文文案配置）、`zh`（简体中文文案配置）、`hk`（繁体中文文案配置）
        - 可选：`key`（上传图片Key）、`front_payload`（变更差异载荷）、`audit_frontend_resource`（调用方提交的审计日志载荷）
        - 各字段的格式、取值范围和业务含义见对应字段说明。

        ### 业务说明

        更新结单文案配置。

        ### 处理结果

        成功时完成上述业务操作；后续状态和返回数据以 `200` 响应定义为准。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - org_id
                - action_in
                - en
                - zh
                - hk
              properties:
                org_id:
                  type: number
                  description: |-
                    机构ID，用于标识本次请求关联的业务对象。此字段为必填项。
                action_in:
                  type: number
                  description: |-
                    指定配置变更类型。

