openapi: 3.1.1
info:
  title: Longport Whale 券商 API
  description: 面向使用 Longport Whale 的券商提供机构级服务端 API。
  version: 2.0.0
servers:
  - url: https://b-api.longbridge.xyz
    description: 测试环境
  - url: https://b-api.lbkrs.com
    description: 生产环境
security:
  - bearerAuth: []
tags:
  - name: 资产账户
  - name: 款项管理
  - name: 证券管理
  - name: 新股认购
  - name: 基金管理
  - name: 虚拟资产管理
  - name: 清算管理
  - name: 公司行动
  - name: 风控管理
  - name: 报表管理
  - name: 经纪人管理
  - name: 会计中台
  - name: 交易面板
  - name: 公告管理
  - name: 业务参数设置
  - name: 可疑事件监控
  - name: 活动
  - name: 奖励中心
  - name: 其他
paths:
  /v1/datasets/booking_revise_select_contracts:
    get:
      operationId: booking_revise_select_contracts
      summary: 合约修正-选择旧合约
      x-verified: verified
      tags:
        - 清算管理
      x-permission-key:
        - lb_hk_clearing.contract_revise
      x-lbonly: false
      description: |-
        查询「交收流水」数据，可通过 `filters` 组合业务筛选条件，并使用 `page` 和 `page_size` 控制分页。

        ### 返回结果

        成功时返回匹配的记录列表及分页信息。各过滤字段的用途、可选值和动态数据来源见对应字段说明。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: |-
                    组合业务过滤条件。省略某个过滤字段时，不按该字段筛选。
                  properties:
                    "no":
                      type: string
                      description: |-
                        用于按「合约号」筛选结果。
                    datasource:
                      type: string
                      description: |-
                        用于按「数据来源」筛选结果。

                        **可选值：**
                        - `1` - 表示交易
                        - `2` - 表示股票卡
                        - `3` - 表示股票卡（公司账户）
                        - `4` - 表示后台
                        - `5` - 表示合约取消（冲正）
                        - `6` - 表示合约取消（新合约）
                        - `7` - 表示 WTT 补历史单
                        - `8` - 表示上游文件
                      enum:
                        - "1"
                        - "2"
                        - "3"
                        - "4"
                        - "5"
                        - "6"
                        - "7"
                        - "8"
                      x-enum-details:
                        - value: "1"
                          label: 交易
                        - value: "2"
                          label: 股票卡
                        - value: "3"
                          label: 股票卡（公司账户）
                        - value: "4"
                          label: 后台
                        - value: "5"
                          label: 合约取消（冲正）
                        - value: "6"
                          label: 合约取消（新合约）
                        - value: "7"
                          label: WTT 补历史单
                        - value: "8"
                          label: 上游文件
                    aaid:
                      type: string
                      description: |-
                        用于按「客户」筛选结果。
                    trade_ledger_date:
                      type: object
                      description: |-
                        用于按「账务日期」筛选结果。
                      properties:
                        gte:
                          type: string
                          format: date
                          description: |-
                            筛选范围的下限，匹配值包含该值。
                        lte:
                          type: string
                          format: date
                          description: |-
                            筛选范围的上限，匹配值包含该值。
                    contract.trade_date:
                      type: object
                      description: |-
                        用于按「交易日期」筛选结果。
                      properties:
                        gte:
                          type: string
                          format: date
                          description: |-
                            筛选范围的下限，匹配值包含该值。
                        lte:
                          type: string
                          format: date
                          description: |-
                            筛选范围的上限，匹配值包含该值。
                    expected_balance_settlement_date:
                      type: object
                      description: |-
                        用于按「钱交收日」筛选结果。
                      properties:
                        gte:
                          type: string
                          format: date
                          description: |-
                            筛选范围的下限，匹配值包含该值。
                        lte:
                          type: string
                          format: date
                          description: |-
                            筛选范围的上限，匹配值包含该值。
                    market:
                      type: string
                      description: |-
                        用于按「市场」筛选结果。

                        候选值会动态变化。请调用 `GET /v1/datasets/refs/clearing_config_markets` 获取当前可用的数据字典，并使用返回项的 `key` 作为本参数值。
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/clearing_config_markets
                    counter_id:
                      type: string
                      description: |-
                        用于按「证券代码」筛选结果。
                    state:
                      type: string
                      description: |-
                        用于按「状态」筛选结果。

                        **可选值：**
                        - `2` - 表示待计费
                        - `3` - 表示待收费
                        - `4` - 表示待交收
                        - `5` - 表示交收完成
                        - `6` - 表示券已交收
                        - `1` - 表示初始化
                        - `-1` - 表示--
                      enum:
                        - "2"
                        - "3"
                        - "4"
                        - "5"
                        - "6"
                        - "1"
                        - "-1"
                      x-enum-details:
                        - value: "2"
                          label: 待计费
                        - value: "3"
                          label: 待收费
                        - value: "4"
                          label: 待交收
                        - value: "5"
                          label: 交收完成
                        - value: "6"
                          label: 券已交收
                        - value: "1"
                          label: 初始化
                        - value: "-1"
                          label: "--"
                    settlement_channel:
                      type: string
                      description: |-
                        用于按「结算渠道」筛选结果。

                        候选值会动态变化。请调用 `GET /v1/datasets/refs/billing_settlement_channel` 获取当前可用的数据字典，并使用返回项的 `key` 作为本参数值。
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/billing_settlement_channel
                    direction:
                      type: string
                      description: |-
                        用于按「方向」筛选结果。

                        **可选值：**
                        - `1` - 表示买
                        - `2` - 表示卖
                      enum:
                        - "1"
                        - "2"
                      x-enum-details:
                        - value: "1"
                          label: 买
                        - value: "2"
                          label: 卖
                    task_no:
                      type: string
                      description: |-
                        用于按「交收批次号」筛选结果。
                    currency:
                      type: string
                      description: |-
                        用于按「币种」筛选结果。

                        候选值会动态变化。请调用 `GET /v1/datasets/refs/tenant_currencies` 获取当前可用的数据字典，并使用返回项的 `key` 作为本参数值。
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/tenant_currencies
                    contract.biz_type:
                      type: string
                      description: |-
                        用于按「业务类型」筛选结果。

                        候选值会动态变化。请调用 `GET /v1/datasets/refs/billing_business_type` 获取当前可用的数据字典，并使用返回项的 `key` 作为本参数值。
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/billing_business_type
                    trade_ledger_date_ne:
                      type: string
                      description: |-
                        用于按「trade_ledger_date_ne」筛选结果。
                page:
                  type: integer
                  description: |-
                    要查询的页码，从 `1` 开始。
                page_size:
                  type: integer
                  description: |-
                    每页返回的记录数量。
            example:
              filters: {}
              page: 1
              page_size: 20
      responses:
        "200":
          description: |-
            成功时分页返回「交收流水」记录，以及页码、每页数量和总记录数等分页信息。
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。

                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`
                      判断具体结果。

                      - `401`：未登录。
                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。
                    x-enum-details:
                      - value: 0
                        label: 成功
                  message:
                    type: string
                  data:
                    type: object
                    required:
                      - list
                      - total
                    properties:
                      list:
                        type: array
                        description: |-
                          **返回值：** 列表列表。
                        items:
                          type: object
                          properties:
                            trade_ledger_date:
                              type: string
                              description: |-
                                **返回值：** 账务日期；时间或日期格式以接口实际返回值为准。
                            trade_date:
                              type: string
                              description: |-
                                **返回值：** 交易日期；时间或日期格式以接口实际返回值为准。
                            datasource:
                              type: string
                              description: |-
                                **返回值：** 创建方式。
                            datasource_val:
                              type: string
                              description: |-
                                字段 datasource 的原始值：datasource 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            "no":
                              type: string
                              description: |-
                                **返回值：** 合约号。
                            aaid:
                              type: string
                              description: |-
                                **返回值：** 证券账号。
                            aaid_val:
                              type: string
                              description: |-
                                字段 aaid 的原始值：aaid 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            market:
                              type: string
                              description: |-
                                **返回值：** 市场。
                            position:
                              type: string
                              description: |-
                                **返回值：** 长短仓。
                            settlement_account:
                              type: string
                              description: |-
                                **返回值：** 大账号。
                            counter_id:
                              type: string
                              description: |-
                                **返回值：** 证券代码。
                            direction:
                              type: string
                              description: |-
                                **返回值：** 交易方向。
                            direction_val:
                              type: string
                              description: |-
                                字段 direction 的原始值：direction 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            trade_quantity:
                              type: string
                              description: |-
                                **返回值：** 交易数量。
                            currency:
                              type: string
                              description: |-
                                **返回值：** 币种。
                            trade_amount:
                              type: string
                              description: |-
                                **返回值：** 交易金额。
                            ibond_amount:
                              type: string
                              description: |-
                                **返回值：** 累计利息。
                            receivable_amount:
                              type: string
                              description: |-
                                **返回值：** 应收费用。
                            deduction_amount:
                              type: string
                              description: |-
                                **返回值：** 抵扣金额。
                            bill_amount:
                              type: string
                              description: |-
                                **返回值：** 实收费用。
                            calculate_out_amount:
                              type: string
                              description: |-
                                **返回值：** 计费金额。
                            policy_version:
                              type: string
                              description: |-
                                **返回值：** 计费版本号。
                            expected_balance_settlement_date:
                              type: string
                              description: |-
                                **返回值：** 钱交收日；时间或日期格式以接口实际返回值为准。
                            expected_equity_settlement_date:
                              type: string
                              description: |-
                                **返回值：** 货交收日；时间或日期格式以接口实际返回值为准。
                            state:
                              type: string
                              description: |-
                                **返回值：** 状态。
                            state_val:
                              type: string
                              description: |-
                                字段 state 的原始值：state 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            settled_at:
                              type: string
                              description: |-
                                **返回值：** 实际交收时间；时间或日期格式以接口实际返回值为准。
                            biz_type:
                              type: string
                              description: |-
                                **返回值：** 业务类型。
                            biz_type_val:
                              type: string
                              description: |-
                                字段 biz_type 的原始值：biz_type 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            settlement_channel:
                              type: string
                              description: |-
                                **返回值：** 结算渠道。
                            settlement_channel_val:
                              type: string
                              description: |-
                                字段 settlement_channel 的原始值：settlement_channel 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            stage:
                              type: string
                              description: |-
                                **返回值：** 交易阶段。
                            stage_val:
                              type: string
                              description: |-
                                字段 stage 的原始值：stage 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            custodian_id:
                              type: string
                              description: |-
                                **返回值：** 代理商。
                            custodian_id_val:
                              type: string
                              description: |-
                                字段 custodian_id 的原始值：custodian_id 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            security_type:
                              type: string
                              description: |-
                                **返回值：** 标的类型。
                            security_type_val:
                              type: string
                              description: |-
                                字段 security_type 的原始值：security_type 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            security_category:
                              type: string
                              description: |-
                                **返回值：** 标的子类型。
                            security_category_val:
                              type: string
                              description: |-
                                字段 security_category 的原始值：security_category 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            account_region:
                              type: string
                              description: |-
                                **返回值：** 客户地区。
                            account_region_val:
                              type: string
                              description: |-
                                字段 account_region 的原始值：account_region 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            account_location:
                              type: string
                              description: |-
                                **返回值：** 客户地址。
                            account_location_val:
                              type: string
                              description: |-
                                字段 account_location 的原始值：account_location 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            offset_contract_no:
                              type: string
                              description: |-
                                **返回值：** 冲正合约号。
                            new_contract_no:
                              type: string
                              description: |-
                                **返回值：** 新合约号。
                            origin_contract_no:
                              type: string
                              description: |-
                                **返回值：** 旧合约号。
                            currency_setl:
                              type: string
                              description: |-
                                **返回值：** 结算币种。
                            trade_to_setl_exchange_rate:
                              type: string
                              description: |-
                                **返回值：** 汇率。
                            contract_id:
                              type: string
                              description: |-
                                **返回值：** 合约编号。
                            admin_id:
                              type: string
                              description: |-
                                **返回值：** 最近更新人。
                            admin_id_val:
                              type: string
                              description: |-
                                字段 admin_id 的原始值：admin_id 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            created_at:
                              type: string
                              description: |-
                                **返回值：** 创建时间；时间或日期格式以接口实际返回值为准。
                            updated_at:
                              type: string
                              description: |-
                                **返回值：** 最后更新时间；时间或日期格式以接口实际返回值为准。
                            open_close:
                              type: string
                              description: |-
                                **返回值：** 开仓/平仓。
                      total:
                        type: integer
                        description: |-
                          **返回值：** 符合查询条件的记录总数，用于计算分页。
              example:
                code: 0
                message: success
                data:
                  list:
                    - trade_ledger_date: "20260714"
                      trade_date: 2026-07-14
                      datasource: Trade
                      datasource_val: "1"
                      "no": OS2026071610152
                      aaid: H00000000
                      aaid_val: "10000000"
                      market: SH
                      position: LONG
                      settlement_account: ""
                      counter_id: ST/SH/600519
                      direction: Buy
                      direction_val: "1"
                      trade_quantity: "500"
                      currency: CNH
                      trade_amount: "609,950"
                      ibond_amount: ""
                      receivable_amount: "60,422.53"
                      deduction_amount: "0"
                      bill_amount: "60,422.53"
                      calculate_out_amount: "60,422.53"
                      policy_version: "699735"
                      expected_balance_settlement_date: 2026-07-15
                      expected_equity_settlement_date: 2026-07-14
                      state: Equity settled
                      state_val: "6"
                      settled_at: ""
                      biz_type: Stock Trade
                      biz_type_val: "1"
                      settlement_channel: "settlement_ex_hk & CCASS"
                      settlement_channel_val: "5"
                      stage: Normal
                      stage_val: "1"
                      custodian_id: "0"
                      custodian_id_val: "0"
                      security_type: Stock
                      security_type_val: ST
                      security_category: "0"
                      security_category_val: "0"
                      account_region: Hong Kong China
                      account_region_val: HK
                      account_location: ""
                      account_location_val: ""
                      offset_contract_no: ""
                      new_contract_no: ""
                      origin_contract_no: ""
                      currency_setl: CNH
                      trade_to_setl_exchange_rate: "1"
                      contract_id: "7935685"
                      admin_id: "--"
                      admin_id_val: "0"
                      created_at: "1784185008"
                      updated_at: "1784185008"
                      open_close: OPEN
                  total: 443

        "400":
          description: |-
            请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
        "401":
          description: |-
            未登录或登录状态已失效。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
        "403":
          description: |-
            当前账号未获得该功能授权。请在 User Permission 中为该账号开通相应权限。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
        "408":
          description: |-
            请求处理超时。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
      x-mint:
        href: /zh-CN/api-reference/booking_revise_select_contracts
        metadata:
          sidebarTitle: 合约修正-选择旧合约
      x-post-fallback: true
  /v1/datasets/booking_stock_exchange_contract_revises:
    get:
      operationId: booking_stock_exchange_contract_revises
      summary: 合约修正列表
      x-verified: verified
      tags:
        - 清算管理
      x-permission-key:
        - lb_hk_clearing.contract_revise
      x-lbonly: false
      description: |-
        查询「合约修正列表」数据，可通过 `filters` 组合业务筛选条件，并使用 `page` 和 `page_size` 控制分页。

        ### 返回结果

        成功时返回匹配的记录列表及分页信息。各过滤字段的用途、可选值和动态数据来源见对应字段说明。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: |-
                    组合业务过滤条件。省略某个过滤字段时，不按该字段筛选。
                  properties:
                    origin_contract_no:
                      type: string
                      description: |-
                        用于按「旧合约号」筛选结果。
                    new_contract_no:
                      type: string
                      description: |-
                        用于按「新合约号」筛选结果。
                    audit_state:
                      type: string
                      description: |-
                        用于按「审批状态」筛选结果。

                        **可选值：**
                        - `1` - 表示审批中
