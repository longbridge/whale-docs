                  message:
                    type: string
                  data:
                    type: object
                    required:
                      - list
                      - total
                    properties:
                      list:
                        type: array
                        description: |-
                          **返回值：** 列表列表。
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: |-
                                **返回值：** 当前记录的唯一标识。
                            ledger_date:
                              type: string
                              description: |-
                                **返回值：** 账务日期；时间或日期格式以接口实际返回值为准。
                            parent_account_channel:
                              type: string
                              description: |-
                                **返回值：** 上手企业编号。
                            market:
                              type: string
                              description: |-
                                **返回值：** 市场。
                            file_type:
                              type: string
                              description: |-
                                **返回值：** 文件类型。
                            file_type_val:
                              type: string
                              description: |-
                                字段 file_type 的原始值：file_type 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            file_name:
                              type: string
                              description: |-
                                **返回值：** 文件名。
                            state:
                              type: string
                              description: |-
                                **返回值：** 状态。
                            state_val:
                              type: string
                              description: |-
                                字段 state 的原始值：state 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            created_at:
                              type: string
                              description: |-
                                **返回值：** 创建时间；时间或日期格式以接口实际返回值为准。
                            updated_at:
                              type: string
                              description: |-
                                **返回值：** 更新时间；时间或日期格式以接口实际返回值为准。
                      total:
                        type: integer
                        description: |-
                          **返回值：** 符合查询条件的记录总数，用于计算分页。
              example:
                code: 0
                message: success
                data:
                  list:
                    - id: string
                      ledger_date: string
                      parent_account_channel: string
                      market: string
                      file_type: string
                      file_type_val: string
                      file_name: string
                      state: string
                      state_val: string
                      created_at: string
                      updated_at: string
                  total: 0

        "400":
          description: |-
            请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
        "401":
          description: |-
            未登录或登录状态已失效。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
        "403":
          description: |-
            当前账号未获得该功能授权。请在 User Permission 中为该账号开通相应权限。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
        "408":
          description: |-
            请求处理超时。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
