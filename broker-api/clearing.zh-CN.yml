                              description: 字段 operator 的原始值：operator 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                      total:
                        type: integer
                        description: '**返回值：** 符合查询条件的记录总数，用于计算分页。'
