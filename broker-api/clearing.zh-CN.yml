  /billing/company_task_edit:
    post:
      operationId: billing_company_task_edit
      summary: 修改机构合约延迟交收
      x-verified: verified
      tags:
        - 清算管理
      x-permission-key:
        - lb_hk_clearing.contract_manage_query
      x-lbonly: false
      description: |-
        修改机构合约的延迟交收，仅当钱交收日或货交收日不早于账务日、且来源非机构冲正时可执行。

        ### 请求参数

        - 必填：`task_id`（任务 ID）、`modify_action`（延迟调整类型）、`trade_ledger_date`（账务日）
        - 可选：`trade_amount`（交易金额）、`ibond_amount`（累计利息）、`trade_quantity`（交易数量）、`expected_balance_settlement_date`（钱交收日）、`expected_equity_settlement_date`（货交收日）
        - 各字段的格式、取值范围和业务含义见对应字段说明。

        ### 风险提示

        此操作可能引起真实资金、持仓或交易状态变化。调用前请确认目标记录和参数无误。

        ### 处理结果

        成功时完成上述业务操作；后续状态和返回数据以 `200` 响应定义为准。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - task_id
                - modify_action
                - trade_ledger_date
              properties:
                task_id:
                  type: number
                  description: 任务ID，用于标识本次请求关联的业务对象。此字段为必填项。
                modify_action:
                  type: number
                  description: 用于指定「延迟调整类型」。此字段为必填项。
                  enum:
                    - '0'
                    - '1'
                    - '2'
                  x-enum-details:
                    - value: '0'
                      hk: 錢券都修改
                      label: 钱券都修改
                    - value: '1'
                      hk: 僅錢調整
                      label: 仅钱调整
                    - value: '2'
                      hk: 僅券調整
                      label: 仅券调整
                  example: '0'
                trade_amount:
                  type: string
                  description: modify_action 为 0/1 时必填，不能大于原 trade_amount
                ibond_amount:
                  type: string
                  description: 用于指定「累计利息」。
                trade_quantity:
                  type: string
                  description: modify_action 为 0/2 时必填，不能大于原 trade_quantity
                expected_balance_settlement_date:
                  type: string
                  description: 用于指定「钱交收日」。
                expected_equity_settlement_date:
                  type: string
                  description: 用于指定「货交收日」。
                trade_ledger_date:
                  type: number
                  description: |-
                    交易账务日期。该清算合同任务归属的账务日；新建时默认取清算系统当前账务日。
                  x-format: date-int-yyyymmdd
            example:
              task_id: 123
              modify_action: 0
              trade_amount: ''
              ibond_amount: ''
              trade_quantity: ''
              expected_balance_settlement_date: 20260710
              expected_equity_settlement_date: 20260710
              trade_ledger_date: 20260710
      responses:
        '200':
          description: 请求处理成功。响应的 `data` 不包含额外业务字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。

                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`
                      判断具体结果。

                      - `401`：未登录。
                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。
                    x-enum-details:
                      - value: 0
                        label: 成功
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登录或登录状态已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 当前账号未获得该功能授权。请在 User Permission 中为该账号开通相应权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 请求处理超时。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
