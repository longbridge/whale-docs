openapi: 3.1.1
info:
  title: Longport Whale Broker API
  description: Institution-grade server-to-server API for brokers running on Longport Whale.
  version: 2.0.0
servers:
  - url: https://b-api.longbridge.xyz
    description: Test
  - url: https://b-api.lbkrs.com
    description: Production
security:
  - bearerAuth: []
tags:
  - name: Stock Management
paths:
  /atm/create/rollover/stock/limit:
    post:
      operationId: create_rollover_stock_limit
      summary: Create Rollover Stock Limit
      tags:
        - Stock Management
      x-permission-key:
        - atm.rollover_stock_limit_update
      x-lbonly: false
      description: |-
        Creates a securities-transfer-in restriction using only `counter_id`.

        ### Request parameters

        - Required: `counter_id` (Stock Code)
        - See each field for its format, allowed values, default behavior, and business meaning.

        ### Result

        On success, the endpoint completes the described business operation. See the `200` response schema for returned data.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - counter_id
              properties:
                counter_id:
                  type: string
                  description: Stock Code. Corresponds to the request field counter-id field.
            example:
              counter_id: 700.HK
      responses:
        '200':
          description: The request was processed successfully. The response `data` does not contain additional business fields.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      `0` indicates success. A non-zero value is a business error code, in which case
                      `data` is usually empty.

                      HTTP status codes use their standard semantics. A successful request normally
                      returns `200`; errors may return `400`, `401`, `403`, `408`, or another applicable
                      status. Interpret the HTTP status together with the business `code`.

                      - `401`: The user is not authenticated.
                      - `403`: The current account is not authorized to use this function. Grant access
                        through User Permission.
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: Bad request. Check the business error code in `code` and the error details in `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: The user is not authenticated, or the login session has expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: The current account is not authorized to use this feature. Grant the required permission to the account in User Permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: The request timed out. Check the business error code in `code` and the error details in `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
      x-mint:
        href: /en/api-reference/create_rollover_stock_limit
        metadata:
          sidebarTitle: Create Rollover Stock Limit
  /atm/create_modify_brokers_my_v3:
    post:
      operationId: create_modify_brokers_my_v3
      summary: Create/Modify My Broker Info
      tags:
        - Stock Management
      x-permission-key:
        - cmbc.broker_my
      x-lbonly: false
      description: |-
        Uses the V3 endpoint. Includes `id` when editing and omits it when creating. This changes live
        broker configuration.

        ### Request parameters

        - Required: `market` (Market), `code` (Code), `name` (Name of channel broker), `company_name` (Name of Counter Company), `contact` (Contact), `contact_email` (Contact Email), `contact_phones` (Contact Phone)
        - Optional: `id` (Broker Record ID), `account` (Broker Account), `audit_frontend_resource` (Audit Context)
        - See each field for its format, allowed values, default behavior, and business meaning.

        ### Result

        On success, the endpoint completes the described business operation. See the `200` response schema for returned data.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - market
                - code
                - name
                - company_name
                - contact
                - contact_email
                - contact_phones
              properties:
                id:
                  type: string
                  description: Broker Record ID. Provided only when editing an existing record; not sent when creating.
                market:
                  type: string
                  description: |-
                    Market. Dropdown selection. This field is disabled and cannot be modified when editing.

                    **Allowed values:**
                    - `us` - US Market
                    - `cn` - CN Market
                    - `hk` - HK Market
                    - `sg` - SG Market
                  enum:
                    - us
                    - cn
                    - hk
                    - sg
                code:
                  type: string
                  description: Code. Specifies Code. This field is required.
                name:
                  type: string
                  description: Name of channel broker. Specifies Name of channel broker. This field is required.
                company_name:
                  type: string
                  description: Name of Counter Company. Specifies Name of Counter Company. This field is required.
                account:
                  type: string
                  description: Broker Account. Specifies Broker Account.
                contact:
                  type: string
                  description: Contact. Specifies Contact. This field is required.
                contact_email:
                  type: string
                  description: Contact Email. Specifies Contact Email. This field is required.
                contact_phones:
                  type: array
                  description: |-
                    Contact Phone. An array of { contact_phone: string }; multiple contact phones can be added or removed
                    dynamically, and each must match the regex ^[A-Za-z0-9,.\-+\s]+$.
                  items:
                    type: string
                audit_frontend_resource:
                  type: object
                  description: |-
                    Audit Context. An audit-trail field automatically appended by the client, containing
                    $action/$behavior and the original field values prior to editing; not a business
                    parameter.
            example:
              market: HK
              code: HKG001
              name: 示例渠道券商
              company_name: 示例柜台公司
              account: ACC00001
              contact: 张三
              contact_email: user@example.com
              contact_phones:
                - contact_phone: 85200000000
      responses:
        '200':
          description: The request was processed successfully. The response `data` does not contain additional business fields.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      `0` indicates success. A non-zero value is a business error code, in which case
                      `data` is usually empty.

                      HTTP status codes use their standard semantics. A successful request normally
                      returns `200`; errors may return `400`, `401`, `403`, `408`, or another applicable
                      status. Interpret the HTTP status together with the business `code`.

                      - `401`: The user is not authenticated.
                      - `403`: The current account is not authorized to use this function. Grant access
                        through User Permission.
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: Bad request. Check the business error code in `code` and the error details in `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: The user is not authenticated, or the login session has expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: The current account is not authorized to use this feature. Grant the required permission to the account in User Permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: The request timed out. Check the business error code in `code` and the error details in `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
      x-mint:
        href: /en/api-reference/create_modify_brokers_my_v3
        metadata:
          sidebarTitle: Create/Modify My Broker Info
  /atm/stand_up_down_brokers_my:
    post:
      operationId: stand_up_down_brokers_my
      summary: Enable/Disable My Broker
      tags:
        - Stock Management
      x-permission-key:
        - cmbc.broker_my
      x-lbonly: false
      description: |-
        Called after confirmation. This changes the broker's live listing status.

        ### Request parameters

        - Required: `brokers_my_id` (My Broker Record ID), `is_valid` (Is Valid/Enabled)
        - Optional: `audit_frontend_resource` (Audit Context)
        - See each field for its format, allowed values, default behavior, and business meaning.

        ### Result

        On success, the endpoint completes the described business operation. See the `200` response schema for returned data.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - brokers_my_id
                - is_valid
              properties:
                brokers_my_id:
                  type: string
                  description: My Broker Record ID. Corresponds to the list row record.id.
                is_valid:
                  type: integer
                  description: |-
                    Is Valid/Enabled. 1 = listed (Stand up), 0 = delisted (Stand down).

                    **Allowed values:**
                    - `1` - Stand up
                    - `0` - Stand down
                  enum:
                    - '1'
                    - '0'
                audit_frontend_resource:
                  type: object
                  description: Audit Context. Auto-attached by the client, containing only the $behavior text (list/delist prompt); not a business field.
            example:
              brokers_my_id: '1'
              is_valid: 1
      responses:
        '200':
          description: The request was processed successfully. The response `data` does not contain additional business fields.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      `0` indicates success. A non-zero value is a business error code, in which case
                      `data` is usually empty.

                      HTTP status codes use their standard semantics. A successful request normally
                      returns `200`; errors may return `400`, `401`, `403`, `408`, or another applicable
                      status. Interpret the HTTP status together with the business `code`.

                      - `401`: The user is not authenticated.
                      - `403`: The current account is not authorized to use this function. Grant access
                        through User Permission.
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: Bad request. Check the business error code in `code` and the error details in `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: The user is not authenticated, or the login session has expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: The current account is not authorized to use this feature. Grant the required permission to the account in User Permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: The request timed out. Check the business error code in `code` and the error details in `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
      x-mint:
        href: /en/api-reference/stand_up_down_brokers_my
        metadata:
          sidebarTitle: Enable/Disable My Broker
  /atm/create_modify_brokers_v2:
    post:
      operationId: create_modify_brokers_v2
      summary: Create/Modify Rival Broker Info
      tags:
        - Stock Management
      x-permission-key:
        - cmbc.broker_rival
      x-lbonly: false
      description: |-
        Cross-check with the audit template. `name` and `app_name` are localized fields split into `_en`,
        `_cn`, and `_hk` before submission. `is_has_attachment` uses `atm_brokers_attachment` reference
        data. Include `id` only when editing. This changes live broker configuration.

        ### Request parameters

        - Required: `market` (Market), `name_en` (Channel Broker (English)), `name_cn` (Channel Broker (Simplified Chinese)), `name_hk` (Channel Broker (Traditional Chinese)), `app_name_en` (Broker App Name (English)), `app_name_cn` (Broker App Name (Simplified Chinese)), `app_name_hk` (Broker App Name (Traditional Chinese)), `stock_limit` (Stock Number Limited), `code` (Code), `contact` (Contact), `is_has_attachment` (Any Attachment), `tpl_email` (Template Key for Transfer Email), `show_name` (Display Name of Our Broker), `priority` (Priority), `state` (State)
        - Optional: `id` (Rival Broker Record ID), `contact_phone` (Contact Phone), `contact_email` (Contact Email), `icon` (Broker Logo), `website` (Website Address), `file_list` (Attachment File List), `audit_frontend_resource` (Audit Context)
        - See each field for its format, allowed values, default behavior, and business meaning.

        ### Result

        On success, the endpoint completes the described business operation. See the `200` response schema for returned data.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - market
                - name_en
                - name_cn
                - name_hk
                - app_name_en
                - app_name_cn
                - app_name_hk
                - stock_limit
                - code
                - contact
                - is_has_attachment
                - tpl_email
                - show_name
                - priority
                - state
              properties:
                id:
                  type: string
                  description: Rival Broker Record ID. Passed only when editing an existing record; omitted when creating.
                market:
                  type: string
                  description: |-
                    Market. Dropdown value from `select`. The field is disabled and cannot be changed when
                    editing.

                    **Allowed values:**
                    - `us` - US Market
                    - `cn` - CN Market
                    - `hk` - HK Market
                    - `sg` - SG Market
                  enum:
                    - us
                    - cn
                    - hk
                    - sg
                name_en:
                  type: string
                  description: Channel Broker (English). Specifies Channel Broker (English). This field is required.
                name_cn:
                  type: string
                  description: Channel Broker (Simplified Chinese). Specifies Channel Broker (Simplified Chinese). This field is required.
                name_hk:
                  type: string
                  description: Channel Broker (Traditional Chinese). Specifies Channel Broker (Traditional Chinese). This field is required.
                app_name_en:
                  type: string
                  description: Broker App Name (English). Specifies Broker App Name (English). This field is required.
                app_name_cn:
                  type: string
                  description: Broker App Name (Simplified Chinese). Specifies Broker App Name (Simplified Chinese). This field is required.
                app_name_hk:
                  type: string
                  description: Broker App Name (Traditional Chinese). Specifies Broker App Name (Traditional Chinese). This field is required.
                stock_limit:
                  type: integer
                  description: Stock Number Limited. Specifies Stock Number Limited. This field is required.
                code:
                  type: string
                  description: Code. Specifies Code. This field is required.
                contact:
                  type: string
                  description: Contact. Specifies Contact. This field is required.
                is_has_attachment:
                  type: string
                  description: |-
                    Any Attachment. A radio field whose value comes from the keys of ref atm_brokers_attachment (e.g.
                    1=has attachment / 0=no attachment; the exact enum is determined by the ref). When it
                    is 1, website is optional and contact_phone/contact_email are required; for other
                    values, the opposite applies.

                    **Allowed values:**
                    - `1` - Yes
                    - `0` - No
                  enum:
                    - '1'
                    - '0'
                contact_phone:
                  type: string
                  description: Contact Phone. Required when is_has_attachment indicates an attachment is present; must match the regex ^[A-Za-z0-9,.\-+\s]+$.
                contact_email:
                  type: string
                  description: Contact Email. Required when is_has_attachment indicates there is an attachment; must be in email format.
                tpl_email:
                  type: string
                  description: Template Key for Transfer Email. Specifies Template Key for Transfer Email. This field is required.
                icon:
                  type: string
                  description: Broker Logo. Specifies Broker Logo.
                show_name:
                  type: string
                  description: |-
                    Display Name of Our Broker. A radio field.

                    **Allowed values:**
                    - `1` - Name Of Counter Company
                    - `0` - Name Of Channel Broker
                  enum:
                    - '1'
                    - '0'
                website:
                  type: string
                  description: Website Address. Required when is_has_attachment indicates no attachment.
                priority:
                  type: integer
                  description: Priority. Processing priority. Interpret the value and sort order according to the allowed-value definitions. This field is required.
                state:
                  type: string
                  description: |-
                    State. 1 = Enable, 2 = Disable; defaults to 1.

                    **Allowed values:**
                    - `1` - Enable
                    - `2` - Disable
                  enum:
                    - '1'
                    - '2'
                file_list:
                  type: array
                  description: Attachment File List. Array of file keys returned after uploading files for `review_urls`.
                  items:
                    type: string
                audit_frontend_resource:
                  type: object
                  description: Audit Context. Auto-appended by the client for audit-log display; not a business field.
            example:
              market: HK
              name_en: Sample Broker
              name_cn: 示例券商
              name_hk: 示例券商
              app_name_en: Sample App
              app_name_cn: 示例应用
              app_name_hk: 示例應用
              stock_limit: 100
              code: HKG001
              contact: 李四
              is_has_attachment: '1'
              contact_phone: 85200000000
              contact_email: user@example.com
              tpl_email: user@example.com
              icon: https://example.com/logo.png
              show_name: '1'
              website: https://example.com
              priority: 10
              state: '1'
              file_list:
                - upload_key_1
      responses:
        '200':
          description: The request was processed successfully. The response `data` does not contain additional business fields.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      `0` indicates success. A non-zero value is a business error code, in which case
                      `data` is usually empty.

                      HTTP status codes use their standard semantics. A successful request normally
                      returns `200`; errors may return `400`, `401`, `403`, `408`, or another applicable
                      status. Interpret the HTTP status together with the business `code`.

                      - `401`: The user is not authenticated.
                      - `403`: The current account is not authorized to use this function. Grant access
                        through User Permission.
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: Bad request. Check the business error code in `code` and the error details in `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: The user is not authenticated, or the login session has expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: The current account is not authorized to use this feature. Grant the required permission to the account in User Permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: The request timed out. Check the business error code in `code` and the error details in `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
      x-mint:
        href: /en/api-reference/create_modify_brokers_v2
        metadata:
          sidebarTitle: Create/Modify Rival Broker Info
