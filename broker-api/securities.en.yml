      required:
        - code
        - message
        - data
      properties:
        code:
          type: integer
        message:
          type: string
        data: {}
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Broker ACCESS_TOKEN sent as `Authorization: Bearer <token>`.'
