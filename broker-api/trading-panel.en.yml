  /v1/datasets/fund_frontend_member_orders/download:
    post:
      operationId: fund_frontend_member_orders_download
      summary: Fund Front-End Order Export
      tags:
      - Trading Panel
      x-permission-key:
      - fund.ut_order
      - ut_batch_order.query
      x-lbonly: false
      description: 'Exports Fund Front-End Order data to a file. `filters` defines the export scope, and
        `down_fields` can restrict the exported columns.


        ### Export modes


        - `mode: 0`: synchronous export; the download URL is returned directly on success.

        - `mode: 1`: asynchronous export; the API first returns `file_download_id`. Call `GET /v1/datasets/download/{id}`
        to obtain the download URL.

        - When the export record is no longer needed, delete it with `DELETE /v1/datasets/download/{id}`.'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: Uses the same fields as the query filters in `fund_frontend_member_orders.yaml`.
                  properties:
                    member_id:
                      type: string
                      description: Filters results by Member ID.
                    state:
                      type: string
                      description: 'Filters results by State.


                        **Allowed values:**

                        - `Init` - Initial State

                        - `Cutoff` - Cutoff Completed

                        - `Submitted` - Order Submitted

                        - `FundsSettled` - Redemp. and Delivery in Kind

                        - `Done` - Order Completed

                        - `Canceled` - Order Canceled

                        - `Confirmed` - Order Confirmed

                        - `Rejected` - Order Rejected'
                      enum:
                      - Init
                      - Cutoff
                      - Submitted
                      - FundsSettled
                      - Done
                      - Canceled
                      - Confirmed
                      - Rejected
                      x-enum-details:
                      - value: Init
                        label: Initial State
                      - value: Cutoff
                        label: Cutoff Completed
                      - value: Submitted
                        label: Order Submitted
                      - value: FundsSettled
                        label: Redemp. and Delivery in Kind
                      - value: Done
                        label: Order Completed
                      - value: Canceled
                        label: Order Canceled
                      - value: Confirmed
                        label: Order Confirmed
                      - value: Rejected
                        label: Order Rejected
                mode:
                  type: integer
                  default: 0
                  description: 'Defaults to `0` (synchronous mode) when omitted.


                    **Allowed values:**

                    - `0` - Sync

                    - `1` - Async'
                  enum:
                  - 0
                  - 1
                  x-enum-details:
                  - value: 0
                    label: Sync
                  - value: 1
                    label: Async
                ext:
                  type: string
                  description: 'Download file format. Defaults to `csv` when omitted.


