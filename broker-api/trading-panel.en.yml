- name: Trading Panel
  description: 'Back-office management APIs for the trading panel: order management, fund order placement
    / batch

    placement, and more.'
paths:
  /ut/order/admin/submit:
    post:
      operationId: fund_order_submit
      summary: Submit Fund Order
      tags:
      - Trading Panel
      x-permission-key:
      - lb_hk_order_pots.ut_order_submit
      x-lbonly: false
      description: 'Submit Fund Order.


        ### Request parameters


        - Required: `aaid` (AAID), `member_id` (Member ID), `account_channel` (Account Channel), `currency`
        (Currency), `counter_id` (Fund Counter ID), `action` (Action)

        - Optional: `fund_channel` (Fund Channel), `amount` (Amount), `units` (Units), `fee` (Fee), `remark`
        (Remark)

        - See each field for its format, allowed values, and business meaning.


        ### Result


        On success, the endpoint completes the operation. See the `200` response schema for returned data
        and subsequent state information.'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - aaid
              - member_id
              - account_channel
              - currency
              - counter_id
              - action
              properties:
                aaid:
                  type: string
                  description: Specifies AAID. This field is required.
                member_id:
                  type: string
                  description: Customer ID, populated from the selected customer information.
                account_channel:
                  type: string
                  description: The account channel, taken from the selected client's account-opening channel.
                currency:
                  type: string
                  description: Currency code used for this request. This field is required.
                fund_channel:
                  type: string
                  description: 'The fund channel; the values come from the fund_channel dynamic enum and
                    are not fixed.


                    Call `GET /v1/datasets/refs/fund_channel` to retrieve the current data dictionary,
                    and use the returned entry''s `key` as this field''s value.'
                  x-value-source:
                    endpoint: GET /v1/datasets/refs/fund_channel
                counter_id:
                  type: string
                  description: The fund's internal code, selected via fund search.
                action:
                  type: string
                  description: 'Trade direction; defaults to BUY.


                    **Allowed values:**

                    - `BUY` - Buy

                    - `SELL` - Sell'
                  enum:
                  - BUY
                  - SELL
                  x-enum-details:
                  - value: BUY
                    label: Buy
                  - value: SELL
                    label: Sell
                amount:
                  type: number
                  description: The subscription amount; required only when buying (action=BUY).
                units:
                  type: number
                  description: 'The redemption units; required only when selling (action=SELL), subject
                    to validation

                    against the sellable units and unit precision.'
                fee:
                  type: number
                  description: The commission; required only when buying (action=BUY).
                remark:
                  type: string
                  description: Specifies Remark.
            example:
              aaid: H00000000
              member_id: '1000000000000000000'
              account_channel: lb
              currency: USD
              fund_channel: ''
              counter_id: ''
              action: BUY
              amount: '1000'
              fee: '0'
              remark: ''
      responses:
        '200':
          description: The request was processed successfully. The response `data` does not contain additional
            business fields.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: "`0` indicates success. A non-zero value is a business error code, in\
                      \ which case\n`data` is usually empty.\n\nHTTP status codes use their standard semantics.\
                      \ A successful request normally\nreturns `200`; errors may return `400`, `401`,\
                      \ `403`, `408`, or another applicable\nstatus. Interpret the HTTP status together\
                      \ with the business `code`.\n\n- `401`: The user is not authenticated.\n- `403`:\
                      \ The current account is not authorized to use this function. Grant access\n  through\
                      \ User Permission."
                    x-enum-details:
                    - value: 0
                      label: Success
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: Bad request. Check the business error code in `code` and the error details in `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: The user is not authenticated, or the login session has expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: The current account is not authorized to use this feature. Grant the required permission
            to the account in User Permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: The request timed out. Check the business error code in `code` and the error details
            in `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
