  /v1/datasets/booking_account_details_merged/download:
    post:
      operationId: booking_account_details_merged_download
      summary: Accounting Entries - Summary Export
      tags:
      - Accounting
      x-permission-key:
      - lb_hk_book.book_detail_query
      x-lbonly: false
      description: 'Exports Accounting Entries - Summary data to a file. `filters` defines the export
        scope, and `down_fields` can restrict the exported columns.


        ### Export modes


        - `mode: 0`: synchronous export; the download URL is returned directly on success.

        - `mode: 1`: asynchronous export; the API first returns `file_download_id`. Call `GET /v1/datasets/download/{id}`
        to obtain the download URL.

        - When the export record is no longer needed, delete it with `DELETE /v1/datasets/download/{id}`.'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: Same fields as the filters of booking_account_details_merged.yaml (the
                    query capability).
                  properties:
                    voucher:
                      type: string
                      description: Filters results by Document No.
                    original_currency:
                      type: string
                      description: 'Filters results by Currency.


                        Values are dynamic. Call `GET /v1/datasets/refs/tenant_currencies` to retrieve
                        the current data dictionary, and use the returned entry''s `key` as this parameter''s
                        value.'
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/tenant_currencies
                    out_subject_code:
                      type: string
                      description: Filters results by External Account Code.
                    account_at:
                      type: object
                      description: Filters results by Accounting Date.
                      properties:
                        gte:
                          type: string
                          format: date
                          description: Inclusive lower bound of the filter range.
                        lte:
                          type: string
                          format: date
                          description: Inclusive upper bound of the filter range.
                mode:
                  type: integer
                  default: 0
                  description: 'Defaults to `0` (synchronous mode) when omitted.


                    **Allowed values:**

                    - `0` - Sync

                    - `1` - Async'
                  enum:
                  - 0
                  - 1
                  x-enum-details:
                  - value: 0
                    label: Sync
                  - value: 1
                    label: Async
                ext:
                  type: string
                  description: 'Download file format. Defaults to `csv` when omitted.


                    **Allowed values:**

                    - `csv` - CSV

                    - `xlsx` - Excel'
                  enum:
                  - csv
                  - xlsx
                file_name:
                  type: string
                  description: Export file name. The server generates a name when omitted.
                down_fields:
                  type: array
                  description: 'When omitted, all fields are exported; allowed values are listed under
                    items.enum (the

                    same field list as the query endpoint''s data.list.items).'
                  items:
                    type: string
                    enum:
                    - id
                    - account_at
                    - voucher
                    - maker
                    - maker_val
                    - subject_code
                    - subject_name
                    - out_subject_code
                    - name
                    - original_currency
                    - convert_currency
                    - rate
                    - original_debit_amount
                    - original_credit_amount
                    - converted_debit_amount
