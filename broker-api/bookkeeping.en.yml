openapi: 3.1.1
info:
  title: Whale OpenAPI (whale-openapi-docs 自动生成)
  version: 1.0.0
servers:
- url: https://b-api.longbridge.xyz
  description: 测试环境
- url: https://b-api.lbkrs.com
  description: 生产环境
security:
- bearerAuth: []
tags:
- name: Accounting
  description: 'Back-office management APIs for the accounting middle office: journal vouchers, general-ledger

    queries, reconciliation, and more.'
paths:
  /book/createAccountDetailsV2:
    post:
      operationId: create_account_details_v2
      summary: Create Account Details
      tags:
      - Accounting
      x-permission-key:
      - lb_hk_book.book_detail_update
      x-lbonly: false
      description: 'Create an accounting entry (also supports creating from a copy_id pre-fill). It changes
        real accounting-entry data.


        ### Request parameters


        - Required: `bookingTypeId` (Booking Type ID), `txNo` (Transaction No.), `name` (Description),
        `accountAt` (Account Date), `ledgerDate` (Ledger Date), `objectCode` (Object Code), `debitFirstSubjectCode`
        (Debit First-level Subject Code), `debitSecondSubjectCode` (Debit Second-level Subject Code),
        `debitSubjectCode` (Debit Third-level Subject Code), `creditFirstSubjectCode` (Credit First-level
        Subject Code), `creditSecondSubjectCode` (Credit Second-level Subject Code), `creditSubjectCode`
        (Credit Third-level Subject Code), `amount` (Amount)

        - Optional: `sourceId` (Book Source), `aaid` (Associated Account ID), `remark` (Remark), `debitName`
        (Debit Subject Full Name), `creditName` (Credit Subject Full Name), `objectType` (Object Type),
        `audit_frontend_resource` (Audit Frontend Resource Snapshot)

        - See each field for its format, allowed values, default behavior, and business meaning.


        ### Result


        On success, the endpoint completes the described business operation. See the `200` response schema
        for returned data.'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - bookingTypeId
              - txNo
              - name
              - accountAt
              - ledgerDate
              - objectCode
              - debitFirstSubjectCode
              - debitSecondSubjectCode
              - debitSubjectCode
              - creditFirstSubjectCode
              - creditSecondSubjectCode
              - creditSubjectCode
              - amount
              properties:
                sourceId:
                  type: number
                  description: 'Journal-entry data source, a dropdown selection; values come from the
                    book_source

                    dynamic enumeration and are not fixed.


                    Call `GET /v1/datasets/refs/book_source` to retrieve the current data dictionary,
                    and use the returned entry''s `key` as this field''s value.'
                  x-value-source:
                    endpoint: GET /v1/datasets/refs/book_source
                bookingTypeId:
                  type: string
                  description: 'Bookkeeping business type, a dropdown selection (cascading with the data
                    source);

                    values come from the book_business_types_by_source dynamic enumeration and are not
                    fixed.


                    Call `GET /v1/datasets/refs/book_business_types_by_source` to retrieve the current
                    data dictionary, and use the returned entry''s `key` as this field''s value.'
                  x-value-source:
                    endpoint: GET /v1/datasets/refs/book_business_types_by_source
                aaid:
                  type: string
                  description: The associated account AAID (not applicable in some scenarios; may be omitted).
                txNo:
                  type: string
                  description: Specifies Transaction No.. This field is required.
                name:
                  type: string
                  description: Specifies Description. This field is required.
                accountAt:
                  type: string
                  description: Bookkeeping time, format YYYY-MM-DD 00:00:00.
                ledgerDate:
                  type: string
                  description: Accounting date, format YYYY-MM-DD HH:mm:ss.
                objectCode:
                  type: string
                  description: 'Target currency, a dropdown selection; values come from the

                    tenant_currencies_by_channel dynamic enumeration and are not fixed.


                    Call `GET /v1/datasets/refs/tenant_currencies_by_channel` to retrieve the current
                    data dictionary, and use the returned entry''s `key` as this field''s value.'
                  x-value-source:
                    endpoint: GET /v1/datasets/refs/tenant_currencies_by_channel
                debitFirstSubjectCode:
                  type: string
                  description: Specifies Debit First-level Subject Code. This field is required.
                debitSecondSubjectCode:
                  type: string
                  description: The debit second-level account, cascading from the first-level account.
                debitSubjectCode:
                  type: string
                  description: The debit detail account, cascading from the second-level account.
                creditFirstSubjectCode:
                  type: string
                  description: Specifies Credit First-level Subject Code. This field is required.
                creditSecondSubjectCode:
                  type: string
                  description: The credit second-level account, cascading from the first-level account.
                creditSubjectCode:
                  type: string
                  description: The credit detail account, cascading from the second-level account.
                amount:
                  type: string
                  description: Amount involved in this business operation. This field is required.
                remark:
                  type: string
                  description: Remark, up to 100 characters.
                debitName:
                  type: string
                  description: The debit account name, populated automatically with the debit detail account.
                creditName:
                  type: string
                  description: The credit account name, populated automatically with the credit detail
                    account.
                objectType:
                  type: string
                  description: Specifies Object Type.
                audit_frontend_resource:
                  type: object
                  description: 'A data snapshot for auditing (the original-record snapshot in a copy scenario,
                    an

                    empty object for a pure create), used for backend audit comparison; not a user-entered

                    field.'
            example:
              sourceId: 1
              bookingTypeId: '2'
              aaid: H00000000
              txNo: TX20260710002
              name: 手工调账-测试分录
              accountAt: '2026-07-10 00:00:00'
              ledgerDate: '2026-07-10 10:00:00'
              objectCode: USD
              debitFirstSubjectCode: '1001'
              debitSecondSubjectCode: '100101'
              debitSubjectCode: '10010101'
              creditFirstSubjectCode: '2001'
              creditSecondSubjectCode: '200101'
              creditSubjectCode: '20010101'
              amount: '100.00'
              remark: 新增备注
              debitName: 库存现金/美元/xxx
              creditName: 应付账款/美元/xxx
              objectType: account
      responses:
        '200':
          description: The request was processed successfully. The response `data` does not contain additional
            business fields.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: "`0` indicates success. A non-zero value is a business error code, in\
                      \ which case\n`data` is usually empty.\n\nHTTP status codes use their standard semantics.\
                      \ A successful request normally\nreturns `200`; errors may return `400`, `401`,\
                      \ `403`, `408`, or another applicable\nstatus. Interpret the HTTP status together\
                      \ with the business `code`.\n\n- `401`: The user is not authenticated.\n- `403`:\
                      \ The current account is not authorized to use this function. Grant access\n  through\
                      \ User Permission."
                    x-enum-details:
                    - value: 0
                      label: Success
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: Bad request. Check the business error code in `code` and the error details in `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: The user is not authenticated, or the login session has expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: The current account is not authorized to use this feature. Grant the required permission
            to the account in User Permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: The request timed out. Check the business error code in `code` and the error details
            in `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
