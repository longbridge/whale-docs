      - accounting.summary_reconciliation_operation
      x-lbonly: false
      description: 'Updates Summary Recon Items.


        ### Request parameters


        - Required: `id` (Record ID), `remark` (Remark), `ref_no` (Ref No.), `begin_amount` (Begin Amount),
        `statement_adjustment` (Statement Adjustment), `in_transit_adjustment` (In Transit Adjustment),
