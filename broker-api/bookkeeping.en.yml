  /book/account_detail/update:
    post:
      operationId: modify_account_detail_v2
      summary: Modify Account Detail
      tags:
      - Accounting
      x-permission-key:
      - lb_hk_book.book_detail_update
      x-lbonly: false
      description: 'Edit an accounting entry (sharing the same form as create, differing only in the additional
        id). It changes real accounting-entry data.


        ### Request parameters


        - Required: `id` (Account Detail ID), `bookingTypeId` (Booking Type ID), `txNo` (Transaction No.),
        `name` (Description), `accountAt` (Account Date), `ledgerDate` (Ledger Date), `objectCode` (Object
        Code), `debitFirstSubjectCode` (Debit First-level Subject Code), `debitSecondSubjectCode` (Debit
        Second-level Subject Code), `debitSubjectCode` (Debit Third-level Subject Code), `creditFirstSubjectCode`
        (Credit First-level Subject Code), `creditSecondSubjectCode` (Credit Second-level Subject Code),
        `creditSubjectCode` (Credit Third-level Subject Code), `amount` (Amount)

        - Optional: `sourceId` (Book Source), `aaid` (Associated Account ID), `remark` (Remark), `debitName`
        (Debit Subject Full Name), `creditName` (Credit Subject Full Name), `objectType` (Object Type),
        `audit_frontend_resource` (Audit Frontend Resource Snapshot)

        - See each field for its format, allowed values, default behavior, and business meaning.


        ### Result


        On success, the endpoint completes the described business operation. See the `200` response schema
        for returned data.'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              - bookingTypeId
              - txNo
              - name
              - accountAt
              - ledgerDate
              - objectCode
              - debitFirstSubjectCode
              - debitSecondSubjectCode
              - debitSubjectCode
              - creditFirstSubjectCode
              - creditSecondSubjectCode
              - creditSubjectCode
              - amount
              properties:
                id:
                  type: string
                  description: The entry id passed in the edit scenario; present only in the edit endpoint.
                sourceId:
                  type: number
                  description: 'A dropdown selection; values come from the book_source dynamic enumeration;

                    disabled and not editable in edit mode; converted to a number before submission.


                    Call `GET /v1/datasets/refs/book_source` to retrieve the current data dictionary,
                    and use the returned entry''s `key` as this field''s value.'
                  x-value-source:
                    endpoint: GET /v1/datasets/refs/book_source
                bookingTypeId:
                  type: string
                  description: 'Dropdown selection; values come from the book_business_types_by_source
                    dynamic enum (loaded

                    in cascade based on the source field). When the source is 0, this item is hidden and

                    not submitted.


                    Call `GET /v1/datasets/refs/book_business_types_by_source` to retrieve the current
                    data dictionary, and use the returned entry''s `key` as this field''s value.'
                  x-value-source:
                    endpoint: GET /v1/datasets/refs/book_business_types_by_source
                aaid:
                  type: string
                  description: A custom component selects the associated account; hidden and not submitted
                    when the source is 0.
                txNo:
                  type: string
                  description: Specifies Transaction No.. This field is required.
                name:
                  type: string
                  description: Specifies Description. This field is required.
                accountAt:
                  type: string
                  description: A date, converted to the 'YYYY-MM-DD 00:00:00' format before submission.
                ledgerDate:
                  type: string
                  description: A date, converted to the 'YYYY-MM-DD HH:mm:ss' format before submission.
                objectCode:
                  type: string
                  description: 'A dropdown selection; values come from the tenant_currencies_by_channel
                    dynamic enumeration.


                    Call `GET /v1/datasets/refs/tenant_currencies_by_channel` to retrieve the current
                    data dictionary, and use the returned entry''s `key` as this field''s value.'
                  x-value-source:
                    endpoint: GET /v1/datasets/refs/tenant_currencies_by_channel
                debitFirstSubjectCode:
                  type: string
                  description: Dropdown selection for the debit first-level account; the values come from
                    the linked account-query interface.
                debitSecondSubjectCode:
                  type: string
                  description: Dropdown selection; debit second-level account, loaded in linkage with
                    the debit first-level account.
                debitSubjectCode:
                  type: string
                  description: 'Dropdown selection for the debit lowest-level account, loaded in cascade
                    based on the

                    debit second-level account; once selected, the full name of the item is taken as the

                    debit account name.'
                creditFirstSubjectCode:
                  type: string
                  description: Dropdown selection for the credit first-level account; the values come
                    from the linked account-query interface.
                creditSecondSubjectCode:
                  type: string
                  description: Dropdown selection; credit second-level account, loaded in linkage with
                    the credit first-level account.
                creditSubjectCode:
                  type: string
                  description: 'Dropdown selection for the credit lowest-level account, loaded in cascade
                    based on the

                    credit second-level account; once selected, the full name of the item is taken as
                    the

                    credit account name.'
                amount:
                  type: string
                  description: Amount involved in this business operation. This field is required.
                remark:
                  type: string
                  description: Free text, up to 100 characters.
                debitName:
                  type: string
                  description: 'Not a request field; when the debit leaf account is selected, its value
                    is taken from the

                    option''s full name and attached on submit.'
                creditName:
                  type: string
                  description: 'Not a request field; when the credit leaf account is selected, its value
                    is taken from

                    the option''s full name and attached on submit.'
                objectType:
                  type: string
                  description: Specifies Object Type.
                audit_frontend_resource:
                  type: object
                  description: A snapshot of the original data fetched before editing, used for backend
                    audit comparison; not a user-editable field.
            example:
              id: '10086'
              sourceId: 1
              bookingTypeId: '2'
              aaid: H00000000
              txNo: TX20260710001
              name: 手工调账-测试分录
              accountAt: '2026-07-10 00:00:00'
              ledgerDate: '2026-07-10 10:00:00'
              objectCode: USD
              debitFirstSubjectCode: '1001'
              debitSecondSubjectCode: '100101'
              debitSubjectCode: '10010101'
              creditFirstSubjectCode: '2001'
              creditSecondSubjectCode: '200101'
              creditSubjectCode: '20010101'
              amount: '100.00'
              remark: 编辑备注
              debitName: 库存现金/美元/xxx
              creditName: 应付账款/美元/xxx
              objectType: account
      responses:
        '200':
          description: The request was processed successfully. The response `data` does not contain additional
            business fields.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: "`0` indicates success. A non-zero value is a business error code, in\
                      \ which case\n`data` is usually empty.\n\nHTTP status codes use their standard semantics.\
                      \ A successful request normally\nreturns `200`; errors may return `400`, `401`,\
                      \ `403`, `408`, or another applicable\nstatus. Interpret the HTTP status together\
                      \ with the business `code`.\n\n- `401`: The user is not authenticated.\n- `403`:\
                      \ The current account is not authorized to use this function. Grant access\n  through\
                      \ User Permission."
                    x-enum-details:
                    - value: 0
                      label: Success
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: Bad request. Check the business error code in `code` and the error details in `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: The user is not authenticated, or the login session has expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: The current account is not authorized to use this feature. Grant the required permission
            to the account in User Permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: The request timed out. Check the business error code in `code` and the error details
            in `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
