openapi: 3.1.1
info:
  title: Longport Whale 券商 API
  description: 面向使用 Longport Whale 的券商提供机构级服务端 API。
  version: 2.0.0
servers:
- url: https://b-api.longbridge.xyz
  description: 测试环境
- url: https://b-api.lbkrs.com
  description: 生产环境
security:
- bearerAuth: []
tags:
- name: 业务参数设置
paths:
  /v1/billing/myrates/markets:
    get:
      operationId: myrates_markets
      summary: 费率市场
      tags:
      - 业务参数设置
      x-permission-key:
      - billing.account_fee_info_manage
      x-lbonly: false
      description: '返回可用的费率展示市场/页签列表。


        这是「客户端展示」相关数据集 `tab` 过滤值的候选来源:数据集

        `booking_account_fee_info_items` / `booking_item_copywritings` 的 `tab` 取自本接口返回的

        `tabs[].tab`。候选值会动态变化，请以本接口实时返回为准。'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: 请求处理成功。`data.tabs` 为可用市场页签列表。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: '0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。


                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`

                      判断具体结果。


                      - `401`：未登录。

                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。'
                    x-enum-details:
                    - value: 0
                      label: 成功
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      tabs:
                        type: array
                        description: 可用市场页签列表。每项的 `tab` 即数据集 `tab` 过滤参数的取值。
                        items:
                          type: object
                          properties:
                            tab:
                              type: string
                              description: 页签/过滤值（市场代码），如 `HK`、`US`、`US_OPTIONS`、`HAS`。
                            name:
                              type: string
                              description: 页签展示名，如 `HK`、`US Options`、`Crypto - HashKey`。
                            biz_type:
                              type: integer
                              description: 业务类型。例如 `1` 证券市场、`5` 美股期权、`9` 加密货币。
                            market:
                              type: string
                              description: 市场代码。
              example:
                code: 0
                message: success
                data:
                  tabs:
                  - tab: HK
                    name: HK
                    biz_type: 1
                    market: HK
                  - tab: US
                    name: US
                    biz_type: 1
                    market: US
                  - tab: US_OPTIONS
                    name: US Options
                    biz_type: 5
                    market: US
                  - tab: HAS
                    name: Crypto - HashKey
                    biz_type: 9
                    market: HAS
        '400':
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登录或登录状态已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 当前账号未获得该功能授权。请在 User Permission 中为该账号开通相应权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 请求处理超时。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
  /v1/billing/account_fee_info_item:
    post:
      operationId: account_fee_info_item_add
      summary: 新增客户端收费展示项
      tags:
      - 业务参数设置
      x-permission-key:
      - billing.account_fee_info_manage
      x-lbonly: false
      description: '新增客户端收费展示项。


        ### 请求参数


        - 必填：`tab`（业务线/市场 Tab）、`name`（名称（多语言））、`conditions`（触发条件列表）

        - 可选：`desc`（描述（多语言））

        - 各字段的格式、取值范围和业务含义见对应字段说明。


        ### 业务说明


        新增一个特殊收费展示项。涉及真实数据变更。


        ### 处理结果


        成功时完成上述业务操作；后续状态和返回数据以 `200` 响应定义为准。'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - tab
              - name
              - conditions
              properties:
                tab:
                  type: string
                  description: 业务线或市场标识。由调用方根据目标市场生成并随请求提交。
                name:
                  type: object
                  description: 多语言名称对象，key 为 zh-CN/zh-HK/en
                desc:
                  type: object
                  description: 多语言描述对象，key 为 zh-CN/zh-HK/en
                conditions:
                  type: array
                  description: |-
                    数组元素为 `{ field, value }` 对象。

                    - `field`：条件项 ID（费率条件字段），标识该条件针对的业务维度，例如 `'3'` 表示账户/柜台等条件。
                    - `value`：该条件项选中的取值数组（字符串）。
                  items:
                    type: string
            example:
              tab: hk_stock
              name:
                zh-CN: 示例名称
                zh-HK: 示例名稱
                en: Sample Name
              desc:
                zh-CN: 示例描述
                zh-HK: 示例描述
                en: Sample description
              conditions:
              - field: '3'
                value:
                - '1001'
      responses:
        '200':
          description: 请求处理成功。响应的 `data` 不包含额外业务字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: '0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。


                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`

                      判断具体结果。


                      - `401`：未登录。

                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。'
                    x-enum-details:
                    - value: 0
                      label: 成功
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登录或登录状态已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 当前账号未获得该功能授权。请在 User Permission 中为该账号开通相应权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 请求处理超时。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
  /billing/org_package_ref:
    delete:
      operationId: org_package_ref_delete
      summary: 删除机构套餐引用
      tags:
      - 业务参数设置
      x-permission-key:
      - lb_hk_charging.lb_hk_billing_org_package_ref_update
      x-lbonly: false
      description: '删除机构套餐引用。


        ### 请求参数


        - 必填：`default_id`（记录ID）

        - 可选：`audit_frontend_resource`（审计上下文）

        - 各字段的格式、取值范围和业务含义见对应字段说明。


        ### 处理结果


        成功时完成上述业务操作；后续状态和返回数据以 `200` 响应定义为准。'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - default_id
              properties:
                default_id:
                  type: string
                  description: 记录ID，用于标识本次请求关联的业务对象。此字段为必填项。
                audit_frontend_resource:
                  type: object
                  description: 调用方提交的审计上下文，用于记录本次操作。
            example:
              default_id: '123'
              audit_frontend_resource: {}
      responses:
        '200':
          description: 请求处理成功。响应的 `data` 不包含额外业务字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: '0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。


                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`

                      判断具体结果。


                      - `401`：未登录。

                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。'
                    x-enum-details:
                    - value: 0
                      label: 成功
                  message:
                    type: string
                  data:
                    type: object
                    description: "成功时 `data` 为空对象。"
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登录或登录状态已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 当前账号未获得该功能授权。请在 User Permission 中为该账号开通相应权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 请求处理超时。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
    get:
      operationId: org_package_ref_detail
      summary: 机构套餐详情
      tags:
      - 业务参数设置
      x-permission-key:
      - lb_hk_charging.lb_hk_billing_org_package_ref_list
      x-lbonly: false
      description: '按机构 `org_id` 查找该机构的套餐引用配置详情。


        ### 请求参数


        - 必填：`org_id`（机构 id），作为 query 参数传递。


        ### 处理结果


        成功时在 `data` 中返回该机构的套餐引用配置。


        > 说明：响应字段依据 `booking_org_package_refs` 数据集实体推导；测试环境暂无已配置机构，响应体未实调验证，实际字段以接口返回为准。'
      security:
      - bearerAuth: []
      parameters:
      - name: org_id
        in: query
        required: true
        schema:
          type: string
        description: 机构 id。
        example: '3'
      responses:
        '200':
          description: 请求处理成功。`data` 为该机构的套餐引用配置。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: '0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。


                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`

                      判断具体结果。


                      - `401`：未登录。

                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。'
                    x-enum-details:
                    - value: 0
                      label: 成功
                  message:
                    type: string
                  data:
                    type: object
                    description: 机构套餐引用配置（字段依据数据集实体推导，未实调验证）。
                    properties:
                      org_id:
                        type: string
                        description: 机构 id。
                      default_package_id:
                        type: string
                        description: 默认套餐 id。
                      cash_package_id:
                        type: string
                        description: 现金业务套餐 id。
                      bo_package_id:
                        type: string
                        description: BO 业务套餐 id。
                      financing_package_id:
                        type: string
                        description: 融资业务套餐 id。
                      personal_allow_item_ids:
                        type: array
                        items:
                          type: string
                        description: 该机构允许配置个性化收费的收费场景 id 列表。
                      names:
                        type: string
                        description: 关联套餐名称展示。
              example:
                code: 0
                message: success
                data:
                  type: object
                  properties:
                    default_package_id:
                      type: string
                    allow_package_ids:
                      type: array
                      items:
                        type: string
        '400':
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登录或登录状态已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 当前账号未获得该功能授权。请在 User Permission 中为该账号开通相应权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 请求处理超时。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
    post:
      operationId: org_package_ref_add
      summary: 新增机构套餐引用
      tags:
      - 业务参数设置
      x-permission-key:
      - lb_hk_charging.lb_hk_billing_org_package_ref_update
      x-lbonly: false
      description: '新增机构套餐引用。


        ### 请求参数


        - 必填：`org_id`（机构ID）、`default_package_id`（默认套餐ID）

        - 可选：`cash_package_id`（资金套餐ID）、`financing_package_id`（融资套餐ID）、`bo_package_id`（BO 套餐ID）、`allow_package_ids`（允许套餐ID列表）、`personal_allow_item_ids`（允许个性化收费项ID列表）

        - 各字段的格式、取值范围和业务含义见对应字段说明。


        ### 处理结果


        成功时完成上述业务操作；后续状态和返回数据以 `200` 响应定义为准。'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - org_id
              - default_package_id
              properties:
                org_id:
                  type: string
                  description: '机构ID，用于标识本次请求关联的业务对象。此字段为必填项。


                    候选值来自 `GET /v1/datasets/refs/member_organizations` 返回的机构列表，使用返回项的 `key` 作为本字段值。'
                  x-value-source:
                    endpoint: GET /v1/datasets/refs/member_organizations
                default_package_id:
                  type: string
                  description: '默认套餐ID，用于标识本次请求关联的业务对象。此字段为必填项。


                    候选值来自 `GET /v1/datasets/refs/billing_packages` 返回的收费套餐(客户组)列表，使用返回项的 `key` 作为本字段值。'
                  x-value-source:
                    endpoint: GET /v1/datasets/refs/billing_packages
                cash_package_id:
                  type: string
                  description: '资金套餐ID，用于标识本次请求关联的业务对象。


                    候选值来自 `GET /v1/datasets/refs/billing_packages` 返回的收费套餐(客户组)列表，使用返回项的 `key` 作为本字段值。'
                  x-value-source:
                    endpoint: GET /v1/datasets/refs/billing_packages
                financing_package_id:
                  type: string
                  description: '融资套餐ID，用于标识本次请求关联的业务对象。


                    候选值来自 `GET /v1/datasets/refs/billing_packages` 返回的收费套餐(客户组)列表，使用返回项的 `key` 作为本字段值。'
                  x-value-source:
                    endpoint: GET /v1/datasets/refs/billing_packages
                bo_package_id:
                  type: string
                  description: 'BO 套餐ID，用于标识本次请求关联的业务对象。


                    候选值来自 `GET /v1/datasets/refs/billing_packages` 返回的收费套餐(客户组)列表，使用返回项的 `key` 作为本字段值。'
                  x-value-source:
                    endpoint: GET /v1/datasets/refs/billing_packages
                allow_package_ids:
                  type: array
                  description: '允许套餐ID列表，以 JSON 数组形式提交。


                    候选值来自 `GET /v1/datasets/refs/billing_packages` 返回的收费套餐(客户组)列表，使用返回项的 `key` 作为本字段值。'
                  items:
                    type: string
                  x-value-source:
                    endpoint: GET /v1/datasets/refs/billing_packages
                personal_allow_item_ids:
                  type: array
                  description: 允许个性化收费项ID列表，以 JSON 数组形式提交。
                  items:
                    type: string
            example:
              org_id: ''
              default_package_id: ''
              cash_package_id: ''
              financing_package_id: ''
              bo_package_id: ''
              allow_package_ids: []
              personal_allow_item_ids: []
      responses:
        '200':
          description: 请求处理成功。响应的 `data` 不包含额外业务字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: '0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。


                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`

                      判断具体结果。


                      - `401`：未登录。

                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。'
                    x-enum-details:
                    - value: 0
                      label: 成功
                  message:
                    type: string
                  data:
                    type: object
                    description: "成功时 `data` 为空对象。"
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登录或登录状态已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 当前账号未获得该功能授权。请在 User Permission 中为该账号开通相应权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 请求处理超时。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
    put:
      operationId: org_package_ref_edit
      summary: 编辑机构套餐引用
      tags:
      - 业务参数设置
      x-permission-key:
      - lb_hk_charging.lb_hk_billing_org_package_ref_update
      x-lbonly: false
      description: '与「新增机构套餐」字段基本一致，区别是编辑时用 default_id 定位记录、不再提交 org_id（机构不可改）。


        ### 请求参数


        - 必填：`default_id`（记录ID）、`default_package_id`（默认套餐ID）

        - 可选：`cash_package_id`（资金套餐ID）、`financing_package_id`（融资套餐ID）、`bo_package_id`（BO 套餐ID）、`allow_package_ids`（允许套餐ID列表）、`personal_allow_item_ids`（允许个性化收费项ID列表）

        - 各字段的格式、取值范围、默认行为和业务含义见对应字段说明。


        ### 处理结果


        成功时完成所述业务操作，具体返回内容见 `200` 响应定义。'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
