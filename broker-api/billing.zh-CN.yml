                  description: |-
                    取整位数，当取整方式为「跟随场景」时禁用

                    **可选值：** `0`、`1`、`2`、`3`
                  enum:
                  - '0'
                  - '1'
                  - '2'
                  - '3'
                  x-enum-details:
                  - value: '0'
                    label: '0'
                  - value: '1'
                    label: '1'
                  - value: '2'
