                  x-value-source:
                    endpoint: GET /v1/datasets/refs/tenant_currencies_by_channel
                min:
                  type: string
                  description: 用于指定「最低收费」。此字段为必填项。
                max:
                  type: string
                  description: 数字字符串，默认 999999999
                max_metric:
                  type: object
                  description: 最大比例限制对象 { max_metric_type, max_metric_rate }，仅在特定计量类型/业务类型组合下显示
                max_metric_type:
                  type: string
                  description: '用于指定「是否启用最大比例限制」。


                    **可选值：**

                    - `0` - 表示不启用

                    - `1` - 表示启用'
                  enum:
                  - '0'
                  - '1'
                  x-enum-details:
                  - value: '0'
                    label: 不启用
                  - value: '1'
                    label: 启用
                max_metric_rate:
                  type: string
                  description: 启用最大比例限制时的费率值，展示时乘以100，提交时除以100还原
                granularity:
                  type: string
                  description: |-
                    计费粒度，仅在成交数量/成交金额等场景显示

