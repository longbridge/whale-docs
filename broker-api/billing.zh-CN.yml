      x-permission-key:
      - lb_hk_charging.lb_hk_billingpackage_update
      x-lbonly: false
      description: '新建收费套餐。


        ### 请求参数


        - 必填：`name`（套餐名称）、`category`（套餐分类）、`org_id`（机构ID）、`fee_rate_type`（费率类型）、`metric_cycle_type`（计费周期类型）、`metric_type`（计费方式）、`granularity`（计费精度）、`cutoff_method`（截取方式）、`cutoff_digits`（截取位数）

        - 可选：`maket_rule_ids`（市场规则ID列表）、`fees`（收费项列表）、`rates`（费率区间列表）、`max_metric_type`（封顶计费方式）、`max_metric_rate`（封顶费率）、`min_metric_type`（保底计费方式）、`min_metric_rate`（保底费率）、`metric_type_bill_amount_item_ids`（二级计费项ID列表）、`special_fees`（个性化收费列表）、`conditions`（触发条件列表）

        - 各字段的格式、取值范围和业务含义见对应字段说明。


        ### 业务说明


        新建一个收费套餐，实际请求是分步向导。


        ### 处理结果


        成功时完成上述业务操作；后续状态和返回数据以 `200` 响应定义为准。'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - category
              - org_id
              - fee_rate_type
              - metric_cycle_type
              - metric_type
              - granularity
              - cutoff_method
              - cutoff_digits
              properties:
                name:
                  type: string
                  description: 用于指定「套餐名称」。此字段为必填项。
                category:
                  type: string
                  description: '对应请求向导第一步的 ORG_PACKAGE_TYPE 等分类枚举


                    **可选值：**

                    - `1` - 表示通用

                    - `2` - 表示 FD 机构'
                  enum:
                  - '1'
                  - '2'
                  x-enum-details:
                  - value: '1'
                    label: 通用
                  - value: '2'
                    label: FD 机构
                org_id:
                  type: number
                  description: 机构ID，用于标识本次请求关联的业务对象。此字段为必填项。
                maket_rule_ids:
                  type: array
                  description: 接口字段原文如此（拼写为 maket_rule_ids，非 market_rule_ids），元素为规则 ID（number）
                  items:
                    type: string
                fees:
                  type: array
                  description: '数组元素 { billing_item_id, currency, max, min, threshold }：billing_item_id

                    关联收费场景ID，currency 为币种代码，max/min/threshold 均为字符串数字'
                  items:
                    type: string
                rates:
                  type: array
                  description: 数组元素 { gt, lte, fee_rate, min }：按区间（大于gt、小于等于lte）配置费率 fee_rate 及最低收费 min
                  items:
                    type: string
                fee_rate_type:
                  type: number
                  description: '取值应与 `billingItemFields` 返回的字段配置保持一致


                    **可选值：**

                    - `1` - 表示固定费率

                    - `2` - 表示单步阶梯费率

                    - `3` - 表示按月阶梯费率

                    - `4` - 表示浮动费率

                    - `5` - 表示浮动费率单笔阶梯'
                  enum:
                  - '1'
                  - '2'
                  - '3'
                  - '4'
                  - '5'
                  x-enum-details:
                  - value: '1'
                    label: 固定费率
                  - value: '2'
                    label: 单步阶梯费率
                  - value: '3'
                    label: 按月阶梯费率
                  - value: '4'
                    label: 浮动费率
                  - value: '5'
                    label: 浮动费率单笔阶梯
                metric_cycle_type:
                  type: number
                  description: 用于指定「计费周期类型」。此字段为必填项。
                max_metric_type:
                  type: number
                  description: 用于指定「封顶计费方式」。
                max_metric_rate:
                  type: string
                  description: 用于指定「封顶费率」。
                min_metric_type:
