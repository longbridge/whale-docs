        - 必填：`custodian_id`（代理商/托管机构ID）、`billing_item_id`（计费项ID）、`threshold`（起收阈值）、`fee_rate_type`（费率类型）、`calculation_method`（计算方式）、`rates`（费率规则明细）、`currency`（币种）、`min`（最低收费）、`max`（最高收费）、`granularity`（计费粒度）、`cutoff_method`（取整方式）、`cutoff_digits`（取整位数）

        - 可选：`billing_item`（计费项快照）、`metric_type`（计费指标类型）、`fixed_rates`（固定费率明细）、`max_metric`（不超过交易金额比例配置）、`max_metric_type`（是否启用最大比例限制）、`max_metric_rate`（最大比例费率）、`min_metric`（细价股计费配置）、`min_metric_type`（是否启用细价股计费）、`min_metric_rate`（细价股费率）、`metric_cycle_type`（计费周期类型）、`special_fees`（特殊费率条件列表）、`audit_frontend_resource`（调用方提交的审计快照）

        - 各字段的格式、取值范围和业务含义见对应字段说明。


