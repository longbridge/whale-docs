                currency:
                  type: string
                  description: '币种，取值来自 global_currency_filter_by_account_channel 动态枚举，如 USD/HKD/CNH 等


                    请调用 `GET /v1/datasets/refs/tenant_currencies_by_channel` 获取当前可用的数据字典，并使用返回项的 `key`
