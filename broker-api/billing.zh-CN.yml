                        - value: 2
                          label: 交易金额/其它金额
                        - value: 3
                          label: 对应粒度单次计费
                        - value: 4
                          label: 期权张数
                        - value: 5
                          label: 非预期上游回报费用
                        - value: 6
                          label: 计费合约数量
                        - value: 7
                          label: 订单笔数
                        - value: 8
                          label: 成交笔数
                        - value: 9
                          label: 持仓市值
                        - value: 10
                          label: 基于已有场景二级收费
                        - value: 11
                          label: 融券市值
                        - value: 13
                          label: 交易手数（转仓）
                        - value: 14
                          label: 市值（转仓）
                        - value: 15
                          label: ems order 笔数
                      direction:
                        type: integer
                        description: 计费方向，取值来自 `billing_item_direction` 数据字典；实际可选范围以 `GET /billing/item_fields`
                          按 `biz_type` 返回的字段规则为准。
                        x-enum-details:
                        - value: 1
