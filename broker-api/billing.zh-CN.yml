                    **可选值：**
                    - `1` - 表示四舍五入
                    - `2` - 表示向上截取
                    - `3` - 表示向下截取
                  enum:
                  - '1'
                  - '2'
                  - '3'
                  x-enum-details:
                  - value: '1'
                    label: 四舍五入
                  - value: '2'
                    label: 向上截取
                  - value: '3'
                    label: 向下截取
                cutoff_digits:
