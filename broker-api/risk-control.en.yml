    post:
      operationId: exchange_v2
      summary: Exchange V2
      tags:
        - Risk Control Compliance
      x-permission-key:
        - margin_call.risk_debt_info
      x-lbonly: false
      description: |-
        Exchanges V2.

        ### Request parameters

        - Required: `aaid` (Account ID), `exchange_books` (Exchange Books), `exchange_books.from_currency` (From Currency), `exchange_books.to_currency` (To Currency)
        - Optional: `exchange_books.from_amount` (From Amount), `exchange_books.to_amount` (To Amount)
        - See each field for its format, allowed values, and business meaning.

        ### Result

        On success, the endpoint completes the operation. See the `200` response schema for returned data and subsequent state information.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - aaid
                - exchange_books
                - exchange_books.from_currency
                - exchange_books.to_currency
              properties:
                aaid:
                  type: number
                  description: Account ID. Programmatically derived by the client from the selected record's record.aaid_val; not a form-editable field.
                exchange_books:
                  type: array
                  description: |-
                    Exchange Books. Array of dynamic FX rows; multiple exchange records can be added. See the sub-fields
                    of exchange_books (from_currency, etc.) for each row's structure.
                  items:
                    type: string
                exchange_books.from_currency:
                  type: string
                  description: From Currency. Currency dropdown populated from currencies held in the client's cash ledger.
                exchange_books.to_currency:
                  type: string
                  description: To Currency. A dropdown; options come from global_currency_which_support_exchange.
                exchange_books.from_amount:
                  type: string
                  description: |-
                    From Amount. Submit either from_amount or to_amount: the field the user edited last is kept, while
                    the other is computed from the exchange rate and dropped by the client.
                exchange_books.to_amount:
                  type: string
                  description: To Amount. Same as from_amount; the two are mutually exclusive and only one is submitted.
            example:
              aaid: H00000000
              exchange_books:
                - from_currency: USD
                  to_currency: HKD
                  from_amount: '100.00'
