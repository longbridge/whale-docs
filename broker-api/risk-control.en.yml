  /v1/risk_monitoring/update_exchange_rule_v2:
    post:
      operationId: update_exchange_rule_v2
      summary: Update Exchange Rule
      tags:
        - Risk Control Compliance
      x-lbonly: false
      description: |-
        Update Exchange Rule.

        ### Request parameters

        - Required: `main` (Main Currency Rule), `other` (Other Currency Rules), `is_display` (Is Display)
        - Optional: `front_payload` (Front Payload), `audit_frontend_resource` (Audit Context)
        - See each field for its format, allowed values, and business meaning.

        ### Result

        On success, the endpoint completes the operation. See the `200` response schema for returned data and subsequent state information.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - main
                - other
                - is_display
              properties:
                main:
                  type: object
                  description: |-
                    Main Currency Rule. Contains three fields, all numeric strings: debt (debt-amount threshold),
                    avail_with_draw (withdrawable-amount threshold), and currency (the account's base
                    currency, read-only).
                other:
                  type: array
                  description: |-
                    Other Currency Rules. An array; each item is {currency: currency code (values from the
                    global_currency_which_support_exchange dynamic enumeration, not fixed), debt:
                    debt-amount threshold, avail_with_draw: withdrawable-amount threshold}; multiple can
                    be added/removed.

                    Call `GET /v1/datasets/refs/tenant_exchange_currencies` to retrieve the current data dictionary, and use the returned entry's `key` as this field's value.
                  x-value-source:
                    endpoint: GET /v1/datasets/refs/tenant_exchange_currencies
                  items:
                    type: string
                is_display:
                  type: boolean
                  description: |-
                    Is Display. - Single-select
                    - on submit the strings 'true'/'false' are converted to booleans
                    - when false, the other amount fields are disabled
                  enum:
                    - 'true'
                    - 'false'
                front_payload:
                  type: object
                  description: |-
                    Front Payload. A non-core business field; type is fixed to data_diff, recording the before/after
                    values of is_display/debt/avail_with_draw/other for approval-ticket display.
                audit_frontend_resource:
                  type: object
                  description: Audit Context. A non-core business field carrying the is_display value at submission time.
            example:
              main:
                debt: '1000'
                avail_with_draw: '500'
                currency: HKD
              other:
                - currency: USD
                  debt: '200'
                  avail_with_draw: '100'
              is_display: true
              front_payload:
                type: data_diff
                data:
                  - label: 是否展示
                    key: is_display
                    before_value: 关闭
                    after_value: 开启
              audit_frontend_resource:
                is_display: true
      responses:
        '200':
          description: The request was processed successfully. The response `data` does not contain additional business fields.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      `0` indicates success. A non-zero value is a business error code, in which case
                      `data` is usually empty.

                      HTTP status codes use their standard semantics. A successful request normally
                      returns `200`; errors may return `400`, `401`, `403`, `408`, or another applicable
                      status. Interpret the HTTP status together with the business `code`.

                      - `401`: The user is not authenticated.
                      - `403`: The current account is not authorized to use this function. Grant access
                        through User Permission.
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: Bad request. Check the business error code in `code` and the error details in `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
