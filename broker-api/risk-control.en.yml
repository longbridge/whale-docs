  /risk/v1/account_credits/manually_create:
    post:
      operationId: manually_create_account_credit
      summary: Manually Add Account Credit
      tags:
        - Risk Control Compliance
      x-permission-key:
        - credit_limit.credit_clients_add
      x-lbonly: false
      description: 人工为指定证券账号新增一条授信客户记录，设置其授信额度。写操作，直接产生真实授信额度变更。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - aaid
                - credit_limit
              properties:
                aaid:
                  type: string
                  description: A/C No.
                credit_limit:
                  type: number
                  description: Credit Limit
                remark:
                  type: string
                  description: Remark
            example:
              aaid: H00000000
              credit_limit: 100000
              remark: ''
      responses:
        '200':
          description: 未实调，响应字段以真实接口为准。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: 0 means success; a non-zero value is a business error code (data is usually empty in that case). The HTTP status is always 200 — do not rely on the HTTP status to judge success or failure.
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
