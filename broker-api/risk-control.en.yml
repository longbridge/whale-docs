  /risk/v1/fps_config_records:
    post:
      operationId: fps_config_records
      summary: Save FPS Configs
      tags:
        - Risk Control Compliance
      x-permission-key:
        - lb_hk_credit_limit.client_fps_manage
      x-lbonly: false
      description: |-
        Save FPS Configs.

        ### Request parameters

        - Required: `fps_config_records` (FPS Config Records)
        - Optional: `audit_frontend_resource` (Audit Context)
        - See each field for its format, allowed values, and business meaning.

        ### Result

        On success, the endpoint completes the operation. See the `200` response schema for returned data and subsequent state information.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fps_config_records
              properties:
                fps_config_records:
                  type: array
                  description: |-
                    FPS Config Records. Array of FPS rule configurations. Each item contains:

                    - `config_field` - Configuration dimension, such as client type or risk level. Use a dimension returned by the FPS configuration query.
                    - `option_value` - Value for that dimension; it must belong to the value set available for the selected `config_field`.
                    - `fps_change` - FPS score adjustment submitted as a numeric string; positive, negative, and decimal values are supported.
                  items:
                    type: string
                audit_frontend_resource:
                  type: object
                  description: |-
                    Audit Context. Contains value (an array converting config_field/option_value into Chinese display
                    labels), $behavior (fixed text "Edit client FPS rule configuration"), and $action
                    (always edit), used for backend audit logging.
            example:
              fps_config_records:
                - config_field: client_type
                  option_value: person
                  fps_change: '0.1'
                - config_field: risk_level
                  option_value: high
                  fps_change: '-0.2'
              audit_frontend_resource:
                value:
                  - config_field: 客户类型
                    option_value: 个人
                    fps_change: '0.1'
                  - config_field: 风险等级
                    option_value: 高
                    fps_change: '-0.2'
                $behavior: 编辑客户 FPS 规则配置
                $action: edit
      responses:
        '200':
          description: The request was processed successfully. The response `data` does not contain additional business fields.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      `0` indicates success. A non-zero value is a business error code, in which case
                      `data` is usually empty.

                      HTTP status codes use their standard semantics. A successful request normally
                      returns `200`; errors may return `400`, `401`, `403`, `408`, or another applicable
                      status. Interpret the HTTP status together with the business `code`.

                      - `401`: The user is not authenticated.
                      - `403`: The current account is not authorized to use this function. Grant access
                        through User Permission.
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: Bad request. Check the business error code in `code` and the error details in `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: The user is not authenticated, or the login session has expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: The current account is not authorized to use this feature. Grant the required permission to the account in User Permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: The request timed out. Check the business error code in `code` and the error details in `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
      x-mint:
        href: /en/api-reference/fps_config_records
        metadata:
