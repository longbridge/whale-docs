        content:
          application/json:
            schema:
              type: object
              properties:
                audit_frontend_resource:
                  type: object
                  description: |-
                    Audit Context. A caller-provided audit-tracking object: $behavior is the operation description, and ids is
                    the list of pending-task IDs involved in this batch trigger (taken from the
                    waitting_stock_margin_ratio_task_count query result).
                audit_frontend_resource.$behavior:
                  type: string
