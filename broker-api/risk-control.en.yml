  /risk/v1/trade_credit/modify:
    post:
      operationId: trade_credit_modify
      summary: Modify Trade Credit
      tags:
        - Risk Control Compliance
      x-lbonly: false
      description: |-
        Creates or updates a client's trading-limit configuration. This changes live trading limits.

        ### Request parameters

        - Required: `aaid` (Account AAID), `trade_credit_type` (Trade Credit Type), `trade_credit_map` (Trade Credit Map), `expired_at` (Expired At), `action` (Action)
        - Optional: `remark` (Remark), `audit_frontend_resource` (Audit Context)
        - See each field for its format, allowed values, default behavior, and business meaning.

        ### Risk notice

        > This operation may affect live business data or asset state. Verify the target records, amounts, quantities, and operation type before calling it.

        ### Result

        On success, the endpoint completes the described business operation. See the `200` response schema for returned data.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - aaid
                - trade_credit_type
                - trade_credit_map
                - expired_at
                - action
              properties:
                aaid:
                  type: string
                  description: |-
                    Account AAID. The customer fund account selected via the request field member_query_aaid component;
                    disabled and unchangeable when editing.
                trade_credit_type:
                  type: string
                  description: |-
                    Trade Credit Type. A radio group whose value comes from options.trade_credit_type_ref; commonly 0 =
                    single-currency trading limit, 1 = multi-currency trading limit.

                    **Allowed values:**
                    - `0` - Single-Currency Trading Limit
                    - `1` - Multi-Currency Trading Limit
                  enum:
                    - '0'
                    - '1'
                trade_credit_map:
                  type: object
                  description: |-
                    Trade Credit Map. Currency-to-limit key-value pairs, e.g. {"HKD":"100000"}; when trade_credit_type=0 it
                    contains only a single currency, and when =1 it may contain multiple currencies.
                expired_at:
                  type: number
                  description: |-
                    Expired At. A Unix timestamp (seconds); after a date is chosen in the date picker, the
                    hour/minute/second are taken from the current time at submission.
                remark:
                  type: string
                  description: Remark. A textarea, up to 100 characters.
                action:
                  type: number
                  description: |-
                    Action. 0=Create (add), 1=Edit (edit); computed automatically by the client based on whether an item record is passed in.

                    **Allowed values:**
                    - `0` - add
                    - `1` - edit
                  enum:
                    - '0'
                    - '1'
                audit_frontend_resource:
                  type: object
                  description: |-
                    Audit Context. A non-core business field carrying before and value (after) data plus
                    $action/$behavior, used for display in risk-control approval tickets.
            example:
              aaid: H00000000
