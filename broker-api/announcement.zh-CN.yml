paths:
  /sass/announcement/add:
    post:
      operationId: announcement_add
      summary: 新建公告
      tags:
      - 公告管理
      x-permission-key:
      - lb_hk_app.announcements
      x-lbonly: false
      description: '新建租户公告。


        ### 请求参数


        - 必填：`review_url`（审核回调 URL）

        - 各字段的格式、取值范围和业务含义见对应字段说明。


        ### 处理结果


        成功时完成上述业务操作；后续状态和返回数据以 `200` 响应定义为准。'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - review_url
              properties:
                review_url:
                  type: string
                  description: 调用方传入的回调地址，用于审核完成后跳转或返回审核结果。
      responses:
        '200':
          description: 请求处理成功。响应的 `data` 不包含额外业务字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: '0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。


                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`

                      判断具体结果。


                      - `401`：未登录。

                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。'
                    x-enum-details:
                    - value: 0
                      label: 成功
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登录或登录状态已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 当前账号未获得该功能授权。请在 User Permission 中为该账号开通相应权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 请求处理超时。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
