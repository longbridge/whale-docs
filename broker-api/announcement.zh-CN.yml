  /v1/announcement:
    get:
      operationId: get_announcement
      summary: 公告详情
      tags:
      - 公告管理
      x-permission-key:
      - lb_hk_app.announcements
      - stock.market_holiday
      x-lbonly: false
      description: '按公告 ID 查询单条公告的完整配置，用于回填编辑表单或展示公告详情。


        ### 请求参数


        - 必填：`id`（公告 ID），作为查询字符串参数 `?id=` 传入。


        ### 返回结果


        成功时返回该公告的完整配置对象，包含标题、内容、展示渠道、生效时间、用户范围和状态等字段。多语言字段（如 `title`、`description`）以 JSON 字符串形式返回，调用方需自行解析。'
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: query
        required: true
        description: 要查询的公告的唯一标识。
        schema:
          type: integer
        example: 76390
      responses:
        '200':
          description: 成功时返回该公告的完整配置对象。
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - data
                properties:
                  code:
                    type: integer
                    description: '0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。


                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`

                      判断具体结果。


                      - `401`：未登录。

                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。'
                    x-enum-details:
                    - value: 0
                      label: 成功
                  message:
                    type: string
                  data:
                    type: object
                    description: '**返回值：** 公告的完整配置对象。'
                    properties:
                      announcement_type:
                        type: string
                        description: '**返回值：** 公告类型。'
                      title:
                        type: string
                        description: '**返回值：** 多语言标题，以 JSON 字符串返回，键为语言代码（如 `zh-CN`、`zh-HK`、`en`）。'
                      description:
                        type: string
                        description: '**返回值：** 多语言公告内容，以 JSON 字符串返回。'
                      rich_desc:
                        type: string
                        description: '**返回值：** 多语言富文本内容，以 JSON 字符串返回。'
                      channel:
                        type: object
                        description: '**返回值：** 展示渠道配置。以各平台键（如 `ios`、`android`、`pc`）到布尔值的映射表示是否在该渠道展示；带版本控制的渠道另有
                          `<平台>_low` 和 `<平台>_up` 字段表示生效的版本区间。'
                      closable:
                        type: boolean
                        description: '**返回值：** 用户端是否允许手动关闭该公告。'
                      conditions:
                        type: string
                        description: '**返回值：** 公告展示条件，以 JSON 字符串返回。'
                      user_scope:
                        type: object
                        description: '**返回值：** 目标用户范围配置，包含账户渠道（`account_channel`）、用户分群（`user_cluster`、`cluster_id`）、组织（`org_ids`）等字段。'
                      link:
                        type: string
                        description: '**返回值：** 公告点击后的跳转链接。'
                      button:
                        type: string
                        description: '**返回值：** 多语言按钮文案，以 JSON 字符串返回。'
                      priority:
                        type: integer
                        description: '**返回值：** 公告优先级，数值越大优先级越高。'
                      reason:
                        type: string
                        description: '**返回值：** 公告发布或变更的原因说明。'
                      show_begin:
                        type: string
                        description: '**返回值：** 公告开始展示的时间，Unix 时间戳（秒）。'
                      show_end:
                        type: string
                        description: '**返回值：** 公告结束展示的时间，Unix 时间戳（秒）。'
                      status:
                        type: integer
                        description: '**返回值：** 公告状态。'
              example:
                code: 0
                message: success
                data:
                  announcement_type: notice
                  title: '{"zh-CN":"标题","en":"Title"}'
                  description: '{"zh-CN":"内容","en":"Content"}'
                  rich_desc: '{}'
                  channel:
                    ios: true
                    android: true
                    ios_low: 1.0.0
                    ios_up: ''
                  closable: true
                  conditions: '{}'
                  user_scope:
                    account_channel: lb
                    org_ids:
                    - '1'
                  link: https://example.com
                  button: '{"zh-CN":"查看详情"}'
                  priority: 0
                  reason: ''
                  show_begin: '1779544289'
                  show_end: '1779630695'
                  status: 2
        '400':
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登录或登录状态已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 当前账号未获得该功能授权。请在 User Permission 中为该账号开通相应权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 请求处理超时。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
  /v1/portfolio/atm/notice:
    post:
      operationId: notice_create
      summary: 新建出入金公告
      tags:
      - 公告管理
      x-permission-key:
      - lb_hk_cash_in_out_notice.lb_hk_cash_in_out_notice_update
      x-lbonly: false
      description: '新建一条出入金公告，配置公告类型、展示渠道、生效时间、目标范围及多语言标题与内容。


        ### 请求参数


        - 必填：`notice_type`（公告类型）、`title`（标题）、`description`（内容）。

        - `title`、`description`、`confirm_button_label` 为多语言字段，需以 JSON 字符串传入（键为语言代码）。

        - `account_channel`、`region_ids`、`region_bank_ids` 为多值字段，多个值以英文逗号拼接为字符串传入。

        - `show_begin`、`show_end` 为 Unix 时间戳（秒）。

        - 各字段的格式、取值范围和业务含义见对应字段说明。


        ### 处理结果


        成功时创建公告；后续状态和返回数据以 `200` 响应定义为准。'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - notice_type
              - title
              - description
              properties:
                notice_type:
                  type: string
                  description: '公告类型。此字段为必填项。


                    **可选值：**

                    - `1` - 入金

                    - `2` - 出金'
                  enum:
                  - '1'
                  - '2'
                  x-enum-details:
                  - value: '1'
                    label: 入金
                  - value: '2'
                    label: 出金
                  example: '1'
                title:
                  type: string
                  description: 多语言标题，以 JSON 字符串传入，键为语言代码（如 `zh-CN`、`zh-HK`、`en`）。此字段为必填项。
                  example: '{"zh-CN":"标题","en":"Title"}'
                description:
                  type: string
                  description: 多语言公告内容，以 JSON 字符串传入。此字段为必填项。
                  example: '{"zh-CN":"内容","en":"Content"}'
                client_channel:
                  type: object
                  description: 展示渠道配置。以各渠道键到布尔值的映射表示是否在该渠道展示；带版本控制的渠道另有 `<渠道>_low` 和 `<渠道>_up` 字段表示生效的版本区间。
                account_channel:
                  type: string
                  description: 生效的柜台（账户渠道）。多个值以英文逗号拼接为字符串传入。
                  example: lb
                org_ids:
                  type: array
                  description: 目标组织 ID 列表。不传或为空时默认应用于全部可选组织。
                  items:
                    type: string
                  example:
                  - '1'
                app_ids:
                  type: array
                  description: 触达的 App 列表。
                  items:
                    type: string
                  example:
                  - longbridge
                region_ids:
                  type: string
                  description: 银行账户地区。多个值以英文逗号拼接为字符串传入。
                  example: hk,sg
                region_bank_ids:
                  type: string
                  description: 银行名称（银行 ID）。多个值以英文逗号拼接为字符串传入。
                bank_operation_types_id:
                  type: string
                  description: 入金方式。
                remark:
                  type: string
                  description: 备注信息。
                show_begin:
                  type: integer
                  description: 公告开始展示的时间，Unix 时间戳（秒）。
                  example: 1779544289
                show_end:
                  type: integer
                  description: 公告结束展示的时间，Unix 时间戳（秒）。
                  example: 1779630695
                link:
                  type: string
                  description: 公告点击后的跳转链接。
                client_display_way:
                  type: string
                  description: 公告在客户端的展示方式。
                confirm_button_label:
                  type: string
                  description: 多语言确认按钮文案，以 JSON 字符串传入。可选。
                  example: '{"zh-CN":"查看详情"}'
                priority:
                  type: integer
                  description: 公告优先级，数值越大优先级越高。
                  example: 0
            example:
              notice_type: '1'
              title: '{"zh-CN":"标题","en":"Title"}'
              description: '{"zh-CN":"内容","en":"Content"}'
              client_channel:
                all: true
              account_channel: lb
              org_ids:
              - '1'
              app_ids:
              - longbridge
              region_ids: hk,sg
              region_bank_ids: ''
              bank_operation_types_id: '0'
              remark: ''
              show_begin: 1779544289
              show_end: 1779630695
              link: https://example.com
              client_display_way: '1'
              confirm_button_label: '{"zh-CN":"查看详情"}'
              priority: 0
      responses:
        '200':
          description: 请求处理成功。响应的 `data` 不包含额外业务字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: '0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。


                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`

                      判断具体结果。


                      - `401`：未登录。

                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。'
                    x-enum-details:
                    - value: 0
                      label: 成功
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登录或登录状态已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 当前账号未获得该功能授权。请在 User Permission 中为该账号开通相应权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 请求处理超时。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
    put:
      operationId: notice_update
      summary: 编辑出入金公告
      tags:
      - 公告管理
      x-permission-key:
      - lb_hk_cash_in_out_notice.lb_hk_cash_in_out_notice_update
