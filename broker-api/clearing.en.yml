                            name:
                              type: string
                              description: |-
                                **Returned value:** Fee Type.
                            bill_currency:
                              type: string
                              description: |-
                                **Returned value:** Currency (Fee).
                            fee_rate_currency:
                              type: string
                              description: |-
                                **Returned value:** Currency (Rate).
                            metric_type:
                              type: string
                              description: |-
                                **Returned value:** Metric Type.
                            metric_type_val:
                              type: string
                              description: |-
                                Raw value of `metric_type`. The `metric_type` field contains the display value resolved through a dictionary or related record; this field contains the underlying code or ID.
                            metric:
                              type: string
                              description: |-
                                **Returned value:** Metric Amt.
                            calculate_out_amount:
                              type: string
                              description: |-
                                **Returned value:** Fee After Discount.
                            amount:
                              type: string
                              description: |-
                                **Returned value:** Amount.
                            deduction_amount:
                              type: string
                              description: |-
                                **Returned value:** Fee Discount.
                            money_flow_direction:
                              type: string
                              description: |-
                                **Returned value:** Direction.
                            money_flow_direction_val:
                              type: string
                              description: |-
                                Raw value of `money_flow_direction`. The `money_flow_direction` field contains the display value resolved through a dictionary or related record; this field contains the underlying code or ID.
                            remark:
                              type: string
                              description: |-
                                **Returned value:** Remarks.
                            charged_at:
                              type: string
                              description: |-
                                **Returned value:** Deducted At. The date or time format follows the value returned by the API.
                            updated_at:
                              type: string
                              description: |-
                                **Returned value:** Updated At. The date or time format follows the value returned by the API.
                            step_before_metric:
                              type: string
                              description: |-
                                **Returned value:** Gradient Initial Value.
                      total:
                        type: integer
                        description: |-
                          **Returned value:** Total number of matching records, used for pagination.
              example:
