      responses:
        '200':
          description: On success, returns paginated File Import records together with pagination metadata such as the page number, page size, and total record count.
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                    description: |-
                      `0` indicates success. A non-zero value is a business error code, in which case
                      `data` is usually empty.

                      HTTP status codes use their standard semantics. A successful request normally
                      returns `200`; errors may return `400`, `401`, `403`, `408`, or another applicable
                      status. Interpret the HTTP status together with the business `code`.

                      - `401`: The user is not authenticated.
                      - `403`: The current account is not authorized to use this function. Grant access
                        through User Permission.
                    x-enum-details:
                      - value: 0
                        label: Success
                  message:
                    type: string
                  data:
                    type: object
                    required:
                      - list
                      - total
                    properties:
                      list:
                        type: array
                        description: '**Returned value:** List of list.'
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: '**Returned value:** Unique identifier of the current record.'
                            file_type:
                              type: string
                              description: '**Returned value:** File Type.'
                            file_type_val:
                              type: string
                              description: Raw value of `file_type`. The `file_type` field contains the display value resolved through a dictionary or related record; this field contains the underlying code or ID.
                            file_name:
                              type: string
                              description: '**Returned value:** File Name.'
                            market:
                              type: string
                              description: '**Returned value:** Market.'
                            biz_date:
                              type: string
                              description: '**Returned value:** Biz Date. The date or time format follows the value returned by the API.'
                            op_user_id:
                              type: string
                              description: '**Returned value:** Op User ID.'
                            state:
                              type: string
                              description: '**Returned value:** State.'
                            state_val:
                              type: string
                              description: Raw value of `state`. The `state` field contains the display value resolved through a dictionary or related record; this field contains the underlying code or ID.
                            created_at:
                              type: string
                              description: '**Returned value:** Creat Time. The date or time format follows the value returned by the API.'
                            updated_at:
                              type: string
                              description: '**Returned value:** Updated At. The date or time format follows the value returned by the API.'
                      total:
                        type: integer
                        description: '**Returned value:** Total number of matching records, used for pagination.'
              example:
                code: 0
                message: success
                data:
                  list:
                    - id: '162232'
                      file_type: IB (settlement_iblite_hk)
                      file_type_val: '96'
                      file_name: IB LITE 20260702 (1).csv
                      market: US
                      biz_date: 2026-07-02
                      op_user_id: user@example.com
                      state: Resolved
                      state_val: '3'
                      created_at: '1784180196'
                      updated_at: '1784180196'
                  total: 19323
        '400':
          description: Bad request. Check the business error code in `code` and the error details in `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: The user is not authenticated, or the login session has expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: The current account is not authorized to use this feature. Grant the required permission to the account in User Permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: The request timed out. Check the business error code in `code` and the error details in `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
