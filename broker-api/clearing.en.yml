openapi: 3.1.1
info:
  title: Longport Whale Broker API
  description: Institution-grade server-to-server API for brokers running on Longport Whale.
  version: 2.0.0
servers:
  - url: https://b-api.longbridge.xyz
    description: Test
  - url: https://b-api.lbkrs.com
    description: Production
security:
  - bearerAuth: []
tags:
  - name: Account Assets
  - name: Cash Management
  - name: Stock Management
  - name: IPO System
  - name: Fund Management
  - name: VA Clearing Management
  - name: Day-End Settlement
  - name: Corporate Action
  - name: Risk Control Compliance
  - name: Reports
  - name: Broker Management
  - name: Accounting
  - name: Trading Panel
  - name: Announcement
  - name: Service Parameter
  - name: Suspicious Incident Monitoring
  - name: Campaigns
  - name: Reward Center
  - name: Misc
paths:
  /v1/datasets/booking_revise_select_contracts:
    post:
      operationId: booking_revise_select_contracts
      summary: Contract Amendment - Select Original Contract
      x-verified: verified
      tags:
        - Day-End Settlement
      x-permission-key:
        - lb_hk_clearing.contract_revise
      x-lbonly: false
      description: |-
        Query old contracts available for contract revision records. Combine business filters through `filters`, and use `page` and `page_size` to control pagination.

        ### Returns

        On success, returns the matching records with pagination info. See each field's description for filter usage, allowed values, and dynamic data sources.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: Combines business filters. Omit a filter field to disable that filter.
                  properties:
                    'no':
                      type: string
                      description: Filters results by Contract No.
                      example: OS2026071610152
                    datasource:
                      type: string
                      description: Filters results by Data Source.
                      enum:
                        - '1'
                        - '2'
                        - '3'
                        - '4'
                        - '5'
                        - '6'
                        - '7'
                        - '8'
                      x-enum-details:
                        - value: '1'
                          label: Trade
                        - value: '2'
                          label: Stock card
                        - value: '3'
                          label: Stock card (House)
                        - value: '4'
                          label: Backend
                        - value: '5'
                          label: Contract Amendments (Reverse)
                        - value: '6'
                          label: Contract Amendments (New)
                        - value: '7'
                          label: WTT Non-Day Trade
                        - value: '8'
                          label: Upstreaming File
                      example: Trade
                    aaid:
                      type: string
                      description: Filters results by Client.
                    trade_ledger_date:
                      type: object
                      description: Filters results by Ledger Date.
                      properties:
                        gte:
                          type: string
                          format: date
                          description: Inclusive lower bound of the filter range.
                        lte:
                          type: string
                          format: date
                          description: Inclusive upper bound of the filter range.
                    contract.trade_date:
                      type: object
                      description: Filters results by Trade Date.
                      properties:
                        gte:
                          type: string
                          format: date
                          description: Inclusive lower bound of the filter range.
                        lte:
                          type: string
                          format: date
                          description: Inclusive upper bound of the filter range.
                    expected_balance_settlement_date:
                      type: object
                      description: Filters results by Cash Settlement Date.
                      properties:
                        gte:
                          type: string
                          format: date
                          description: Inclusive lower bound of the filter range.
                        lte:
                          type: string
                          format: date
                          description: Inclusive upper bound of the filter range.
                    market:
                      type: string
                      description: |-
                        Filters results by Market.

                        Values are dynamic. Call `GET /v1/datasets/refs/clearing_config_markets` to retrieve the current data dictionary, and use the returned entry's `key` as this parameter's value.
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/clearing_config_markets
                      example: SH
                    counter_id:
                      type: string
                      description: Filters results by Counter ID.
                      example: ST/SH/600519
                    state:
                      type: string
                      description: Filters results by Status.
                      enum:
                        - '2'
                        - '3'
                        - '4'
                        - '5'
                        - '6'
                        - '1'
                        - '-1'
                      x-enum-details:
                        - value: '2'
                          label: To Be Calculated
                        - value: '3'
                          label: To Be Charged
                        - value: '4'
                          label: To Be Settled
                        - value: '5'
                          label: Settlement Completed
                        - value: '6'
                          label: Equity settled
                        - value: '1'
                          label: Init
                        - value: '-1'
                          label: --
                      example: Equity settled
                    settlement_channel:
                      type: string
                      description: |-
                        Filters results by Settlement Channel.

                        Values are dynamic. Call `GET /v1/datasets/refs/billing_settlement_channel` to retrieve the current data dictionary, and use the returned entry's `key` as this parameter's value.
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/billing_settlement_channel
                      example: settlement_ex_hk & CCASS
                    direction:
                      type: string
                      description: Filters results by Trade Direction.
                      enum:
                        - '1'
                        - '2'
                      x-enum-details:
                        - value: '1'
                          label: Buy
                        - value: '2'
                          label: Sell
                      example: Buy
                    task_no:
                      type: string
                      description: Filters results by Settlement Batch No.
                    currency:
                      type: string
                      description: |-
                        Filters results by Currency.

                        Values are dynamic. Call `GET /v1/datasets/refs/tenant_currencies` to retrieve the current data dictionary, and use the returned entry's `key` as this parameter's value.
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/tenant_currencies
                      example: CNH
                    contract.biz_type:
                      type: string
                      description: |-
                        Filters results by Biz Type.

                        Values are dynamic. Call `GET /v1/datasets/refs/billing_business_type` to retrieve the current data dictionary, and use the returned entry's `key` as this parameter's value.
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/billing_business_type
                    trade_ledger_date_ne:
                      type: string
                      description: Filters results by Trade Ledger Date Ne.
                page:
                  type: integer
                  description: Page number to retrieve, starting from `1`.
                page_size:
                  type: integer
                  description: Number of records to return per page.
            example:
              filters: {}
              page: 1
              page_size: 20
      responses:
        '200':
          description: On success, returns paginated Settlement Transactions records together with pagination metadata such as the page number, page size, and total record count.
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                    description: |-
                      `0` indicates success. A non-zero value is a business error code, in which case
                      `data` is usually empty.

                      HTTP status codes use their standard semantics. A successful request normally
                      returns `200`; errors may return `400`, `401`, `403`, `408`, or another applicable
                      status. Interpret the HTTP status together with the business `code`.

                      - `401`: The user is not authenticated.
                      - `403`: The current account is not authorized to use this function. Grant access
                        through User Permission.
                    x-enum-details:
                      - value: 0
                        label: Success
                  message:
                    type: string
                  data:
                    type: object
                    required:
                      - list
                      - total
                    properties:
                      list:
                        type: array
                        description: '**Returned value:** List of list.'
                        items:
                          type: object
                          properties:
                            trade_ledger_date:
                              type: string
                              description: '**Returned value:** Ledger Date. The date or time format follows the value returned by the API.'
                            trade_date:
                              type: string
                              description: '**Returned value:** Trade Date. The date or time format follows the value returned by the API.'
                            datasource:
                              type: string
                              description: '**Returned value:** Data Source.'
                            datasource_val:
                              type: string
                              description: Raw value of `datasource`. The `datasource` field contains the display value resolved through a dictionary or related record; this field contains the underlying code or ID.
                            'no':
                              type: string
                              description: '**Returned value:** Contract No.'
                            aaid:
                              type: string
                              description: '**Returned value:** A/C No..'
                            aaid_val:
                              type: string
                              description: Raw value of `aaid`. The `aaid` field contains the display value resolved through a dictionary or related record; this field contains the underlying code or ID.
                            market:
                              type: string
                              description: '**Returned value:** Market.'
                            position:
                              type: string
                              description: '**Returned value:** Position.'
                            settlement_account:
                              type: string
                              description: '**Returned value:** Sub Account.'
                            counter_id:
                              type: string
                              description: '**Returned value:** Counter ID.'
                            direction:
                              type: string
                              description: '**Returned value:** Trade Direction.'
                            direction_val:
                              type: string
                              description: Raw value of `direction`. The `direction` field contains the display value resolved through a dictionary or related record; this field contains the underlying code or ID.
                            trade_quantity:
                              type: string
                              description: '**Returned value:** Trade Qty.'
                            currency:
                              type: string
                              description: '**Returned value:** Currency.'
                            trade_amount:
                              type: string
                              description: '**Returned value:** Trade Amt.'
                            ibond_amount:
                              type: string
                              description: '**Returned value:** Bond Interest.'
                            receivable_amount:
                              type: string
                              description: '**Returned value:** Fee Receivable.'
                            deduction_amount:
                              type: string
                              description: '**Returned value:** Fee Discount.'
                            bill_amount:
                              type: string
                              description: '**Returned value:** Fee After Discount.'
                            calculate_out_amount:
                              type: string
                              description: '**Returned value:** Calculated Amt.'
                            policy_version:
                              type: string
                              description: '**Returned value:** Billing Conf Version.'
                            expected_balance_settlement_date:
                              type: string
                              description: '**Returned value:** Expected Settlement Date (Cash). The date or time format follows the value returned by the API.'
                            expected_equity_settlement_date:
                              type: string
                              description: '**Returned value:** Expected Settlement Date (Qty). The date or time format follows the value returned by the API.'
                            state:
                              type: string
                              description: '**Returned value:** Status.'
                            state_val:
                              type: string
                              description: Raw value of `state`. The `state` field contains the display value resolved through a dictionary or related record; this field contains the underlying code or ID.
                            settled_at:
                              type: string
                              description: '**Returned value:** Actual Settlement Date. The date or time format follows the value returned by the API.'
                            biz_type:
                              type: string
                              description: '**Returned value:** Biz Type.'
                            biz_type_val:
                              type: string
                              description: Raw value of `biz_type`. The `biz_type` field contains the display value resolved through a dictionary or related record; this field contains the underlying code or ID.
                            settlement_channel:
                              type: string
                              description: '**Returned value:** Settlement Channel.'
                            settlement_channel_val:
                              type: string
                              description: Raw value of `settlement_channel`. The `settlement_channel` field contains the display value resolved through a dictionary or related record; this field contains the underlying code or ID.
                            stage:
                              type: string
                              description: '**Returned value:** Trade Phase.'
                            stage_val:
                              type: string
                              description: Raw value of `stage`. The `stage` field contains the display value resolved through a dictionary or related record; this field contains the underlying code or ID.
                            custodian_id:
                              type: string
                              description: '**Returned value:** Broker.'
                            custodian_id_val:
                              type: string
                              description: Raw value of `custodian_id`. The `custodian_id` field contains the display value resolved through a dictionary or related record; this field contains the underlying code or ID.
                            security_type:
                              type: string
                              description: '**Returned value:** Security Type.'
                            security_type_val:
                              type: string
                              description: Raw value of `security_type`. The `security_type` field contains the display value resolved through a dictionary or related record; this field contains the underlying code or ID.
                            security_category:
                              type: string
                              description: '**Returned value:** Security Sub Type.'
                            security_category_val:
                              type: string
                              description: Raw value of `security_category`. The `security_category` field contains the display value resolved through a dictionary or related record; this field contains the underlying code or ID.
                            account_region:
                              type: string
                              description: '**Returned value:** Client Region.'
                            account_region_val:
                              type: string
                              description: Raw value of `account_region`. The `account_region` field contains the display value resolved through a dictionary or related record; this field contains the underlying code or ID.
                            account_location:
                              type: string
                              description: '**Returned value:** Client Location.'
                            account_location_val:
                              type: string
                              description: Raw value of `account_location`. The `account_location` field contains the display value resolved through a dictionary or related record; this field contains the underlying code or ID.
                            offset_contract_no:
                              type: string
                              description: '**Returned value:** Offset contract no.'
                            new_contract_no:
                              type: string
                              description: '**Returned value:** New contract no.'
                            origin_contract_no:
                              type: string
                              description: '**Returned value:** Origin contract no.'
                            currency_setl:
                              type: string
                              description: '**Returned value:** Currency Setl..'
                            trade_to_setl_exchange_rate:
                              type: string
                              description: '**Returned value:** Ex Rate.'
                            contract_id:
                              type: string
                              description: '**Returned value:** Contract ID.'
                            admin_id:
                              type: string
                              description: '**Returned value:** Last Updated.'
                            admin_id_val:
                              type: string
                              description: Raw value of `admin_id`. The `admin_id` field contains the display value resolved through a dictionary or related record; this field contains the underlying code or ID.
                            created_at:
                              type: string
                              description: '**Returned value:** Creat Time. The date or time format follows the value returned by the API.'
                            updated_at:
                              type: string
                              description: '**Returned value:** Updated At. The date or time format follows the value returned by the API.'
                            open_close:
                              type: string
                              description: '**Returned value:** Open/Close.'
                      total:
                        type: integer
                        description: '**Returned value:** Total number of matching records, used for pagination.'
              example:
                code: 0
                message: success
                data:
                  list:
                    - trade_ledger_date: '20260714'
                      trade_date: 2026-07-14
                      datasource: Trade
                      datasource_val: '1'
                      'no': OS2026071610152
                      aaid: H00000000
                      aaid_val: '10000000'
                      market: SH
                      position: LONG
                      settlement_account: ''
                      counter_id: ST/SH/600519
                      direction: Buy
                      direction_val: '1'
                      trade_quantity: '500'
                      currency: CNH
                      trade_amount: 609,950
                      ibond_amount: ''
                      receivable_amount: 60,422.53
                      deduction_amount: '0'
                      bill_amount: 60,422.53
                      calculate_out_amount: 60,422.53
                      policy_version: '699735'
                      expected_balance_settlement_date: 2026-07-15
                      expected_equity_settlement_date: 2026-07-14
                      state: Equity settled
                      state_val: '6'
                      settled_at: ''
                      biz_type: Stock Trade
                      biz_type_val: '1'
                      settlement_channel: settlement_ex_hk & CCASS
                      settlement_channel_val: '5'
                      stage: Normal
                      stage_val: '1'
                      custodian_id: '0'
                      custodian_id_val: '0'
                      security_type: Stock
                      security_type_val: ST
                      security_category: '0'
                      security_category_val: '0'
                      account_region: Hong Kong China
                      account_region_val: HK
                      account_location: ''
                      account_location_val: ''
                      offset_contract_no: ''
                      new_contract_no: ''
                      origin_contract_no: ''
                      currency_setl: CNH
                      trade_to_setl_exchange_rate: '1'
                      contract_id: '7935685'
                      admin_id: --
                      admin_id_val: '0'
                      created_at: '1784185008'
                      updated_at: '1784185008'
                      open_close: OPEN
                  total: 443
        '400':
          description: Bad request. Check the business error code in `code` and the error details in `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: The user is not authenticated, or the login session has expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: The current account is not authorized to use this feature. Grant the required permission to the account in User Permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: The request timed out. Check the business error code in `code` and the error details in `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
      x-mint:
        href: /en/api-reference/booking_revise_select_contracts
        metadata:
          sidebarTitle: Contract Amendment - Select Original Contract
  /v1/datasets/booking_stock_exchange_contract_revises:
    post:
      operationId: booking_stock_exchange_contract_revises
      summary: Contract Amendment List
      x-verified: verified
      tags:
        - Day-End Settlement
      x-permission-key:
        - lb_hk_clearing.contract_revise
      x-lbonly: false
      description: |-
        Query contract revision records. Combine business filters through `filters`, and use `page` and `page_size` to control pagination.

        ### Returns

        On success, returns the matching records with pagination info. See each field's description for filter usage, allowed values, and dynamic data sources.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: Combines business filters. Omit a filter field to disable that filter.
                  properties:
                    origin_contract_no:
                      type: string
                      description: Filters results by Origin contract no.
                      example: OS2026031812807
                    new_contract_no:
                      type: string
                      description: Filters results by New contract no.
                      example: OS2026033110001
                    audit_state:
                      type: string
                      description: Filters results by Audit State.
                      enum:
                        - '1'
                        - '2'
                        - '3'
                      x-enum-details:
                        - value: '1'
                          label: Review
                        - value: '2'
                          label: Success
                        - value: '3'
                          label: Rejected
                      example: Success
                page:
                  type: integer
                  description: Page number to retrieve, starting from `1`.
                page_size:
                  type: integer
                  description: Number of records to return per page.
            example:
              filters: {}
              page: 1
              page_size: 20
      responses:
        '200':
          description: On success, returns paginated Contract Amendment List records together with pagination metadata such as the page number, page size, and total record count.
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                    description: |-
                      `0` indicates success. A non-zero value is a business error code, in which case
                      `data` is usually empty.

                      HTTP status codes use their standard semantics. A successful request normally
                      returns `200`; errors may return `400`, `401`, `403`, `408`, or another applicable
                      status. Interpret the HTTP status together with the business `code`.

                      - `401`: The user is not authenticated.
                      - `403`: The current account is not authorized to use this function. Grant access
                        through User Permission.
                    x-enum-details:
                      - value: 0
                        label: Success
                  message:
                    type: string
                  data:
                    type: object
                    required:
                      - list
                      - total
                    properties:
                      list:
                        type: array
                        description: '**Returned value:** List of list.'
                        items:
                          type: object
                          properties:
                            created_at:
                              type: string
                              description: '**Returned value:** Canceled date. The date or time format follows the value returned by the API.'
                            origin_contract_no:
                              type: string
                              description: '**Returned value:** Origin contract no.'
                            offset_contract_no:
                              type: string
                              description: '**Returned value:** Offset contract no.'
                            new_contract_no:
                              type: string
                              description: '**Returned value:** New contract no.'
                            audit_state:
                              type: string
                              description: '**Returned value:** State.'
                            audit_state_val:
                              type: string
                              description: Raw value of `audit_state`. The `audit_state` field contains the display value resolved through a dictionary or related record; this field contains the underlying code or ID.
                      total:
                        type: integer
                        description: '**Returned value:** Total number of matching records, used for pagination.'
              example:
                code: 0
                message: success
                data:
                  list:
                    - created_at: '1774925027'
                      origin_contract_no: OS2026031812807
                      offset_contract_no: OS2026033110002
                      new_contract_no: OS2026033110001
                      audit_state: Success
                      audit_state_val: '2'
                  total: 378
        '400':
          description: Bad request. Check the business error code in `code` and the error details in `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: The user is not authenticated, or the login session has expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: The current account is not authorized to use this feature. Grant the required permission to the account in User Permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: The request timed out. Check the business error code in `code` and the error details in `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
      x-mint:
        href: /en/api-reference/booking_stock_exchange_contract_revises
        metadata:
          sidebarTitle: Contract Amendment List
