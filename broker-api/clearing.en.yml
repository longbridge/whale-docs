    get:
      operationId: booking_calculated_contract_order_histories
      summary: Trade Records Under Pending-Charge Contracts
      x-verified: verified
      tags:
      - 清算管理
      x-permission-key:
      - lb_hk_charging.lb_hk_usercharge_query
      x-lbonly: false
      description: |-
        查询「待收费合约下的成交记录」数据，可通过 `filters` 组合业务筛选条件，并使用 `page`、`page_size` 控制分页。

        ### 返回结果

        成功时返回匹配的记录列表及分页信息。各过滤字段的用途、可选值和动态数据来源见对应字段说明。
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: Combines business filters. Omit a filter field to disable that filter.
                  properties:
                    contract_id:
                      type: string
                      description: Filters results by Contract ID.
                page:
                  type: integer
                  description: Page number to retrieve, starting from `1`.
                page_size:
                  type: integer
                  description: Number of records to return per page.
            example:
              filters: {}
              page: 1
              page_size: 20
      responses:
        '200':
          description: On success, returns paginated Trade Records Under Pending-Charge Contracts records together with pagination metadata such as the page number, page size, and total record count.
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - data
                properties:
                  code:
                    type: integer
                    description: |-
                      `0` indicates success. A non-zero value is a business error code, in which case
                      `data` is usually empty.

                      HTTP status codes use their standard semantics. A successful request normally
                      returns `200`; errors may return `400`, `401`, `403`, `408`, or another applicable
                      status. Interpret the HTTP status together with the business `code`.

                      - `401`: The user is not authenticated.
                      - `403`: The current account is not authorized to use this function. Grant access
                        through User Permission.
                    x-enum-details:
                    - value: 0
                      label: Success
                  message:
                    type: string
                  data:
                    type: object
                    required:
                    - list
                    - total
                    properties:
                      list:
                        type: array
                        description: '**Returned value:** Records matching the query conditions.'
                        items:
                          type: object
                          properties:
                            order_id:
                              type: string
                              description: '**Returned value:** Front End Order No.'
                            backend_order_seq:
                              type: string
                              description: '**Returned value:** Order No.'
                            his_id:
                              type: string
                              description: '**Returned value:** Front End Ref No.'
                            backend_order_his_seq:
                              type: string
                              description: '**Returned value:** Ref No.'
                            quantity:
                              type: string
                              description: '**Returned value:** Trade Quantity.'
                            amount:
                              type: string
                              description: '**Returned value:** Trade Amt(Trade CCY).'
                            unexpected_upstream_return_fee:
                              type: string
                              description: '**Returned value:** Pass On Cost(Trade CCY).'
                            ibond_interest:
                              type: string
                              description: '**Returned value:** Interest(Trade CCY).'
                            price:
                              type: string
                              description: '**Returned value:** Price.'
                            per_value:
                              type: string
                              description: '**Returned value:** Face value.'
                      total:
                        type: integer
                        description: '**Returned value:** Total number of matching records, used for pagination.'
              example:
                code: 0
                message: success
                data:
                  list:
                  - order_id: '1255090877047603200'
