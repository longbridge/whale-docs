                      x-value-source:
                        endpoint: GET /v1/datasets/refs/tenant_currencies
                    aaid:
                      type: string
                      description: |-
                        Filters results by Client.
                    biz_date:
                      type: string
                      format: date
                      description: |-
                        Filters results by Biz Date.
                page:
                  type: integer
                  description: |-
                    Page number to retrieve, starting from `1`.
                page_size:
                  type: integer
                  description: |-
                    Number of records to return per page.
            example:
              filters: {}
              page: 1
              page_size: 20
      responses:
        "200":
          description: |-
            On success, returns paginated User Bill Detail records together with pagination metadata such as the page number, page size, and total record count.
          content:
            application/json:
