      description: '將「基金前台訂單」數據導出為文件。`filters` 決定導出範圍，`down_fields` 可限制導出字段。


        ### 導出模式


        - `mode: 0`：同步導出，成功後直接返回下載地址。

        - `mode: 1`：異步導出，先返回 `file_download_id`；隨後調用 `GET /v1/datasets/download/{id}` 獲取下載地址。

        - 不再需要導出記錄時，可調用 `DELETE /v1/datasets/download/{id}` 刪除。'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 字段同 fund_frontend_member_orders.yaml（query 能力）裏的 filters
                  properties:
                    member_id:
                      type: string
                      description: 用於按「客戶編號」篩選結果。
                    state:
                      type: string
                      description: '用於按「狀態」篩選結果。


                        **可選值：**

                        - `Init` - 表示初始態

                        - `Cutoff` - 表示已日切

                        - `Submitted` - 表示已提交

                        - `FundsSettled` - 表示贖回貨交收

                        - `Done` - 表示已完成

                        - `Canceled` - 表示已撤單

                        - `Confirmed` - 表示已確認

                        - `Rejected` - 表示拒單'
                      enum:
                      - Init
                      - Cutoff
                      - Submitted
                      - FundsSettled
                      - Done
                      - Canceled
                      - Confirmed
                      - Rejected
                      x-enum-details:
                      - value: Init
                        label: 初始態
                      - value: Cutoff
                        label: 已日切
                      - value: Submitted
                        label: 已提交
                      - value: FundsSettled
                        label: 贖回貨交收
                      - value: Done
                        label: 已完成
                      - value: Canceled
                        label: 已撤單
                      - value: Confirmed
                        label: 已確認
                      - value: Rejected
                        label: 拒單
                mode:
                  type: integer
                  default: 0
                  description: '不傳時默認 0（同步）


                    **可選值：**

                    - `0` - 表示同步

                    - `1` - 表示异步'
                  enum:
                  - 0
                  - 1
                  x-enum-details:
                  - value: 0
                    label: 同步
                  - value: 1
                    label: 异步
                ext:
                  type: string
                  description: '下載文件格式。不傳時默認為 `csv`。


                    **可選值：**

                    - `csv` - 表示 CSV

                    - `xlsx` - 表示 Excel'
                  enum:
                  - csv
                  - xlsx
                file_name:
                  type: string
                  description: 導出文件名稱。不傳時由服務端生成。
                down_fields:
                  type: array
                  description: 不傳時導出全部字段；取值範圍見 items.enum（同查詢接口 data.list.items 的字段列表）
                  items:
                    type: string
                    enum:
                    - id
                    - member_id
                    - member_id_val
                    - aaid
                    - aaid_val
                    - action
                    - action_val
                    - trade_source
                    - trade_source_val
                    - counter_id
                    - fund_all_name
                    - state
                    - state_val
                    - created_at
                    - apply_amount
                    - confirmed_shares
                    - apply_shares
                    - confirmed_amount
                    - currency
                    - fee
                    - record_remark
                ticket_content:
                  type: string
                  description: 模板配置了下載審核工單時，供審批人查看
                ticket_preview_url:
                  type: string
                  description: 導出審批詳情地址；僅在導出需要審批時使用。
                hide:
                  type: integer
                  description: '是否在下載記錄列表中隱藏本次導出記錄。


                    **可選值：**

                    - `0` - 表示不隐藏

                    - `1` - 表示隐藏'
                  enum:
                  - 0
                  - 1
                  x-enum-details:
                  - value: 0
                    label: 不隐藏
                  - value: 1
                    label: 隐藏
            example:
              filters: {}
              mode: 0
              ext: csv
              file_name: ''
              remark: ''
              down_fields: []
              ticket_content: ''
              ticket_preview_url: ''
              hide: 0
      responses:
        '200':
          description: 成功時返回「基金前台訂單導出」任務信息。同步導出直接提供下載地址；異步導出提供用於後續查詢的 `file_download_id`。
          content:
