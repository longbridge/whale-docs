openapi: 3.1.1
info:
  title: Whale OpenAPI (whale-openapi-docs 自动生成)
  version: 1.0.0
servers:
- url: https://b-api.longbridge.xyz
  description: 测试环境
- url: https://b-api.lbkrs.com
  description: 生产环境
security:
- bearerAuth: []
tags:
- name: 交易面板
  description: 訂單管理、基金下單/批量下單等交易面板相關的後台管理接口。
paths:
  /ut/order/admin/submit:
    post:
      operationId: fund_order_submit
      summary: 後台代客提交基金訂單
      tags:
      - 交易面板
      x-permission-key:
      - lb_hk_order_pots.ut_order_submit
      x-lbonly: false
      description: '後台代客提交基金訂單。


        ### 請求參數


        - 必填：`aaid`（客戶資產賬號）、`member_id`（客戶ID）、`account_channel`（賬戶渠道）、`currency`（幣種）、`counter_id`（基金代碼）、`action`（買賣方向）

        - 可選：`fund_channel`（基金渠道）、`amount`（買入金額）、`units`（賣出份額）、`fee`（手續費）、`remark`（備註）

        - 各字段的格式、取值範圍和業務含義見對應字段說明。


        ### 處理結果


        成功時完成上述業務操作；後續狀態和返回數據以 `200` 響應定義為準。'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - aaid
              - member_id
              - account_channel
              - currency
              - counter_id
              - action
              properties:
                aaid:
                  type: string
                  description: 用於指定「客戶資產賬號」。此字段為必填項。
                member_id:
                  type: string
                  description: 客戶 ID，由所選客戶信息補充
                account_channel:
                  type: string
                  description: 賬戶渠道，取所選客戶的開戶渠道
                currency:
                  type: string
                  description: 本次請求使用的幣種代碼。此字段為必填項。
                fund_channel:
                  type: string
                  description: '基金渠道，取值來自 fund_channel 動態枚舉，非固定


                    請調用 `GET /v1/datasets/refs/fund_channel` 獲取當前可用的數據字典，並使用返回項的 `key` 作為本字段值。'
                  x-value-source:
                    endpoint: GET /v1/datasets/refs/fund_channel
                counter_id:
                  type: string
                  description: 基金內部代碼，通過基金搜索選擇
                action:
                  type: string
                  description: '交易方向，默認 BUY（買入）


                    **可選值：**

                    - `BUY` - 表示買入

                    - `SELL` - 表示賣出'
                  enum:
                  - BUY
                  - SELL
                  x-enum-details:
                  - value: BUY
                    label: 買入
                  - value: SELL
                    label: 賣出
                amount:
                  type: number
                  description: 申購金額，僅買入 (action=BUY)時必填
                units:
                  type: number
                  description: 贖回份額，僅賣出 (action=SELL)時必填，受可賣份額及份額精度校驗
                fee:
                  type: number
                  description: 手續費，僅買入 (action=BUY)時必填
                remark:
                  type: string
                  description: 隨本次操作保存的備註。
            example:
              aaid: H00000000
              member_id: '1000000000000000000'
              account_channel: lb
              currency: USD
              fund_channel: ''
              counter_id: ''
              action: BUY
              amount: '1000'
              fee: '0'
              remark: ''
      responses:
        '200':
          description: 請求處理成功。響應的 `data` 不包含額外業務字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: '0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。


                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`

                      判斷具體結果。


                      - `401`：未登錄。

                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。'
                    x-enum-details:
                    - value: 0
                      label: 成功
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登錄或登錄狀態已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 當前賬號未獲得該功能授權。請在 User Permission 中為該賬號開通相應權限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 請求處理超時。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
