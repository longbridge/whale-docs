openapi: 3.1.1
info:
  title: Whale OpenAPI (whale-openapi-docs 自动生成)
  version: 1.0.0
servers:
- url: https://b-api.longbridge.xyz
  description: 测试环境
- url: https://b-api.lbkrs.com
  description: 生产环境
security:
- bearerAuth: []
tags:
- name: 经纪人管理 (Broker Management)
  description: 經紀人關係、團隊、分成套餐、佣金分成等經紀人業務管理接口。
paths:
  /account/import:
    post:
      operationId: account_import
      summary: 批量導入經紀人-客戶關係
      tags:
      - 经纪人管理 (Broker Management)
      x-permission-key:
      - account.apply_edit_member
      - account.modify_transaction_channel
      - account.suspend_account
      - account.update_appid
      - b2b_customer.submit_account
      - kyc.update_account_info
      - ticket.import_agent
      - ticket.import_relation
      x-lbonly: false
      description: '批量導入經紀人與客戶的綁定關係。先上傳關係文件，再用返回的文件標識提交導入。


        ### 請求參數


        - 必填：`type`（導入文件類型）

        - 可選：`s3_key`（上傳文件 S3 Key）、`name`（名稱）、`filename`（文件名）、`service`（服務標識）、`base_account_ids`（基礎賬號ID列表）、`audit_frontend_resource`（審計上下文）

        - 各字段的格式、取值範圍、默認行為和業務含義見對應字段說明。


        ### 處理結果


        成功時完成所述業務操作，具體返回內容見 `200` 響應定義。'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - type
              properties:
                s3_key:
                  type: string
                  description: 文件上傳後返回的對象存儲 Key，用於定位本次請求處理的文件。
                name:
                  type: string
                  description: 用於指定「名稱」。
                type:
                  type: string
                  description: 用於指定「導入文件類型」。此字段為必填項。
                filename:
                  type: string
                  description: 本次請求處理的文件名，包含文件擴展名。
                service:
                  type: string
                  description: 用於指定「服務標識」。
                base_account_ids:
                  type: array
                  description: 基礎賬號ID列表，以 JSON 數組形式提交。
                  items:
                    type: string
                audit_frontend_resource:
                  type: object
                  description: 調用方提交的審計上下文，用於記錄本次操作。
            example:
              s3_key: ''
              name: ''
              type: ''
              filename: ''
              service: ''
              base_account_ids: []
              audit_frontend_resource: {}
      responses:
        '200':
          description: 請求處理成功。響應的 `data` 不包含額外業務字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: '0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。


                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code` 判斷具體結果。


                      - `401`：未登錄。

                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。'
                    x-enum-details:
                    - value: 0
                      label: 成功
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登錄或登錄狀態已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 當前賬號未獲得該功能授權。請在 User Permission 中為該賬號開通相應權限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 請求處理超時。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
  /v1/datasets/broker_relationship_accounts:
    post:
      operationId: broker_relationship_accounts
      summary: 經紀人客戶關系
      tags:
      - 经纪人管理 (Broker Management)
      x-permission-key:
      - b2b_agent_manage.list_relation
      x-lbonly: false
      description: '查詢「經紀人客戶關系」數據，可通過 `filters` 組合業務篩選條件，並使用 `page`、`page_size` 控制分頁。


        ### 返回結果


        成功時返回匹配的記錄列表及分頁信息。各過濾字段的用途、可選值和動態數據來源見對應字段說明。'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 組合業務過濾條件。省略某個過濾字段時，不按該字段篩選。
                  properties:
                    team_code:
                      type: string
                      description: 用於按「團隊編號」篩選結果。
                    name:
                      type: string
                      description: 用於按「團隊名稱」篩選結果。
                    broker_code:
                      type: string
                      description: '用於按「經紀人」篩選結果。


                        候選值會動態變化。請調用 `GET /v1/datasets/refs/broker_accounts` 獲取當前可用的數據字典，並使用返回項的 `key` 作為本參數值。'
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/broker_accounts
                    member_id:
                      type: string
                      description: 用於按「客戶」篩選結果。
                    account_type:
                      type: string
                      description: '用於按「賬戶類型」篩選結果。


                        **可選值：**

                        - `M` - 表示融資賬戶

                        - `C` - 表示現金賬戶

                        - `F` - 表示期貨賬戶'
                      enum:
                      - M
                      - C
                      - F
                      x-enum-details:
                      - value: M
                        label: 融資賬戶
                      - value: C
                        label: 現金賬戶
                      - value: F
                        label: 期貨賬戶
                page:
                  type: integer
                  description: 要查詢的頁碼，從 `1` 開始。
                page_size:
                  type: integer
                  description: 每頁返回的記錄數量。
            example:
              filters: {}
              page: 1
              page_size: 20
      responses:
        '200':
          description: 成功時分頁返回「經紀人客戶關系」記錄，以及頁碼、每頁數量和總記錄數等分頁信息。
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - data
                properties:
                  code:
                    type: integer
                    description: '0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。


                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code` 判斷具體結果。


                      - `401`：未登錄。

                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。'
                    x-enum-details:
                    - value: 0
                      label: 成功
                  message:
                    type: string
                  data:
                    type: object
                    required:
                    - list
                    - total
                    properties:
                      list:
                        type: array
                        description: '**返回值：** 列表列表。'
                        items:
                          type: object
                          properties:
                            display_id:
                              type: string
                              description: '**返回值：** 證券賬號。'
                            real_name:
                              type: string
                              description: '**返回值：** 客戶姓名。'
                            account_type:
                              type: string
                              description: '**返回值：** 賬戶類型。'
                            account_type_val:
                              type: string
                              description: 字段 account_type 的原始值：account_type 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            account_state:
                              type: string
                              description: '**返回值：** 賬戶狀態。'
                            account_state_val:
                              type: string
                              description: 字段 account_state 的原始值：account_state 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            account_disable:
                              type: string
                              description: '**返回值：** 賬戶凍結狀態。'
                            account_disable_val:
                              type: string
                              description: 字段 account_disable 的原始值：account_disable 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            broker_code:
                              type: string
                              description: '**返回值：** 經紀人編號。'
                            team_code:
                              type: string
                              description: '**返回值：** 所屬團隊。'
                            broker_state:
                              type: string
                              description: '**返回值：** 經紀人狀態。'
                            broker_state_val:
                              type: string
                              description: 字段 broker_state 的原始值：broker_state 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                      total:
                        type: integer
                        description: '**返回值：** 符合查詢條件的記錄總數，用於計算分頁。'
              example:
                code: 0
                message: success
                data:
                  list:
                  - display_id: H00000000
                    real_name: 示例用户
                    account_type: Margin
                    account_type_val: M
                    account_state: Active
                    account_state_val: '1'
                    account_disable: Unfrozen
                    account_disable_val: 'false'
                    broker_code: LB851987964599174
                    team_code: DT0001
                    broker_state: Active
                    broker_state_val: '1'
                  total: 1272276
        '400':
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登錄或登錄狀態已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 當前賬號未獲得該功能授權。請在 User Permission 中為該賬號開通相應權限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 請求處理超時。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
      x-post-fallback: true
      x-dataset-download:
        method: POST
        path: /v1/datasets/broker_relationship_accounts/download
        operationId: broker_relationship_accounts_download
  /v1/datasets/broker_relationship_accounts/download:
    post:
      operationId: broker_relationship_accounts_download
      summary: 經紀人客戶關系導出
      tags:
      - 经纪人管理 (Broker Management)
      x-permission-key:
      - b2b_agent_manage.list_relation
      x-lbonly: false
      description: '將「經紀人客戶關系」數據導出為文件。`filters` 決定導出範圍，`down_fields` 可限制導出字段。


        ### 導出模式


        - `mode: 0`：同步導出，成功後直接返回下載地址。

        - `mode: 1`：異步導出，先返回 `file_download_id`；隨後調用 `GET /v1/datasets/download/{id}` 獲取下載地址。

        - 不再需要導出記錄時，可調用 `DELETE /v1/datasets/download/{id}` 刪除。'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 字段同 broker_relationship_accounts.yaml（query 能力）裏的 filters
                  properties:
                    team_code:
                      type: string
                      description: 用於按「團隊編號」篩選結果。
                    name:
                      type: string
                      description: 用於按「團隊名稱」篩選結果。
                    broker_code:
                      type: string
                      description: '用於按「經紀人」篩選結果。


                        候選值會動態變化。請調用 `GET /v1/datasets/refs/broker_accounts` 獲取當前可用的數據字典，並使用返回項的 `key` 作為本參數值。'
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/broker_accounts
                    member_id:
                      type: string
                      description: 用於按「客戶」篩選結果。
                    account_type:
                      type: string
                      description: '用於按「賬戶類型」篩選結果。


                        **可選值：**

                        - `M` - 表示融資賬戶

                        - `C` - 表示現金賬戶

                        - `F` - 表示期貨賬戶'
                      enum:
                      - M
                      - C
                      - F
                      x-enum-details:
                      - value: M
                        label: 融資賬戶
                      - value: C
                        label: 現金賬戶
                      - value: F
                        label: 期貨賬戶
                mode:
                  type: integer
                  default: 0
                  description: '不傳時默認 0（同步）


                    **可選值：**

                    - `0` - 表示同步

                    - `1` - 表示异步'
                  enum:
                  - 0
                  - 1
                  x-enum-details:
                  - value: 0
                    label: 同步
                  - value: 1
                    label: 异步
                ext:
                  type: string
                  description: '下載文件格式。不傳時默認為 `csv`。


                    **可選值：**

                    - `csv` - 表示 CSV

                    - `xlsx` - 表示 Excel'
                  enum:
                  - csv
                  - xlsx
                file_name:
                  type: string
                  description: 導出文件名稱。不傳時由服務端生成。
                remark:
                  type: string
                  description: 與本次操作一並保存的備註。
                down_fields:
                  type: array
                  description: 不傳時導出全部字段；取值範圍見 items.enum（同查詢接口 data.list.items 的字段列表）
                  items:
                    type: string
                    enum:
                    - display_id
                    - real_name
                    - account_type
                    - account_type_val
                    - account_state
                    - account_state_val
                    - account_disable
                    - account_disable_val
                    - broker_code
                    - team_code
                    - broker_state
                    - broker_state_val
                ticket_content:
                  type: string
                  description: 模板配置了下載審核工單時，供審批人查看
                ticket_preview_url:
                  type: string
                  description: 導出審批詳情地址；僅在導出需要審批時使用。
                hide:
                  type: integer
                  description: '是否在下載記錄列表中隱藏本次導出記錄。


                    **可選值：**

                    - `0` - 表示不隐藏

                    - `1` - 表示隐藏'
                  enum:
                  - 0
                  - 1
                  x-enum-details:
                  - value: 0
                    label: 不隐藏
                  - value: 1
                    label: 隐藏
            example:
              filters: {}
              mode: 0
              ext: csv
              file_name: ''
              remark: ''
              down_fields: []
              ticket_content: ''
              ticket_preview_url: ''
              hide: 0
      responses:
        '200':
          description: 成功時返回「經紀人客戶關系導出」任務信息。同步導出直接提供下載地址；異步導出提供用於後續查詢的 `file_download_id`。
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - data
                properties:
                  code:
                    type: integer
                    description: '0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。


                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code` 判斷具體結果。


                      - `401`：未登錄。

                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。'
                    x-enum-details:
                    - value: 0
                      label: 成功
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      url:
                        type: string
                        description: '同步模式（`mode: 0`）下返回，異步模式下為空'
                      file_download_id:
                        type: string
                        description: '異步模式（`mode: 1`）下返回，即 `GET /v1/datasets/download/{id}` /

                          `DELETE /v1/datasets/download/{id}` 路徑中的 id：GET 獲取最終下載地址，DELETE 刪除該導出記錄。'
                      ticket_id:
                        type: string
                        description: '**返回值：** 審批工單 ID。僅在本次操作觸發審批流程時返回。'
              example:
                code: 0
                message: success
                data:
                  url: https://b-api.longbridge.xyz/download/export_result.csv
                  file_download_id: ''
                  ticket_id: ''
        '400':
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登錄或登錄狀態已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 當前賬號未獲得該功能授權。請在 User Permission 中為該賬號開通相應權限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 請求處理超時。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
      x-dataset-parent:
        method: POST
        path: /v1/datasets/broker_relationship_accounts
        operationId: broker_relationship_accounts
  /account/biz_assign_broker_account:
    post:
      operationId: biz_assign_broker_account
      summary: 經紀人下級管理
      tags:
      - 经纪人管理 (Broker Management)
      x-permission-key:
      - b2b_agent_manage.downline_agent
      x-lbonly: false
      description: '為指定經紀人設置其管理的下級經紀人列表。


        ### 請求參數


        - 必填：`broker_code`（經紀人編號）、`broker_codes`（管理的下級經紀人編號列表）

        - 各字段的格式、取值範圍和業務含義見對應字段說明。


        ### 處理結果


        成功時更新該經紀人管理的下級經紀人列表，業務結果位於 `data`；請結合業務 `code` 判斷是否成功。'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - broker_code
              - broker_codes
              properties:
                broker_code:
                  type: string
                  description: 經紀人編號。
                broker_codes:
                  type: array
                  items:
                    type: string
                  description: 管理的下級經紀人編號列表。
                  example:
                  - AE002
                  - AE003
            example:
              broker_code: AE001
              broker_codes:
              - AE002
              - AE003
      responses:
        '200':
          description: 請求處理成功。業務結果位於 `data`。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: '0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。


                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code` 判斷具體結果。


                      - `401`：未登錄。

                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。'
                    x-enum-details:
                    - value: 0
                      label: 成功
                  message:
                    type: string
                  data:
                    type: object
                    description: 業務結果，通常為空對象。
              example:
                code: 0
                message: success
                data: {}
        '400':
