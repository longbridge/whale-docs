openapi: 3.1.1
info:
  title: Longport Whale Broker API
  description: Institution-grade server-side APIs for brokers using Longport Whale.
  version: 2.0.0
servers:
- url: https://b-api.longbridge.xyz
  description: Testing
- url: https://b-api.lbkrs.com
  description: Production
security:
- bearerAuth: []
tags:
- name: Service Parameter
paths:
  /v1/billing/myrates/markets:
    get:
      operationId: myrates_markets
      summary: Rates Markets
      tags:
      - Service Parameter
      x-permission-key:
      - billing.account_fee_info_manage
      x-lbonly: false
      description: 'Returns the list of available fee-display markets / tabs.


        This is the source of candidate values for the `tab` filter of the Client-side Display datasets:

        the `tab` filter of `booking_account_fee_info_items` / `booking_item_copywritings` uses the

        `tabs[].tab` values returned here. The candidate set changes dynamically; always use the live

        response of this endpoint.'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: The request was processed successfully. `data.tabs` is the list of available market
            tabs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: "`0` indicates success. A non-zero value is a business error code, in\
                      \ which case\n`data` is usually empty.\n\nHTTP status codes use their standard semantics.\
                      \ A successful request normally\nreturns `200`; errors may return `400`, `401`,\
                      \ `403`, `408`, or another applicable\nstatus. Interpret the HTTP status together\
                      \ with the business `code`.\n\n- `401`: The user is not authenticated.\n- `403`:\
                      \ The current account is not authorized to use this function. Grant access\n  through\
                      \ User Permission."
                    x-enum-details:
                    - value: 0
                      label: Success
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      tabs:
                        type: array
                        description: List of available market tabs. Each item's `tab` is the value used
                          for the datasets' `tab` filter.
                        items:
                          type: object
                          properties:
                            tab:
                              type: string
                              description: Tab / filter value (market code), e.g. `HK`, `US`, `US_OPTIONS`,
                                `HAS`.
                            name:
                              type: string
                              description: Tab display name, e.g. `HK`, `US Options`, `Crypto - HashKey`.
                            biz_type:
                              type: integer
                              description: Business type, e.g. `1` securities market, `5` US options,
                                `9` crypto.
                            market:
                              type: string
                              description: Market code.
              example:
                code: 0
                message: success
                data:
                  tabs:
                  - tab: HK
                    name: HK
                    biz_type: 1
                    market: HK
                  - tab: US
                    name: US
                    biz_type: 1
                    market: US
                  - tab: US_OPTIONS
                    name: US Options
                    biz_type: 5
                    market: US
                  - tab: HAS
                    name: Crypto - HashKey
                    biz_type: 9
                    market: HAS
        '400':
          description: Bad request. Check the business error code in `code` and the error details in `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: The user is not authenticated, or the login session has expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: The current account is not authorized to use this feature. Grant the required permission
            to the account in User Permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: The request timed out. Check the business error code in `code` and the error details
            in `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
  /v1/billing/account_fee_info_item:
    post:
      operationId: account_fee_info_item_add
      summary: Add Billing Account Fee Info Item
      tags:
      - Service Parameter
      x-permission-key:
      - billing.account_fee_info_manage
      x-lbonly: false
      description: 'Add Billing Account Fee Info Item.


        ### Request parameters


        - Required: `tab` (Business Tab), `name` (Name (multi-locale)), `conditions` (Trigger Conditions)

        - Optional: `desc` (Description (multi-locale))

        - See each field for its format, allowed values, and business meaning.


        ### Result


        On success, the endpoint completes the operation. See the `200` response schema for returned data
        and subsequent state information.'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - tab
              - name
              - conditions
              properties:
                tab:
                  type: string
                  description: Business-line or market identifier. The caller derives it from the target
                    market and includes it in the request.
                name:
                  type: object
                  description: A multilingual name object keyed by zh-CN/zh-HK/en.
                desc:
                  type: object
                  description: A multilingual description object keyed by zh-CN/zh-HK/en.
                conditions:
                  type: array
                  description: 'Array element { field, value }: field is a condition-item ID (values from
                    the

                    billing_my_rate_condition_field dynamic enumeration, e.g. ''3'' for account/counter

                    conditions); value is an array of selected values (strings); the values of some

                    condition items come from their corresponding dynamic enumerations.


                    Call `GET /v1/datasets/refs/billing_my_rate_condition_field` to retrieve the current

                    condition-item dictionary, and use the returned entry''s `key` as `field`.'
                  items:
                    type: string
            example:
              tab: hk_stock
              name:
                zh-CN: 示例名称
                zh-HK: 示例名稱
                en: Sample Name
              desc:
                zh-CN: 示例描述
                zh-HK: 示例描述
                en: Sample description
              conditions:
              - field: '3'
                value:
                - '1001'
      responses:
        '200':
          description: The request was processed successfully. The response `data` does not contain additional
            business fields.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: "`0` indicates success. A non-zero value is a business error code, in\
                      \ which case\n`data` is usually empty.\n\nHTTP status codes use their standard semantics.\
                      \ A successful request normally\nreturns `200`; errors may return `400`, `401`,\
                      \ `403`, `408`, or another applicable\nstatus. Interpret the HTTP status together\
                      \ with the business `code`.\n\n- `401`: The user is not authenticated.\n- `403`:\
                      \ The current account is not authorized to use this function. Grant access\n  through\
                      \ User Permission."
                    x-enum-details:
                    - value: 0
                      label: Success
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: Bad request. Check the business error code in `code` and the error details in `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: The user is not authenticated, or the login session has expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: The current account is not authorized to use this feature. Grant the required permission
            to the account in User Permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: The request timed out. Check the business error code in `code` and the error details
            in `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
