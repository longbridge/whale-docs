    get:
      operationId: org_package_ref_detail
      summary: Org Package Ref Detail
      tags:
      - Service Parameter
      x-permission-key:
      - lb_hk_charging.lb_hk_billing_org_package_ref_list
      x-lbonly: false
      description: 'Find the package reference configuration of an organization by `org_id`.


        ### Request parameters


        - Required: `org_id` (organization id), supplied as a query parameter.


        ### Result


        On success, `data` contains the organization''s package reference configuration.


        > Note: response fields are derived from the `booking_org_package_refs` dataset entity. The test

        > environment has no configured organization, so the response body has not been live-verified;

        > refer to the actual API response for the authoritative field set.'
      security:
      - bearerAuth: []
      parameters:
      - name: org_id
        in: query
        required: true
        schema:
          type: string
        description: Organization id.
        example: '3'
      responses:
        '200':
          description: The request was processed successfully. `data` contains the organization's package
            reference configuration.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: "`0` indicates success. A non-zero value is a business error code, in\
                      \ which case\n`data` is usually empty.\n\nHTTP status codes use their standard semantics.\
                      \ A successful request normally\nreturns `200`; errors may return `400`, `401`,\
                      \ `403`, `408`, or another applicable\nstatus. Interpret the HTTP status together\
                      \ with the business `code`.\n\n- `401`: The user is not authenticated.\n- `403`:\
                      \ The current account is not authorized to use this function. Grant access\n  through\
                      \ User Permission."
                    x-enum-details:
                    - value: 0
                      label: Success
                  message:
                    type: string
                  data:
                    type: object
                    description: Organization package reference configuration (fields derived from the
                      dataset entity, not live-verified).
                    properties:
                      org_id:
                        type: string
                        description: Organization id.
                      default_package_id:
                        type: string
                        description: Default package id.
                      cash_package_id:
                        type: string
                        description: Cash business package id.
                      bo_package_id:
                        type: string
                        description: BO business package id.
                      financing_package_id:
                        type: string
                        description: Financing business package id.
                      personal_allow_item_ids:
                        type: array
                        items:
                          type: string
                        description: List of charging scene ids for which the organization may configure
                          customized fees.
                      names:
                        type: string
                        description: Associated package name display.
              example:
                code: 0
                message: success
                data:
                  org_id: '3'
                  default_package_id: '1'
                  cash_package_id: ''
                  bo_package_id: ''
                  financing_package_id: ''
                  personal_allow_item_ids: []
                  names: ''
        '400':
          description: Bad request. Check the business error code in `code` and the error details in `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: The user is not authenticated, or the login session has expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: The current account is not authorized to use this feature. Grant the required permission
            to the account in User Permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
