                  items:
                    type: string
                audit_frontend_resource:
                  type: object
                  description: 'A frontend form snapshot attached upon submission for backend audit tracing;
                    in the

                    add scenario it is fixed as an add operation.'
            example:
              custodian_id: '8090001'
              billing_item_id: '1023'
              billing_item:
                id: '1023'
                name_loc: 美股交易佣金
              metric_type: '1'
              threshold: '0'
              fee_rate_type: '1'
