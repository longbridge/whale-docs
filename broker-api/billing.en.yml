                  x-value-source:
                    endpoint: GET /v1/datasets/refs/billing_packages
                personal_allow_item_ids:
                  type: array
                  description: Submit Personal Allow Item IDs as a JSON array.
                  items:
                    type: string
            example:
              org_id: ''
              default_package_id: ''
              cash_package_id: ''
              financing_package_id: ''
              bo_package_id: ''
              allow_package_ids: []
              personal_allow_item_ids: []
      responses:
        '200':
          description: The request was processed successfully. The response `data` does not contain additional
