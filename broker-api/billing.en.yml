                min:
                  type: string
                  description: Specifies Minimum Fee. This field is required.
                max:
                  type: string
                  description: Specifies Maximum Fee. This field is required.
                max_metric:
                  type: object
                  description: The raw form object { max_metric_type, max_metric_rate }.
                max_metric_type:
                  type: string
                  description: '0 = disabled, 1 = enabled; expanded from max_metric.max_metric_type.


                    **Allowed values:**

                    - `0` - Disabled

                    - `1` - Enabled'
                  enum:
                  - '0'
                  - '1'
                  x-enum-details:
                  - value: '0'
                    label: Disabled
