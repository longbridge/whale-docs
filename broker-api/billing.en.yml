    post:
      operationId: company_fee_add
      summary: Add Billing Company Fee
      tags:
      - Service Parameter
      x-permission-key:
      - lb_hk_charging.lb_hk_scene_update
      x-lbonly: false
      description: 'Add Billing Company Fee.


        ### Request parameters


        - Required: `custodian_id` (Custodian/Company ID), `billing_item_id` (Billing Item ID), `threshold`
        (Threshold), `fee_rate_type` (Fee Rate Type), `calculation_method` (Calculation Method), `rates`
        (Rate Rules), `currency` (Currency), `min` (Minimum Fee), `max` (Maximum Fee), `granularity` (Granularity),
        `cutoff_method` (Cutoff Method), `cutoff_digits` (Cutoff Digits)

        - Optional: `billing_item` (Billing Item Snapshot), `metric_type` (Metric Type), `fixed_rates`
        (Fixed Rates), `max_metric` (Max Metric Config), `max_metric_type` (Max Metric Type), `max_metric_rate`
        (Max Metric Rate), `min_metric` (Min Metric Config), `min_metric_type` (Min Metric Type), `min_metric_rate`
        (Min Metric Rate), `metric_cycle_type` (Metric Cycle Type), `special_fees` (Special Fee Conditions),
        `audit_frontend_resource` (Frontend Audit Snapshot)

        - See each field for its format, allowed values, and business meaning.


        ### Result


        On success, the endpoint completes the operation. See the `200` response schema for returned data
        and subsequent state information.'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - custodian_id
              - billing_item_id
              - threshold
              - fee_rate_type
              - calculation_method
              - rates
              - currency
              - min
              - max
              - granularity
              - cutoff_method
              - cutoff_digits
              properties:
                custodian_id:
                  type: string
                  description: 'Custodian; value comes from the clear_custodian_broker_no_all dynamic
                    enum, not fixed.


                    Call `GET /v1/datasets/refs/clearing_agents_all` to retrieve the current data dictionary,
                    and use the returned entry''s `key` as this field''s value.'
                  x-value-source:
                    endpoint: GET /v1/datasets/refs/clearing_agents_all
                billing_item_id:
                  type: string
                  description: The billing item ID, selected via the billing item selector.
                billing_item:
                  type: object
                  description: 'The billing-item object, containing fields such as id/name_loc, submitted
                    together

                    with the selected billing scenario.'
                metric_type:
                  type: string
                  description: 'The measurement type; values come from the billing_fee_metric_type dynamic
                    enum, such

                    as 1 = filled quantity, 2 = filled amount, 9/10/11 = option-related, etc.; filtered
                    by

                    the selected billing item.


                    **Allowed values:**

                    - `1` - Transaction Quantity(Fractional support)

                    - `2` - Transaction Amount

                    - `3` - Single Billing By Corresponding granularity

                    - `4` - Options Quantity

                    - `5` - Upstream

                    - `6` - Number Of Billing Contracts

                    - `7` - Number Of Orders

                    - `8` - Number Of Transactions

                    - `9` - Value Of Positions

                    - `10` - Calculation Based On Existing Scenarios

                    - `11` - Market Value Of Securities Lending

                    - `13` - Transaction Quantity Of Board Lot (Transfer Warehouse)

                    - `14` - Market Value (Transfer Warehouse)

                    - `15` - Number of Ems Orders


                    Call `GET /v1/datasets/refs/billing_fee_metric_type` to retrieve the current data
                    dictionary, and use the returned entry''s `key` as this field''s value.'
