                  - '2'
                  - '3'
                  x-enum-details:
                  - value: '1'
                    label: Round
                  - value: '2'
                    label: Round Up
                  - value: '3'
                    label: Round Down
                cutoff_digits:
                  type: string
                  description: 'The number of rounding digits; the values come from the billing_cutoff_digit
                    dynamic

                    enum. Disabled when the rounding method is "Follow Scenario".


                    **Allowed values:** `0`, `1`, `2`, `3`'
                  enum:
