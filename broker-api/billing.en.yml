                  enum:
                  - '1'
                  - '2'
                  - '3'
                  - '4'
                  - '5'
                  x-enum-details:
                  - value: '1'
                    label: Flat Rate
                  - value: '2'
                    label: Tiered Rate Per Txn
                  - value: '3'
                    label: Monthly Tiered Rate
                  - value: '4'
                    label: Float Rate
                  - value: '5'
                    label: Float Rate (Per Txn)
                calculation_method:
                  type: string
                  description: 'The calculation method, derived from fee_rate_type: floating types (2,
                    7) are "2", and all others are "1".'
                fixed_rates:
                  type: array
                  description: 'Used for fixed rates. Each item has the form `{ fee_rate }`; the value
                    must be

                    non-negative and may have up to 10 decimal places.'
                  items:
                    type: string
                rates:
                  type: array
                  description: 'The final rate structure submitted, generated from

                    fixed_rates/single_rates/float_rates/month_rates according to fee_rate_type; each

