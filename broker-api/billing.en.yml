                    Candidate values come from the fee-package (customer-group) list returned by `GET
                    /v1/datasets/refs/billing_packages`; use the returned entry''s `key` as the value.'
                  x-value-source:
                    endpoint: GET /v1/datasets/refs/billing_packages
                allow_package_ids:
