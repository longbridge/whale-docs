      - lb_hk_charging.lb_hk_scene_update
      x-lbonly: false
      description: 'Creates a billing scenario (billing item). The configuration takes effect only after
        approval.

        Most field options depend on `biz_type`; use the per-business-type rules returned by

        `GET /billing/item_fields` as the source of truth for allowed values and defaults. Load `name_id`

        options from `GET /billing/billing_item_name` for the selected `biz_type`.


        ### Request parameters


        - Required: `biz_type` (Business Type), `name_id` (Fee Name ID), `basis_object` (Basis Object
        (structured)), `basis_type` (Basis Type), `basis` (Basis Value), `direction` (Fee Direction),
        `divisor` (Divisor), `metric_type` (Metric Type), `granularity` (Granularity), `cutoff_object`
        (Cutoff Object (structured)), `cutoff_method` (Cutoff Method), `cutoff_digits` (Cutoff Digits)

        - Optional: `metric_type_bill_amount_item_ids` (Secondary Bill Amount Item IDs), `benchmark_rate`
        (Benchmark Rate Formula)

        - See each field for its format, allowed values, default behavior, and business meaning.


        ### Result


        On success, the endpoint completes the described business operation. See the `200` response schema
        for returned data.'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - biz_type
              - name_id
              - basis_object
              - basis_type
              - basis
              - direction
              - divisor
              - metric_type
              - granularity
              - cutoff_object
              - cutoff_method
              - cutoff_digits
              properties:
                biz_type:
                  type: string
                  description: 'Value from the `billing_business_type_all` reference data. It determines
                    dependent

                    options such as billing method and billing party.


                    Call `GET /v1/datasets/refs/billing_business_type_all` to retrieve the current data
                    dictionary, and use the returned entry''s `key` as this field''s value.'
                  x-value-source:
                    endpoint: GET /v1/datasets/refs/billing_business_type_all
                name_id:
                  type: string
                  description: 'Load options from the `names` list returned by

                    `GET /billing/billing_item_name?biz_type=<biz_type>` for the selected `biz_type`.'
                  x-value-source:
                    endpoint: GET /billing/billing_item_name
                basis_object:
                  type: object
                  description: 'Structured object in the form `{ basis_type, basis }`. See `x-enum-details`
                    for the

                    `basis_type` values (market, currency, or instrument). For `basis`, use

                    `global_market` reference data for markets, `tenant_currencies_by_channel` reference

                    data for currencies, or free text for instruments.


                    **Allowed values:**

                    - `1` - Market

                    - `2` - Currency

                    - `3` - Counter ID'
                  enum:
                  - '1'
                  - '2'
