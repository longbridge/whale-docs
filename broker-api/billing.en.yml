                min_metric_type:
                  type: string
                  description: Expanded from min_metric.min_metric_type.
                min_metric_rate:
                  type: string
                  description: Expanded from min_metric.min_metric_rate.
                cutoff_method:
                  type: string
                  description: 'Rounding method; value comes from the billing_fee_cutoff_method dynamic
                    enum.


                    **Allowed values:**

                    - `1` - Round

                    - `2` - Round Up

                    - `3` - Round Down


                    Call `GET /v1/datasets/refs/billing_fee_cutoff_method` to retrieve the current data
                    dictionary, and use the returned entry''s `key` as this field''s value.'
                  enum:
