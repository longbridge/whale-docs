                max:
                  type: string
                  description: A numeric string, default 999999999.
                max_metric:
                  type: object
                  description: 'Maximum-ratio limit object { max_metric_type, max_metric_rate }, shown
                    only under

                    specific measurement-type / business-type combinations.'
                max_metric_type:
                  type: string
                  description: 'Specifies Max Metric Type.


                    **Allowed values:**

                    - `0` - Disabled

                    - `1` - Enabled'
                  enum:
                  - '0'
                  - '1'
                  x-enum-details:
                  - value: '0'
                    label: Disabled
                  - value: '1'
                    label: Enabled
                max_metric_rate:
                  type: string
                  description: 'The rate value when the maximum ratio limit is enabled; multiplied by
                    100 for display

                    and divided by 100 to restore it upon submission.'
                granularity:
                  type: string
                  description: 'Billing granularity; value comes from the billing_fee_granularity dynamic
                    enum, shown

                    only in scenarios such as filled quantity / filled amount.


                    **Allowed values:**

                    - `1` - Contract

                    - `2` - Order

                    - `3` - Trade_done

                    - `4` - Ems_order


                    Call `GET /v1/datasets/refs/billing_fee_granularity` to retrieve the current data
                    dictionary, and use the returned entry''s `key` as this field''s value.'
                  enum:
                  - '1'
                  - '2'
                  - '3'
                  - '4'
                  x-enum-details:
                  - value: '1'
                    label: Contract
                  - value: '2'
                    label: Order
                  - value: '3'
                    label: Trade_done
                  - value: '4'
                    label: Ems_order
                min_metric:
