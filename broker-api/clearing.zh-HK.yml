        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 組合業務過濾條件。省略某個過濾字段時，不按該字段篩選。
                  properties:
                    ledger_date:
                      type: string
                      format: date
                      description: 用於按「執行日期」篩選結果。
                    task_code:
                      type: string
                      description: |-
                        用於按「任務名稱」篩選結果。

                        **可選值：**
                        - `opposite_trade_details` - 表示交易對賬（結算 VS 上手）
                        - `check_lending_settle_price_ready` - 表示存在融券結算價為 0 的標的
                        - `dawn_settlement_account_balance_changes` - 表示資金變動對賬（結算 VS 資產服務）
                        - `dawn_settlement_equity_holding_changes` - 表示持倉變動對賬（結算 VS 資產服務）
                        - `billing_outstandings` - 表示待交收合約對賬（結算 VS 計費）
                        - `clearing_custodian_efficient` - 表示同客戶、同標的跨子倉
                        - `clearing_custodian_equity_holdings` - 表示持倉對賬（結算&倉位）
                        - `clearing_lending_fee_rates` - 表示融券利率缺失檢查
                        - `billing_interests` - 表示待結算利息對賬（結算 VS 計費）
                        - `billing_interest_settlements` - 表示利息結算對賬（結算 VS 計費）
                        - `clearing_account_balance_outstandings` - 表示待交收資金對賬（結算 VS 計費）
                        - `clearing_equity_holding_outstandings` - 表示待交收持倉對賬（結算 VS 計費）
                        - `billing_lending_interests` - 表示待結算融券利息對賬（結算 VS 計費）
                        - `billing_lending_interest_settlements` - 表示融券利息結算對賬（結算 VS 計費）
                        - `billing_custodian_fee` - 表示待結算證券組合費對賬（結算 VS 計費）
                        - `billing_va_custodian_fee` - 表示待結算虛擬資產託管費對賬（結算 VS 計費）
                        - `extra_opposite_position_details` - 表示持倉對賬（按子倉）（結算 VS 上手）
                        - `extra_dawn_settlement_account_balances` - 表示日切後資金餘額對賬（結算 VS 資產服務）
                        - `extra_dawn_settlement_equity_holdings` - 表示日切後持倉餘額對賬（結算 VS 資產服務）
                        - `trade_reconciliation_after_billing` - 表示計費後交易對賬（流水管理 VS 結算）
                        - `clearing_reconciliation_of_holding` - 表示持倉對賬（結算當日 VS 上日 + 變動 ）
                        - `clearing_reconciliation_of_balance` - 表示資金餘額檢查（結算當日 VS 上日 + 變動）
                        - `billing_va_custodian_fee_settlements` - 表示虛擬資產託管費結算對賬（結算 VS 計費）
                        - `billing_custodian_fee_settlements` - 表示證券組合費結算對賬（結算 VS 計費）
                        - `dawn_frozen_account_balance_changes` - 表示現金手工凍結對賬（結算 VS 資產服務）
                        - `dawn_frozen_equity_holding_changes` - 表示持倉手工凍結對賬（結算 VS 資產服務）
                        - `clearing_lending_equity_holding` - 表示融券數量檢查（融券數量 VS 空倉持倉）
                        - `clearing_option_exercise` - 表示行權交易對賬（結算 VS RMS）
