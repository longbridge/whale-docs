      tags:
        - 清算管理
      x-permission-key:
        - lb_hk_charging.lb_hk_userbill_remark
      x-lbonly: false
      description: |-
        編輯費用記錄備註。

        ### 請求參數

        - 必填：`id`（記錄ID）、`remark`（備註）
        - 各字段的格式、取值範圍和業務含義見對應字段說明。

        ### 處理結果

        成功時完成上述業務操作；後續狀態和返回數據以 `200` 響應定義為準。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
                - remark
              properties:
                id:
                  type: string
                  description: |-
                    記錄ID，用於標識本次請求關聯的業務對象。此字段為必填項。
                remark:
                  type: string
                  description: |-
                    隨本次操作保存的備註。此字段為必填項。
            example:
              id: "123"
              remark: ""
      responses:
        "200":
          description: |-
            請求處理成功。響應的 `data` 不包含額外業務字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。

                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`
                      判斷具體結果。

                      - `401`：未登錄。
                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。
                    x-enum-details:
                      - value: 0
                        label: 成功
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}

        "400":
          description: |-
            請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
