                            created_at:
                              type: string
                              description: '**返回值：** 開始時間；時間或日期格式以接口實際返回值為準。'
                            updated_at:
                              type: string
                              description: '**返回值：** 結束時間；時間或日期格式以接口實際返回值為準。'
                            remark:
                              type: string
                              description: '**返回值：** 備註。'
                      total:
                        type: integer
                        description: '**返回值：** 符合查詢條件的記錄總數，用於計算分頁。'
              example:
                code: 0
