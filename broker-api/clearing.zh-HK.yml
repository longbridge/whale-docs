      description: |-
        查询「待收费合约下的成交记录」数据，可通过 `filters` 组合业务筛选条件，并使用 `page`、`page_size` 控制分页。

        ### 返回结果

        成功时返回匹配的记录列表及分页信息。各过滤字段的用途、可选值和动态数据来源见对应字段说明。
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 組合業務過濾條件。省略某個過濾字段時，不按該字段篩選。
                  properties:
                    contract_id:
                      type: string
                      description: 用於按「合約 ID」篩選結果。
                page:
                  type: integer
                  description: 要查詢的頁碼，從 `1` 開始。
                page_size:
                  type: integer
                  description: 每頁返回的記錄數量。
            example:
              filters: {}
              page: 1
              page_size: 20
      responses:
        '200':
          description: 成功時分頁返回「待收費合約下的成交記錄」記錄，以及頁碼、每頁數量和總記錄數等分頁信息。
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - data
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。

                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`
                      判斷具體結果。

                      - `401`：未登錄。
                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。
                    x-enum-details:
                    - value: 0
                      label: 成功
                  message:
                    type: string
                  data:
                    type: object
                    required:
                    - list
                    - total
                    properties:
                      list:
                        type: array
                        description: '**返回值：** 符合查詢條件的記錄列表。'
                        items:
                          type: object
                          properties:
                            order_id:
                              type: string
                              description: '**返回值：** 前台訂單號。'
                            backend_order_seq:
                              type: string
                              description: '**返回值：** 訂單號。'
                            his_id:
                              type: string
                              description: '**返回值：** 前台成交流水號。'
                            backend_order_his_seq:
                              type: string
                              description: '**返回值：** 成交流水號。'
                            quantity:
                              type: string
                              description: '**返回值：** 交易數量。'
                            amount:
                              type: string
                              description: '**返回值：** 交易金額 (交易幣種)。'
                            unexpected_upstream_return_fee:
                              type: string
                              description: '**返回值：** 上游回報費用 (交易幣種)。'
                            ibond_interest:
                              type: string
                              description: '**返回值：** 累計利息 (交易幣種)。'
                            price:
                              type: string
                              description: '**返回值：** 價格。'
                            per_value:
                              type: string
                              description: '**返回值：** 面值。'
                      total:
                        type: integer
                        description: '**返回值：** 符合查詢條件的記錄總數，用於計算分頁。'
              example:
