      tags:
      - 清算管理
      x-permission-key:
      - lb_hk_clearing.clearing_busin_step_exec
      x-lbonly: false
      description: |-
        觸發當前賬務日的全流程日終清算任務。涉及全市場日終結算，請謹慎操作。

        ### 請求參數

        - 必填：`busin_no`（業務流程編號）、`steps`（待執行步驟列表）
        - 可選：`audit_frontend_resource`（调用方審計信息）
        - 各字段的格式、取值範圍、默認行為和業務含義見對應字段說明。

        ### 處理結果

        成功時完成所述業務操作，具體返回內容見 `200` 響應定義。
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - busin_no
              - steps
              properties:
                busin_no:
                  type: integer
                  description: 當前選中的業務流程對應的業務流程編號
                steps:
                  type: array
                  description: |-
                    當前流程下所有待執行的清算步驟，每項包含
                    step_id(number)、ledger_date(string，賬務日)、method(string，清算方法名)、params(string， 該步驟參數的
                    JSON 序列化字符串，通常在原始參數基礎上補充 step_id 與 ledger_date)
                  items:
                    type: string
                audit_frontend_resource:
                  type: object
                  description: 審計留痕字段，非業務參數，包含 $behavior(操作描述)、$action(固定為 add)、busin_no、ledger_date
            example:
              busin_no: 101
              steps:
              - step_id: 1001
                ledger_date: 2026-07-10
                method: PortfolioClearing.CalcPosition
                params: '{"step_id":1001,"ledger_date":"2026-07-10"}'
              audit_frontend_resource:
                $behavior: 一鍵清算
                $action: add
                busin_no: 101
                ledger_date: 2026-07-10
      responses:
        '200':
