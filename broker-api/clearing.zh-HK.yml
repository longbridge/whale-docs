openapi: 3.1.1
info:
  title: Longport Whale 券商 API
  description: 面向使用 Longport Whale 的券商提供機構級服務端 API。
  version: 2.0.0
servers:
  - url: https://b-api.longbridge.xyz
    description: 測試環境
  - url: https://b-api.lbkrs.com
    description: 生產環境
security:
  - bearerAuth: []
tags:
  - name: 資產賬户
  - name: 款項管理
  - name: 證券管理
  - name: 新股認購
  - name: 基金管理
  - name: 虛擬資產管理
  - name: 清算管理
  - name: 公司行動
  - name: 風控管理
  - name: 報表管理
  - name: 經紀人管理
  - name: 會計中台
  - name: 交易面板
  - name: 公告管理
  - name: 業務參數設置
  - name: 可疑事件監控
  - name: 活動
  - name: 獎勵中心
  - name: 其他
paths:
  /v1/datasets/booking_revise_select_contracts:
    get:
      operationId: booking_revise_select_contracts
      summary: 交收流水
      x-verified: verified
      tags:
        - 清算管理
      x-permission-key:
        - lb_hk_clearing.contract_revise
      x-lbonly: false
      description: |-
        查詢「交收流水」數據，可通過 `filters` 組合業務篩選條件，並使用 `page` 和 `page_size` 控制分頁。

        ### 返回結果

        成功時返回匹配的記錄列表及分頁信息。各過濾字段的用途、可選值和動態數據來源見對應字段說明。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: |-
                    組合業務過濾條件。省略某個過濾字段時，不按該字段篩選。
                  properties:
                    "no":
                      type: string
                      description: |-
                        用於按「合約號」篩選結果。
                    datasource:
                      type: string
                      description: |-
                        用於按「數據來源」篩選結果。

                        **可選值：**
                        - `1` - 表示交易
                        - `2` - 表示股票卡
                        - `3` - 表示股票卡（公司賬戶）
                        - `4` - 表示後台
                        - `5` - 表示合約取消（衝正）
                        - `6` - 表示合約取消（新合約）
                        - `7` - 表示 WTT 補歷史單
                        - `8` - 表示上游文件
                      enum:
                        - "1"
                        - "2"
                        - "3"
                        - "4"
                        - "5"
                        - "6"
                        - "7"
                        - "8"
                      x-enum-details:
                        - value: "1"
                          label: 交易
                        - value: "2"
                          label: 股票卡
                        - value: "3"
                          label: 股票卡（公司賬戶）
                        - value: "4"
                          label: 後台
                        - value: "5"
                          label: 合約取消（衝正）
                        - value: "6"
                          label: 合約取消（新合約）
                        - value: "7"
                          label: WTT 補歷史單
                        - value: "8"
                          label: 上游文件
                    aaid:
                      type: string
                      description: |-
                        用於按「客戶」篩選結果。
                    trade_ledger_date:
                      type: object
                      description: |-
                        用於按「賬務日期」篩選結果。
                      properties:
                        gte:
                          type: string
                          format: date
                          description: |-
                            篩選範圍的下限，匹配值包含該值。
                        lte:
                          type: string
                          format: date
                          description: |-
                            篩選範圍的上限，匹配值包含該值。
                    contract.trade_date:
                      type: object
                      description: |-
                        用於按「交易日期」篩選結果。
                      properties:
                        gte:
                          type: string
                          format: date
                          description: |-
                            篩選範圍的下限，匹配值包含該值。
                        lte:
                          type: string
                          format: date
                          description: |-
                            篩選範圍的上限，匹配值包含該值。
                    expected_balance_settlement_date:
                      type: object
                      description: |-
                        用於按「錢交收日」篩選結果。
                      properties:
                        gte:
                          type: string
                          format: date
                          description: |-
                            篩選範圍的下限，匹配值包含該值。
                        lte:
                          type: string
                          format: date
                          description: |-
                            篩選範圍的上限，匹配值包含該值。
                    market:
                      type: string
                      description: |-
                        用於按「市場」篩選結果。

                        候選值會動態變化。請調用 `GET /v1/datasets/refs/clearing_config_markets` 獲取當前可用的數據字典，並使用返回項的 `key` 作為本參數值。
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/clearing_config_markets
                    counter_id:
                      type: string
                      description: |-
                        用於按「證券代碼」篩選結果。
                    state:
                      type: string
                      description: |-
                        用於按「狀態」篩選結果。

                        **可選值：**
                        - `2` - 表示待計費
                        - `3` - 表示待收費
                        - `4` - 表示待交收
                        - `5` - 表示交收完成
                        - `6` - 表示券已交收
                        - `1` - 表示初始化
                        - `-1` - 表示--
                      enum:
                        - "2"
                        - "3"
                        - "4"
                        - "5"
                        - "6"
                        - "1"
                        - "-1"
                      x-enum-details:
                        - value: "2"
                          label: 待計費
                        - value: "3"
                          label: 待收費
                        - value: "4"
                          label: 待交收
                        - value: "5"
                          label: 交收完成
                        - value: "6"
                          label: 券已交收
                        - value: "1"
                          label: 初始化
                        - value: "-1"
                          label: "--"
                    settlement_channel:
                      type: string
                      description: |-
                        用於按「結算渠道」篩選結果。

                        候選值會動態變化。請調用 `GET /v1/datasets/refs/billing_settlement_channel` 獲取當前可用的數據字典，並使用返回項的 `key` 作為本參數值。
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/billing_settlement_channel
                    direction:
                      type: string
                      description: |-
                        用於按「方向」篩選結果。

                        **可選值：**
                        - `1` - 表示買
                        - `2` - 表示賣
                      enum:
                        - "1"
                        - "2"
                      x-enum-details:
                        - value: "1"
                          label: 買
                        - value: "2"
                          label: 賣
                    task_no:
                      type: string
                      description: |-
                        用於按「交收批次號」篩選結果。
                    currency:
                      type: string
                      description: |-
                        用於按「幣種」篩選結果。

                        候選值會動態變化。請調用 `GET /v1/datasets/refs/tenant_currencies` 獲取當前可用的數據字典，並使用返回項的 `key` 作為本參數值。
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/tenant_currencies
                    contract.biz_type:
                      type: string
                      description: |-
                        用於按「業務類型」篩選結果。

                        候選值會動態變化。請調用 `GET /v1/datasets/refs/billing_business_type` 獲取當前可用的數據字典，並使用返回項的 `key` 作為本參數值。
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/billing_business_type
                    trade_ledger_date_ne:
                      type: string
                      description: |-
                        用於按「trade_ledger_date_ne」篩選結果。
                page:
                  type: integer
                  description: |-
                    要查詢的頁碼，從 `1` 開始。
                page_size:
                  type: integer
                  description: |-
                    每頁返回的記錄數量。
            example:
              filters: {}
              page: 1
              page_size: 20
      responses:
        "200":
          description: |-
            成功時分頁返回「交收流水」記錄，以及頁碼、每頁數量和總記錄數等分頁信息。
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。

                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`
                      判斷具體結果。

                      - `401`：未登錄。
                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。
                    x-enum-details:
                      - value: 0
                        label: 成功
                  message:
                    type: string
                  data:
                    type: object
                    required:
                      - list
                      - total
                    properties:
                      list:
                        type: array
                        description: |-
                          **返回值：** 列表列表。
                        items:
                          type: object
                          properties:
                            trade_ledger_date:
                              type: string
                              description: |-
                                **返回值：** 賬務日期；時間或日期格式以接口實際返回值為準。
                            trade_date:
                              type: string
                              description: |-
                                **返回值：** 交易日期；時間或日期格式以接口實際返回值為準。
                            datasource:
                              type: string
                              description: |-
                                **返回值：** 創建方式。
                            datasource_val:
                              type: string
                              description: |-
                                字段 datasource 的原始值：datasource 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            "no":
                              type: string
                              description: |-
                                **返回值：** 合約號。
                            aaid:
                              type: string
                              description: |-
                                **返回值：** 證券賬號。
                            aaid_val:
                              type: string
                              description: |-
                                字段 aaid 的原始值：aaid 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            market:
                              type: string
                              description: |-
                                **返回值：** 市場。
                            position:
                              type: string
                              description: |-
                                **返回值：** 長短倉。
                            settlement_account:
                              type: string
                              description: |-
                                **返回值：** 大賬號。
                            counter_id:
                              type: string
                              description: |-
                                **返回值：** 證券代碼。
                            direction:
                              type: string
                              description: |-
                                **返回值：** 交易方向。
                            direction_val:
                              type: string
                              description: |-
                                字段 direction 的原始值：direction 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            trade_quantity:
                              type: string
                              description: |-
                                **返回值：** 交易數量。
                            currency:
                              type: string
                              description: |-
                                **返回值：** 幣種。
                            trade_amount:
                              type: string
                              description: |-
                                **返回值：** 交易金額。
                            ibond_amount:
                              type: string
                              description: |-
                                **返回值：** 累計利息。
                            receivable_amount:
                              type: string
                              description: |-
                                **返回值：** 應收費用。
                            deduction_amount:
                              type: string
                              description: |-
                                **返回值：** 抵扣金額。
                            bill_amount:
                              type: string
                              description: |-
                                **返回值：** 實收費用。
                            calculate_out_amount:
                              type: string
                              description: |-
                                **返回值：** 計費金額。
                            policy_version:
                              type: string
                              description: |-
                                **返回值：** 計費版本號。
                            expected_balance_settlement_date:
                              type: string
                              description: |-
                                **返回值：** 錢交收日；時間或日期格式以接口實際返回值為準。
                            expected_equity_settlement_date:
                              type: string
                              description: |-
                                **返回值：** 貨交收日；時間或日期格式以接口實際返回值為準。
                            state:
                              type: string
                              description: |-
                                **返回值：** 狀態。
                            state_val:
                              type: string
                              description: |-
                                字段 state 的原始值：state 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            settled_at:
                              type: string
                              description: |-
                                **返回值：** 實際交收時間；時間或日期格式以接口實際返回值為準。
                            biz_type:
                              type: string
                              description: |-
                                **返回值：** 業務類型。
                            biz_type_val:
                              type: string
                              description: |-
                                字段 biz_type 的原始值：biz_type 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            settlement_channel:
                              type: string
                              description: |-
                                **返回值：** 結算渠道。
                            settlement_channel_val:
                              type: string
                              description: |-
                                字段 settlement_channel 的原始值：settlement_channel 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            stage:
                              type: string
                              description: |-
                                **返回值：** 交易階段。
                            stage_val:
                              type: string
                              description: |-
                                字段 stage 的原始值：stage 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            custodian_id:
                              type: string
                              description: |-
                                **返回值：** 代理商。
                            custodian_id_val:
                              type: string
                              description: |-
                                字段 custodian_id 的原始值：custodian_id 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            security_type:
                              type: string
                              description: |-
                                **返回值：** 標的類型。
                            security_type_val:
                              type: string
                              description: |-
                                字段 security_type 的原始值：security_type 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            security_category:
                              type: string
                              description: |-
                                **返回值：** 標的子類型。
                            security_category_val:
                              type: string
                              description: |-
                                字段 security_category 的原始值：security_category 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            account_region:
                              type: string
                              description: |-
                                **返回值：** 客戶地區。
                            account_region_val:
                              type: string
                              description: |-
                                字段 account_region 的原始值：account_region 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            account_location:
                              type: string
                              description: |-
                                **返回值：** 客戶地址。
                            account_location_val:
                              type: string
                              description: |-
                                字段 account_location 的原始值：account_location 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            offset_contract_no:
                              type: string
                              description: |-
                                **返回值：** 衝正合約號。
                            new_contract_no:
                              type: string
                              description: |-
                                **返回值：** 新合約號。
                            origin_contract_no:
                              type: string
                              description: |-
                                **返回值：** 舊合約號。
                            currency_setl:
                              type: string
                              description: |-
                                **返回值：** 結算幣種。
                            trade_to_setl_exchange_rate:
                              type: string
                              description: |-
                                **返回值：** 匯率。
                            contract_id:
                              type: string
                              description: |-
                                **返回值：** 合約編號。
                            admin_id:
                              type: string
                              description: |-
                                **返回值：** 最近更新人。
                            admin_id_val:
                              type: string
                              description: |-
                                字段 admin_id 的原始值：admin_id 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            created_at:
                              type: string
                              description: |-
                                **返回值：** 創建時間；時間或日期格式以接口實際返回值為準。
                            updated_at:
                              type: string
                              description: |-
                                **返回值：** 最後更新時間；時間或日期格式以接口實際返回值為準。
                            open_close:
                              type: string
                              description: |-
                                **返回值：** 開倉/平倉。
                      total:
                        type: integer
                        description: |-
                          **返回值：** 符合查詢條件的記錄總數，用於計算分頁。
              example:
                code: 0
                message: success
                data:
                  list:
                    - trade_ledger_date: "20260714"
                      trade_date: 2026-07-14
                      datasource: Trade
                      datasource_val: "1"
                      "no": OS2026071610152
                      aaid: H00000000
                      aaid_val: "10000000"
                      market: SH
                      position: LONG
                      settlement_account: ""
                      counter_id: ST/SH/600519
                      direction: Buy
                      direction_val: "1"
                      trade_quantity: "500"
                      currency: CNH
                      trade_amount: "609,950"
                      ibond_amount: ""
                      receivable_amount: "60,422.53"
                      deduction_amount: "0"
                      bill_amount: "60,422.53"
                      calculate_out_amount: "60,422.53"
                      policy_version: "699735"
                      expected_balance_settlement_date: 2026-07-15
                      expected_equity_settlement_date: 2026-07-14
                      state: Equity settled
                      state_val: "6"
                      settled_at: ""
                      biz_type: Stock Trade
                      biz_type_val: "1"
                      settlement_channel: "settlement_ex_hk & CCASS"
                      settlement_channel_val: "5"
                      stage: Normal
                      stage_val: "1"
                      custodian_id: "0"
                      custodian_id_val: "0"
                      security_type: Stock
                      security_type_val: ST
                      security_category: "0"
                      security_category_val: "0"
                      account_region: Hong Kong China
                      account_region_val: HK
                      account_location: ""
                      account_location_val: ""
                      offset_contract_no: ""
                      new_contract_no: ""
                      origin_contract_no: ""
                      currency_setl: CNH
                      trade_to_setl_exchange_rate: "1"
                      contract_id: "7935685"
                      admin_id: "--"
                      admin_id_val: "0"
                      created_at: "1784185008"
                      updated_at: "1784185008"
                      open_close: OPEN
                  total: 443

        "400":
          description: |-
            請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
        "401":
          description: |-
            未登錄或登錄狀態已失效。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
        "403":
          description: |-
            當前賬號未獲得該功能授權。請在 User Permission 中為該賬號開通相應權限。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
        "408":
          description: |-
            請求處理超時。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
      x-mint:
        href: /zh-HK/api-reference/booking_revise_select_contracts
        metadata:
          sidebarTitle: 交收流水
      x-post-fallback: true
  /v1/datasets/booking_stock_exchange_contract_revises:
    get:
      operationId: booking_stock_exchange_contract_revises
      summary: 合約修正列表
      x-verified: verified
      tags:
        - 清算管理
      x-permission-key:
        - lb_hk_clearing.contract_revise
      x-lbonly: false
      description: |-
        查詢「合約修正列表」數據，可通過 `filters` 組合業務篩選條件，並使用 `page` 和 `page_size` 控制分頁。

        ### 返回結果

