        ### 返回結果

        成功時返回匹配的記錄列表及分頁信息。各過濾字段的用途、可選值和動態數據來源見對應字段說明。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: |-
                    組合業務過濾條件。省略某個過濾字段時，不按該字段篩選。
                  properties:
                    updated_at:
                      type: object
                      description: |-
                        用於按「更新時間」篩選結果。
                      properties:
                        gte:
                          type: string
                          format: date
                          description: |-
                            篩選範圍的下限，匹配值包含該值。
                        lte:
                          type: string
                          format: date
                          description: |-
                            篩選範圍的上限，匹配值包含該值。
                    biz_type:
                      type: string
                      description: |-
                        用於按「業務類型」篩選結果。

                        候選值會動態變化。請調用 `GET /v1/datasets/refs/billing_business_type` 獲取當前可用的數據字典，並使用返回項的 `key` 作為本參數值。
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/billing_business_type
                    name_id:
                      type: string
                      description: |-
                        用於按「收費類型」篩選結果。

                        候選值會動態變化。請調用 `GET /v1/datasets/refs/billing_item_names` 獲取當前可用的數據字典，並使用返回項的 `key` 作為本參數值。
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/billing_item_names
                    currency:
                      type: string
                      description: |-
                        用於按「收費幣種」篩選結果。

                        候選值會動態變化。請調用 `GET /v1/datasets/refs/tenant_currencies` 獲取當前可用的數據字典，並使用返回項的 `key` 作為本參數值。
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/tenant_currencies
                page:
                  type: integer
                  description: |-
                    要查詢的頁碼，從 `1` 開始。
                page_size:
                  type: integer
                  description: |-
                    每頁返回的記錄數量。
            example:
              filters:
                updated_at: 20260614-20260714
              page: 1
              page_size: 20
      responses:
        "200":
          description: |-
            成功時分頁返回「成本賬單」記錄，以及頁碼、每頁數量和總記錄數等分頁信息。
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。

                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`
                      判斷具體結果。

                      - `401`：未登錄。
                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。
                    x-enum-details:
                      - value: 0
                        label: 成功
                  message:
                    type: string
                  data:
                    type: object
                    required:
                      - list
                      - total
                    properties:
                      list:
                        type: array
                        description: |-
                          **返回值：** 列表列表。
                        items:
                          type: object
                          properties:
                            biz_type:
                              type: string
                              description: |-
                                **返回值：** 業務類型。
                            biz_type_val:
                              type: string
                              description: |-
                                字段 biz_type 的原始值：biz_type 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            name_zh:
                              type: string
                              description: |-
                                **返回值：** 收費類型。
                            fee_rate_currency:
                              type: string
                              description: |-
                                **返回值：** 費率幣種。
                            bill_currency:
                              type: string
                              description: |-
                                **返回值：** 收費幣種。
                            metric:
                              type: string
                              description: |-
                                **返回值：** 訂單金額。
                            money_flow_direction:
                              type: string
                              description: |-
                                **返回值：** 資金流向。
                            money_flow_direction_val:
                              type: string
                              description: |-
                                字段 money_flow_direction 的原始值：money_flow_direction 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            amount:
                              type: string
                              description: |-
                                **返回值：** 成本。
                            remark:
                              type: string
                              description: |-
                                **返回值：** 手工備註。
                            updated_at:
                              type: string
                              description: |-
                                **返回值：** 更新時間；時間或日期格式以接口實際返回值為準。
                      total:
                        type: integer
                        description: |-
                          **返回值：** 符合查詢條件的記錄總數，用於計算分頁。
              example:
                code: 0
                message: success
                data:
                  list:
                    - biz_type: string
                      biz_type_val: string
                      name_zh: string
                      fee_rate_currency: string
                      bill_currency: string
                      metric: string
                      money_flow_direction: string
                      money_flow_direction_val: string
                      amount: string
                      remark: string
                      updated_at: string
                  total: 1

