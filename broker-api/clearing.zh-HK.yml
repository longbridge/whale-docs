      - lb_hk_clearing.statement_customer_remark
      x-lbonly: false
      description: |-
        修改指定客戶某份結單的已有客戶備註。

        ### 請求參數

        - 必填：`aaid`（客戶資產賬號）、`file_type`（結單文件類型）、`dt`（日期）、`remark`（備註內容）、`action_in`（操作類型）
        - 可選：`account_no`（賬戶號）、`front_payload`（變更差異載荷）、`audit_frontend_resource`（調用方提交的審計日誌載荷）
        - 各字段的格式、取值範圍和業務含義見對應字段說明。

        ### 業務說明

        對唯一定位到的一份結單（由 `aaid`、`file_type`、`dt` 共同確定）覆蓋更新其客戶備註內容。編輯時 `action_in` 固定傳 `3`。

        `dt` 的粒度隨 `file_type` 變化：月結單（`file_type=1`）按 `YYYYMM` 提交，其餘按 `YYYYMMDD` 提交。

        ### 處理結果

        成功時完成上述業務操作；後續狀態和返回數據以 `200` 響應定義為準。
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - aaid
              - file_type
              - dt
              - remark
              - action_in
              properties:
                aaid:
                  type: string
                  description: 用於指定「客戶資產賬號」。此字段為必填項。
                  example: H00000000
                account_no:
                  type: string
                  description: 用於指定「賬戶號」。不傳時按 `aaid` 定位客戶。
                file_type:
                  type: string
                  enum:
                  - '0'
                  - '1'
                  - '2'
                  description: 結單文件類型。此字段為必填項。
                  x-enum-details:
                  - value: '0'
                    hk: 日結單
                    label: 日結單
                  - value: '1'
                    hk: 月結單
                    label: 月結單
                  - value: '2'
                    hk: 臨時結單
                    label: 臨時結單
                  example: '0'
                dt:
                  type: string
                  description: 結單所屬日期。月結單（`file_type=1`）按 `YYYYMM` 提交，其餘類型按 `YYYYMMDD` 提交。此字段為必填項。
                  example: '20260101'
                remark:
                  type: string
                  description: 更新後的客戶備註文本內容。此字段為必填項。
                  example: 已复核，客户无异议
                action_in:
                  type: string
                  enum:
                  - '1'
                  - '2'
                  - '3'
                  description: 本次請求要執行的操作類型。編輯備註固定傳 `3`。此字段為必填項。
                  x-enum-details:
                  - value: '1'
                    hk: 新增
                    label: 新增
                  - value: '2'
                    hk: 刪除
                    label: 刪除
                  - value: '3'
                    hk: 編輯
                    label: 編輯
                  example: '3'
                front_payload:
                  type: object
                  description: '僅編輯時攜帶，`{ type: ''data_diff'', data: <改前/改後差異> }`，用於後端審批展示'
                audit_frontend_resource:
                  type: object
                  description: 審計留痕字段，記錄操作前後差異，非業務參數
            example:
              aaid: H00000000
              file_type: '0'
              dt: '20260101'
              remark: 已复核，客户无异议
              action_in: '3'
              front_payload:
                type: data_diff
                data: []
      responses:
        '200':
          description: 請求處理成功。響應的 `data` 不包含額外業務字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 為業務錯誤碼,此時 `data` 通常為空。

                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code` 判斷具體結果。

                      - `401`：未登錄。
                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。
                    x-enum-details:
                    - value: 0
                      label: 成功
                  message:
                    type: string
                  data:
                    type: object
                    description: "成功時 `data` 為空對象。"
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登錄或登錄狀態已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 當前賬號未獲得該功能授權。請在 User Permission 中為該賬號開通相應權限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 請求處理超時。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
      x-mint:
        href: /zh-HK/api-reference/update_statement_remark
        metadata:
          sidebarTitle: 編輯結單客戶備註
