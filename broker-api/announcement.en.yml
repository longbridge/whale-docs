  /v1/announcement:
    get:
      operationId: get_announcement
      summary: Announcement Detail
      tags:
      - Announcement
      x-permission-key:
      - lb_hk_app.announcements
      - stock.market_holiday
      x-lbonly: false
      description: 'Retrieves the full configuration of a single announcement by its ID, used to populate
        an edit form or display announcement details.


        ### Request parameters


        - Required: `id` (announcement ID), passed as the query string parameter `?id=`.


        ### Response


        On success, returns the complete configuration object for the announcement, including its title,
        content, display channels, effective time, user scope, and status. Multi-language fields such
        as `title` and `description` are returned as JSON strings and must be parsed by the caller.'
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: query
        required: true
        description: Unique identifier of the announcement to retrieve.
        schema:
          type: integer
        example: 76390
      responses:
        '200':
          description: On success, returns the complete configuration object for the announcement.
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - data
                properties:
                  code:
                    type: integer
                    description: "`0` indicates success. A non-zero value is a business error code, in\
                      \ which case\n`data` is usually empty.\n\nHTTP status codes use their standard semantics.\
                      \ A successful request normally\nreturns `200`; errors may return `400`, `401`,\
                      \ `403`, `408`, or another applicable\nstatus. Interpret the HTTP status together\
                      \ with the business `code`.\n\n- `401`: The user is not authenticated.\n- `403`:\
                      \ The current account is not authorized to use this function. Grant access\n  through\
                      \ User Permission."
                    x-enum-details:
                    - value: 0
                      label: Success
                  message:
                    type: string
                  data:
                    type: object
                    description: '**Returned value:** Complete configuration object for the announcement.'
                    properties:
                      announcement_type:
                        type: string
                        description: '**Returned value:** Announcement type.'
                      title:
                        type: string
                        description: '**Returned value:** Multi-language title, returned as a JSON string
                          keyed by language code such as `zh-CN`, `zh-HK`, and `en`.'
                      description:
                        type: string
                        description: '**Returned value:** Multi-language announcement content, returned
                          as a JSON string.'
                      rich_desc:
                        type: string
                        description: '**Returned value:** Multi-language rich-text content, returned as
                          a JSON string.'
                      channel:
                        type: object
                        description: '**Returned value:** Display channel configuration. A map from platform
                          keys such as `ios`, `android`, and `pc` to booleans indicating whether the announcement
                          shows on that channel. Version-gated channels additionally carry `<platform>_low`
                          and `<platform>_up` fields for the effective version range.'
                      closable:
                        type: boolean
                        description: '**Returned value:** Whether the user is allowed to manually dismiss
                          the announcement.'
                      conditions:
                        type: string
                        description: '**Returned value:** Display conditions for the announcement, returned
                          as a JSON string.'
                      user_scope:
                        type: object
                        description: '**Returned value:** Target user scope configuration, including the
                          account channel (`account_channel`), user cluster (`user_cluster`, `cluster_id`),
                          and organizations (`org_ids`).'
                      link:
                        type: string
                        description: '**Returned value:** Redirect link opened when the announcement is
                          clicked.'
                      button:
                        type: string
                        description: '**Returned value:** Multi-language button copy, returned as a JSON
                          string.'
                      priority:
                        type: integer
                        description: '**Returned value:** Announcement priority; a larger value means
                          higher priority.'
                      reason:
                        type: string
                        description: '**Returned value:** Reason for publishing or changing the announcement.'
                      show_begin:
                        type: string
                        description: '**Returned value:** Time when the announcement starts showing, as
                          a Unix timestamp in seconds.'
                      show_end:
                        type: string
                        description: '**Returned value:** Time when the announcement stops showing, as
                          a Unix timestamp in seconds.'
                      status:
                        type: integer
                        description: '**Returned value:** Announcement status.'
              example:
                code: 0
                message: success
                data:
                  type: object
                  properties:
                    id:
                      type: string
                    title:
                      type: string
                    description:
                      type: string
                    priority:
                      type: integer
                    show_begin:
                      type: string
                    show_end:
                      type: string
                    conditions:
                      type: string
                    status:
                      type: integer
                    reason:
                      type: string
                    operator:
                      type: string
                    created_at:
                      type: string
                    updated_at:
                      type: string
                    announcement_type:
                      type: string
                    channel:
                      type: object
                      properties:
                        all:
                          type: boolean
                        h5:
                          type: boolean
                        pc:
                          type: boolean
                          description: "Pc"
                        web:
                          type: boolean
                        ios:
                          type: boolean
                        wxmini:
                          type: boolean
                        android:
                          type: boolean
                        ios_up:
                          type: string
                        ios_low:
                          type: string
                        android_up:
                          type: string
                        android_low:
                          type: string
                        pc_up:
                          type: string
                        pc_low:
                          type: string
                        port_ios:
                          type: boolean
                          description: "Port ios"
                        port_android:
                          type: boolean
                        port_ios_up:
                          type: string
                        port_ios_low:
                          type: string
                        port_android_up:
                          type: string
                        port_android_low:
                          type: string
                        port_pc:
                          type: boolean
                          description: "Port pc"
                        port_pc_up:
                          type: string
                        port_pc_low:
                          type: string
                    user_scope:
                      type: object
                      properties:
                        all:
                          type: boolean
                        account_channel:
                          type: boolean
                        account_channel_list:
                          type: array
                          items:
                            type: integer
                        user_cluster:
                          type: boolean
                        cluster_id:
                          type: string
                          description: "Cluster id"
                    link:
                      type: string
                    create_type:
                      type: integer
                    closable:
                      type: boolean
                      description: "Closable"
                    member_id:
                      type: string
                      description: "Member id"
        '400':
          description: Bad request. Check the business error code in `code` and the error details in `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: The user is not authenticated, or the login session has expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: The current account is not authorized to use this feature. Grant the required permission
            to the account in User Permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: The request timed out. Check the business error code in `code` and the error details
            in `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
  /v1/portfolio/atm/notice:
    post:
      operationId: notice_create
      summary: Create Deposit/Withdrawal Notice
      tags:
      - Announcement
      x-permission-key:
      - lb_hk_cash_in_out_notice.lb_hk_cash_in_out_notice_update
      x-lbonly: false
      description: 'Creates a deposit/withdrawal notice, configuring its type, display channels, effective
        time, target scope, and multi-language title and content.


        ### Request parameters


        - Required: `notice_type` (notice type), `title` (title), `description` (content).

        - `title`, `description`, and `confirm_button_label` are multi-language fields and must be passed
        as JSON strings keyed by language code.

        - `account_channel`, `region_ids`, and `region_bank_ids` are multi-value fields passed as comma-separated
        strings.

        - `show_begin` and `show_end` are Unix timestamps in seconds.

        - See each field for its format, allowed values, and business meaning.


        ### Result


        On success, the notice is created. See the `200` response schema for returned data and subsequent
        state information.'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - notice_type
              - title
              - description
              properties:
                notice_type:
                  type: string
                  description: 'Notice type. This field is required.


                    **Allowed values:**

                    - `1` - Deposit

                    - `2` - Withdrawal'
                  enum:
                  - '1'
                  - '2'
                  x-enum-details:
                  - value: '1'
                    label: Deposit
                  - value: '2'
                    label: Withdrawal
                  example: '1'
                title:
                  type: string
                  description: Multi-language title passed as a JSON string keyed by language code such
                    as `zh-CN`, `zh-HK`, and `en`. This field is required.
                  example: '{"zh-CN":"标题","en":"Title"}'
                description:
                  type: string
                  description: Multi-language notice content passed as a JSON string. This field is required.
                  example: '{"zh-CN":"内容","en":"Content"}'
                client_channel:
                  type: object
                  description: Display channel configuration. A map from channel keys to booleans indicating
                    whether the notice shows on that channel. Version-gated channels additionally carry
                    `<channel>_low` and `<channel>_up` fields for the effective version range.
                account_channel:
                  type: string
                  description: Account channels the notice applies to. Multiple values are passed as a
                    comma-separated string.
                  example: lb
                org_ids:
                  type: array
                  description: Target organization ID list. When omitted or empty, the notice applies
                    to all available organizations by default.
                  items:
                    type: string
                  example:
                  - '1'
                app_ids:
                  type: array
                  description: List of apps the notice reaches.
                  items:
                    type: string
                  example:
                  - longbridge
                region_ids:
                  type: string
                  description: Bank account regions. Multiple values are passed as a comma-separated string.
                  example: hk,sg
                region_bank_ids:
                  type: string
                  description: Bank names (bank IDs). Multiple values are passed as a comma-separated
                    string.
                bank_operation_types_id:
                  type: string
                  description: Deposit method.
                remark:
                  type: string
                  description: Remarks.
                show_begin:
                  type: integer
                  description: Time when the notice starts showing, as a Unix timestamp in seconds.
                  example: 1779544289
                show_end:
                  type: integer
                  description: Time when the notice stops showing, as a Unix timestamp in seconds.
                  example: 1779630695
                link:
                  type: string
                  description: Redirect link opened when the notice is clicked.
                client_display_way:
                  type: string
                  description: How the notice is displayed on the client.
                confirm_button_label:
                  type: string
                  description: Multi-language confirm button copy passed as a JSON string. Optional.
                  example: '{"zh-CN":"查看详情"}'
                priority:
                  type: integer
                  description: Notice priority; a larger value means higher priority.
                  example: 0
            example:
              notice_type: '1'
              title: '{"zh-CN":"标题","en":"Title"}'
              description: '{"zh-CN":"内容","en":"Content"}'
              client_channel:
                all: true
              account_channel: lb
              org_ids:
              - '1'
              app_ids:
              - longbridge
              region_ids: hk,sg
              region_bank_ids: ''
              bank_operation_types_id: '0'
              remark: ''
              show_begin: 1779544289
              show_end: 1779630695
              link: https://example.com
              client_display_way: '1'
              confirm_button_label: '{"zh-CN":"查看详情"}'
              priority: 0
      responses:
        '200':
          description: The request was processed successfully. The response `data` does not contain additional
            business fields.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: "`0` indicates success. A non-zero value is a business error code, in\
                      \ which case\n`data` is usually empty.\n\nHTTP status codes use their standard semantics.\
                      \ A successful request normally\nreturns `200`; errors may return `400`, `401`,\
                      \ `403`, `408`, or another applicable\nstatus. Interpret the HTTP status together\
                      \ with the business `code`.\n\n- `401`: The user is not authenticated.\n- `403`:\
                      \ The current account is not authorized to use this function. Grant access\n  through\
                      \ User Permission."
                    x-enum-details:
                    - value: 0
                      label: Success
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      ok:
                        type: boolean
                      id:
                        type: string
                      tip:
                        type: string
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: Bad request. Check the business error code in `code` and the error details in `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: The user is not authenticated, or the login session has expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: The current account is not authorized to use this feature. Grant the required permission
            to the account in User Permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: The request timed out. Check the business error code in `code` and the error details
            in `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
    put:
      operationId: notice_update
      summary: Update Deposit/Withdrawal Notice
      tags:
      - Announcement
      x-permission-key:
      - lb_hk_cash_in_out_notice.lb_hk_cash_in_out_notice_update
      x-lbonly: false
      description: 'Updates an existing deposit/withdrawal notice. The request body carries the target
        notice `id` at the top level, and all notice configuration fields are placed inside the `config`
        object.


        ### Request parameters


        - Required: `id` (notice ID), `config` (notice configuration object).

        - Fields inside `config` are identical to those of "Create Deposit/Withdrawal Notice"; `config.notice_type`,
        `config.title`, and `config.description` are required.

        - `config.title`, `config.description`, and `config.confirm_button_label` are multi-language fields
        passed as JSON strings.

        - `config.account_channel`, `config.region_ids`, and `config.region_bank_ids` are multi-value
        fields passed as comma-separated strings.

        - `config.show_begin` and `config.show_end` are Unix timestamps in seconds.

        - `audit_frontend_resource` is caller-provided audit context (before/after comparison data). Optional.


        ### Result


        On success, the notice is updated. See the `200` response schema for returned data and subsequent
        state information.'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              - config
              properties:
                id:
                  type: string
                  description: Unique identifier of the deposit/withdrawal notice to update. This field
                    is required.
                  example: '209'
                config:
                  type: object
                  description: Notice configuration object. Its fields are identical to those of "Create
                    Deposit/Withdrawal Notice". This field is required.
                  required:
                  - notice_type
                  - title
                  - description
                  properties:
                    notice_type:
                      type: string
                      description: 'Notice type. This field is required.


                        **Allowed values:**

                        - `1` - Deposit

                        - `2` - Withdrawal'
                      enum:
                      - '1'
                      - '2'
                      x-enum-details:
                      - value: '1'
                        label: Deposit
                      - value: '2'
                        label: Withdrawal
                      example: '1'
                    title:
                      type: string
                      description: Multi-language title passed as a JSON string keyed by language code
                        such as `zh-CN`, `zh-HK`, and `en`. This field is required.
                      example: '{"zh-CN":"标题","en":"Title"}'
                    description:
                      type: string
                      description: Multi-language notice content passed as a JSON string. This field is
                        required.
                      example: '{"zh-CN":"内容","en":"Content"}'
                    client_channel:
                      type: object
                      description: Display channel configuration. A map from channel keys to booleans
                        indicating whether the notice shows on that channel. Version-gated channels additionally
                        carry `<channel>_low` and `<channel>_up` fields for the effective version range.
                    account_channel:
                      type: string
                      description: Account channels the notice applies to. Multiple values are passed
                        as a comma-separated string.
                      example: lb
                    org_ids:
                      type: array
                      description: Target organization ID list. When omitted or empty, the notice applies
                        to all available organizations by default.
                      items:
                        type: string
                      example:
                      - '1'
                    app_ids:
                      type: array
