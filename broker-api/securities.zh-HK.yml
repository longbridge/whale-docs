                              description: 來源. **返回值：** 來源。
                            from_val:
                              type: string
                              description: 來源（原始值）. 字段 from 的原始值：from 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            member_id:
                              type: string
                              description: 客戶編號. **返回值：** 客戶編號。
                            member_id_val:
                              type: string
                              description: 客戶編號（原始值）. 字段 member_id 的原始值：member_id 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            app_task_id:
                              type: string
                              description: App 推送 ID. **返回值：** App 推送 ID。
                            email_task_id:
                              type: string
                              description: Email 推送 ID. **返回值：** Email 推送 ID。
                            updated_at:
                              type: string
                              description: 更新時間. **返回值：** 更新時間；時間或日期格式以接口實際返回值為準。
                            operator:
                              type: string
                              description: 操作人. **返回值：** 操作人。
                            created_at:
                              type: string
                              description: 提交時間. **返回值：** 提交時間；時間或日期格式以接口實際返回值為準。
                            process_day_count:
                              type: string
                              description: 處理天數. **返回值：** 處理天數。
                      total:
                        type: integer
                        description: 總條數. **返回值：** 符合查詢條件的記錄總數，用於計算分頁。
              example:
                code: 0
                message: success
                data:
                  list:
                    - id: '68971'
                      id_val: ''
                      support_manager_name: 楚然(高勇)
                      origin_id: H00000000
                      real_name: 示例用户
                      member_region: Hong Kong China
                      member_region_val: HK
                      broker_id: ' BOCI Securities Limited'
                      broker_id_val: '1'
