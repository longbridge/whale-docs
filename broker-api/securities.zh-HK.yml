                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 當前賬號未獲得該功能授權。請在 User Permission 中為該賬號開通相應權限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 請求處理超時。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
      x-dataset-download:
        method: POST
        path: /v1/datasets/atm_transfer_out_records/download
        operationId: atm_transfer_out_records_download
      x-mint:
        href: /zh-HK/api-reference/atm_transfer_out_records
        metadata:
          sidebarTitle: 取出申請
      x-post-fallback: true
  /v1/datasets/atm_transfer_out_stocks:
    get:
      operationId: atm_transfer_out_stocks
      summary: 取出明細
      tags:
        - 证券管理
      x-permission-key:
        - finance.transfer_out_record
      x-lbonly: false
      description: |-
        查詢「取出明細」數據，可通過 `filters` 組合業務篩選條件，並使用 `page`、`page_size` 和 `orderBy` 控制分頁與排序。

        ### 返回結果

        成功時返回匹配的記錄列表及分頁信息。各過濾字段的用途、可選值和動態數據來源見對應字段說明。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 過濾條件. 組合業務過濾條件。省略某個過濾字段時，不按該字段篩選。
                  properties:
                    transfer_id:
                      type: string
                      description: 申請編號. 用於按「申請編號」篩選結果。
                    id:
                      type: string
                      description: 取出證券明細編號. 用於按「取出證券明細編號」篩選結果。
                    is_reality:
                      type: string
                      description: |-
                        是否實物轉倉. 用於按「是否實物轉倉」篩選結果。

                        **可選值：**
                        - `0` - 表示否
                        - `1` - 表示是
                      enum:
                        - '0'
                        - '1'
                    state:
                      type: string
                      description: |-
                        轉出狀態. 用於按「轉出狀態」篩選結果。

                        支持多選；提交時使用英文逗號（`,`）拼接多個值。不傳時不按此字段篩選。

                        **可選值：**
                        - `0` - 表示初始化
                        - `1` - 表示成功
                        - `2` - 表示失敗
                        - `3` - 表示已刪除
                      example: 0,1
                      enum:
                        - '0'
                        - '1'
                        - '2'
                        - '3'
                    created_at:
                      type: object
                      description: 提交時間. 用於按「提交時間」篩選結果。
                      properties:
                        gte:
                          type: string
                          description: 大於等於. 篩選範圍的下限，匹配值包含該值。
                          format: date
                        lte:
                          type: string
                          description: 小於等於. 篩選範圍的上限，匹配值包含該值。
                          format: date
                    apply_state:
                      type: string
                      description: |-
                        審核狀態. 用於按「審核狀態」篩選結果。

                        支持多選；提交時使用英文逗號（`,`）拼接多個值。不傳時不按此字段篩選。

                        **可選值：**
                        - `0` - 表示初始
                        - `1` - 表示成功提交待審核
                        - `2` - 表示失敗提交待審核
                        - `3` - 表示修改待審核
                        - `6` - 表示刪除待審批
                      example: 0,1
                      enum:
                        - '0'
                        - '1'
                        - '2'
                        - '3'
                        - '6'
                    member_id:
                      type: string
                      description: 客戶編號. 用於按「客戶編號」篩選結果。
                    market:
                      type: string
                      description: |-
                        市場. 用於按「市場」篩選結果。

                        **可選值：** `US`、`HK`、`UK`、`SH`、`SZ`、`SG`、`KR`、`JP`、`AU`、`DE`、`CA`、`TH`、`ID`、`MY`、`TR`、`NA`、`OSL`、`HAS`、`EU`、`UT`、`GTMMF`
                      enum:
                        - US
                        - HK
                        - UK
                        - SH
                        - SZ
                        - SG
                        - KR
                        - JP
                        - AU
                        - DE
                        - CA
                        - TH
                        - ID
                        - MY
                        - TR
                        - NA
                        - OSL
                        - HAS
                        - EU
                        - UT
                        - GTMMF
                    counter_id:
                      type: string
                      description: 股票. 用於按「股票」篩選結果。
                    settled_at:
                      type: object
                      description: 出賬時間. 用於按「出賬時間」篩選結果。
                      properties:
                        gte:
                          type: string
                          description: 大於等於. 篩選範圍的下限，匹配值包含該值。
                          format: date
                        lte:
                          type: string
                          description: 小於等於. 篩選範圍的上限，匹配值包含該值。
                          format: date
                    cheat_state:
                      type: string
                      description: |-
                        風控狀態. 用於按「風控狀態」篩選結果。

                        **可選值：**
                        - `0` - 表示風控處理中
                        - `1` - 表示未命中
                        - `2` - 表示命中
                      enum:
                        - '0'
                        - '1'
                        - '2'
                    hit_rules:
                      type: string
                      description: |-
                        命中規則. 用於按「命中規則」篩選結果。

                        候選值會動態變化。請調用 `GET /v1/datasets/refs/risk_rule_indicators_transfer_out` 獲取當前可用的數據字典，並使用返回項的 `key` 作為本參數值。
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/risk_rule_indicators_transfer_out
                page:
                  type: integer
                  description: 頁碼. 要查詢的頁碼，從 `1` 開始。
                page_size:
                  type: integer
                  description: 每頁數量. 每頁返回的記錄數量。
                orderBy:
                  type: array
                  description: 排序參數. 排序規則數組；每一項定義一個排序字段及排序方向。
                  items:
                    type: object
            example:
              filters: {}
              page: 1
              page_size: 20
              orderBy: []
      responses:
        '200':
          description: 成功時分頁返回「取出明細」記錄，以及頁碼、每頁數量和總記錄數等分頁信息。
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。

                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`
                      判斷具體結果。

                      - `401`：未登錄。
                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。
                  message:
                    type: string
                  data:
                    type: object
                    required:
                      - list
                      - total
                    properties:
                      list:
                        type: array
                        description: 列表. **返回值：** 列表列表。
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: 取出證券明細編號. **返回值：** 當前記錄的唯一標識。
                            transfer_id:
                              type: string
                              description: 申請編號. **返回值：** 申請編號。
                            code:
                              type: string
                              description: 證券代碼. **返回值：** 證券代碼。
                            real_name:
                              type: string
                              description: 客戶姓名. **返回值：** 客戶姓名。
                            origin_id:
                              type: string
                              description: 證券賬號. **返回值：** 證券賬號。
                            name_locales:
                              type: string
                              description: 轉出證券. **返回值：** 轉出證券。
                            amount:
                              type: string
                              description: 轉出持倉. **返回值：** 轉出持倉。
                            transfer_order_fee:
                              type: string
                              description: 手續費. **返回值：** 手續費。
                            custom_transfer_area_fee:
                              type: string
                              description: 消費税. **返回值：** 消費税。
                            margin_call_value:
