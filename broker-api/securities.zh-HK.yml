  /v1/datasets/atm_transfer_out_records:
    get:
      operationId: atm_transfer_out_records
      summary: 取出申請
      tags:
        - 证券管理
      x-permission-key:
        - finance.transfer_out_record
      x-lbonly: false
      description: |-
        查詢「取出申請」數據，可通過 `filters` 組合業務篩選條件，並使用 `page`、`page_size` 和 `orderBy` 控制分頁與排序。

        ### 返回結果

        成功時返回匹配的記錄列表及分頁信息。各過濾字段的用途、可選值和動態數據來源見對應字段說明。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 過濾條件. 組合業務過濾條件。省略某個過濾字段時，不按該字段篩選。
                  properties:
                    aaid:
                      type: string
                      description: 客戶. 用於按「客戶」篩選結果。
                    id:
                      type: string
                      description: 轉出申請編號. 用於按「轉出申請編號」篩選結果。
                    created_at:
                      type: object
                      description: 創建時間. 用於按「創建時間」篩選結果。
                      properties:
                        gte:
                          type: string
                          description: 大於等於. 篩選範圍的下限，匹配值包含該值。
                          format: date
                        lte:
                          type: string
                          description: 小於等於. 篩選範圍的上限，匹配值包含該值。
                          format: date
                    counter_id:
                      type: string
                      description: 股票. 用於按「股票」篩選結果。
                    from:
                      type: string
                      description: |-
                        來源. 用於按「來源」篩選結果。

                        **可選值：**
                        - `app` - 表示客戶
                        - `bo` - 表示後台人工
                        - `was` - 表示 WAS
                      enum:
                        - app
                        - bo
                        - was
                page:
                  type: integer
                  description: 頁碼. 要查詢的頁碼，從 `1` 開始。
                page_size:
                  type: integer
                  description: 每頁數量. 每頁返回的記錄數量。
                orderBy:
                  type: array
                  description: 排序參數. 排序規則數組；每一項定義一個排序字段及排序方向。
                  items:
                    type: object
            example:
              filters: {}
              page: 1
              page_size: 20
              orderBy: []
      responses:
        '200':
          description: 成功時分頁返回「取出申請」記錄，以及頁碼、每頁數量和總記錄數等分頁信息。
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。

