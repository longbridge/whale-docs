                          properties:
                            id:
                              type: string
                              description: 申請編號. **返回值：** 當前記錄的唯一標識。
                            id_val:
                              type: string
                              description: 申請編號（原始值）. 字段 id 的原始值：id 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            support_manager_name:
                              type: string
                              description: 客服經理. **返回值：** 客服經理。
                            origin_id:
                              type: string
                              description: 證券賬號. **返回值：** 證券賬號。
                            real_name:
                              type: string
                              description: 客戶姓名. **返回值：** 客戶姓名。
                            member_region:
                              type: string
                              description: 客戶所屬地區. **返回值：** 客戶所屬地區。
                            member_region_val:
                              type: string
                              description: 客戶所屬地區（原始值）. 字段 member_region 的原始值：member_region 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            broker_id:
                              type: string
                              description: 轉入券商. **返回值：** 轉入券商。
                            broker_id_val:
                              type: string
                              description: 轉入券商（原始值）. 字段 broker_id 的原始值：broker_id 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            state:
                              type: string
                              description: 申請單狀態. **返回值：** 申請單狀態。
                            state_val:
                              type: string
                              description: 申請單狀態（原始值）. 字段 state 的原始值：state 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            app_state:
