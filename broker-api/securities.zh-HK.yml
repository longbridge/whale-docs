                              description: 託管商. **返回值：** 託管商。
                            custodian_before_val:
                              type: string
                              description: 託管商（原始值）. 字段 custodian_before 的原始值：custodian_before 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            sub_position_no_before:
                              type: string
                              description: 子倉. **返回值：** 子倉。
                            sub_position_no_before_val:
                              type: string
                              description: 子倉（原始值）. 字段 sub_position_no_before 的原始值：sub_position_no_before 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            street_amount_before:
                              type: string
                              description: Street Amount. **返回值：** Street Amount。
                            nominee_amount_before:
                              type: string
                              description: Nominee Amount. **返回值：** Nominee Amount。
                            own_amount_before:
                              type: string
                              description: Own Amount. **返回值：** Own Amount。
                            creator:
                              type: string
                              description: 操作人. **返回值：** 操作人。
                            created_at:
                              type: string
                              description: 提交時間. **返回值：** 提交時間；時間或日期格式以接口實際返回值為準。
                            settled_at:
                              type: string
                              description: 出賬時間. **返回值：** 出賬時間；時間或日期格式以接口實際返回值為準。
                      total:
                        type: integer
                        description: 總條數. **返回值：** 符合查詢條件的記錄總數，用於計算分頁。
