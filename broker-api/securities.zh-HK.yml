openapi: 3.1.1
info:
  title: Longport Whale 券商 API
  description: 面向使用 Longport Whale 的券商提供機構級服務端 API。
  version: 2.0.0
servers:
  - url: https://b-api.longbridge.xyz
    description: 測試環境
  - url: https://b-api.lbkrs.com
    description: 生產環境
security:
  - bearerAuth: []
tags:
  - name: 证券管理
paths:
  /atm/create/rollover/stock/limit:
    post:
      operationId: create_rollover_stock_limit
      summary: 新建存入限制標的
      tags:
        - 证券管理
      x-permission-key:
        - atm.rollover_stock_limit_update
      x-lbonly: false
      description: |-
        新增證券存入限制，僅需傳入 `counter_id`。

        ### 請求參數

        - 必填：`counter_id`（標的代碼）
        - 各字段的格式、取值範圍、默認行為和業務含義見對應字段說明。

        ### 處理結果

        成功時完成所述業務操作，具體返回內容見 `200` 響應定義。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - counter_id
              properties:
                counter_id:
                  type: string
                  description: 標的代碼. 要限制存入的標的代碼。
            example:
              counter_id: 700.HK
      responses:
        '200':
          description: 請求處理成功。響應的 `data` 不包含額外業務字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。

                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`
                      判斷具體結果。

                      - `401`：未登錄。
                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登錄或登錄狀態已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 當前賬號未獲得該功能授權。請在 User Permission 中為該賬號開通相應權限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 請求處理超時。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
      x-mint:
        href: /zh-HK/api-reference/create_rollover_stock_limit
        metadata:
          sidebarTitle: 新建存入限制標的
  /atm/create_modify_brokers_my_v3:
    post:
      operationId: create_modify_brokers_my_v3
      summary: 新建/編輯我方券商信息
      tags:
        - 证券管理
      x-permission-key:
        - cmbc.broker_my
      x-lbonly: false
      description: |-
        當前使用 V3 版本接口。傳入 id 時為編輯、否則為新增。涉及真實券商配置數據變更。

        ### 請求參數

        - 必填：`market`（市場）、`code`（券商 code）、`name`（渠道券商名稱）、`company_name`（櫃檯公司名稱）、`contact`（聯繫人）、`contact_email`（聯繫郵箱）、`contact_phones`（聯繫電話）
        - 可選：`id`（券商記錄ID）、`account`（券商賬號）、`audit_frontend_resource`（審計上下文）
        - 各字段的格式、取值範圍、默認行為和業務含義見對應字段說明。

        ### 處理結果

        成功時完成所述業務操作，具體返回內容見 `200` 響應定義。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - market
                - code
                - name
                - company_name
                - contact
                - contact_email
                - contact_phones
              properties:
                id:
                  type: string
                  description: 券商記錄ID. 僅編輯已有記錄時傳入；新建時不傳該字段
                market:
                  type: string
                  description: |-
                    市場. 下拉選擇；編輯時該字段禁用不可修改

                    **可選值：**
                    - `us` - 表示美國市場
                    - `cn` - 表示滬深市場
                    - `hk` - 表示香港市場
                    - `sg` - 表示新加坡市場
                  enum:
                    - us
                    - cn
                    - hk
                    - sg
                code:
                  type: string
                  description: 券商 code. 用於指定「券商 code」。此字段為必填項。
                name:
                  type: string
                  description: 渠道券商名稱. 用於指定「渠道券商名稱」。此字段為必填項。
                company_name:
                  type: string
                  description: 櫃檯公司名稱. 用於指定「櫃檯公司名稱」。此字段為必填項。
                account:
                  type: string
                  description: 券商賬號. 用於指定「券商賬號」。
                contact:
                  type: string
                  description: 聯繫人. 用於指定「聯繫人」。此字段為必填項。
                contact_email:
                  type: string
                  description: 聯繫郵箱. 用於指定「聯繫郵箱」。此字段為必填項。
                contact_phones:
                  type: array
                  description: '聯繫電話. 數組，每項為 { contact_phone: string }，可動態增刪多個聯繫電話，格式需匹配正則 ^[A-Za-z0-9,.\-+\s]+$'
                  items:
                    type: string
                audit_frontend_resource:
                  type: object
                  description: 審計上下文. 審計留痕字段，由調用方生成並隨提交請求，含 $action/$behavior 及編輯前的原始字段值，非業務參數
            example:
              market: HK
              code: HKG001
              name: 示例渠道券商
              company_name: 示例柜台公司
              account: ACC00001
              contact: 张三
              contact_email: user@example.com
              contact_phones:
                - contact_phone: 85200000000
      responses:
        '200':
          description: 請求處理成功。響應的 `data` 不包含額外業務字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。

                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`
                      判斷具體結果。

                      - `401`：未登錄。
                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登錄或登錄狀態已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 當前賬號未獲得該功能授權。請在 User Permission 中為該賬號開通相應權限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 請求處理超時。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
      x-mint:
        href: /zh-HK/api-reference/create_modify_brokers_my_v3
        metadata:
          sidebarTitle: 新建/編輯我方券商信息
  /atm/stand_up_down_brokers_my:
    post:
      operationId: stand_up_down_brokers_my
      summary: 上架/下架我方券商
      tags:
        - 证券管理
      x-permission-key:
        - cmbc.broker_my
      x-lbonly: false
      description: |-
        點擊後彈出二次確認（popconfirm）後調用。涉及真實券商上下架狀態變更。

        ### 請求參數

        - 必填：`brokers_my_id`（我方券商記錄ID）、`is_valid`（是否上架）
        - 可選：`audit_frontend_resource`（審計上下文）
        - 各字段的格式、取值範圍、默認行為和業務含義見對應字段說明。

        ### 處理結果

        成功時完成所述業務操作，具體返回內容見 `200` 響應定義。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - brokers_my_id
                - is_valid
              properties:
                brokers_my_id:
                  type: string
                  description: 我方券商記錄ID. 對應列表行 record.id
                is_valid:
                  type: integer
                  description: |-
                    是否上架. 1=上架 (Stand up)，0=下架 (Stand down)

                    **可選值：**
                    - `1` - 表示上架
                    - `0` - 表示下架
                  enum:
                    - '1'
                    - '0'
                audit_frontend_resource:
                  type: object
                  description: 審計上下文. 由調用方生成並隨提交請求，僅含 $behavior 文案（上架/下架提示語），非業務字段
            example:
              brokers_my_id: '1'
              is_valid: 1
      responses:
        '200':
          description: 請求處理成功。響應的 `data` 不包含額外業務字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。

                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`
                      判斷具體結果。

                      - `401`：未登錄。
                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登錄或登錄狀態已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 當前賬號未獲得該功能授權。請在 User Permission 中為該賬號開通相應權限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 請求處理超時。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
      x-mint:
        href: /zh-HK/api-reference/stand_up_down_brokers_my
        metadata:
          sidebarTitle: 上架/下架我方券商
  /atm/create_modify_brokers_v2:
    post:
      operationId: create_modify_brokers_v2
      summary: 新建/編輯對手方券商信息
      tags:
        - 证券管理
      x-permission-key:
        - cmbc.broker_rival
      x-lbonly: false
      description: |-
        請結合審計模板核對請求。`name` 和 `app_name` 為多語言字段，提交前會拆分為 `_en`、`_cn`、`_hk` 三個字段。`is_has_attachment` 使用 `atm_brokers_attachment` 動態枚舉。僅編輯時傳 `id`。此操作會更改真實券商配置。

        ### 請求參數

        - 必填：`market`（市場）、`name_en`（渠道券商（英文））、`name_cn`（渠道券商（簡體中文））、`name_hk`（渠道券商（繁體中文））、`app_name_en`（券商 App 名稱（英文））、`app_name_cn`（券商 App 名稱（簡體中文））、`app_name_hk`（券商 App 名稱（繁體中文））、`stock_limit`（轉倉股票數量限制）、`code`（券商 code）、`contact`（聯繫人）、`is_has_attachment`（有無附件）、`tpl_email`（轉倉郵箱模版 key）、`show_name`（我方券商名稱展示）、`priority`（優先級）、`state`（狀態）
        - 可選：`id`（對手方券商記錄ID）、`contact_phone`（聯繫電話）、`contact_email`（聯繫郵箱）、`icon`（券商 logo）、`website`（官網地址）、`file_list`（附件文件列表）、`audit_frontend_resource`（審計上下文）
        - 各字段的格式、取值範圍、默認行為和業務含義見對應字段說明。

        ### 處理結果

        成功時完成所述業務操作，具體返回內容見 `200` 響應定義。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - market
                - name_en
                - name_cn
                - name_hk
                - app_name_en
                - app_name_cn
                - app_name_hk
                - stock_limit
                - code
                - contact
                - is_has_attachment
                - tpl_email
                - show_name
                - priority
                - state
              properties:
                id:
                  type: string
                  description: 對手方券商記錄ID. 僅編輯已有記錄時傳入；新建時不傳
                market:
                  type: string
                  description: |-
                    市場. 下拉選擇，來自 select，編輯時該字段禁用不可修改

                    **可選值：**
                    - `us` - 表示美國市場
                    - `cn` - 表示滬深市場
                    - `hk` - 表示香港市場
                    - `sg` - 表示新加坡市場
                  enum:
                    - us
                    - cn
                    - hk
                    - sg
                name_en:
                  type: string
                  description: 渠道券商（英文）. 用於指定「渠道券商（英文）」。此字段為必填項。
                name_cn:
                  type: string
                  description: 渠道券商（簡體中文）. 用於指定「渠道券商（簡體中文）」。此字段為必填項。
                name_hk:
                  type: string
                  description: 渠道券商（繁體中文）. 用於指定「渠道券商（繁體中文）」。此字段為必填項。
                app_name_en:
                  type: string
                  description: 券商 App 名稱（英文）. 用於指定「券商 App 名稱（英文）」。此字段為必填項。
                app_name_cn:
                  type: string
                  description: 券商 App 名稱（簡體中文）. 用於指定「券商 App 名稱（簡體中文）」。此字段為必填項。
                app_name_hk:
                  type: string
                  description: 券商 App 名稱（繁體中文）. 用於指定「券商 App 名稱（繁體中文）」。此字段為必填項。
                stock_limit:
                  type: integer
                  description: 轉倉股票數量限制. 用於指定「轉倉股票數量限制」。此字段為必填項。
                code:
                  type: string
                  description: 券商 code. 用於指定「券商 code」。此字段為必填項。
                contact:
                  type: string
                  description: 聯繫人. 用於指定「聯繫人」。此字段為必填項。
                is_has_attachment:
                  type: string
                  description: |-
                    有無附件. 單選框，取值來自 ref atm_brokers_attachment 的 key（如 1=有附件/0=無附件，具體枚舉以 ref 下發為準）；為 1 時 website
                    非必填， contact_phone/contact_email 必填，為其他值時相反

                    **可選值：**
                    - `1` - 表示是
                    - `0` - 表示否
                  enum:
                    - '1'
                    - '0'
                contact_phone:
                  type: string
                  description: 聯繫電話. is_has_attachment 為有附件時必填，需匹配正則 ^[A-Za-z0-9,.\-+\s]+$
                contact_email:
                  type: string
                  description: 聯繫郵箱. is_has_attachment 為有附件時必填，需符合郵箱格式
                tpl_email:
                  type: string
                  description: 轉倉郵箱模版 key. 用於指定「轉倉郵箱模版 key」。此字段為必填項。
                icon:
                  type: string
                  description: 券商 logo. 用於指定「券商 logo」。
                show_name:
                  type: string
                  description: |-
                    我方券商名稱展示. 單選框。

                    **可選值：**
                    - `1` - 表示櫃檯公司名稱
                    - `0` - 表示渠道券商名稱
                  enum:
                    - '1'
                    - '0'
                website:
                  type: string
                  description: 官網地址. is_has_attachment 為無附件時必填
                priority:
                  type: integer
                  description: 優先級. 處理優先級；數值含義及排序方向以可選值定義為準。此字段為必填項。
                state:
                  type: string
                  description: |-
                    狀態. 1=啓用 (Enable)，2=停用 (Disable)，默認為 1

                    **可選值：**
                    - `1` - 表示啓用
                    - `2` - 表示停用
                  enum:
                    - '1'
                    - '2'
                file_list:
                  type: array
                  description: 附件文件列表. 由调用方 review_urls 上傳組件轉換得到的文件 key 數組
                  items:
                    type: string
                audit_frontend_resource:
                  type: object
                  description: 審計上下文. 由調用方生成並隨提交請求，用於審計日誌展示，非業務字段
            example:
              market: HK
              name_en: Sample Broker
              name_cn: 示例券商
              name_hk: 示例券商
              app_name_en: Sample App
              app_name_cn: 示例应用
              app_name_hk: 示例應用
              stock_limit: 100
              code: HKG001
              contact: 李四
              is_has_attachment: '1'
              contact_phone: 85200000000
              contact_email: user@example.com
              tpl_email: user@example.com
              icon: https://example.com/logo.png
              show_name: '1'
              website: https://example.com
              priority: 10
              state: '1'
              file_list:
                - upload_key_1
      responses:
        '200':
          description: 請求處理成功。響應的 `data` 不包含額外業務字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。

                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`
                      判斷具體結果。

                      - `401`：未登錄。
                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
