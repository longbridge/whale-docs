      x-lbonly: false
      description: |-
        審核證券取出申請。

        ### 請求參數

        - 必填：`ids`（取出申請ID列表）、`state`（審核後狀態）
        - 可選：`remark`（備註）、`is_show`（備註是否對用戶可見）、`audit_frontend_resource`（調用方提交的審計追蹤信息）
        - 各字段的格式、取值範圍和業務含義見對應字段說明。

        ### 處理結果

        成功時完成上述業務操作；後續狀態和返回數據以 `200` 響應定義為準。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - ids
                - state
              properties:
                ids:
                  type: array
                  description: 取出申請ID列表. 取出申請ID列表，以 JSON 數組形式提交。此字段為必填項。
                  items:
                    type: string
                remark:
                  type: string
                  description: 備註. approve/submit_channel 場景對應「備註」TextArea；reject 場景額外還有默認備註下拉可回填此字段
                state:
                  type: number
                  description: 審核後狀態. 由 action 決定：approve→1(處理中/PROCESSING_STATE)，reject→3(已駁回/REJECTED_STATE)，submit_channel→2(已處理/PROCESSED_STATE)
                is_show:
                  type: number
                  description: |-
                    備註是否對用戶可見. 僅 reject 場景傳值：1=可見，0=不可見；approve/submit_channel 場景傳 null

                    **可選值：**
                    - `1` - 表示可見
                    - `0` - 表示不可見
                  enum:
                    - '1'
                    - '0'
                audit_frontend_resource:
                  type: object
                  description: 審計上下文. 調用方提交的審計信息對象，含 $action(approve/reject/add) 與 $behavior(操作行為文案)，非業務字段
            example:
              ids:
                - '100086'
              remark: 审核通过
              state: 1
              is_show: null
              audit_frontend_resource:
                $action: approve
                $behavior: Approve
      responses:
        '200':
          description: 請求處理成功。響應的 `data` 不包含額外業務字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。

                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`
                      判斷具體結果。

                      - `401`：未登錄。
                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登錄或登錄狀態已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 當前賬號未獲得該功能授權。請在 User Permission 中為該賬號開通相應權限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 請求處理超時。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
