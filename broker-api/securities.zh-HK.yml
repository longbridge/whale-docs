  /admin/transfer/out/apply:
    post:
      operationId: transfer_out_apply
      summary: 手工出倉申請
      tags:
        - 证券管理
      x-permission-key:
        - atm.admin_transfer_out_apply
        - b2b_atm.admin_transfer_out_apply
      x-lbonly: false
      description: |-
        手工出倉申請。

        ### 請求參數

        - 必填：`aaid`（資產賬戶ID）、`member_id`（會員/客戶ID）、`from`（來源標識）、`params.name_en`（接收券商名稱）、`params.code`（CCASS / DTC 代號）、`params.name`（賬戶姓名）、`params.account_channel`（賬戶渠道）、`params.stocks`（證券取出 (Transfer Out) 明細列表）、`params.stocks[].counter_id`（標的（櫃檯ID））、`params.stocks[].is_reality`（是否為實物股票）、`params.stocks[].custodian`（託管商編號）、`params.stocks[].sub_position_no`（子倉編號）、`params.stocks[].amount`（持倉數量（合計））
        - 可選：`params.broker_id`（轉入券商）、`params.account`（賬戶號碼）、`params.broker`（券商名稱（提交用））、`params.stocks[].street_amount`（Street 數量）、`params.stocks[].nominee_amount`（Nominee 數量）、`params.stocks[].own_amount`（Own 數量）、`params.stocks[].market`（市場）、`params.stocks[].name_en`（標的名稱（英文））、`params.stocks[].code`（標的代碼）
        - 各字段的格式、取值範圍和業務含義見對應字段說明。

        ### 風險提示

        > 此操作可能引起真實資金、持倉或交易狀態變化。調用前請確認目標記錄和參數無誤。

        ### 處理結果

        成功時完成上述業務操作；後續狀態和返回數據以 `200` 響應定義為準。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - aaid
                - member_id
                - from
                - params.name_en
                - params.code
                - params.name
                - params.account_channel
                - params.stocks
                - params.stocks[].counter_id
                - params.stocks[].is_reality
                - params.stocks[].custodian
                - params.stocks[].sub_position_no
                - params.stocks[].amount
              properties:
                aaid:
                  type: string
                  description: 資產賬戶ID. 資產賬戶ID，用於標識本次請求關聯的業務對象。此字段為必填項。
                member_id:
                  type: string
                  description: 會員/客戶ID. 會員/客戶ID，用於標識本次請求關聯的業務對象。此字段為必填項。
                from:
                  type: string
                  description: 來源標識. 固定傳 'bo'（後台）
                params.broker_id:
                  type: string
                  description: 轉入券商. 下拉選擇，數據源為券商列表查詢，附加一項 id='0' 表示「其他券商」
                params.name_en:
                  type: string
                  description: 接收券商名稱. broker_id='0'（其他券商）時需手工填寫；否則應從所選券商記錄填入
                params.code:
                  type: string
                  description: CCASS / DTC 代號. broker_id='0'（其他券商）時需手工填寫；否則應從所選券商記錄填入
                params.name:
                  type: string
                  description: 賬戶姓名. 下拉選擇，數據源為客戶姓名列表
                params.account:
                  type: string
                  description: 賬戶號碼. 用於指定「賬戶號碼」。
                params.broker:
                  type: string
                  description: 券商名稱（提交用）. 計算字段：broker_id≠'0' 時取選中券商的名稱，否則取 name_en
                params.account_channel:
                  type: string
                  description: 賬戶渠道. 當前登錄渠道，自動獲取，非用戶手工輸入
                params.stocks:
                  type: array
                  description: 證券取出 (Transfer Out) 明細列表. 可動態增刪多組，每組結構見下方各 stocks[] 字段
                  items:
                    type: string
                params.stocks[].counter_id:
                  type: string
                  description: 標的（櫃檯ID）. 選擇標的，選中後聯動帶出 market/name_en/code 及託管持倉信息
                params.stocks[].is_reality:
                  type: integer
                  description: |-
                    是否為實物股票. 用於指定「是否為實物股票」。此字段為必填項。

                    **可選值：**
                    - `1` - 表示是
                    - `0` - 表示否
                  enum:
                    - '1'
                    - '0'
                params.stocks[].custodian:
                  type: string
                  description: |-
                    託管商編號. 下拉選擇，選中標的後由持倉查詢結果或 clear_custodian_no_all 動態枚舉提供選項

                    請調用 `GET /v1/datasets/refs/clearing_custodians` 獲取當前可用的數據字典，並使用返回項的 `key` 作為本字段值。
                  x-value-source:
                    endpoint: GET /v1/datasets/refs/clearing_custodians
                params.stocks[].sub_position_no:
                  type: string
                  description: |-
                    子倉編號. 下拉選擇，來源於持倉信息或 clear_sub_position_no_all 動態枚舉

                    請調用 `GET /v1/datasets/refs/custodian_sub_positions` 獲取當前可用的數據字典，並使用返回項的 `key` 作為本字段值。
                  x-value-source:
                    endpoint: GET /v1/datasets/refs/custodian_sub_positions
                params.stocks[].street_amount:
                  type: integer
                  description: Street 數量. 非負整數，默認 0，由持倉查詢自動帶出，可編輯
                params.stocks[].nominee_amount:
                  type: integer
                  description: Nominee 數量. 非負整數，默認 0，由持倉查詢自動帶出，可編輯
                params.stocks[].own_amount:
                  type: integer
                  description: Own 數量. 非負整數，默認 0，由持倉查詢自動帶出，可編輯
                params.stocks[].amount:
                  type: string
                  description: 持倉數量（合計）. 自動計算 = street_amount + nominee_amount + own_amount，必須為正整數，提交時轉為字符串
                params.stocks[].market:
                  type: string
                  description: 市場. 由選中的 counter_id 自動帶出
                params.stocks[].name_en:
                  type: string
                  description: 標的名稱（英文）. 由選中的 counter_id 自動帶出
                params.stocks[].code:
                  type: string
                  description: 標的代碼. 由選中的 counter_id 自動帶出
            example:
              aaid: H00000000
              member_id: '1000000000000000000'
              from: bo
              params:
                broker_id: '0'
                name_en: Sample Broker
                code: '12345'
                name: test_user
                account: ACC0001
                broker: Sample Broker
                account_channel: web
                stocks:
                  - counter_id: HK/700/700
                    is_reality: 1
                    custodian: CUST01
                    sub_position_no: SUB01
                    street_amount: 100
                    nominee_amount: 0
                    own_amount: 0
                    amount: '100'
                    market: HK
                    name_en: TENCENT
                    code: '700'
      responses:
        '200':
          description: 請求處理成功。響應的 `data` 不包含額外業務字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。

                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`
                      判斷具體結果。

                      - `401`：未登錄。
                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登錄或登錄狀態已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 當前賬號未獲得該功能授權。請在 User Permission 中為該賬號開通相應權限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 請求處理超時。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
      x-mint:
        href: /zh-HK/api-reference/transfer_out_apply
        metadata:
          sidebarTitle: 手工出倉申請
