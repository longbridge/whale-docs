  /gemini-tenant/eod-add:
    post:
      operationId: add_update_private_eod
      summary: 新建/編輯私有行情
      tags:
        - 证券管理
      x-lbonly: false
      description: |-
        行情維護 (Daily Quote) 用於新建或編輯行情記錄；不傳 `id` 時新建，攜帶 `id` 時編輯。

        ### 請求參數

        - 必填：`counter_id`（標的代碼）、`trade_day`（交易日）、`suspension_indicator`（牌標值）、`close`（收盤價）
        - 可選：`id`（行情記錄ID）、`open`（開盤價）、`high`（最高價）、`low`（最低價）、`volume`（成交量）、`turnover`（成交額）、`audit_frontend_resource`（審計上下文）
        - 各字段的格式、取值範圍、默認行為和業務含義見對應字段說明。

        ### 處理結果

        成功時完成所述業務操作，具體返回內容見 `200` 響應定義。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - counter_id
                - trade_day
                - suspension_indicator
                - close
              properties:
                id:
                  type: string
                  description: 行情記錄ID. 行情記錄ID，用於標識本次請求關聯的業務對象。
                counter_id:
                  type: string
                  description: 標的代碼. 標的代碼；創建後不可修改。
                trade_day:
                  type: string
                  description: 交易日. 格式 YYYY-MM-DD
                suspension_indicator:
                  type: string
                  description: |-
                    牌標值. 停牌標記，默認值為 `N`。

                    **可選值：**
                    - `Y` - 表示是
                    - `N` - 表示否
                  enum:
                    - Y
                    - N
                close:
                  type: number
                  description: 收盤價. 用於指定「收盤價」。此字段為必填項。
                open:
                  type: number
                  description: 開盤價. 用於指定「開盤價」。
                high:
                  type: number
                  description: 最高價. 用於指定「最高價」。
                low:
                  type: number
                  description: 最低價. 用於指定「最低價」。
                volume:
                  type: number
                  description: 成交量. 用於指定「成交量」。
                turnover:
                  type: number
                  description: 成交額. 用於指定「成交額」。
                audit_frontend_resource:
                  type: object
                  description: 審計上下文. 調用方提交的審計上下文，用於記錄本次操作。
            example:
              id: '10086'
              counter_id: 700.HK
              trade_day: 2026-07-13
              suspension_indicator: N
              close: 100
              open: 99
              high: 101
              low: 98
              volume: 123456
              turnover: 12345600
              audit_frontend_resource: {}
      responses:
        '200':
          description: 請求處理成功。響應的 `data` 不包含額外業務字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。

                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`
                      判斷具體結果。

                      - `401`：未登錄。
                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登錄或登錄狀態已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 當前賬號未獲得該功能授權。請在 User Permission 中為該賬號開通相應權限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 請求處理超時。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
