                            auditor:
                              type: string
                              description: 審核人. **返回值：** 審核人。
                            updated_at:
                              type: string
                              description: 更新時間. **返回值：** 更新時間；時間或日期格式以接口實際返回值為準。
                            state:
                              type: string
                              description: 轉出狀態. **返回值：** 轉出狀態。
                            state_val:
                              type: string
                              description: 轉出狀態（原始值）. 字段 state 的原始值：state 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            cheat_state:
                              type: string
                              description: 風控狀態. **返回值：** 風控狀態。
                            cheat_state_val:
                              type: string
                              description: 風控狀態（原始值）. 字段 cheat_state 的原始值：cheat_state 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            custom_hit_rules:
                              type: string
                              description: 命中規則. **返回值：** 命中規則。
                            si_file_name:
                              type: string
                              description: SI 報表名稱. **返回值：** SI 報表名稱。
                            si_purpose:
