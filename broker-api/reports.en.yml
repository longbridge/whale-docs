info:
  title: Longport Whale Broker API
  version: 1.0.0
servers:
  - url: https://b-api.longbridge.xyz
    description: Test
  - url: https://b-api.lbkrs.com
    description: Production
security:
  - bearerAuth: []
tags:
  - name: 报表管理 (Reports)
    description: Back-office management APIs for querying various financial and business reports.
paths:
  /crs/batch_delete_crs_data:
    post:
      operationId: batch_delete_crs_data
      summary: Batch Delete CRS Data
      tags:
        - 报表管理 (Reports)
      x-permission-key:
        - report.crs_data
      x-lbonly: false
      description: |-
        Batch-delete CRS records.

        ### Request parameters

        - Required: `id` (list of record IDs, submitted as a JSON array)
        - See each field's documentation for format, value ranges, and business meaning.

        ### Business notes

        Deletes generated CRS (Common Reporting Standard) reporting records in bulk by record ID. Deleted records no longer participate in subsequent reporting.

        ### Risk warning

        This operation deletes real tax-reporting data and cannot be undone. Confirm the `id` list before calling.

        ### Result

        On success, the batch deletion completes; refer to the `200` response definition for the resulting state.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
              properties:
                id:
                  type: array
                  description: Submit ID List as a JSON array. This field is required.
                  items:
                    type: string
            example:
              id:
                - '123'
      responses:
        '200':
          description: The request was processed successfully. The response `data` does not contain additional business fields.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      `0` indicates success. A non-zero value is a business error code, in which case
                      `data` is usually empty.

                      HTTP status codes use their standard semantics. A successful request normally
                      returns `200`; errors may return `400`, `401`, `403`, `408`, or another applicable
                      status. Interpret the HTTP status together with the business `code`.

                      - `401`: The user is not authenticated.
                      - `403`: The current account is not authorized to use this function. Grant access
                        through User Permission.
                    x-enum-details:
                      - value: 0
                        label: Success
                  message:
                    type: string
                  data:
                    type: object
                    description: On success `data` is an empty object.
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: Bad request. Check the business error code in `code` and the error details in `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: The user is not authenticated, or the login session has expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: The current account is not authorized to use this feature. Grant the required permission to the account in User Permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: The request timed out. Check the business error code in `code` and the error details in `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
  /crs/generate_crs_data:
    post:
      operationId: generate_crs_data
      summary: Generate CRS Data
      tags:
        - 报表管理 (Reports)
      x-permission-key:
        - report.crs_data
      x-lbonly: false
      description: |-
        Generate CRS (Common Reporting Standard) reporting data for a given reporting year and AEOI entity.

        ### Request parameters

        - Required: `return_year` (reporting year), `aeoi_id` (AEOI ID)
        - Optional: `company_name`, `retain_has_asset` (whether to keep records that have assets), `account_state` (account-status filter)
        - See each field's documentation for format, value ranges, and business meaning.

        ### Business notes

        Aggregates and produces reportable data by reporting year and AEOI entity. Optional parameters control whether accounts holding assets are retained and how records are filtered by account status.

        ### Risk warning

        This operation produces formal tax-reporting data. Confirm the reporting year and AEOI entity before calling.

        ### Result

        On success, CRS data generation is triggered; the response `data` carries no additional business fields.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - return_year
                - aeoi_id
              properties:
                return_year:
                  type: integer
                  description: Reporting year for the CRS data. This field is required.
                  example: 2024
                aeoi_id:
                  type: string
                  description: AEOI (Automatic Exchange of Information) identifier. This field is required.
                company_name:
                  type: string
                  description: Name of the reporting entity company.
                retain_has_asset:
                  type: boolean
                  description: Whether to retain only records that have assets.
                account_state:
                  type: array
                  description: |-
                    Filter by account state, submitted as a string array. Values come from a backend data dictionary (maintained dynamically), not a fixed enum; use the options the service actually returns.
                  items:
                    type: string
            example:
              return_year: 2024
              aeoi_id: ''
              company_name: ''
              retain_has_asset: false
              account_state: []
      responses:
        '200':
          description: The request was processed successfully. The response `data` does not contain additional business fields.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      `0` indicates success. A non-zero value is a business error code, in which case
                      `data` is usually empty.

                      HTTP status codes use their standard semantics. A successful request normally
                      returns `200`; errors may return `400`, `401`, `403`, `408`, or another applicable
                      status. Interpret the HTTP status together with the business `code`.

                      - `401`: The user is not authenticated.
                      - `403`: The current account is not authorized to use this function. Grant access
                        through User Permission.
                    x-enum-details:
                      - value: 0
                        label: Success
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      id:
                        type: string
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: Bad request. Check the business error code in `code` and the error details in `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: The user is not authenticated, or the login session has expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: The current account is not authorized to use this feature. Grant the required permission to the account in User Permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: The request timed out. Check the business error code in `code` and the error details in `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
