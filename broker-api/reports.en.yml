        - Combine business filters through `filters` (see the filter field notes below), and use `page`, `page_size`, and `orderBy` to control pagination and sorting. Specify the owning batch to scope the query.

        ### Business notes

        - The data lists the reports added to a batch print batch; each record corresponds to one report in the batch.

        - A record carries the report name, file type, remark, and print conditions, where the print conditions record the parameter configuration used when exporting that report.

        - Typically used to maintain batch members and verify each report's export format and filter conditions before running a batch export.

        ### Returns

