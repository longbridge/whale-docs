  /v1/datasets/report_crs_records:
    post:
      operationId: report_crs_records
      summary: CRS Data Query
      tags:
      - 报表管理 (Reports)
      x-permission-key:
      - report.crs_data
      x-lbonly: false
      description: 'Queries CRS Data Query data. Combine business filters in `filters`,
        and use `page` and `page_size` to control pagination.


        ### Response


        On success, the API returns the matching records and pagination metadata.
        See each filter field for its purpose, allowed values, and dynamic value source.'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: Combines business filters. Omit a filter field to disable
                    that filter.
                  properties:
                    return_year:
                      type: string
                      description: 'Filters results by Return Year.


                        Values are dynamic. Call `GET /v1/datasets/refs/crs_return_year`
                        to retrieve the current data dictionary, and use the returned
                        entry''s `key` as this parameter''s value.'
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/crs_return_year
                    message_type:
                      type: string
                      description: 'Filters results by Message Type.


                        **Allowed values:**

                        - `CRS701` - New [CRS701]

                        - `CRS702` - Corrections[CRS702]'
                      enum:
                      - CRS701
                      - CRS702
                      x-enum-details:
                      - value: CRS701
                        label: New [CRS701]
                      - value: CRS702
                        label: Corrections[CRS702]
                    aeoi_id:
                      type: string
                      description: 'Filters results by Aeoi Id.


                        Values are dynamic. Call `GET /v1/datasets/refs/crs_aeoi_id`
                        to retrieve the current data dictionary, and use the returned
                        entry''s `key` as this parameter''s value.'
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/crs_aeoi_id
                    account_no:
                      type: string
                      description: Filters results by Account Number.
                    batch:
                      type: string
                      description: 'Filters results by Batch.


                        Values are dynamic. Call `GET /v1/datasets/refs/crs_batch`
                        to retrieve the current data dictionary, and use the returned
                        entry''s `key` as this parameter''s value.'
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/crs_batch
                    client_type:
                      type: string
                      description: 'Filters results by Client Type.


                        **Allowed values:**

                        - `P` - Person

                        - `O` - Organization'
                      enum:
                      - P
                      - O
                      x-enum-details:
                      - value: P
                        label: Person
                      - value: O
                        label: Organization
                    doc_type:
                      type: string
                      description: 'Filters results by Doc Type.


                        **Allowed values:**

                        - `OECD1` - New Data [OECD1]

                        - `OECD2` - Corrected Data [OECD2]

                        - `OECD3` - Deletion of Data [OECD3]'
                      enum:
                      - OECD1
                      - OECD2
                      - OECD3
                      x-enum-details:
                      - value: OECD1
                        label: New Data [OECD1]
                      - value: OECD2
                        label: Corrected Data [OECD2]
                      - value: OECD3
                        label: Deletion of Data [OECD3]
                    message:
                      type: string
                      description: 'Filters results by Message Number.


                        Values are dynamic. Call `GET /v1/datasets/refs/crs_message_id`
                        to retrieve the current data dictionary, and use the returned
                        entry''s `key` as this parameter''s value.'
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/crs_message_id
                    account_state:
                      type: string
                      description: 'Filters results by Account Status.


                        Multiple values are supported. Join them with commas (`,`).
                        Omit the field to disable this filter.


                        **Allowed values:**

                        - `-1` - Closed

                        - `0` - Unactive

                        - `1` - Active

                        - `99` - Suspend

                        - `4` - Suspended

                        - `5` - Dormant'
                      example: -1,0
                      enum:
                      - '-1'
                      - '0'
                      - '1'
                      - '99'
                      - '4'
                      - '5'
                      x-enum-details:
                      - value: '-1'
                        label: Closed
                      - value: '0'
                        label: Unactive
                      - value: '1'
                        label: Active
                      - value: '99'
                        label: Suspend
                      - value: '4'
                        label: Suspended
                      - value: '5'
                        label: Dormant
                page:
                  type: integer
                  description: Page number to retrieve, starting from `1`.
                page_size:
                  type: integer
                  description: Number of records to return per page.
            example:
              filters: {}
              page: 1
              page_size: 20
      responses:
        '200':
          description: On success, returns paginated CRS Data Query records together
            with pagination metadata such as the page number, page size, and total
            record count.
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - data
                properties:
                  code:
                    type: integer
                    description: "`0` indicates success. A non-zero value is a business\
                      \ error code, in which case\n`data` is usually empty.\n\nHTTP\
                      \ status codes use their standard semantics. A successful request\
                      \ normally\nreturns `200`; errors may return `400`, `401`, `403`,\
                      \ `408`, or another applicable\nstatus. Interpret the HTTP status\
                      \ together with the business `code`.\n\n- `401`: The user is\
                      \ not authenticated.\n- `403`: The current account is not authorized\
                      \ to use this function. Grant access\n  through User Permission."
                    x-enum-details:
                    - value: 0
                      label: Success
                  message:
                    type: string
                  data:
                    type: object
                    required:
                    - list
                    - total
                    properties:
                      list:
                        type: array
                        description: '**Returned value:** List of list.'
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: '**Returned value:** Unique identifier
                                of the current record.'
                            return_year:
                              type: string
                              description: '**Returned value:** Return Year.'
                            batch:
                              type: string
                              description: '**Returned value:** Batch.'
                            doc_type:
                              type: string
                              description: '**Returned value:** Doc Type.'
                            doc_type_val:
                              type: string
                              description: Raw value of `doc_type`. The `doc_type`
                                field contains the display value resolved through
                                a dictionary or related record; this field contains
                                the underlying code or ID.
                            aeoi_id:
                              type: string
                              description: '**Returned value:** Aeoi Id.'
                            message:
                              type: string
                              description: '**Returned value:** Message Number.'
                            message_type:
                              type: string
                              description: '**Returned value:** Message Type.'
                            message_type_val:
                              type: string
                              description: Raw value of `message_type`. The `message_type`
                                field contains the display value resolved through
                                a dictionary or related record; this field contains
                                the underlying code or ID.
                            account_batch:
                              type: string
                              description: '**Returned value:** Account Batch.'
                            account_no:
                              type: string
                              description: '**Returned value:** Account Number.'
                            client_type:
                              type: string
                              description: '**Returned value:** Client Type.'
                            client_type_val:
                              type: string
                              description: Raw value of `client_type`. The `client_type`
                                field contains the display value resolved through
                                a dictionary or related record; this field contains
                                the underlying code or ID.
                            entity_type:
                              type: string
                              description: '**Returned value:** Entity Type.'
                            entity_type_val:
                              type: string
                              description: Raw value of `entity_type`. The `entity_type`
                                field contains the display value resolved through
                                a dictionary or related record; this field contains
                                the underlying code or ID.
                            tax_id:
                              type: string
                              description: '**Returned value:** TAX ID.'
                            tax_country:
                              type: string
                              description: '**Returned value:** Tax Country.'
                            last_name:
                              type: string
                              description: '**Returned value:** Last Name.'
                            first_name:
                              type: string
                              description: '**Returned value:** First Name.'
                            region:
                              type: string
                              description: '**Returned value:** Country Code.'
                            address:
                              type: string
                              description: '**Returned value:** Address.'
                            birth_date:
                              type: string
                              description: '**Returned value:** Birth Date. The date
                                or time format follows the value returned by the API.'
                            total_asset:
                              type: string
                              description: '**Returned value:** Total Asset.'
                            currency:
                              type: string
                              description: '**Returned value:** Currency.'
                            account_state:
                              type: string
                              description: '**Returned value:** Account Status.'
                            account_state_val:
                              type: string
                              description: Raw value of `account_state`. The `account_state`
                                field contains the display value resolved through
                                a dictionary or related record; this field contains
                                the underlying code or ID.
                            payment_type1:
                              type: string
                              description: '**Returned value:** Payment Type1.'
                            payment_amount1:
                              type: string
                              description: '**Returned value:** Payment Amount1.'
                            payment_type2:
                              type: string
                              description: '**Returned value:** Payment Type2.'
                            payment_amount2:
                              type: string
                              description: '**Returned value:** Payment Amount2.'
                            payment_type3:
                              type: string
                              description: '**Returned value:** Payment Type3.'
                            payment_amount3:
                              type: string
                              description: '**Returned value:** Payment Amount3.'
                            payment_type4:
                              type: string
                              description: '**Returned value:** Payment Type4.'
                            payment_amount4:
                              type: string
                              description: '**Returned value:** Payment Amount4.'
                            status:
                              type: string
                              description: '**Returned value:** Status.'
                            status_val:
                              type: string
                              description: Raw value of `status`. The `status` field
                                contains the display value resolved through a dictionary
                                or related record; this field contains the underlying
                                code or ID.
                            lock:
                              type: string
                              description: '**Returned value:** Lock Status.'
                            lock_val:
                              type: string
                              description: Raw value of `lock`. The `lock` field contains
                                the display value resolved through a dictionary or
                                related record; this field contains the underlying
                                code or ID.
                      total:
                        type: integer
                        description: '**Returned value:** Total number of matching
                          records, used for pagination.'
              example:
                code: 0
                message: success
                data:
                  list:
                  - id: '41435209'
                    return_year: '2025'
                    batch: '7'
                    doc_type: New Data [OECD1]
                    doc_type_val: OECD1
                    aeoi_id: TT60994
                    message: 2025TT609942026062608421307
                    message_type: New [CRS701]
                    message_type_val: CRS701
                    account_batch: '1'
                    account_no: '****0000'
                    client_type: Person
                    client_type_val: P
                    entity_type: Reportable Person
                    entity_type_val: person_reportable
                    tax_id: '123456789'
                    tax_country: CN
                    last_name: NFN
                    first_name: ''
                    region: HK
                    address: 示例地址 Example Address
                    birth_date: 1959-07-19
                    total_asset: '0.00'
                    currency: HKD
                    account_state: Suspend
                    account_state_val: '99'
                    payment_type1: CRS501
                    payment_amount1: '0.00'
                    payment_type2: CRS502
                    payment_amount2: '0.00'
                    payment_type3: CRS503
                    payment_amount3: '0.00'
                    payment_type4: CRS504
                    payment_amount4: '0.00'
                    status: Data Generation
                    status_val: '1'
                    lock: Unlocked
                    lock_val: '0'
                  total: 4952985
        '400':
          description: Bad request. Check the business error code in `code` and the
            error details in `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: The user is not authenticated, or the login session has expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: The current account is not authorized to use this feature.
