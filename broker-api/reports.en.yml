                              description: Export task ID.
                            title:
                              type: string
                              description: Task title.
                            task_name:
                              type: string
                              description: Task name.
                            progress:
                              type: integer
                              description: Task progress percentage (`0`–`100`).
                            file_type:
                              type: string
                              description: Export file type.
                            file_size:
                              type: string
                              description: Export file size.
                            created_at:
                              type: integer
                              description: Creation time, as a Unix second timestamp.
                            succeeded_at:
                              type: integer
                              description: Completion time, as a Unix second timestamp;
                                empty or `0` when not finished.
                            subtask_num:
