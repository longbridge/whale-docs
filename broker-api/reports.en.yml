  /report/export_task/list:
    get:
      operationId: export_task_list
      summary: Export Task List
      tags:
        - 报表管理 (Reports)
      x-permission-key:
        - lb_hk_report.report_export_list
      x-lbonly: false
      description: |-
        Query the report export task list with pagination.

        ### Request parameters

        - Required: `page` (page number, starting at 1), `limit` (page size)
        - Optional filters: `report_id`, `parent_id` (owning batch ID), `task_id`, `created_at_gt` / `created_at_lt` (creation-time range, Unix seconds), `file_types` (file types, comma-separated for multiple values), `file_name`
        - Any filter omitted is not applied.

        ### Returns

        On success, `data.list` carries the current page of export tasks; see the response definition for each task's field meanings.
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: true
          schema:
            type: integer
          example: 1
          description: Page number, starting from 1.
        - name: limit
          in: query
          required: true
          schema:
            type: integer
          example: 20
          description: Number of items per page.
        - name: report_id
          in: query
          required: false
          schema:
            type: string
          description: Filter by report ID. Returns all when omitted.
        - name: parent_id
          in: query
          required: false
          schema:
            type: integer
          description: Filter by the parent export batch ID. Returns all when omitted.
        - name: task_id
          in: query
          required: false
          schema:
            type: integer
          description: Filter by export task ID. Returns all when omitted.
        - name: created_at_gt
          in: query
          required: false
          schema:
            type: integer
          example: 1704038400
          description: Lower bound of creation time (inclusive), as a Unix second timestamp. No lower bound when omitted.
        - name: created_at_lt
          in: query
          required: false
          schema:
            type: integer
          example: 1706716800
          description: Upper bound of creation time (inclusive), as a Unix second timestamp. No upper bound when omitted.
        - name: file_types
          in: query
          required: false
          schema:
            type: string
          example: pdf,xlsx
