        ### Request parameters

        - Combine business filters through `filters` (see the filter field notes below), and use `page`, `page_size`, and `orderBy` to control pagination and sorting.

        ### Business notes

        - Each record corresponds to one batch-print batch, which can bundle multiple reports and export them together.

        - A record carries the batch name, export mode (manual or scheduled automatic), report count, whether email notification is enabled, whether it syncs to SFTP, visible members, creator, and the operator and time of the most recent export.

        - Typically used by operations to maintain batch-print tasks, verify each batch's export configuration and execution status, and serve as the entry point for viewing batch details or triggering an export.

