  /crs/generate_crs_data:
    post:
      operationId: generate_crs_data
      summary: Generate CRS Data
      tags:
      - 报表管理 (Reports)
      x-permission-key:
      - report.crs_data
      x-lbonly: false
      description: 'Generate CRS (Common Reporting Standard) data.


        ### Request parameters


        - Required: `return_year` (reporting year), `aeoi_id` (AEOI ID)

        - Optional: `company_name` (company name), `retain_has_asset` (whether to
        retain records that have assets), `account_state` (account-state filter)

        - See each field for its format, allowed values, and business meaning.


        ### Result


        On success, CRS data generation is triggered. The response `data` does not
        contain additional business fields.'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - return_year
              - aeoi_id
              properties:
                return_year:
                  type: integer
                  description: Reporting year for the CRS data. This field is required.
                  example: 2024
                aeoi_id:
                  type: string
                  description: AEOI (Automatic Exchange of Information) identifier.
                    This field is required.
                company_name:
                  type: string
                  description: Name of the reporting entity company.
                retain_has_asset:
                  type: boolean
                  description: Whether to retain only records that have assets.
                account_state:
                  type: array
                  description: Filter by account state, submitted as a string array.
                    No account-state filtering is applied when omitted.
                  items:
                    type: string
            example:
              return_year: 2024
              aeoi_id: ''
              company_name: ''
              retain_has_asset: false
              account_state: []
      responses:
        '200':
          description: The request was processed successfully. The response `data`
            does not contain additional business fields.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: "`0` indicates success. A non-zero value is a business\
                      \ error code, in which case\n`data` is usually empty.\n\nHTTP\
                      \ status codes use their standard semantics. A successful request\
                      \ normally\nreturns `200`; errors may return `400`, `401`, `403`,\
                      \ `408`, or another applicable\nstatus. Interpret the HTTP status\
                      \ together with the business `code`.\n\n- `401`: The user is\
                      \ not authenticated.\n- `403`: The current account is not authorized\
                      \ to use this function. Grant access\n  through User Permission."
                    x-enum-details:
                    - value: 0
                      label: Success
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      id:
                        type: string
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: Bad request. Check the business error code in `code` and the
            error details in `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: The user is not authenticated, or the login session has expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: The current account is not authorized to use this feature.
            Grant the required permission to the account in User Permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: The request timed out. Check the business error code in `code`
            and the error details in `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
