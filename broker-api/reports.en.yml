        On success, `data.list` returns the export tasks on the current page. See
        the `200` response schema for each task field.'
      security:
      - bearerAuth: []
      parameters:
      - name: page
        in: query
        required: true
        schema:
          type: integer
        example: 1
        description: Page number, starting from 1.
      - name: limit
        in: query
        required: true
        schema:
          type: integer
        example: 20
        description: Number of items per page.
      - name: report_id
        in: query
        required: false
        schema:
          type: string
        description: Filter by report ID. Returns all when omitted.
      - name: parent_id
        in: query
        required: false
        schema:
          type: integer
        description: Filter by the parent export batch ID. Returns all when omitted.
      - name: task_id
        in: query
        required: false
        schema:
          type: integer
        description: Filter by export task ID. Returns all when omitted.
      - name: created_at_gt
        in: query
        required: false
        schema:
          type: integer
        example: 1704038400
        description: Lower bound of creation time (inclusive), as a Unix second timestamp.
          No lower bound when omitted.
      - name: created_at_lt
        in: query
        required: false
        schema:
          type: integer
        example: 1706716800
        description: Upper bound of creation time (inclusive), as a Unix second timestamp.
          No upper bound when omitted.
