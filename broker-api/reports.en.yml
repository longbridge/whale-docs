  /v1/datasets/report_crs_records/download:
    post:
      operationId: report_crs_records_download
      summary: CRS Data Query Export
      tags:
        - 报表管理 (Reports)
      x-permission-key:
        - report.crs_data
      x-lbonly: false
      description: |-
        Export CRS reporting records to a file. `filters` determines the export scope, and `down_fields` can limit the exported columns.

        ### Export modes

        - `mode: 0`: synchronous export; returns the download URL directly on success.
        - `mode: 1`: asynchronous export; returns a `file_download_id` first, then call `GET /v1/datasets/download/{id}` to obtain the download URL.
        - When the export record is no longer needed, call `DELETE /v1/datasets/download/{id}` to remove it.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: Same fields as the filters of report_crs_records.yaml (the query capability).
                  properties:
                    return_year:
                      type: string
                      description: |-
                        Filters results by Return Year.

                        Values are dynamic. Call `GET /v1/datasets/refs/crs_return_year` to retrieve the current data dictionary, and use the returned entry's `key` as this parameter's value.
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/crs_return_year
                    message_type:
                      type: string
                      description: Filters results by Message Type.
                      enum:
                        - CRS701
                        - CRS702
                      x-enum-details:
                        - value: CRS701
                          label: New [CRS701]
                        - value: CRS702
                          label: Corrections[CRS702]
                      example: CRS701
                    aeoi_id:
                      type: string
                      description: |-
                        Filters results by Aeoi Id.

                        Values are dynamic. Call `GET /v1/datasets/refs/crs_aeoi_id` to retrieve the current data dictionary, and use the returned entry's `key` as this parameter's value.
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/crs_aeoi_id
                    account_no:
                      type: string
                      description: Filters results by Account Number.
                    batch:
                      type: string
                      description: |-
                        Filters results by Batch.

                        Values are dynamic. Call `GET /v1/datasets/refs/crs_batch` to retrieve the current data dictionary, and use the returned entry's `key` as this parameter's value.
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/crs_batch
                    client_type:
