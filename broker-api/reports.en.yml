      summary: Export the report list under a batch
      tags:
        - 报表管理 (Reports)
      x-permission-key:
        - report.batch_export_reports_query
      x-lbonly: false
      description: |-
        Export batch report list records to a file. `filters` determines the export scope, and `down_fields` can limit the exported columns.

        ### Export modes

        - `mode: 0`: synchronous export; returns the download URL directly on success.
        - `mode: 1`: asynchronous export; returns a `file_download_id` first, then call `GET /v1/datasets/download/{id}` to obtain the download URL.
        - When the export record is no longer needed, call `DELETE /v1/datasets/download/{id}` to remove it.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: Same fields as the filters of report_batch_export_reports.yaml (the query capability).
                  properties:
                    title:
                      type: string
                mode:
                  type: integer
                  default: 0
                  description: Defaults to 0 (sync) when omitted.
                  enum:
                    - 0
                    - 1
                  x-enum-details:
                    - value: 0
                      label: Sync
                    - value: 1
                      label: Async
                  example: 0
                ext:
                  type: string
                  description: Supports csv/xlsx; defaults to csv.
                  enum:
                    - csv
                    - xlsx
                  example: csv
                file_name:
                  type: string
                remark:
                  type: string
                down_fields:
                  type: array
                  description: When omitted, all fields are exported; allowed values are listed under items.enum (the same field list as the query endpoint's data.list.items).
                  items:
                    type: string
                    enum:
                      - title
                      - file_type
                      - remark
                      - export_params
                    example: title
                ticket_content:
                  type: string
                  description: Shown to the approver when the template has a download-approval ticket configured.
                ticket_preview_url:
                  type: string
                hide:
                  type: integer
                  enum:
                    - 0
                    - 1
                  x-enum-details:
                    - value: 0
                      label: Not Hidden
                    - value: 1
                      label: Hidden
                  example: 0
            example:
              filters: {}
              mode: 0
              ext: csv
              file_name: ''
              remark: ''
              down_fields: []
              ticket_content: ''
              ticket_preview_url: ''
              hide: 0
      responses:
        '200':
          description: Export result. In sync mode the download URL is returned directly; in async mode a file_download_id is returned for subsequent polling.
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                    description: 0 means success; a non-zero value is a business error code (data is usually empty in that case). The HTTP status is always 200 — do not rely on the HTTP status to judge success or failure.
                    enum:
                      - 0
                    x-enum-details:
                      - value: 0
                        label: Success
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      url:
