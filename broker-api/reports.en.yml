  /v1/datasets/report_crs_logs:
    post:
      operationId: report_crs_logs
      summary: CRS Log Query
      tags:
        - 报表管理 (Reports)
      x-permission-key:
        - report.crs_tasks
      x-lbonly: false
      description: |-
        Queries the task logs for generating and submitting CRS reporting files, used to track task progress and trace operation history.

        ### Request parameters

        - Combine business filters through `filters` (available fields are described under the filters section below), and use `page`, `page_size`, and `orderBy` to control pagination and sorting.

        ### Business notes

        The data is CRS task execution records, organized by return year, AEOI ID, company name, batch, and task type.

        Each record carries the task type, execution status, start and end times (creation / update time), operator, generated file name and file serial number, and remarks.

        It is typically used to track the progress of CRS file generation and submission, investigate failed tasks, and trace operation history.

        ### Returns

        On success, returns the matching record list together with pagination information. See the response definition for the meaning of each returned column.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: Combines business filters. Omit a filter field to disable that filter.
                  properties:
                    company_name:
                      type: string
                      description: |-
                        Filters results by Company Name.

                        Values are dynamic. Call `GET /v1/datasets/refs/crs_company_name` to retrieve the current data dictionary, and use the returned entry's `key` as this parameter's value.
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/crs_company_name
                      example: LB Company
                    aeoi_id:
                      type: string
                      description: |-
                        Filters results by Aeoi Id.

                        Values are dynamic. Call `GET /v1/datasets/refs/crs_aeoi_id` to retrieve the current data dictionary, and use the returned entry's `key` as this parameter's value.
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/crs_aeoi_id
                      example: TT60994
                    return_year:
                      type: string
                      description: |-
                        Filters results by Return Year.

                        Values are dynamic. Call `GET /v1/datasets/refs/crs_return_year` to retrieve the current data dictionary, and use the returned entry's `key` as this parameter's value.
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/crs_return_year
                      example: '2025'
                    batch:
                      type: string
                      description: |-
                        Filters results by Batch.

                        Values are dynamic. Call `GET /v1/datasets/refs/crs_batch` to retrieve the current data dictionary, and use the returned entry's `key` as this parameter's value.
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/crs_batch
                      example: '14'
                    task_type:
                      type: string
                      description: Filters results by Task Type.
                      enum:
                        - '1'
                        - '2'
                        - '3'
                        - '4'
                      x-enum-details:
                        - value: '1'
                          label: Data Task
                        - value: '2'
                          label: Test File Task
                        - value: '3'
                          label: File Task
                        - value: '4'
                          label: Import History Data Task
                      example: Data Task
                page:
                  type: integer
                  description: Page number to retrieve, starting from `1`.
                page_size:
                  type: integer
                  description: Number of records to return per page.
            example:
              filters: {}
              page: 1
              page_size: 20
      responses:
        '200':
          description: On success, returns paginated CRS Log Query records together with pagination metadata such as the page number, page size, and total record count.
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                    description: |-
                      `0` indicates success. A non-zero value is a business error code, in which case
