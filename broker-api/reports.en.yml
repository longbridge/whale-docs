  /v1/datasets/report_export_batches/download:
    post:
      operationId: report_export_batches_download
      summary: Batch Print List Export
      tags:
        - 报表管理 (Reports)
      x-permission-key:
        - report.export_batches_query
      x-lbonly: false
      description: |-
        Export batch print records to a file. `filters` determines the export scope, and `down_fields` can limit the exported columns.

        ### Export modes

        - `mode: 0`: synchronous export; returns the download URL directly on success.
        - `mode: 1`: asynchronous export; returns a `file_download_id` first, then call `GET /v1/datasets/download/{id}` to obtain the download URL.
        - When the export record is no longer needed, call `DELETE /v1/datasets/download/{id}` to remove it.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: Same fields as the filters of report_export_batches.yaml (the query capability).
                  properties:
                    name:
                      type: string
                      description: Filters results by Batch Name.
                mode:
                  type: integer
                  default: 0
                  description: Defaults to `0` (synchronous mode) when omitted.
                  enum:
                    - 0
                    - 1
                  x-enum-details:
                    - value: 0
                      label: Sync
                    - value: 1
                      label: Async
                  example: 0
                ext:
                  type: string
                  description: Download file format. Defaults to `csv` when omitted.
                  enum:
                    - csv
                    - xlsx
                  x-enum-details:
                    - value: csv
                      label: CSV
                    - value: xlsx
                      label: Excel
                  example: csv
                file_name:
                  type: string
                  description: Export file name. The server generates a name when omitted.
                remark:
                  type: string
                  description: Remarks to save with this operation.
                down_fields:
                  type: array
                  description: |-
                    When omitted, all fields are exported; allowed values are listed under items.enum (the
                    same field list as the query endpoint's data.list.items).
                  items:
                    type: string
                    enum:
                      - id
                      - name
                      - sync_sftp
                      - sync_sftp_val
                      - auto_export_timing
                      - auto_export_timing_val
                      - report_num
                      - latest_export_user
                      - latest_export_user_val
                      - latest_exported_at
                      - creator
                      - creator_val
                      - created_date
                    example: id
                ticket_content:
                  type: string
                  description: Information shown to the approver when download approval is enabled for the template.
                ticket_preview_url:
                  type: string
                  description: Export approval detail URL. Used only when the export requires approval.
                hide:
                  type: integer
                  description: Whether to hide this export from the download-record list.
                  enum:
                    - 0
                    - 1
                  x-enum-details:
                    - value: 0
                      label: Not Hidden
                    - value: 1
                      label: Hidden
                  example: 0
            example:
              filters: {}
              mode: 0
              ext: csv
              file_name: ''
              remark: ''
              down_fields: []
              ticket_content: ''
              ticket_preview_url: ''
              hide: 0
      responses:
        '200':
          description: On success, returns information about the Batch Print List Export task. Synchronous exports provide a download URL directly; asynchronous exports provide `file_download_id` for subsequent status queries.
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                    description: |-
                      `0` indicates success. A non-zero value is a business error code, in which case
                      `data` is usually empty.

                      HTTP status codes use their standard semantics. A successful request normally
                      returns `200`; errors may return `400`, `401`, `403`, `408`, or another applicable
                      status. Interpret the HTTP status together with the business `code`.

                      - `401`: The user is not authenticated.
                      - `403`: The current account is not authorized to use this function. Grant access
                        through User Permission.
                    x-enum-details:
                      - value: 0
                        label: Success
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      url:
                        type: string
                        description: 'Returned in synchronous mode (`mode: 0`); empty in asynchronous mode.'
                      file_download_id:
                        type: string
                        description: |-
                          Returned in async mode (`mode: 1`); it is the `{id}` in
                          `GET /v1/datasets/download/{id}` / `DELETE /v1/datasets/download/{id}`: GET
                          obtains the final download URL, DELETE deletes the export record.
                      ticket_id:
                        type: string
                        description: '**Returned value:** Approval ticket ID. Returned only when the operation starts an approval workflow.'
              example:
                code: 0
                message: success
                data:
                  url: https://b-api.longbridge.xyz/download/export_result.csv
                  file_download_id: ''
                  ticket_id: ''
        '400':
          description: Bad request. Check the business error code in `code` and the error details in `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: The user is not authenticated, or the login session has expired.
