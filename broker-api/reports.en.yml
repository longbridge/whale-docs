  /v1/datasets/report_crs_records/download:
    post:
      operationId: report_crs_records_download
      summary: CRS Data Query Export
      tags:
      - 报表管理 (Reports)
      x-permission-key:
      - report.crs_data
      x-lbonly: false
      description: 'Exports CRS Data Query data to a file. `filters` defines the export
        scope, and `down_fields` can restrict the exported columns.


        ### Export modes


        - `mode: 0`: synchronous export; the download URL is returned directly on
        success.

        - `mode: 1`: asynchronous export; the API first returns `file_download_id`.
        Call `GET /v1/datasets/download/{id}` to obtain the download URL.

        - When the export record is no longer needed, delete it with `DELETE /v1/datasets/download/{id}`.'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: Same fields as the filters of report_crs_records.yaml
                    (the query capability).
                  properties:
                    return_year:
                      type: string
                      description: 'Filters results by Return Year.


                        Values are dynamic. Call `GET /v1/datasets/refs/crs_return_year`
                        to retrieve the current data dictionary, and use the returned
                        entry''s `key` as this parameter''s value.'
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/crs_return_year
                    message_type:
                      type: string
                      description: 'Filters results by Message Type.


                        **Allowed values:**

                        - `CRS701` - New [CRS701]

                        - `CRS702` - Corrections[CRS702]'
                      enum:
                      - CRS701
                      - CRS702
                      x-enum-details:
                      - value: CRS701
                        label: New [CRS701]
                      - value: CRS702
                        label: Corrections[CRS702]
                    aeoi_id:
                      type: string
                      description: 'Filters results by Aeoi Id.


                        Values are dynamic. Call `GET /v1/datasets/refs/crs_aeoi_id`
                        to retrieve the current data dictionary, and use the returned
                        entry''s `key` as this parameter''s value.'
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/crs_aeoi_id
                    account_no:
                      type: string
                      description: Filters results by Account Number.
                    batch:
                      type: string
