                  properties:
                    report_title:
                      type: string
                      description: 用于按「报表名称」筛选结果。
                    created_at:
                      type: object
                      description: 用于按「操作日期」筛选结果。
                      properties:
                        gte:
                          type: string
                          format: date
                          description: 筛选范围的下限，匹配值包含该值。
                        lte:
                          type: string
                          format: date
                          description: 筛选范围的上限，匹配值包含该值。
