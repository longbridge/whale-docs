openapi: 3.1.1
info:
  title: Whale OpenAPI (whale-openapi-docs 自动生成)
  version: 1.0.0
servers:
- url: https://b-api.longbridge.xyz
  description: 测试环境
- url: https://b-api.lbkrs.com
  description: 生产环境
security:
- bearerAuth: []
tags:
- name: 报表管理 (Reports)
  description: 各类财务及业务报表查询相关的后台管理接口。
paths:
  /crs/batch_delete_crs_data:
    post:
      operationId: batch_delete_crs_data
      summary: 批量删除 CRS 数据
      tags:
      - 报表管理 (Reports)
      x-permission-key:
      - report.crs_data
      x-lbonly: false
      description: '批量删除 CRS 数据。


        ### 请求参数


        - 必填：`id`（记录ID列表）

        - 各字段的格式、取值范围和业务含义见对应字段说明。


        ### 处理结果


        成功时完成上述业务操作；后续状态和返回数据以 `200` 响应定义为准。'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              properties:
                id:
                  type: array
                  description: 记录ID列表，以 JSON 数组形式提交。此字段为必填项。
                  items:
                    type: string
            example:
              id:
              - '123'
      responses:
        '200':
          description: 请求处理成功。响应的 `data` 不包含额外业务字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: '0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。


                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408`
                      等，需结合业务 `code`

                      判断具体结果。


                      - `401`：未登录。

                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。'
                    x-enum-details:
                    - value: 0
                      label: 成功
                  message:
                    type: string
                  data:
                    type: object
                    description: "成功时 `data` 为空对象。"
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登录或登录状态已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 当前账号未获得该功能授权。请在 User Permission 中为该账号开通相应权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 请求处理超时。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
  /crs/generate_crs_data:
    post:
      operationId: generate_crs_data
      summary: CRS 数据生成
      tags:
      - 报表管理 (Reports)
      x-permission-key:
      - report.crs_data
      x-lbonly: false
      description: '生成 CRS（Common Reporting Standard）数据。


        ### 请求参数


        - 必填：`return_year`（申报年度）、`aeoi_id`（AEOI ID）

        - 可选：`company_name`（公司名称）、`retain_has_asset`（是否保留有资产的数据）、`account_state`（账户状态筛选）

        - 各字段的格式、取值范围和业务含义见对应字段说明。


        ### 处理结果


        成功时触发 CRS 数据生成；响应的 `data` 不包含额外业务字段。'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - return_year
              - aeoi_id
              properties:
                return_year:
                  type: integer
                  description: CRS 数据的申报年度。此字段为必填项。
                  example: 2024
                aeoi_id:
                  type: string
                  description: AEOI（Automatic Exchange of Information）标识。此字段为必填项。
                company_name:
                  type: string
                  description: 申报主体公司名称。
                retain_has_asset:
                  type: boolean
                  description: 是否仅保留有资产的数据。
                account_state:
                  type: array
                  description: 按账户状态筛选，以字符串数组形式提交，不传时不按账户状态过滤。
                  items:
                    type: string
            example:
              return_year: 2024
              aeoi_id: ''
              company_name: ''
              retain_has_asset: false
              account_state: []
      responses:
        '200':
          description: 请求处理成功。响应的 `data` 不包含额外业务字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: '0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。


                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408`
                      等，需结合业务 `code`

                      判断具体结果。


                      - `401`：未登录。

                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。'
                    x-enum-details:
                    - value: 0
                      label: 成功
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      id:
                        type: string
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登录或登录状态已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 当前账号未获得该功能授权。请在 User Permission 中为该账号开通相应权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 请求处理超时。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
  /crs/get_controlling_persons:
    post:
      operationId: get_controlling_persons
      summary: 查询实控人
      tags:
      - 报表管理 (Reports)
      x-permission-key:
      - report.crs_data
      x-lbonly: false
      description: '根据 `account_no` 查询实控人。


        ### 请求参数


        - 必填：`account_no`（账户号）


        ### 处理结果


        成功时返回该账户对应的实控人信息；响应的 `data` 承载实控人数据。'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - account_no
              properties:
                account_no:
                  type: string
                  description: 要查询实控人的账户号。此字段为必填项。
            example:
              account_no: ''
      responses:
        '200':
          description: 请求处理成功。业务结果位于 `data`，承载该账户的实控人信息。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: '0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。


                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408`
                      等，需结合业务 `code`

                      判断具体结果。


                      - `401`：未登录。

                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。'
                    x-enum-details:
                    - value: 0
                      label: 成功
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      list:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            account_no:
                              type: string
                            res_country_code:
                              type: string
                            country_code:
                              type: string
                            tin:
                              type: string
                            first_name:
                              type: string
                            last_name:
                              type: string
                            address:
                              type: string
                            birthday:
                              type: string
                            type:
                              type: string
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登录或登录状态已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 当前账号未获得该功能授权。请在 User Permission 中为该账号开通相应权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 请求处理超时。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
  /v1/datasets/report_crs_records:
    post:
      operationId: report_crs_records
      summary: CRS 数据查询
      tags:
      - 报表管理 (Reports)
      x-permission-key:
      - report.crs_data
      x-lbonly: false
      description: '查询「CRS 数据查询」数据，可通过 `filters` 组合业务筛选条件，并使用 `page`、`page_size` 控制分页。


        ### 返回结果


        成功时返回匹配的记录列表及分页信息。各过滤字段的用途、可选值和动态数据来源见对应字段说明。'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 组合业务过滤条件。省略某个过滤字段时，不按该字段筛选。
                  properties:
                    return_year:
                      type: string
                      description: '用于按「年度」筛选结果。


                        候选值会动态变化。请调用 `GET /v1/datasets/refs/crs_return_year` 获取当前可用的数据字典，并使用返回项的
                        `key` 作为本参数值。'
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/crs_return_year
                    message_type:
                      type: string
                      description: '用于按「消息类型」筛选结果。


                        **可选值：**

                        - `CRS701` - 表示新信息 [CRS701]

                        - `CRS702` - 表示更正消息 [CRS702]'
                      enum:
                      - CRS701
                      - CRS702
                      x-enum-details:
                      - value: CRS701
                        label: 新信息 [CRS701]
                      - value: CRS702
                        label: 更正消息 [CRS702]
                    aeoi_id:
                      type: string
                      description: '用于按「编号」筛选结果。


                        候选值会动态变化。请调用 `GET /v1/datasets/refs/crs_aeoi_id` 获取当前可用的数据字典，并使用返回项的
                        `key` 作为本参数值。'
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/crs_aeoi_id
                    account_no:
                      type: string
                      description: 用于按「证券账号」筛选结果。
                    batch:
                      type: string
                      description: '用于按「批次」筛选结果。


                        候选值会动态变化。请调用 `GET /v1/datasets/refs/crs_batch` 获取当前可用的数据字典，并使用返回项的
                        `key` 作为本参数值。'
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/crs_batch
                    client_type:
                      type: string
                      description: '用于按「客户类型」筛选结果。


                        **可选值：**

                        - `P` - 表示个人

                        - `O` - 表示机构'
                      enum:
                      - P
                      - O
                      x-enum-details:
                      - value: P
                        label: 个人
                      - value: O
                        label: 机构
                    doc_type:
                      type: string
                      description: '用于按「文档类型」筛选结果。


                        **可选值：**

                        - `OECD1` - 表示新上传数据 [OECD1]

                        - `OECD2` - 表示更正数据 [OECD2]

                        - `OECD3` - 表示删除数据 [OECD3]'
                      enum:
                      - OECD1
                      - OECD2
                      - OECD3
                      x-enum-details:
                      - value: OECD1
                        label: 新上传数据 [OECD1]
                      - value: OECD2
                        label: 更正数据 [OECD2]
                      - value: OECD3
                        label: 删除数据 [OECD3]
                    message:
                      type: string
                      description: '用于按「消息编号」筛选结果。


                        候选值会动态变化。请调用 `GET /v1/datasets/refs/crs_message_id` 获取当前可用的数据字典，并使用返回项的
                        `key` 作为本参数值。'
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/crs_message_id
                    account_state:
                      type: string
                      description: '用于按「账户状态」筛选结果。


                        支持多选；提交时使用英文逗号（`,`）拼接多个值。不传时不按此字段筛选。


                        **可选值：**

                        - `-1` - 表示已注销

                        - `0` - 表示未激活

                        - `1` - 表示激活

                        - `99` - 表示冻结

                        - `4` - 表示暂停

                        - `5` - 表示休眠'
                      example: -1,0
                      enum:
                      - '-1'
                      - '0'
                      - '1'
                      - '99'
                      - '4'
                      - '5'
                      x-enum-details:
                      - value: '-1'
                        label: 已注销
                      - value: '0'
                        label: 未激活
                      - value: '1'
                        label: 激活
                      - value: '99'
                        label: 冻结
                      - value: '4'
                        label: 暂停
                      - value: '5'
                        label: 休眠
                page:
                  type: integer
                  description: 要查询的页码，从 `1` 开始。
                page_size:
                  type: integer
                  description: 每页返回的记录数量。
            example:
              filters: {}
              page: 1
              page_size: 20
      responses:
        '200':
          description: 成功时分页返回「CRS 数据查询」记录，以及页码、每页数量和总记录数等分页信息。
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - data
                properties:
                  code:
                    type: integer
                    description: '0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。


                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408`
                      等，需结合业务 `code`

                      判断具体结果。


                      - `401`：未登录。

                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。'
                    x-enum-details:
                    - value: 0
                      label: 成功
                  message:
                    type: string
                  data:
                    type: object
                    required:
                    - list
                    - total
                    properties:
                      list:
                        type: array
                        description: '**返回值：** 列表列表。'
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: '**返回值：** 当前记录的唯一标识。'
                            return_year:
                              type: string
                              description: '**返回值：** 年度。'
                            batch:
                              type: string
                              description: '**返回值：** 批次。'
                            doc_type:
                              type: string
                              description: '**返回值：** 文档类型。'
                            doc_type_val:
                              type: string
                              description: 字段 doc_type 的原始值：doc_type 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            aeoi_id:
                              type: string
                              description: '**返回值：** 编号。'
                            message:
                              type: string
                              description: '**返回值：** 消息编号。'
                            message_type:
                              type: string
                              description: '**返回值：** 消息类型。'
                            message_type_val:
                              type: string
                              description: 字段 message_type 的原始值：message_type 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            account_batch:
                              type: string
                              description: '**返回值：** 客户批次。'
                            account_no:
                              type: string
                              description: '**返回值：** 证券账号。'
                            client_type:
                              type: string
                              description: '**返回值：** 客户类型。'
                            client_type_val:
                              type: string
                              description: 字段 client_type 的原始值：client_type 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            entity_type:
                              type: string
                              description: '**返回值：** 企业实体。'
                            entity_type_val:
                              type: string
                              description: 字段 entity_type 的原始值：entity_type 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            tax_id:
                              type: string
                              description: '**返回值：** 纳税人识别号。'
                            tax_country:
                              type: string
                              description: '**返回值：** 报税国家代码。'
                            last_name:
                              type: string
                              description: '**返回值：** 姓。'
                            first_name:
                              type: string
                              description: '**返回值：** 名。'
                            region:
                              type: string
                              description: '**返回值：** 居住国家。'
                            address:
                              type: string
                              description: '**返回值：** 客户地址。'
                            birth_date:
                              type: string
                              description: '**返回值：** 生日；时间或日期格式以接口实际返回值为准。'
                            total_asset:
                              type: string
                              description: '**返回值：** 财务余额。'
                            currency:
                              type: string
                              description: '**返回值：** 货币。'
                            account_state:
                              type: string
                              description: '**返回值：** 账户状态。'
                            account_state_val:
                              type: string
                              description: 字段 account_state 的原始值：account_state 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            payment_type1:
                              type: string
                              description: '**返回值：** 支付类型 1。'
                            payment_amount1:
                              type: string
                              description: '**返回值：** 支付金额 1。'
                            payment_type2:
                              type: string
                              description: '**返回值：** 支付类型 2。'
                            payment_amount2:
                              type: string
                              description: '**返回值：** 支付金额 2。'
                            payment_type3:
                              type: string
                              description: '**返回值：** 支付类型 3。'
                            payment_amount3:
                              type: string
                              description: '**返回值：** 支付金额 3。'
                            payment_type4:
                              type: string
                              description: '**返回值：** 支付类型 4。'
                            payment_amount4:
                              type: string
                              description: '**返回值：** 支付金额 4。'
                            status:
                              type: string
                              description: '**返回值：** 状态。'
                            status_val:
                              type: string
                              description: 字段 status 的原始值：status 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            lock:
                              type: string
                              description: '**返回值：** 锁定状态。'
                            lock_val:
                              type: string
                              description: 字段 lock 的原始值：lock 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                      total:
                        type: integer
                        description: '**返回值：** 符合查询条件的记录总数，用于计算分页。'
              example:
                code: 0
                message: success
                data:
                  list:
                  - id: '41435209'
                    return_year: '2025'
                    batch: '7'
                    doc_type: New Data [OECD1]
                    doc_type_val: OECD1
                    aeoi_id: TT60994
                    message: 2025TT609942026062608421307
                    message_type: New [CRS701]
                    message_type_val: CRS701
                    account_batch: '1'
                    account_no: '****0000'
                    client_type: Person
                    client_type_val: P
                    entity_type: Reportable Person
                    entity_type_val: person_reportable
                    tax_id: '123456789'
                    tax_country: CN
                    last_name: NFN
                    first_name: ''
                    region: HK
                    address: 示例地址 Example Address
                    birth_date: 1959-07-19
