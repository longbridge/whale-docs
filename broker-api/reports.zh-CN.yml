                      等，需结合业务 `code`

                      判断具体结果。


                      - `401`：未登录。

                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。'
                    x-enum-details:
                    - value: 0
                      label: 成功
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      url:
                        type: string
                        description: '同步模式（`mode: 0`）下返回，异步模式下为空'
