  /v1/datasets/booking_va_contracts:
    post:
      operationId: booking_va_contracts
      summary: 合约查询
      tags:
        - 虚拟资产管理
      x-permission-key:
        - lb_hk_clearing.billing_va_contracts
      x-lbonly: false
      description: |-
        查询虚拟资产清算合约，用于虚拟资产成交的清算计费与交收核对。

        ### 请求参数

        - 通过 `filters` 组合业务筛选条件（可选字段见下方 filters 字段说明），并使用 `page`、`page_size`、`orderBy` 控制分页与排序。

        ### 业务说明

        数据来自虚拟资产清算合约及其对应的费用记录，每条合约对应一笔成交的清算与计费单据。

        每条记录包含合约号、交易日期与账务日期、证券账号与大账号、结算渠道、市场、证券代码、交易方向、交易数量与金额、币种，以及计费金额、应收 / 实收 / 抵扣金额等费用信息。

        合约状态反映清算生命周期：初始化 → 待收费 → 待交收 → 货已交收（T+M）→ 交收完成（T+N）。

        常用于按客户、市场、证券、交易日期或状态排查成交清算与费用收取情况。

        ### 返回结果

        成功时返回匹配的记录列表及分页信息。返回列含义见响应定义。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 过滤条件. 组合业务过滤条件。省略某个过滤字段时，不按该字段筛选。
                  properties:
                    'no':
                      type: string
                      description: 合约号. 用于按「合约号」筛选结果。
                      example: VA2026071410002
                    aaid:
                      type: string
                      description: 客户. 用于按「客户」筛选结果。
                    contract.trade_date:
                      type: object
                      description: 交易日期. 用于按「交易日期」筛选结果。
                      properties:
                        gte:
                          type: string
                          description: 大于等于. 筛选范围的下限，匹配值包含该值。
                          format: date
                        lte:
                          type: string
                          description: 小于等于. 筛选范围的上限，匹配值包含该值。
                          format: date
                    market:
                      type: string
                      description: |-
                        市场. 用于按「市场」筛选结果。

                        候选值会动态变化。请调用 `GET /v1/datasets/refs/clearing_config_markets` 获取当前可用的数据字典，并使用返回项的 `key` 作为本参数值。
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/clearing_config_markets
                      example: OSL
                    counter_id:
                      type: string
                      description: 证券代码. 用于按「证券代码」筛选结果。
                      example: VA/OSL/BTCUSD
                    direction:
                      type: string
                      description: 方向. 用于按「方向」筛选结果。
                      enum:
                        - '1'
                        - '2'
                      x-enum-details:
                        - value: '1'
                          label: 买
                        - value: '2'
                          label: 卖
                      example: Sell
                    settlement_channel:
                      type: string
                      description: |-
                        结算渠道. 用于按「结算渠道」筛选结果。

                        候选值会动态变化。请调用 `GET /v1/datasets/refs/billing_settlement_channel` 获取当前可用的数据字典，并使用返回项的 `key` 作为本参数值。
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/billing_settlement_channel
                      example: settlement_osl_hk &  OSL  DT
                    state:
                      type: string
                      description: 状态. 用于按「状态」筛选结果。
                      enum:
                        - '2'
                        - '3'
                        - '4'
                        - '5'
                        - '6'
                        - '1'
                        - '-1'
                      x-enum-details:
                        - value: '2'
                          label: 待计费
                        - value: '3'
                          label: 待收费
                        - value: '4'
                          label: 待交收
                        - value: '5'
                          label: 交收完成
                        - value: '6'
                          label: 券已交收
                        - value: '1'
                          label: 初始化
                        - value: '-1'
                          label: --
                      example: Settlement Completed
                    currency:
                      type: string
                      description: |-
                        币种. 用于按「币种」筛选结果。

                        候选值会动态变化。请调用 `GET /v1/datasets/refs/tenant_currencies` 获取当前可用的数据字典，并使用返回项的 `key` 作为本参数值。
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/tenant_currencies
                      example: USD
                page:
                  type: integer
                  description: 页码. 要查询的页码，从 `1` 开始。
                page_size:
                  type: integer
                  description: 每页数量. 每页返回的记录数量。
                orderBy:
                  type: array
                  description: 排序参数. 排序规则数组；每一项定义一个排序字段及排序方向。
                  items:
                    type: object
            example:
              filters: {}
              page: 1
              page_size: 20
              orderBy: []
      responses:
        '200':
          description: 成功时分页返回「虚拟资产合约」记录，以及页码、每页数量和总记录数等分页信息。
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。

                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`
                      判断具体结果。

                      - `401`：未登录。
                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。
                  message:
                    type: string
                  data:
                    type: object
                    required:
                      - list
                      - total
                    properties:
                      list:
                        type: array
                        description: 列表. **返回值：** 列表列表。
                        items:
                          type: object
                          properties:
                            'no':
                              type: string
                              description: 合约号. **返回值：** 合约号。
                            ledger_date:
                              type: string
                              description: 账务日期. **返回值：** 账务日期；时间或日期格式以接口实际返回值为准。
                            trade_date:
                              type: string
                              description: 交易日期. **返回值：** 交易日期；时间或日期格式以接口实际返回值为准。
                            aaid:
                              type: string
                              description: 证券账号. **返回值：** 证券账号。
                            aaid_val:
                              type: string
                              description: 证券账号（原始值）. 字段 aaid 的原始值：aaid 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            settlement_account:
                              type: string
                              description: 大账号. **返回值：** 大账号。
                            settlement_channel:
                              type: string
                              description: 结算渠道. **返回值：** 结算渠道。
                            settlement_channel_val:
                              type: string
                              description: 结算渠道（原始值）. 字段 settlement_channel 的原始值：settlement_channel 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            market:
                              type: string
                              description: 市场. **返回值：** 市场。
                            counter_id:
                              type: string
                              description: 证券代码. **返回值：** 证券代码。
                            direction:
                              type: string
                              description: 交易方向. **返回值：** 交易方向。
                            direction_val:
                              type: string
                              description: 交易方向（原始值）. 字段 direction 的原始值：direction 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            trade_quantity:
                              type: string
                              description: 交易数量. **返回值：** 交易数量。
                            trade_amount:
                              type: string
                              description: 交易金额. **返回值：** 交易金额。
                            currency:
                              type: string
                              description: 币种. **返回值：** 币种。
                            bill_amount:
                              type: string
                              description: 实收金额. **返回值：** 实收金额。
                            calculate_out_amount:
                              type: string
                              description: 计费金额. **返回值：** 计费金额。
                            deduction_amount:
                              type: string
                              description: 抵扣金额. **返回值：** 抵扣金额。
                            receivable_amount:
                              type: string
                              description: 应收金额. **返回值：** 应收金额。
                            state:
                              type: string
                              description: 状态. **返回值：** 状态。
                            state_val:
                              type: string
                              description: 状态（原始值）. 字段 state 的原始值：state 返回的是经字典/关联表映射解析后的可读展示值，本字段返回映射前的原始编码/ID。
                            updated_at:
                              type: string
                              description: 最后更新时间. **返回值：** 最后更新时间；时间或日期格式以接口实际返回值为准。
                      total:
                        type: integer
                        description: 总条数. **返回值：** 符合查询条件的记录总数，用于计算分页。
              example:
                code: 0
                message: success
                data:
                  list:
                    - 'no': VA2026071410002
                      ledger_date: '20260713'
                      trade_date: 2026-07-10
                      aaid: H00000000
                      aaid_val: '10000000'
                      settlement_account: 37633033-836c-41ed-b35e-30cee924f62a
                      settlement_channel: settlement_osl_hk &  OSL  DT
                      settlement_channel_val: '16'
                      market: OSL
                      counter_id: VA/OSL/BTCUSD
                      direction: Sell
                      direction_val: '2'
                      trade_quantity: '1'
                      trade_amount: '70000'
                      currency: USD
                      bill_amount: '0.001'
                      calculate_out_amount: '0.001'
                      deduction_amount: '0'
                      receivable_amount: '0.001'
