        ### 请求参数

        - 本接口无必填参数，无请求体。

        ### 业务说明

        触发后系统会主动获取最新的虚拟资产头寸，用于更新头寸管理数据。

        ### 处理结果

        成功时完成头寸获取的触发；后续状态和返回数据以 `200` 响应定义为准。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 请求处理成功。响应的 `data` 不包含额外业务字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。

                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`
                      判断具体结果。

                      - `401`：未登录。
                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。
                  message:
                    type: string
                  data:
                    type: object
                    description: 成功时 `data` 为空对象。
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登录或登录状态已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 当前账号未获得该功能授权。请在 User Permission 中为该账号开通相应权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 请求处理超时。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
      x-mint:
        href: /zh-CN/api-reference/billing_va_trigger_balance
        metadata:
          sidebarTitle: 触发获取虚拟资产头寸
  /billing-va/update/balance/alarm/config:
    post:
      operationId: update_balance_alarm_config
      summary: 更新头寸告警配置
      tags:
        - 虚拟资产管理
      x-permission-key:
        - assets.position_anagement_inquiry_operation
      x-lbonly: false
      description: |-
        更新虚拟资产头寸告警配置，调整触发提示与拦截的头寸阈值。

        ### 请求参数

        - 必填：`prompt_pos`（提示阈值）、`intercepted_pos`（拦截阈值）、`id`（记录 ID）
        - 各字段的格式、取值范围和业务含义见对应字段说明。

        ### 业务说明

        通过 `id` 定位待更新的告警配置记录，`prompt_pos` 用于触发提示，`intercepted_pos` 用于触发拦截，更新后按新阈值进行头寸监控。

        ### 风险提示

        此操作会修改头寸告警的生效阈值，影响后续监控与拦截行为。调用前请确认目标记录和阈值无误。

        ### 处理结果

        成功时完成告警配置的更新；后续状态和返回数据以 `200` 响应定义为准。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - prompt_pos
                - intercepted_pos
                - id
              properties:
                prompt_pos:
                  type: string
                  description: 提示阈值. 用于指定「提示阈值」。此字段为必填项。
                intercepted_pos:
                  type: string
                  description: 拦截阈值. 用于指定「拦截阈值」。此字段为必填项。
                id:
                  type: string
                  description: 记录ID. 记录ID，用于标识本次请求关联的业务对象。此字段为必填项。
            example:
              prompt_pos: ''
              intercepted_pos: ''
              id: '123'
      responses:
        '200':
          description: 请求处理成功。响应的 `data` 不包含额外业务字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。

                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`
                      判断具体结果。

                      - `401`：未登录。
                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登录或登录状态已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 当前账号未获得该功能授权。请在 User Permission 中为该账号开通相应权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 请求处理超时。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
      x-mint:
        href: /zh-CN/api-reference/update_balance_alarm_config
        metadata:
          sidebarTitle: 更新头寸告警配置
  /v1/atm/va/delete/broker/wallet:
    delete:
      operationId: va_delete_broker_wallet
      summary: 删除渠道存管钱包
      tags:
        - 虚拟资产管理
      x-permission-key:
        - atm.va_channel_custodial_account_operation
      x-lbonly: false
      description: |-
        删除指定的渠道存管钱包记录。

        ### 请求参数

        - 必填：`id`（记录 ID）
        - 可选：`audit_frontend_resource`（调用方提供的审计上下文）
        - 各字段的格式、取值范围和业务含义见对应字段说明。

        ### 业务说明

        通过 `id` 定位并删除对应的渠道存管钱包记录，删除后该钱包不再用于存管相关业务。

        ### 风险提示

        此操作会永久删除渠道存管钱包记录，可能影响相关资金存管与业务处理。调用前请确认目标记录无误。

        ### 处理结果

        成功时完成渠道存管钱包的删除；后续状态和返回数据以 `200` 响应定义为准。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
              properties:
                id:
                  type: string
                  description: 记录ID. 记录ID，用于标识本次请求关联的业务对象。此字段为必填项。
                audit_frontend_resource:
                  type: object
                  description: 审计上下文. 调用方提交的审计上下文，用于记录本次操作。
            example:
              id: '123'
      responses:
        '200':
          description: 请求处理成功。响应的 `data` 不包含额外业务字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。

                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`
                      判断具体结果。

                      - `401`：未登录。
                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      ok:
                        type: boolean
                      id:
                        type: string
                      tip:
                        type: string
                        description: 提示信息，根据业务情况使用
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登录或登录状态已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 当前账号未获得该功能授权。请在 User Permission 中为该账号开通相应权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 请求处理超时。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
      x-mint:
        href: /zh-CN/api-reference/va_delete_broker_wallet
        metadata:
          sidebarTitle: 删除渠道存管钱包
  /v1/atm/va/delete/coin/deposit/application:
    delete:
      operationId: va_delete_coin_deposit_application
      summary: 删除入币申请
      tags:
        - 虚拟资产管理
      x-permission-key:
        - atm.va_crypto_currency_deposit_application_operation
      x-lbonly: false
      description: |-
        删除指定的入币申请记录。

        ### 请求参数

        - 必填：`id`（记录 ID）
        - 可选：`audit_frontend_resource`（调用方提供的审计上下文）
        - 各字段的格式、取值范围和业务含义见对应字段说明。

        ### 业务说明

        通过 `id` 定位并删除对应的入币申请记录，删除后该申请不再参与后续入币处理。

        ### 风险提示

        此操作会永久删除入币申请记录，可能影响相关入币流程。调用前请确认目标记录无误。

        ### 处理结果

