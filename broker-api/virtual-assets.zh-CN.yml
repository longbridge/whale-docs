  /v1/datasets/va_coin_withdraw_applications:
    post:
      operationId: va_coin_withdraw_applications
      summary: 出币申请
      tags:
        - 虚拟资产管理
      x-permission-key:
        - atm.crypto_currency_withdrawal_application_inquiry
      x-lbonly: false
      description: |-
        查询客户提交的虚拟资产出币（提现）申请，用于运营人员核对与跟进出币申请的审批与处理进度。

        ### 请求参数

        - 通过 `filters` 组合业务筛选条件（可选字段见下方 filters 字段说明），并使用 `page`、`page_size`、`orderBy` 控制分页与排序。

        ### 业务说明

        数据来源为客户发起的虚拟资产出币申请记录，一条记录对应一笔提现申请。

        每条记录包含申请编号、客户编号、证券账号、出币币种（`coin`）与所在公链（如 Tron、Polygon）、客户收款钱包地址、申请数量与实际净到账数量、各项手续费与定价汇率、命中的审核规则、链上交易哈希以及上游券商与申请状态（如 `Success`、`Rejected`）。

        可按申请编号、客户编号、证券账号、货币代码、状态、创建时间等条件筛选，便于核对单笔出币的审批结果与链上处理进度。

        ### 返回结果

        成功时返回匹配的记录列表及分页信息。返回列含义见响应定义。
