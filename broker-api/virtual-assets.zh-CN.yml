  /bankcore/trigger/va-deposit:
    post:
      operationId: bankcore_trigger_va_deposit
      summary: 手动触发 VA 入币账单拉取
      tags:
        - 虚拟资产管理
      x-permission-key:
        - atm.va_crypto_currency_deposit_application_inquiry
      x-lbonly: false
      description: 手动触发虚拟资产入币账单拉取，可按渠道、钱包和时间范围（毫秒时间戳）过滤。写操作。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bank_code:
                  type: string
                  description: 渠道编码
                wallet_id:
                  type: string
                  description: 钱包 ID
                start_time:
                  type: integer
                  description: 开始时间. 毫秒时间戳。
                end_time:
                  type: integer
                  description: 结束时间. 毫秒时间戳。
