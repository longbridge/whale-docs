                        - value: success
                          label: 成功
                        - value: failed
                          label: 失败
                        - value: canceling
                          label: 撤销中
                        - value: cancelled
                          label: 撤销成功
                        - value: cancel_failed
                          label: 撤销失败
                        - value: refunding
                          label: 退款中
                        - value: refunded
                          label: 退款成功
                        - value: refund_failed
                          label: 退款失败
                    created_at:
                      type: object
                      description: 创建时间. 用于按「创建时间」筛选结果。
                      properties:
