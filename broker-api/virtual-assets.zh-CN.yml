openapi: 3.1.1
info:
  title: Longport Whale 券商 API
  description: 面向使用 Longport Whale 的券商提供机构级服务端 API。
  version: 2.0.0
servers:
  - url: https://b-api.longbridge.xyz
    description: 测试环境
  - url: https://b-api.lbkrs.com
    description: 生产环境
security:
  - bearerAuth: []
tags:
  - name: 虚拟资产管理
paths:
  /billing/va/current_busin:
    get:
      operationId: billing_va_current_busin
      summary: 查询当前虚拟资产清算业务状态
      tags:
        - 虚拟资产管理
      x-permission-key:
        - lb_hk_clearing.billing_va_contracts
      x-lbonly: false
      description: |-
        查询当前虚拟资产清算业务所处的状态，用于了解清算流程当前进行到哪个阶段。

        ### 请求参数

        - 本接口无必填参数。

        ### 返回结果

        成功时返回当前虚拟资产清算业务的状态信息。字段含义见下方响应定义。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 请求处理成功。业务结果位于 `data`，包含 `records` 字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。

                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`
                      判断具体结果。

                      - `401`：未登录。
                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      records:
                        type: array
                        description: 清算步骤列表. **返回值：** 清算步骤列表列表。
                        items:
                          type: object
                          properties:
                            state:
                              type: number
                              description: 步骤状态. 0=待执行 1=执行中 2=成功 3=失败
                              enum:
                                - '0'
                                - '1'
                                - '2'
                                - '3'
                              x-enum-details:
                                - value: '0'
                                  label: 待执行
                                - value: '1'
                                  label: 执行中
                                - value: '2'
                                  label: 成功
                                - value: '3'
                                  label: 失败
              example:
                code: 0
                message: success
                data:
                  records:
                    - state: 0
        '400':
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登录或登录状态已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 当前账号未获得该功能授权。请在 User Permission 中为该账号开通相应权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 请求处理超时。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
      x-mint:
        href: /zh-CN/api-reference/billing_va_current_busin
        metadata:
          sidebarTitle: 查询当前虚拟资产清算业务状态
  /billing/va/trigger:
    post:
      operationId: billing_va_trigger
      summary: 触发虚拟资产清算
      tags:
        - 虚拟资产管理
      x-permission-key:
        - lb_hk_clearing.billing_va_contracts
      x-lbonly: false
      description: |-
        按指定业务日期启动虚拟资产清算流程。

        ### 请求参数

        - 必填：`biz_date`（业务日期）
        - 各字段的格式、取值范围和业务含义见对应字段说明。

        ### 业务说明

        以 `biz_date` 为清算周期启动对应的虚拟资产清算流程，触发后系统将对该业务日期的数据进行清算处理。

        ### 风险提示

        此操作会真实触发清算流程，影响相关资金与账务处理。调用前请确认 `biz_date` 无误。

        ### 处理结果

        成功时完成清算流程的触发；后续状态和返回数据以 `200` 响应定义为准。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - biz_date
              properties:
                biz_date:
                  type: string
                  description: 业务日期. 本次请求对应的业务日期。请按接口约定的日期格式提交。此字段为必填项。
            example:
              biz_date: 2026-07-10
      responses:
        '200':
          description: 请求处理成功。响应的 `data` 不包含额外业务字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。

                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`
                      判断具体结果。

                      - `401`：未登录。
                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登录或登录状态已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 当前账号未获得该功能授权。请在 User Permission 中为该账号开通相应权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 请求处理超时。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
      x-mint:
        href: /zh-CN/api-reference/billing_va_trigger
        metadata:
          sidebarTitle: 触发虚拟资产清算
  /billing/va/pass_trade_match:
    post:
      operationId: va_pass_trade_match
      summary: 交易匹配审核
      tags:
        - 虚拟资产管理
      x-permission-key:
        - lb_hk_clearing.billing_va_contracts
      x-lbonly: false
      description: |-
        对指定业务日期的虚拟资产成交配对进行人工审核通过，确认该业务日期的成交匹配结果无误后放行至后续处理。

        ### 请求参数

        - 必填：`biz_date`（业务日期）
        - 各字段的格式、取值范围和业务含义见对应字段说明。

        ### 业务说明

        审核通过后，该 `biz_date` 的成交配对结果将被确认，进入清算等后续环节。

        ### 风险提示

        此操作会确认真实成交配对结果并推动后续账务处理。调用前请确认 `biz_date` 及对应的配对结果无误。

        ### 处理结果

        成功时完成该业务日期的交易匹配审核通过；后续状态和返回数据以 `200` 响应定义为准。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - biz_date
              properties:
                biz_date:
                  type: integer
                  description: 业务日期. 清算业务日期，整型（`YYYYMMDD`）。
                  x-format: date-int-yyyymmdd
            example:
              biz_date: 20260101
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: 0 表示成功；非 0 为业务错误码，此时 data 通常为空。HTTP 状态码本身恒为 200，请勿依赖 HTTP status 判断成功/失败。
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400': &id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`
        '401': &id002
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
          description: 未登录或登录状态已失效
        '403': &id003
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
          description: 当前账号未获得该功能授权。请在 User Permission 中为该账号开通相应权限
        '408': &id004
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
          description: 请求处理超时。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`
      x-mint:
        href: /zh-CN/api-reference/va_pass_trade_match
        metadata:
          sidebarTitle: 交易匹配审核
  /billing-va/trigger/balance:
    post:
      operationId: billing_va_trigger_balance
