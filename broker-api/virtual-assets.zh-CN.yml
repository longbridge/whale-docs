        数据来自实际到账或在途的入币（充值）明细。

        每条记录包含编号、加款单号、证券账号、客户编号与姓名、存管账户、客户钱包地址、货币代码、链类型、计价货币、数量、充值地址、状态与渠道。

        渠道返回信息包含渠道状态、失败原因与退款单号；流水号包含区块链唯一识别号、消息 ID 与转账流水号；时间涵盖创建、转账发起、渠道入账、转账修改与更新时间。

        常用于按加款单号、客户编号、货币代码、状态或创建时间跟踪单笔入币的上账进度与异常原因。

        ### 返回结果

        成功时返回匹配的记录列表及分页信息。返回列含义见响应定义。
