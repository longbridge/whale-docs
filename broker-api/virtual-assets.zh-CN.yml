openapi: 3.1.1
info:
  title: Longport Whale 券商 API
  description: 面向使用 Longport Whale 的券商提供机构级服务端 API。
  version: 2.0.0
servers:
  - url: https://b-api.longbridge.xyz
    description: 测试环境
  - url: https://b-api.lbkrs.com
    description: 生产环境
security:
  - bearerAuth: []
tags:
  - name: 虚拟资产管理
paths:
  /billing/va/current_busin:
    get:
      operationId: billing_va_current_busin
      summary: 查询当前虚拟资产清算业务状态
      tags:
        - 虚拟资产管理
      x-permission-key:
        - lb_hk_clearing.billing_va_contracts
      x-lbonly: false
      description: |-
        查询当前虚拟资产清算业务状态。

        ### 请求参数

        该接口不接收业务参数。

        ### 处理结果

        成功时返回查询结果；响应字段及其含义见 `200` 响应定义。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 请求处理成功。业务结果位于 `data`，包含 `records` 字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。

                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`
                      判断具体结果。

                      - `401`：未登录。
                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      records:
                        type: array
                        description: 清算步骤列表. **返回值：** 清算步骤列表列表。
                        items:
                          type: object
                          properties:
                            state:
                              type: number
                              description: |-
                                步骤状态. 0=待执行 1=执行中 2=成功 3=失败

                                **可选值：**
                                - `0` - 表示待执行
                                - `1` - 表示执行中
                                - `2` - 表示成功
                                - `3` - 表示失败
                              enum:
                                - '0'
                                - '1'
                                - '2'
                                - '3'
              example:
                code: 0
                message: success
                data:
                  records:
                    - state: 0
        '400':
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登录或登录状态已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 当前账号未获得该功能授权。请在 User Permission 中为该账号开通相应权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 请求处理超时。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
      x-mint:
        href: /zh-CN/api-reference/billing_va_current_busin
        metadata:
          sidebarTitle: 查询当前虚拟资产清算业务状态
  /billing/va/trigger:
    post:
      operationId: billing_va_trigger
      summary: 触发虚拟资产清算
      tags:
        - 虚拟资产管理
      x-permission-key:
        - lb_hk_clearing.billing_va_contracts
      x-lbonly: false
      description: |-
        触发虚拟资产清算。

        ### 请求参数

        - 必填：`biz_date`（业务日期）
        - 各字段的格式、取值范围和业务含义见对应字段说明。

        ### 业务说明

        按业务日期启动清算流程。涉及真实清算流程触发。

        ### 处理结果

        成功时完成上述业务操作；后续状态和返回数据以 `200` 响应定义为准。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - biz_date
              properties:
                biz_date:
                  type: string
                  description: 业务日期. 本次请求对应的业务日期。请按接口约定的日期格式提交。此字段为必填项。
            example:
              biz_date: 2026-07-10
      responses:
        '200':
          description: 请求处理成功。响应的 `data` 不包含额外业务字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。

                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`
                      判断具体结果。

                      - `401`：未登录。
                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登录或登录状态已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 当前账号未获得该功能授权。请在 User Permission 中为该账号开通相应权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 请求处理超时。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
      x-mint:
        href: /zh-CN/api-reference/billing_va_trigger
        metadata:
          sidebarTitle: 触发虚拟资产清算
  /billing/va/pass_trade_match:
    post:
      operationId: va_pass_trade_match
      summary: 交易匹配审核
      tags:
        - 虚拟资产管理
      x-permission-key:
        - lb_hk_clearing.billing_va_contracts
      x-lbonly: false
      description: 对指定业务日期的虚拟资产成交配对进行人工审核通过（交易匹配审核）。写操作。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - biz_date
              properties:
                biz_date:
                  type: integer
                  description: 业务日期. 清算业务日期，整型（`YYYYMMDD`）。
            example:
              biz_date: 20260101
      responses:
        '200':
          description: 未实调，响应字段以真实接口为准。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: 0 表示成功；非 0 为业务错误码，此时 data 通常为空。HTTP 状态码本身恒为 200，请勿依赖 HTTP status 判断成功/失败。
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
      x-mint:
        href: /zh-CN/api-reference/va_pass_trade_match
        metadata:
          sidebarTitle: 交易匹配审核
