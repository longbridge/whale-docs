  /v1/announcement:
    get:
      operationId: get_announcement
      summary: 公告詳情
      tags:
      - 公告管理
      x-permission-key:
      - lb_hk_app.announcements
      - stock.market_holiday
      x-lbonly: false
      description: '按公告 ID 查詢單條公告的完整配置，用於回填編輯表單或展示公告詳情。


        ### 請求參數


        - 必填：`id`（公告 ID），作為查詢字符串參數 `?id=` 傳入。


        ### 返回結果


        成功時返回該公告的完整配置對象，包含標題、內容、展示渠道、生效時間、用戶範圍和狀態等字段。多語言字段（如 `title`、`description`）以 JSON 字符串形式返回，調用方需自行解析。'
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: query
        required: true
        description: 要查詢的公告的唯一標識。
        schema:
          type: integer
        example: 76390
      responses:
        '200':
          description: 成功時返回該公告的完整配置對象。
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - data
                properties:
                  code:
                    type: integer
                    description: '0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。


                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`

                      判斷具體結果。


                      - `401`：未登錄。

                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。'
                    x-enum-details:
                    - value: 0
                      label: 成功
                  message:
                    type: string
                  data:
                    type: object
                    description: '**返回值：** 公告的完整配置對象。'
                    properties:
                      announcement_type:
                        type: string
                        description: '**返回值：** 公告類型。'
                      title:
                        type: string
                        description: '**返回值：** 多語言標題，以 JSON 字符串返回，鍵為語言代碼（如 `zh-CN`、`zh-HK`、`en`）。'
                      description:
                        type: string
                        description: '**返回值：** 多語言公告內容，以 JSON 字符串返回。'
                      rich_desc:
                        type: string
                        description: '**返回值：** 多語言富文本內容，以 JSON 字符串返回。'
                      channel:
                        type: object
                        description: '**返回值：** 展示渠道配置。以各平台鍵（如 `ios`、`android`、`pc`）到布爾值的映射表示是否在該渠道展示；帶版本控制的渠道另有
                          `<平台>_low` 和 `<平台>_up` 字段表示生效的版本區間。'
                      closable:
                        type: boolean
                        description: '**返回值：** 用戶端是否允許手動關閉該公告。'
                      conditions:
                        type: string
                        description: '**返回值：** 公告展示條件，以 JSON 字符串返回。'
                      user_scope:
                        type: object
                        description: '**返回值：** 目標用戶範圍配置，包含賬戶渠道（`account_channel`）、用戶分群（`user_cluster`、`cluster_id`）、組織（`org_ids`）等字段。'
                      link:
                        type: string
                        description: '**返回值：** 公告點擊後的跳轉鏈接。'
                      button:
                        type: string
                        description: '**返回值：** 多語言按鈕文案，以 JSON 字符串返回。'
                      priority:
                        type: integer
                        description: '**返回值：** 公告優先級，數值越大優先級越高。'
                      reason:
                        type: string
                        description: '**返回值：** 公告發佈或變更的原因說明。'
                      show_begin:
                        type: string
                        description: '**返回值：** 公告開始展示的時間，Unix 時間戳（秒）。'
                      show_end:
                        type: string
                        description: '**返回值：** 公告結束展示的時間，Unix 時間戳（秒）。'
                      status:
                        type: integer
                        description: '**返回值：** 公告狀態。'
              example:
                code: 0
                message: success
                data:
                  announcement_type: notice
                  title: '{"zh-CN":"标题","en":"Title"}'
                  description: '{"zh-CN":"内容","en":"Content"}'
                  rich_desc: '{}'
                  channel:
                    ios: true
                    android: true
                    ios_low: 1.0.0
                    ios_up: ''
                  closable: true
                  conditions: '{}'
                  user_scope:
                    account_channel: lb
                    org_ids:
                    - '1'
                  link: https://example.com
                  button: '{"zh-CN":"查看详情"}'
                  priority: 0
                  reason: ''
                  show_begin: '1779544289'
                  show_end: '1779630695'
                  status: 2
        '400':
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登錄或登錄狀態已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 當前賬號未獲得該功能授權。請在 User Permission 中為該賬號開通相應權限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 請求處理超時。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
  /v1/portfolio/atm/notice:
    post:
      operationId: notice_create
      summary: 新建出入金公告
      tags:
      - 公告管理
      x-permission-key:
      - lb_hk_cash_in_out_notice.lb_hk_cash_in_out_notice_update
      x-lbonly: false
      description: '新建一條出入金公告，配置公告類型、展示渠道、生效時間、目標範圍及多語言標題與內容。


        ### 請求參數


        - 必填：`notice_type`（公告類型）、`title`（標題）、`description`（內容）。

        - `title`、`description`、`confirm_button_label` 為多語言字段，需以 JSON 字符串傳入（鍵為語言代碼）。

        - `account_channel`、`region_ids`、`region_bank_ids` 為多值字段，多個值以英文逗號拼接為字符串傳入。

        - `show_begin`、`show_end` 為 Unix 時間戳（秒）。

        - 各字段的格式、取值範圍和業務含義見對應字段說明。


        ### 處理結果


        成功時創建公告；後續狀態和返回數據以 `200` 響應定義為準。'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - notice_type
              - title
              - description
              properties:
                notice_type:
                  type: string
                  description: '公告類型。此字段為必填項。


                    **可選值：**

                    - `1` - 入金

                    - `2` - 出金'
                  enum:
                  - '1'
                  - '2'
                  x-enum-details:
                  - value: '1'
                    label: 入金
                  - value: '2'
                    label: 出金
                  example: '1'
                title:
                  type: string
                  description: 多語言標題，以 JSON 字符串傳入，鍵為語言代碼（如 `zh-CN`、`zh-HK`、`en`）。此字段為必填項。
                  example: '{"zh-CN":"标题","en":"Title"}'
                description:
                  type: string
                  description: 多語言公告內容，以 JSON 字符串傳入。此字段為必填項。
                  example: '{"zh-CN":"内容","en":"Content"}'
                client_channel:
                  type: object
                  description: 展示渠道配置。以各渠道鍵到布爾值的映射表示是否在該渠道展示；帶版本控制的渠道另有 `<渠道>_low` 和 `<渠道>_up` 字段表示生效的版本區間。
                account_channel:
                  type: string
                  description: 生效的櫃檯（賬戶渠道）。多個值以英文逗號拼接為字符串傳入。
                  example: lb
                org_ids:
                  type: array
                  description: 目標組織 ID 列表。不傳或為空時默認應用於全部可選組織。
                  items:
                    type: string
                  example:
                  - '1'
                app_ids:
                  type: array
                  description: 觸達的 App 列表。
                  items:
                    type: string
                  example:
                  - longbridge
                region_ids:
                  type: string
                  description: 銀行賬戶地區。多個值以英文逗號拼接為字符串傳入。
                  example: hk,sg
                region_bank_ids:
                  type: string
                  description: 銀行名稱（銀行 ID）。多個值以英文逗號拼接為字符串傳入。
                bank_operation_types_id:
                  type: string
                  description: 入金方式。
                remark:
                  type: string
                  description: 備註信息。
                show_begin:
                  type: integer
                  description: 公告開始展示的時間，Unix 時間戳（秒）。
                  example: 1779544289
                show_end:
                  type: integer
                  description: 公告結束展示的時間，Unix 時間戳（秒）。
                  example: 1779630695
                link:
                  type: string
                  description: 公告點擊後的跳轉鏈接。
                client_display_way:
                  type: string
                  description: 公告在客戶端的展示方式。
                confirm_button_label:
                  type: string
                  description: 多語言確認按鈕文案，以 JSON 字符串傳入。可選。
                  example: '{"zh-CN":"查看详情"}'
                priority:
                  type: integer
                  description: 公告優先級，數值越大優先級越高。
                  example: 0
            example:
              notice_type: '1'
              title: '{"zh-CN":"标题","en":"Title"}'
              description: '{"zh-CN":"内容","en":"Content"}'
              client_channel:
                all: true
              account_channel: lb
              org_ids:
              - '1'
              app_ids:
              - longbridge
              region_ids: hk,sg
              region_bank_ids: ''
              bank_operation_types_id: '0'
              remark: ''
              show_begin: 1779544289
              show_end: 1779630695
              link: https://example.com
              client_display_way: '1'
              confirm_button_label: '{"zh-CN":"查看详情"}'
              priority: 0
      responses:
        '200':
          description: 請求處理成功。響應的 `data` 不包含額外業務字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: '0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。


                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`

                      判斷具體結果。


                      - `401`：未登錄。

                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。'
                    x-enum-details:
                    - value: 0
                      label: 成功
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
