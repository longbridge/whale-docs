                      - value: '3'
                        label: 審批通過
                      - value: '4'
                        label: 審批拒絕
                      - value: '5'
                        label: 關閉
                page:
                  type: integer
                  description: 要查詢的頁碼，從 `1` 開始。
                page_size:
                  type: integer
                  description: 每頁返回的記錄數量。
