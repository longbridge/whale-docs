                  description: 組合業務過濾條件。省略某個過濾字段時，不按該字段篩選。
                  properties:
                    announcement_id:
                      type: string
                      description: 用於按「公告編號」篩選結果。
                    begin_at:
                      type: string
                      format: date
                      description: 用於按「開始時間」篩選結果。
                    end_at:
                      type: string
                      format: date
                      description: 用於按「結束時間」篩選結果。
                    announcement_type:
                      type: string
                      description: '用於按「類型」篩選結果。


                        **可選值：**

                        - `common` - 表示通用公告

                        - `normal_closed` - 表示常規休市

                        - `ntemporary_closed` - 表示臨時休市

                        - `passageway` - 表示通道問題

                        - `only_shares` - 表示單股票

                        - `assets_out` - 表示資產出金

                        - `assets_in` - 表示資產入金'
                      enum:
                      - common
                      - normal_closed
                      - ntemporary_closed
                      - passageway
                      - only_shares
                      - assets_out
                      - assets_in
                      x-enum-details:
                      - value: common
                        label: 通用公告
                      - value: normal_closed
                        label: 常規休市
                      - value: ntemporary_closed
                        label: 臨時休市
                      - value: passageway
                        label: 通道問題
                      - value: only_shares
                        label: 單股票
                      - value: assets_out
                        label: 資產出金
                      - value: assets_in
                        label: 資產入金
                    position:
                      type: string
                      description: '用於按「頁面範圍」篩選結果。


                        **可選值：**

                        - `watchlist` - 表示關注

                        - `market` - 表示市場

                        - `portfolio` - 表示資產

                        - `stockdetail` - 表示股票詳情

                        - `trade` - 表示交易大廳

                        - `deposit` - 表示入金賬單

                        - `withdrawal` - 表示出金賬單

                        - `my_tab` - 表示我的 tab'
                      enum:
                      - watchlist
                      - market
                      - portfolio
                      - stockdetail
                      - trade
                      - deposit
                      - withdrawal
                      - my_tab
                      x-enum-details:
                      - value: watchlist
                        label: 關注
                      - value: market
                        label: 市場
                      - value: portfolio
                        label: 資產
                      - value: stockdetail
                        label: 股票詳情
                      - value: trade
                        label: 交易大廳
                      - value: deposit
                        label: 入金賬單
                      - value: withdrawal
                        label: 出金賬單
                      - value: my_tab
                        label: 我的 tab
                    review_status:
                      type: string
                      description: '用於按「審核狀態」篩選結果。


                        **可選值：**

                        - `1` - 表示待審批

                        - `2` - 表示審批中

                        - `3` - 表示審批通過

                        - `4` - 表示審批拒絕

                        - `5` - 表示關閉'
                      enum:
                      - '1'
                      - '2'
                      - '3'
                      - '4'
                      - '5'
