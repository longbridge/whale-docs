                    properties:
                      list:
                        type: array
                        description: '**返回值：** 列表列表。'
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: '**返回值：** 當前記錄的唯一標識。'
                            begin_at:
                              type: string
                              description: '**返回值：** 開始時間；時間或日期格式以接口實際返回值為準。'
                            end_at:
                              type: string
                              description: '**返回值：** 結束時間；時間或日期格式以接口實際返回值為準。'
