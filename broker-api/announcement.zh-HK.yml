    put:
      operationId: notice_update
      summary: 編輯出入金公告
      tags:
      - 公告管理
      x-permission-key:
      - lb_hk_cash_in_out_notice.lb_hk_cash_in_out_notice_update
      x-lbonly: false
      description: '編輯一條已存在的出入金公告。請求體在頂層攜帶待編輯公告的 `id`，公告配置字段統一放入 `config` 對象中。


        ### 請求參數


        - 必填：`id`（公告 ID）、`config`（公告配置對象）。

        - `config` 內各字段與「新建出入金公告」一致；`config.notice_type`、`config.title`、`config.description` 為必填。

        - `config.title`、`config.description`、`config.confirm_button_label` 為多語言字段，需以 JSON 字符串傳入。

        - `config.account_channel`、`config.region_ids`、`config.region_bank_ids` 為多值字段，多個值以英文逗號拼接為字符串傳入。

        - `config.show_begin`、`config.show_end` 為 Unix 時間戳（秒）。

        - `audit_frontend_resource` 為調用方提供的審計上下文（編輯前後的對照數據），可選。


        ### 處理結果


        成功時更新公告；後續狀態和返回數據以 `200` 響應定義為準。'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              - config
              properties:
                id:
                  type: string
                  description: 要編輯的出入金公告的唯一標識。此字段為必填項。
                  example: '209'
                config:
                  type: object
                  description: 公告配置對象，字段與「新建出入金公告」一致。此字段為必填項。
                  required:
                  - notice_type
                  - title
                  - description
                  properties:
                    notice_type:
                      type: string
                      description: '公告類型。此字段為必填項。


                        **可選值：**

                        - `1` - 入金

                        - `2` - 出金'
                      enum:
                      - '1'
                      - '2'
                      x-enum-details:
                      - value: '1'
                        label: 入金
                      - value: '2'
                        label: 出金
                      example: '1'
                    title:
                      type: string
                      description: 多語言標題，以 JSON 字符串傳入，鍵為語言代碼（如 `zh-CN`、`zh-HK`、`en`）。此字段為必填項。
                      example: '{"zh-CN":"标题","en":"Title"}'
                    description:
                      type: string
                      description: 多語言公告內容，以 JSON 字符串傳入。此字段為必填項。
                      example: '{"zh-CN":"内容","en":"Content"}'
                    client_channel:
                      type: object
                      description: 展示渠道配置。以各渠道鍵到布爾值的映射表示是否在該渠道展示；帶版本控制的渠道另有 `<渠道>_low` 和 `<渠道>_up` 字段表示生效的版本區間。
                    account_channel:
                      type: string
                      description: 生效的櫃檯（賬戶渠道）。多個值以英文逗號拼接為字符串傳入。
                      example: lb
                    org_ids:
                      type: array
                      description: 目標組織 ID 列表。不傳或為空時默認應用於全部可選組織。
                      items:
                        type: string
                      example:
                      - '1'
                    app_ids:
                      type: array
                      description: 觸達的 App 列表。
                      items:
                        type: string
                      example:
                      - longbridge
                    region_ids:
                      type: string
                      description: 銀行賬戶地區。多個值以英文逗號拼接為字符串傳入。
                      example: hk,sg
                    region_bank_ids:
                      type: string
                      description: 銀行名稱（銀行 ID）。多個值以英文逗號拼接為字符串傳入。
                    bank_operation_types_id:
                      type: string
                      description: 入金方式。
                    remark:
                      type: string
                      description: 備註信息。
                    show_begin:
                      type: integer
                      description: 公告開始展示的時間，Unix 時間戳（秒）。
                      example: 1779544289
                    show_end:
                      type: integer
                      description: 公告結束展示的時間，Unix 時間戳（秒）。
                      example: 1779630695
                    link:
                      type: string
                      description: 公告點擊後的跳轉鏈接。
                    client_display_way:
                      type: string
                      description: 公告在客戶端的展示方式。
                    confirm_button_label:
                      type: string
                      description: 多語言確認按鈕文案，以 JSON 字符串傳入。可選。
                      example: '{"zh-CN":"查看详情"}'
                    priority:
                      type: integer
                      description: 公告優先級，數值越大優先級越高。
                      example: 0
                audit_frontend_resource:
                  type: object
                  description: 調用方提供的審計上下文，用於記錄編輯前後的對照信息。可選。
            example:
              id: '209'
              config:
                notice_type: '1'
                title: '{"zh-CN":"标题","en":"Title"}'
                description: '{"zh-CN":"内容","en":"Content"}'
                client_channel:
                  all: true
                account_channel: lb
                org_ids:
                - '1'
                app_ids:
                - longbridge
                region_ids: hk,sg
                region_bank_ids: ''
                bank_operation_types_id: '0'
                remark: ''
                show_begin: 1779544289
                show_end: 1779630695
                link: https://example.com
                client_display_way: '1'
                confirm_button_label: '{"zh-CN":"查看详情"}'
                priority: 0
              audit_frontend_resource: {}
      responses:
