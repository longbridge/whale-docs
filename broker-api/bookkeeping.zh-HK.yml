                        description: '異步模式（`mode: 1`）下返回，即 `GET /v1/datasets/download/{id}` /

                          `DELETE /v1/datasets/download/{id}` 路徑中的 id：GET 獲取最終下載地址，DELETE 刪除該導出記錄。'
                      ticket_id:
                        type: string
                        description: '**返回值：** 審批工單 ID。僅在本次操作觸發審批流程時返回。'
              example:
