                data:
                  url: https://b-api.longbridge.xyz/download/export_result.csv
                  file_download_id: ''
                  ticket_id: ''
        '400':
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
