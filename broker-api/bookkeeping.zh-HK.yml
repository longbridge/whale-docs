    post:
      operationId: clearing_channel_exchange_orders_download
      summary: 渠道彙兌導出
      tags:
      - 會計中台
      x-permission-key:
      - book.channel_exchange_order_inquiry
      x-lbonly: false
      description: '將「渠道彙兌」數據導出為文件。`filters` 決定導出範圍，`down_fields` 可限制導出字段。


        ### 導出模式


        - `mode: 0`：同步導出，成功後直接返回下載地址。

        - `mode: 1`：異步導出，先返回 `file_download_id`；隨後調用 `GET /v1/datasets/download/{id}` 獲取下載地址。

        - 不再需要導出記錄時，可調用 `DELETE /v1/datasets/download/{id}` 刪除。'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 字段同 clearing_channel_exchange_orders.yaml（query 能力）裏的 filters
                  properties:
                    account_at:
                      type: object
                      description: 用於按「賬務日期」篩選結果。
                      properties:
                        gte:
                          type: string
                          format: date
                          description: 篩選範圍的下限，匹配值包含該值。
                        lte:
                          type: string
                          format: date
                          description: 篩選範圍的上限，匹配值包含該值。
                    business_type:
                      type: string
                      description: '用於按「業務類型」篩選結果。


                        **可選值：**

                        - `ChannelExchange` - 表示渠道匯兌出賬

                        - `ChannelExchangeEntry` - 表示渠道匯兌入賬

                        - `ExchangeGains` - 表示匯兌收益

                        - `ExchangeLoss` - 表示匯兌損失'
                      enum:
                      - ChannelExchange
                      - ChannelExchangeEntry
                      - ExchangeGains
                      - ExchangeLoss
                      x-enum-details:
                      - value: ChannelExchange
                        label: 渠道匯兌出賬
                      - value: ChannelExchangeEntry
                        label: 渠道匯兌入賬
                      - value: ExchangeGains
                        label: 匯兌收益
                      - value: ExchangeLoss
                        label: 匯兌損失
                    currency:
                      type: string
                      description: '用於按「幣種」篩選結果。


                        候選值會動態變化。請調用 `GET /v1/datasets/refs/tenant_currencies_by_channel` 獲取當前可用的數據字典，並使用返回項的
                        `key` 作為本參數值。'
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/tenant_currencies_by_channel
                    id:
                      type: string
                      description: 用於按「編號」篩選結果。
                mode:
                  type: integer
                  default: 0
                  description: '不傳時默認 0（同步）


                    **可選值：**

                    - `0` - 表示同步

                    - `1` - 表示异步'
                  enum:
                  - 0
                  - 1
                  x-enum-details:
                  - value: 0
                    label: 同步
                  - value: 1
                    label: 异步
                ext:
                  type: string
                  description: '下載文件格式。不傳時默認為 `csv`。


                    **可選值：**

                    - `csv` - 表示 CSV

                    - `xlsx` - 表示 Excel'
                  enum:
                  - csv
                  - xlsx
                file_name:
                  type: string
                  description: 導出文件名稱。不傳時由服務端生成。
                down_fields:
                  type: array
                  description: 不傳時導出全部字段；取值範圍見 items.enum（同查詢接口 data.list.items 的字段列表）
                  items:
                    type: string
                    enum:
                    - id
                    - business_type
                    - business_type_val
                    - amount
                    - currency
                    - forex_type
                    - account_at
                    - trade_at
                    - user_order_no
                    - channel_order_no
                    - channel
                    - created_at
                    - updated_at
                ticket_content:
                  type: string
                  description: 模板配置了下載審核工單時，供審批人查看
                ticket_preview_url:
                  type: string
                  description: 導出審批詳情地址；僅在導出需要審批時使用。
                hide:
                  type: integer
                  description: '是否在下載記錄列表中隱藏本次導出記錄。


                    **可選值：**

                    - `0` - 表示不隐藏

                    - `1` - 表示隐藏'
                  enum:
                  - 0
                  - 1
                  x-enum-details:
                  - value: 0
                    label: 不隐藏
                  - value: 1
                    label: 隐藏
            example:
              filters: {}
              mode: 0
              ext: csv
              file_name: ''
              remark: ''
              down_fields: []
              ticket_content: ''
              ticket_preview_url: ''
              hide: 0
      responses:
