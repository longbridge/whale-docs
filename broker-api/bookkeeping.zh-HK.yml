        '401':
          description: 未登錄或登錄狀態已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 當前賬號未獲得該功能授權。請在 User Permission 中為該賬號開通相應權限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 請求處理超時。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
  /book/account_detail/update:
    post:
      operationId: modify_account_detail_v2
      summary: 編輯會計分錄
      tags:
      - 會計中台
      x-permission-key:
      - lb_hk_book.book_detail_update
      x-lbonly: false
      description: '編輯會計分錄（與新建共用同一請求，區別在於額外傳入 id）。涉及真實會計分錄數據變更。


        ### 請求參數


        - 必填：`id`（會計分錄ID）、`bookingTypeId`（記賬類型）、`txNo`（交易流水號）、`name`（摘要説明）、`accountAt`（記賬日期）、`ledgerDate`（分類賬日期）、`objectCode`（幣種/結算對象）、`debitFirstSubjectCode`（借方一級科目編碼）、`debitSecondSubjectCode`（借方二級科目編碼）、`debitSubjectCode`（借方三級科目編碼）、`creditFirstSubjectCode`（貸方一級科目編碼）、`creditSecondSubjectCode`（貸方二級科目編碼）、`creditSubjectCode`（貸方三級科目編碼）、`amount`（金額）

        - 可選：`sourceId`（賬務來源）、`aaid`（關聯賬戶ID）、`remark`（備註）、`debitName`（借方科目全稱）、`creditName`（貸方科目全稱）、`objectType`（對象類型）、`audit_frontend_resource`（審計追溯调用方快照）

        - 各字段的格式、取值範圍、默認行為和業務含義見對應字段說明。


        ### 處理結果


        成功時完成所述業務操作，具體返回內容見 `200` 響應定義。'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              - bookingTypeId
              - txNo
              - name
              - accountAt
              - ledgerDate
              - objectCode
              - debitFirstSubjectCode
              - debitSecondSubjectCode
              - debitSubjectCode
              - creditFirstSubjectCode
              - creditSecondSubjectCode
              - creditSubjectCode
              - amount
              properties:
                id:
                  type: string
                  description: 編輯場景下傳入的分錄 id，僅編輯接口有此字段
                sourceId:
                  type: number
                  description: '- 下拉選擇，取值來自 book_source 動態枚舉

                    - 編輯時禁用不可修改

                    - 提交前轉為數字


                    請調用 `GET /v1/datasets/refs/book_source` 獲取當前可用的數據字典，並使用返回項的 `key` 作為本字段值。'
                  x-value-source:
                    endpoint: GET /v1/datasets/refs/book_source
                bookingTypeId:
                  type: string
                  description: '下拉選擇，取值來自 book_business_types_by_source 動態枚舉（依賴來源字段聯動加載）；當來源為 0 時該項隱藏，不傳


                    請調用 `GET /v1/datasets/refs/book_business_types_by_source` 獲取當前可用的數據字典，並使用返回項的 `key`
                    作為本字段值。'
                  x-value-source:
                    endpoint: GET /v1/datasets/refs/book_business_types_by_source
                aaid:
                  type: string
                  description: 自定義組件選取關聯賬戶；當來源為 0 時隱藏，不傳
                txNo:
                  type: string
                  description: 用於指定「交易流水號」。此字段為必填項。
                name:
                  type: string
                  description: 用於指定「摘要説明」。此字段為必填項。
                accountAt:
                  type: string
                  description: 日期，提交前轉為 'YYYY-MM-DD 00:00:00' 格式
                ledgerDate:
                  type: string
                  description: 日期，提交前轉為 'YYYY-MM-DD HH:mm:ss' 格式
                objectCode:
                  type: string
                  description: '下拉選擇，取值來自 tenant_currencies_by_channel 動態枚舉


                    請調用 `GET /v1/datasets/refs/tenant_currencies_by_channel` 獲取當前可用的數據字典，並使用返回項的 `key`
                    作為本字段值。'
                  x-value-source:
                    endpoint: GET /v1/datasets/refs/tenant_currencies_by_channel
                debitFirstSubjectCode:
                  type: string
                  description: 下拉選擇，借方一級科目，取值來自科目查詢聯動接口
                debitSecondSubjectCode:
                  type: string
                  description: 下拉選擇，借方二級科目，依賴借方一級科目聯動加載
                debitSubjectCode:
                  type: string
                  description: 下拉選擇，借方末級科目，依賴借方二級科目聯動加載；選中後取該項全稱作為借方科目名稱
                creditFirstSubjectCode:
                  type: string
                  description: 下拉選擇，貸方一級科目，取值來自科目查詢聯動接口
                creditSecondSubjectCode:
                  type: string
                  description: 下拉選擇，貸方二級科目，依賴貸方一級科目聯動加載
                creditSubjectCode:
                  type: string
                  description: 下拉選擇，貸方末級科目，依賴貸方二級科目聯動加載；選中後取該項全稱作為貸方科目名稱
                amount:
                  type: string
                  description: 本次業務處理涉及的金額。此字段為必填項。
                remark:
                  type: string
                  description: 自由文本，最長 100 字符
                debitName:
                  type: string
                  description: 非請求項，選中借方末級科目時從選項全稱取值並隨提交附帶
                creditName:
                  type: string
                  description: 非請求項，選中貸方末級科目時從選項全稱取值並隨提交附帶
                objectType:
                  type: string
                  description: 用於指定「對象類型」。
                audit_frontend_resource:
                  type: object
                  description: 編輯前拉取的原始數據快照，用於後端審計對比，非用戶可編輯字段
            example:
              id: '10086'
              sourceId: 1
              bookingTypeId: '2'
              aaid: H00000000
              txNo: TX20260710001
              name: 手工调账-测试分录
              accountAt: '2026-07-10 00:00:00'
              ledgerDate: '2026-07-10 10:00:00'
              objectCode: USD
              debitFirstSubjectCode: '1001'
              debitSecondSubjectCode: '100101'
              debitSubjectCode: '10010101'
              creditFirstSubjectCode: '2001'
              creditSecondSubjectCode: '200101'
              creditSubjectCode: '20010101'
              amount: '100.00'
              remark: 编辑备注
              debitName: 库存现金/美元/xxx
              creditName: 应付账款/美元/xxx
              objectType: account
      responses:
        '200':
          description: 請求處理成功。響應的 `data` 不包含額外業務字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: '0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。


                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`

                      判斷具體結果。


                      - `401`：未登錄。

                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。'
                    x-enum-details:
                    - value: 0
                      label: 成功
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登錄或登錄狀態已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 當前賬號未獲得該功能授權。請在 User Permission 中為該賬號開通相應權限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 請求處理超時。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
  /book/addBookRemarks:
    post:
      operationId: add_book_remarks
      summary: 新增會計備註
      tags:
      - 會計中台
      x-permission-key:
      - accounting.deposit_transit_details
      x-lbonly: false
      description: '新增會計備註。


        ### 請求參數


        - 必填：`ref_id`（關聯ID）、`ref_no`（關聯單號）、`biz_type`（業務類型）、`remarks`（備註內容）

        - 各字段的格式、取值範圍和業務含義見對應字段說明。


        ### 處理結果


        成功時完成上述業務操作；後續狀態和返回數據以 `200` 響應定義為準。'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - ref_id
              - ref_no
              - biz_type
              - remarks
              properties:
                ref_id:
                  type: number
                  description: 關聯ID，用於標識本次請求關聯的業務對象。此字段為必填項。
                ref_no:
                  type: string
                  description: 用於指定「關聯單號」。此字段為必填項。
                biz_type:
                  type: string
                  description: 用於區分本次請求適用的業務場景。此字段為必填項。
