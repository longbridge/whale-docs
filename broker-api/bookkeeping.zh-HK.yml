                            amount:
                              type: string
                              description: '**返回值：** 金額。'
                            currency:
                              type: string
                              description: '**返回值：** 幣種。'
                            origin_business_type:
                              type: string
                              description: '**返回值：** 類型。'
                            origin_business_type_val:
                              type: string
                              description: 字段 origin_business_type 的原始值：origin_business_type 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            account_at:
