openapi: 3.1.1
info:
  title: Whale OpenAPI (whale-openapi-docs 自动生成)
  version: 1.0.0
servers:
- url: https://b-api.longbridge.xyz
  description: 测试环境
- url: https://b-api.lbkrs.com
  description: 生产环境
security:
- bearerAuth: []
tags:
- name: 會計中台
  description: 記賬憑證、總賬查詢、往來核對等會計中台相關的後台管理接口。
paths:
  /book/createAccountDetailsV2:
    post:
      operationId: create_account_details_v2
      summary: 新建會計分錄
      tags:
      - 會計中台
      x-permission-key:
      - lb_hk_book.book_detail_update
      x-lbonly: false
      description: '新建會計分錄（也支持按 copy_id 複製預填後新建）。涉及真實會計分錄數據變更。


        ### 請求參數


        - 必填：`bookingTypeId`（記賬類型）、`txNo`（交易流水號）、`name`（摘要説明）、`accountAt`（記賬日期）、`ledgerDate`（分類賬日期）、`objectCode`（幣種/結算對象）、`debitFirstSubjectCode`（借方一級科目編碼）、`debitSecondSubjectCode`（借方二級科目編碼）、`debitSubjectCode`（借方三級科目編碼）、`creditFirstSubjectCode`（貸方一級科目編碼）、`creditSecondSubjectCode`（貸方二級科目編碼）、`creditSubjectCode`（貸方三級科目編碼）、`amount`（金額）

        - 可選：`sourceId`（賬務來源）、`aaid`（關聯賬戶ID）、`remark`（備註）、`debitName`（借方科目全稱）、`creditName`（貸方科目全稱）、`objectType`（對象類型）、`audit_frontend_resource`（審計追溯调用方快照）

        - 各字段的格式、取值範圍、默認行為和業務含義見對應字段說明。


        ### 處理結果


        成功時完成所述業務操作，具體返回內容見 `200` 響應定義。'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - bookingTypeId
              - txNo
              - name
              - accountAt
              - ledgerDate
              - objectCode
              - debitFirstSubjectCode
              - debitSecondSubjectCode
              - debitSubjectCode
              - creditFirstSubjectCode
              - creditSecondSubjectCode
              - creditSubjectCode
              - amount
              properties:
                sourceId:
                  type: number
                  description: '分錄數據源，下拉選擇；取值來自 book_source 動態枚舉，非固定


                    請調用 `GET /v1/datasets/refs/book_source` 獲取當前可用的數據字典，並使用返回項的 `key` 作為本字段值。'
                  x-value-source:
                    endpoint: GET /v1/datasets/refs/book_source
                bookingTypeId:
                  type: string
                  description: '記賬業務類型，下拉選擇（依賴數據源聯動）；取值來自 book_business_types_by_source 動態枚舉，非固定


                    請調用 `GET /v1/datasets/refs/book_business_types_by_source` 獲取當前可用的數據字典，並使用返回項的 `key`
                    作為本字段值。'
                  x-value-source:
                    endpoint: GET /v1/datasets/refs/book_business_types_by_source
                aaid:
                  type: string
                  description: 關聯賬戶 AAID（部分場景不適用，可不傳）
                txNo:
                  type: string
                  description: 用於指定「交易流水號」。此字段為必填項。
                name:
                  type: string
                  description: 用於指定「摘要説明」。此字段為必填項。
                accountAt:
                  type: string
                  description: 記賬時間，格式 YYYY-MM-DD 00:00:00
                ledgerDate:
                  type: string
                  description: 賬務日期，格式 YYYY-MM-DD HH:mm:ss
                objectCode:
                  type: string
                  description: '對象幣種，下拉選擇；取值來自 tenant_currencies_by_channel 動態枚舉，非固定


                    請調用 `GET /v1/datasets/refs/tenant_currencies_by_channel` 獲取當前可用的數據字典，並使用返回項的 `key`
                    作為本字段值。'
                  x-value-source:
                    endpoint: GET /v1/datasets/refs/tenant_currencies_by_channel
                debitFirstSubjectCode:
                  type: string
                  description: 用於指定「借方一級科目編碼」。此字段為必填項。
                debitSecondSubjectCode:
                  type: string
                  description: 借方二級科目，依賴一級科目聯動
                debitSubjectCode:
                  type: string
                  description: 借方明細科目，依賴二級科目聯動
                creditFirstSubjectCode:
                  type: string
                  description: 用於指定「貸方一級科目編碼」。此字段為必填項。
                creditSecondSubjectCode:
                  type: string
                  description: 貸方二級科目，依賴一級科目聯動
                creditSubjectCode:
                  type: string
                  description: 貸方明細科目，依賴二級科目聯動
                amount:
                  type: string
                  description: 本次業務處理涉及的金額。此字段為必填項。
                remark:
                  type: string
                  description: 備註，最長 100 字符
                debitName:
                  type: string
                  description: 借方科目名稱，隨借方明細科目自動帶出
                creditName:
                  type: string
                  description: 貸方科目名稱，隨貸方明細科目自動帶出
                objectType:
                  type: string
                  description: 用於指定「對象類型」。
                audit_frontend_resource:
                  type: object
                  description: 審計用數據快照（複製場景為原始記錄快照，純新增為空對象），供後端審計對比，非用戶填寫字段
            example:
              sourceId: 1
              bookingTypeId: '2'
              aaid: H00000000
              txNo: TX20260710002
              name: 手工调账-测试分录
              accountAt: '2026-07-10 00:00:00'
              ledgerDate: '2026-07-10 10:00:00'
              objectCode: USD
              debitFirstSubjectCode: '1001'
              debitSecondSubjectCode: '100101'
              debitSubjectCode: '10010101'
              creditFirstSubjectCode: '2001'
              creditSecondSubjectCode: '200101'
              creditSubjectCode: '20010101'
              amount: '100.00'
              remark: 新增备注
              debitName: 库存现金/美元/xxx
              creditName: 应付账款/美元/xxx
              objectType: account
      responses:
        '200':
          description: 請求處理成功。響應的 `data` 不包含額外業務字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: '0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。


                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`

                      判斷具體結果。


                      - `401`：未登錄。

                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。'
                    x-enum-details:
                    - value: 0
                      label: 成功
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登錄或登錄狀態已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 當前賬號未獲得該功能授權。請在 User Permission 中為該賬號開通相應權限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 請求處理超時。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
  /book/deleteAccountDetail:
