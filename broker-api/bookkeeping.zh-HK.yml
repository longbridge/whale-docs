                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。'
                    x-enum-details:
                    - value: 0
                      label: 成功
                  message:
                    type: string
                  data:
                    type: object
                    required:
                    - list
                    - total
                    properties:
                      list:
                        type: array
                        description: '**返回值：** 列表列表。'
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: '**返回值：** 當前記錄的唯一標識。'
                            business_type:
                              type: string
                              description: '**返回值：** 業務類型。'
