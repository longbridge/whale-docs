  /v1/datasets/risk_alert_log_backups:
    post:
      operationId: risk_alert_log_backups
      summary: 快照
      tags:
        - 風控管理
      x-permission-key:
        - lb_hk_margin_call.margin_call_history_query
      x-lbonly: false
      description: |-
        查詢保證金預警記錄的快照備份，記錄追繳與強平生命週期中各關鍵節點上客戶的風控狀態。

        ### 請求參數

        - 透過 `filters` 組合業務篩選條件（可選欄位見下方 filters 欄位說明），並使用 `page`、`page_size`、`orderBy` 控制分頁與排序。

        ### 業務說明

        - 快照在預警生命週期的關鍵節點生成，備份原因涵蓋首次 Margin Call、首次強平、結束、每日留檔、App 推送以及 Margin Call 與強平之間的狀態轉換等。
        - 每條記錄關聯一條預警編號，包含賬號、櫃檯渠道、快照記錄時間、預警時間、截止日期、預警類型、幣種，以及淨資產比率、應追繳保證金、現金、持倉總市值、股權資產、含貸權益值和初始/維持/平倉保證金。
        - 記錄還給出逾期天數與近 30 日逾期天數，便於跟蹤客戶追繳逾期情況。
        - 可按客戶、備份原因、預警記錄、是否逾期與記錄日期篩選。

        ### 返回結果

        成功時返回符合條件的記錄列表及分頁資訊。返回欄位含義見回應定義。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 過濾條件. 組合業務過濾條件。省略某個過濾字段時，不按該字段篩選。
                  properties:
                    aaid:
                      type: string
                      description: 客戶. 用於按「客戶」篩選結果。
                    backup_reason:
                      type: string
                      description: 備份原因. 用於按「備份原因」篩選結果。
                      enum:
                        - FirstMarginCall
                        - FirstForceCall
                        - EndMarginCall
                        - EndForceCall
                        - DailyRecord
                        - PushAppMsg
                        - PushEmailMsg
                        - PushSmsMsg
                        - ForceCallToMarginCall
                        - MarginCallToForceCall
                      x-enum-details:
                        - value: FirstMarginCall
                          label: 首次觸發追收預警
                        - value: FirstForceCall
                          label: 首次觸發平倉預警
                        - value: EndMarginCall
                          label: 結束追收預警
                        - value: EndForceCall
                          label: 結束平倉預警
                        - value: DailyRecord
                          label: 每日定時紀錄
                        - value: PushAppMsg
                          label: App 消息通知
                        - value: PushEmailMsg
                          label: 郵件消息通知
                        - value: PushSmsMsg
                          label: 短信消息通知
                        - value: ForceCallToMarginCall
                          label: 平倉預警轉追收預警
                        - value: MarginCallToForceCall
                          label: 追收預警轉平倉預警
                      example: End Day Margin Call
                    risk_monitoring_log_id:
                      type: string
                      description: 預警紀錄. 用於按「預警紀錄」篩選結果。
                      example: '834619'
                    is_day_of_overdue:
                      type: string
                      description: 是否逾期. 用於按「是否逾期」篩選結果。
                      enum:
                        - 'true'
                        - 'false'
                      x-enum-details:
                        - value: 'true'
                          label: 是
                        - value: 'false'
                          label: 否
                      example: 'true'
                    created_at:
                      type: object
                      description: 記錄日期. 用於按「記錄日期」篩選結果。
                      properties:
                        gte:
                          type: string
                          description: 大於等於. 篩選範圍的下限，匹配值包含該值。
                          format: date
                        lte:
                          type: string
                          description: 小於等於. 篩選範圍的上限，匹配值包含該值。
                          format: date
                page:
                  type: integer
                  description: 頁碼. 要查詢的頁碼，從 `1` 開始。
                page_size:
                  type: integer
                  description: 每頁數量. 每頁返回的記錄數量。
                orderBy:
                  type: array
                  description: 排序參數. 排序規則數組；每一項定義一個排序字段及排序方向。
                  items:
                    type: object
            example:
              filters: {}
              page: 1
              page_size: 20
              orderBy: []
