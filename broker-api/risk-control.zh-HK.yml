  /v1/datasets/risk_global_limits:
    post:
      operationId: risk_global_limits
      summary: 全侷限額
      tags:
        - 風控管理
      x-permission-key:
        - lb_hk_risk_limit_config.risk_limit_config_global_query
      x-lbonly: false
      description: |-
        查詢全局交易限額，是風控交易限額體系的基礎配置，按限額類型定義各類下單管控規則的預設閾值。

        ### 請求參數

        - 透過 `filters` 組合業務篩選條件（可選欄位見下方 filters 欄位說明），並使用 `page`、`page_size`、`orderBy` 控制分頁與排序。

        ### 業務說明

        - 資料來源為全局限額配置，每條記錄由限額代碼 `code` 標識一類風控規則，`name` 為規則名稱，`type` 為限額類型（如股票等）。

        - 每類限額設有提示、審核、拒絕三檔閾值（`level_warn`/`level_audit`/`level_reject`）及各自的比較運算子，組合成 `condition_warn`、`condition_audit`、`condition_reject`，命中時分別提示、轉人工審核或直接拒絕下單。

        - 記錄還包含限額幣種 `currency`、啟用標識 `enable`、備註、操作人 `last_update_user` 與更新時間。

        - 常用於風控人員檢視與維護全局層面的下單限額規則。

        ### 返回結果

        成功時返回匹配的記錄列表及分頁資訊。返回列含義見回應定義。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 過濾條件. 組合業務過濾條件。省略某個過濾字段時，不按該字段篩選。
                  properties:
                    type:
                      type: string
                      description: 限額類型. 用於按「限額類型」篩選結果。
                      enum:
                        - client
                        - company
                        - stock
                        - user
                        - other
                        - multiple
                      x-enum-details:
                        - value: client
                          label: 客戶
                        - value: company
                          label: 公司
                        - value: stock
                          label: 證券
                        - value: user
                          label: 交易員
                        - value: other
                          label: 其他
                        - value: multiple
                          label: 多維度
                      example: User
                    enable:
                      type: string
                      description: 是否啓用. 用於按「是否啓用」篩選結果。
                      enum:
                        - 'true'
                        - 'false'
                      x-enum-details:
                        - value: 'true'
                          label: 已啓用
                        - value: 'false'
                          label: 未啓用
                      example: Activated
                    code:
                      type: string
                      description: |-
                        限額代碼. 用於按「限額代碼」篩選結果。

                        候選值會動態變化。請調用 `GET /v1/datasets/refs/risk_limit_codes_global` 獲取當前可用的數據字典，並使用返回項的 `key` 作為本參數值。
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/risk_limit_codes_global
                      example: UBB
                page:
                  type: integer
                  description: 頁碼. 要查詢的頁碼，從 `1` 開始。
                page_size:
                  type: integer
                  description: 每頁數量. 每頁返回的記錄數量。
                orderBy:
                  type: array
                  description: 排序參數. 排序規則數組；每一項定義一個排序字段及排序方向。
                  items:
                    type: object
            example:
              filters: {}
              page: 1
              page_size: 20
              orderBy: []
      responses:
        '200':
          description: 成功時分頁返回「全局交易限額」記錄，以及頁碼、每頁數量和總記錄數等分頁信息。
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。

                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`
                      判斷具體結果。

                      - `401`：未登錄。
                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。
                  message:
                    type: string
                  data:
                    type: object
                    required:
                      - list
                      - total
                    properties:
                      list:
                        type: array
                        description: 列表. **返回值：** 列表列表。
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: 序號. **返回值：** 當前記錄的唯一標識。
                            code:
                              type: string
                              description: 限額代碼. **返回值：** 限額代碼。
                            code_v2:
                              type: string
                              description: 限額名稱. **返回值：** 限額名稱。
                            code_v2_val:
                              type: string
                              description: 限額名稱（原始值）. 字段 code_v2 的原始值：code_v2 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            currency:
                              type: string
                              description: 限額幣種. **返回值：** 限額幣種。
                            enable:
                              type: string
                              description: 啟用標識. **返回值：** 表示啟用標識。
                            enable_val:
                              type: string
                              description: 啟用標識（原始值）. 字段 enable 的原始值：enable 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            type:
                              type: string
                              description: 限額類型. **返回值：** 限額類型。
                            type_val:
                              type: string
                              description: 限額類型（原始值）. 字段 type 的原始值：type 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            condition_warn:
                              type: string
                              description: 提示條件. **返回值：** 提示條件。
                            condition_audit:
                              type: string
                              description: 審核條件. **返回值：** 審核條件。
                            condition_reject:
                              type: string
                              description: 拒絕條件. **返回值：** 拒絕條件。
                            updated_at:
                              type: string
                              description: 更新時間. **返回值：** 更新時間；時間或日期格式以接口實際返回值為準。
                            last_update_user:
                              type: string
                              description: 操作人. **返回值：** 操作人。
                            account_channel:
                              type: string
                              description: 渠道. **返回值：** 渠道。
                      total:
                        type: integer
                        description: 總條數. **返回值：** 符合查詢條件的記錄總數，用於計算分頁。
              example:
                code: 0
                message: success
                data:
                  list:
                    - id: '6063'
                      code: UBB
                      code_v2: Trader's Single Buy Order Amount Limit
                      code_v2_val: UBB
                      currency: HKD
                      enable: Activated
                      enable_val: 'true'
                      type: User
                      type_val: user
                      condition_warn: Unlimited
                      condition_audit: '>=1.00'
                      condition_reject: Unlimited
                      updated_at: '1784017190'
                      last_update_user: user@example.com
                      account_channel: longport_test
                  total: 48
        '400':
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登錄或登錄狀態已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 當前賬號未獲得該功能授權。請在 User Permission 中為該賬號開通相應權限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 請求處理超時。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
