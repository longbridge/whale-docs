  /risk/v1/batch_reset_credit_task_v3:
    post:
      operationId: batch_reset_credit_task_v3
      summary: 導入批量調整授信任務
      tags:
        - 風控管理
      x-lbonly: false
      description: |-
        導入文件後提交，批量調整客戶授信額度。

        ### 請求參數

        - 必填：`s3_key`（文件對象存儲 Key）、`audit_frontend_resource`（調用方審計上下文）
        - 各字段的格式、取值範圍和業務含義見對應字段說明。

        ### 業務說明

        先將 CSV/Excel 文件上傳至對象存儲，再以其 `s3_key` 提交批量授信調整任務，由後台按文件內容批量處理。

        ### 風險提示

        此操作觸發真實批量授信額度變更，影響範圍大。調用前請確認文件內容與 `s3_key` 無誤。

        ### 處理結果

        成功時提交批量調整授信任務；後續狀態和返回數據以 `200` 響應定義為準。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - s3_key
                - audit_frontend_resource
              properties:
                s3_key:
                  type: string
                  description: 文件對象存儲Key. 批量調整授信的 CSV/Excel 文件上傳後返回的對象 Key，服務端據此解析生成批量調整授信任務
                audit_frontend_resource:
                  type: object
                  description: 審計上下文. 審計留痕字段，包含上傳文件名，供審計日誌展示
            example:
              s3_key: credit_management/20260710/credit_batch_change_v2.xlsx
              audit_frontend_resource:
                file_name: credit_batch_change_v2.xlsx
      responses:
        '200':
          description: 請求處理成功。響應的 `data` 不包含額外業務字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。

                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`
                      判斷具體結果。

                      - `401`：未登錄。
                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。
                  message:
                    type: string
                  data:
                    type: object
                    description: 成功時 `data` 為空對象。
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登錄或登錄狀態已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 當前賬號未獲得該功能授權。請在 User Permission 中為該賬號開通相應權限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 請求處理超時。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
      x-mint:
        href: /zh-HK/api-reference/batch_reset_credit_task_v3
        metadata:
          sidebarTitle: 導入批量調整授信任務
  /risk/v1/trade_credit/modify:
    post:
      operationId: trade_credit_modify
      summary: 修改客戶交易額度
      tags:
        - 風控管理
      x-lbonly: false
      description: |-
        新增或修改客戶的交易額度配置。

        ### 請求參數

        - 必填：`aaid`（客戶資金賬戶 ID）、`trade_credit_type`（額度類型）、`trade_credit_map`（幣種額度映射）、`expired_at`（到期時間）、`action`（操作類型）
        - 可選：`remark`（備註）、`audit_frontend_resource`（調用方審計上下文）
        - 各字段的格式、取值範圍和業務含義見對應字段說明。

        ### 業務說明

        按 `action` 指定的操作類型對指定賬戶的交易額度進行新增或修改，額度按幣種映射設定，並受 `expired_at` 到期時間約束。

        ### 風險提示

        此操作變更真實交易額度。調用前請核對賬戶、額度類型、各幣種金額與到期時間。

        ### 處理結果

        成功時完成交易額度的新增或修改；後續狀態和返回數據以 `200` 響應定義為準。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - aaid
                - trade_credit_type
                - trade_credit_map
                - expired_at
                - action
              properties:
                aaid:
                  type: string
                  description: 客戶資金賬戶ID(AAID). 請求 member_query_aaid 組件選擇的客戶資金賬號，編輯時禁用不可改
                trade_credit_type:
                  type: string
                  description: |-
                    額度類型。可選值來自後端數據字典；常見取值：`0`（單一貨幣交易額度）、`1`（多貨幣交易額度）。
                  enum:
                    - '0'
                    - '1'
                  x-enum-details:
                    - value: '0'
                      label: 單一貨幣交易額度
                    - value: '1'
                      label: 多貨幣交易額度
                  example: '0'
                trade_credit_map:
                  type: object
                  description: 幣種額度映射. 幣種->額度鍵值對，如 {"HKD":"100000"}；trade_credit_type=0 時僅含單一幣種，=1 時可含多幣種。
                expired_at:
                  type: number
                  description: 到期時間. unix 時間戳（秒），date-picker 選擇日期後，時分秒取提交時的當前時間
                remark:
                  type: string
                  description: 備註. textarea，最長 100 字符
                action:
                  type: number
                  description: 操作類型. 0=新增 (add) 1=編輯 (edit)，由調用方根據是否傳入 item 記錄自動計算
                  enum:
                    - '0'
                    - '1'
                  x-enum-details:
                    - value: '0'
                      label: 新增
                    - value: '1'
                      label: 編輯
                  example: '0'
                audit_frontend_resource:
                  type: object
                  description: 審計上下文. 非核心業務字段，攜帶變更前 (before)與變更後 (value)數據及 $action/$behavior，用於風控審批工單展示
            example:
              aaid: H00000000
              trade_credit_type: '1'
              trade_credit_map:
                HKD: '100000'
                USD: '50000'
              expired_at: 1751328000
              remark: 客户申请提升交易额度
              action: 0
              audit_frontend_resource:
                aaid: H00000000
                expired_at: 1748736000
                remark: ''
                trade_credit_type: '0'
                trade_credit_map: '{"HKD":"50000"}'
                value:
                  aaid: H00000000
                  trade_credit_type: '1'
                  trade_credit_map:
                    - key: HKD
                      value: '100000'
                add: true
                edit:
                $action: add
                $behavior: 新增客户交易额度
      responses:
        '200':
          description: 請求處理成功。響應的 `data` 不包含額外業務字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。

                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`
                      判斷具體結果。

                      - `401`：未登錄。
                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      ticket_id:
                        type: string
                        description: 工單ID，該接口接入了工單審批功能
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登錄或登錄狀態已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 當前賬號未獲得該功能授權。請在 User Permission 中為該賬號開通相應權限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 請求處理超時。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
      x-mint:
        href: /zh-HK/api-reference/trade_credit_modify
        metadata:
          sidebarTitle: 修改客戶交易額度
