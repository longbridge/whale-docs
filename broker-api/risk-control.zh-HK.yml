        ### 請求參數

        - 必填：`dimension`（維度類型）、`value`（維度值）、`block_type_list`（拉黑類型列表）、`operator`（操作人）
        - 可選：`remark`（備註）、`audit_frontend_resource`（调用方審計信息）
        - 各字段的格式、取值範圍、默認行為和業務含義見對應字段說明。

        ### 處理結果

        成功時完成所述業務操作，具體返回內容見 `200` 響應定義。
      security:
        - bearerAuth: []
