  /risk_limit/v1/multiple/apply:
    post:
      operationId: multiple_apply
      summary: 批量申請多維度交易限額
      tags:
        - 風控管理
      x-lbonly: false
      description: |-
        批量申請多維度交易限額。

        ### 請求參數

        - 必填：`list`（多維度限額記錄列表）、`is_apply`（是否生效）
        - 可選：`audit_frontend_resource`（審計调用方資源）
        - 各字段的格式、取值範圍和業務含義見對應字段說明。

        ### 風險提示

        > 此操作可能引起真實資金、持倉或交易狀態變化。調用前請確認目標記錄和參數無誤。

        ### 處理結果

        成功時完成上述業務操作；後續狀態和返回數據以 `200` 響應定義為準。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - list
                - is_apply
              properties:
                list:
                  type: array
                  description: |-
                    多維度限額記錄列表. 批量勾選（或單條）的限額記錄，元素字段：counter_id(櫃檯ID)、aaid(賬戶AAID)、code(標的代碼)、trader(交易員賬號)、trader_name(交易員名稱)、
                    client_group(客戶分組ID)、client_group_name(客戶分組名稱)、stock_group(證券分組ID)
                  items:
                    type: string
                is_apply:
                  type: boolean
                  description: |-
                    是否生效. true=批量生效（申請啓用限額），false=批量失效（撤銷/停用限額）

                    **可選值：**
                    - `true` - 表示批量生效
                    - `false` - 表示批量失效
                  enum:
                    - 'true'
                    - 'false'
                audit_frontend_resource:
                  type: object
                  description: '審計上下文. 審計信息，含操作類型($action: add/delete)與行為描述($behavior)'
            example:
              list:
                - counter_id: '1000021'
                  aaid: H00000000
                  code: 700.HK
                  trader: T00123
                  trader_name: 张三
                  client_group: CG001
                  client_group_name: 机构客户组A
                  stock_group: SG001
              is_apply: true
              audit_frontend_resource:
                $action: add
                $behavior: 限额生效
      responses:
        '200':
          description: 請求處理成功。響應的 `data` 不包含額外業務字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。

                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`
                      判斷具體結果。

                      - `401`：未登錄。
                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。
                  message:
                    type: string
                  data:
                    type: object
                    description: "成功時 `data` 為空對象。"
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登錄或登錄狀態已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 當前賬號未獲得該功能授權。請在 User Permission 中為該賬號開通相應權限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 請求處理超時。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
      x-mint:
        href: /zh-HK/api-reference/multiple_apply
        metadata:
          sidebarTitle: 批量申請多維度交易限額
