  /v1/datasets/risk_bad_credit_logs:
    post:
      operationId: risk_bad_credit_logs
      summary: 不良信貸處理
      tags:
        - 風控管理
      x-permission-key:
        - lb_hk_margin_call.margin_call_query
      x-lbonly: false
      description: |-
        查詢最新一批不良信貸客戶記錄，用於風控團隊監控存在信用風險的客戶並跟進處理。

        ### 請求參數

        - 透過 `filters` 組合業務篩選條件（可選欄位見下方 filters 欄位說明），並使用 `page`、`page_size`、`orderBy` 控制分頁與排序。

        ### 業務說明

        - 資料取自最近一日的不良信貸留檔，每條記錄對應一名客戶，包含證券賬戶、賬戶類型、幣種、交易額度與融資金額。
        - 記錄彙總客戶的信用風險畫像：當前 Margin Call 狀態、歷史 Margin Call 次數、歷史被強平次數、當前不良信貸標記、30 日內未結清天數與長期未結清次數。
        - 可按客戶、當前 Margin Call 狀態、歷史不良信貸與當前不良信貸篩選。

        ### 返回結果

        成功時返回符合條件的記錄列表及分頁資訊。返回欄位含義見回應定義。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 過濾條件. 組合業務過濾條件。省略某個過濾字段時，不按該字段篩選。
                  properties:
                    aaid:
                      type: string
                      description: 客戶. 用於按「客戶」篩選結果。
                    risk_status:
                      type: string
                      description: |-
                        當前 Margin Call 狀態. 用於按「當前 Margin Call 狀態」篩選結果。

                        **可選值：** `Y`、`N`
                      enum:
                        - Y
                        - N
                      example: Y
                    history_bad_record_status:
                      type: string
                      description: |-
                        歷史不良信貸. 用於按「歷史不良信貸」篩選結果。

                        **可選值：** `Y`、`N`
                      enum:
                        - Y
                        - N
                      example: Y
                    bad_record_status:
                      type: string
                      description: |-
                        當前不良信貸. 用於按「當前不良信貸」篩選結果。

                        **可選值：** `Y`、`N`
                      enum:
                        - Y
                        - N
                      example: Y
                page:
                  type: integer
                  description: 頁碼. 要查詢的頁碼，從 `1` 開始。
                page_size:
                  type: integer
                  description: 每頁數量. 每頁返回的記錄數量。
                orderBy:
                  type: array
                  description: 排序參數. 排序規則數組；每一項定義一個排序字段及排序方向。
                  items:
                    type: object
            example:
              filters: {}
              page: 1
              page_size: 20
              orderBy: []
      responses:
        '200':
          description: 成功時分頁返回「不良信貸記錄」記錄，以及頁碼、每頁數量和總記錄數等分頁信息。
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。

                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`
                      判斷具體結果。

                      - `401`：未登錄。
                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。
                  message:
                    type: string
                  data:
                    type: object
                    required:
                      - list
                      - total
                    properties:
                      list:
                        type: array
                        description: 列表. **返回值：** 列表列表。
                        items:
                          type: object
                          properties:
                            origin_id:
                              type: string
                              description: 證券賬戶. **返回值：** 證券賬戶。
                            account_type:
                              type: string
                              description: 賬戶類型. **返回值：** 賬戶類型。
                            account_type_val:
                              type: string
                              description: 賬戶類型（原始值）. 字段 account_type 的原始值：account_type 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            currency:
                              type: string
                              description: 幣種. **返回值：** 幣種。
                            trade_credit:
                              type: string
                              description: 交易額度. **返回值：** 交易額度。
                            finance_amount:
                              type: string
                              description: 融資金額. **返回值：** 融資金額。
                            risk_status:
                              type: string
                              description: 當前 Margin Call 狀態. **返回值：** 當前 Margin Call 狀態。
                            margin_count:
                              type: string
                              description: 歷史 Margin Call 次數. **返回值：** 歷史 Margin Call 次數。
                            order_count:
                              type: string
                              description: 歷史被強平次數. **返回值：** 歷史被強平次數。
                            aaid:
                              type: string
                              description: 歷史不良信貸. **返回值：** 歷史不良信貸。
                            aaid_val:
                              type: string
                              description: 歷史不良信貸（原始值）. 字段 aaid 的原始值：aaid 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            bad_record_status:
                              type: string
                              description: 當前不良信貸. **返回值：** 當前不良信貸。
                            monthly_bad_credit_count:
                              type: string
                              description: 30 日內未結清天數. **返回值：** 30 日內未結清天數。
                            long_term_margin_count:
                              type: string
                              description: 長期未結清次數. **返回值：** 長期未結清次數。
                            created_at:
                              type: string
                              description: 創建時間. **返回值：** 創建時間；時間或日期格式以接口實際返回值為準。
                      total:
                        type: integer
                        description: 總條數. **返回值：** 符合查詢條件的記錄總數，用於計算分頁。
              example:
                code: 0
                message: success
                data:
                  list:
                    - origin_id: H00000000
                      account_type: Margin Client
                      account_type_val: M
                      currency: HKD
                      trade_credit: '0'
                      finance_amount: 500,000.00
                      risk_status: Y
                      margin_count: '2'
                      order_count: '0'
