  /v1/risk_monitoring/simulate_margin_call_cal_v3:
    post:
      operationId: simulate_margin_call_cal_v3
      summary: Margin Call 壓力測試計算
      tags:
        - 風控管理
      x-lbonly: false
      description: |-
        按給定的假設參數發起一次 Margin Call 壓力測試計算，評估在設定行情衝擊下客戶或組合的 Margin Call 風險。

        ### 請求參數

        - 必填：`simulate_cal_type`（計算維度）、`cal_type`（計算類型）、`is_filter`（是否使用豁免規則）、`remark`（自定義數據標題）
        - 可選：`task_id`（批次號）、`market`（市場）、`stock_group_id`（股票組 ID）、`counter_id`（股票代碼）、`price_limit`（漲跌幅）、`index_price_limit_info`（指數級別跌幅設置）
        - 各欄位的格式、取值範圍和業務含義見對應欄位說明。

        ### 業務說明

        `simulate_cal_type` 與 `cal_type` 決定計算維度與口徑；`price_limit` 與 `index_price_limit_info` 設定價格衝擊假設；`is_filter` 控制是否套用豁免規則。計算為非同步任務，結果透過對應預計算列表/詳情查詢。

        ### 風險提示

        此操作會觸發風控壓力測試計算任務並生成結果數據。調用前請確認假設參數設置合理。

        ### 處理結果

        成功時提交壓力測試計算任務；後續狀態和返回數據以 `200` 響應定義為準。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - simulate_cal_type
                - cal_type
                - is_filter
                - remark
              properties:
                simulate_cal_type:
                  type: integer
                  description: |-
                    計算維度. enum SimulateCalType { 0=按批次號計算 1=按照股票組計算 2=按照市場計算 (Market) 3=按照股票計算 (Stock) 4=按指數級別計算
                    }，決定下方 task_id/stock_group_id/market/counter_id/index_price_limit_info 中哪個字段生效
                  enum:
                    - '0'
                    - '1'
                    - '2'
                    - '3'
                    - '4'
                  x-enum-details:
                    - value: '0'
                      label: 按批次號計算
                    - value: '1'
                      label: 按照股票組計算
                    - value: '2'
                      label: 按照市場計算
                    - value: '3'
                      label: 按照股票計算
                    - value: '4'
                      label: 按指數級別計算
                  example: '0'
                task_id:
                  type: string
                  description: 批次號. 僅 simulate_cal_type=0 時使用
                market:
                  type: string
                  description: 市場. 僅 simulate_cal_type=2 時使用，如 HK/US
                stock_group_id:
                  type: integer
                  description: 股票組ID. 僅 simulate_cal_type=1 時使用
                counter_id:
                  type: string
                  description: 股票代碼. 僅 simulate_cal_type=3 時使用
                price_limit:
                  type: string
                  description: 漲跌幅. 假設的價格變動百分比，如 -10 表示下跌 10%
                index_price_limit_info:
                  type: object
                  description: 指數級別跌幅設置. 僅 simulate_cal_type=4 時使用，子字段 tier1_price_limit/tier2_price_limit/other_price_limit 分別對應指數級別1/級別2/其他級別的假設跌幅
                cal_type:
                  type: integer
                  description: |-
                    計算類型。
                  enum:
                    - 0
                    - 1
                    - 2
                  items:
                    type: string
                  x-enum-details:
                    - value: 0
                      label: 全量計算
                    - value: 1
                      label: margin call 計算
                    - value: 2
                      label: 非速凍資金盈餘計算
                  example: 0
                is_filter:
                  type: boolean
                  description: |-
                    是否使用豁免規則. 是否使用豁免規則。此字段為必填項。

                    **布爾值：**
                    - `true` - 表示條件成立
                    - `false` - 表示條件不成立
                remark:
                  type: string
                  description: 自定義數據標題. 用於指定「自定義數據標題」。此字段為必填項。
            example:
              simulate_cal_type: 1
              task_id: ''
              market: HK
              stock_group_id: 0
              counter_id: ''
              price_limit: '-10'
              index_price_limit_info:
                tier1_price_limit: '-10'
                tier2_price_limit: '-15'
                other_price_limit: '-20'
              cal_type:
                - '1'
              is_filter: false
              remark: 2026Q3 压力测试
      responses:
        '200':
          description: 請求處理成功。業務結果位於 `data`，包含 `task_id` 字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。

                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`
                      判斷具體結果。

                      - `401`：未登錄。
                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      task_id:
                        type: string
                        description: 批次號. 本次壓力測試計算生成的批次號
              example:
                code: 0
                message: success
                data:
                  task_id: string
        '400':
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登錄或登錄狀態已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 當前賬號未獲得該功能授權。請在 User Permission 中為該賬號開通相應權限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 請求處理超時。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
      x-mint:
        href: /zh-HK/api-reference/simulate_margin_call_cal_v3
        metadata:
          sidebarTitle: Margin Call 壓力測試計算
