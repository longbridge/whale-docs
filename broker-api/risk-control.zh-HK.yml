                        - `0` - 表示證券賬號
                        - `1` - 表示客戶編號
                      enum:
                        - '0'
                        - '1'
                    value:
                      type: string
                      description: 名單值. 用於按「名單值」篩選結果。
                    block_type:
                      type: string
                      description: |-
                        業務標籤. 用於按「業務標籤」篩選結果。

                        **可選值：**
                        - `1` - 表示授信
                        - `2` - 表示資產調撥
                        - `3` - 表示授信動態調額
                        - `4` - 表示自動平倉
                      enum:
                        - '1'
                        - '2'
                        - '3'
                        - '4'
                    status:
                      type: string
                      description: |-
                        狀態. 用於按「狀態」篩選結果。

                        **可選值：**
                        - `0` - 表示已啓用
                        - `1` - 表示已停用
                      enum:
                        - '0'
                        - '1'
                page:
                  type: integer
                  description: 頁碼. 要查詢的頁碼，從 `1` 開始。
                page_size:
                  type: integer
                  description: 每頁數量. 每頁返回的記錄數量。
                orderBy:
                  type: array
                  description: 排序參數. 排序規則數組；每一項定義一個排序字段及排序方向。
                  items:
                    type: object
