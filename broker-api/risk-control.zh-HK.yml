  /v1/risk_monitoring/index_level_operate:
    post:
      operationId: index_level_operate
      summary: 新增/編輯指數級別
      tags:
        - 風控管理
      x-lbonly: false
      description: |-
        指數級別 (Index Level) 的統一維護接口，透過 `operation` 區分新增、編輯、刪除和初始化數據四種動作。

        ### 請求參數

        - 必填：`index_code`（指數編碼）、`index_name`（指數名）、`index_type`（指數級別類型）、`operator`（操作人）、`operation`（操作類型）
        - 可選：`remark`（備註）、`id`（記錄 ID）
        - 各欄位的格式、取值範圍、預設行為和業務含義見對應欄位說明。

        ### 業務說明

        `operation` 控制具體動作：新增（`0`）提交指數編碼/名稱/級別類型/備註；編輯（`1`）額外帶 `id`；刪除（`2`）欄位沿用 stock_level 命名（歷史遺留）；初始化數據（`3`）僅傳 `operation`。

        ### 風險提示

        此操作會變更壓力測試所用的指數級別配置，影響相關風控計算。調用前請確認操作類型和參數無誤。

        ### 處理結果

        成功時完成所述業務操作；後續狀態和返回數據以 `200` 響應定義為準。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - index_code
                - index_name
                - index_type
                - operator
                - operation
              properties:
                index_code:
                  type: string
                  description: 指數編碼. 用於指定「指數編碼」。此字段為必填項。
                index_name:
                  type: string
                  description: 指數名. 用於指定「指數名」。此字段為必填項。
                index_type:
                  type: integer
                  description: 指數級別類型. 指數級別，單選：0=Tier1，1=Tier2，2=Other。刪除操作沿用字段名 stock_level（取該記錄的 stock_level_val），屬歷史命名遺留。
                  enum:
                    - '0'
                    - '1'
                    - '2'
                  example: '0'
                remark:
                  type: string
                  description: 備註. 隨本次操作保存的備註。
                operator:
                  type: string
                  description: 操作人. 當前登錄操作員賬號，新增/編輯/刪除均帶上
                operation:
                  type: integer
                  description: 操作類型. 操作類型：0=新增，1=編輯，2=刪除，3=初始化數據（僅傳 operation=3，無其它字段）
                  enum:
                    - '0'
                    - '1'
                    - '2'
                    - '3'
                  x-enum-details:
                    - value: '0'
                      label: 新增
                    - value: '1'
                      label: 編輯
                    - value: '2'
                      label: 刪除
                    - value: '3'
                      label: 初始化數據
                  example: '0'
                id:
                  type: integer
                  description: 記錄ID. 僅編輯（operation=1）和刪除（operation=2）時傳，新增（operation=0）和初始化（operation=3）不傳
            example:
              index_code: HSI
              index_name: 恒生指数
              index_type: 0
              remark: 港股一级指数
              operator: user@example.com
              operation: 1
              id: 10086
      responses:
        '200':
          description: 請求處理成功。響應的 `data` 不包含額外業務字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。

                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`
                      判斷具體結果。

                      - `401`：未登錄。
                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登錄或登錄狀態已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 當前賬號未獲得該功能授權。請在 User Permission 中為該賬號開通相應權限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 請求處理超時。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
