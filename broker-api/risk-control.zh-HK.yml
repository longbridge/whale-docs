                          properties:
                            id:
                              type: string
                              description: 預警編號. **返回值：** 當前記錄的唯一標識。
                            account_channel:
                              type: string
                              description: 櫃檯渠道. **返回值：** 櫃檯渠道。
                            aaid:
                              type: string
                              description: 賬號. **返回值：** 賬號。
                            aaid_val:
                              type: string
                              description: 賬號（原始值）. 字段 aaid 的原始值：aaid 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            alert_type:
                              type: string
                              description: 預警類型. **返回值：** 預警類型。
                            alert_type_val:
                              type: string
                              description: 預警類型（原始值）. 字段 alert_type 的原始值：alert_type 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            status:
                              type: string
                              description: 狀態. **返回值：** 狀態。
                            status_val:
                              type: string
                              description: 狀態（原始值）. 字段 status 的原始值：status 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            reason:
                              type: string
                              description: 原因. **返回值：** 原因。
                            reason_val:
                              type: string
                              description: 原因（原始值）. 字段 reason 的原始值：reason 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            comment:
