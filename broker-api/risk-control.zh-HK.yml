                            message_status_val:
                              type: string
                              description: 消息狀態（原始值）. 字段 message_status 的原始值：message_status 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            counter_id:
