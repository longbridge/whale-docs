                              description: 幣種. **返回值：** 幣種。
                            net_asset_ratio:
                              type: string
                              description: 淨資產比率. **返回值：** 淨資產比率。
                            warning_value:
                              type: string
                              description: 應追繳保證金. **返回值：** 應追繳保證金。
                            total_cash:
