                      enum:
                        - '0'
                        - '1'
                    remark:
                      type: string
                      description: |-
                        備註. 用於按「備註」篩選結果。

                        支持多選；提交時使用英文逗號（`,`）拼接多個值。不傳時不按此字段篩選。

                        **可選值：**
