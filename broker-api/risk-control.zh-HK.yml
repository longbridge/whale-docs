        ### 返回結果

        成功時返回匹配的記錄列表及分頁信息。各過濾字段的用途、可選值和動態數據來源見對應字段說明。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 過濾條件. 組合業務過濾條件。省略某個過濾字段時，不按該字段篩選。
                  properties:
                    member_id:
                      type: string
                      description: 客戶. 用於按「客戶」篩選結果。
                    review_status:
                      type: string
                      description: |-
                        審批狀態. 用於按「審批狀態」篩選結果。

                        **可選值：**
                        - `0` - 表示待提交審批
                        - `1` - 表示拒絕
                        - `2` - 表示通過
                        - `3` - 表示審批中
                        - `4` - 表示關閉
                      enum:
                        - '0'
                        - '1'
                        - '2'
                        - '3'
                        - '4'
                    account_type:
                      type: string
                      description: |-
                        賬戶類型. 用於按「賬戶類型」篩選結果。

                        **可選值：**
                        - `M` - 表示融資賬戶
                        - `C` - 表示現金賬戶
                        - `F` - 表示期貨賬戶
                      enum:
                        - M
                        - C
                        - F
                    mark:
                      type: string
                      description: |-
                        賬戶標識. 用於按「賬戶標識」篩選結果。

                        **可選值：**
                        - `dt` - 表示 Day Trade
                      enum:
                        - dt
                page:
                  type: integer
                  description: 頁碼. 要查詢的頁碼，從 `1` 開始。
                page_size:
                  type: integer
                  description: 每頁數量. 每頁返回的記錄數量。
                orderBy:
                  type: array
                  description: 排序參數. 排序規則數組；每一項定義一個排序字段及排序方向。
                  items:
                    type: object
            example:
              filters: {}
              page: 1
              page_size: 20
              orderBy: []
      responses:
        '200':
          description: 成功時分頁返回「授信額度申請記錄」記錄，以及頁碼、每頁數量和總記錄數等分頁信息。
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。

                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`
                      判斷具體結果。

