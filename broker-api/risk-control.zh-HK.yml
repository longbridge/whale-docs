      x-lbonly: false
      description: |-
        查詢「客戶組查詢」數據，可通過 `filters` 組合業務篩選條件，並使用 `page`、`page_size` 和 `orderBy` 控制分頁與排序。

        ### 返回結果

        成功時返回匹配的記錄列表及分頁信息。各過濾字段的用途、可選值和動態數據來源見對應字段說明。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 過濾條件. 組合業務過濾條件。省略某個過濾字段時，不按該字段篩選。
                  properties:
                    name:
                      type: string
                      description: 客戶組名稱. 用於按「客戶組名稱」篩選結果。
                    account_no_list:
                      type: string
                      description: 證券帳號. 用於按「證券帳號」篩選結果。
                    business_type:
                      type: string
                      description: |-
                        業務類型. 用於按「業務類型」篩選結果。

                        **可選值：**
                        - `1` - 表示保證金
                        - `2` - 表示報表
                        - `3` - 表示風控參數
                      enum:
                        - '1'
                        - '2'
                        - '3'
                page:
                  type: integer
                  description: 頁碼. 要查詢的頁碼，從 `1` 開始。
                page_size:
                  type: integer
                  description: 每頁數量. 每頁返回的記錄數量。
                orderBy:
                  type: array
                  description: 排序參數. 排序規則數組；每一項定義一個排序字段及排序方向。
                  items:
                    type: object
            example:
              filters: {}
              page: 1
              page_size: 20
              orderBy: []
      responses:
        '200':
          description: 成功時分頁返回「客戶組查詢」記錄，以及頁碼、每頁數量和總記錄數等分頁信息。
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。

                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`
                      判斷具體結果。

                      - `401`：未登錄。
                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。
                  message:
                    type: string
                  data:
                    type: object
                    required:
                      - list
                      - total
                    properties:
                      list:
                        type: array
                        description: 列表. **返回值：** 列表列表。
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: 客戶組 ID. **返回值：** 當前記錄的唯一標識。
                            business_type:
                              type: string
                              description: 業務類型. **返回值：** 業務類型。
                            business_type_val:
                              type: string
                              description: 業務類型（原始值）. 字段 business_type 的原始值：business_type 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            name:
                              type: string
                              description: 客戶組名稱. **返回值：** 客戶組名稱。
                            count:
                              type: string
                              description: 客戶數量. **返回值：** 客戶數量。
                            remark:
                              type: string
                              description: 備註. **返回值：** 備註。
                            updated_at:
                              type: string
                              description: 更新時間. **返回值：** 更新時間；時間或日期格式以接口實際返回值為準。
                            op_user:
                              type: string
                              description: 操作人. **返回值：** 操作人。
                      total:
                        type: integer
                        description: 總條數. **返回值：** 符合查詢條件的記錄總數，用於計算分頁。
              example:
                code: 0
                message: success
                data:
                  list:
                    - id: '1139'
                      business_type: Margin
                      business_type_val: '1'
                      name: NANA测试
                      count: '1'
