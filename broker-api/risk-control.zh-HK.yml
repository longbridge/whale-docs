                  aaid: H00000000
                  code: ''
                  trader: ''
                  trader_name: ''
                  client_group: ''
                  client_group_name: ''
                  stock_group: ''
              is_apply: true
              audit_frontend_resource:
                $action: add
                $behavior: 限额生效
