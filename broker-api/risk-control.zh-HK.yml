  /v1/risk_monitoring/update_exchange_rule_v2:
    post:
      operationId: update_exchange_rule_v2
      summary: 編輯借幣提醒換匯規則
      tags:
        - 風控管理
      x-lbonly: false
      description: |-
        編輯借幣提醒換匯規則。

        ### 請求參數

        - 必填：`main`（主幣種換匯規則）、`other`（其他幣種換匯規則）、`is_display`（是否展示/啓用）
        - 可選：`front_payload`（调用方變更差異）、`audit_frontend_resource`（调用方審計上下文）
        - 各字段的格式、取值範圍和業務含義見對應字段說明。

        ### 處理結果

        成功時完成上述業務操作；後續狀態和返回數據以 `200` 響應定義為準。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - main
                - other
                - is_display
              properties:
                main:
                  type: object
                  description: 主幣種換匯規則. 包含 debt(欠款金額閾值)、avail_with_draw(可提現金額閾值)、currency(賬戶主幣種，只讀展示不可編輯)三個字段，均為字符串數值
                other:
                  type: array
                  description: |-
                    其他幣種換匯規則. 數組，每項 {currency: 幣種代碼（取值來自 global_currency_which_support_exchange 動態枚舉，非固定）, debt:
                    欠款金額閾值, avail_with_draw: 可提現金額閾值}，可增刪多條

                    請調用 `GET /v1/datasets/refs/tenant_exchange_currencies` 獲取當前可用的數據字典，並使用返回項的 `key` 作為本字段值。
                  x-value-source:
                    endpoint: GET /v1/datasets/refs/tenant_exchange_currencies
                  items:
                    type: string
                is_display:
                  type: boolean
                  description: |-
                    是否展示/啓用. - 單選
                    - 提交時字符串 'true'/'false' 轉為布爾值
                    - 為 false 時其餘金額字段禁用
                  enum:
                    - 'true'
                    - 'false'
                front_payload:
                  type: object
                  description: 前端變更差異. 非核心業務字段，type 固定為 data_diff，記錄 is_display/debt/avail_with_draw/other 變更前後值，用於審批工單展示
                audit_frontend_resource:
                  type: object
                  description: 審計上下文. 非核心業務字段，攜帶提交時的 is_display 值
            example:
              main:
                debt: '1000'
                avail_with_draw: '500'
                currency: HKD
              other:
                - currency: USD
                  debt: '200'
                  avail_with_draw: '100'
              is_display: true
              front_payload:
                type: data_diff
                data:
                  - label: 是否展示
                    key: is_display
                    before_value: 关闭
                    after_value: 开启
              audit_frontend_resource:
                is_display: true
      responses:
        '200':
          description: 請求處理成功。響應的 `data` 不包含額外業務字段。
          content:
            application/json:
              schema:
                type: object
