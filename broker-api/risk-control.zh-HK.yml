                              description: 名單維度. **返回值：** 名單維度。
                            dimension_val:
                              type: string
                              description: 名單維度（原始值）. 字段 dimension 的原始值：dimension 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            value:
                              type: string
                              description: 名單值. **返回值：** 名單值。
                            block_type:
                              type: string
                              description: 業務標籤. **返回值：** 業務標籤。
                            block_type_val:
                              type: string
                              description: 業務標籤（原始值）. 字段 block_type 的原始值：block_type 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            status:
                              type: string
                              description: 狀態. **返回值：** 狀態。
                            status_val:
                              type: string
                              description: 狀態（原始值）. 字段 status 的原始值：status 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            account_channel:
                              type: string
                              description: 櫃檯渠道. **返回值：** 櫃檯渠道。
                            created_at:
                              type: string
                              description: 創建時間. **返回值：** 創建時間；時間或日期格式以接口實際返回值為準。
                            operator:
                              type: string
                              description: 創建人. **返回值：** 創建人。
                            remark:
                              type: string
                              description: 備註. **返回值：** 備註。
                            updated_by:
                              type: string
                              description: 更新人. **返回值：** 更新人。
                            updated_at:
                              type: string
                              description: 更新時間. **返回值：** 更新時間；時間或日期格式以接口實際返回值為準。
                      total:
                        type: integer
                        description: 總條數. **返回值：** 符合查詢條件的記錄總數，用於計算分頁。
              example:
