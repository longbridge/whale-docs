                  properties:
                    due_date:
                      type: string
                      description: 行權日. 用於按「行權日」篩選結果。
                      format: date
                    status:
                      type: string
                      description: |-
                        處理狀態. 用於按「處理狀態」篩選結果。

                        **可選值：**
                        - `handled` - 表示已處理
                        - `waittohandle` - 表示待處理
                        - `waittocheck` - 表示待對賬
                      enum:
                        - handled
                        - waittohandle
                        - waittocheck
                    settlement_channel_code:
                      type: string
                      description: |-
                        結算渠道. 用於按「結算渠道」篩選結果。

                        **可選值：**
                        - `3` - 表示 ib
                        - `26` - 表示 atomic
                      enum:
                        - '3'
                        - '26'
                page:
                  type: integer
                  description: 頁碼. 要查詢的頁碼，從 `1` 開始。
                page_size:
                  type: integer
                  description: 每頁數量. 每頁返回的記錄數量。
                orderBy:
                  type: array
                  description: 排序參數. 排序規則數組；每一項定義一個排序字段及排序方向。
                  items:
                    type: object
            example:
              filters: {}
              page: 1
              page_size: 20
              orderBy: []
      responses:
        '200':
          description: 成功時分頁返回「期權行權總覽」記錄，以及頁碼、每頁數量和總記錄數等分頁信息。
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。

                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`
                      判斷具體結果。

                      - `401`：未登錄。
                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。
                  message:
                    type: string
                  data:
                    type: object
                    required:
                      - list
                      - total
                    properties:
                      list:
                        type: array
                        description: 列表. **返回值：** 列表列表。
                        items:
                          type: object
                          properties:
                            due_date:
                              type: string
                              description: 行權日. **返回值：** 行權日；時間或日期格式以接口實際返回值為準。
                            status:
                              type: string
                              description: 處理狀態. **返回值：** 處理狀態。
                            status_val:
                              type: string
                              description: 處理狀態（原始值）. 字段 status 的原始值：status 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            option_count:
                              type: string
                              description: 期權標的數量. **返回值：** 期權標的數量。
                            total_option_holding_num:
                              type: string
                              description: 持倉總張數. **返回值：** 持倉總張數。
                            exercised_option_count:
                              type: string
                              description: 行權標的數. **返回值：** 行權標的數。
                            advance_exercise_option_count:
                              type: string
                              description: 提前行權標的數. **返回值：** 提前行權標的數。
                            expired_option_count:
                              type: string
                              description: 放棄行權標的數. **返回值：** 放棄行權標的數。
                            partially_exercised_option_count:
                              type: string
                              description: 部分行權標的數. **返回值：** 部分行權標的數。
                            handled_option_count:
                              type: string
                              description: 已處理標的數. **返回值：** 已處理標的數。
                            settlement_channel_code:
                              type: string
                              description: 結算渠道. **返回值：** 結算渠道。
                            settlement_channel_code_val:
                              type: string
                              description: 結算渠道（原始值）. 字段 settlement_channel_code 的原始值：settlement_channel_code 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                      total:
                        type: integer
                        description: 總條數. **返回值：** 符合查詢條件的記錄總數，用於計算分頁。
              example:
                code: 0
                message: success
                data:
                  list:
                    - due_date: 2026-07-14
