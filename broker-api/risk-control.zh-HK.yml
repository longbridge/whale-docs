      x-lbonly: false
      description: |-
        查詢風控黑名單記錄，用於按多種維度對客戶或標的實施業務限制。

        ### 請求參數

        - 通過 `filters` 組合業務篩選條件（可選欄位見下方 filters 欄位說明），並使用 `page`、`page_size`、`orderBy` 控制分頁與排序。

        ### 業務說明

        - 每條記錄代表一條黑名單，包含名單維度（如客戶編號等）、名單值、業務標籤、啟用狀態，以及備註、操作人和更新時間。
        - 名單維度標明限制對象的類型，名單值為具體被限制的對象，業務標籤標明限制適用的業務範圍。
        - 用於風控攔截：命中黑名單的對象在相應業務中會被禁止或受限。
        - 可按名單維度、名單值、業務標籤、狀態篩選。

        ### 返回結果

        成功時返回匹配的記錄列表及分頁信息。返回列含義見響應定義。
