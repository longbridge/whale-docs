                      format: date
                      example: '1780272721'
                    updated_at:
                      type: string
                      description: 更新時間. 用於按「更新時間」篩選結果。
                      format: date
                      example: '1780654926'
                    is_auto:
                      type: string
                      description: 自動換匯. 用於按「自動換匯」篩選結果。
                      enum:
                        - 'true'
                        - 'false'
                      x-enum-details:
                        - value: 'true'
                          label: 開啓
                        - value: 'false'
                          label: 關閉
                      example: Closed
                    status:
                      type: string
                      description: 狀態. 用於按「狀態」篩選結果。
                      enum:
                        - '0'
                        - '5'
                        - '2'
                        - '1'
                        - '3'
                      x-enum-details:
                        - value: '0'
                          label: 待處理
                        - value: '5'
                          label: 結束
                        - value: '2'
                          label: 換匯中
                        - value: '1'
                          label: 換匯審核中
                        - value: '3'
                          label: 換匯失敗
                      example: Pending
                page:
                  type: integer
                  description: 頁碼. 要查詢的頁碼，從 `1` 開始。
                page_size:
                  type: integer
                  description: 每頁數量. 每頁返回的記錄數量。
                orderBy:
                  type: array
                  description: 排序參數. 排序規則數組；每一項定義一個排序字段及排序方向。
                  items:
                    type: object
