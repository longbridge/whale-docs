  /risk_limit/v1/client_group/batch_apply:
    post:
      operationId: client_group_batch_apply
      summary: 批量申請客戶類別（組）交易限額
      tags:
        - 風控管理
      x-permission-key:
        - lb_hk_risk_limit_config.risk_limit_config_client_update
      x-lbonly: false
      description: |-
        由行內操作項或懸浮批量操作欄調用，兩種場景僅傳入值不同。此操作會更改真實交易限額的生效狀態，風險較高。

        ### 請求參數

        - 必填：`list`（批量操作的限額配置記錄列表）、`is_apply`（是否生效）
        - 可選：`audit_frontend_resource`（调用方審計日誌信息）
        - 各字段的格式、取值範圍、默認行為和業務含義見對應字段說明。

        ### 風險提示

        > 此操作可能影響真實業務數據或資產狀態。調用前請核對目標記錄、金額、數量和操作類型。

        ### 處理結果

        成功時完成所述業務操作，具體返回內容見 `200` 響應定義。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - list
                - is_apply
              properties:
                list:
                  type: array
                  description: |-
                    批量操作的限額配置記錄列表. 每項字段含義：counter_id 櫃檯號，aaid 客戶賬戶ID，code 證券代碼（本客戶組維度通常為空），trader/trader_name 交易員ID/名稱，
                    client_group/client_group_name 客戶類別（組）ID/名稱，stock_group 股票分組ID。
                  items:
                    type: string
                is_apply:
                  type: boolean
                  description: |-
                    是否生效. 批量設置目標記錄是否生效。

                    **可選值：**
                    - `true` - 表示批量生效
                    - `false` - 表示批量失效
                  enum:
                    - 'true'
                    - 'false'
                audit_frontend_resource:
                  type: object
                  description: '審計上下文. 非業務參數，僅供後端審計記錄使用。$action: ''add''(生效)|''delete''(失效)；$behavior: 審計行為描述文案。'
            example:
              list:
                - counter_id: '1'
                  aaid: H00000000
                  code: ''
                  trader: ''
                  trader_name: ''
                  client_group: '1'
                  client_group_name: VIP客户组
                  stock_group: ''
              is_apply: true
              audit_frontend_resource:
                $action: add
                $behavior: 限额生效
      responses:
        '200':
          description: 請求處理成功。響應的 `data` 不包含額外業務字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。

                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`
                      判斷具體結果。

                      - `401`：未登錄。
                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。
                  message:
                    type: string
                  data:
                    type: object
                    description: "成功時 `data` 為空對象。"
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登錄或登錄狀態已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 當前賬號未獲得該功能授權。請在 User Permission 中為該賬號開通相應權限。
          content:
            application/json:
