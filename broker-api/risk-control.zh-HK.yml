  /v1/datasets/risk_exchange_backups:
    post:
      operationId: risk_exchange_backups
      summary: 快照
      tags:
        - 風控管理
      x-lbonly: false
      description: |-
        查詢借幣提醒的歷史快照，用於風控團隊留痕並回溯提醒在某一時點的欠款與可換匯狀態。

        ### 請求參數

        - 透過 `filters` 組合業務篩選條件（可選欄位見下方 filters 欄位說明），並使用 `page`、`page_size`、`orderBy` 控制分頁與排序。

        ### 業務說明

        - 每條記錄是某一時點對借幣/換匯提醒的快照，包含快照編號、快照記錄時間、提醒編號、證券賬號、來源、觸發時間、幣種、欠款金額與可兌換幣種金額。
        - 快照用於審計與追溯，保留提醒生成或變更時刻的現場資料。
        - 可按提醒編號、快照記錄時間、客戶及來源（支持多選）篩選。

        ### 返回結果

        成功時返回匹配的記錄列表及分頁資訊。返回欄位含義見回應定義。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 過濾條件. 組合業務過濾條件。省略某個過濾字段時，不按該字段篩選。
                  properties:
                    exchange_log_id:
                      type: string
                      description: 提醒編號. 用於按「提醒編號」篩選結果。
                      example: '189504'
                    created_at:
                      type: string
                      description: 快照記錄時間. 用於按「快照記錄時間」篩選結果。
                      format: date
                      example: '1780293618'
                    aaid:
                      type: string
                      description: 客戶. 用於按「客戶」篩選結果。
                    backup_origin:
                      type: string
                      description: |-
                        來源. 用於按「來源」篩選結果。

                        支持多選；提交時使用英文逗號（`,`）拼接多個值。不傳時不按此字段篩選。
                      example: Auto Conversion
                      enum:
                        - '0'
                        - '1'
                        - '2'
                        - '3'
                        - '4'
                        - '5'
                      x-enum-details:
                        - value: '0'
                          label: 自動兌換定時任務
                        - value: '1'
                          label: 消息提醒定時任務
                        - value: '2'
                          label: 餘額通自動贖回
                        - value: '3'
                          label: 餘額通贖回觸發兌換
                        - value: '4'
                          label: 結束提醒
                        - value: '5'
                          label: 人工兌換
                page:
                  type: integer
                  description: 頁碼. 要查詢的頁碼，從 `1` 開始。
                page_size:
                  type: integer
                  description: 每頁數量. 每頁返回的記錄數量。
                orderBy:
                  type: array
                  description: 排序參數. 排序規則數組；每一項定義一個排序字段及排序方向。
                  items:
                    type: object
            example:
              filters: {}
              page: 1
              page_size: 20
              orderBy: []
      responses:
        '200':
          description: 成功時分頁返回「借幣提醒快照」記錄，以及頁碼、每頁數量和總記錄數等分頁信息。
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。

                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`
                      判斷具體結果。

                      - `401`：未登錄。
                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。
                  message:
                    type: string
                  data:
                    type: object
                    required:
                      - list
                      - total
                    properties:
                      list:
                        type: array
                        description: 列表. **返回值：** 列表列表。
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: 編號. **返回值：** 當前記錄的唯一標識。
                            created_at:
                              type: string
                              description: 快照記錄時間. **返回值：** 快照記錄時間；時間或日期格式以接口實際返回值為準。
                            exchange_log_id:
                              type: string
                              description: 提醒編號. **返回值：** 提醒編號。
                            origin_id:
                              type: string
                              description: 證券賬號. **返回值：** 證券賬號。
                            backup_origin:
                              type: string
                              description: 來源. **返回值：** 來源。
                            backup_origin_val:
                              type: string
                              description: 來源（原始值）. 字段 backup_origin 的原始值：backup_origin 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            alert_time:
                              type: string
                              description: 觸發時間. **返回值：** 觸發時間；時間或日期格式以接口實際返回值為準。
                            currency:
                              type: string
                              description: 幣種. **返回值：** 幣種。
                            debt_amount:
                              type: string
                              description: 欠款金額. **返回值：** 欠款金額。
                            own_amount:
                              type: string
                              description: 可兌換幣種金額. **返回值：** 可兌換幣種金額。
                      total:
                        type: integer
                        description: 總條數. **返回值：** 符合查詢條件的記錄總數，用於計算分頁。
              example:
                code: 0
                message: success
                data:
                  list:
                    - id: '4834455'
                      created_at: '1780293618'
                      exchange_log_id: '189504'
                      origin_id: H00000000
                      backup_origin: Auto Conversion
                      backup_origin_val: '0'
                      alert_time: '1776162508'
                      currency: HKD
                      debt_amount: 3,001,807.85
                      own_amount: 7,100,685,227.74
                  total: 4813866
        '400':
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登錄或登錄狀態已失效。
          content:
