        以 `dimension` 與 `value` 標識被拉黑對象，`block_type_list` 指定該對象受限的一種或多種業務類型。提交前會校驗該對象是否已授信。

        ### 風險提示

        此操作會對目標對象施加黑名單限制，可能影響其後續開戶、交易或資金等業務。調用前請確認維度、維度值和拉黑類型無誤。

        ### 處理結果

