  /risk/v1/short_sell_margin_ratio/edit_review:
    post:
      operationId: short_sell_margin_ratio_edit_review
      summary: 修改賣空保證金比例（接入審核）
      tags:
        - 風控管理
      x-lbonly: false
      description: |-
        修改賣空（空頭）股票的保證金比例，並提交進入審核流程。

        ### 請求參數

        - 必填：`counter_id`（證券代碼）、`im_factor`（初始保證金率）、`mm_factor`（維持保證金率）、`fm_factor`（強平保證金率）、`mcm_factor`（Margin Call 保證金率）
        - 可選：`short_sell_status`（可賣空狀態）、`short_sellable`（是否可賣空）、`short_selling_close_qty`（賣空平倉數量）、`short_selling_open_qty`（賣空開倉數量）、`audit_frontend_resource`（審計上下文）
        - 各欄位的格式、取值範圍和業務含義見對應欄位說明。

        ### 風險提示

        此操作涉及真實賣空保證金比例變更，風險極高。調用前請確認證券代碼與各項保證金率無誤。

        ### 處理結果

        成功時提交修改並進入審核；後續狀態和返回數據以 `200` 回應定義為準。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - counter_id
                - im_factor
                - mm_factor
                - fm_factor
                - mcm_factor
              properties:
                counter_id:
                  type: string
                  description: 證券代碼
                im_factor:
                  type: string
                  description: 初始保證金率
                mm_factor:
                  type: string
                  description: 維持保證金率
                fm_factor:
                  type: string
                  description: 強平保證金率
                mcm_factor:
                  type: string
                  description: Margin Call 保證金率
                short_sell_status:
                  type: number
                  description: 可賣空狀態
                short_sellable:
                  type: boolean
                  description: 是否可賣空
                short_selling_close_qty:
                  type: number
                  description: 融券池關閉數量
                short_selling_open_qty:
                  type: number
                  description: 融券池恢復數量
                audit_frontend_resource:
                  type: object
                  description: audit_frontend_resource
      responses:
        '200':
          description: 未實調，響應字段以真實接口為準。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: 0 表示成功；非 0 為業務錯誤碼，此時 data 通常為空。HTTP 狀態碼本身恆為 200，請勿依賴 HTTP status 判斷成功/失敗。
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      ticket_id:
                        type: string
              example:
                code: 0
                message: success
                data: {}
