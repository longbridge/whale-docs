                      format: date
                    updated_at:
                      type: string
                      description: 更新時間. 用於按「更新時間」篩選結果。
                      format: date
                    is_auto:
                      type: string
                      description: |-
                        自動換匯. 用於按「自動換匯」篩選結果。

                        **可選值：**
                        - `true` - 表示開啓
