                  properties:
                    member_id:
                      type: string
                      description: 客戶. 用於按「客戶」篩選結果。
                    origin:
                      type: string
                      description: |-
                        授信來源. 用於按「授信來源」篩選結果。

                        **可選值：**
                        - `auto_credit` - 表示自動授信
                        - `credit_audit` - 表示人工單個調整
                        - `app_auto` - 表示用戶 app 申請調額 (自動通過)
                        - `rule_change` - 表示人工規則/名單調增調減額度
                        - `batch_change` - 表示批量變更額度
                        - `credit_group` - 表示授信組
                        - `manual_add` - 表示人工新增授信客戶
                        - `credit_blacklist` - 表示授信黑名單聯動
                        - `manual_adjust` - 表示人工修改授信客戶
                        - `dynamic_credit_limit_adjustment` - 表示授信動態調額
                      enum:
                        - auto_credit
                        - credit_audit
                        - app_auto
                        - rule_change
                        - batch_change
                        - credit_group
                        - manual_add
                        - credit_blacklist
                        - manual_adjust
                        - dynamic_credit_limit_adjustment
