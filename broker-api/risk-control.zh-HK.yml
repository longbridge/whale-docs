        每條記錄對應一條預警，包含客戶與證券賬號、預警類型與狀態、觸發/轉平倉/截止時間、應追繳保證金、含貸權益值（ELV）、初始/維持/平倉保證金、淨資產比率、含貸權益值與維持保證金比值、持倉總市值、可平倉股票及是否持有末日期權等風控指標。

        支援按客戶、持倉股票、末日期權、賬戶類型等多維篩選，服務於追繳與平倉決策。

        ### 返回結果

        成功時返回匹配的記錄列表及分頁資訊。返回列含義見回應定義。
