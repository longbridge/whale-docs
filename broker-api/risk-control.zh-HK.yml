                        description: 列表. **返回值：** 列表列表。
                        items:
                          type: object
                          properties:
                            counter_id:
                              type: string
                              description: 股票代碼. **返回值：** 股票代碼。
                            long_mm_factor:
                              type: string
                              description: 多頭維持保證金比例（%）. **返回值：** 多頭維持保證金比例（%）。
                            has_short_holding:
                              type: string
                              description: 是否有空頭持倉. **返回值：** 表示是否有空頭持倉。
                            has_short_holding_val:
                              type: string
                              description: 是否有空頭持倉（原始值）. 字段 has_short_holding 的原始值：has_short_holding 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            short_mm_factor:
                              type: string
                              description: 空頭維持保證金比例（%）. **返回值：** 空頭維持保證金比例（%）。
                            rms_last_price:
                              type: string
                              description: 風控最新價（USD）. **返回值：** 風控最新價（USD）。
                            overnight_last_price:
                              type: string
                              description: 夜盤最新價（USD）. **返回值：** 夜盤最新價（USD）。
                            overnight_change_ratio:
                              type: string
                              description: 夜盤漲跌幅（%）. **返回值：** 夜盤漲跌幅（%）。
                            max_used_finance_origin_id:
                              type: string
                              description: 最大融資客戶. **返回值：** 最大融資客戶。
                            min_net_assets_ratio_origin_id:
                              type: string
                              description: 淨資產比例最低客戶. **返回值：** 淨資產比例最低客戶。
                            created_at:
                              type: string
                              description: 更新時間. **返回值：** 更新時間；時間或日期格式以接口實際返回值為準。
                      total:
                        type: integer
                        description: 總條數. **返回值：** 符合查詢條件的記錄總數，用於計算分頁。
              example:
                code: 0
