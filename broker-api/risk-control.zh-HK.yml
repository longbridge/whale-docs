                    type: string
                  data:
                    type: object
                    properties:
                      msg:
                        type: string
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
