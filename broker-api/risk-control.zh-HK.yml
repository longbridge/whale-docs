      x-lbonly: false
      description: |-
        查詢導入的自訂壓力測試情景數據明細，用於驅動 Margin Call 壓力測試的保證金參數測算。

        ### 請求參數

        - 透過 `filters` 組合業務篩選條件（可選欄位見下方 filters 欄位說明），並使用 `page`、`page_size`、`orderBy` 控制分頁與排序。

