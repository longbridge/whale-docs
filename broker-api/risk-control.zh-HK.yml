  /v1/datasets/risk_client_limits:
    get:
      operationId: risk_client_limits
      summary: 客戶限額
      tags:
        - 風控管理
      x-permission-key:
        - lb_hk_risk_limit_config.risk_limit_config_client_query
      x-lbonly: false
      description: |-
        查詢「客戶限額」數據，可通過 `filters` 組合業務篩選條件，並使用 `page`、`page_size` 和 `orderBy` 控制分頁與排序。

