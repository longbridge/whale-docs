                            aaid:
                              type: string
                              description: 開戶編號. **返回值：** 開戶編號。
                            aaid_val:
                              type: string
                              description: 開戶編號（原始值）. 字段 aaid 的原始值：aaid 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            credit_group_name:
                              type: string
                              description: 授信組. **返回值：** 授信組。
                            account_channel:
                              type: string
                              description: 櫃檯渠道. **返回值：** 櫃檯渠道。
                            account_channel_val:
                              type: string
                              description: 櫃檯渠道（原始值）. 字段 account_channel 的原始值：account_channel 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            credit_currency:
                              type: string
                              description: 幣種. **返回值：** 幣種。
