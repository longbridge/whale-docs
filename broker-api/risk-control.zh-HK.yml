  /risk_limit/v1/trader/batch_apply:
    post:
      operationId: trader_batch_apply
      summary: 批量申請交易員交易限額
      tags:
        - 風控管理
      x-permission-key:
        - lb_hk_risk_limit_config.risk_limit_config_trader_update
      x-lbonly: false
      description: |-
        批量申請交易員交易限額。

        ### 請求參數

        - 必填：`list`（交易員限額記錄列表）、`is_apply`（是否生效）
        - 可選：`audit_frontend_resource`（審計调用方資源）
        - 各字段的格式、取值範圍和業務含義見對應字段說明。

        ### 風險提示

        > 此操作可能引起真實資金、持倉或交易狀態變化。調用前請確認目標記錄和參數無誤。

        ### 處理結果

        成功時完成上述業務操作；後續狀態和返回數據以 `200` 響應定義為準。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - list
                - is_apply
              properties:
                list:
                  type: array
                  description: |-
                    交易員限額記錄列表. 批量勾選（或單條）的限額記錄，元素字段：counter_id(櫃檯ID)、aaid(賬戶AAID)、code(標的代碼)、trader(交易員賬號)、trader_name(交易員名稱)、
                    client_group(客戶分組ID)、client_group_name(客戶分組名稱)、stock_group(證券分組ID)
                  items:
                    type: string
                is_apply:
                  type: boolean
                  description: |-
                    是否生效. true=批量生效（申請啓用限額），false=批量失效（撤銷/停用限額）

                    **可選值：**
                    - `true` - 表示批量生效
                    - `false` - 表示批量失效
                  enum:
                    - 'true'
                    - 'false'
                audit_frontend_resource:
                  type: object
                  description: 審計上下文. 调用方埋點用審計信息，含 $action(add/delete) 與 $behavior(操作描述文案，如“限額生效”“限額失效”)
            example:
              list:
                - counter_id: '1000021'
                  aaid: H00000000
                  code: 700.HK
                  trader: T00123
                  trader_name: 张三
                  client_group: CG001
                  client_group_name: 机构客户组A
                  stock_group: SG001
              is_apply: true
              audit_frontend_resource:
                $action: add
                $behavior: 限额生效
      responses:
        '200':
          description: 請求處理成功。響應的 `data` 不包含額外業務字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。

                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`
                      判斷具體結果。

                      - `401`：未登錄。
                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。
                  message:
                    type: string
                  data:
                    type: object
                    description: "成功時 `data` 為空對象。"
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登錄或登錄狀態已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 當前賬號未獲得該功能授權。請在 User Permission 中為該賬號開通相應權限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 請求處理超時。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
      x-mint:
        href: /zh-HK/api-reference/trader_batch_apply
        metadata:
          sidebarTitle: 批量申請交易員交易限額
  /risk_limit/v1/global/reverse:
    post:
      operationId: global_reverse
      summary: 全局交易限額啓停
      tags:
        - 風控管理
      x-permission-key:
        - lb_hk_risk_limit_config.risk_limit_config_global_update
      x-lbonly: false
      description: |-
        點擊操作項時調用，請求字段由 `actionItems` 的 `onClick` 回調構造。此操作會更改全局交易限額的實際生效狀態，風險極高。

        ### 請求參數

        - 必填：`code`（限額配置代碼）、`enable`（是否啓用）
        - 可選：`audit_frontend_resource`（调用方審計日誌信息）
        - 各字段的格式、取值範圍、默認行為和業務含義見對應字段說明。

        ### 風險提示

        > 此操作可能影響真實業務數據或資產狀態。調用前請核對目標記錄、金額、數量和操作類型。

        ### 處理結果

        成功時完成所述業務操作，具體返回內容見 `200` 響應定義。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
                - enable
              properties:
                code:
                  type: string
                  description: 限額配置代碼. 取自當前操作行 record.code，標識具體是哪條全侷限額配置。
                enable:
                  type: boolean
                  description: |-
                    是否啓用. true=啓用，false=停用；點擊「啓用」操作項時傳 !（此時通常為 true），點擊「停用」時傳相反值（此時通常為 false）。

                    **可選值：**
                    - `true` - 表示啓用
                    - `false` - 表示停用
                  enum:
                    - 'true'
                    - 'false'
                audit_frontend_resource:
                  type: object
                  description: '審計上下文. 非業務參數，僅供後端審計記錄使用。$action: ''add''(啓用)|''delete''(停用)；$behavior: 審計行為描述文案。'
            example:
              code: GLOBAL_MAX_ORDER_QTY
              enable: true
              audit_frontend_resource:
                $action: add
                $behavior: 启用全局限额
      responses:
        '200':
