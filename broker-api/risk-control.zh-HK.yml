                              description: 證券名稱. **返回值：** 證券名稱。
                            warning_quantity:
                              type: string
                              description: 應追繳數量. **返回值：** 應追繳數量。
                            status:
                              type: string
                              description: 狀態. **返回值：** 狀態。
                            status_val:
                              type: string
                              description: 狀態（原始值）. 字段 status 的原始值：status 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            remark:
