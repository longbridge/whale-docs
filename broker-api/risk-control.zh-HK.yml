        ### 風險提示

        此操作會刪除客戶級股票期權保證金配置，直接影響該客戶期權持倉的保證金要求。調用前請確認目標記錄無誤。

        ### 處理結果

        成功時完成刪除操作；後續狀態和返回數據以 `200` 響應定義為準。
