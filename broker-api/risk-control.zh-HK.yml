openapi: 3.1.1
info:
  title: Longport Whale 券商 API
  description: 面向使用 Longport Whale 的券商提供機構級服務端 API。
  version: 2.0.0
servers:
  - url: https://b-api.longbridge.xyz
    description: 測試環境
  - url: https://b-api.lbkrs.com
    description: 生產環境
security:
  - bearerAuth: []
tags:
  - name: 風控管理
paths:
  /risk/v1/account_credits/manually_create:
    post:
      operationId: manually_create_account_credit
      summary: 人工新增授信客戶
      tags:
        - 風控管理
      x-permission-key:
        - credit_limit.credit_clients_add
      x-lbonly: false
      description: |-
        人工為指定證券賬號新增一條授信客戶記錄，並設置其授信額度。

        ### 請求參數

        - 必填：`aaid`（證券賬號）、`credit_limit`（授信額度）
        - 各字段的格式、取值範圍和業務含義見對應字段說明。

        ### 業務說明

        調用後該賬號即成為授信客戶，授信額度立即生效。

        ### 風險提示

        此操作直接產生真實授信額度變更。調用前請確認目標證券賬號與額度金額無誤。

        ### 處理結果

        成功時完成新增授信客戶操作；後續狀態和返回數據以 `200` 響應定義為準。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - aaid
                - credit_limit
              properties:
                aaid:
                  type: string
                  description: 證券賬號
                credit_limit:
                  type: number
                  description: 授信額度
                remark:
                  type: string
                  description: 備註
            example:
              aaid: H00000000
              credit_limit: 100000
              remark: ''
      responses:
        '200':
          description: 未實調，響應字段以真實接口為準。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: 0 表示成功；非 0 為業務錯誤碼，此時 data 通常為空。HTTP 狀態碼本身恆為 200，請勿依賴 HTTP status 判斷成功/失敗。
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      ticket_id:
                        type: string
              example:
                code: 0
                message: success
                data: {}
        '400': &id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`
        '401': &id002
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
          description: 未登錄或登錄狀態已失效
        '403': &id003
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
          description: 當前賬號未獲得該功能授權。請在 User Permission 中為該賬號開通相應權限
        '408': &id004
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
          description: 請求處理超時。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`
      x-mint:
        href: /zh-HK/api-reference/manually_create_account_credit
        metadata:
          sidebarTitle: 人工新增授信客戶
  /risk/v1/admin_credit_adjust/apply:
    post:
      operationId: admin_credit_adjust_apply
      summary: 後台提交調整授信額度申請
      tags:
        - 風控管理
      x-permission-key:
        - lb_hk_credit_limit.client_credit_limit_apply
      x-lbonly: false
      description: |-
        後台提交一條客戶授信額度調整申請，進入審核流程。

        ### 請求參數

        - 必填：`aaid`（證券賬號）、`member_id`（用戶 ID）、`credit_currency`（授信幣種）、`before_credit_amount`（調整前額度）、`after_credit_amount`（調整後額度）、`applicant`（申請人）
        - 各字段的格式、取值範圍和業務含義見對應字段說明。

        ### 業務說明

        本接口僅提交申請，額度不會立即變更；須經審核通過後才實際生效。

        ### 風險提示

        審核通過後將產生真實授信額度變更。請確認調整前後額度、幣種與申請人信息無誤。

        ### 處理結果

        成功時生成一條待審核的額度調整申請；後續狀態和返回數據以 `200` 響應定義為準。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - aaid
                - member_id
                - credit_currency
                - before_credit_amount
                - after_credit_amount
                - applicant
              properties:
                aaid:
                  type: string
                  description: 證券賬號
                member_id:
                  type: string
                  description: 用戶 ID
                credit_currency:
                  type: string
                  description: 授信幣種
                before_credit_amount:
                  type: string
                  description: 調整前額度
                after_credit_amount:
                  type: string
                  description: 調整後額度
                applicant:
                  type: string
                  description: 申請人
                remark:
                  type: string
                  description: 備註
            example:
              aaid: H00000000
              member_id: '101456715'
              credit_currency: HKD
              before_credit_amount: '0'
              after_credit_amount: '100000'
              applicant: user@example.com
              remark: ''
      responses:
        '200':
          description: 未實調，響應字段以真實接口為準。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: 0 表示成功；非 0 為業務錯誤碼，此時 data 通常為空。HTTP 狀態碼本身恆為 200，請勿依賴 HTTP status 判斷成功/失敗。
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      apply_id:
                        type: string
                      review_status:
                        type: integer
              example:
                code: 0
                message: success
                data: {}
        '400': *id001
        '401': *id002
        '403': *id003
        '408': *id004
      x-mint:
        href: /zh-HK/api-reference/admin_credit_adjust_apply
        metadata:
          sidebarTitle: 後台提交調整授信額度申請
  /risk/v1/delete_canceled_account_credit:
    post:
      operationId: delete_canceled_account_credit
      summary: 刪除已取消的客戶授信額度
      tags:
        - 風控管理
      x-lbonly: false
      description: |-
        刪除已取消狀態的客戶授信額度記錄。

        ### 請求參數

        - 必填：`aaid_list`（證券賬號列表）、`audit_frontend_resource`（調用方審計上下文）
        - 各字段的格式、取值範圍和業務含義見對應字段說明。

        ### 業務說明

        僅可刪除處於已取消狀態的授信額度記錄，支持按賬號列表批量刪除。

        ### 風險提示

        此操作刪除真實授信額度記錄，不可恢復。調用前請確認待刪除的證券賬號列表無誤。

        ### 處理結果

        成功時刪除指定的已取消授信額度記錄；後續狀態和返回數據以 `200` 響應定義為準。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - aaid_list
                - audit_frontend_resource
              properties:
                aaid_list:
                  type: array
                  description: 證券賬號列表. 證券賬號列表，以 JSON 數組形式提交。此字段為必填項。
                  items:
                    type: string
                audit_frontend_resource:
                  type: object
                  description: 審計上下文. 含 $behavior/credit_amount
            example:
              aaid_list:
                - '123'
              audit_frontend_resource:
                $behavior: ''
                credit_amount: ''
      responses:
        '200':
          description: 請求處理成功。響應的 `data` 不包含額外業務字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。

                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`
                      判斷具體結果。

                      - `401`：未登錄。
                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。
                  message:
                    type: string
                  data:
                    type: object
                    description: 成功時 `data` 為空對象。
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登錄或登錄狀態已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 當前賬號未獲得該功能授權。請在 User Permission 中為該賬號開通相應權限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 請求處理超時。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
      x-mint:
        href: /zh-HK/api-reference/delete_canceled_account_credit
        metadata:
          sidebarTitle: 刪除已取消的客戶授信額度
  /risk/v1/admin_credit_adjust/review_flow_ticket:
    post:
      operationId: admin_credit_adjust_review_flow_ticket
      summary: 後台提交授信額度審核工單
      tags:
        - 風控管理
      x-permission-key:
        - lb_hk_credit_limit.client_credit_limit_approve
      x-lbonly: false
      description: |-
        後台就客戶授信額度調整申請提交審核工單，做出審批通過或駁回的處理。

        ### 請求參數

        - 本接口無必填參數，具體請求字段見下方字段說明。

        ### 業務說明

        對已提交的額度調整申請執行審批。審批通過後額度調整才實際生效；駁回則申請作廢。

        ### 風險提示

        審批通過將觸發真實授信額度變更。請確認對應申請與審批結論無誤。

        ### 處理結果

        成功時完成審核處理並推進申請狀態；後續狀態和返回數據以 `200` 響應定義為準。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 未實調，響應字段以真實接口為準。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: 0 表示成功；非 0 為業務錯誤碼，此時 data 通常為空。HTTP 狀態碼本身恆為 200，請勿依賴 HTTP status 判斷成功/失敗。
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      ticket_id:
                        type: string
              example:
                code: 0
                message: success
                data: {}
        '400': *id001
        '401': *id002
        '403': *id003
        '408': *id004
      x-mint:
        href: /zh-HK/api-reference/admin_credit_adjust_review_flow_ticket
        metadata:
          sidebarTitle: 後台提交授信額度審核工單
  /risk/v1/hit_fps_configs:
    get:
      operationId: query_account_hit_fps_configs
      summary: 查詢用戶已命中的 FPS 規則
      tags:
        - 風控管理
      x-lbonly: false
      description: |-
        查詢指定證券賬號已命中的 FPS（快速支付系統）風控規則配置。

        ### 請求參數

        - 本接口無必填參數，可選參數見下方字段說明。
        - 傳入 `aaid` 時按該證券賬號過濾命中的 FPS 規則。

        ### 返回結果

        成功時返回該賬號已命中的 FPS 風控規則配置列表。字段含義見下方響應定義。
      security:
        - bearerAuth: []
      parameters:
        - name: aaid
          in: query
          required: true
          description: 證券賬號
          schema:
            type: string
      responses:
        '200':
          description: 未實調，響應字段以真實接口為準。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: 0 表示成功；非 0 為業務錯誤碼，此時 data 通常為空。HTTP 狀態碼本身恆為 200，請勿依賴 HTTP status 判斷成功/失敗。
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      original_fps:
                        type: string
                      final_fps:
                        type: string
                      list:
                        type: array
                        items:
                          type: object
                          properties:
                            config_title:
                              type: string
                            option_name:
                              type: string
                            fps_change:
                              type: string
              example:
                code: 0
                message: success
                data: {}
        '400': *id001
        '401': *id002
        '403': *id003
        '408': *id004
      x-mint:
        href: /zh-HK/api-reference/query_account_hit_fps_configs
        metadata:
          sidebarTitle: 查詢用戶已命中的 FPS 規則
  /risk/v1/fps_config_records:
    post:
      operationId: fps_config_records
      summary: 保存客戶 FPS 命中配置
      tags:
        - 風控管理
      x-permission-key:
        - lb_hk_credit_limit.client_fps_manage
      x-lbonly: false
      description: |-
        保存一組客戶 FPS（快速支付系統）命中規則配置。

        ### 請求參數

        - 必填：`fps_config_records`（FPS 規則配置列表）
        - 可選：`audit_frontend_resource`（調用方審計上下文）
        - 各字段的格式、取值範圍和業務含義見對應字段說明。

        ### 業務說明

        批量保存客戶 FPS 命中配置項，用於設定相關風控規則的命中處理策略。

        ### 處理結果

        成功時保存所提交的 FPS 配置；後續狀態和返回數據以 `200` 響應定義為準。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fps_config_records
              properties:
                fps_config_records:
                  type: array
                  description: |-
                    FPS 規則配置列表. FPS 規則配置數組。每項包含：

                    - `config_field` - 配置維度，例如客戶類型或風險等級。可用維度以 FPS 配置查詢結果為準。
                    - `option_value` - 配置維度的具體值；必須屬於所選 `config_field` 的可用值集。
                    - `fps_change` - FPS 分值調整量，以數值字符串提交，支持正數、負數和小數。
                  items:
                    type: string
                audit_frontend_resource:
                  type: object
                  description: 審計上下文. 包含 value（將 config_field/option_value 轉換為中文 label 展示的數組）、$behavior（固定文案“編輯客戶 FPS 規則配置”）、$action（固定為 edit），用於後端審計日誌記錄
            example:
              fps_config_records:
                - config_field: client_type
                  option_value: person
                  fps_change: '0.1'
                - config_field: risk_level
                  option_value: high
                  fps_change: '-0.2'
              audit_frontend_resource:
                value:
                  - config_field: 客户类型
                    option_value: 个人
                    fps_change: '0.1'
                  - config_field: 风险等级
                    option_value: 高
                    fps_change: '-0.2'
                $behavior: 编辑客户 FPS 规则配置
                $action: edit
      responses:
        '200':
          description: 請求處理成功。響應的 `data` 不包含額外業務字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。

                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`
                      判斷具體結果。

                      - `401`：未登錄。
                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。
                  message:
                    type: string
                  data:
                    type: object
                    description: 成功時 `data` 為空對象。
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登錄或登錄狀態已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 當前賬號未獲得該功能授權。請在 User Permission 中為該賬號開通相應權限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 請求處理超時。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
      x-mint:
        href: /zh-HK/api-reference/fps_config_records
        metadata:
          sidebarTitle: 保存客戶 FPS 命中配置
  /risk/v1/create_credit_group_review:
    post:
      operationId: create_credit_group_review
      summary: 新建授信組
      tags:
        - 風控管理
      x-lbonly: false
      description: |-
        新建一個授信組並提交審核。

        ### 請求參數

        - 本接口無必填參數，具體請求字段見下方字段說明。

        ### 業務說明

        創建授信組的申請進入審核流程，審核通過後授信組才正式生效。

        ### 風險提示

        審核通過後將影響相關賬戶的授信管理。調用前請確認授信組配置無誤。

        ### 處理結果

        成功時生成待審核的新建授信組申請；後續狀態和返回數據以 `200` 響應定義為準。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 未實調，響應字段以真實接口為準。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: 0 表示成功；非 0 為業務錯誤碼，此時 data 通常為空。HTTP 狀態碼本身恆為 200，請勿依賴 HTTP status 判斷成功/失敗。
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      ticket_id:
                        type: string
              example:
                code: 0
                message: success
                data: {}
        '400': *id001
        '401': *id002
        '403': *id003
        '408': *id004
      x-mint:
        href: /zh-HK/api-reference/create_credit_group_review
        metadata:
          sidebarTitle: 新建授信組
  /risk/v1/modify_credit_group_review:
    post:
      operationId: modify_credit_group_review
