  /risk/v1/batch_reset_credit_task_v3:
    post:
      operationId: batch_reset_credit_task_v3
      summary: 導入批量調整授信任務
      tags:
        - 風控管理
      x-lbonly: false
      description: |-
        上傳 CSV/Excel 文件後提交，批量調整客戶授信額度。涉及真實批量授信額度變更，請謹慎操作。

        ### 請求參數

        - 必填：`s3_key`（文件對象存儲Key）、`audit_frontend_resource`（審計调用方附加信息）
        - 各字段的格式、取值範圍、默認行為和業務含義見對應字段說明。

        ### 處理結果

        成功時完成所述業務操作，具體返回內容見 `200` 響應定義。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - s3_key
                - audit_frontend_resource
              properties:
                s3_key:
                  type: string
                  description: 文件對象存儲Key. 批量調整授信的 CSV/Excel 文件上傳後返回的對象 Key，服務端據此解析生成批量調整授信任務
