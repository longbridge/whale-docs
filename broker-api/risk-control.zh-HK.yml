  /v1/datasets/risk_trader_limits:
    post:
      operationId: risk_trader_limits
      summary: 交易員限額
      tags:
        - 風控管理
      x-permission-key:
        - lb_hk_risk_limit_config.risk_limit_config_trader_query
      x-lbonly: false
      description: |-
        查詢交易員限額，即按交易員賬號維度設定的下單風控限額配置。

        ### 請求參數

        - 透過 `filters` 組合業務篩選條件（可選欄位見下方 filters 欄位說明），並使用 `page`、`page_size`、`orderBy` 控制分頁與排序。

        ### 業務說明

        - 每條記錄由限額代碼 `code` 與交易員（`trader` 賬號、`trader_join` 編號）共同確定，`name` 為限額名稱。

        - 各條限額設有提示、審核、拒絕三檔閾值（`level_warn`/`level_audit`/`level_reject`）及比較運算子，組合成 `condition_warn`、`condition_audit`、`condition_reject`，用於對該交易員的下單進行提示、審核或拒絕。

        - 記錄還含限額幣種、啟用標識 `enable`、生效狀態 `is_apply`、操作人 `last_update_user` 與更新時間。

        - 常用於按交易員核對與維護其專屬的下單限額。

        ### 返回結果

        成功時返回匹配的記錄列表及分頁資訊。返回列含義見回應定義。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 過濾條件. 組合業務過濾條件。省略某個過濾字段時，不按該字段篩選。
                  properties:
                    code:
                      type: string
                      description: |-
                        限額代碼. 用於按「限額代碼」篩選結果。

                        候選值會動態變化。請調用 `GET /v1/datasets/refs/risk_limit_codes_trader` 獲取當前可用的數據字典，並使用返回項的 `key` 作為本參數值。
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/risk_limit_codes_trader
                      example: UBB
                    trader:
                      type: string
                      description: 交易員. 用於按「交易員」篩選結果。
                      example: LBtaiyang
                    is_apply:
                      type: string
                      description: 生效狀態. 用於按「生效狀態」篩選結果。
                      enum:
                        - 'true'
                        - 'false'
                      x-enum-details:
                        - value: 'true'
                          label: 生效中
                        - value: 'false'
                          label: 已失效
                      example: Invalid
                page:
                  type: integer
                  description: 頁碼. 要查詢的頁碼，從 `1` 開始。
                page_size:
                  type: integer
                  description: 每頁數量. 每頁返回的記錄數量。
                orderBy:
                  type: array
                  description: 排序參數. 排序規則數組；每一項定義一個排序字段及排序方向。
                  items:
                    type: object
            example:
              filters: {}
              page: 1
              page_size: 20
              orderBy: []
      responses:
        '200':
          description: 成功時分頁返回「交易員限額」記錄，以及頁碼、每頁數量和總記錄數等分頁信息。
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。

                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`
                      判斷具體結果。

                      - `401`：未登錄。
                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。
                  message:
                    type: string
                  data:
                    type: object
                    required:
                      - list
                      - total
                    properties:
                      list:
                        type: array
                        description: 列表. **返回值：** 列表列表。
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: 序號. **返回值：** 當前記錄的唯一標識。
                            code:
                              type: string
                              description: 限額代碼. **返回值：** 限額代碼。
                            name:
                              type: string
                              description: 限額名稱. **返回值：** 限額名稱。
                            enable:
                              type: string
                              description: 啓用標識. **返回值：** 表示啓用標識。
                            enable_val:
                              type: string
                              description: 啓用標識（原始值）. 字段 enable 的原始值：enable 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            currency:
                              type: string
                              description: 限額幣種. **返回值：** 限額幣種。
                            trader:
                              type: string
                              description: 交易員帳號. **返回值：** 交易員帳號。
                            trader_val:
                              type: string
                              description: 交易員帳號（原始值）. 字段 trader 的原始值：trader 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            trader_join:
                              type: string
                              description: 交易員編號. **返回值：** 交易員編號。
                            condition_warn:
                              type: string
                              description: 提示條件. **返回值：** 提示條件。
                            condition_audit:
                              type: string
                              description: 審核條件. **返回值：** 審核條件。
                            condition_reject:
                              type: string
                              description: 拒絕條件. **返回值：** 拒絕條件。
                            updated_at:
                              type: string
                              description: 更新時間. **返回值：** 更新時間；時間或日期格式以接口實際返回值為準。
                            last_update_user:
                              type: string
                              description: 操作人. **返回值：** 操作人。
                            is_apply:
                              type: string
                              description: 生效狀態. **返回值：** 表示生效狀態。
                            is_apply_val:
                              type: string
                              description: 生效狀態（原始值）. 字段 is_apply 的原始值：is_apply 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                      total:
                        type: integer
                        description: 總條數. **返回值：** 符合查詢條件的記錄總數，用於計算分頁。
              example:
                code: 0
                message: success
                data:
                  list:
                    - id: '21241'
                      code: UBB
                      name: UBB_auto_test_2097.85USD
                      enable: Activated
                      enable_val: 'true'
                      currency: USD
                      trader: LBtaiyang
                      trader_val: '13740185'
                      trader_join: '13740185'
                      condition_warn: Unlimited
                      condition_audit: '>=2,097.85'
                      condition_reject: '>=2,099.85'
                      updated_at: 2026-07-14 16:56
                      last_update_user: user@example.com
                      is_apply: Invalid
                      is_apply_val: 'false'
                  total: 8812
        '400':
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登錄或登錄狀態已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 當前賬號未獲得該功能授權。請在 User Permission 中為該賬號開通相應權限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 請求處理超時。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
      x-dataset-download:
        method: POST
        path: /v1/datasets/risk_trader_limits/download
        operationId: risk_trader_limits_download
      x-mint:
        href: /zh-HK/api-reference/risk_trader_limits
        metadata:
          sidebarTitle: 交易員限額
  /risk_limit/v1/trader/batch_apply:
    post:
      operationId: trader_batch_apply
      summary: 批量申請交易員交易限額
      tags:
        - 風控管理
      x-permission-key:
        - lb_hk_risk_limit_config.risk_limit_config_trader_update
      x-lbonly: false
      description: |-
        批量申請一組交易員交易限額的生效狀態，透過 `is_apply` 控制目標記錄是啟用還是停用。

        ### 請求參數

        - 必填：`list`（交易員限額記錄列表）、`is_apply`（是否生效）
        - 可選：`audit_frontend_resource`（調用方審計上下文）
        - 各欄位的格式、取值範圍和業務含義見對應欄位說明。

        ### 業務說明

        `list` 中的每條記錄標識一條已存在的限額設定。此接口只批量切換生效狀態，不修改各限額的閾值。

        ### 風險提示

        此操作會更改真實交易限額的生效狀態，直接影響後續交易能否通過風控校驗。調用前請核對目標記錄列表和 `is_apply` 取值。

        ### 處理結果

        成功時完成批量生效狀態變更；後續狀態和返回數據以 `200` 響應定義為準。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - list
                - is_apply
              properties:
                list:
                  type: array
                  description: |-
                    交易員限額記錄列表. 批量勾選（或單條）的限額記錄，元素字段：counter_id(櫃檯ID)、aaid(賬戶AAID)、code(標的代碼)、trader(交易員賬號)、trader_name(交易員名稱)、
                    client_group(客戶分組ID)、client_group_name(客戶分組名稱)、stock_group(證券分組ID)
                  items:
                    type: string
                is_apply:
                  type: boolean
                  description: 是否生效. true=批量生效（申請啓用限額），false=批量失效（撤銷/停用限額）
                  enum:
                    - 'true'
                    - 'false'
                  x-enum-details:
                    - value: 'true'
                      label: 批量生效
                    - value: 'false'
                      label: 批量失效
                  example: 'true'
                audit_frontend_resource:
                  type: object
