  /v1/risk_monitoring/update_exchange_rule_v2:
    post:
      operationId: update_exchange_rule_v2
      summary: 編輯借幣提醒換匯規則
      tags:
        - 風控管理
      x-lbonly: false
      description: |-
        編輯借幣提醒的換匯規則。

        ### 請求參數

        - 必填：`main`（主幣種換匯規則）、`other`（其他幣種換匯規則）、`is_display`（是否展示/啟用）
        - 可選：`front_payload`（調用方變更差異）、`audit_frontend_resource`（調用方審計上下文）
        - 各字段的格式、取值範圍和業務含義見對應字段說明。

        ### 業務說明

        配置借幣提醒場景下主幣種與其他幣種的換匯規則，並通過 `is_display` 控制規則是否展示/啟用。

        ### 處理結果

        成功時保存換匯規則配置；後續狀態和返回數據以 `200` 響應定義為準。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - main
                - other
                - is_display
              properties:
                main:
                  type: object
                  description: 主幣種換匯規則. 包含 debt(欠款金額閾值)、avail_with_draw(可提現金額閾值)、currency(賬戶主幣種，只讀展示不可編輯)三個字段，均為字符串數值
                other:
                  type: array
                  description: |-
                    其他幣種換匯規則. 數組，每項 {currency: 幣種代碼（候選值隨業務變化，非固定）, debt:；請調用 `GET /v1/datasets/refs/tenant_exchange_currencies` 獲取當前可用取值
                    欠款金額閾值, avail_with_draw: 可提現金額閾值}，可增刪多條

                    請調用 `GET /v1/datasets/refs/tenant_exchange_currencies` 獲取當前可用的數據字典，並使用返回項的 `key` 作為本字段值。
                  x-value-source:
                    endpoint: GET /v1/datasets/refs/tenant_exchange_currencies
                  items:
                    type: string
                is_display:
                  type: boolean
                  description: |-
                    是否展示/啓用. - 單選
                    - 提交時字符串 'true'/'false' 轉為布爾值
                    - 為 false 時其餘金額字段禁用
                  enum:
                    - 'true'
                    - 'false'
                  example: 'true'
                front_payload:
                  type: object
                  description: 前端變更差異. 非核心業務字段，type 固定為 data_diff，記錄 is_display/debt/avail_with_draw/other 變更前後值，用於審批工單展示
                audit_frontend_resource:
                  type: object
                  description: 審計上下文. 非核心業務字段，攜帶提交時的 is_display 值
            example:
              main:
                debt: '1000'
                avail_with_draw: '500'
                currency: HKD
              other:
                - currency: USD
                  debt: '200'
                  avail_with_draw: '100'
              is_display: true
              front_payload:
                type: data_diff
                data:
                  - label: 是否展示
                    key: is_display
                    before_value: 关闭
                    after_value: 开启
              audit_frontend_resource:
                is_display: true
      responses:
        '200':
          description: 請求處理成功。響應的 `data` 不包含額外業務字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。

                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`
                      判斷具體結果。

                      - `401`：未登錄。
                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      ticket_id:
                        type: string
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登錄或登錄狀態已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 當前賬號未獲得該功能授權。請在 User Permission 中為該賬號開通相應權限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 請求處理超時。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
      x-mint:
        href: /zh-HK/api-reference/update_exchange_rule_v2
        metadata:
          sidebarTitle: 編輯借幣提醒換匯規則
  /v1/risk_monitoring/exchange_v2:
    post:
      operationId: exchange_v2
      summary: 手動換匯（借幣還款）
      tags:
        - 風控管理
      x-permission-key:
        - margin_call.risk_debt_info
      x-lbonly: false
      description: |-
        為客戶手動執行換匯，用於借幣還款。

        ### 請求參數

        - 必填：`aaid`（賬戶 ID）、`exchange_books`（換匯明細列表）、`exchange_books.from_currency`（兌出幣種）、`exchange_books.to_currency`（兌入幣種）
        - 可選：`exchange_books.from_amount`（兌出金額）、`exchange_books.to_amount`（兌入金額）
        - 各字段的格式、取值範圍和業務含義見對應字段說明。

        ### 業務說明

        按換匯明細列表逐筆為客戶執行貨幣兌換，用於歸還借幣；每筆需指定兌出與兌入幣種及金額。

        ### 風險提示

        此操作直接產生真實資金換匯與還款，不可撤銷。調用前請核對賬戶、幣種與金額。

        ### 處理結果

        成功時完成手動換匯還款；後續狀態和返回數據以 `200` 響應定義為準。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - aaid
                - exchange_books
                - exchange_books.from_currency
                - exchange_books.to_currency
              properties:
                aaid:
                  type: number
                  description: 賬戶ID. 調用方由所選記錄 record.aaid_val 程序化帶出，非請求可編輯字段
                exchange_books:
                  type: array
                  description: 換匯明細列表. 動態換匯行數組，可添加多組換匯記錄；每行結構見 exchange_books 的子字段（from_currency 等）。
                  items:
                    type: string
                exchange_books.from_currency:
                  type: string
                  description: 兌換幣種. 可选值，可選項為該客戶現金賬本里持有的幣種
                exchange_books.to_currency:
                  type: string
                  description: |-
                    被兌換幣種。可選值來自後端支持兌換的幣種數據字典，請以接口返回的可選項為準。
                exchange_books.from_amount:
                  type: string
                  description: 兌換金額. from_amount / to_amount 二選一提交：用戶最後編輯的字段保留，另一個按匯率計算後在調用方被剔除
                exchange_books.to_amount:
                  type: string
                  description: 被兌換金額. 同 from_amount，二者互斥，僅提交其一
            example:
              aaid: H00000000
              exchange_books:
                - from_currency: USD
                  to_currency: HKD
                  from_amount: '100.00'
      responses:
        '200':
          description: 請求處理成功。響應的 `data` 不包含額外業務字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。

                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`
                      判斷具體結果。

                      - `401`：未登錄。
                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登錄或登錄狀態已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 當前賬號未獲得該功能授權。請在 User Permission 中為該賬號開通相應權限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 請求處理超時。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
