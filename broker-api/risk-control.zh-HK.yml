                            backup_reason:
                              type: string
                              description: 原因. **返回值：** 原因。
                            backup_reason_val:
                              type: string
                              description: 原因（原始值）. 字段 backup_reason 的原始值：backup_reason 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            currency:
