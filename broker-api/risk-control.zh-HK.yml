                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      ticket_id:
                        type: string
              example:
                code: 0
                message: success
                data: {}
        '400': *id001
        '401': *id002
        '403': *id003
        '408': *id004
      x-mint:
        href: /zh-HK/api-reference/account_stock_opt_margin_ratio_delete
        metadata:
          sidebarTitle: 刪除客戶股票期權保證金
