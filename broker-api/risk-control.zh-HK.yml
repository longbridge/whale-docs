  /v1/risk_monitoring/index_level_operate:
    post:
      operationId: index_level_operate
      summary: 新增/編輯指數級別
      tags:
        - 風控管理
      x-lbonly: false
      description: |-
        指數級別 (Index Level) 場景共用一個接口處理四種動作：新增（operation=0，提交 index_code/index_name/index_type/remark）、編輯（operation=1，額外帶 id）、刪除（operation=2，字段沿用 stock_level 而非 index_type，屬歷史命名遺留）、初始化數據（operation=3，僅傳 operation）。

        ### 請求參數

        - 必填：`index_code`（指數編碼）、`index_name`（指數名）、`index_type`（指數級別類型）、`operator`（操作人）、`operation`（操作類型）
        - 可選：`remark`（備註）、`id`（記錄ID）
        - 各字段的格式、取值範圍、默認行為和業務含義見對應字段說明。

        ### 處理結果

        成功時完成所述業務操作，具體返回內容見 `200` 響應定義。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - index_code
                - index_name
                - index_type
                - operator
                - operation
              properties:
                index_code:
                  type: string
                  description: 指數編碼. 用於指定「指數編碼」。此字段為必填項。
                index_name:
                  type: string
                  description: 指數名. 用於指定「指數名」。此字段為必填項。
                index_type:
                  type: integer
                  description: 指數級別類型. 指數級別，單選：0=Tier1，1=Tier2，2=Other。刪除操作沿用字段名 stock_level（取該記錄的 stock_level_val），屬歷史命名遺留。
                  enum:
                    - '0'
                    - '1'
                    - '2'
                remark:
                  type: string
                  description: 備註. 隨本次操作保存的備註。
                operator:
                  type: string
                  description: 操作人. 當前登錄操作員賬號，新增/編輯/刪除均帶上
                operation:
                  type: integer
                  description: |-
                    操作類型. 操作類型：0=新增，1=編輯，2=刪除，3=初始化數據（僅傳 operation=3，無其它字段）

                    **可選值：**
                    - `0` - 表示新增
                    - `1` - 表示編輯
                    - `2` - 表示刪除
                    - `3` - 表示初始化數據
                  enum:
                    - '0'
                    - '1'
                    - '2'
                    - '3'
                id:
                  type: integer
                  description: 記錄ID. 僅編輯（operation=1）和刪除（operation=2）時傳，新增（operation=0）和初始化（operation=3）不傳
            example:
              index_code: HSI
              index_name: 恒生指数
