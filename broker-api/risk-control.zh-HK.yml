  /v1/datasets/risk_elc_stress_tests:
    post:
      operationId: risk_elc_stress_tests
      summary: ELC 壓力測試
      tags:
        - 風控管理
      x-permission-key:
        - lb_hk_margin_call.risk_monitoring_stock_level_query
      x-lbonly: false
      description: |-
        查詢集中度風險速動資金壓力測試的任務列表，用於管理與追蹤歷次測試的執行情況和結果。

        ### 請求參數

        - 通過 `filters` 組合業務篩選條件（可選欄位見下方 filters 欄位說明），並使用 `page`、`page_size`、`orderBy` 控制分頁與排序。

        ### 業務說明

        - 每條記錄對應一次壓力測試任務，包含任務編號、幣種，以及測試得到的速動資金、規定速動資金、速動資金盈餘。
        - 記錄還包含計算結果狀態、操作人及創建時間，可據此了解任務是處理中、成功還是失敗。
        - 可按創建時間與計算結果狀態篩選，用於回溯特定時段或特定結果的測試任務。

        ### 返回結果

        成功時返回匹配的記錄列表及分頁信息。返回列含義見響應定義。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 過濾條件. 組合業務過濾條件。省略某個過濾字段時，不按該字段篩選。
                  properties:
                    created_at:
                      type: object
                      description: 更新時間. 用於按「更新時間」篩選結果。
                      properties:
                        gte:
                          type: string
                          description: 大於等於. 篩選範圍的下限，匹配值包含該值。
                          format: date
                        lte:
                          type: string
                          description: 小於等於. 篩選範圍的上限，匹配值包含該值。
                          format: date
                    status:
                      type: string
                      description: |-
                        計算結果. 用於按「計算結果」篩選結果。

                        支持多選；提交時使用英文逗號（`,`）拼接多個值。不傳時不按此字段篩選。
                      example: Success
                      enum:
                        - '1'
                        - '2'
                        - '3'
                      x-enum-details:
                        - value: '1'
                          label: 處理中
                        - value: '2'
                          label: 處理失敗
                        - value: '3'
                          label: 處理成功
                page:
                  type: integer
                  description: 頁碼. 要查詢的頁碼，從 `1` 開始。
                page_size:
                  type: integer
                  description: 每頁數量. 每頁返回的記錄數量。
                orderBy:
                  type: array
                  description: 排序參數. 排序規則數組；每一項定義一個排序字段及排序方向。
                  items:
                    type: object
            example:
              filters: {}
              page: 1
              page_size: 20
              orderBy: []
      responses:
        '200':
          description: 成功時分頁返回「ELC 壓力測試」記錄，以及頁碼、每頁數量和總記錄數等分頁信息。
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。

                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`
                      判斷具體結果。

                      - `401`：未登錄。
                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。
                  message:
                    type: string
                  data:
                    type: object
                    required:
                      - list
                      - total
                    properties:
                      list:
                        type: array
                        description: 列表. **返回值：** 列表列表。
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: 任務編號. **返回值：** 當前記錄的唯一標識。
                            currency:
                              type: string
                              description: 幣種. **返回值：** 幣種。
                            lc:
                              type: string
                              description: 速動資金. **返回值：** 速動資金。
                            rlc:
                              type: string
                              description: 規定速動資金. **返回值：** 規定速動資金。
                            elc:
                              type: string
                              description: 速動資金盈餘. **返回值：** 速動資金盈餘。
                            status:
                              type: string
                              description: 計算結果. **返回值：** 計算結果。
                            status_val:
                              type: string
                              description: 計算結果（原始值）. 字段 status 的原始值：status 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            op_user:
                              type: string
                              description: 操作人. **返回值：** 操作人。
                            created_at:
                              type: string
                              description: 創建時間. **返回值：** 創建時間；時間或日期格式以接口實際返回值為準。
                      total:
                        type: integer
                        description: 總條數. **返回值：** 符合查詢條件的記錄總數，用於計算分頁。
              example:
                code: 0
                message: success
                data:
                  list:
                    - id: '2177'
                      currency: HKD
                      lc: 1,133,690,000
                      rlc: 411,153,000
                      elc: 722,537,000
                      status: Success
                      status_val: '3'
                      op_user: system
                      created_at: '1780299488'
                  total: 127
        '400':
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登錄或登錄狀態已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 當前賬號未獲得該功能授權。請在 User Permission 中為該賬號開通相應權限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 請求處理超時。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
      x-dataset-download:
        method: POST
        path: /v1/datasets/risk_elc_stress_tests/download
        operationId: risk_elc_stress_tests_download
      x-mint:
        href: /zh-HK/api-reference/risk_elc_stress_tests
        metadata:
          sidebarTitle: ELC 壓力測試
