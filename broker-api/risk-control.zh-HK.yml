      x-lbonly: false
      description: |-
        為指定客戶類別的一條交易限額設定，設定項包括預警（`condition_warn`）、審核（`condition_audit`）和拒絕（`condition_reject`）閾值。

        ### 請求參數

        - 必填：`client_group`（客戶類別）、`code`（限額類型）、`currency`（幣種）
        - 各欄位的格式、取值範圍和業務含義見對應欄位說明。

        ### 業務說明

        限額按幣種（`currency`）與限額類型（`code`）區分。當交易觸及對應閾值時，會分別觸發預警、進入審核或被直接拒絕。

        ### 風險提示

        此操作會變更真實的風控限額設定，直接影響後續交易能否通過風控校驗。調用前請確認目標對象、幣種、限額類型和各閾值無誤。

        ### 處理結果

        成功時完成限額設定的寫入；後續狀態和返回數據以 `200` 響應定義為準。
      security:
        - bearerAuth: []
