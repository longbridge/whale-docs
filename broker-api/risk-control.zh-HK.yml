                          description: 大於等於. 篩選範圍的下限，匹配值包含該值。
                          format: date
                        lte:
                          type: string
                          description: 小於等於. 篩選範圍的上限，匹配值包含該值。
                          format: date
                    operator:
                      type: string
                      description: 操作人. 用於按「操作人」篩選結果。
                    after_finance_amount:
                      type: object
                      description: 調整後融資額度. 用於按「調整後融資額度」篩選結果。
                      properties:
                        gte:
                          type: number
                          description: 大於等於. 篩選範圍的下限，匹配值包含該值。
                        lte:
                          type: number
                          description: 小於等於. 篩選範圍的上限，匹配值包含該值。
                    account_type:
                      type: string
                      description: |-
