                            risk_monitoring_log_id:
                              type: string
                              description: 預警編號. **返回值：** 預警編號。
                            aaid:
                              type: string
                              description: 賬號. **返回值：** 賬號。
                            aaid_val:
                              type: string
                              description: 賬號（原始值）. 字段 aaid 的原始值：aaid 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            created_at:
                              type: string
                              description: 快照記錄時間. **返回值：** 快照記錄時間；時間或日期格式以接口實際返回值為準。
                            alert_date:
