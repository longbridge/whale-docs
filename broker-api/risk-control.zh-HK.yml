  /risk/v1/trade_credit/modify:
    post:
      operationId: trade_credit_modify
      summary: 修改客戶交易額度
      tags:
        - 風控管理
      x-lbonly: false
      description: |-
        新增或修改客戶的交易額度配置。涉及真實交易額度變更。

        ### 請求參數

        - 必填：`aaid`（客戶資金賬戶ID(AAID)）、`trade_credit_type`（額度類型）、`trade_credit_map`（幣種額度映射）、`expired_at`（到期時間）、`action`（操作類型）
        - 可選：`remark`（備註）、`audit_frontend_resource`（调用方審計上下文）
        - 各字段的格式、取值範圍、默認行為和業務含義見對應字段說明。

        ### 風險提示

        > 此操作可能影響真實業務數據或資產狀態。調用前請核對目標記錄、金額、數量和操作類型。

        ### 處理結果

        成功時完成所述業務操作，具體返回內容見 `200` 響應定義。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - aaid
                - trade_credit_type
                - trade_credit_map
                - expired_at
                - action
              properties:
                aaid:
                  type: string
                  description: 客戶資金賬戶ID(AAID). 請求 member_query_aaid 組件選擇的客戶資金賬號，編輯時禁用不可改
                trade_credit_type:
                  type: string
                  description: |-
                    額度類型. 單選組，取值來自 options.trade_credit_type_ref，常見 0=單一貨幣交易額度，1=多貨幣交易額度

                    **可選值：**
                    - `0` - 表示單一貨幣交易額度
                    - `1` - 表示多貨幣交易額度
                  enum:
                    - '0'
                    - '1'
                trade_credit_map:
                  type: object
                  description: 幣種額度映射. 幣種->額度鍵值對，如 {"HKD":"100000"}；trade_credit_type=0 時僅含單一幣種，=1 時可含多幣種。
                expired_at:
                  type: number
                  description: 到期時間. unix 時間戳（秒），date-picker 選擇日期後，時分秒取提交時的當前時間
                remark:
                  type: string
                  description: 備註. textarea，最長 100 字符
                action:
                  type: number
                  description: |-
                    操作類型. 0=新增 (add) 1=編輯 (edit)，由调用方根據是否傳入 item 記錄自動計算

                    **可選值：**
                    - `0` - 表示新增
                    - `1` - 表示編輯
                  enum:
                    - '0'
                    - '1'
                audit_frontend_resource:
                  type: object
                  description: 審計上下文. 非核心業務字段，攜帶變更前 (before)與變更後 (value)數據及 $action/$behavior，用於風控審批工單展示
            example:
              aaid: H00000000
              trade_credit_type: '1'
              trade_credit_map:
                HKD: '100000'
                USD: '50000'
              expired_at: 1751328000
              remark: 客户申请提升交易额度
              action: 0
              audit_frontend_resource:
                aaid: H00000000
                expired_at: 1748736000
                remark: ''
                trade_credit_type: '0'
                trade_credit_map: '{"HKD":"50000"}'
                value:
                  aaid: H00000000
                  trade_credit_type: '1'
                  trade_credit_map:
                    - key: HKD
                      value: '100000'
                add: true
                edit: null
                $action: add
                $behavior: 新增客户交易额度
      responses:
        '200':
          description: 請求處理成功。響應的 `data` 不包含額外業務字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。

                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`
                      判斷具體結果。

                      - `401`：未登錄。
                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登錄或登錄狀態已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 當前賬號未獲得該功能授權。請在 User Permission 中為該賬號開通相應權限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 請求處理超時。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
      x-mint:
        href: /zh-HK/api-reference/trade_credit_modify
        metadata:
          sidebarTitle: 修改客戶交易額度
