        - 透過 `filters` 組合業務篩選條件（可選欄位見下方 filters 欄位說明），並使用 `page`、`page_size`、`orderBy` 控制分頁與排序。

        ### 業務說明

        - 數據來源於待行權期權倉位，按行權日、結算渠道聚合。
        - 每條記錄對應一個（行權日，結算渠道），包含期權標的數量、持倉總張數，以及行權標的數、提前行權標的數、放棄行權標的數、部分行權標的數、已處理標的數。
        - 處理狀態區分待核對、待處理、已處理，用於掌握各行權日的整體處理進度並進一步下鑽明細。

        ### 返回結果

