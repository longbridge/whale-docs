  /v1/datasets/risk_multiple_dimension_limits:
    post:
      operationId: risk_multiple_dimension_limits
      summary: 多維度限額
      tags:
        - 風控管理
      x-permission-key:
        - risk_limit_config.risk_limit_dimension_query
      x-lbonly: false
      description: |-
        查詢多維度限額，即將客戶與證券（或股票組）、市場等多個維度組合後設定的下單風控限額配置。

        ### 請求參數

        - 透過 `filters` 組合業務篩選條件（可選欄位見下方 filters 欄位說明），並使用 `page`、`page_size`、`orderBy` 控制分頁與排序。

        ### 業務說明

        - 每條記錄由限額代碼 `code` 與客戶 `aaid`、證券 `counter_id`（或股票組 `stock_group_id`）、市場 `market` 等維度組合確定，`name` 為限額名稱，`counter_name` 為證券名稱。

        - 各條限額設有提示、審核、拒絕三檔閾值及比較運算子，組合成 `condition_warn`、`condition_audit`、`condition_reject`，命中時分別提示、審核或拒絕下單。

        - 記錄還含限額幣種、啟用標識 `enable`、生效狀態 `is_apply`、操作人與更新時間。

        - 常用於對特定客戶在特定證券或股票組上的下單做精細化風控管控。

        ### 返回結果

        成功時返回匹配的記錄列表及分頁資訊。返回列含義見回應定義。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 過濾條件. 組合業務過濾條件。省略某個過濾字段時，不按該字段篩選。
                  properties:
                    code:
                      type: string
                      description: |-
                        限額代碼. 用於按「限額代碼」篩選結果。

                        候選值會動態變化。請調用 `GET /v1/datasets/refs/risk_limit_codes_multi_dimension` 獲取當前可用的數據字典，並使用返回項的 `key` 作為本參數值。
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/risk_limit_codes_multi_dimension
                      example: CSGHM
                    market:
                      type: string
                      description: |-
                        市場. 用於按「市場」篩選結果。

                        **可選值：** `US`、`HK`、`UK`、`SH`、`SZ`、`SG`、`KR`、`JP`、`AU`、`DE`、`CA`、`TH`、`ID`、`MY`、`TR`、`NA`、`OSL`、`HAS`、`EU`、`UT`、`GTMMF`
                      enum:
                        - US
                        - HK
                        - UK
                        - SH
                        - SZ
                        - SG
                        - KR
                        - JP
                        - AU
                        - DE
                        - CA
                        - TH
                        - ID
                        - MY
                        - TR
                        - NA
                        - OSL
                        - HAS
                        - EU
                        - UT
                        - GTMMF
                      example: US
                    counter_id:
                      type: string
                      description: 證券代碼. 用於按「證券代碼」篩選結果。
                    is_apply:
                      type: string
                      description: 生效狀態. 用於按「生效狀態」篩選結果。
                      enum:
                        - 'true'
                        - 'false'
                      x-enum-details:
                        - value: 'true'
                          label: 生效中
                        - value: 'false'
                          label: 已失效
                      example: Invalid
                    aaid:
                      type: string
                      description: 客戶. 用於按「客戶」篩選結果。
                page:
                  type: integer
                  description: 頁碼. 要查詢的頁碼，從 `1` 開始。
                page_size:
                  type: integer
                  description: 每頁數量. 每頁返回的記錄數量。
                orderBy:
                  type: array
                  description: 排序參數. 排序規則數組；每一項定義一個排序字段及排序方向。
                  items:
                    type: object
            example:
              filters: {}
              page: 1
              page_size: 20
              orderBy: []
      responses:
        '200':
          description: 成功時分頁返回「多維度限額」記錄，以及頁碼、每頁數量和總記錄數等分頁信息。
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。

                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`
                      判斷具體結果。

                      - `401`：未登錄。
                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。
                  message:
                    type: string
                  data:
                    type: object
                    required:
                      - list
                      - total
                    properties:
                      list:
                        type: array
                        description: 列表. **返回值：** 列表列表。
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: 序號. **返回值：** 當前記錄的唯一標識。
                            code:
                              type: string
                              description: 限額代碼. **返回值：** 限額代碼。
                            name:
                              type: string
                              description: 限額名稱. **返回值：** 限額名稱。
                            enable:
                              type: string
                              description: 啓用標識. **返回值：** 表示啓用標識。
                            enable_val:
                              type: string
                              description: 啓用標識（原始值）. 字段 enable 的原始值：enable 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            currency:
                              type: string
                              description: 限額幣種. **返回值：** 限額幣種。
                            aaid:
                              type: string
                              description: 證券賬號. **返回值：** 證券賬號。
                            aaid_val:
                              type: string
                              description: 證券賬號（原始值）. 字段 aaid 的原始值：aaid 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            counter_id:
                              type: string
                              description: 證券代碼. **返回值：** 證券代碼。
                            counter_id_val:
                              type: string
                              description: 證券代碼（原始值）. 字段 counter_id 的原始值：counter_id 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            counter_name:
                              type: string
                              description: 證券名稱. **返回值：** 證券名稱。
