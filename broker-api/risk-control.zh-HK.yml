        查詢夜盤風險監控報表，按證券評估夜盤時段價格波動對保證金安全的影響。

        ### 請求參數

        - 透過 `filters` 組合業務篩選條件（可選欄位見下方 filters 欄位說明），並使用 `page`、`page_size`、`orderBy` 控制分頁與排序。

        ### 業務說明

        - 報表由非同步任務批量計算，每條記錄對應一隻證券，包含多頭維持保證金比例、空頭維持保證金比例、是否有空頭持倉等風控參數。
        - 記錄同時給出風控最新價（USD）、夜盤最新價（USD）與夜盤漲跌幅（%），並標註該標的下最大融資客戶與淨資產比例最低客戶，以及更新時間。
        - 用於在夜盤時段提前發現價格劇烈波動帶來的追繳風險。
        - 可按股票代碼與是否有空頭持倉篩選。

        ### 返回結果

        成功時返回符合條件的記錄列表及分頁資訊。返回欄位含義見回應定義。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 過濾條件. 組合業務過濾條件。省略某個過濾字段時，不按該字段篩選。
                  properties:
                    counter_id:
                      type: string
                      description: 股票代碼. 用於按「股票代碼」篩選結果。
                    has_short_holding:
                      type: string
                      description: 是否有空頭持倉. 用於按「是否有空頭持倉」篩選結果。
                      enum:
                        - 'true'
                        - 'false'
                      x-enum-details:
                        - value: 'true'
                          label: 是
                        - value: 'false'
                          label: 否
                      example: 'true'
                page:
                  type: integer
                  description: 頁碼. 要查詢的頁碼，從 `1` 開始。
                page_size:
                  type: integer
                  description: 每頁數量. 每頁返回的記錄數量。
                orderBy:
                  type: array
                  description: 排序參數. 排序規則數組；每一項定義一個排序字段及排序方向。
                  items:
                    type: object
            example:
              filters: {}
              page: 1
              page_size: 20
              orderBy: []
      responses:
        '200':
          description: 成功時分頁返回「夜盤風險監控」記錄，以及頁碼、每頁數量和總記錄數等分頁信息。
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。

                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`
                      判斷具體結果。

