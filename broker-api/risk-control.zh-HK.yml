  /risk_limit/v1/stock/batch_apply:
    post:
      operationId: stock_batch_apply
      summary: 批量申請證券交易限額
      tags:
        - 風控管理
      x-permission-key:
        - lb_hk_risk_limit_config.risk_limit_config_stock_update
      x-lbonly: false
      description: |-
        批量申請一組證券交易限額的生效狀態，透過 `is_apply` 控制目標記錄是啟用還是停用。

        ### 請求參數

        - 必填：`list`（批量操作的限額設定記錄列表）、`is_apply`（是否生效）
        - 可選：`audit_frontend_resource`（調用方審計上下文）
        - 各欄位的格式、取值範圍和業務含義見對應欄位說明。

        ### 業務說明

        `list` 中的每條記錄標識一條已存在的限額設定。此接口只批量切換生效狀態，不修改各限額的閾值。

        ### 風險提示

        此操作會更改真實交易限額的生效狀態，直接影響後續交易能否通過風控校驗。調用前請核對目標記錄列表和 `is_apply` 取值。

        ### 處理結果

        成功時完成批量生效狀態變更；後續狀態和返回數據以 `200` 響應定義為準。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - list
                - is_apply
              properties:
                list:
                  type: array
                  description: |-
                    批量操作的限額配置記錄列表. 每項字段含義：counter_id 櫃檯號，aaid 客戶賬戶ID（通常為空），code 證券代碼（本證券維度的關鍵字段），trader/trader_name
                    交易員ID/名稱， client_group/client_group_name 客戶類別（組）ID/名稱，stock_group 股票分組ID。
                  items:
                    type: string
                is_apply:
                  type: boolean
                  description: 是否生效. 批量設置目標記錄是否生效。
                  enum:
                    - 'true'
                    - 'false'
                  x-enum-details:
                    - value: 'true'
                      label: 批量生效
                    - value: 'false'
                      label: 批量失效
                  example: 'true'
                audit_frontend_resource:
                  type: object
                  description: '審計上下文. 非業務參數，僅供後端審計記錄使用。$action: ''add''(生效)|''delete''(失效)；$behavior: 審計行為描述文案。'
            example:
              list:
                - counter_id: '1'
                  aaid: ''
                  code: AAPL.US
                  trader: ''
                  trader_name: ''
                  client_group: ''
                  client_group_name: ''
                  stock_group: '1'
              is_apply: true
              audit_frontend_resource:
                $action: add
                $behavior: 限额生效
      responses:
        '200':
          description: 請求處理成功。響應的 `data` 不包含額外業務字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。

                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`
                      判斷具體結果。

                      - `401`：未登錄。
                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。
                  message:
                    type: string
                  data:
                    type: object
                    description: 成功時 `data` 為空對象。
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登錄或登錄狀態已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 當前賬號未獲得該功能授權。請在 User Permission 中為該賬號開通相應權限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 請求處理超時。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
      x-mint:
        href: /zh-HK/api-reference/stock_batch_apply
        metadata:
          sidebarTitle: 批量申請證券交易限額
  /v1/datasets/account_stock_margin_ratio_changes:
    post:
      operationId: account_stock_margin_ratio_changes
      summary: 客戶保證金變更記錄查詢
      tags:
        - 風控管理
      x-permission-key:
        - lb_hk_margin_ratio.account_margin_ratio_query
      x-lbonly: false
      description: |-
        查詢客戶個股保證金率變更記錄，用於追蹤針對客戶賬戶在具體證券上訂製的保證金率歷史調整。

        ### 請求參數

        - 透過 `filters` 組合業務篩選條件（可選欄位見下方 filters 欄位說明），並使用 `page`、`page_size`、`orderBy` 控制分頁與排序。

        ### 業務說明

        - 資料按客戶賬戶與證券組合記錄，含客戶 `member_id`、姓名、證券賬號 `aaid`、賬號類型 `account_type`、賬戶標識 `account_mark`、櫃檯渠道，以及證券代碼 `counter_id`、股票名稱、市場 `market`。

        - 每條記錄保存該客戶在該證券上的初始保證金率 `im_factor`、維持保證金率 `mm_factor`、強平保證金率 `fm_factor`、MarginCall 保證金率 `mcm_factor`（均為百分比）。

        - 還包含狀態 `status`、過期日期 `expire_at`、更新時間、操作人 `operator` 與備註。

        - 常用於風控人員稽核針對特定客戶個股保證金率的訂製與變更歷史。

        ### 返回結果

        成功時返回匹配的記錄列表及分頁資訊。返回列含義見回應定義。
