  /v1/datasets/risk_debt_alerts:
    post:
      operationId: risk_debt_alerts
      summary: 換彙提醒查詢
      tags:
        - 風控管理
      x-permission-key:
        - margin_call.risk_debt_info
      x-lbonly: false
      description: |-
        查詢當前待處理的換匯提醒，用於風控團隊監控客戶單幣種欠款並及時安排換匯歸還。

        ### 請求參數

        - 透過 `filters` 組合業務篩選條件（可選欄位見下方 filters 欄位說明），並使用 `page`、`page_size`、`orderBy` 控制分頁與排序。

        ### 業務說明

        - 當客戶某一幣種出現欠款、而其他幣種有可用資金時，系統會生成換匯提醒。
        - 每條記錄包含客戶資訊、觸發時間、欠款幣種與金額、可用金額、是否自動換匯及處理狀態。
        - 可按客戶、觸發日期、更新時間、是否自動換匯及狀態篩選，用於跟進待處理提醒。

        ### 返回結果

        成功時返回匹配的記錄列表及分頁資訊。返回欄位含義見回應定義。
