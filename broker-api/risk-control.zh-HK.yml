                              description: 個股狀態. **返回值：** 個股狀態。
                            stock_status_val:
                              type: string
                              description: 個股狀態（原始值）. 字段 stock_status 的原始值：stock_status 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            im_factor:
                              type: string
                              description: 初始保證金 (%). **返回值：** 初始保證金 (%)。
                            mm_factor:
                              type: string
                              description: 維持保證金 (%). **返回值：** 維持保證金 (%)。
                            fm_factor:
