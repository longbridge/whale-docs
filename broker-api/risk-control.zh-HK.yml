                              description: 客戶. **返回值：** 客戶。
                            aaid_val:
                              type: string
                              description: 客戶（原始值）. 字段 aaid 的原始值：aaid 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            debt_currency:
                              type: string
                              description: 幣種. **返回值：** 幣種。
                            debt_amount:
                              type: string
                              description: 欠款金額. **返回值：** 欠款金額。
                            own_amount:
                              type: string
                              description: 可兌換幣種金額. **返回值：** 可兌換幣種金額。
                            is_auto:
                              type: string
                              description: 自動換匯. **返回值：** 表示自動換匯。
                            is_auto_val:
                              type: string
                              description: 自動換匯（原始值）. 字段 is_auto 的原始值：is_auto 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            status:
                              type: string
                              description: 狀態. **返回值：** 狀態。
                            status_val:
                              type: string
                              description: 狀態（原始值）. 字段 status 的原始值：status 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            alert_time:
                              type: string
                              description: 觸發時間. **返回值：** 觸發時間；時間或日期格式以接口實際返回值為準。
                            updated_at:
                              type: string
                              description: 更新時間. **返回值：** 更新時間；時間或日期格式以接口實際返回值為準。
                      total:
                        type: integer
                        description: 總條數. **返回值：** 符合查詢條件的記錄總數，用於計算分頁。
