                properties:
                  code:
                    type: integer
                    description: 0 表示成功；非 0 為業務錯誤碼，此時 data 通常為空。HTTP 狀態碼本身恆為 200，請勿依賴 HTTP status 判斷成功/失敗。
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      original_fps:
                        type: string
                      final_fps:
                        type: string
                      list:
                        type: array
                        items:
                          type: object
