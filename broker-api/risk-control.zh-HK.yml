          description: 成功時分頁返回「ELC 持倉明細」記錄，以及頁碼、每頁數量和總記錄數等分頁信息。
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。

                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`
                      判斷具體結果。

                      - `401`：未登錄。
                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。
                  message:
                    type: string
                  data:
                    type: object
                    required:
                      - list
                      - total
                    properties:
                      list:
                        type: array
                        description: 列表. **返回值：** 列表列表。
                        items:
                          type: object
                          properties:
                            stock_level:
                              type: string
                              description: 股票級別. **返回值：** 股票級別。
                            stock_level_val:
                              type: string
                              description: 股票級別（原始值）. 字段 stock_level 的原始值：stock_level 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            stock_sum:
                              type: string
                              description: 股票級別合計市值. **返回值：** 股票級別合計市值。
                            total_market_value:
                              type: string
                              description: 抵押品池總市值. **返回值：** 抵押品池總市值。
                            ratio:
                              type: string
                              description: 佔比（%）. **返回值：** 佔比（%）。
                            currency:
                              type: string
                              description: 幣種. **返回值：** 幣種。
                            created_at:
                              type: string
                              description: 更新時間. **返回值：** 更新時間；時間或日期格式以接口實際返回值為準。
                      total:
                        type: integer
                        description: 總條數. **返回值：** 符合查詢條件的記錄總數，用於計算分頁。
              example:
                code: 0
                message: success
                data:
                  list:
                    - stock_level: Tier 2
                      stock_level_val: '1'
                      stock_sum: 24,594.2
                      total_market_value: 19,141,408.63
                      ratio: '0.13'
                      currency: HKD
                      created_at: '1780299519'
                  total: 1
        '400':
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登錄或登錄狀態已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 當前賬號未獲得該功能授權。請在 User Permission 中為該賬號開通相應權限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 請求處理超時。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
      x-dataset-download:
        method: POST
        path: /v1/datasets/risk_elc_stock_levels/download
        operationId: risk_elc_stock_levels_download
      x-mint:
        href: /zh-HK/api-reference/risk_elc_stock_levels
        metadata:
          sidebarTitle: 假設性壓力測試價格跌幅
components:
  schemas:
    BrokerGatewayErrorEnvelope:
      type: object
      description: Broker API Gateway 返回的錯誤響應結構。`code` 為業務錯誤碼，`message` 為錯誤信息，`data` 通常為空。
      required:
        - code
        - message
        - data
      properties:
        code:
          type: integer
          description: '`0` 表示成功;非 0 為業務錯誤碼(此時 `data` 通常為空)。下方為常見錯誤碼,具體介面可能只返回其中一部分;需結合 HTTP status 判斷。'
          enum:
            - 0
            - 401010
            - 403000
            - 3001001
            - 3001004
            - 3001006
            - 408
            - 404000
          x-enum-details:
            - value: 0
              label: 成功
            - value: 401010
              label: token 無效或已過期
            - value: 403000
              label: 無權限(具體權限碼見 message)
            - value: 3001001
              label: 服務繁忙，請稍後重試
            - value: 3001004
              label: 過濾條件格式無法識別
            - value: 3001006
              label: 缺少必填參數(message 含欄位名)
            - value: 408
              label: 請求逾時
            - value: 404000
              label: 路由不存在
        message:
          type: string
        data: {}
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Broker ACCESS_TOKEN，透過 `Authorization: Bearer <token>` 傳送。'
