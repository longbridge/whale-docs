                    properties:
                      list:
                        type: array
                        description: 列表. **返回值：** 列表列表。
                        items:
                          type: object
                          properties:
                            counter_id:
                              type: string
                              description: 股票代碼. **返回值：** 股票代碼。
                            counter_id_val:
                              type: string
                              description: 股票代碼（原始值）. 字段 counter_id 的原始值：counter_id 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            short_name_locales:
                              type: string
                              description: 股票名稱. **返回值：** 股票名稱。
                            market:
                              type: string
                              description: 市場. **返回值：** 市場。
                            market_val:
                              type: string
                              description: 市場（原始值）. 字段 market 的原始值：market 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            max:
                              type: string
                              description: 期權保證金上限. **返回值：** 期權保證金上限。
                            min:
                              type: string
                              description: 期權保證金下限. **返回值：** 期權保證金下限。
                            updated_at:
                              type: string
                              description: 更新日期. **返回值：** 更新日期；時間或日期格式以接口實際返回值為準。
                            created_at:
                              type: string
                              description: 創建日期. **返回值：** 創建日期；時間或日期格式以接口實際返回值為準。
                            op_user:
                              type: string
                              description: 創建人. **返回值：** 創建人。
                            remark:
                              type: string
                              description: 備註. **返回值：** 備註。
                      total:
                        type: integer
                        description: 總條數. **返回值：** 符合查詢條件的記錄總數，用於計算分頁。
              example:
                code: 0
                message: success
                data:
                  list:
                    - counter_id: ST/HK/1
                      counter_id_val: ''
                      short_name_locales: CKH HOLDINGS
                      market: HK
                      market_val: HK
                      max: |-
                        IM:1.0000
                        MM:2.0000
                        FM:3.0000
                      min: |-
                        IM:4.0000
                        MM:5.0000
                        FM:6.0000
                      updated_at: '1784184544'
                      created_at: '1784184530'
                      op_user: user@example.com
                      remark: ''
                  total: 26
        '400':
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登錄或登錄狀態已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 當前賬號未獲得該功能授權。請在 User Permission 中為該賬號開通相應權限。
          content:
