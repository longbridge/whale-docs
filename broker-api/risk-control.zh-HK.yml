      description: |-
        查詢授信管理中的客戶組列表，用於維護對一批客戶統一配置授信或風控策略的分組。

        ### 請求參數

        - 通過 `filters` 組合業務篩選條件（可選欄位見下方 filters 欄位說明），並使用 `page`、`page_size`、`orderBy` 控制分頁與排序。

        ### 業務說明

        - 每條記錄對應一個客戶組，包含客戶組 ID、業務類型、客戶組名稱、組內客戶數量、備註，以及更新時間和操作人。
        - 客戶組用於將多名客戶歸為一組，便於按業務類型批量應用授信或風控規則。
        - 可按客戶組名稱、證券賬號、業務類型篩選，定位目標分組。

        ### 返回結果

        成功時返回匹配的記錄列表及分頁信息。返回列含義見響應定義。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 過濾條件. 組合業務過濾條件。省略某個過濾字段時，不按該字段篩選。
                  properties:
                    name:
                      type: string
                      description: 客戶組名稱. 用於按「客戶組名稱」篩選結果。
                      example: NANA测试
                    account_no_list:
                      type: string
                      description: 證券帳號. 用於按「證券帳號」篩選結果。
                    business_type:
                      type: string
                      description: 業務類型. 用於按「業務類型」篩選結果。
                      enum:
                        - '1'
                        - '2'
                        - '3'
                      x-enum-details:
                        - value: '1'
                          label: 保證金
                        - value: '2'
                          label: 報表
                        - value: '3'
                          label: 風控參數
                      example: Margin
                page:
                  type: integer
                  description: 頁碼. 要查詢的頁碼，從 `1` 開始。
                page_size:
                  type: integer
                  description: 每頁數量. 每頁返回的記錄數量。
                orderBy:
                  type: array
                  description: 排序參數. 排序規則數組；每一項定義一個排序字段及排序方向。
                  items:
                    type: object
            example:
              filters: {}
              page: 1
              page_size: 20
              orderBy: []
      responses:
        '200':
          description: 成功時分頁返回「客戶組查詢」記錄，以及頁碼、每頁數量和總記錄數等分頁信息。
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。

                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`
                      判斷具體結果。

                      - `401`：未登錄。
                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。
                  message:
                    type: string
                  data:
                    type: object
                    required:
                      - list
                      - total
                    properties:
                      list:
                        type: array
                        description: 列表. **返回值：** 列表列表。
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: 客戶組 ID. **返回值：** 當前記錄的唯一標識。
                            business_type:
                              type: string
                              description: 業務類型. **返回值：** 業務類型。
                            business_type_val:
                              type: string
                              description: 業務類型（原始值）. 字段 business_type 的原始值：business_type 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            name:
                              type: string
                              description: 客戶組名稱. **返回值：** 客戶組名稱。
                            count:
                              type: string
                              description: 客戶數量. **返回值：** 客戶數量。
                            remark:
                              type: string
                              description: 備註. **返回值：** 備註。
                            updated_at:
                              type: string
                              description: 更新時間. **返回值：** 更新時間；時間或日期格式以接口實際返回值為準。
                            op_user:
                              type: string
                              description: 操作人. **返回值：** 操作人。
                      total:
                        type: integer
                        description: 總條數. **返回值：** 符合查詢條件的記錄總數，用於計算分頁。
              example:
                code: 0
                message: success
                data:
                  list:
                    - id: '1139'
                      business_type: Margin
                      business_type_val: '1'
                      name: NANA测试
                      count: '1'
                      remark: 测试
                      updated_at: '1781250097'
                      op_user: user@example.com
                  total: 56
        '400':
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登錄或登錄狀態已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 當前賬號未獲得該功能授權。請在 User Permission 中為該賬號開通相應權限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 請求處理超時。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
