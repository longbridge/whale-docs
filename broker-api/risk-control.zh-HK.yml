                  message:
                    type: string
                  data:
                    type: object
                    required:
                      - list
                      - total
                    properties:
                      list:
                        type: array
                        description: 列表. **返回值：** 列表列表。
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: 預警編號. **返回值：** 當前記錄的唯一標識。
                            real_name:
                              type: string
                              description: 姓名. **返回值：** 姓名。
                            origin_id:
                              type: string
                              description: 證券賬號. **返回值：** 證券賬號。
                            account_type:
                              type: string
