                        - value: '1'
                          label: 客戶編號
                      example: Member ID
                    value:
                      type: string
                      description: 名單值. 用於按「名單值」篩選結果。
                      example: '2077584585014521856'
                    block_type:
                      type: string
                      description: 業務標籤. 用於按「業務標籤」篩選結果。
                      enum:
                        - '1'
                        - '2'
                        - '3'
                        - '4'
                      x-enum-details:
                        - value: '1'
                          label: 授信
                        - value: '2'
                          label: 資產調撥
                        - value: '3'
                          label: 授信動態調額
                        - value: '4'
                          label: 自動平倉
                      example: Credit
                    status:
                      type: string
                      description: 狀態. 用於按「狀態」篩選結果。
                      enum:
                        - '0'
                        - '1'
                      x-enum-details:
                        - value: '0'
                          label: 已啓用
                        - value: '1'
                          label: 已停用
                      example: Enabled
                page:
                  type: integer
                  description: 頁碼. 要查詢的頁碼，從 `1` 開始。
                page_size:
                  type: integer
                  description: 每頁數量. 每頁返回的記錄數量。
                orderBy:
                  type: array
                  description: 排序參數. 排序規則數組；每一項定義一個排序字段及排序方向。
                  items:
                    type: object
            example:
              filters: {}
              page: 1
              page_size: 20
              orderBy: []
      responses:
        '200':
          description: 成功時分頁返回「風控黑名單」記錄，以及頁碼、每頁數量和總記錄數等分頁信息。
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。

