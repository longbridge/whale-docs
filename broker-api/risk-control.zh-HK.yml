                            updated_at:
                              type: string
                              description: 更新日期. **返回值：** 更新日期；時間或日期格式以接口實際返回值為準。
                            created_at:
                              type: string
                              description: 創建日期. **返回值：** 創建日期；時間或日期格式以接口實際返回值為準。
                      total:
                        type: integer
                        description: 總條數. **返回值：** 符合查詢條件的記錄總數，用於計算分頁。
