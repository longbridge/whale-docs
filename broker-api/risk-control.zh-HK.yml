  /v1/datasets/account_stock_margin_ratios:
    get:
      operationId: account_stock_margin_ratios
      summary: 用戶股票融資保證金率
      tags:
        - 風控管理
      x-permission-key:
        - lb_hk_margin_ratio.account_margin_ratio_query
      x-lbonly: false
      description: |-
        查詢「用戶股票融資保證金率」數據，可通過 `filters` 組合業務篩選條件，並使用 `page`、`page_size` 和 `orderBy` 控制分頁與排序。

        ### 返回結果

        成功時返回匹配的記錄列表及分頁信息。各過濾字段的用途、可選值和動態數據來源見對應字段說明。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 過濾條件. 組合業務過濾條件。省略某個過濾字段時，不按該字段篩選。
                  properties:
                    counter_id:
                      type: string
                      description: 證券代碼. 用於按「證券代碼」篩選結果。
                    market:
                      type: string
                      description: |-
                        市場. 用於按「市場」篩選結果。

                        **可選值：** `US`、`HK`、`UK`、`SH`、`SZ`、`SG`、`KR`、`JP`、`AU`、`DE`、`CA`、`TH`、`ID`、`MY`、`TR`、`NA`、`OSL`、`HAS`、`EU`、`UT`、`GTMMF`
                      enum:
                        - US
                        - HK
                        - UK
                        - SH
                        - SZ
                        - SG
                        - KR
                        - JP
                        - AU
                        - DE
                        - CA
                        - TH
                        - ID
                        - MY
                        - TR
                        - NA
                        - OSL
                        - HAS
                        - EU
                        - UT
                        - GTMMF
                    member_id:
                      type: string
                      description: 客戶. 用於按「客戶」篩選結果。
                    status:
                      type: string
                      description: |-
                        狀態. 用於按「狀態」篩選結果。

                        **可選值：**
                        - `0` - 表示生效中
                        - `1` - 表示已失效
                      enum:
                        - '0'
                        - '1'
                    account_type:
                      type: string
                      description: |-
                        賬戶類型. 用於按「賬戶類型」篩選結果。

                        **可選值：**
                        - `M` - 表示融資賬戶
                        - `C` - 表示現金賬戶
                        - `F` - 表示期貨賬戶
                      enum:
                        - M
                        - C
                        - F
                    mark:
                      type: string
                      description: |-
                        賬戶標識. 用於按「賬戶標識」篩選結果。

                        **可選值：**
                        - `dt` - 表示 Day Trade
                      enum:
                        - dt
                page:
                  type: integer
                  description: 頁碼. 要查詢的頁碼，從 `1` 開始。
                page_size:
                  type: integer
                  description: 每頁數量. 每頁返回的記錄數量。
                orderBy:
                  type: array
                  description: 排序參數. 排序規則數組；每一項定義一個排序字段及排序方向。
                  items:
                    type: object
            example:
              filters: {}
              page: 1
              page_size: 20
              orderBy: []
      responses:
        '200':
          description: 成功時分頁返回「用戶股票融資保證金率」記錄，以及頁碼、每頁數量和總記錄數等分頁信息。
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。

                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`
                      判斷具體結果。

                      - `401`：未登錄。
                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。
                  message:
                    type: string
                  data:
                    type: object
                    required:
                      - list
                      - total
                    properties:
                      list:
                        type: array
                        description: 列表. **返回值：** 列表列表。
                        items:
                          type: object
                          properties:
                            member_id:
                              type: string
                              description: 客戶. **返回值：** 客戶。
                            member_id_val:
                              type: string
                              description: 客戶（原始值）. 字段 member_id 的原始值：member_id 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            member_real_name:
                              type: string
                              description: 姓名. **返回值：** 姓名。
                            aaid:
                              type: string
                              description: 證券賬號. **返回值：** 證券賬號。
                            aaid_val:
                              type: string
                              description: 證券賬號（原始值）. 字段 aaid 的原始值：aaid 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            account_type:
                              type: string
                              description: 賬號類型. **返回值：** 賬號類型。
                            account_type_val:
                              type: string
                              description: 賬號類型（原始值）. 字段 account_type 的原始值：account_type 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            account_mark:
                              type: string
                              description: 賬戶標識. **返回值：** 賬戶標識。
                            account_mark_val:
                              type: string
                              description: 賬戶標識（原始值）. 字段 account_mark 的原始值：account_mark 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            counter_id:
                              type: string
                              description: 證券代碼. **返回值：** 證券代碼。
                            counter_id_val:
                              type: string
                              description: 證券代碼（原始值）. 字段 counter_id 的原始值：counter_id 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            stock_name:
                              type: string
                              description: 股票名稱. **返回值：** 股票名稱。
                            market:
                              type: string
                              description: 市場. **返回值：** 市場。
                            market_val:
                              type: string
                              description: 市場（原始值）. 字段 market 的原始值：market 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            im_factor:
                              type: string
                              description: 初始保證金 (%). **返回值：** 初始保證金 (%)。
                            mm_factor:
                              type: string
                              description: 維持保證金 (%). **返回值：** 維持保證金 (%)。
                            fm_factor:
                              type: string
                              description: 強平保證金 (%). **返回值：** 強平保證金 (%)。
                            mcm_factor:
                              type: string
                              description: margincall 保證金（%）. **返回值：** margincall 保證金（%）。
                            status:
                              type: string
                              description: 狀態. **返回值：** 狀態。
                            status_val:
                              type: string
                              description: 狀態（原始值）. 字段 status 的原始值：status 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            updated_at:
                              type: string
                              description: 更新日期. **返回值：** 更新日期；時間或日期格式以接口實際返回值為準。
                            created_at:
                              type: string
                              description: 創建日期. **返回值：** 創建日期；時間或日期格式以接口實際返回值為準。
                            expire_at:
                              type: string
                              description: 過期日期. **返回值：** 過期日期；時間或日期格式以接口實際返回值為準。
                            remark:
                              type: string
                              description: 備註. **返回值：** 備註。
                      total:
                        type: integer
                        description: 總條數. **返回值：** 符合查詢條件的記錄總數，用於計算分頁。
