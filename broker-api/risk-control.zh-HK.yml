  /v1/datasets/risk_member_option_margin_ratios:
    post:
      operationId: risk_member_option_margin_ratios
      summary: 客戶級保證金
      tags:
        - 風控管理
      x-permission-key:
        - credit_management.option_stock_margin_ratio_query
      x-lbonly: false
      description: |-
        查詢客戶級期權保證金系數配置，用於風控為特定客戶在特定標的上單獨設定期權保證金上下限。

        ### 請求參數

        - 透過 `filters` 組合業務篩選條件（可選欄位見下方 filters 欄位說明），並使用 `page`、`page_size`、`orderBy` 控制分頁與排序。

        ### 業務說明

        - 數據來源於客戶維度的期權保證金系數配置，每筆記錄對應「某客戶（`aaid`） + 某標的證券」的一組期權保證金參數。

        - 記錄包含證券資訊（`counter_id`、股票名稱、`market`）以及期權保證金上限與下限，上限、下限均分別給出 IM、MM、FM 三檔系數（`max_im_factor`、`max_mm_factor`、`max_fm_factor`、`min_im_factor`、`min_mm_factor`、`min_fm_factor`）。

        - 另含 `op_user` 建立人、`remark` 備註及建立、更新時間，是在全局期權保證金系數之外為個別客戶設置的差異化配置。

        ### 返回結果

        成功時返回匹配的記錄列表及分頁資訊。返回欄含義見回應定義。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 過濾條件. 組合業務過濾條件。省略某個過濾字段時，不按該字段篩選。
                  properties:
                    counter_id:
                      type: string
                      description: 股票代碼. 用於按「股票代碼」篩選結果。
                      example: ST/US/RLX
                    aaid:
                      type: string
                      description: 客戶. 用於按「客戶」篩選結果。
                    max_im_factor:
                      type: object
                      description: IM 上限. 用於按「IM 上限」篩選結果。
                      properties:
                        gte:
                          type: number
                          description: 大於等於. 篩選範圍的下限，匹配值包含該值。
                        lte:
                          type: number
                          description: 小於等於. 篩選範圍的上限，匹配值包含該值。
                    min_im_factor:
                      type: object
                      description: IM 下限. 用於按「IM 下限」篩選結果。
                      properties:
                        gte:
                          type: number
                          description: 大於等於. 篩選範圍的下限，匹配值包含該值。
                        lte:
                          type: number
                          description: 小於等於. 篩選範圍的上限，匹配值包含該值。
                page:
                  type: integer
                  description: 頁碼. 要查詢的頁碼，從 `1` 開始。
                page_size:
                  type: integer
                  description: 每頁數量. 每頁返回的記錄數量。
                orderBy:
                  type: array
                  description: 排序參數. 排序規則數組；每一項定義一個排序字段及排序方向。
                  items:
                    type: object
            example:
              filters: {}
              page: 1
              page_size: 20
              orderBy: []
      responses:
        '200':
          description: 成功時分頁返回「用戶期權保證金系數」記錄，以及頁碼、每頁數量和總記錄數等分頁信息。
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。

                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`
                      判斷具體結果。

                      - `401`：未登錄。
                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。
                  message:
                    type: string
                  data:
                    type: object
                    required:
                      - list
                      - total
                    properties:
                      list:
                        type: array
                        description: 列表. **返回值：** 列表列表。
                        items:
                          type: object
                          properties:
                            aaid:
                              type: string
                              description: 證券賬號. **返回值：** 證券賬號。
                            aaid_val:
                              type: string
                              description: 證券賬號（原始值）. 字段 aaid 的原始值：aaid 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            counter_id:
                              type: string
                              description: 股票代碼. **返回值：** 股票代碼。
                            counter_id_val:
                              type: string
                              description: 股票代碼（原始值）. 字段 counter_id 的原始值：counter_id 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            short_name_locales:
                              type: string
                              description: 股票名稱. **返回值：** 股票名稱。
                            market:
                              type: string
                              description: 市場. **返回值：** 市場。
                            market_val:
                              type: string
                              description: 市場（原始值）. 字段 market 的原始值：market 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            max:
                              type: string
                              description: 期權保證金上限. **返回值：** 期權保證金上限。
                            min:
                              type: string
                              description: 期權保證金下限. **返回值：** 期權保證金下限。
                            updated_at:
                              type: string
                              description: 更新日期. **返回值：** 更新日期；時間或日期格式以接口實際返回值為準。
                            created_at:
                              type: string
                              description: 創建日期. **返回值：** 創建日期；時間或日期格式以接口實際返回值為準。
                            op_user:
                              type: string
                              description: 創建人. **返回值：** 創建人。
                            remark:
                              type: string
                              description: 備註. **返回值：** 備註。
                      total:
                        type: integer
                        description: 總條數. **返回值：** 符合查詢條件的記錄總數，用於計算分頁。
              example:
                code: 0
                message: success
                data:
                  list:
                    - aaid: H00000000
                      aaid_val: '10000000'
                      counter_id: ST/US/RLX
                      counter_id_val: ''
