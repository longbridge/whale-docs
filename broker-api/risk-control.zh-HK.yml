                        - value: '1'
                          label: 待發送
                    remark:
                      type: string
                      description: |-
                        備註. 用於按「備註」篩選結果。

                        支持多選；提交時使用英文逗號（`,`）拼接多個值。不傳時不按此字段篩選。
                      example: 2,1
                      enum:
                        - '2'
                        - '1'
                        - '3'
                        - '4'
                        - '5'
