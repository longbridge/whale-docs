      x-lbonly: false
      description: |-
        查詢全局期權保證金系數配置，用於風控按標的證券統一維護期權保證金的上下限標準。

        ### 請求參數

        - 透過 `filters` 組合業務篩選條件（可選欄位見下方 filters 欄位說明），並使用 `page`、`page_size`、`orderBy` 控制分頁與排序。

        ### 業務說明

        - 數據來源於按標的證券維度的期權保證金系數配置，每筆記錄對應一隻標的證券的一組期權保證金參數。

        - 記錄包含證券資訊（`counter_id`、股票名稱、`market`）以及期權保證金上限與下限，上限、下限均分別給出 IM、MM、FM 三檔系數（`max_im_factor`、`max_mm_factor`、`max_fm_factor`、`min_im_factor`、`min_mm_factor`、`min_fm_factor`）。

        - 另含 `op_user` 建立人、`remark` 備註及建立、更新時間，作為客戶未單獨配置時適用的預設期權保證金標準。

        ### 返回結果

        成功時返回匹配的記錄列表及分頁資訊。返回欄含義見回應定義。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
