  /v1/datasets/account_credits:
    get:
      operationId: account_credits
      summary: 客户額度
      tags:
        - 風控管理
      x-permission-key:
        - lb_hk_credit_limit.client_credit_limit_query
      x-lbonly: false
      description: |-
        查詢「授信額度查詢」數據，可通過 `filters` 組合業務篩選條件，並使用 `page`、`page_size` 和 `orderBy` 控制分頁與排序。

        ### 返回結果

        成功時返回匹配的記錄列表及分頁信息。各過濾字段的用途、可選值和動態數據來源見對應字段說明。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 過濾條件. 組合業務過濾條件。省略某個過濾字段時，不按該字段篩選。
                  properties:
                    finance_amount:
                      type: object
                      description: 融資額度. 用於按「融資額度」篩選結果。
                      properties:
                        gte:
                          type: integer
                          description: 大於等於. 篩選範圍的下限，匹配值包含該值。
                        lte:
                          type: integer
                          description: 小於等於. 篩選範圍的上限，匹配值包含該值。
                    state:
                      type: string
                      description: |-
                        賬戶狀態. 用於按「賬戶狀態」篩選結果。

                        **可選值：**
                        - `-1` - 表示已註銷
                        - `1` - 表示正常
                      enum:
                        - '-1'
                        - '1'
                    member_account_type:
                      type: string
                      description: |-
                        賬戶類型. 用於按「賬戶類型」篩選結果。

                        **可選值：**
                        - `M` - 表示融資賬戶
                        - `C` - 表示現金賬戶
                        - `F` - 表示期貨賬戶
                      enum:
                        - M
                        - C
                        - F
                    account_mark:
                      type: string
                      description: |-
                        賬戶標識. 用於按「賬戶標識」篩選結果。

                        **可選值：**
                        - `dt` - 表示 Day Trade
                      enum:
                        - dt
                    member_id:
                      type: string
                      description: 客戶. 用於按「客戶」篩選結果。
                    credit_group_name:
                      type: string
                      description: 授信組. 用於按「授信組」篩選結果。
                page:
                  type: integer
                  description: 頁碼. 要查詢的頁碼，從 `1` 開始。
                page_size:
                  type: integer
                  description: 每頁數量. 每頁返回的記錄數量。
                orderBy:
                  type: array
                  description: 排序參數. 排序規則數組；每一項定義一個排序字段及排序方向。
                  items:
                    type: object
            example:
              filters: {}
              page: 1
              page_size: 20
              orderBy: []
      responses:
        '200':
          description: 成功時分頁返回「授信額度查詢」記錄，以及頁碼、每頁數量和總記錄數等分頁信息。
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。

                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`
                      判斷具體結果。

                      - `401`：未登錄。
                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。
                  message:
                    type: string
                  data:
                    type: object
                    required:
                      - list
                      - total
                    properties:
                      list:
                        type: array
                        description: 列表. **返回值：** 列表列表。
                        items:
                          type: object
                          properties:
                            member_id:
                              type: string
                              description: 客戶編號. **返回值：** 客戶編號。
                            real_name:
                              type: string
                              description: 姓名. **返回值：** 姓名。
                            member_account_type:
                              type: string
                              description: 賬戶類型. **返回值：** 賬戶類型。
                            member_account_type_val:
                              type: string
                              description: 賬戶類型（原始值）. 字段 member_account_type 的原始值：member_account_type 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            account_mark:
                              type: string
                              description: 賬戶標識. **返回值：** 賬戶標識。
                            account_mark_val:
                              type: string
                              description: 賬戶標識（原始值）. 字段 account_mark 的原始值：account_mark 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            client_type:
                              type: string
                              description: 客戶類型. **返回值：** 客戶類型。
                            client_type_val:
                              type: string
                              description: 客戶類型（原始值）. 字段 client_type 的原始值：client_type 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            credit_group_name:
                              type: string
                              description: 授信組. **返回值：** 授信組。
