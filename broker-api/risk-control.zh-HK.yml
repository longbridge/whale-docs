      x-permission-key:
        - margin_call.short_sell_stock_holding_summary
      x-lbonly: false
      description: |-
        查詢「融券持倉概覽」數據，可通過 `filters` 組合業務篩選條件，並使用 `page`、`page_size` 和 `orderBy` 控制分頁與排序。

        ### 返回結果

        成功時返回匹配的記錄列表及分頁信息。各過濾字段的用途、可選值和動態數據來源見對應字段說明。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 過濾條件. 組合業務過濾條件。省略某個過濾字段時，不按該字段篩選。
                  properties:
                    counter_id:
                      type: string
                      description: 證券代碼. 用於按「證券代碼」篩選結果。
                    market:
                      type: string
                      description: |-
                        市場. 用於按「市場」篩選結果。

                        支持多選；提交時使用英文逗號（`,`）拼接多個值。不傳時不按此字段篩選。

                        **可選值：**
                        - `US` - 美股
                        - `HK` - 港股
                        - `CN` - 表示滬深
                        - `SG` - 新加坡
                        - `VAHK` - 表示虛擬資產
                        - `CNHK` - 表示滬深港通
                      example: US,HK
                      enum:
                        - US
                        - HK
                        - CN
                        - SG
                        - VAHK
                        - CNHK
                page:
                  type: integer
                  description: 頁碼. 要查詢的頁碼，從 `1` 開始。
                page_size:
                  type: integer
                  description: 每頁數量. 每頁返回的記錄數量。
                orderBy:
                  type: array
                  description: 排序參數. 排序規則數組；每一項定義一個排序字段及排序方向。
                  items:
                    type: object
            example:
              filters: {}
              page: 1
              page_size: 20
              orderBy: []
      responses:
        '200':
          description: 成功時分頁返回「融券持倉概覽」記錄，以及頁碼、每頁數量和總記錄數等分頁信息。
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。

                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`
                      判斷具體結果。

                      - `401`：未登錄。
                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。
                  message:
                    type: string
                  data:
                    type: object
                    required:
                      - list
                      - total
                    properties:
                      list:
                        type: array
                        description: 列表. **返回值：** 列表列表。
                        items:
                          type: object
                          properties:
                            counter_id:
                              type: string
                              description: 證券代碼. **返回值：** 證券代碼。
                            counter_id_val:
                              type: string
                              description: 證券代碼（原始值）. 字段 counter_id 的原始值：counter_id 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            market:
                              type: string
                              description: 市場. **返回值：** 市場。
                            market_val:
                              type: string
                              description: 市場（原始值）. 字段 market 的原始值：market 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            counter_name:
                              type: string
                              description: 證券名稱. **返回值：** 證券名稱。
                            available:
                              type: string
                              description: 融券池數量 (IB). **返回值：** 融券池數量 (IB)。
                            client_count:
                              type: string
                              description: 持倉客戶數. **返回值：** 持倉客戶數。
                            total:
                              type: string
                              description: 持倉總數. **返回值：** 持倉總數。
                            status:
                              type: string
                              description: 狀態. **返回值：** 狀態。
                            status_val:
                              type: string
                              description: 狀態（原始值）. 字段 status 的原始值：status 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            remark:
                              type: string
                              description: 備註. **返回值：** 備註。
                      total:
                        type: integer
                        description: 總條數. **返回值：** 符合查詢條件的記錄總數，用於計算分頁。
              example:
                code: 0
                message: success
                data:
                  list:
                    - counter_id: ETF/HK/2800
                      counter_id_val: ''
                      market: HK
                      market_val: HK
                      counter_name: 盈富基金
                      available: ''
                      client_count: '1'
                      total: -50,000
                      status: ''
                      status_val: ''
                      remark: ''
                  total: 76
        '400':
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
