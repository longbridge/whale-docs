  /risk/v1/account_stock_margin_ratio/create:
    post:
      operationId: account_stock_margin_ratio_create
      summary: 新建客戶多頭保證金
      tags:
        - 風控管理
      x-permission-key:
        - credit_management.option_stock_margin_ratio_query
      x-lbonly: false
      description: |-
        為指定客戶新建一條多頭股票保證金比例記錄，覆蓋該客戶在某證券上的保證金率設定。

        ### 請求參數

        - 本接口無必填參數約束，可選參數見下方欄位說明。
        - 各欄位的格式、取值範圍和業務含義見對應欄位說明。

        ### 業務說明

        保證金比例包括初始（`im_factor`）、維持（`mm_factor`）、強平（`fm_factor`）及 Margin Call（`mcm_factor`）等檔位，可設定失效日期（`expire_at`）。新建後即成為該客戶對應證券的生效保證金設定。

        ### 風險提示

        此操作直接產生真實的保證金設定變更，影響該客戶的融資額度、維持保證金和強平判定。調用前請確認目標客戶、證券及各保證金率無誤。

        ### 處理結果

        成功時完成保證金記錄的新建；後續狀態和返回數據以 `200` 響應定義為準。
