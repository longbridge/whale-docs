  /v1/risk_monitoring/batch_push_message:
    post:
      operationId: batch_push_message
      summary: 批量推送風控預警消息
      tags:
        - 風控管理
      x-lbonly: false
      description: |-
        按證券賬號列表批量推送風控預警消息。

        ### 請求參數

        - 必填：`aaid_list`（證券賬號列表）、`push_msg_type`（推送消息類型）、`audit_frontend_resource`（調用方審計上下文）
        - 各字段的格式、取值範圍和業務含義見對應字段說明。

        ### 業務說明

        對列表中的每個證券賬號按指定消息類型推送風控預警通知。

        ### 風險提示

        此操作向真實客戶批量發送通知，無法撤回。調用前請確認賬號列表與消息類型無誤。

        ### 處理結果

        成功時完成批量消息推送；後續狀態和返回數據以 `200` 響應定義為準。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - aaid_list
                - push_msg_type
                - audit_frontend_resource
              properties:
                aaid_list:
                  type: array
                  description: 證券賬號列表. 證券賬號列表，以 JSON 數組形式提交。此字段為必填項。
                  items:
                    type: string
                push_msg_type:
                  type: string
                  description: 推送消息類型. 用於指定「推送消息類型」。此字段為必填項。
                  enum:
                    - '1'
                    - '2'
                  x-enum-details:
                    - value: '1'
                      label: App 消息
                    - value: '2'
                      label: 郵件消息
                  example: '1'
                audit_frontend_resource:
                  type: object
                  description: 審計上下文. 審計信息，含消息 ID 列表與推送消息類型
            example:
              aaid_list:
                - '123'
              push_msg_type: '1'
              audit_frontend_resource:
                ids:
                  - '123'
                push_msg_type: '1'
      responses:
        '200':
          description: 請求處理成功。響應的 `data` 不包含額外業務字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。

                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`
                      判斷具體結果。

                      - `401`：未登錄。
                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登錄或登錄狀態已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 當前賬號未獲得該功能授權。請在 User Permission 中為該賬號開通相應權限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 請求處理超時。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
      x-mint:
        href: /zh-HK/api-reference/batch_push_message
        metadata:
          sidebarTitle: 批量推送風控預警消息
  /v1/risk_monitoring/manual_batch_close_position:
    post:
      operationId: manual_batch_close_position
      summary: 手工批量平倉
      tags:
        - 風控管理
      x-permission-key:
        - lb_hk_margin_call.margin_call_batch_forc
      x-lbonly: false
      description: |-
        對所選持倉批量發起強制平倉。

        ### 請求參數

        - 必填：`logid_list`（預警記錄 ID 列表）、`op_user`（操作員）、`is_intraday_credit`（是否日內融）、`audit_frontend_resource`（調用方審計上下文）
        - 可選：`counter_id`（標的代碼）
        - 各字段的格式、取值範圍和業務含義見對應字段說明。

        ### 業務說明

        針對預警記錄列表對應的持倉批量執行強制平倉；傳入 `counter_id` 時可限定平倉的標的。

        ### 風險提示

        此操作對真實客戶持倉批量強制平倉，將直接產生實際成交，風險極高且不可逆。調用前務必核對預警記錄、標的與操作員。

        ### 處理結果

        成功時提交批量強平；後續狀態和返回數據以 `200` 響應定義為準。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - logid_list
                - op_user
                - is_intraday_credit
                - audit_frontend_resource
              properties:
                logid_list:
                  type: array
                  description: 預警記錄ID列表. 預警記錄ID列表，以 JSON 數組形式提交。此字段為必填項。
                  items:
                    type: string
                op_user:
                  type: string
                  description: 操作員. 發起本次操作的操作員標識，用於審計追蹤。此字段為必填項。
                counter_id:
                  type: string
                  description: 標的代碼. 證券或基金標的代碼，用於定位本次請求處理的標的。
                is_intraday_credit:
                  type: boolean
                  description: |-
                    是否日內融. 是否日內融。此字段為必填項。

                    **布爾值：**
                    - `true` - 表示條件成立
                    - `false` - 表示條件不成立
                audit_frontend_resource:
                  type: object
                  description: 審計上下文. 含 $behavior/$action/aaids
            example:
              logid_list:
                - '123'
              op_user: ''
              counter_id: ''
              is_intraday_credit: false
              audit_frontend_resource:
                $behavior: ''
                $action: ''
                aaids:
                  - '456'
      responses:
        '200':
          description: 請求處理成功。響應的 `data` 不包含額外業務字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
