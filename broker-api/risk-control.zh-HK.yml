        - 數據來源於營運導入的自訂情景數據，一條記錄對應一隻股票在該情景下的保證金參數設定。
        - 記錄包含股票代碼、股票名稱、市場、漲跌幅，以及是否可賣空。
        - 同時給出多頭與空頭的初始保證金、Margin Call 保證金、維持保證金、平倉保證金比例，以及期權各類保證金的上下限比例。
        - 這些參數作為壓力測試的輸入口徑，用於按導入模板計算客戶在特定行情下的保證金變化。

        ### 返回結果

