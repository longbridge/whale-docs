  /v1/option_exercise_manger/check_exercise_data:
    post:
      operationId: check_exercise_data
      summary: 確認執行行權對賬
      tags:
        - 風控管理
      x-lbonly: false
      description: |-
        確認執行期權行權對賬。

        ### 請求參數

        - 必填：`due_date`（到期日）、`check_type`（檢查類型）、`settlement_channel_code`（結算渠道代碼）
        - 可選：`file_key`（文件 Key）
        - 各欄位的格式、取值範圍和業務含義見對應欄位說明。

        ### 業務說明

        針對指定 `due_date` 與 `settlement_channel_code`，按 `check_type` 執行行權對賬確認；可通過 `file_key` 關聯對賬所需的上傳文件。

        ### 風險提示

        此操作涉及真實行權對賬確認，可能引起真實資金、持倉或交易狀態變化，風險極高。調用前請確認到期日、結算渠道和對賬文件無誤。

        ### 處理結果

        成功時完成行權對賬確認；後續狀態和返回數據以 `200` 響應定義為準。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - due_date
                - check_type
                - settlement_channel_code
              properties:
                file_key:
                  type: string
                  description: 文件Key. 文件上傳後返回的對象存儲 Key，用於定位本次請求處理的文件。
                due_date:
                  type: string
                  description: 到期日. 用於指定「到期日」。此字段為必填項。
                check_type:
                  type: string
                  description: |-
                    檢查類型。
                  enum:
                    - '1'
                    - '2'
                    - '3'
                    - '4'
                    - '5'
                  x-enum-details:
                    - value: '1'
                      label: 根據上手文件對賬
                    - value: '2'
                      label: 手動上傳文件對賬
                    - value: '3'
                      label: 根據期權持倉自動生成行權數據
                    - value: '4'
                      label: 通過接口獲取行權數據
                    - value: '5'
                      label: 根據 lbhk 結果對賬
                  example: '1'
                settlement_channel_code:
                  type: string
                  description: 結算渠道代碼. 用於指定「結算渠道代碼」。此字段為必填項。
            example:
              file_key: ''
              due_date: 2026-07-10
              check_type: ''
              settlement_channel_code: ''
      responses:
        '200':
          description: 請求處理成功。響應的 `data` 不包含額外業務字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。

                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`
                      判斷具體結果。

                      - `401`：未登錄。
                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登錄或登錄狀態已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 當前賬號未獲得該功能授權。請在 User Permission 中為該賬號開通相應權限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 請求處理超時。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
      x-mint:
        href: /zh-HK/api-reference/check_exercise_data
        metadata:
          sidebarTitle: 確認執行行權對賬
