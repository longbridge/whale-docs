                      enum:
                        - '0'
                        - '1'
                        - '2'
                        - '3'
                        - '4'
                      x-enum-details:
                        - value: '0'
                          label: '>='
                        - value: '1'
                          label: '>'
                        - value: '2'
                          label: <=
                        - value: '3'
                          label: <
                        - value: '4'
                          label: 無限
                    quota:
                      type: string
                      description: 閾值。
                condition_reject:
                  type: object
                  description: 拒絕條件.
                  properties:
                    operator:
                      type: string
                      description: 運算符。
                      enum:
                        - '0'
                        - '1'
                        - '2'
                        - '3'
                        - '4'
                      x-enum-details:
                        - value: '0'
                          label: '>='
                        - value: '1'
                          label: '>'
                        - value: '2'
