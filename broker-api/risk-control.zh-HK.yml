        - 數據來源於按指數定義的 Haircut 規則，每筆記錄對應一條以指數與市場範圍界定適用證券的折算率規則。

        - 記錄包含 `name` 規則名、`counter_id` 指數與指數名稱、`security_type` 證券類型、`market` 市場，以及 `include_indexes`、`exclude_indexes` 包含與排除的指數、`include_exchanges`、`exclude_exchanges` 包含與排除的上市交易市場。

        - `haircut` 欄以 `1 - Haircut (%)` 形式給出抵押率，另含 `last_update_user` 修改人及建立、修改時間，供風控維護指數級抵押品折算策略。

