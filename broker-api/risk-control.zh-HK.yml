  /risk/v1/account_stock_opt_margin_ratio/create:
    post:
      operationId: account_stock_opt_margin_ratio_create
      summary: 新建客戶股票期權保證金
      tags:
        - 風控管理
      x-permission-key:
        - credit_management.option_stock_margin_ratio_query
      x-lbonly: false
      description: |-
        為指定客戶新建一條股票期權保證金系數記錄，用於設定該客戶特定標的的期權保證金上下限。

        ### 請求參數

        - 本接口無必填參數，可選參數見下方欄位說明。
        - 各欄位的格式、取值範圍和業務含義見對應欄位說明。

        ### 業務說明

        記錄通常包含客戶、股票代碼，以及初始、維持、強平保證金系數的上限與下限，用於該客戶期權持倉的保證金計算。

        ### 風險提示

        此操作會新增客戶級股票期權保證金配置，直接影響該客戶期權持倉的保證金要求。調用前請確認目標客戶和參數無誤。

        ### 處理結果

        成功時完成新建操作；後續狀態和返回數據以 `200` 響應定義為準。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 未實調，響應字段以真實接口為準。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: 0 表示成功；非 0 為業務錯誤碼，此時 data 通常為空。HTTP 狀態碼本身恆為 200，請勿依賴 HTTP status 判斷成功/失敗。
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      ticket_id:
                        type: string
              example:
                code: 0
                message: success
                data: {}
        '400': *id001
        '401': *id002
        '403': *id003
        '408': *id004
      x-mint:
        href: /zh-HK/api-reference/account_stock_opt_margin_ratio_create
        metadata:
          sidebarTitle: 新建客戶股票期權保證金
