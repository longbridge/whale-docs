        - 支援按客戶、預警日期、證券、訊息狀態與備註篩選，其中訊息狀態與備註支援多選。

        - 供風控人員批量向相關客戶發送追收訊息並跟進處理進度。

        ### 返回結果

        成功時返回匹配的記錄列表及分頁資訊。返回欄位含義見回應定義。
      security:
        - bearerAuth: []
      requestBody:
        required: true
