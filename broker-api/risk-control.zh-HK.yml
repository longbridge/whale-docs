                - operator
              properties:
                dimension:
                  type: integer
                  description: |-
                    維度類型. 名單維度。

                    **可選值：**
                    - `0` - 表示證券賬號
                    - `1` - 表示客戶編號
                  enum:
                    - '0'
                    - '1'
                value:
                  type: string
                  description: 維度值. 對應 dimension 類型的賬戶號或會員ID值；輸入後會實時校驗是否已授信
                block_type_list:
                  type: array
                  description: 拉黑類型列表. 多選，元素為數字。
                  enum:
                    - '1'
                    - '2'
                    - '3'
                    - '4'
                  items:
                    type: string
                remark:
                  type: string
                  description: 備註. 隨本次操作保存的備註。
                operator:
                  type: string
                  description: 操作人. 操作人，调用方自動填充當前登錄用戶名，非請求可見字段
                audit_frontend_resource:
                  type: object
                  description: 審計上下文. 審計留痕字段，非業務參數，包含 dimension_name(維度名稱)、display_block_types(拉黑類型文案，逗號分隔)、$behavior(操作描述)
            example:
