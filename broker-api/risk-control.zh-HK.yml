  /v1/datasets/risk_multiple_dimension_limits:
    get:
      operationId: risk_multiple_dimension_limits
      summary: 多維度限額
      tags:
        - 風控管理
      x-permission-key:
        - risk_limit_config.risk_limit_dimension_query
      x-lbonly: false
      description: |-
        查詢「多維度限額」數據，可通過 `filters` 組合業務篩選條件，並使用 `page`、`page_size` 和 `orderBy` 控制分頁與排序。

        ### 返回結果

        成功時返回匹配的記錄列表及分頁信息。各過濾字段的用途、可選值和動態數據來源見對應字段說明。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 過濾條件. 組合業務過濾條件。省略某個過濾字段時，不按該字段篩選。
                  properties:
                    code:
                      type: string
                      description: |-
                        限額代碼. 用於按「限額代碼」篩選結果。

                        候選值會動態變化。請調用 `GET /v1/datasets/refs/risk_limit_codes_multi_dimension` 獲取當前可用的數據字典，並使用返回項的 `key` 作為本參數值。
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/risk_limit_codes_multi_dimension
                    market:
                      type: string
                      description: |-
                        市場. 用於按「市場」篩選結果。

                        **可選值：** `US`、`HK`、`UK`、`SH`、`SZ`、`SG`、`KR`、`JP`、`AU`、`DE`、`CA`、`TH`、`ID`、`MY`、`TR`、`NA`、`OSL`、`HAS`、`EU`、`UT`、`GTMMF`
                      enum:
                        - US
                        - HK
                        - UK
                        - SH
                        - SZ
                        - SG
                        - KR
                        - JP
                        - AU
                        - DE
                        - CA
                        - TH
                        - ID
                        - MY
                        - TR
                        - NA
                        - OSL
                        - HAS
                        - EU
                        - UT
                        - GTMMF
                    counter_id:
                      type: string
                      description: 證券代碼. 用於按「證券代碼」篩選結果。
                    is_apply:
                      type: string
                      description: |-
                        生效狀態. 用於按「生效狀態」篩選結果。

                        **可選值：**
                        - `true` - 表示生效中
                        - `false` - 表示已失效
                      enum:
                        - 'true'
                        - 'false'
                    aaid:
                      type: string
                      description: 客戶. 用於按「客戶」篩選結果。
                page:
                  type: integer
                  description: 頁碼. 要查詢的頁碼，從 `1` 開始。
                page_size:
                  type: integer
                  description: 每頁數量. 每頁返回的記錄數量。
                orderBy:
                  type: array
                  description: 排序參數. 排序規則數組；每一項定義一個排序字段及排序方向。
                  items:
                    type: object
            example:
              filters: {}
              page: 1
              page_size: 20
              orderBy: []
      responses:
        '200':
          description: 成功時分頁返回「多維度限額」記錄，以及頁碼、每頁數量和總記錄數等分頁信息。
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。

                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`
                      判斷具體結果。

                      - `401`：未登錄。
                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。
                  message:
                    type: string
                  data:
                    type: object
                    required:
                      - list
                      - total
                    properties:
                      list:
                        type: array
                        description: 列表. **返回值：** 列表列表。
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: 序號. **返回值：** 當前記錄的唯一標識。
                            code:
                              type: string
                              description: 限額代碼. **返回值：** 限額代碼。
                            name:
                              type: string
                              description: 限額名稱. **返回值：** 限額名稱。
                            enable:
                              type: string
                              description: 啓用標識. **返回值：** 表示啓用標識。
                            enable_val:
                              type: string
                              description: 啓用標識（原始值）. 字段 enable 的原始值：enable 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            currency:
                              type: string
                              description: 限額幣種. **返回值：** 限額幣種。
                            aaid:
                              type: string
                              description: 證券賬號. **返回值：** 證券賬號。
                            aaid_val:
                              type: string
                              description: 證券賬號（原始值）. 字段 aaid 的原始值：aaid 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            counter_id:
                              type: string
                              description: 證券代碼. **返回值：** 證券代碼。
                            counter_id_val:
                              type: string
                              description: 證券代碼（原始值）. 字段 counter_id 的原始值：counter_id 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            counter_name:
                              type: string
                              description: 證券名稱. **返回值：** 證券名稱。
                            counter_name_val:
                              type: string
                              description: 證券名稱（原始值）. 字段 counter_name 的原始值：counter_name 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            stock_group_id:
                              type: string
                              description: 股票組. **返回值：** 股票組。
                            stock_group_id_val:
                              type: string
                              description: 股票組（原始值）. 字段 stock_group_id 的原始值：stock_group_id 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            market:
                              type: string
                              description: 市場. **返回值：** 市場。
                            market_val:
                              type: string
                              description: 市場（原始值）. 字段 market 的原始值：market 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            condition_warn:
                              type: string
                              description: 提示條件. **返回值：** 提示條件。
                            condition_audit:
                              type: string
                              description: 審核條件. **返回值：** 審核條件。
                            condition_reject:
                              type: string
                              description: 拒絕條件. **返回值：** 拒絕條件。
                            updated_at:
                              type: string
                              description: 更新時間. **返回值：** 更新時間；時間或日期格式以接口實際返回值為準。
                            last_update_user:
                              type: string
                              description: 操作人. **返回值：** 操作人。
                            is_apply:
                              type: string
                              description: 生效狀態. **返回值：** 表示生效狀態。
                            is_apply_val:
                              type: string
                              description: 生效狀態（原始值）. 字段 is_apply 的原始值：is_apply 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            remark:
                              type: string
                              description: 備註. **返回值：** 備註。
                      total:
                        type: integer
                        description: 總條數. **返回值：** 符合查詢條件的記錄總數，用於計算分頁。
              example:
                code: 0
                message: success
                data:
                  list:
                    - id: '100977'
                      code: CSGHM
                      name: 股票组持仓数量限额
                      enable: Not Activated
                      enable_val: 'false'
                      currency: ''
                      aaid: H00000000
