        content:
          application/json:
            schema:
              type: object
              required:
                - dimension
                - value
                - block_type_list
                - operator
              properties:
                dimension:
                  type: integer
                  description: 維度類型. 名單維度。
                  enum:
                    - '0'
                    - '1'
                  x-enum-details:
                    - value: '0'
                      label: 證券賬號
                    - value: '1'
                      label: 客戶編號
                  example: '0'
                value:
                  type: string
                  description: 維度值. 對應 dimension 類型的賬戶號或會員ID值；輸入後會實時校驗是否已授信
                block_type_list:
                  type: array
                  description: |-
                    拉黑類型列表。取值來自後端數據字典（動態維護），非固定枚舉；請以接口實際返回的可選項為準。
                  enum:
                    - '1'
                    - '2'
                    - '3'
                    - '4'
                  items:
                    type: string
                remark:
                  type: string
                  description: 備註. 隨本次操作保存的備註。
                operator:
                  type: string
                  description: 操作人. 操作人，調用方自動填充當前登錄用戶名，非請求可見字段
                audit_frontend_resource:
                  type: object
                  description: 審計上下文. 審計留痕字段，非業務參數，包含 dimension_name(維度名稱)、display_block_types(拉黑類型文案，逗號分隔)、$behavior(操作描述)
            example:
              dimension: 0
              value: '6225880000000000'
              block_type_list:
                - 1
                - 2
              remark: 涉嫌洗钱风险，加入黑名单
              operator: user@example.com
              audit_frontend_resource:
                dimension_name: 账户号
                display_block_types: 禁止交易,禁止入金
                $behavior: 新增黑名单
