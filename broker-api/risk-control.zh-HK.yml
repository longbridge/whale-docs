                - rlc
              properties:
                lc:
                  type: string
                  description: LC 參數. 用於指定「LC 參數」。此字段為必填項。
                rlc:
                  type: string
                  description: RLC 參數. 用於指定「RLC 參數」。此字段為必填項。
            example:
              lc: ''
              rlc: ''
      responses:
