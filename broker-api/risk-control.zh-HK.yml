                              description: 證券代碼（原始值）. 字段 counter_id 的原始值：counter_id 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            stock_name:
                              type: string
                              description: 證券名稱. **返回值：** 證券名稱。
                            market:
                              type: string
                              description: 市場. **返回值：** 市場。
                            im_factor:
                              type: string
                              description: 初始保證金率（%）. **返回值：** 初始保證金率（%）。
                            mm_factor:
                              type: string
                              description: 維持保證金率（%）. **返回值：** 維持保證金率（%）。
                            fm_factor:
                              type: string
                              description: 強平保證金率（%）. **返回值：** 強平保證金率（%）。
                            mcm_factor:
                              type: string
                              description: Margincall 保證金（%）. **返回值：** Margincall 保證金（%）。
                            available:
                              type: string
                              description: 融券池數量. **返回值：** 融券池數量。
                            available_val:
                              type: string
                              description: 融券池數量（原始值）. 字段 available 的原始值：available 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            fee_rate:
                              type: string
                              description: 融券利率（%）. **返回值：** 融券利率（%）。
                            short_sell_status:
                              type: string
                              description: 可賣空狀態. **返回值：** 可賣空狀態。
                            short_sell_status_val:
                              type: string
                              description: 可賣空狀態（原始值）. 字段 short_sell_status 的原始值：short_sell_status 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            auto_close_qty_display:
                              type: string
                              description: 自動關閉賣空數量. **返回值：** 自動關閉賣空數量。
                            auto_open_qty_display:
                              type: string
                              description: 自動恢復賣空數量. **返回值：** 自動恢復賣空數量。
                            latest_edit_at:
                              type: string
                              description: 更新時間. **返回值：** 更新時間；時間或日期格式以接口實際返回值為準。
                            latest_edit_by:
                              type: string
                              description: 更新人. **返回值：** 更新人。
                      total:
                        type: integer
                        description: 總條數. **返回值：** 符合查詢條件的記錄總數，用於計算分頁。
              example:
                code: 0
                message: success
                data:
                  list:
                    - counter_id: ST/US/IMA
                      counter_id_val: ''
                      stock_name: IMAGENEBIO INC.
                      market: US
                      im_factor: '80.00'
                      mm_factor: '60.00'
