openapi: 3.1.1
info:
  title: Longport Whale 券商 API
  description: 面向使用 Longport Whale 的券商提供機構級服務端 API。
  version: 2.0.0
servers:
  - url: https://b-api.longbridge.xyz
    description: 測試環境
  - url: https://b-api.lbkrs.com
    description: 生產環境
security:
  - bearerAuth: []
tags:
  - name: 風控管理
paths:
  /risk/v1/account_credits/manually_create:
    post:
      operationId: manually_create_account_credit
      summary: 人工新增授信客戶
      tags:
        - 風控管理
      x-permission-key:
        - credit_limit.credit_clients_add
      x-lbonly: false
      description: 人工為指定證券賬號新增一條授信客戶記錄，設置其授信額度。寫操作，直接產生真實授信額度變更。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - aaid
                - credit_limit
              properties:
                aaid:
                  type: string
                  description: 證券賬號
                credit_limit:
                  type: number
                  description: 授信額度
                remark:
                  type: string
                  description: 備註
            example:
              aaid: H00000000
              credit_limit: 100000
              remark: ''
      responses:
        '200':
          description: 未實調，響應字段以真實接口為準。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: 0 表示成功；非 0 為業務錯誤碼，此時 data 通常為空。HTTP 狀態碼本身恆為 200，請勿依賴 HTTP status 判斷成功/失敗。
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
      x-mint:
        href: /zh-HK/api-reference/manually_create_account_credit
        metadata:
          sidebarTitle: 人工新增授信客戶
  /risk/v1/admin_credit_adjust/apply:
    post:
      operationId: admin_credit_adjust_apply
      summary: 後台提交調整授信額度申請
      tags:
        - 風控管理
      x-permission-key:
        - lb_hk_credit_limit.client_credit_limit_apply
      x-lbonly: false
      description: 後台提交一條客戶授信額度調整申請，進入審核流程。寫操作。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - aaid
                - member_id
                - credit_currency
                - before_credit_amount
                - after_credit_amount
                - applicant
              properties:
                aaid:
                  type: string
                  description: 證券賬號
                member_id:
                  type: string
                  description: 用戶 ID
                credit_currency:
                  type: string
                  description: 授信幣種
                before_credit_amount:
                  type: string
                  description: 調整前額度
                after_credit_amount:
                  type: string
                  description: 調整後額度
                applicant:
                  type: string
                  description: 申請人
                remark:
                  type: string
                  description: 備註
            example:
              aaid: H00000000
              member_id: '1000000000000000000'
              credit_currency: HKD
              before_credit_amount: '0'
              after_credit_amount: '100000'
              applicant: user@example.com
              remark: ''
      responses:
        '200':
          description: 未實調，響應字段以真實接口為準。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: 0 表示成功；非 0 為業務錯誤碼，此時 data 通常為空。HTTP 狀態碼本身恆為 200，請勿依賴 HTTP status 判斷成功/失敗。
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
      x-mint:
        href: /zh-HK/api-reference/admin_credit_adjust_apply
        metadata:
          sidebarTitle: 後台提交調整授信額度申請
  /risk/v1/delete_canceled_account_credit:
    post:
      operationId: delete_canceled_account_credit
      summary: 刪除已取消的客戶授信額度
      tags:
        - 風控管理
      x-lbonly: false
      description: |-
        刪除已取消的客戶授信額度。

        ### 請求參數

        - 必填：`aaid_list`（證券賬號列表）、`audit_frontend_resource`（審計上下文）
        - 各字段的格式、取值範圍和業務含義見對應字段說明。

        ### 處理結果

        成功時完成上述業務操作；後續狀態和返回數據以 `200` 響應定義為準。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - aaid_list
                - audit_frontend_resource
              properties:
                aaid_list:
                  type: array
                  description: 證券賬號列表. 證券賬號列表，以 JSON 數組形式提交。此字段為必填項。
                  items:
                    type: string
                audit_frontend_resource:
                  type: object
                  description: 審計上下文. 含 $behavior/credit_amount
            example:
              aaid_list:
                - '123'
              audit_frontend_resource:
                $behavior: ''
                credit_amount: ''
      responses:
        '200':
          description: 請求處理成功。響應的 `data` 不包含額外業務字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。

                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`
                      判斷具體結果。

                      - `401`：未登錄。
                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登錄或登錄狀態已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 當前賬號未獲得該功能授權。請在 User Permission 中為該賬號開通相應權限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 請求處理超時。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
      x-mint:
        href: /zh-HK/api-reference/delete_canceled_account_credit
        metadata:
          sidebarTitle: 刪除已取消的客戶授信額度
