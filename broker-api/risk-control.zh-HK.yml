        - 必填：`dimension`（維度類型）、`value`（維度值）、`block_type_list`（拉黑類型列表）、`operator`（操作人）
        - 可選：`remark`（備註）、`audit_frontend_resource`（調用方審計信息）
        - 各欄位的格式、取值範圍和業務含義見對應欄位說明。

