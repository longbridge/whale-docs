        ### 業務說明

        `lc` 與 `rlc` 分別設定集中度風險測試的相關閾值參數，用於評估持倉集中度帶來的潛在缺口（Short Fall）。

        ### 風險提示

        此操作會創建或修改集中度風險測試任務並影響相關風控計算結果。調用前請確認參數設置合理。

        ### 處理結果

        成功時完成所述業務操作；後續狀態和返回數據以 `200` 響應定義為準。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
