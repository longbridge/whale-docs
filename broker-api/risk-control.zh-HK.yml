      x-lbonly: false
      description: |-
        查詢多頭股票融資保證金率配置，用於風控維護各證券的融資授信與保證金計算參數。

        ### 請求參數

        - 透過 `filters` 組合業務篩選條件（可選欄位見下方 filters 欄位說明），並使用 `page`、`page_size`、`orderBy` 控制分頁與排序。

        ### 業務說明

        - 每條記錄對應一隻證券，包含櫃台渠道、`證券代碼`與股票名稱、所屬市場、個股狀態，以及初始保證金、維持保證金、強平保證金、Margin Call 保證金各檔比例（百分比）與更新、創建日期。

        - 這些比例決定該證券可融資額度與強平、追保觸發線，是融資風控計算的基礎配置。

        ### 返回結果

        成功時返回匹配的記錄列表及分頁資訊。返回欄位含義見回應定義。
