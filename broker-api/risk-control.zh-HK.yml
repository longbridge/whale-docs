                              description: 截止時間. **返回值：** 截止時間；時間或日期格式以接口實際返回值為準。
                            message_status:
                              type: string
                              description: 消息狀態. **返回值：** 消息狀態。
                            message_status_val:
                              type: string
                              description: 消息狀態（原始值）. 字段 message_status 的原始值：message_status 返回的是經字典/關聯表映射解析後的可讀展示值，本字段返回映射前的原始編碼/ID。
                            counter_id:
