                          label: 美股
                        - value: /HK/
                          label: 港股
                      example: US
                    stock_status:
                      type: string
                      description: 個股狀態. 用於按「個股狀態」篩選結果。
                      enum:
                        - '0'
                        - '1'
                        - '2'
                      x-enum-details:
                        - value: '0'
                          label: 正常
                        - value: '1'
                          label: 異常
                        - value: '2'
                          label: 退市
                      example: Active
                page:
                  type: integer
                  description: 頁碼. 要查詢的頁碼，從 `1` 開始。
                page_size:
                  type: integer
                  description: 每頁數量. 每頁返回的記錄數量。
                orderBy:
                  type: array
                  description: 排序參數. 排序規則數組；每一項定義一個排序字段及排序方向。
                  items:
                    type: object
