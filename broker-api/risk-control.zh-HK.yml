        ### 業務說明

        - 數據按客戶證券賬戶逐戶彙總，涵蓋賬戶所屬櫃檯、賬戶類型、賬戶標識、客戶類型及所屬授信組。
        - 每條記錄包含授信額度、融資額度、已佔用融資額度、最大歷史佔用額度，以及授信狀態與授信、融資生效時間。
        - 常用於監控客戶的融資額度使用與授信狀態，為額度管理與風險評估提供依據。

