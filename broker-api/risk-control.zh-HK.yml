  /risk_limit/v1/global/reverse:
    post:
      operationId: global_reverse
      summary: 全局交易限額啓停
      tags:
        - 風控管理
      x-permission-key:
        - lb_hk_risk_limit_config.risk_limit_config_global_update
      x-lbonly: false
      description: |-
        啟用或停用一條全域交易限額設定，透過 `enable` 切換其生效狀態。

        ### 請求參數

        - 必填：`code`（限額設定代碼）、`enable`（是否啟用）
        - 可選：`audit_frontend_resource`（調用方審計上下文）
        - 各欄位的格式、取值範圍和業務含義見對應欄位說明。

        ### 業務說明

        全域限額作用於全體交易，啟停會立即改變其對後續交易的約束效果。此接口只切換生效狀態，不修改限額閾值。

        ### 風險提示

        此操作會更改全域交易限額的實際生效狀態，影響範圍為全體交易，風險極高。調用前請再次確認目標 `code` 與 `enable` 取值。

        ### 處理結果

        成功時完成全域限額的啟停；後續狀態和返回數據以 `200` 響應定義為準。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
                - enable
              properties:
                code:
                  type: string
                  description: 限額配置代碼. 取自當前操作行 record.code，標識具體是哪條全侷限額配置。
                enable:
                  type: boolean
                  description: 是否啓用. true=啓用，false=停用；點擊「啓用」操作項時傳 !（此時通常為 true），點擊「停用」時傳相反值（此時通常為 false）。
                  enum:
                    - 'true'
                    - 'false'
                  x-enum-details:
                    - value: 'true'
                      label: 啓用
                    - value: 'false'
                      label: 停用
                  example: 'true'
                audit_frontend_resource:
                  type: object
                  description: '審計上下文. 非業務參數，僅供後端審計記錄使用。$action: ''add''(啓用)|''delete''(停用)；$behavior: 審計行為描述文案。'
            example:
              code: GLOBAL_MAX_ORDER_QTY
              enable: true
              audit_frontend_resource:
                $action: add
                $behavior: 启用全局限额
      responses:
