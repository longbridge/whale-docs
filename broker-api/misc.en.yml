openapi: 3.1.1
info:
  title: Longport Whale Broker API
  description: Institution-grade server-to-server API for brokers running on Longport Whale.
  version: 2.0.0
servers:
  - url: https://b-api.longbridge.xyz
    description: Test
  - url: https://b-api.lbkrs.com
    description: Production
tags:
  - name: Account Assets
  - name: Cash Management
  - name: Stock Management
  - name: IPO System
  - name: Fund Management
  - name: VA Clearing Management
  - name: Day-End Settlement
  - name: Corporate Action
  - name: Risk Control Compliance
  - name: Reports
  - name: Broker Management
  - name: Accounting
  - name: Trading Panel
  - name: Announcement
  - name: Service Parameter
  - name: Suspicious Incident Monitoring
  - name: Campaigns
  - name: Reward Center
  - name: Misc
paths:
  /v1/whaleapi/upload_url:
    get:
      operationId: get_open_upload_url
      summary: Get File Upload URL
      tags:
        - Misc
      x-permission-key:
        - wms.file_update
      x-lbonly: false
      x-source: WhaleAPI
      parameters:
        - name: module
          in: query
          required: true
          schema:
            type: string
          description: upload biz module
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    description: url to upload file. url to upload file
                  key:
                    type: string
                    description: file key. file key
              example:
                url: https://xxx.s3.ap-east-1.amazonaws.com/hkcnhkuat/2j5kdS1wx7AI6T5XnaRBof5mkNA?X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Credential=AKIA43WDUGYWE42VSCWI%2F20240711%2Fap-east-1%2Fs3%2Faws4_request&X-Amz-Date=20240711T075332Z&X-Amz-Expires=900&X-Amz-SignedHeaders=host&X-Amz-Signature=fc4bc1022177a509db94acac50bfa641dec9384cfbe70d6457ce640fa0d4d805
                key: hkcnhkuat/2j5kdS1wx7AI6T5XnaRBof5mkNA
          description: Success
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
          description: Bad request. Check the business error code in `code` and the error details in `message`.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
          description: The user is not authenticated, or the login session has expired.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
          description: The current account is not authorized to use this feature. Grant the required permission to the account in User Permission.
        '408':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
          description: The request timed out. Check the business error code in `code` and the error details in `message`.
      description: |-
        Obtains a temporary S3 remote upload URL for uploading a file directly to object storage.

        ### Request parameters

        - This endpoint has no required parameters; see the field descriptions below for optional ones.
        - Use `module` to indicate the module the file belongs to so it can be stored by business category.

        ### Business notes

        The returned upload URL is a temporary, time-limited credential; the upload must complete before it expires.

        ### Returns

        On success, returns a temporary URL that can be used to upload the file directly. See the response definition below for field meanings.
      x-mint:
        href: /en/api-reference/get_open_upload_url
        metadata:
          sidebarTitle: Get File Upload URL
  /v1/whaleapi/search/stock:
    post:
      operationId: search_stock
      summary: Search Stock
      tags:
        - Misc
      x-permission-key:
        - admin.general_whale_api
      x-lbonly: false
      x-source: WhaleAPI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                keyword:
                  type: string
                  description: keyword
              required:
                - keyword
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      `0` indicates success. A non-zero value is a business error code, in which case
                      `data` is usually empty.

                      HTTP status codes use their standard semantics. A successful request normally
                      returns `200`; errors may return `400`, `401`, `403`, `408`, or another applicable
                      status. Interpret the HTTP status together with the business `code`.

                      - `401`: The user is not authenticated.
                      - `403`: The current account is not authorized to use this function. Grant access
                        through User Permission.. Options: `0` = Success
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      stock_list:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                              description: Stock Name. Stock Name
                            symbol:
                              type: string
                              description: 'Stock Symbol eg: BABA.US. Stock Symbol eg: BABA.US'
                            market:
                              type: string
                              description: 'Stock Market eg: US. Stock Market eg: US'
                            product:
                              type: string
                              description: Stock product, for example `ST` or `ETF`
                            code:
                              type: string
                              description: 'Sotck Code eg: BABA. Sotck Code eg: BABA'
                            name_cn:
                              type: string
                              description: Stock Chinese Name. Stock Chinese Name
                            name_en:
                              type: string
                              description: Stock English Name. Stock English Name
                          required:
                            - name
                            - symbol
                            - market
                            - product
                            - code
                            - name_cn
                            - name_en
                        description: stock_list
                    required:
                      - stock_list
          description: Successful response
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
          description: Bad request. Check the business error code in `code` and the error details in `message`.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
          description: The user is not authenticated, or the login session has expired.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
          description: The current account is not authorized to use this feature. Grant the required permission to the account in User Permission.
        '408':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
          description: The request timed out. Check the business error code in `code` and the error details in `message`.
      description: |-
        Searches for securities by keyword and returns the matching securities.

        ### Request parameters

        - Required: `keyword` (keyword)
        - The keyword may be a security symbol, name, or a fragment of either; matching is determined by the server.

        ### Returns

        On success, returns the list of securities matching the keyword. See the response definition below for field meanings.
      x-mint:
        href: /en/api-reference/search_stock
        metadata:
          sidebarTitle: Search Stock
  /v1/datasets/refs/bank_country_code:
    get:
      operationId: ref_bank_country_code
      summary: Bank / Country Code Data Dictionary
      tags:
        - Misc
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      `0` indicates success. A non-zero value is a business error code, in which case
                      `data` is usually empty.

                      HTTP status codes use their standard semantics. A successful request normally
                      returns `200`; errors may return `400`, `401`, `403`, `408`, or another applicable
                      status. Interpret the HTTP status together with the business `code`.

                      - `401`: The user is not authenticated.
                      - `403`: The current account is not authorized to use this function. Grant access
                        through User Permission.. Options: `0` = Success
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      values:
                        type: array
                        items:
                          type: object
                          properties:
                            key:
                              type: string
                              description: Key. **Returned value:** Dictionary key to send to related APIs; do not send the display text.
                            value:
                              type: string
                              description: Value. **Returned value:** Display text for the dictionary entry.
                            desc:
                              type: string
                              description: Description. Usually empty.
                            color:
                              type: string
                              description: Color. **Returned value:** Color.
                            pkey:
                              type: string
                              description: Parent Key. Usually empty.
                        description: Dictionary Entries. **Returned value:** List of dictionary entries.
                      message:
                        type: string
                        description: Usually empty. This field is independent of the outer `message` field.
              example:
                code: 0
                message: success
                data:
                  values:
                    - key: '1'
                      value: Normal
                      desc: ''
                      color: ''
                      pkey: ''
                  message: ''
          description: On success, returns the Bank / Country Code data-dictionary entries. Each entry contains a `key` for requests and a display `value`.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
          description: Bad request. Check the business error code in `code` and the error details in `message`.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
