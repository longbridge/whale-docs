        - See each field's own documentation for format and business meaning.

        ### Business notes

        - `id` must be the `data.file_download_id` returned by the asynchronous export.
        - This operation clears an export task record; confirm the record is no longer needed before calling.
        - The endpoint is currently marked `inferred`; verify the route is available in the target environment before use.

        ### Risk warning

        This permanently deletes the corresponding export record and cannot be undone. Confirm the target record before calling.

        ### Result

