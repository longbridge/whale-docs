        ### Business notes

        This is a shared endpoint of the common ticket-approval system. It only updates the business data attached to the ticket and does not change the ticket's approval workflow state.

        ### Risk warning

        This modifies the ticket's attached business data, which may affect the basis for subsequent approval and the final applied result. Confirm the target ticket and `payload` content before calling.

        ### Result

        On success, the ticket's business data is updated; the resulting state and returned data follow the `200` response definition.
