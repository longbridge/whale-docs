openapi: 3.1.1
info:
  title: Longport Whale Broker API
  description: Institution-grade server-to-server API for brokers running on Longport Whale.
  version: 2.0.0
servers:
  - url: https://b-api.longbridge.xyz
    description: Test
  - url: https://b-api.lbkrs.com
    description: Production
tags:
  - name: Account Assets
  - name: Cash Management
  - name: Stock Management
  - name: IPO System
  - name: Fund Management
  - name: VA Clearing Management
  - name: Day-End Settlement
  - name: Corporate Action
  - name: Risk Control Compliance
  - name: Reports
  - name: Broker Management
  - name: Accounting
  - name: Trading Panel
  - name: Announcement
  - name: Service Parameter
  - name: Suspicious Incident Monitoring
  - name: Campaigns
  - name: Reward Center
  - name: Misc
paths:
  /v1/whaleapi/upload_url:
    get:
      operationId: get_open_upload_url
      summary: Get File Upload URL
      tags:
        - Misc
      x-permission-key:
        - admin.general_whale_api
      x-lbonly: false
      x-source: WhaleAPI
      parameters:
        - name: module
          in: query
          required: true
          schema:
            type: string
          description: upload biz module
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    description: url to upload file. url to upload file
                  key:
                    type: string
                    description: file key. file key
              example:
                url: https://xxx.s3.ap-east-1.amazonaws.com/hkcnhkuat/2j5kdS1wx7AI6T5XnaRBof5mkNA?X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Credential=AKIA43WDUGYWE42VSCWI%2F20240711%2Fap-east-1%2Fs3%2Faws4_request&X-Amz-Date=20240711T075332Z&X-Amz-Expires=900&X-Amz-SignedHeaders=host&X-Amz-Signature=fc4bc1022177a509db94acac50bfa641dec9384cfbe70d6457ce640fa0d4d805
                key: hkcnhkuat/2j5kdS1wx7AI6T5XnaRBof5mkNA
          description: Success
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
          description: Bad request. Check the business error code in `code` and the error details in `message`.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
          description: The user is not authenticated, or the login session has expired.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
          description: The current account is not authorized to use this feature. Grant the required permission to the account in User Permission.
        "408":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
          description: The request timed out. Check the business error code in `code` and the error details in `message`.
      description: Returns a temporary S3 remote upload URL for uploading a file directly to S3.
      x-mint:
        href: /en/api-reference/get_open_upload_url
        metadata:
          sidebarTitle: Get File Upload URL
  /v1/whaleapi/search/stock:
    post:
      operationId: search_stock
      summary: Search Stock
      tags:
        - Misc
      x-permission-key:
        - admin.general_whale_api
      x-lbonly: false
      x-source: WhaleAPI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                keyword:
                  type: string
                  description: keyword
              required:
                - keyword
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      `0` indicates success. A non-zero value is a business error code, in which case
                      `data` is usually empty.

                      HTTP status codes use their standard semantics. A successful request normally
                      returns `200`; errors may return `400`, `401`, `403`, `408`, or another applicable
                      status. Interpret the HTTP status together with the business `code`.

                      - `401`: The user is not authenticated.
                      - `403`: The current account is not authorized to use this function. Grant access
                        through User Permission.. Options: `0` = Success
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      stock_list:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                              description: Stock Name. Stock Name
                            symbol:
                              type: string
                              description: "Stock Symbol eg: BABA.US. Stock Symbol eg: BABA.US"
                            market:
                              type: string
                              description: "Stock Market eg: US. Stock Market eg: US"
                            product:
                              type: string
                              description: "Stock product, for example `ST` or `ETF`"
                            code:
                              type: string
                              description: "Sotck Code eg: BABA. Sotck Code eg: BABA"
                            name_cn:
                              type: string
                              description: Stock Chinese Name. Stock Chinese Name
                            name_en:
                              type: string
                              description: Stock English Name. Stock English Name
                          required:
                            - name
                            - symbol
                            - market
                            - product
                            - code
                            - name_cn
                            - name_en
                        description: stock_list
                    required:
                      - stock_list
              example:
                code: 0
                message: success
                data:
                  stock_list:
                    - name: string
                      symbol: string
                      market: string
                      product: string
                      code: string
                      name_cn: string
                      name_en: string
          description: Fields are taken from the real responses definition for this operation in the published Whale OpenAPI spec (whale-openapi/Whale-openapi.json).
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
          description: Bad request. Check the business error code in `code` and the error details in `message`.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
          description: The user is not authenticated, or the login session has expired.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
          description: The current account is not authorized to use this feature. Grant the required permission to the account in User Permission.
        "408":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
          description: The request timed out. Check the business error code in `code` and the error details in `message`.
      description: Search Stock
      x-mint:
        href: /en/api-reference/search_stock
        metadata:
          sidebarTitle: Search Stock
