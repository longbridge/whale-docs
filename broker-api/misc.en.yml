      description: Error response returned by Broker API Gateway. `code` is the business error code, `message` contains the error details, and `data` is usually empty.
      required:
        - code
        - message
        - data
      properties:
        code:
          type: integer
        message:
          type: string
        data: {}
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "ACCESS_TOKEN issued to the broker, sent as `Authorization: Bearer <token>`."
security:
  - bearerAuth: []
