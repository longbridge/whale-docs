  /admin-api/v2/tickets/{id}:
    post:
      operationId: handle_ticket
      summary: Handle Ticket
      x-verified: verified
      tags:
        - Misc
      x-lbonly: false
      description: |-
        Performs approval-related operations on a ticket. This is the currently active core entry point of the common ticket-approval system (it supersedes the deprecated `PUT /admin-api/flow_ticket_steps/{stepId}`). The `action` field selects the operation, supporting approve, reject, comment, transfer, CC, add-signer, close, and rollback.

        ### Request parameters

        - Required: `id` (ticket ID) and `action` (the operation).
        - Optional: `comment`, `user_ids`, `role_ids`, `payload` (business data), and `data` (extension data).
        - Different actions need different optional fields — for example transfer/CC/add-signer require `user_ids` or `role_ids`. See each field's own documentation for format, accepted values, and business meaning.

        ### Business notes

        This is a shared endpoint of the common ticket-approval system. Actions such as approve, reject, and rollback advance the ticket's workflow and may trigger downstream real business actions.

        ### Risk warning

        This changes the ticket's approval state or workflow direction, and some actions may trigger real fund, position, or configuration changes. Confirm the target ticket, the action, and the related parameters before calling.

        ### Result

        On success, the corresponding approval action is completed; the resulting state and returned data follow the `200` response definition.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Path parameter.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
              properties:
                action:
                  type: string
                  description: Type of operation to perform for this request. This field is required.
                  enum:
                    - approve
                    - reject
                    - close
                    - comment
                    - transfer
                    - cc
                    - sign
                    - rollback
                  x-enum-details:
                    - value: approve
                      label: Approve
                    - value: reject
                      label: Reject
                    - value: close
                      label: Close
                    - value: comment
                      label: Comment
                    - value: transfer
                      label: Assign To
                    - value: cc
                      label: CC
                    - value: sign
                      label: Add Approver
                    - value: rollback
                      label: Rollback
                  example: approve
                comment:
                  type: string
                  description: Optional depending on action.
                user_ids:
                  type: array
                  description: Optionally filled based on action, e.g. forward / CC / countersign.
                  items:
                    type: string
                role_ids:
                  type: array
                  description: Optional depending on action.
                  items:
                    type: string
                payload:
                  type: object
                  description: Specifies Payload.
                data:
                  type: object
                  description: Specifies Data.
            example:
              action: approve
              comment: 同意
      responses:
        '200':
          description: The request was processed successfully. The response `data` does not contain additional business fields.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
