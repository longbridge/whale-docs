      description: |-
        Returns the processing status and file download URL of an asynchronous dataset export task.

        ### Request parameters

        - Required: `id` (the export task ID, i.e. the `data.file_download_id` returned by the asynchronous export).
        - See each field's own documentation for format and business meaning.

        ### Business notes

        Typical flow:

        1. Call `POST /v1/datasets/{template_id}/download` with `mode: 1` to start an asynchronous export.
        2. Take the task ID from `data.file_download_id` in the response.
        3. Pass that ID as this endpoint's `id` and poll the task status; once complete, read the returned download URL.

        ### Returns

        On success, returns the task's processing status; when the task is complete, the response includes the file download URL. See the response definition below for field meanings.
