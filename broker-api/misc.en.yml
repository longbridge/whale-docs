components:
  schemas:
    BrokerGatewayErrorEnvelope:
      type: object
      description: Error response returned by Broker API Gateway. `code` is the business error code, `message` contains the error details, and `data` is usually empty.
      required:
        - code
        - message
        - data
      properties:
        code:
          type: integer
          description: '`0` indicates success. Any non-zero value is a business error code (`data` is then usually empty). Common codes are listed below; a given endpoint may return a subset. Interpret together with the HTTP status.'
          enum:
            - 0
            - 401010
            - 403000
            - 3001001
            - 3001004
            - 3001006
            - 408
            - 404000
          x-enum-details:
            - value: 0
              label: Success
            - value: 401010
              label: Invalid or expired token
            - value: 403000
              label: Not authorized (see message for the specific permission)
            - value: 3001001
              label: Service busy, retry later
            - value: 3001004
              label: Filter/query format not recognized
            - value: 3001006
              label: Missing required parameter (name in message)
            - value: 408
              label: Request timeout
            - value: 404000
              label: Route not found
        message:
          type: string
        data: {}
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'ACCESS_TOKEN issued to the broker, sent as `Authorization: Bearer <token>`.'
security:
  - bearerAuth: []
