        '408':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
          description: The request timed out. Check the business error code in `code` and the error details in `message`.
      description: |-
        Returns the currently available data dictionary for bank / country codes, used to populate the candidate values of related business parameters.

        ### Returns

        On success, returns the list of dictionary entries. Read entries from `data.values`: use each entry's `key` when calling other endpoints, while `value` is for display. Candidate values may change with business configuration, so do not hard-code them on the client.
      x-mint:
        href: /en/api-reference/ref_bank_country_code
        metadata:
          sidebarTitle: Bank / Country Code Data Dictionary
