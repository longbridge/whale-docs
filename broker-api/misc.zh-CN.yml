          description: 请求处理超时。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`
      description: |-
        查询「银行/国家码」当前可用的数据字典。

        ### 取值方式

        从 `data.values` 读取字典项：请求参数通常使用条目的 `key`，`value` 用于展示。候选值可能随业务配置变化，请勿在客户端写死
