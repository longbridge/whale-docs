openapi: 3.1.1
info:
  title: Longport Whale 券商 API
  description: 面向使用 Longport Whale 的券商提供机构级服务端 API。
  version: 2.0.0
servers:
  - url: https://b-api.longbridge.xyz
    description: 测试环境
  - url: https://b-api.lbkrs.com
    description: 生产环境
tags:
  - name: 资产账户
  - name: 款项管理
  - name: 证券管理
  - name: 新股认购
  - name: 基金管理
  - name: 虚拟资产管理
  - name: 清算管理
  - name: 公司行动
  - name: 风控管理
  - name: 报表管理
  - name: 经纪人管理
  - name: 会计中台
  - name: 交易面板
  - name: 公告管理
  - name: 业务参数设置
  - name: 可疑事件监控
  - name: 活动
  - name: 奖励中心
  - name: 其他
paths:
  /v1/whaleapi/upload_url:
    get:
      operationId: get_open_upload_url
      summary: 获取文件上传链接
      tags:
        - 其他
      x-permission-key:
        - admin.general_whale_api
      x-lbonly: false
      x-source: WhaleAPI
      parameters:
        - name: module
          in: query
          required: true
          schema:
            type: string
          description: 模块名
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    description: 上传链接。上传链接
                  key:
                    type: string
                    description: 文件唯一标示。文件唯一标示
              example:
                url: https://xxx.s3.ap-east-1.amazonaws.com/hkcnhkuat/2j5kdS1wx7AI6T5XnaRBof5mkNA?X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Credential=AKIA43WDUGYWE42VSCWI%2F20240711%2Fap-east-1%2Fs3%2Faws4_request&X-Amz-Date=20240711T075332Z&X-Amz-Expires=900&X-Amz-SignedHeaders=host&X-Amz-Signature=fc4bc1022177a509db94acac50bfa641dec9384cfbe70d6457ce640fa0d4d805
                key: hkcnhkuat/2j5kdS1wx7AI6T5XnaRBof5mkNA
          description: 成功（该接口响应信封顶层字段为 ['url', 'key']，与仓库其余 admin 接口惯用的 {code, message, data} 略有差异，以此处实际字段为准。）
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
          description: 未登录或登录状态已失效
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
          description: 当前账号未获得该功能授权。请在 User Permission 中为该账号开通相应权限
        "408":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
          description: 请求处理超时。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`
      description: 返回一个临时的 S3 Remote Upload URL，用于将文件直接上传到 S3。
      x-mint:
        href: /zh-CN/api-reference/get_open_upload_url
        metadata:
          sidebarTitle: 获取文件上传链接
  /v1/whaleapi/search/stock:
    post:
      operationId: search_stock
      summary: 搜索证券
      tags:
        - 其他
      x-permission-key:
        - admin.general_whale_api
      x-lbonly: false
      x-source: WhaleAPI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                keyword:
                  type: string
                  description: 关键词
              required:
                - keyword
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。

                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`
                      判断具体结果。

                      - `401`：未登录。
                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。选项: `0` = 成功
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      stock_list:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                              description: 股票的名字。股票的名字
                            symbol:
                              type: string
                              description: 股票的 Symbol 如 BABA.US。股票的 Symbol 如 BABA.US
                            market:
                              type: string
                              description: 股票的市场 如 US。股票的市场 如 US
                            product:
                              type: string
                              description: 股票的类型 如 ST、ETF。股票的类型 如 ST、ETF
                            code:
                              type: string
                              description: 股票的 Code 如 BABA。股票的 Code 如 BABA
                            name_cn:
                              type: string
                              description: 股票的中文名。股票的中文名
                            name_en:
                              type: string
                              description: 股票的英文名。股票的英文名
                          required:
                            - name
                            - symbol
                            - market
                            - product
                            - code
                            - name_cn
                            - name_en
                        description: 证券列表
                    required:
                      - stock_list
              example:
                code: 0
                message: success
                data:
                  stock_list:
                    - name: string
                      symbol: string
                      market: string
                      product: string
                      code: string
                      name_cn: string
                      name_en: string
          description: 字段来自 Whale OpenAPI 已发布规范（whale-openapi/Whale-openapi.json）中该接口的真实 responses 定义
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
          description: 未登录或登录状态已失效
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
          description: 当前账号未获得该功能授权。请在 User Permission 中为该账号开通相应权限
        "408":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
          description: 请求处理超时。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`
      description: 搜索证券
      x-mint:
        href: /zh-CN/api-reference/search_stock
        metadata:
          sidebarTitle: 搜索证券
