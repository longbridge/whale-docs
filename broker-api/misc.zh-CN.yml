                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      values:
                        type: array
                        items:
                          type: object
                          properties:
                            key:
                              type: string
                              description: 字典键。**返回值：** 数据字典键。调用相关接口时应传递此值，不要使用展示文本
                            value:
                              type: string
                              description: 字典展示值。**返回值：** 数据字典项的展示文本
                            desc:
                              type: string
                              description: 说明。通常为空字符串
                            color:
                              type: string
                              description: 展示颜色。**返回值：** 展示颜色
                            pkey:
                              type: string
                              description: 上级级联键。通常为空字符串
                        description: 数据字典项列表。**返回值：** 数据字典项列表列表
                      message:
                        type: string
                        description: 通常为空字符串，和外层 message 是两个独立字段
              example:
                code: 0
                message: success
                data:
                  values:
                    - key: "1"
                      value: 示例值 Example
                      desc: ""
                      color: ""
                      pkey: ""
                  message: ""
          description: 成功时返回「银行/国家码」数据字典项列表。每个条目包含用于提交的 `key` 和用于展示的 `value`
