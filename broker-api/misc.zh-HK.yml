openapi: 3.1.1
info:
  title: Longport Whale 券商 API
  description: 面向使用 Longport Whale 的券商提供機構級服務端 API。
  version: 2.0.0
servers:
  - url: https://b-api.longbridge.xyz
    description: 測試環境
  - url: https://b-api.lbkrs.com
    description: 生產環境
tags:
  - name: 資產賬户
  - name: 款項管理
  - name: 證券管理
  - name: 新股認購
  - name: 基金管理
  - name: 虛擬資產管理
  - name: 清算管理
  - name: 公司行動
  - name: 風控管理
  - name: 報表管理
  - name: 經紀人管理
  - name: 會計中台
  - name: 交易面板
  - name: 公告管理
  - name: 業務參數設置
  - name: 可疑事件監控
  - name: 活動
  - name: 獎勵中心
  - name: 其他
paths:
  /v1/whaleapi/upload_url:
    get:
      operationId: get_open_upload_url
      summary: 獲取文件上傳連結
      tags:
        - 其他
      x-permission-key:
        - admin.general_whale_api
      x-lbonly: false
      x-source: WhaleAPI
      parameters:
        - name: module
          in: query
          required: true
          schema:
            type: string
          description: 模塊名
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    description: 上傳鏈接。上傳鏈接
                  key:
                    type: string
                    description: 文件唯一標示。文件唯一標示
              example:
                url: https://xxx.s3.ap-east-1.amazonaws.com/hkcnhkuat/2j5kdS1wx7AI6T5XnaRBof5mkNA?X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Credential=AKIA43WDUGYWE42VSCWI%2F20240711%2Fap-east-1%2Fs3%2Faws4_request&X-Amz-Date=20240711T075332Z&X-Amz-Expires=900&X-Amz-SignedHeaders=host&X-Amz-Signature=fc4bc1022177a509db94acac50bfa641dec9384cfbe70d6457ce640fa0d4d805
                key: hkcnhkuat/2j5kdS1wx7AI6T5XnaRBof5mkNA
          description: 成功（該接口響應信封頂層字段為 ['url', 'key']，與倉庫其餘 admin 接口慣用的 {code, message, data} 略有差異，以此處實際字段為準。）
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
          description: 未登錄或登錄狀態已失效
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
          description: 當前賬號未獲得該功能授權。請在 User Permission 中為該賬號開通相應權限
        "408":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
          description: 請求處理超時。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`
      description: 返回一個臨時的 S3 Remote Upload URL，用於將文件直接上傳到 S3。
      x-mint:
        href: /zh-HK/api-reference/get_open_upload_url
        metadata:
          sidebarTitle: 獲取文件上傳連結
  /v1/whaleapi/search/stock:
    post:
      operationId: search_stock
      summary: 搜索證券
      tags:
        - 其他
      x-permission-key:
        - admin.general_whale_api
      x-lbonly: false
      x-source: WhaleAPI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                keyword:
                  type: string
                  description: 關鍵詞
              required:
                - keyword
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。

                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`
                      判斷具體結果。

                      - `401`：未登錄。
                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。選項: `0` = 成功
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      stock_list:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                              description: 股票的名字。股票的名字
                            symbol:
                              type: string
                              description: 股票的 Symbol 如 BABA.US。股票的 Symbol 如 BABA.US
                            market:
                              type: string
                              description: 股票的市場 如 US。股票的市場 如 US
                            product:
                              type: string
                              description: 股票的類型 如 ST、ETF。股票的類型 如 ST、ETF
                            code:
                              type: string
                              description: 股票的 Code 如 BABA。股票的 Code 如 BABA
                            name_cn:
                              type: string
                              description: 股票的中文名。股票的中文名
                            name_en:
                              type: string
                              description: 股票的英文名。股票的英文名
                          required:
                            - name
                            - symbol
                            - market
                            - product
                            - code
                            - name_cn
                            - name_en
                        description: 證券列表
                    required:
                      - stock_list
              example:
                code: 0
                message: success
                data:
                  stock_list:
                    - name: string
                      symbol: string
                      market: string
                      product: string
                      code: string
                      name_cn: string
                      name_en: string
          description: 字段來自 Whale OpenAPI 已發佈規範（whale-openapi/Whale-openapi.json）中該接口的真實 responses 定義
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
          description: 未登錄或登錄狀態已失效
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
          description: 當前賬號未獲得該功能授權。請在 User Permission 中為該賬號開通相應權限
        "408":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
          description: 請求處理超時。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`
      description: 搜索證券
      x-mint:
        href: /zh-HK/api-reference/search_stock
        metadata:
          sidebarTitle: 搜索證券
  /v1/datasets/refs/bank_country_code:
    get:
      operationId: ref_bank_country_code
      summary: 銀行/國家碼 數據字典
      tags:
        - 其他
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。

                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`
                      判斷具體結果。

                      - `401`：未登錄。
                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。選項: `0` = 成功
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      values:
                        type: array
                        items:
                          type: object
                          properties:
                            key:
                              type: string
                              description: 字典鍵。**返回值：** 數據字典鍵。調用相關接口時應傳遞此值，不要使用展示文本
                            value:
                              type: string
                              description: 字典展示值。**返回值：** 數據字典項的展示文本
                            desc:
                              type: string
                              description: 説明。通常為空字符串
                            color:
                              type: string
                              description: 展示顏色。**返回值：** 展示顏色
                            pkey:
                              type: string
                              description: 上級級聯鍵。通常為空字符串
                        description: 數據字典項列表。**返回值：** 數據字典項列表列表
                      message:
                        type: string
                        description: 通常為空字符串，和外層 message 是兩個獨立字段
              example:
                code: 0
                message: success
                data:
                  values:
                    - key: "1"
                      value: 示例值 Example
                      desc: ""
                      color: ""
                      pkey: ""
                  message: ""
          description: 成功時返回「銀行/國家碼」數據字典項列表。每個條目包含用於提交的 `key` 和用於展示的 `value`
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
          description: 請求無效。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
          description: 未登錄或登錄狀態已失效
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
          description: 當前賬號未獲得該功能授權。請在 User Permission 中為該賬號開通相應權限
        "408":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
          description: 請求處理超時。具體原因請查看響應體中的業務錯誤碼 `code` 和錯誤信息 `message`
      description: |-
        查詢「銀行/國家碼」當前可用的數據字典。

        ### 取值方式

        從 `data.values` 讀取字典項：請求參數通常使用條目的 `key`，`value` 用於展示。候選值可能隨業務配置變化，請勿在客戶端寫死
      x-mint:
        href: /zh-HK/api-reference/ref_bank_country_code
        metadata:
          sidebarTitle: 銀行/國家碼 數據字典
