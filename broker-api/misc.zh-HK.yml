          x-description-hk: 成功時分頁返回「通用獲取文件下載信息」記錄，以及頁碼、每頁數量和總記錄數等分頁信息。
          x-description-en: On success, returns paginated Get Dataset Download Info records together with pagination metadata such as the page number, page size, and total record count.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 為業務錯誤碼，此時 `data` 通常為空。

                      HTTP status 使用標準語義：成功時通常為 `200`，異常時可能為 `400`、`401`、`403`、`408` 等，需結合業務 `code`
                      判斷具體結果。

                      - `401`：未登錄。
                      - `403`：當前賬號未獲得該功能授權，需通過 User Permission 授權。
                    x-description-hk: |-
