  /v1/datasets/download/{id}:
    get:
      operationId: get_dataset_download
      summary: 通用獲取文件下載信息
      x-summary-hk: 通用獲取文件下載信息
      x-summary-en: Get Dataset Download Info
      tags:
        - 其他
      x-lbonly: false
      description: |-
        查詢異步數據集導出任務的處理狀態和文件下載地址。

        ### 調用方式

        1. 調用 `POST /v1/datasets/{template_id}/download`，並設置 `mode: 1`。
        2. 從響應的 `data.file_download_id` 取得任務編號。
        3. 將該編號作為本接口的 `id`，輪詢任務狀態；任務完成後讀取返回的下載地址。
      x-description-hk: |-
        查詢異步數據集導出任務的處理狀態和文件下載地址。

        ### 調用方式

        1. 調用 `POST /v1/datasets/{template_id}/download`，並設置 `mode: 1`。
        2. 從響應的 `data.file_download_id` 取得任務編號。
        3. 將該編號作為本接口的 `id`，輪詢任務狀態；任務完成後讀取返回的下載地址。
      x-description-en: |-
        Retrieves the processing status and download URL for an asynchronous dataset export.

        ### Workflow

        1. Call `POST /v1/datasets/{template_id}/download` with `mode: 1`.
        2. Read the task identifier from `data.file_download_id` in the response.
        3. Pass that identifier as `id` to poll the export. Read the download URL after the task completes.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: "異步導出任務編號，即 `POST /v1/datasets/{template_id}/download` 在 `mode: 1` 時返回的 `data.file_download_id`。"
          x-description-hk: "異步導出任務編號，即 `POST /v1/datasets/{template_id}/download` 在 `mode: 1` 時返回的 `data.file_download_id`。"
