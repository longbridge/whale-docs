openapi: 3.1.1
info:
  title: Longport Whale 券商 API
  description: 面向使用 Longport Whale 的券商提供机构级服务端 API。
  version: 2.0.0
servers:
  - url: https://b-api.longbridge.xyz
    description: 测试环境
  - url: https://b-api.lbkrs.com
    description: 生产环境
tags:
  - name: 资产账户
  - name: 款项管理
  - name: 证券管理
  - name: 新股认购
  - name: 基金管理
  - name: 虚拟资产管理
  - name: 清算管理
  - name: 公司行动
  - name: 风控管理
  - name: 报表管理
  - name: 经纪人管理
  - name: 会计中台
  - name: 交易面板
  - name: 公告管理
  - name: 业务参数设置
  - name: 可疑事件监控
  - name: 活动
  - name: 奖励中心
  - name: 其他
paths:
  /v1/whaleapi/fee/estimate:
    post:
      operationId: open_api_fee_estimate
      summary: 费用预估
      tags:
        - 业务参数设置
      x-permission-key:
        - admin.general_whale_api
      x-lbonly: false
      x-source: WhaleAPI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                symbol:
                  type: string
                  description: 股票代码，使用 ticker.region 格式。股票代码，使用 ticker.region 格式
                side:
                  type: object
                  properties: {}
                  description: 买卖方向：买入或卖出。买卖方向：买入或卖出
                price:
                  type: string
                  description: 价格。价格
                quantity:
                  type: string
                  description: 数量。数量
                currency:
                  type: string
                  description: "价格的币种: USD, HKD。价格的币种: USD, HKD"
                account_no:
                  type: string
                  description: 账户信息。账户信息
              required:
                - symbol
                - price
                - quantity
                - currency
                - account_no
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。

                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`
                      判断具体结果。

                      - `401`：未登录。
                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。选项: `0` = 成功
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      total_amount:
                        type: string
                        description: 总金额。总金额
                      bills:
                        type: array
                        items:
                          type: object
                          properties:
                            code:
                              type: string
                              description: 费用代码。费用代码
                            name:
                              type: string
                              description: 费用名称。费用名称
                            amount:
                              type: string
                              description: 手续费金额。手续费金额
                            dep_code:
                              type: string
                              description: 关联费用代码。关联费用代码
                        description: 详情。详情
                    required:
                      - total_amount
                      - bills
              example:
                code: 0
                message: success
                data:
                  total_amount: string
                  bills:
                    - code: string
                      name: string
                      amount: string
                      dep_code: string
          description: 字段来自 Whale OpenAPI 已发布规范（whale-openapi/Whale-openapi.json）中该接口的真实 responses 定义
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
          description: 未登录或登录状态已失效
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
          description: 当前账号未获得该功能授权。请在 User Permission 中为该账号开通相应权限
        "408":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
          description: 请求处理超时。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`
      description: 该接口用于对指定证券账号的交易订单进行费用预估。通过传入股票代码 symbol、买卖方向 side、价格 price、数量 quantity、币种 currency 及账号 account_no，返回该笔交易的预估总费用 total_amount 及各费用项明细列表 bills，帮助用户在下单前了解交易成本构成
      x-mint:
        href: /zh-CN/api-reference/open_api_fee_estimate
        metadata:
          sidebarTitle: 费用预估
  /v1/whaleapi/account/trade/auth_pwd:
    post:
      operationId: account_auth
      summary: 交易密码校验
      tags:
        - 交易面板
      x-permission-key:
        - admin.general_whale_api
      x-lbonly: false
      x-source: WhaleAPI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: {}
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。

                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`
                      判断具体结果。

                      - `401`：未登录。
                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。选项: `0` = 成功
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      account:
                        type: object
                        properties:
                          aaid:
                            type: string
                            description: 资产账户唯一标识 (資產賬戶唯一標識)。资产账户唯一标识 (資產賬戶唯一標識)
                          member_id:
                            type: string
                            description: 用户账号 (用戶賬號)。用户账号 (用戶賬號)
                        required:
                          - aaid
                          - member_id
                        description: 账户信息 (賬戶信息)。账户信息 (賬戶信息)
                    required:
                      - account
                    description: 数据 (數據)
              example:
                code: 0
                message: success
                data:
                  account:
                    aaid: string
                    member_id: string
          description: 字段来自 Whale OpenAPI 已发布规范（whale-openapi/Whale-openapi.json）中该接口的真实 responses 定义
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
          description: 未登录或登录状态已失效
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
          description: 当前账号未获得该功能授权。请在 User Permission 中为该账号开通相应权限
        "408":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerGatewayErrorEnvelope"
          description: 请求处理超时。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`
      description: 该接口用于校验指定证券账号的交易密码是否正确。通过传入账号 account_no 及加密后的交易密码 encrypt_password，验证通过后返回资产账户唯一标识 aaid 及用户账号 member_id
      x-mint:
        href: /zh-CN/api-reference/account_auth
        metadata:
          sidebarTitle: 交易密码校验
