      description: |-
        OPA 租户为指定长桥用户在注册、开户、入金阶段绑定邀请码

        ### 错误码

        - `400801`：邀请码在长桥不存在，请检查邀请码
        - `400803`：用户标识校验失败，请检查后重试
        - `400804`：解析不到 mid
        - `400805`：邀请类型 stage 取值不合法
        - `400806`：目标阶段已绑邀请关系，邀请码不同
        - `400807`：目标阶段已绑邀请关系，邀请码相同
        - `1901500`：长桥内部错误，请重试
        - `1901601`：邀请关系有误，自己不能邀请自己
        - `1901602`：邀请关系有误，邀请人和被邀请人不能互相绑定
        - `1901603`：该用户已开户，不能再绑定开户邀请人
        - `1901604`：该用户已入金，不能再绑定入金邀请人
      x-mint:
        href: /zh-CN/api-reference/whale_bind_invite_code
        metadata:
          sidebarTitle: 绑定指定阶段的邀请码
