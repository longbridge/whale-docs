      - 业务参数设置
      x-permission-key:
      - lb_hk_conversion.amount_config_query
      x-lbonly: false
      description: '将「大额限制」数据导出为文件。`filters` 决定导出范围，`down_fields` 可限制导出字段。


        ### 导出模式


        - `mode: 0`：同步导出，成功后直接返回下载地址。

        - `mode: 1`：异步导出，先返回 `file_download_id`；随后调用 `GET /v1/datasets/download/{id}` 获取下载地址。

        - 不再需要导出记录时，可调用 `DELETE /v1/datasets/download/{id}` 删除。'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 字段同 atm_forex_amount_configs.yaml（query 能力）里的 filters
                  properties: null
                mode:
                  type: integer
                  default: 0
                  description: '不传时默认 0（同步）


                    **可选值：**

                    - `0` - 表示同步

                    - `1` - 表示异步'
                  enum:
                  - 0
                  - 1
                  x-enum-details:
                  - value: 0
                    label: 同步
                  - value: 1
                    label: 异步
                ext:
                  type: string
                  description: '下载文件格式。不传时默认为 `csv`。


                    **可选值：**

                    - `csv` - 表示 CSV

                    - `xlsx` - 表示 Excel'
                  enum:
                  - csv
                  - xlsx
                file_name:
                  type: string
                  description: 导出文件名称。不传时由服务端生成。
                down_fields:
                  type: array
                  description: 不传时导出全部字段；取值范围见 items.enum（同查询接口 data.list.items 的字段列表）
                  items:
                    type: string
                    enum:
                    - id
                    - currency
                    - currency_val
                    - amount
                    - created_at
                    - updated_at
                ticket_content:
                  type: string
                  description: 模板配置了下载审核工单时，供审批人查看
                ticket_preview_url:
                  type: string
                  description: 导出审批详情地址；仅在导出需要审批时使用。
                hide:
                  type: integer
                  description: '是否在下载记录列表中隐藏本次导出记录。


                    **可选值：**

                    - `0` - 表示不隐藏

                    - `1` - 表示隐藏'
                  enum:
                  - 0
                  - 1
                  x-enum-details:
                  - value: 0
                    label: 不隐藏
                  - value: 1
                    label: 隐藏
            example:
              filters: {}
              mode: 0
