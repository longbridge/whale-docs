                        endpoint: GET /v1/datasets/refs/tenant_currencies_by_channel
                    created_at:
                      type: object
                      description: 用于按「创建时间」筛选结果。
                      properties:
                        gte:
                          type: string
                          format: date
                          description: 筛选范围的下限，匹配值包含该值。
                        lte:
                          type: string
                          format: date
                          description: 筛选范围的上限，匹配值包含该值。
