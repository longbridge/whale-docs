                    **可选值：**

                    - `csv` - 表示 CSV

                    - `xlsx` - 表示 Excel'
                  enum:
                  - csv
                  - xlsx
                file_name:
                  type: string
                  description: 导出文件名称。不传时由服务端生成。
                down_fields:
                  type: array
                  description: 不传时导出全部字段；取值范围见 items.enum（同查询接口 data.list.items 的字段列表）
                  items:
                    type: string
                    enum:
                    - id
                    - coin
                    - chain_types
                    - chain_types_val
                    - name_zh_cn
                    - name_zh_hk
                    - name_en
                    - custom_name
                    - icon
                    - conversion_currency
                    - conversion_rate
                    - daily_withdraw_limit
                    - weekly_withdraw_limit
                    - max_per_withdraw
                    - min_per_withdraw
                    - support_withdraw
                    - custom_withdrawal_function
                    - custom_deposit_function
                    - pi_verify
                    - pi_verify_val
                    - require_tag
                    - require_tag_val
                    - deposit_need_micro_verification
                    - quantity_precision
                    - quantity_round_mode_query
                    - quantity_round_mode_query_val
                    - updater
                    - remark
                    - created_at
                    - updated_at
                    - custom_time
