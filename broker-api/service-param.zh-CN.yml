      description: '编辑支持换汇币种对配置（含设为默认）。


        ### 请求参数


        - 必填：`UpdateSupportCurrency`（币种对变更列表）、`UpdateSupportCurrency[].from_currency`（源币种）、`UpdateSupportCurrency[].to_currency`（目标币种）、`UpdateSupportCurrency[].action`（操作类型）

        - 可选：`UpdateSupportCurrency[].id`（币种对子项ID）、`UpdateSupportCurrency[].default_currency`（是否设为默认目标币种）、`audit_frontend_resource`（审计快照（变更前后目标币种列表））

        - 各字段的格式、取值范围和业务含义见对应字段说明。


