                        - `yes` - 表示需要

                        - `no` - 表示不需要'
                      enum:
                      - 'yes'
                      - 'no'
                      x-enum-details:
                      - value: 'yes'
                        label: 需要
                      - value: 'no'
                        label: 不需要
                mode:
                  type: integer
                  default: 0
                  description: '不传时默认 0（同步）


                    **可选值：**

                    - `0` - 表示同步

                    - `1` - 表示异步'
                  enum:
                  - 0
                  - 1
                  x-enum-details:
                  - value: 0
                    label: 同步
                  - value: 1
                    label: 异步
                ext:
                  type: string
