openapi: 3.1.1
info:
  title: Longport Whale 券商 API
  description: 面向使用 Longport Whale 的券商提供机构级服务端 API。
  version: 2.0.0
servers:
- url: https://b-api.longbridge.xyz
  description: 测试环境
- url: https://b-api.lbkrs.com
  description: 生产环境
security:
- bearerAuth: []
tags:
- name: 业务参数设置
paths:
  /clearing/upsert_clearing_ready_setting:
    post:
      operationId: upsert_clearing_ready_setting
      summary: 新增/编辑清算前准备检查项设置
      tags:
      - 业务参数设置
      x-permission-key:
      - lb_hk_clearing.clearing_busin_step_edit
      x-lbonly: false
      description: '并以 审计模板中的真实 payload 示例交叉核对，涉及真实清算前准备检查项配置变更。


        ### 请求参数


        - 必填：`task_code`（任务编码）、`task_name`（任务名称）

        - 可选：`process_mode`（失败后处理方式）、`is_enable`（是否启用）、`audit_frontend_resource`（审计上下文）

        - 各字段的格式、取值范围、默认行为和业务含义见对应字段说明。


        ### 处理结果


        成功时完成所述业务操作，具体返回内容见 `200` 响应定义。'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - task_code
              - task_name
              properties:
                task_code:
                  type: string
                  description: 该值不可由用户修改；调用方必须使用目标记录的 `task_code_val`。
                task_name:
                  type: string
                  description: 提交时取当前行记录的 task_code 字段值（展示名），与请求只读输入框内容一致。
                process_mode:
                  type: string
                  description: '清算前检查失败后的处理方式。


                    候选值会动态变化。请调用 `GET /v1/datasets/refs/clear_ready_process_mode`

                    获取当前可用的数据字典，并使用返回项的 `key` 作为本字段值。


                    **可选值：**

                    - `0` - 表示仅提醒

                    - `1` - 表示工单审核

                    - `2` - 表示强制校验'
                  x-value-source:
                    endpoint: GET /v1/datasets/refs/clear_ready_process_mode
                  enum:
                  - '0'
                  - '1'
                  - '2'
                  x-enum-details:
                  - value: '0'
                    label: 仅提醒
                  - value: '1'
                    label: 工单审核
                  - value: '2'
                    label: 强制校验
                is_enable:
                  type: boolean
                  description: 开关组件（switch），提交前会做 values.is_enable === true || values.is_enable === 'true'
                    的布尔转换。
                audit_frontend_resource:
                  type: object
                  description: '非业务字段，仅用于审计日志展示变更前后状态，调用方应构造为 {...currentItem, after_enable, before_enable
                    }，包含

                    before_enable/after_enable 两个布尔值，分别对应变更前后的启用状态。'
            example:
              task_code: ready_ibond_check
              task_name: IBOND 交易檢查
              process_mode: '1'
              is_enable: false
      responses:
        '200':
          description: 请求处理成功。响应的 `data` 不包含额外业务字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: '0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。


                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`

                      判断具体结果。


                      - `401`：未登录。

                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。'
                    x-enum-details:
                    - value: 0
                      label: 成功
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登录或登录状态已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 当前账号未获得该功能授权。请在 User Permission 中为该账号开通相应权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 请求处理超时。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
  /clearing/update_system_config:
    post:
      operationId: update_system_config
      summary: 修改清算系统配置
      tags:
      - 业务参数设置
      x-permission-key:
      - lb_hk_clearing.clearing_busin_step_edit
      x-lbonly: false
      description: '修改清算系统配置。


        ### 请求参数


        - 必填：`config_code`（配置代码）、`config_value`（配置值）

        - 各字段的格式、取值范围和业务含义见对应字段说明。


        ### 处理结果


        成功时完成上述业务操作；后续状态和返回数据以 `200` 响应定义为准。'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - config_code
              - config_value
              properties:
                config_code:
                  type: number
                  description: 用于指定「配置代码」。此字段为必填项。
                config_value:
                  type: string
                  description: 用于指定「配置值」。此字段为必填项。
            example:
              config_code: 1
              config_value: ''
      responses:
        '200':
          description: 请求处理成功。响应的 `data` 不包含额外业务字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: '0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。


                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`

                      判断具体结果。


                      - `401`：未登录。

                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。'
                    x-enum-details:
                    - value: 0
                      label: 成功
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登录或登录状态已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 当前账号未获得该功能授权。请在 User Permission 中为该账号开通相应权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 请求处理超时。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
  /atm/lb/bankaccount:
    put:
      operationId: atm_lb_bankaccount_edit
      summary: 编辑公司银行账户
      tags:
      - 业务参数设置
      x-permission-key:
      - lb_hk_fund.companybank_update
      x-lbonly: false
      description: '请求字段与「新增公司银行账户」一致，额外包一层 lb_bank_account_info。


        ### 请求参数


        - 必填：`id`（银行账户ID）、`lb_bank_account_info`（银行账户请求数据）

        - 可选：`audit_frontend_resource`（调用方审计日志载荷）

        - 各字段的格式、取值范围、默认行为和业务含义见对应字段说明。


        ### 处理结果


        成功时完成所述业务操作，具体返回内容见 `200` 响应定义。'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              - lb_bank_account_info
              properties:
                id:
                  type: string
                  description: 银行账户ID，用于标识本次请求关联的业务对象。此字段为必填项。
                lb_bank_account_info:
                  type: object
                  description: 字段结构同「新增公司银行账户」接口的请求参数，此处不再重复展开
                audit_frontend_resource:
                  type: object
                  description: 取自编辑前的详情数据，非业务字段
            example:
              id: '1'
              lb_bank_account_info:
                nature_type: ''
                currency: USD
                account_name: ''
                region: ''
                bank_id: ''
                bank_account: ''
                bank_name: ''
                bank_region: ''
                swift_code: ''
                bank_addr: ''
                simple_name: ''
                deposit_types: []
                withdraw_types: []
