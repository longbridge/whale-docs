                    description: '0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。


                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`

                      判断具体结果。


                      - `401`：未登录。

                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。'
                    x-enum-details:
                    - value: 0
                      label: 成功
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登录或登录状态已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 当前账号未获得该功能授权。请在 User Permission 中为该账号开通相应权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 请求处理超时。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
    post:
      operationId: atm_lb_bankaccount_add
      summary: 新增公司银行账户
      tags:
      - 业务参数设置
      x-permission-key:
      - lb_hk_fund.companybank_update
      x-lbonly: false
      description: '新增公司银行账户。


        ### 请求参数


        - 必填：`nature_type`（账户性质）、`currency`（币种）、`account_name`（账户名称）、`region`（地区）、`bank_id`（银行ID）、`bank_account`（银行账号）、`bank_name`（银行名称）、`bank_region`（银行所在地区）、`swift_code`（Swift
        Code）、`bank_addr`（银行地址）、`simple_name`（简称）、`deposit_types`（入金方式列表）、`withdraw_types`（出金方式列表）、`version`（版本）

        - 可选：`bank_code`（银行代码）、`connect_customer_id`（联行号/Connect Customer ID）、`net_customer_id`（Net Customer
        ID）、`intermediary_swift_code`（中间行 Swift Code）、`support_exchange`（是否支持换汇）、`remark`（备注）

        - 各字段的格式、取值范围和业务含义见对应字段说明。


        ### 处理结果


        成功时完成上述业务操作；后续状态和返回数据以 `200` 响应定义为准。'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - nature_type
              - currency
              - account_name
              - region
              - bank_id
              - bank_account
              - bank_name
              - bank_region
              - swift_code
              - bank_addr
              - simple_name
              - deposit_types
              - withdraw_types
              - version
              properties:
                nature_type:
                  type: string
                  description: 用于指定「账户性质」。此字段为必填项。
                currency:
                  type: string
                  description: 本次请求使用的币种代码。此字段为必填项。
                account_name:
                  type: string
                  description: 用于指定「账户名称」。此字段为必填项。
                region:
                  type: string
                  description: 用于指定「地区」。此字段为必填项。
                bank_id:
                  type: string
                  description: 银行ID，用于标识本次请求关联的业务对象。此字段为必填项。
                bank_account:
                  type: string
                  description: 用于指定「银行账号」。此字段为必填项。
                bank_code:
                  type: string
                  description: 用于指定「银行代码」。
                bank_name:
                  type: string
                  description: 用于指定「银行名称」。此字段为必填项。
                bank_region:
                  type: string
                  description: 用于指定「银行所在地区」。此字段为必填项。
                swift_code:
                  type: string
                  description: 用于指定「Swift Code」。此字段为必填项。
                bank_addr:
                  type: string
                  description: 用于指定「银行地址」。此字段为必填项。
                connect_customer_id:
                  type: string
                  description: 联行号/Connect Customer ID，用于标识本次请求关联的业务对象。
                net_customer_id:
                  type: string
                  description: Net Customer ID，用于标识本次请求关联的业务对象。
                simple_name:
                  type: string
                  description: 用于指定「简称」。此字段为必填项。
                intermediary_swift_code:
                  type: string
                  description: 用于指定「中间行 Swift Code」。
                deposit_types:
                  type: array
                  description: 数组元素 {name, id}，提交前过滤掉 name/id 为空的项
                  items:
                    type: string
                withdraw_types:
                  type: array
                  description: 数组元素 {name, id, support_bank}，提交前过滤掉 name/id 为空的项
                  items:
                    type: string
                support_exchange:
                  type: string
                  description: '用于指定「是否支持换汇」。


                    **可选值：**

                    - `yes` - 表示是

                    - `no` - 表示否'
                  enum:
                  - 'yes'
                  - 'no'
                  x-enum-details:
                  - value: 'yes'
                    label: 是
                  - value: 'no'
                    label: 否
                remark:
                  type: string
                  description: 随本次操作保存的备注。
                version:
                  type: number
                  description: 固定传入 1，兼容老接口
            example:
              nature_type: ''
              currency: USD
              account_name: ''
              region: ''
              bank_id: ''
              bank_account: ''
              bank_code: ''
              bank_name: ''
              bank_region: ''
              swift_code: ''
              bank_addr: ''
              connect_customer_id: ''
              net_customer_id: ''
              simple_name: ''
              intermediary_swift_code: ''
              deposit_types: []
              withdraw_types: []
              support_exchange: 'yes'
              remark: ''
              version: 1
      responses:
        '200':
          description: 请求处理成功。响应的 `data` 不包含额外业务字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: '0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。


                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`

                      判断具体结果。


                      - `401`：未登录。

                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。'
                    x-enum-details:
                    - value: 0
                      label: 成功
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登录或登录状态已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 当前账号未获得该功能授权。请在 User Permission 中为该账号开通相应权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 请求处理超时。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
    get:
      operationId: atm_lb_bankaccount_detail
      summary: 公司银行账户详情
      tags:
      - 业务参数设置
      x-permission-key:
      - lb_hk_fund.companybank_query
      x-lbonly: false
      description: '按 `id` 查询单条公司银行账户的完整配置详情。


        ### 请求参数


        - 必填：`id`（公司银行账户 id），作为查询参数传入。


        ### 处理结果


        成功时在 `data` 中返回该公司银行账户的完整配置，字段与「新增/编辑公司银行账户」的请求字段一致。各字段含义见 `200` 响应字段说明。'
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: query
        required: true
        schema:
          type: string
        description: 公司银行账户 id，作为查询参数传入。
      responses:
        '200':
          description: 请求处理成功。`data` 为该公司银行账户的完整配置。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: '0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。


                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`

                      判断具体结果。


                      - `401`：未登录。

                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。'
                    x-enum-details:
                    - value: 0
                      label: 成功
                  message:
                    type: string
                  data:
                    type: object
                    description: 公司银行账户的完整配置。
                    properties:
                      nature_type:
                        type: string
                        description: 账户性质。常见取值：`client`（客户账户）、`house`（自营账户）。
                      account_type_id:
                        type: string
                        description: 账户类型 id。
                      lb_company_id:
                        type: string
                        description: 所属公司 id。
                      account_name:
                        type: string
                        description: 账户名称。
                      bank_account:
                        type: string
                        description: 银行账号。
                      bank_name:
                        type: string
                        description: 银行名称。
                      bank_id:
                        type: integer
                        description: 银行 id，标识该账户关联的银行。
                      bank_region:
                        type: string
                        description: 银行所在地区。
                      region:
                        type: string
                        description: 账户所属国家/地区。
                      swift_code:
                        type: string
                        description: Swift Code。
                      bank_addr:
                        type: string
                        description: 银行地址。
                      simple_name:
                        type: string
                        description: 简称。
                      deposit_types:
                        type: array
                        description: 入金方式列表。每一项为一个入金方式对象。
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: 入金方式 id。
                            name:
                              type: string
                              description: 入金方式名称。
                            support_bank:
                              type: integer
                              description: 是否支持银行渠道：`0` 不支持，`1` 支持。
                      withdraw_types:
                        type: array
                        description: 出金方式列表。每一项为一个出金方式对象。
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: 出金方式 id。
