      x-lbonly: false
      description: '编辑用户成交加点汇率。


        ### 请求参数


        - 必填：`id`（配置ID）、`end_time`（生效结束时间）、`start_time`（生效开始时间）、`from_currency`（原币种）、`to_currency`（目标币种）、`default_effective`（是否默认生效（不限时间段））

        - 可选：`action_user`（操作用户）、`channel_name`（渠道名称）、`is_default`（是否默认）、`rate_source`（汇率来源）、`rate_use_in`（汇率使用场景）、`reference_rate`（参考汇率）、`service_strategy`（服务策略）、`spread_mode`（加点方式）、`spread_value`（加点区间配置）、`audit_frontend_resource`（调用方提交的审计日志载荷）

        - 各字段的格式、取值范围和业务含义见对应字段说明。


        ### 处理结果


        成功时完成上述业务操作；后续状态和返回数据以 `200` 响应定义为准。'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              - end_time
              - start_time
              - from_currency
              - to_currency
              - default_effective
              properties:
                id:
                  type: string
                  description: 配置ID，用于标识本次请求关联的业务对象。此字段为必填项。
                action_user:
                  type: string
                  description: 用于指定「操作用户」。
                channel_name:
                  type: string
                  description: service_strategy=BATCH（批量策略）时提交前会被删除，不下发
                end_time:
                  type: string
                  description: 非默认生效时为区间选择器 end_time 的 unix 秒；默认生效时固定传 '0'
                start_time:
                  type: string
                  description: 同 end_time 逻辑
                from_currency:
                  type: string
                  description: 用于指定「原币种」。此字段为必填项。
                to_currency:
                  type: string
                  description: 用于指定「目标币种」。此字段为必填项。
                is_default:
                  type: string
                  description: 用于指定「是否默认」。
                rate_source:
                  type: string
                  description: 用于指定「汇率来源」。
                rate_use_in:
                  type: string
                  description: 用于指定「汇率使用场景」。
                reference_rate:
                  type: string
                  description: 用于指定「参考汇率」。
                service_strategy:
                  type: string
                  description: 用于指定「服务策略」。
                spread_mode:
                  type: string
                  description: 用于指定「加点方式」。
                spread_value:
                  type: array
                  description: 数组元素 {start_value, end_value}，由请求 range_value 区间拆分而来
                  items:
                    type: string
                default_effective:
                  type: string
                  description: 用于指定「是否默认生效（不限时间段）」。此字段为必填项。
                audit_frontend_resource:
                  type: object
                  description: 用于指定「调用方提交的审计日志载荷」。
            example:
              id: '1'
              action_user: ''
              channel_name: ''
              end_time: '0'
              start_time: '0'
              from_currency: USD
              to_currency: HKD
              is_default: 'true'
              rate_source: ''
              rate_use_in: ''
              reference_rate: ''
              service_strategy: ''
              spread_mode: ''
