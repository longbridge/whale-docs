      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - UpdateSupportCurrency
              - UpdateSupportCurrency[].from_currency
              - UpdateSupportCurrency[].to_currency
              - UpdateSupportCurrency[].action
              properties:
                UpdateSupportCurrency:
                  type: array
                  description: '每项包含 id/from_currency/to_currency/action/default_currency； 中新增项 action=1、变更

                    to_currency 的项 action=2、被移除的旧项 action=3； 中固定传单项 action=2 并附加 default_currency=true

                    用于设为默认目标币种'
                  items:
                    type: string
                UpdateSupportCurrency[].id:
                  type: string
                  description: 已存在的目标币种记录 ID，新增（action=1）时为空
                UpdateSupportCurrency[].from_currency:
                  type: string
                  description: 用于指定「源币种」，三位货币代码。候选值来自 ref `tenant_currencies_for_exchange`。此字段为必填项。
                  x-value-source:
                    endpoint: GET /v1/datasets/refs/tenant_currencies_for_exchange
                UpdateSupportCurrency[].to_currency:
                  type: string
                  description: 用于指定「目标币种」，三位货币代码。候选值来自 ref `tenant_currencies_for_exchange`。此字段为必填项。
                  x-value-source:
                    endpoint: GET /v1/datasets/refs/tenant_currencies_for_exchange
                UpdateSupportCurrency[].action:
                  type: number
                  description: '操作类型。


                    **可选值：**

                    - `1` - 表示新增

                    - `2` - 表示修改/设为默认

                    - `3` - 表示删除'
                  enum:
                  - '1'
                  - '2'
                  - '3'
                  x-enum-details:
                  - value: '1'
                    label: 新增
                  - value: '2'
                    label: 修改/设为默认
                  - value: '3'
                    label: 删除
                UpdateSupportCurrency[].default_currency:
                  type: boolean
                  description: 仅 「设为默认」场景会传 true
                audit_frontend_resource:
                  type: object
                  description: 仅 编辑场景传入，包含 before/after 两个目标币种数组，用于后台审计留痕
            example:
              UpdateSupportCurrency:
              - id: '101'
                from_currency: USD
                to_currency: HKD
                action: 2
                default_currency: true
              audit_frontend_resource:
                after:
                - HKD
                - JPY
                before:
                - HKD
      responses:
        '200':
          description: 请求处理成功。响应的 `data` 不包含额外业务字段。
          content:
            application/json:
              schema:
