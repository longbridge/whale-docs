        - 可选：`fee_bank_account_id`（手续费账户）、`status`（规则状态）、`remark`（备注）、`rule_codes`（命中的AML出金规则（仅 certain
        sites））、`original_limit_bank_accounts`（原始限额出金账户列表（仅 certain sites 且 original_limit=1））、`name`（银行渠道名称（冗余展示字段））、`audit_frontend_resource`（调用方审计日志附加信息）

        - 各字段的格式、取值范围和业务含义见对应字段说明。


