                    - flow_name
                    - markets
                    - operator
                    - operator_val
                    - updated_at
                ticket_content:
                  type: string
                  description: 模板配置了下载审核工单时，供审批人查看
                ticket_preview_url:
                  type: string
                  description: 导出审批详情地址；仅在导出需要审批时使用。
