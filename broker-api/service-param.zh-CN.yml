                value_en:
                  type: string
                  description: 长度限制同 value_cn
                priority:
                  type: number
                  description: 取值范围 1-999999
                audit_frontend_resource:
                  type: object
                  description: 修改前记录快照，用于审计追踪，非用户填写字段
