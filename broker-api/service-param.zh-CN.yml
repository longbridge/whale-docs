                    label: 证券取出
                  - value: setting_remark_accountadjustment
                    label: 调账
                  - value: setting_remark_withdrawal_reject
                    label: 出金拒绝理由
                  - value: setting_remark_deposit_reject
                    label: 入金拒绝理由
                  - value: setting_remark_withdrawal_card_reject
                    label: 拒绝客户绑卡
                  - value: setting_remark_fund
