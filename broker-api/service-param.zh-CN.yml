      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 字段同 risk_monitoring_configs.yaml（query 能力）里的 filters
                  properties: null
                mode:
                  type: integer
                  default: 0
                  description: '不传时默认 0（同步）


                    **可选值：**

                    - `0` - 表示同步

                    - `1` - 表示异步'
                  enum:
                  - 0
                  - 1
                  x-enum-details:
                  - value: 0
                    label: 同步
                  - value: 1
                    label: 异步
