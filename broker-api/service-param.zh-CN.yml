        ### 请求参数


        - 必填：`rule_name`（规则名称）、`group_name`（规则分组）、`status`（状态）、`rule_detail`（规则明细列表）

        - 可选：`risk_rule_id`（规则ID）、`aaid`（客户账户ID）、`group_id`（客户分组ID）、`audit_frontend_resource`（审批工单展示资源）

        - 各字段的格式、取值范围、默认行为和业务含义见对应字段说明。


        ### 业务说明


        新增和编辑均使用本接口:不传 `risk_rule_id` 为新增;传 `risk_rule_id` 为编辑对应规则。


        ### 处理结果


        成功时完成所述业务操作，具体返回内容见 `200` 响应定义。'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - rule_name
              - group_name
              - status
              - rule_detail
              properties:
                risk_rule_id:
                  type: string
                  description: 编辑已有规则时传入，新增时不传
