  /risk/v1/account_credit_cfg/add_review:
    post:
      operationId: account_credit_cfg_add_review
      summary: 新增用户授信配置(提交审核)
      tags:
      - 业务参数设置
      x-lbonly: false
      description: '为指定证券账号新增一条用户级(per-account)授信配置，并提交审核。


        该接口不会立即生效：提交成功后会生成一张审批工单，配置在审批通过后才落地。工单 ID 通过 `200` 响应的 `data.ticket_id` 返回。


        ### 请求参数


        - 账户范围：`member_id`（会员 ID）、`aaid`（证券账号）用于定位目标客户，均为必填。

        - 授信主体：`credit_type`（授信类型）、`credit_currency`（币种）确定授信配置的适用范围。

        - 额度与系数：`applicable`、`auto_credit_limit`、`credit_coefficient`、`ccf`、`credit_fps` 等描述授信额度与计算参数。

        - 系数规则：`credit_coefficient_rule_list` 为可选的分段授信系数规则；配置了规则时应同时将 `is_enable_credit_coefficient_rule`
        置为 `true`。

        - 动态调额：`dynamic_credit_limit_adjustment_status` 开启后需提供 `max_dynamic_credit_limit`、`min_dynamic_credit_limit`。

        - 各字段的格式、取值范围和业务含义见对应字段说明。


        ### 处理结果


        成功时生成审批工单并在 `data.ticket_id` 返回工单 ID；配置需待工单审批通过后生效。'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - member_id
              - aaid
              - credit_type
              - credit_currency
              - applicable
              - auto_credit_limit
              - ccf
              - auto_credit
              - credit_coefficient
              properties:
                member_id:
                  type: string
                  description: 目标客户的会员 ID，用于定位被授信的客户。此字段为必填项。
                  example: '1000000000000000000'
                aaid:
                  type: string
                  description: 目标客户的证券账号。此字段为必填项。
                  example: H00000000
                credit_type:
                  type: string
                  description: '授信类型，取值来自「授信类型」数据字典。此字段为必填项。


                    示例：`1` 表示 Margin Credit Limit（保证金授信额度）。'
                  example: '1'
                credit_currency:
                  type: string
                  description: 授信额度的币种。此字段为必填项。
                  example: HKD
                applicable:
                  type: integer
                  description: App 端可申请的最大授信额度，需为 `1000` 的整数倍。此字段为必填项。
                  example: 1000000
                auto_credit_limit:
                  type: integer
                  description: 系统自动授信的最大限额，需为 `1000` 的整数倍。此字段为必填项。
                  example: 1000000
                net_asset_ratio:
                  type: string
                  description: 申报净资产倍数，以字符串形式传入。仅当 `credit_type` 为 `1`（保证金授信额度）时需要提供，其它授信类型不传。
                  example: '1'
                credit_fps:
                  type: number
                  description: 账户基础信息分析系数（FPS），取值范围 `0`–`1`。仅当 `credit_type` 为 `1`（保证金授信额度）时需要提供。
                  example: 0.3
                ccf:
                  type: number
                  description: 信用转换因子（CCF），以小数形式传入。界面按百分比录入（`0`–`100`），提交时须除以 `100` 转换为小数，例如界面填 `100%`
                    时传 `1`。此字段为必填项。
                  example: 1
                auto_credit:
                  type: boolean
                  description: 是否开启自动授信：`true` 开启，`false` 关闭。此字段为必填项。
                  example: true
                credit_coefficient:
                  type: number
                  description: 默认授信系数（乘数）。此字段为必填项。
                  example: 1
                is_enable_credit_coefficient_rule:
                  type: boolean
                  description: 是否启用分段授信系数规则。当 `credit_coefficient_rule_list` 非空时应置为 `true`。
                  example: true
                credit_coefficient_rule_list:
                  type: array
                  description: 分段授信系数规则数组。每一项按指定指标（如客户净资产）的取值区间匹配一个授信系数；不配置分段规则时可省略或传空数组。
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        description: 规则匹配的指标类型，取值来自「授信系数规则类型」数据字典，例如 `0` 表示客户净资产。
                        example: '0'
                      coefficient:
                        type: string
                        description: 该区间命中时使用的授信系数。
                        example: '1.5'
                      left_operator:
                        type: string
                        description: 区间下界的比较运算符；表示不限时使用「无限制」标记。
                        example: '0'
                      right_operator:
                        type: string
                        description: 区间上界的比较运算符；表示不限时使用「无限制」标记。
                        example: '1'
                      left_value:
                        type: string
                        description: 区间下界的值；下界不限时可为空。
                        example: '0'
                      right_value:
                        type: string
                        description: 区间上界的值；上界不限时可为空。
                        example: '1000000'
            example:
              member_id: '1000000000000000000'
              aaid: H00000000
              credit_type: '1'
              credit_currency: HKD
              applicable: 1000000
              auto_credit_limit: 1000000
              net_asset_ratio: '1'
              credit_fps: 0.3
              ccf: 1
              auto_credit: true
              credit_coefficient: 1
              is_enable_credit_coefficient_rule: true
              credit_coefficient_rule_list:
              - type: '0'
                coefficient: '1.5'
                left_operator: '0'
                right_operator: '1'
                left_value: '0'
                right_value: '1000000'
      responses:
        '200':
          description: 请求处理成功。提交审核后生成审批工单，`data.ticket_id` 为生成的工单 ID。
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - data
                properties:
                  code:
                    type: integer
                    description: '0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。


                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`

                      判断具体结果。


                      - `401`：未登录。

                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。'
                    x-enum-details:
                    - value: 0
                      label: 成功
                  message:
                    type: string
                  data:
                    type: object
                    description: 提交审核的处理结果。
                    properties:
                      ticket_id:
                        type: string
                        description: 提交审核后生成的审批工单 ID，可凭此跟踪审批进度。
              example:
                code: 0
                message: success
                data:
                  ticket_id: '100001'
        '400':
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登录或登录状态已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 当前账号未获得该功能授权。请在 User Permission 中为该账号开通相应权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 请求处理超时。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
