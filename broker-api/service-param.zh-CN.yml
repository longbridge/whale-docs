        - 各字段的格式、取值范围和业务含义见对应字段说明。


        ### 处理结果


        成功时完成上述业务操作；后续状态和返回数据以 `200` 响应定义为准。'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              - currency_iso
              - currency
              - icon
              - logo
              - support_withdraw
              - support_exchange
              - min_withdrawal_amount
              - min_exchange_amount
              - exchange_rate_precision
              - amount_precision
              - amount_round_mode
              - standard_money
              - abbreviation_multi_name
              - multi_name
              - json_config
              properties:
                id:
                  type: string
                  description: 配置ID，用于标识本次请求关联的业务对象。此字段为必填项。
                currency_iso:
                  type: string
                  description: 用于指定「币种代码」。此字段为必填项。
                currency:
                  type: string
                  description: 用于指定「币种标识」。此字段为必填项。
                icon:
                  type: string
                  description: 用于指定「图标标识」。此字段为必填项。
                logo:
                  type: string
                  description: 用于指定「Logo」。此字段为必填项。
                cash_amount:
                  type: string
                  description: 用于指定「最低入金金额」。
                support_withdraw:
                  type: string
                  description: '最终并入 json_config


                    **可选值：**

                    - `yes` - 表示是

                    - `no` - 表示否'
                  enum:
                  - 'yes'
                  - 'no'
                  x-enum-details:
                  - value: 'yes'
                    label: 是
                  - value: 'no'
                    label: 否
                support_exchange:
                  type: string
                  description: '最终并入 json_config


                    **可选值：**

                    - `yes` - 表示是

                    - `no` - 表示否'
                  enum:
                  - 'yes'
                  - 'no'
                  x-enum-details:
                  - value: 'yes'
                    label: 是
                  - value: 'no'
                    label: 否
                min_withdrawal_amount:
                  type: string
                  description: 用于指定「最低出金金额」。此字段为必填项。
                min_exchange_amount:
                  type: string
                  description: 用于指定「最低换汇金额」。此字段为必填项。
                exchange_rate_precision:
                  type: number
                  description: 用于指定「汇率精度」。此字段为必填项。
                amount_precision:
                  type: string
                  description: '金额保留的小数位数。此字段为必填项。


                    **可选值：**

                    - `0` - 表示 0 位小数

                    - `1` - 表示 1 位小数

                    - `2` - 表示 2 位小数'
                  enum:
                  - '0'
                  - '1'
                  - '2'
                amount_round_mode:
                  type: string
                  description: 用于指定「金额舍入方式」。此字段为必填项。
                standard_money:
                  type: string
                  description: '用于指定「是否本位币」。此字段为必填项。


                    **可选值：**

                    - `yes` - 表示是

                    - `no` - 表示否'
                  enum:
                  - 'yes'
                  - 'no'
                  x-enum-details:
                  - value: 'yes'
                    label: 是
                  - value: 'no'
                    label: 否
                remarks:
                  type: string
                  description: 随本次操作保存的备注。
                abbreviation_multi_name:
                  type: string
                  description: JSON 字符串 {zh-CN, zh-HK, en}
                multi_name:
                  type: string
                  description: JSON 字符串 {zh-CN, zh-HK, en}
                json_config:
                  type: string
                  description: JSON 字符串 {app_show, support_withdraw, support_exchange, support_deposit}
                audit_frontend_resource:
                  type: object
                  description: 用于指定「调用方提交的审计日志载荷」。
            example:
              id: '1'
              currency_iso: USD
              currency: USD
              icon: ''
              logo: ''
              cash_amount: '0'
              support_withdraw: 'yes'
              support_exchange: 'yes'
              min_withdrawal_amount: '0'
              min_exchange_amount: '0'
              exchange_rate_precision: 2
              amount_precision: '2'
              amount_round_mode: ''
              standard_money: 'no'
              remarks: ''
              abbreviation_multi_name: '{"zh-CN":"","zh-HK":"","en":"USD"}'
              multi_name: '{"zh-CN":"","zh-HK":"","en":"USD"}'
              json_config: '{"app_show":"yes","support_withdraw":"yes","support_exchange":"yes","support_deposit":"yes"}'
              audit_frontend_resource: {}
      responses:
        '200':
          description: 请求处理成功。响应的 `data` 不包含额外业务字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: '0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。


