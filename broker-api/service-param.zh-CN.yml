                    - `setting_remark_deposit_reject` - 表示入金拒绝理由

                    - `setting_remark_withdrawal_card_reject` - 表示拒绝客户绑卡

                    - `setting_remark_fund` - 表示基金

                    - `setting_remark_otc_derivatives` - 表示场外衍生品

                    - `setting_remark_deposit_matching` - 表示入金匹配


                    请调用 `GET /v1/datasets/refs/atm_remark_category` 获取当前可用的数据字典，并使用返回项的 `key` 作为本字段值。'
