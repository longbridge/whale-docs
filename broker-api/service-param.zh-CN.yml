                  type: string
                  description: 用于指定「规则名称」。此字段为必填项。
                group_name:
                  type: string
                  description: '取值来自 risk_groups 动态枚举，非固定


                    **可选值：**

                    - `ignore_margin_call` - 表示 MarginCall 豁免

                    - `over_financing_margin_call_ignore` - 表示超额融资 MarginCall 豁免


                    请调用 `GET /v1/datasets/refs/risk_groups` 获取当前可用的数据字典，并使用返回项的 `key` 作为本字段值。'
                  enum:
                  - ignore_margin_call
                  - over_financing_margin_call_ignore
                  x-enum-details:
                  - value: ignore_margin_call
                    label: MarginCall 豁免
                  - value: over_financing_margin_call_ignore
                    label: 超额融资 MarginCall 豁免
