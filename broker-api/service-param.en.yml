                    front end always sends { before_id: the source rule ID carried in from the "Copy"

                    entry (may be empty), showCopy: whether it is a copy-create }.'
            example:
              original_limit: '0'
              lb_bank_channel_id: '10086'
              package_type: '1'
              batch_max_count: '50'
              charge_type: SHA
              fee_bank_account_id: 示例用户
              single_quota_currency_amount: '[{"currency":"USD","amount":10000}]'
