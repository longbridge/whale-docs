                  - '1'
                  x-enum-details:
                  - value: '0'
                    label: Not Supported
                  - value: '1'
                    label: Support
                priority:
                  type: number
                  description: An integer in the range 0-999.
                status:
                  type: string
                  description: 'Single-select; values: ''1'' = enabled, ''2'' = disabled.


                    **Allowed values:**

                    - `1` - Enable

                    - `2` - Disable'
