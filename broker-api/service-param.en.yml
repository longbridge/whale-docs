                  - '4'
                  x-enum-details:
                  - value: '1'
                    label: Real Time Payment Of Single Order
                  - value: '2'
                    label: Manual Review Of Timed Packing
                  - value: '3'
                    label: Manual Packing
                  - value: '4'
                    label: Batch Auto
                batch_max_count:
