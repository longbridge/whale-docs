  /v1/risk_monitoring/rule_engine/save_risk_rule:
    post:
      operationId: save_risk_rule
      summary: Save Risk Rule
      tags:
      - Service Parameter
      x-lbonly: false
      description: 'Saves the risk-control rules. This operation changes the live risk-rule engine configuration;
        use it with caution.


        ### Request parameters


        - Required: `rule_name` (Rule Name), `group_name` (Rule Group Name), `status` (Status), `rule_detail`
        (Rule Detail List)

        - Optional: `risk_rule_id` (Risk Rule ID), `aaid` (Account AAID), `group_id` (Client Group ID),
        `audit_frontend_resource` (Audit Context)

        - See each field for its format, allowed values, default behavior, and business meaning.


        ### Notes


        This single endpoint handles both create and edit: omit `risk_rule_id` to create a new rule, or
        provide `risk_rule_id` to edit that rule.


        ### Result


        On success, the endpoint completes the described business operation. See the `200` response schema
        for returned data.'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - rule_name
              - group_name
              - status
              - rule_detail
              properties:
                risk_rule_id:
                  type: string
                  description: Passed when editing an existing rule; not passed when creating.
                rule_name:
                  type: string
                  description: Specifies Rule Name. This field is required.
                group_name:
                  type: string
                  description: 'Values come from the risk_groups dynamic enumeration and are not fixed.


                    **Allowed values:**

                    - `ignore_margin_call` - MarginCall Exemption

                    - `over_financing_margin_call_ignore` - OverLimit MarginCall Exemption


                    Call `GET /v1/datasets/refs/risk_groups` to retrieve the current data dictionary,
                    and use the returned entry''s `key` as this field''s value.'
                  enum:
                  - ignore_margin_call
                  - over_financing_margin_call_ignore
                  x-enum-details:
                  - value: ignore_margin_call
                    label: MarginCall Exemption
                  - value: over_financing_margin_call_ignore
                    label: OverLimit MarginCall Exemption
                status:
                  type: number
                  description: 'Single-select: 1 = enable, 2 = disable.


                    **Allowed values:**

                    - `1` - Enabled

                    - `2` - Disable'
                  enum:
                  - '1'
                  - '2'
                  x-enum-details:
                  - value: '1'
                    label: Enabled
                  - value: '2'
                    label: Disable
                aaid:
                  type: string
                  description: Submitted only when the rule type is "Customized - single account"; it
                    is the selected client's AAID.
                group_id:
                  type: string
                  description: 'Submitted only when the rule type is "Customized - client group"; values
                    come from the

                    risk_client_groups dynamic enumeration and are not fixed.


                    Call `GET /v1/datasets/refs/risk_client_groups` to retrieve the current data dictionary,
                    and use the returned entry''s `key` as this field''s value.'
                  x-value-source:
                    endpoint: GET /v1/datasets/refs/risk_client_groups
                rule_detail:
                  type: array
                  description: 'Each item contains parameter (the rule parameter name, from the

                    risk_rule_parameter_cfg_query dynamic query, not fixed), operator (comparison operator

                    = / >, fixed to = for boolean parameters), and target_value (for boolean type, 1/0
                    =

                    TRUE/FALSE; for float type, a numeric string).'
                  items:
                    type: string
                audit_frontend_resource:
                  type: object
                  description: 'Audit information shown in the approval ticket: operation type (add/edit),
                    rule type

                    (global/customized), and a human-readable text comparison of the rule details before

                    and after the change.'
            example:
              risk_rule_id: ''
              rule_name: 示例规则
              group_name: risk_group_1
              status: 1
              aaid: ''
              group_id: ''
              rule_detail:
              - parameter: CashAccountType
                operator: 示例用户
                target_value: '1'
              audit_frontend_resource:
                $action: add
                rule_type: system
