              - batch_max_count
              - charge_type
              - single_quota_currency_amount
              - single_quota_currency_amount_keys
              - currency
              - support_region
              - support_bank_ids
              - sec_auth
              - priority
              - service_time
              - lb_service_time
              - version
              - action_in
              properties:
                original_limit:
                  type: string
                  description: 'A single-select option shown only on certain sites; values come from the

                    atm_out_package_original_limit dynamic enum (e.g. whether to use the ''original-limit

                    withdrawal account'' dimension). Editable when creating; disabled in edit state.


                    **Allowed values:**

                    - `0` - Unrestricted

                    - `1` - Restricted


                    Call `GET /v1/datasets/refs/atm_out_package_original_limit` to retrieve the current
                    data dictionary, and use the returned entry''s `key` as this field''s value.'
