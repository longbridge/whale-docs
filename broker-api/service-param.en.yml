openapi: 3.1.1
info:
  title: Longport Whale Broker API
  description: Institution-grade server-side APIs for brokers using Longport Whale.
  version: 2.0.0
servers:
- url: https://b-api.longbridge.xyz
  description: Testing
- url: https://b-api.lbkrs.com
  description: Production
security:
- bearerAuth: []
tags:
- name: Service Parameter
paths:
  /clearing/upsert_clearing_ready_setting:
    post:
      operationId: upsert_clearing_ready_setting
      summary: Upsert Clearing Ready Setting
      tags:
      - Service Parameter
      x-permission-key:
      - lb_hk_clearing.clearing_busin_step_edit
      x-lbonly: false
      description: 'Cross-check the request against the actual payload example in the audit template.
        This operation

        changes live pre-clearing checklist configuration.


        ### Request parameters


        - Required: `task_code` (Task Code), `task_name` (Task Name)

        - Optional: `process_mode` (Post-failure Processing Mode), `is_enable` (Enable/Disable), `audit_frontend_resource`
        (Audit Frontend Resource (auxiliary))

        - See each field for its format, allowed values, default behavior, and business meaning.


        ### Result


        On success, the endpoint completes the described business operation. See the `200` response schema
        for returned data.'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - task_code
              - task_name
              properties:
                task_code:
                  type: string
                  description: 'The corresponding field is read-only on the edit form. Its submitted value
                    comes from

                    `task_code_val` on the selected record, not from user input.'
                task_name:
                  type: string
                  description: 'On submission, takes the task_code field value (display name) of the current
                    row

                    record, matching the content of the read-only form input.'
                process_mode:
                  type: string
                  description: 'Processing mode to apply when a pre-clearing check fails.


                    Values are dynamic. Call `GET /v1/datasets/refs/clear_ready_process_mode`

                    to retrieve the current data dictionary, and use the returned entry''s `key` as this
                    field''s value.


                    **Allowed values:**

                    - `0` - Tip Only

                    - `1` - Ticket Process

                    - `2` - Forced Calibration'
                  x-value-source:
                    endpoint: GET /v1/datasets/refs/clear_ready_process_mode
                  enum:
                  - '0'
                  - '1'
                  - '2'
                  x-enum-details:
                  - value: '0'
                    label: Tip Only
                  - value: '1'
                    label: Ticket Process
                  - value: '2'
                    label: Forced Calibration
                is_enable:
                  type: boolean
                  description: 'A switch component; before submission it is converted to a boolean via

                    values.is_enable === true || values.is_enable === ''true''.'
                audit_frontend_resource:
                  type: object
                  description: 'A non-business field used only to display the before/after state in the
                    audit log; the

                    front end builds it as {...currentItem, after_enable, before_enable }, containing
                    the

                    two booleans before_enable/after_enable for the enabled state before and after the

                    change.'
            example:
              task_code: ready_ibond_check
              task_name: IBOND 交易檢查
              process_mode: '1'
              is_enable: false
      responses:
        '200':
          description: The request was processed successfully. The response `data` does not contain additional
            business fields.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: "`0` indicates success. A non-zero value is a business error code, in\
                      \ which case\n`data` is usually empty.\n\nHTTP status codes use their standard semantics.\
                      \ A successful request normally\nreturns `200`; errors may return `400`, `401`,\
                      \ `403`, `408`, or another applicable\nstatus. Interpret the HTTP status together\
                      \ with the business `code`.\n\n- `401`: The user is not authenticated.\n- `403`:\
                      \ The current account is not authorized to use this function. Grant access\n  through\
                      \ User Permission."
                    x-enum-details:
                    - value: 0
                      label: Success
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: Bad request. Check the business error code in `code` and the error details in `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: The user is not authenticated, or the login session has expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: The current account is not authorized to use this feature. Grant the required permission
            to the account in User Permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: The request timed out. Check the business error code in `code` and the error details
            in `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
