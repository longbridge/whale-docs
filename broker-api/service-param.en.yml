                      - value: '1'
                        label: Real Time Payment Of Single Order
                      - value: '2'
                        label: Manual Review Of Timed Packing
                      - value: '3'
                        label: Manual Packing
                      - value: '4'
                        label: Batch Auto
                    support_region:
                      type: string
                      description: 'Filters results by Supported Bank Types.


                        Values are dynamic. Call `GET /v1/datasets/refs/cash_notice_bank_region` to retrieve
                        the current data dictionary, and use the returned entry''s `key` as this parameter''s
                        value.'
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/cash_notice_bank_region
                    support_bank_ids:
                      type: string
                      description: 'Filters results by Supported Bank Name.


                        Values are dynamic. Call `GET /v1/datasets/refs/cash_notice_region_bank_name`
                        to retrieve the current data dictionary, and use the returned entry''s `key` as
