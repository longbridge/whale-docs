  /atm/lb/bankaccount:
    put:
      operationId: atm_lb_bankaccount_edit
      summary: Edit Company Bank Account
      tags:
      - Service Parameter
      x-permission-key:
      - lb_hk_fund.companybank_update
      x-lbonly: false
      description: 'Uses the same request fields as Create Company Bank Account, wrapped in `lb_bank_account_info`.


        ### Request parameters


        - Required: `id` (Bank Account ID), `lb_bank_account_info` (Bank Account Info)

        - Optional: `audit_frontend_resource` (Audit Context)

        - See each field for its format, allowed values, default behavior, and business meaning.


        ### Result


        On success, the endpoint completes the described business operation. See the `200` response schema
        for returned data.'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              - lb_bank_account_info
              properties:
                id:
                  type: string
                  description: Bank Account ID associated with this request.
                lb_bank_account_info:
                  type: object
                  description: 'The field structure is identical to the request parameters of the "Add
                    Company Bank

                    Account" endpoint and is not expanded again here.'
                audit_frontend_resource:
                  type: object
                  description: Taken from the detail data prior to editing; not a business field.
            example:
              id: '1'
              lb_bank_account_info:
                nature_type: ''
                currency: USD
                account_name: ''
                region: ''
                bank_id: ''
                bank_account: ''
                bank_name: ''
                bank_region: ''
                swift_code: ''
                bank_addr: ''
                simple_name: ''
                deposit_types: []
                withdraw_types: []
                version: 1
              audit_frontend_resource: {}
      responses:
        '200':
          description: The request was processed successfully. The response `data` does not contain additional
            business fields.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: "`0` indicates success. A non-zero value is a business error code, in\
                      \ which case\n`data` is usually empty.\n\nHTTP status codes use their standard semantics.\
                      \ A successful request normally\nreturns `200`; errors may return `400`, `401`,\
                      \ `403`, `408`, or another applicable\nstatus. Interpret the HTTP status together\
                      \ with the business `code`.\n\n- `401`: The user is not authenticated.\n- `403`:\
                      \ The current account is not authorized to use this function. Grant access\n  through\
                      \ User Permission."
                    x-enum-details:
                    - value: 0
                      label: Success
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: Bad request. Check the business error code in `code` and the error details in `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: The user is not authenticated, or the login session has expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: The current account is not authorized to use this feature. Grant the required permission
            to the account in User Permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: The request timed out. Check the business error code in `code` and the error details
            in `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
    post:
      operationId: atm_lb_bankaccount_add
      summary: Add Company Bank Account
      tags:
      - Service Parameter
      x-permission-key:
      - lb_hk_fund.companybank_update
      x-lbonly: false
      description: 'Add Company Bank Account.


        ### Request parameters


        - Required: `nature_type` (Nature Type), `currency` (Currency), `account_name` (Account Name),
        `region` (Region), `bank_id` (Bank ID), `bank_account` (Bank Account), `bank_name` (Bank Name),
        `bank_region` (Bank Region), `swift_code` (Swift Code), `bank_addr` (Bank Address), `simple_name`
        (Simple Name), `deposit_types` (Deposit Types), `withdraw_types` (Withdraw Types), `version` (Version)

        - Optional: `bank_code` (Bank Code), `connect_customer_id` (Connect Customer ID), `net_customer_id`
        (Net Customer ID), `intermediary_swift_code` (Intermediary Swift Code), `support_exchange` (Support
        Exchange), `remark` (Remark)

        - See each field for its format, allowed values, and business meaning.


        ### Result


        On success, the endpoint completes the operation. See the `200` response schema for returned data
        and subsequent state information.'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - nature_type
              - currency
              - account_name
              - region
              - bank_id
              - bank_account
              - bank_name
              - bank_region
              - swift_code
              - bank_addr
              - simple_name
              - deposit_types
              - withdraw_types
              - version
              properties:
                nature_type:
                  type: string
                  description: Specifies Nature Type. This field is required.
                currency:
                  type: string
                  description: Currency code used for this request. This field is required.
                account_name:
                  type: string
                  description: Specifies Account Name. This field is required.
                region:
                  type: string
                  description: Specifies Region. This field is required.
                bank_id:
                  type: string
                  description: Bank ID associated with this request.
                bank_account:
                  type: string
                  description: Specifies Bank Account. This field is required.
                bank_code:
                  type: string
                  description: Specifies Bank Code.
                bank_name:
                  type: string
                  description: Specifies Bank Name. This field is required.
                bank_region:
                  type: string
                  description: Specifies Bank Region. This field is required.
                swift_code:
                  type: string
                  description: Specifies Swift Code. This field is required.
                bank_addr:
                  type: string
                  description: Specifies Bank Address. This field is required.
                connect_customer_id:
                  type: string
                  description: Connect Customer ID associated with this request.
                net_customer_id:
                  type: string
                  description: Net Customer ID associated with this request.
                simple_name:
                  type: string
                  description: Specifies Simple Name. This field is required.
                intermediary_swift_code:
                  type: string
                  description: Specifies Intermediary Swift Code.
                deposit_types:
                  type: array
                  description: Array elements {name, id}; items with empty name/id are filtered out before
                    submission.
                  items:
                    type: string
                withdraw_types:
                  type: array
                  description: Array elements {name, id, support_bank}; items with empty name/id are filtered
                    out before submission.
                  items:
                    type: string
                support_exchange:
                  type: string
                  description: 'Specifies Support Exchange.


                    **Allowed values:**

                    - `yes` - Yes

                    - `no` - No'
                  enum:
                  - 'yes'
                  - 'no'
                  x-enum-details:
                  - value: 'yes'
                    label: 'Yes'
                  - value: 'no'
                    label: 'No'
                remark:
                  type: string
                  description: Specifies Remark.
                version:
                  type: number
                  description: Always pass 1, for compatibility with the legacy interface.
            example:
              nature_type: ''
              currency: USD
              account_name: ''
              region: ''
              bank_id: ''
              bank_account: ''
              bank_code: ''
              bank_name: ''
              bank_region: ''
              swift_code: ''
              bank_addr: ''
              connect_customer_id: ''
              net_customer_id: ''
              simple_name: ''
              intermediary_swift_code: ''
              deposit_types: []
              withdraw_types: []
              support_exchange: 'yes'
              remark: ''
              version: 1
      responses:
        '200':
          description: The request was processed successfully. The response `data` does not contain additional
            business fields.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: "`0` indicates success. A non-zero value is a business error code, in\
                      \ which case\n`data` is usually empty.\n\nHTTP status codes use their standard semantics.\
                      \ A successful request normally\nreturns `200`; errors may return `400`, `401`,\
                      \ `403`, `408`, or another applicable\nstatus. Interpret the HTTP status together\
                      \ with the business `code`.\n\n- `401`: The user is not authenticated.\n- `403`:\
                      \ The current account is not authorized to use this function. Grant access\n  through\
                      \ User Permission."
                    x-enum-details:
                    - value: 0
                      label: Success
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: Bad request. Check the business error code in `code` and the error details in `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: The user is not authenticated, or the login session has expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: The current account is not authorized to use this feature. Grant the required permission
            to the account in User Permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: The request timed out. Check the business error code in `code` and the error details
            in `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
    get:
      operationId: atm_lb_bankaccount_detail
      summary: Company Bank Account Detail
      tags:
      - Service Parameter
      x-permission-key:
      - lb_hk_fund.companybank_query
      x-lbonly: false
      description: 'Retrieve the full configuration of a single company bank account by `id`.


        ### Request parameters


        - Required: `id` (company bank account id), supplied as a query parameter.


        ### Result


        On success, `data` contains the full configuration of the company bank account. The fields match
        the request fields of the "Add / Edit Company Bank Account" endpoints. See the `200` response
        fields for the meaning of each field.'
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: query
        required: true
        schema:
          type: string
        description: Company bank account id, supplied as a query parameter.
      responses:
        '200':
          description: The request was processed successfully. `data` contains the full configuration
            of the company bank account.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: "`0` indicates success. A non-zero value is a business error code, in\
                      \ which case\n`data` is usually empty.\n\nHTTP status codes use their standard semantics.\
                      \ A successful request normally\nreturns `200`; errors may return `400`, `401`,\
                      \ `403`, `408`, or another applicable\nstatus. Interpret the HTTP status together\
                      \ with the business `code`.\n\n- `401`: The user is not authenticated.\n- `403`:\
                      \ The current account is not authorized to use this function. Grant access\n  through\
                      \ User Permission."
                    x-enum-details:
                    - value: 0
                      label: Success
                  message:
                    type: string
                  data:
                    type: object
                    description: Full configuration of the company bank account.
                    properties:
                      nature_type:
                        type: string
                        description: 'Account nature. Common values: `client` (client account) and `house`
                          (house account).'
                      account_type_id:
                        type: string
                        description: Account type id.
                      lb_company_id:
                        type: string
                        description: Owning company id.
                      account_name:
                        type: string
                        description: Account name.
                      bank_account:
                        type: string
                        description: Bank account number.
                      bank_name:
                        type: string
                        description: Bank name.
                      bank_id:
                        type: integer
                        description: Bank id identifying the bank associated with this account.
                      bank_region:
                        type: string
                        description: Region where the bank is located.
                      region:
                        type: string
                        description: Country or region the account belongs to.
                      swift_code:
                        type: string
                        description: Swift code.
                      bank_addr:
                        type: string
                        description: Bank address.
                      simple_name:
                        type: string
                        description: Abbreviation.
                      deposit_types:
                        type: array
                        description: List of deposit methods. Each item describes one deposit method.
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: Deposit method id.
                            name:
                              type: string
                              description: Deposit method name.
                            support_bank:
                              type: integer
                              description: 'Whether the bank channel is supported: `0` not supported,
                                `1` supported.'
                      withdraw_types:
                        type: array
                        description: List of withdrawal methods. Each item describes one withdrawal method.
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: Withdrawal method id.
                            name:
                              type: string
                              description: Withdrawal method name.
                            support_bank:
                              type: integer
                              description: 'Whether the bank channel is supported: `0` not supported,
                                `1` supported.'
                      remark:
                        type: string
                        description: Remark.
                      support_exchange:
                        type: integer
                        description: 'Whether currency exchange is supported: `0` not supported, `1` supported.'
                        x-enum-details:
                        - value: 0
                          label: Not Supported
                        - value: 1
                          label: Support
                      net_customer_id:
                        type: string
                        description: Net Customer ID.
                      connect_customer_id:
                        type: string
                        description: Connect Customer ID (interbank routing number).
                      uen:
                        type: string
                        description: Unique Entity Number (UEN).
                      currency:
                        type: string
                        description: Currency code.
                      intermediary_swift_code:
                        type: string
                        description: Intermediary bank Swift code.
                      bank_code:
                        type: string
                        description: Bank code (such as the ABA routing number); may be empty.
              example:
                code: 0
                message: success
                data:
                  nature_type: client
                  account_type_id: ''
                  lb_company_id: ''
                  account_name: test
                  bank_account: '1234567890'
                  bank_name: DBS Bank
                  bank_id: 8
                  bank_region: SINGAPORE
                  region: SINGAPORE
                  swift_code: DBSSSGSG
                  bank_addr: 示例地址 Example Address
                  simple_name: '11'
                  deposit_types:
                  - id: '1'
                    name: 电汇
                    support_bank: 0
                  withdraw_types:
                  - id: '1'
                    name: 电汇
                    support_bank: 1
                  remark: ''
                  support_exchange: 0
                  net_customer_id: ''
                  connect_customer_id: ''
                  uen: ''
                  currency: USD
                  intermediary_swift_code: ''
                  bank_code: ''
        '400':
          description: Bad request. Check the business error code in `code` and the error details in `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: The user is not authenticated, or the login session has expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: The current account is not authorized to use this feature. Grant the required permission
            to the account in User Permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: The request timed out. Check the business error code in `code` and the error details
            in `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
  /atm/currency/config:
    put:
      operationId: atm_currency_config_edit
      summary: Edit Currency Config
      tags:
      - Service Parameter
      x-permission-key:
      - atm.update_current_config
      x-lbonly: false
      description: 'Edit Currency Config.


        ### Request parameters


        - Required: `id` (Config ID), `currency_iso` (Currency ISO), `currency` (Currency), `icon` (Icon),
        `logo` (Logo), `support_withdraw` (Support Withdraw), `support_exchange` (Support Exchange), `min_withdrawal_amount`
        (Min Withdrawal Amount), `min_exchange_amount` (Min Exchange Amount), `exchange_rate_precision`
        (Exchange Rate Precision), `amount_precision` (Amount Precision), `amount_round_mode` (Amount
        Round Mode), `standard_money` (Standard Money), `abbreviation_multi_name` (Abbreviation Multi
        Name), `multi_name` (Multi Name), `json_config` (JSON Config)

        - Optional: `cash_amount` (Min Cash Amount), `remarks` (Remarks), `audit_frontend_resource` (Audit
        Context)

        - See each field for its format, allowed values, and business meaning.


        ### Result


        On success, the endpoint completes the operation. See the `200` response schema for returned data
        and subsequent state information.'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              - currency_iso
              - currency
              - icon
              - logo
              - support_withdraw
              - support_exchange
              - min_withdrawal_amount
              - min_exchange_amount
              - exchange_rate_precision
              - amount_precision
              - amount_round_mode
              - standard_money
              - abbreviation_multi_name
              - multi_name
              - json_config
              properties:
                id:
                  type: string
                  description: Config ID associated with this request.
                currency_iso:
                  type: string
                  description: Specifies Currency ISO. This field is required.
                currency:
                  type: string
                  description: Currency code used for this request. This field is required.
