      tags:
      - Service Parameter
      x-lbonly: false
      description: 'Updates the company-level capital configuration. All input values are converted to
        strings before submission. This operation changes the live capital configuration and is extremely
        high risk.


        ### Request parameters


        - Required: `credit_currency` (Currency), `shareholder_fund` (Shareholder Fund), `shareholder_amount`
        (Shareholder Adjust Amount)

        - Optional: `audit_frontend_resource` (Audit Context)

        - See each field for its format, allowed values, default behavior, and business meaning.


        ### Risk notice


        > This operation may affect live business data or asset state. Verify the target records, amounts,
        quantities, and operation type before calling it.


        ### Result


        On success, the endpoint completes the described business operation. See the `200` response schema
        for returned data.'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - credit_currency
              - shareholder_fund
              - shareholder_amount
              properties:
                credit_currency:
                  type: string
                  description: Displayed disabled in the form; taken from the record currently being edited.
                shareholder_fund:
                  type: string
                  description: The integer part is at most 12–13 digits; the client validates length and
                    0 is not allowed.
                shareholder_amount:
                  type: string
                  description: The integer part is at most 12–13 digits; the client validates length and
                    0 is not allowed.
                audit_frontend_resource:
                  type: object
                  description: Records the original record content before submission, used for comparison
                    display in the approval ticket.
            example:
              credit_currency: USD
              shareholder_fund: '1000000'
              shareholder_amount: '500000'
              audit_frontend_resource: {}
