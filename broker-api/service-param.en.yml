                  - value: '1'
                    label: Restricted
                lb_bank_channel_id:
                  type: string
                  description: 'Dropdown; the candidate list depends on original_limit and which site
                    it is, drawing

                    from different dynamic enums: when original_limit=1 and on certain sites, values come

                    from withdraw_methods, otherwise from

                    withdraw_company_bank_channels (the edit state uses the cascade enum

