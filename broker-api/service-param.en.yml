  /risk/v1/account_credit_cfg/add_review:
    post:
      operationId: account_credit_cfg_add_review
      summary: Add Account Credit Config (Submit for Review)
      tags:
      - Service Parameter
      x-lbonly: false
      description: 'Create a per-account credit configuration for the specified securities account and
        submit it for review.


        The change does not take effect immediately. On success, an approval ticket is created and the
        configuration is applied only after the ticket is approved. The ticket ID is returned in `data.ticket_id`
        of the `200` response.


        ### Request parameters


        - Account scope: `member_id` (Member ID) and `aaid` (A/C No.) identify the target client and are
        both required.

        - Credit subject: `credit_type` (Credit Type) and `credit_currency` (Currency) define the scope
        of the configuration.

        - Limits and coefficients: `applicable`, `auto_credit_limit`, `credit_coefficient`, `ccf`, and
        `credit_fps` describe the credit limits and calculation parameters.

        - Coefficient rules: `credit_coefficient_rule_list` is an optional set of tiered credit-coefficient
        rules; when rules are supplied, also set `is_enable_credit_coefficient_rule` to `true`.

        - Dynamic adjustment: when `dynamic_credit_limit_adjustment_status` is enabled, provide `max_dynamic_credit_limit`
        and `min_dynamic_credit_limit`.

        - See each field for its format, allowed values, and business meaning.


        ### Result


        On success, an approval ticket is created and its ID is returned in `data.ticket_id`. The configuration
        takes effect only after the ticket is approved.'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - member_id
              - aaid
              - credit_type
              - credit_currency
              - applicable
              - auto_credit_limit
              - ccf
              - auto_credit
              - credit_coefficient
              properties:
                member_id:
                  type: string
                  description: Member ID of the target client, used to locate the client being credited.
                    This field is required.
                  example: '1000000000000000000'
                aaid:
                  type: string
                  description: A/C No. of the target client. This field is required.
                  example: H00000000
                credit_type:
                  type: string
                  description: 'Credit type. The value comes from the credit-type data dictionary. This
                    field is required.


                    Example: `1` denotes Margin Credit Limit.'
                  example: '1'
                credit_currency:
                  type: string
                  description: Currency of the credit limit. This field is required.
                  example: HKD
                applicable:
                  type: integer
                  description: Maximum credit amount that can be submitted from the app; must be a multiple
                    of `1000`. This field is required.
                  example: 1000000
                auto_credit_limit:
                  type: integer
                  description: Maximum limit for system auto-approval; must be a multiple of `1000`. This
                    field is required.
                  example: 1000000
                net_asset_ratio:
                  type: string
                  description: Declared net-asset-value multiple, passed as a string. Required only when
                    `credit_type` is `1` (Margin Credit Limit); omit for other credit types.
                  example: '1'
                credit_fps:
                  type: number
                  description: Account fundamental analysis factor (FPS), ranging from `0` to `1`. Required
                    only when `credit_type` is `1` (Margin Credit Limit).
                  example: 0.3
                ccf:
                  type: number
                  description: Credit conversion factor (CCF), passed as a decimal. It is entered as a
                    percentage (`0`–`100`) and must be divided by `100` before submission; for example,
                    submit `1` for `100%`. This field is required.
                  example: 1
                auto_credit:
                  type: boolean
                  description: 'Whether auto-credit is enabled: `true` to enable, `false` to disable.
                    This field is required.'
                  example: true
                credit_coefficient:
                  type: number
                  description: Default credit multiplier coefficient. This field is required.
                  example: 1
                is_enable_credit_coefficient_rule:
                  type: boolean
                  description: Whether tiered credit-coefficient rules are enabled. Set to `true` when
                    `credit_coefficient_rule_list` is non-empty.
                  example: true
                credit_coefficient_rule_list:
                  type: array
                  description: Array of tiered credit-coefficient rules. Each item maps a value range
                    of a given metric (such as client net assets) to a credit coefficient. Omit or pass
                    an empty array when no tiered rules are configured.
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        description: Metric type matched by the rule; the value comes from the credit-coefficient-rule-type
                          dictionary, for example `0` for client net assets.
                        example: '0'
                      coefficient:
                        type: string
                        description: Credit coefficient applied when this range is matched.
                        example: '1.5'
                      left_operator:
                        type: string
                        description: Comparison operator for the lower bound; use the "unlimited" marker
                          when the bound is open.
                        example: '0'
                      right_operator:
                        type: string
                        description: Comparison operator for the upper bound; use the "unlimited" marker
                          when the bound is open.
                        example: '1'
                      left_value:
                        type: string
                        description: Value of the lower bound; may be empty when the lower bound is unlimited.
                        example: '0'
                      right_value:
                        type: string
                        description: Value of the upper bound; may be empty when the upper bound is unlimited.
                        example: '1000000'
            example:
              member_id: '1000000000000000000'
              aaid: H00000000
              credit_type: '1'
              credit_currency: HKD
              applicable: 1000000
              auto_credit_limit: 1000000
              net_asset_ratio: '1'
              credit_fps: 0.3
              ccf: 1
              auto_credit: true
              credit_coefficient: 1
              is_enable_credit_coefficient_rule: true
              credit_coefficient_rule_list:
              - type: '0'
                coefficient: '1.5'
                left_operator: '0'
                right_operator: '1'
                left_value: '0'
                right_value: '1000000'
      responses:
        '200':
          description: The request was processed successfully. An approval ticket is created, and `data.ticket_id`
            contains the generated ticket ID.
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - data
                properties:
                  code:
                    type: integer
                    description: "`0` indicates success. A non-zero value is a business error code, in\
                      \ which case\n`data` is usually empty.\n\nHTTP status codes use their standard semantics.\
                      \ A successful request normally\nreturns `200`; errors may return `400`, `401`,\
                      \ `403`, `408`, or another applicable\nstatus. Interpret the HTTP status together\
                      \ with the business `code`.\n\n- `401`: The user is not authenticated.\n- `403`:\
                      \ The current account is not authorized to use this function. Grant access\n  through\
                      \ User Permission."
                    x-enum-details:
                    - value: 0
                      label: Success
                  message:
                    type: string
                  data:
                    type: object
                    description: Result of the review submission.
                    properties:
                      ticket_id:
                        type: string
                        description: ID of the approval ticket created after submission; use it to track
                          the approval progress.
              example:
                code: 0
                message: success
                data:
                  ticket_id: '100001'
        '400':
          description: Bad request. Check the business error code in `code` and the error details in `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: The user is not authenticated, or the login session has expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: The current account is not authorized to use this feature. Grant the required permission
            to the account in User Permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: The request timed out. Check the business error code in `code` and the error details
            in `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
