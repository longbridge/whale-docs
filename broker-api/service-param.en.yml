  /forex/query_support_currency:
    post:
      operationId: query_support_currency
      summary: Query Currency Pairs
      tags:
      - Service Parameter
      x-permission-key:
      - lb_hk_conversion.support_currency_update
      x-lbonly: false
      description: 'Query the "Currency Pairs" configuration list. All filter fields are optional; sending
        an empty

        object or omitting a field returns every currency-pair configuration.


        ### Request parameters


        - `created_at`: Filter by creation time. When omitted, no filtering is applied on this field.

        - `from_currency`: Filter by the debit (source) currency. When omitted, no filtering is applied
        on this field.

        - `to_currency`: Filter by the credit (target) currency. When omitted, no filtering is applied
        on this field.


        ### Result


        On success, `data.support_currency_resp` returns the currency-pair configuration records grouped
        by

        source currency. See the `200` response fields for the meaning of each field.'
      security:
      - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                created_at:
                  type: string
                  description: 'Filters by creation time. The value is a comma-joined date range `start,end`,
                    e.g. `2026-07-01,2026-07-01`.


                    When omitted, no filtering is applied on this field.'
                  example: 2026-07-01,2026-07-01
                from_currency:
                  type: string
                  description: 'Filters by the debit (source) currency, given as a three-letter currency
                    code.


                    Values are dynamic. Call `GET /v1/datasets/refs/atm_ref_currency_iso` to retrieve
                    the current data dictionary, and use the returned entry''s `key` as this parameter''s
                    value.


                    When omitted, no filtering is applied on this field.'
                  example: USD
                  x-value-source:
                    endpoint: GET /v1/datasets/refs/atm_ref_currency_iso
                to_currency:
                  type: string
                  description: 'Filters by the credit (target) currency, given as a three-letter currency
                    code.


                    Values are dynamic. Call `GET /v1/datasets/refs/atm_ref_currency_iso` to retrieve
                    the current data dictionary, and use the returned entry''s `key` as this parameter''s
                    value.


                    When omitted, no filtering is applied on this field.'
                  example: HKD
                  x-value-source:
                    endpoint: GET /v1/datasets/refs/atm_ref_currency_iso
            example:
              from_currency: USD
              to_currency: HKD
              created_at: 2026-07-01,2026-07-01
      responses:
        '200':
          description: 'The request was processed successfully. `data.support_currency_resp` is the list
            of currency-pair

            configuration records grouped by source currency.'
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - data
                properties:
                  code:
                    type: integer
                    description: "`0` indicates success. A non-zero value is a business error code, in\
                      \ which case\n`data` is usually empty.\n\nHTTP status codes use their standard semantics.\
                      \ A successful request normally\nreturns `200`; errors may return `400`, `401`,\
                      \ `403`, `408`, or another applicable\nstatus. Interpret the HTTP status together\
                      \ with the business `code`.\n\n- `401`: The user is not authenticated.\n- `403`:\
                      \ The current account is not authorized to use this function. Grant access\n  through\
                      \ User Permission."
                    x-enum-details:
                    - value: 0
                      label: Success
                  message:
                    type: string
                  data:
                    type: object
                    required:
                    - support_currency_resp
                    properties:
                      support_currency_resp:
                        type: array
                        description: '**Returned value:** List of currency-pair configuration records
                          matching the query

                          conditions, grouped by source currency. Each item represents one source currency
                          and

                          all of its target currencies.'
                        items:
                          type: object
                          properties:
                            from_currency:
                              type: string
                              description: '**Returned value:** Debit (source) currency, a three-letter
                                currency code.'
                            to_currency:
                              type: string
                              description: '**Returned value:** The target-currency configuration under
                                this source currency,

                                provided as a JSON-encoded string. When parsed, it is an object whose
                                `id_to_ccy`

                                field is an array of target currencies. Each array item contains:


                                - `id`: Unique identifier of this "source-target" record, used for editing
                                or deletion.

                                - `to_ccy`: Credit (target) currency, a three-letter currency code.

                                - `default_currency`: Whether this is the default target currency for
                                the source currency; `true` means default.'
                            created_at:
                              type: string
                              description: '**Returned value:** Created Time. The date or time format
                                follows the value returned by the API.'
              example:
                code: 0
                message: success
                data:
                  support_currency_resp:
                  - from_currency: USD
                    to_currency: '{"id_to_ccy":[{"id":"1001","to_ccy":"HKD","default_currency":true},{"id":"1002","to_ccy":"JPY","default_currency":false}]}'
                    created_at: '1780480167'
                  - from_currency: HKD
                    to_currency: '{"id_to_ccy":[{"id":"1003","to_ccy":"USD","default_currency":true}]}'
                    created_at: '1780480200'
        '400':
          description: Bad request. Check the business error code in `code` and the error details in `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: The user is not authenticated, or the login session has expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: The current account is not authorized to use this feature. Grant the required permission
            to the account in User Permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: The request timed out. Check the business error code in `code` and the error details
            in `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
