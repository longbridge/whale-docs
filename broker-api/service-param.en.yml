      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - params
              properties:
                params:
                  type: object
                  description: The set of fields that make up the daily limit configuration.
                  required:
                  - lb_bank_name
                  - lb_bank_account_ids
                  - bank_operation_types_ids
                  - currency
                  - limit_amount
                  - alarm_amount
                  properties:
                    lb_bank_name:
                      type: string
