      summary: Edit Daily Limit
      tags:
      - Service Parameter
      x-permission-key:
      - lb_hk_outcashpackagerule.bankbalance_update
      x-lbonly: false
      description: 'Edit an existing daily limit configuration.


        The target record is located by `id` and updated with the fields inside `params`. The company
        bank name cannot be changed when editing; the remaining fields can be updated.


        ### Request parameters


        - Required: `id` (Daily Limit Setup ID), used to locate the record to edit.

        - The fields to update are wrapped in the `params` object. Required: `params.lb_bank_name` (company
        bank name), `params.lb_bank_account_ids` (bank account), `params.bank_operation_types_ids` (withdrawal
        method), `params.currency` (currency), `params.limit_amount` (initial quota), `params.alarm_amount`
        (alarm level of the remaining daily quota); optional: `params.remark` (remark).

