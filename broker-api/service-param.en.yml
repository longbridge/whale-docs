                        **Allowed values:**

                        - `1` - Enabled

                        - `2` - Disabled'
                      enum:
                      - '1'
                      - '2'
                      x-enum-details:
                      - value: '1'
                        label: Enabled
                      - value: '2'
                        label: Disabled
                    audit_status:
                      type: string
                      description: 'Filters results by Audit Status.


                        **Allowed values:**

                        - `0` - Init

                        - `1` - New pending review

                        - `2` - Waiting Edit Review

                        - `3` - Delete pending approval'
                      enum:
                      - '0'
                      - '1'
                      - '2'
                      - '3'
                      x-enum-details:
                      - value: '0'
                        label: Init
                      - value: '1'
                        label: New pending review
                      - value: '2'
                        label: Waiting Edit Review
                      - value: '3'
                        label: Delete pending approval
                    original_limit:
                      type: string
                      description: 'Filters results by Original Limit.


                        **Allowed values:**

                        - `0` - Unrestricted

                        - `1` - Restricted'
                      enum:
                      - '0'
                      - '1'
                      x-enum-details:
                      - value: '0'
                        label: Unrestricted
                      - value: '1'
                        label: Restricted
                    rule_codes:
                      type: string
                      description: 'Filters results by Hit Rules.


                        Values are dynamic. Call `GET /v1/datasets/refs/risk_rule_indicators_withdraw`
                        to retrieve the current data dictionary, and use the returned entry''s `key` as
