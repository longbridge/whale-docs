        ### Request parameters


        None. The credit currency and aggregation scope are determined by the server based on the current
        tenant and account permissions.


        ### Result


        On success, `data` contains the company-level credit currency, total financing limit, and total
        trading limit along with their used, remaining, and alert-threshold values. It also includes per-currency
        financing information in `cp_finance_info_list`, plus two per-currency limit breakdowns: `normal_margin_list`
        (normal margin) and `intraday_margin_list` (intraday). See the `200` response fields for the meaning
        of each field.'
