                    type: object
                    description: Company financing/trading limit summary. All `cp_total_*` aggregate amounts
                      are denominated in the `credit_currency` currency. Amount fields are integer or
                      decimal strings.
                    properties:
                      credit_currency:
                        type: string
                        description: Credit currency, such as `HKD` or `USD`. All `cp_total_*` aggregate
                          amounts are denominated in this currency.
                      cp_total_finance:
                        type: string
                        description: Company total financing limit (in the credit currency).
                      account_finance_total:
                        type: string
                        description: Total approved financing limit at the account level (in the credit
                          currency).
                      cp_total_finance_used:
                        type: string
                        description: Company financing limit used (in the credit currency).
                      cp_total_finance_used_warning:
                        type: string
                        description: Alert threshold for the company's approved financing limit (in the
                          credit currency).
                      cp_total_finance_remained:
                        type: string
                        description: Company remaining available financing limit (in the credit currency).
                      cp_total_trading_limit:
                        type: string
                        description: Company total trading limit (in the credit currency).
                      cp_total_trading_limit_reviewed:
                        type: string
                        description: Currently approved trading limit (in the credit currency).
                      cp_total_trading_limit_reviewed_warning:
                        type: string
                        description: Alert threshold for the approved trading limit (in the credit currency).
                      cp_total_trading_limit_used:
                        type: string
                        description: Trading limit used (in the credit currency).
                      cp_total_trading_limit_used_warning:
                        type: string
                        description: Alert threshold for the trading limit used (in the credit currency).
                      cp_finance_info_list:
