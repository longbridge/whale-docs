  /v1/datasets/booking_va_contracts:
    get:
      operationId: booking_va_contracts
      summary: Virtual Asset Contract
      tags:
        - VA Clearing Management
      x-permission-key:
        - lb_hk_clearing.billing_va_contracts
      x-lbonly: false
      description: |-
        Queries Virtual Asset Contract data. Combine business filters in `filters`, and use `page`, `page_size`, and `orderBy` to control pagination and sorting.

        ### Response

        On success, the API returns the matching records and pagination metadata. See each filter field for its purpose, allowed values, and dynamic value source.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: Filters. Combines business filters. Omit a filter field to disable that filter.
                  properties:
                    'no':
                      type: string
                      description: Contract No. Filters results by Contract No.
                    aaid:
                      type: string
                      description: Client. Filters results by Client.
                    contract.trade_date:
                      type: object
                      description: Trade Date. Filters results by Trade Date.
                      properties:
                        gte:
                          type: string
                          description: Greater Than or Equal. Inclusive lower bound of the filter range.
                          format: date
                        lte:
                          type: string
                          description: Less Than or Equal. Inclusive upper bound of the filter range.
                          format: date
                    market:
                      type: string
                      description: |-
                        Market. Filters results by Market.

                        Values are dynamic. Call `GET /v1/datasets/refs/clearing_config_markets` to retrieve the current data dictionary, and use the returned entry's `key` as this parameter's value.
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/clearing_config_markets
                    counter_id:
                      type: string
                      description: Counter ID. Filters results by Counter ID.
                    direction:
                      type: string
                      description: |-
                        Trade Direction. Filters results by Trade Direction.

                        **Allowed values:**
                        - `1` - Buy
                        - `2` - Sell
                      enum:
                        - '1'
                        - '2'
                    settlement_channel:
                      type: string
                      description: |-
                        Settlement Channel. Filters results by Settlement Channel.

                        Values are dynamic. Call `GET /v1/datasets/refs/billing_settlement_channel` to retrieve the current data dictionary, and use the returned entry's `key` as this parameter's value.
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/billing_settlement_channel
                    state:
                      type: string
                      description: |-
                        Status. Filters results by Status.

                        **Allowed values:**
                        - `2` - To Be Calculated
                        - `3` - To Be Charged
                        - `4` - To Be Settled
                        - `5` - Settlement Completed
                        - `6` - Equity settled
                        - `1` - Init
                        - `-1` - --
                      enum:
                        - '2'
                        - '3'
                        - '4'
                        - '5'
                        - '6'
                        - '1'
                        - '-1'
                    currency:
                      type: string
                      description: |-
                        Currency. Filters results by Currency.

                        Values are dynamic. Call `GET /v1/datasets/refs/tenant_currencies` to retrieve the current data dictionary, and use the returned entry's `key` as this parameter's value.
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/tenant_currencies
                page:
                  type: integer
                  description: Page. Page number to retrieve, starting from `1`.
                page_size:
                  type: integer
                  description: Page Size. Number of records to return per page.
                orderBy:
                  type: array
                  description: Order By. Array of sorting rules. Each item defines a sort field and direction.
                  items:
                    type: object
            example:
              filters: {}
              page: 1
              page_size: 20
              orderBy: []
      responses:
        '200':
          description: On success, returns paginated Virtual Asset Contract records together with pagination metadata such as the page number, page size, and total record count.
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                    description: |-
                      `0` indicates success. A non-zero value is a business error code, in which case
                      `data` is usually empty.

                      HTTP status codes use their standard semantics. A successful request normally
                      returns `200`; errors may return `400`, `401`, `403`, `408`, or another applicable
                      status. Interpret the HTTP status together with the business `code`.

                      - `401`: The user is not authenticated.
                      - `403`: The current account is not authorized to use this function. Grant access
                        through User Permission.
                  message:
                    type: string
                  data:
                    type: object
                    required:
                      - list
                      - total
                    properties:
                      list:
                        type: array
                        description: List. **Returned value:** List of list.
                        items:
                          type: object
                          properties:
                            'no':
                              type: string
                              description: Contract No. **Returned value:** Contract No.
                            ledger_date:
                              type: string
                              description: Ledger Date. **Returned value:** Ledger Date. The date or time format follows the value returned by the API.
                            trade_date:
                              type: string
