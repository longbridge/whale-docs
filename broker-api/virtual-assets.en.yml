openapi: 3.1.1
info:
  title: Longport Whale Broker API
  description: Institution-grade server-to-server API for brokers running on Longport Whale.
  version: 2.0.0
servers:
  - url: https://b-api.longbridge.xyz
    description: Test
  - url: https://b-api.lbkrs.com
    description: Production
security:
  - bearerAuth: []
tags:
  - name: VA Clearing Management
paths:
  /billing/va/current_busin:
    get:
      operationId: billing_va_current_busin
      summary: Get Current VA Clearing Business Status
      tags:
        - VA Clearing Management
      x-permission-key:
        - lb_hk_clearing.billing_va_contracts
      x-lbonly: false
      description: |-
        Get Current VA Clearing Business Status.

        ### Request parameters

        This endpoint does not accept business parameters.

        ### Result

        On success, the endpoint returns the requested data. See the `200` response schema for field definitions.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The request was processed successfully. `data` contains `records`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      `0` indicates success. A non-zero value is a business error code, in which case
                      `data` is usually empty.

                      HTTP status codes use their standard semantics. A successful request normally
                      returns `200`; errors may return `400`, `401`, `403`, `408`, or another applicable
                      status. Interpret the HTTP status together with the business `code`.

                      - `401`: The user is not authenticated.
                      - `403`: The current account is not authorized to use this function. Grant access
                        through User Permission.
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      records:
                        type: array
                        description: Clearing Step Records. **Returned value:** List of clearing step records.
                        items:
                          type: object
                          properties:
                            state:
                              type: number
                              description: |-
                                State. 0=Pending, 1=In progress, 2=Success, 3=Failed

                                **Allowed values:**
                                - `0` - Pending
                                - `1` - In Progress
                                - `2` - Success
                                - `3` - Failed
                              enum:
                                - '0'
                                - '1'
                                - '2'
                                - '3'
              example:
                code: 0
                message: success
                data:
                  records:
                    - state: 0
        '400':
          description: Bad request. Check the business error code in `code` and the error details in `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: The user is not authenticated, or the login session has expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: The current account is not authorized to use this feature. Grant the required permission to the account in User Permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: The request timed out. Check the business error code in `code` and the error details in `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
      x-mint:
        href: /en/api-reference/billing_va_current_busin
        metadata:
          sidebarTitle: Get Current VA Clearing Business Status
