openapi: 3.1.1
info:
  title: Longport Whale 券商 API
  description: 面向使用 Longport Whale 的券商提供机构级服务端 API。
  version: 2.0.0
servers:
- url: https://b-api.longbridge.xyz
  description: 测试环境
- url: https://b-api.lbkrs.com
  description: 生产环境
security:
- bearerAuth: []
tags:
- name: 可疑事件监控
paths:
  /account/kyc/import:
    post:
      operationId: kyc_import
      summary: 批量导入可疑事件
      tags:
      - 可疑事件监控
      x-permission-key:
      - account.apply_edit_member
      - account.modify_transaction_channel
      - account.sem_update
      - account.suspend_account
      - account.update_appid
      - b2b_customer.submit_account
      - kyc.blacklist_hit_status
      - kyc.blacklist_members
      - kyc.blacklist_names
      - kyc.update_account_info
      - ticket.import_agent
      - ticket.import_relation
      x-lbonly: false
      description: 'type 固定传 SuspiciousIncident。


        ### 请求参数


        - 必填：`type`（导入文件类型）

        - 可选：`s3_key`（上传文件 S3 Key）、`name`（名称）、`filename`（文件名）、`base_account_ids`（基础账号ID列表）、`audit_frontend_resource`（审计上下文）

        - 各字段的格式、取值范围、默认行为和业务含义见对应字段说明。


        ### 处理结果


        成功时完成所述业务操作，具体返回内容见 `200` 响应定义。'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - type
              properties:
                s3_key:
                  type: string
                  description: 文件上传后返回的对象存储 Key，用于定位本次请求处理的文件。
                name:
                  type: string
                  description: 用于指定「名称」。
                type:
                  type: string
                  description: 可疑事件导入时固定传入 `SuspiciousIncident`。
                filename:
                  type: string
                  description: 本次请求处理的文件名，包含文件扩展名。
                base_account_ids:
                  type: array
                  description: 基础账号ID列表，以 JSON 数组形式提交。
                  items:
                    type: string
                audit_frontend_resource:
                  type: object
                  description: 调用方提交的审计上下文，用于记录本次操作。
            example:
              s3_key: ''
              name: ''
              type: SuspiciousIncident
              filename: ''
              base_account_ids: []
              audit_frontend_resource: {}
      responses:
        '200':
          description: 请求处理成功。响应的 `data` 不包含额外业务字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: '0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。


                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`

                      判断具体结果。


                      - `401`：未登录。

                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。'
                    x-enum-details:
                    - value: 0
                      label: 成功
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登录或登录状态已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 当前账号未获得该功能授权。请在 User Permission 中为该账号开通相应权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 请求处理超时。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
  /account/kyc/submit_suspicious_event:
    post:
      operationId: submit_suspicious_event
      summary: 新建可疑事件
      tags:
      - 可疑事件监控
      x-permission-key:
      - account.sem_update
      - kyc.suspicious_incident_monitoring
      x-lbonly: true
      description: '新建可疑事件。


        ### 请求参数


        - 必填：`aaid`（证券账号）

        - 可选：`trigger_indicator`（触发指标）、`trigger_remark`（触发备注）、`last_alert_date`（最近预警日期）

        - 各字段的格式、取值范围和业务含义见对应字段说明。


        ### 处理结果


        成功时完成上述业务操作；后续状态和返回数据以 `200` 响应定义为准。'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - aaid
              properties:
                aaid:
                  type: string
                  description: 本次请求关联的证券账号。此字段为必填项。
                trigger_indicator:
                  type: string
                  description: 用于指定「触发指标」。
                trigger_remark:
                  type: string
                  description: 用于指定「触发备注」。
                last_alert_date:
                  type: string
                  description: 本次请求对应的最近预警日期。请按接口约定的日期格式提交。
            example:
              aaid: H00000000
              trigger_indicator: ''
              trigger_remark: ''
              last_alert_date: 2026-07-10
      responses:
        '200':
          description: 请求处理成功。响应的 `data` 不包含额外业务字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: '0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。


                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`

                      判断具体结果。


                      - `401`：未登录。

                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。'
                    x-enum-details:
                    - value: 0
                      label: 成功
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      event_id:
                        type: string
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登录或登录状态已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 当前账号未获得该功能授权。请在 User Permission 中为该账号开通相应权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 请求处理超时。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
  /account/kyc/edit_suspicious_event:
