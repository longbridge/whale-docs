        '401':
          description: 未登录或登录状态已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 当前账号未获得该功能授权。请在 User Permission 中为该账号开通相应权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 请求处理超时。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
  /v1/datasets/aml_suspicious_events/download:
    post:
      operationId: aml_suspicious_events_download
      summary: 可疑事件列表导出
      tags:
      - 可疑事件监控
      x-permission-key:
      - account.sem_query
      x-lbonly: false
      description: '将「可疑事件列表」数据导出为文件。`filters` 决定导出范围，`down_fields` 可限制导出字段。


        ### 导出模式


        - `mode: 0`：同步导出，成功后直接返回下载地址。

        - `mode: 1`：异步导出，先返回 `file_download_id`；随后调用 `GET /v1/datasets/download/{id}` 获取下载地址。

        - 不再需要导出记录时，可调用 `DELETE /v1/datasets/download/{id}` 删除。'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 字段同 aml_suspicious_events.yaml（query 能力）里的 filters
                  properties:
                    member_id:
                      type: string
                      description: 用于按「客户」筛选结果。
                    tigger_indicator:
                      type: string
                      description: '用于按「触发指标」筛选结果。


                        支持多选；提交时使用英文逗号（`,`）拼接多个值。不传时不按此字段筛选。


                        **可选值：**

                        - `1` - 表示出入金异常

                        - `2` - 表示交易异常

                        - `3` - 表示其他'
                      example: 1,2
                      enum:
                      - '1'
                      - '2'
                      - '3'
                      x-enum-details:
                      - value: '1'
                        label: 出入金异常
                      - value: '2'
                        label: 交易异常
                      - value: '3'
                        label: 其他
                    process_status:
                      type: string
                      description: '用于按「审核状态」筛选结果。


                        支持多选；提交时使用英文逗号（`,`）拼接多个值。不传时不按此字段筛选。


                        **可选值：**

                        - `1` - 表示待跟进

                        - `2` - 表示跟进中

                        - `3` - 表示待审批

                        - `4` - 表示已完成'
                      example: 1,2
                      enum:
                      - '1'
                      - '2'
                      - '3'
                      - '4'
                      x-enum-details:
                      - value: '1'
                        label: 待跟进
                      - value: '2'
                        label: 跟进中
                      - value: '3'
                        label: 待审批
                      - value: '4'
                        label: 已完成
                    created_at:
                      type: object
                      description: 用于按「创建日期」筛选结果。
                      properties:
                        gte:
                          type: string
                          format: date
                          description: 筛选范围的下限，匹配值包含该值。
                        lte:
                          type: string
                          format: date
                          description: 筛选范围的上限，匹配值包含该值。
                    updated_at:
                      type: string
                      format: date
                      description: 用于按「早于更新日期」筛选结果。
                    created_by:
                      type: string
                      description: '用于按「创建人」筛选结果。


                        候选值会动态变化。请调用 `GET /v1/datasets/refs/operators` 获取当前可用的数据字典，并使用返回项的 `key` 作为本参数值。'
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/operators
                mode:
                  type: integer
                  default: 0
                  description: '不传时默认 0（同步）


                    **可选值：**

                    - `0` - 表示同步

                    - `1` - 表示异步'
                  enum:
                  - 0
                  - 1
                  x-enum-details:
                  - value: 0
                    label: 同步
                  - value: 1
                    label: 异步
                ext:
                  type: string
                  description: '下载文件格式。不传时默认为 `csv`。


                    **可选值：**

                    - `csv` - 表示 CSV

                    - `xlsx` - 表示 Excel'
                  enum:
                  - csv
                  - xlsx
                file_name:
                  type: string
                  description: 导出文件名称。不传时由服务端生成。
                down_fields:
                  type: array
                  description: 不传时导出全部字段；取值范围见 items.enum（同查询接口 data.list.items 的字段列表）
                  items:
                    type: string
                    enum:
                    - event_no
                    - member_id
                    - real_name
                    - en_name
                    - origin_id
                    - last_alert_date
                    - tigger_indicator
                    - tigger_indicator_val
                    - tigger_indicator_remark
                    - remark
                    - created_at
                    - created_by
                    - created_by_val
                    - data_source
                    - data_source_val
                    - process_status
                    - process_status_val
                    - result_status
                    - result_status_val
                    - last_reviewed_by
                    - last_reviewed_by_val
                    - last_reviewed_at
                    - updated_at
                ticket_content:
                  type: string
                  description: 模板配置了下载审核工单时，供审批人查看
                ticket_preview_url:
                  type: string
                  description: 导出审批详情地址；仅在导出需要审批时使用。
                hide:
                  type: integer
                  description: '是否在下载记录列表中隐藏本次导出记录。


                    **可选值：**

                    - `0` - 表示不隐藏

                    - `1` - 表示隐藏'
                  enum:
                  - 0
                  - 1
                  x-enum-details:
                  - value: 0
                    label: 不隐藏
                  - value: 1
                    label: 隐藏
            example:
              filters: {}
              mode: 0
              ext: csv
              file_name: ''
              remark: ''
              down_fields: []
              ticket_content: ''
              ticket_preview_url: ''
              hide: 0
      responses:
        '200':
          description: 成功时返回「可疑事件列表导出」任务信息。同步导出直接提供下载地址；异步导出提供用于后续查询的 `file_download_id`。
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - data
                properties:
                  code:
                    type: integer
                    description: '0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。


                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`

                      判断具体结果。


                      - `401`：未登录。

                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。'
                    x-enum-details:
                    - value: 0
                      label: 成功
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      url:
                        type: string
                        description: '同步模式（`mode: 0`）下返回，异步模式下为空'
                      file_download_id:
                        type: string
                        description: '异步模式（`mode: 1`）下返回，即 `GET /v1/datasets/download/{id}` /

                          `DELETE /v1/datasets/download/{id}` 路径中的 id：GET 获取最终下载地址，DELETE 删除该导出记录。'
                      ticket_id:
                        type: string
                        description: '**返回值：** 审批工单 ID。仅在本次操作触发审批流程时返回。'
              example:
                code: 0
                message: success
                data:
                  url: https://b-api.longbridge.xyz/download/export_result.csv
                  file_download_id: ''
                  ticket_id: ''
        '400':
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登录或登录状态已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 当前账号未获得该功能授权。请在 User Permission 中为该账号开通相应权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 请求处理超时。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
      x-dataset-parent:
        method: GET
        path: /v1/datasets/aml_suspicious_events
        operationId: aml_suspicious_events
  /v1/datasets/aml_suspicious_events:
    get:
      operationId: aml_suspicious_events
      summary: 可疑事件列表
      tags:
      - 可疑事件监控
      x-permission-key:
      - account.sem_query
      x-lbonly: false
      description: '查询「可疑事件列表」数据，可通过 `filters` 组合业务筛选条件，并使用 `page`、`page_size` 控制分页。


        ### 返回结果


        成功时返回匹配的记录列表及分页信息。各过滤字段的用途、可选值和动态数据来源见对应字段说明。'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 组合业务过滤条件。省略某个过滤字段时，不按该字段筛选。
                  properties:
                    member_id:
                      type: string
                      description: 用于按「客户」筛选结果。
                    tigger_indicator:
                      type: string
                      description: '用于按「触发指标」筛选结果。


                        支持多选；提交时使用英文逗号（`,`）拼接多个值。不传时不按此字段筛选。


                        **可选值：**

                        - `1` - 表示出入金异常

                        - `2` - 表示交易异常

                        - `3` - 表示其他'
                      example: 1,2
                      enum:
                      - '1'
                      - '2'
                      - '3'
                      x-enum-details:
                      - value: '1'
                        label: 出入金异常
                      - value: '2'
                        label: 交易异常
                      - value: '3'
                        label: 其他
                    process_status:
                      type: string
                      description: '用于按「审核状态」筛选结果。


