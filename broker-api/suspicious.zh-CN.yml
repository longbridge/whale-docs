                      description: |-
                        用于按「审核状态」筛选结果。

                        支持多选；提交时使用英文逗号（`,`）拼接多个值。不传时不按此字段筛选。
                      example: Pending Follow-up
                      enum:
                        - '1'
                        - '2'
                        - '3'
                        - '4'
                      x-enum-details:
                        - value: '1'
                          label: 待跟进
                        - value: '2'
                          label: 跟进中
                        - value: '3'
                          label: 待审批
                        - value: '4'
                          label: 已完成
                    created_at:
                      type: object
                      description: 用于按「创建日期」筛选结果。
                      properties:
