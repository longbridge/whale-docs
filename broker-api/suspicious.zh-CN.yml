                          format: date
                          description: 筛选范围的上限，匹配值包含该值。
                    updated_at:
                      type: string
                      format: date
                      description: 用于按「早于更新日期」筛选结果。
                      example: '1782843342'
                    created_by:
                      type: string
                      description: |-
                        用于按「创建人」筛选结果。

                        候选值会动态变化。请调用 `GET /v1/datasets/refs/operators` 获取当前可用的数据字典，并使用返回项的 `key` 作为本参数值。
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/operators
                      example: 张三
                page:
                  type: integer
                  description: 要查询的页码，从 `1` 开始。
                page_size:
                  type: integer
                  description: 每页返回的记录数量。
            example:
              filters: {}
              page: 1
              page_size: 20
      responses:
