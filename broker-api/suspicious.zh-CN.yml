  /v1/datasets/aml_suspicious_events:
    post:
      operationId: aml_suspicious_events
      summary: 可疑事件列表
      tags:
        - 可疑事件监控
      x-permission-key:
        - account.sem_query
      x-lbonly: false
      description: |-
        查询反洗钱（AML）可疑事件列表，用于合规团队跟进与审核由交易监控或人工上报产生的可疑事件。

        ### 请求参数

        - 通过 `filters` 组合业务筛选条件（可选字段见下方 filters 字段说明），并使用 `page`、`page_size`、`orderBy` 控制分页与排序。

        ### 业务说明

        - 数据来源于反洗钱可疑事件库，既包含交易监控系统（如 `WBO_TM`）自动命中规则产生的事件，也包含人工上报（`Manual Entry`）的事件。

        - 每条记录对应一个可疑事件，携带事件编号、关联客户（客户号、中英文姓名、证件标识）、触发指标、数据来源、最近告警日期，以及处理状态与处理结果、最近审核人与审核时间、创建人与创建时间等信息。

        - 处理状态覆盖待跟进、跟进中、待审批、已完成等环节，合规人员据此对可疑事件进行分类跟进、审核与结案。

        ### 返回结果

        成功时返回匹配的记录列表及分页信息。返回列含义见响应定义。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 组合业务过滤条件。省略某个过滤字段时，不按该字段筛选。
                  properties:
                    member_id:
                      type: string
                      description: 用于按「客户」筛选结果。
                    tigger_indicator:
                      type: string
                      description: |-
                        用于按「触发指标」筛选结果。

                        支持多选；提交时使用英文逗号（`,`）拼接多个值。不传时不按此字段筛选。
                      example: Trading Anomaly
                      enum:
                        - '1'
                        - '2'
                        - '3'
                      x-enum-details:
                        - value: '1'
