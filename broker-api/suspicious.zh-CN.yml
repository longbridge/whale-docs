openapi: 3.1.1
info:
  title: Longport Whale 券商 API
  description: 面向使用 Longport Whale 的券商提供机构级服务端 API。
  version: 2.0.0
servers:
  - url: https://b-api.longbridge.xyz
    description: 测试环境
  - url: https://b-api.lbkrs.com
    description: 生产环境
security:
  - bearerAuth: []
tags:
  - name: 可疑事件监控
paths:
  /account/kyc/import:
    post:
      operationId: kyc_import
      summary: 批量导入可疑事件
      tags:
        - 可疑事件监控
      x-permission-key:
        - account.apply_edit_member
        - account.modify_transaction_channel
        - account.sem_update
        - account.suspend_account
        - account.update_appid
        - b2b_customer.submit_account
        - kyc.blacklist_hit_status
        - kyc.blacklist_members
        - kyc.blacklist_names
        - kyc.update_account_info
        - ticket.import_agent
        - ticket.import_relation
      x-lbonly: false
      description: |-
        通过上传文件批量导入可疑事件（反洗钱可疑事件），一次性为多个证券账号创建可疑事件记录。

        ### 请求参数

        - 必填：`type`（导入文件类型），可疑事件导入时固定传入 `SuspiciousIncident`。
        - 可选：`s3_key`（已上传文件的 S3 Key）、`name`（名称）、`filename`（文件名）、`base_account_ids`（基础账号 ID 列表）、`audit_frontend_resource`（调用方提供的审计上下文）。
        - 各字段的格式、取值范围、默认行为和业务含义见对应字段说明。

        ### 业务说明

        导入前应先完成文件上传并取得 `s3_key`，导入内容以文件中的记录为准。建议先通过导入预检查接口确认文件格式与数据无误后再提交。

        ### 风险提示

        此操作会批量新建可疑事件记录，影响后续的反洗钱审核与合规处理流程。调用前请确认导入文件内容和 `type` 无误。

        ### 处理结果

        成功时完成批量导入；具体返回内容见 `200` 响应定义。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - s3_key
                - type
                - admin_url
              properties:
                s3_key:
                  type: string
                  description: 文件上传后返回的对象存储 Key，用于定位本次请求处理的文件。
                name:
                  type: string
                  description: 用于指定「名称」。
                type:
                  type: string
                  description: 可疑事件导入时固定传入 `SuspiciousIncident`。
                filename:
                  type: string
                  description: 本次请求处理的文件名，包含文件扩展名。
                base_account_ids:
                  type: array
                  description: 基础账号ID列表，以 JSON 数组形式提交。
                  items:
                    type: string
                audit_frontend_resource:
                  type: object
                  description: 调用方提交的审计上下文，用于记录本次操作。
                service:
                  type: string
                  description: |-
                    文件上传所属服务标识
                admin_url:
                  type: string
                  description: |-
                    发起导入时的管理后台页面 URL，由调用方自动附加
            example:
              s3_key: ''
              name: ''
              type: SuspiciousIncident
              filename: ''
              base_account_ids: []
              audit_frontend_resource: {}
      responses:
        '200':
          description: 请求处理成功。响应的 `data` 不包含额外业务字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。

                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`
                      判断具体结果。

                      - `401`：未登录。
                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。
                    x-enum-details:
                      - value: 0
                        label: 成功
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登录或登录状态已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 当前账号未获得该功能授权。请在 User Permission 中为该账号开通相应权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 请求处理超时。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
  /account/kyc/submit_suspicious_event:
    post:
      operationId: submit_suspicious_event
      summary: 新建可疑事件
      tags:
        - 可疑事件监控
      x-permission-key:
        - account.sem_update
        - kyc.suspicious_incident_monitoring
      x-lbonly: false
      description: |-
        为指定证券账号新建一条可疑事件（反洗钱可疑事件）记录。

        ### 请求参数

        - 必填：`aaid`（本次请求关联的证券账号）。
        - 可选：`trigger_indicator`（触发指标）、`trigger_remark`（触发备注）、`last_alert_date`（最近预警日期）。
        - 各字段的格式、取值范围和业务含义见对应字段说明。

        ### 业务说明

        新建的可疑事件将进入反洗钱审核与合规处理流程，`trigger_indicator` 与 `trigger_remark` 用于说明触发原因。

        ### 风险提示

        此操作会新建可疑事件记录并触发后续合规审核流程。调用前请确认 `aaid` 及触发信息无误。

        ### 处理结果

        成功时完成可疑事件创建；后续状态和返回数据以 `200` 响应定义为准。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - aaid
              properties:
                aaid:
                  type: string
                  description: 本次请求关联的证券账号。此字段为必填项。
                trigger_indicator:
                  type: string
                  description: 用于指定「触发指标」。
                trigger_remark:
                  type: string
                  description: 用于指定「触发备注」。
                last_alert_date:
                  type: string
                  description: 本次请求对应的最近预警日期。请按接口约定的日期格式提交。
            example:
              aaid: H00000000
              trigger_indicator: ''
              trigger_remark: ''
              last_alert_date: 2026-07-10
      responses:
        '200':
          description: 请求处理成功。响应的 `data` 不包含额外业务字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。

                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`
                      判断具体结果。

                      - `401`：未登录。
                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。
                    x-enum-details:
                      - value: 0
                        label: 成功
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      event_id:
                        type: string
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登录或登录状态已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 当前账号未获得该功能授权。请在 User Permission 中为该账号开通相应权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 请求处理超时。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
  /account/kyc/edit_suspicious_event:
    post:
      operationId: edit_suspicious_event
      summary: 编辑可疑事件
      tags:
        - 可疑事件监控
      x-permission-key:
        - account.sem_update
        - kyc.suspicious_incident_monitoring
      x-lbonly: false
      description: |-
        编辑已存在的可疑事件（反洗钱可疑事件）记录，更新其触发信息与预警日期。

        ### 请求参数

        - 必填：`event_id`（事件 ID，标识待编辑的可疑事件）、`aaid`（关联的证券账号）、`trigger_indicator`（触发指标）、`trigger_remark`（触发备注）、`last_alert_date`（最近预警日期）。
        - 可选：`audit_frontend_resource`（调用方提供的审计上下文）。
        - 各字段的格式、取值范围和业务含义见对应字段说明。

        ### 业务说明

        通过 `event_id` 定位目标可疑事件，并以本次请求提交的字段值覆盖原有内容。

        ### 风险提示

        此操作会修改已有可疑事件记录，影响后续的反洗钱审核与合规处理。调用前请确认 `event_id` 指向正确的记录且各字段无误。

        ### 处理结果

        成功时完成可疑事件更新；后续状态和返回数据以 `200` 响应定义为准。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - event_id
                - aaid
                - trigger_indicator
                - trigger_remark
                - last_alert_date
              properties:
                event_id:
                  type: string
                  description: 事件ID，用于标识本次请求关联的业务对象。此字段为必填项。
                aaid:
                  type: string
                  description: 本次请求关联的证券账号。此字段为必填项。
                trigger_indicator:
                  type: string
                  description: 用于指定「触发指标」。此字段为必填项。
                trigger_remark:
                  type: string
                  description: 用于指定「触发备注」。此字段为必填项。
                last_alert_date:
                  type: string
                  description: 本次请求对应的最近预警日期。请按接口约定的日期格式提交。此字段为必填项。
                audit_frontend_resource:
                  type: object
                  description: 调用方提交的审计上下文，用于记录本次操作。
            example:
              event_id: '123'
              aaid: H00000000
              trigger_indicator: ''
              trigger_remark: ''
              last_alert_date: 2026-07-10
              audit_frontend_resource: {}
      responses:
        '200':
          description: 请求处理成功。响应的 `data` 不包含额外业务字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。

                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`
                      判断具体结果。

                      - `401`：未登录。
                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。
                    x-enum-details:
                      - value: 0
                        label: 成功
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登录或登录状态已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 当前账号未获得该功能授权。请在 User Permission 中为该账号开通相应权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 请求处理超时。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
  /v1/datasets/aml_suspicious_events/download:
    post:
      operationId: aml_suspicious_events_download
      summary: 可疑事件列表导出
      tags:
        - 可疑事件监控
      x-permission-key:
        - account.sem_query
      x-lbonly: false
      description: |-
        将「可疑事件列表」数据导出为文件。`filters` 决定导出范围，`down_fields` 可限制导出字段。

        ### 请求参数

        - 本接口无必填参数，可选参数见下方字段说明。
        - 各字段的格式、取值范围和业务含义见对应字段说明。

        ### 导出模式

        - `mode: 0`：同步导出，成功后直接返回下载地址。
        - `mode: 1`：异步导出，先返回 `file_download_id`；随后调用 `GET /v1/datasets/download/{id}` 获取下载地址。
        - 不再需要导出记录时，可调用 `DELETE /v1/datasets/download/{id}` 删除。

        ### 返回结果

        成功时返回下载地址或异步导出任务标识，导出范围与列内容由 `filters` 和 `down_fields` 决定。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 字段同 aml_suspicious_events.yaml（query 能力）里的 filters
                  properties:
                    member_id:
                      type: string
                      description: 用于按「客户」筛选结果。
                    tigger_indicator:
                      type: string
                      description: |-
                        用于按「触发指标」筛选结果。

                        支持多选；提交时使用英文逗号（`,`）拼接多个值。不传时不按此字段筛选。
                      example: 1,2
                      enum:
                        - '1'
                        - '2'
                        - '3'
                      x-enum-details:
                        - value: '1'
                          label: 出入金异常
                        - value: '2'
                          label: 交易异常
                        - value: '3'
                          label: 其他
                    process_status:
                      type: string
                      description: |-
                        用于按「审核状态」筛选结果。

                        支持多选；提交时使用英文逗号（`,`）拼接多个值。不传时不按此字段筛选。
                      example: 1,2
                      enum:
                        - '1'
                        - '2'
                        - '3'
                        - '4'
                      x-enum-details:
                        - value: '1'
                          label: 待跟进
                        - value: '2'
                          label: 跟进中
                        - value: '3'
                          label: 待审批
                        - value: '4'
                          label: 已完成
                    created_at:
                      type: object
                      description: 用于按「创建日期」筛选结果。
                      properties:
                        gte:
                          type: string
                          format: date
                          description: 筛选范围的下限，匹配值包含该值。
                        lte:
                          type: string
                          format: date
                          description: 筛选范围的上限，匹配值包含该值。
                    updated_at:
                      type: string
                      format: date
                      description: 用于按「早于更新日期」筛选结果。
                    created_by:
                      type: string
                      description: |-
                        用于按「创建人」筛选结果。

                        候选值会动态变化。请调用 `GET /v1/datasets/refs/operators` 获取当前可用的数据字典，并使用返回项的 `key` 作为本参数值。
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/operators
                mode:
                  type: integer
                  default: 0
                  description: 不传时默认 0（同步）
                  enum:
                    - 0
                    - 1
                  x-enum-details:
                    - value: 0
                      label: 同步
                    - value: 1
                      label: 异步
                  example: 0
                ext:
                  type: string
                  description: 下载文件格式。不传时默认为 `csv`。
                  enum:
                    - csv
                    - xlsx
                  x-enum-details:
                    - value: csv
                      label: CSV
                    - value: xlsx
                      label: Excel
                  example: csv
                file_name:
                  type: string
                  description: 导出文件名称。不传时由服务端生成。
                down_fields:
                  type: array
                  description: 不传时导出全部字段；取值范围见 items.enum（同查询接口 data.list.items 的字段列表）
                  items:
                    type: string
                    enum:
                      - event_no
                      - member_id
                      - real_name
                      - en_name
                      - origin_id
                      - last_alert_date
                      - tigger_indicator
                      - tigger_indicator_val
                      - tigger_indicator_remark
                      - remark
                      - created_at
                      - created_by
                      - created_by_val
                      - data_source
                      - data_source_val
                      - process_status
                      - process_status_val
                      - result_status
                      - result_status_val
                      - last_reviewed_by
                      - last_reviewed_by_val
                      - last_reviewed_at
                      - updated_at
                    example: event_no
                ticket_content:
                  type: string
                  description: 模板配置了下载审核工单时，供审批人查看
                ticket_preview_url:
                  type: string
                  description: 导出审批详情地址；仅在导出需要审批时使用。
                hide:
                  type: integer
                  description: 是否在下载记录列表中隐藏本次导出记录。
                  enum:
                    - 0
                    - 1
                  x-enum-details:
                    - value: 0
                      label: 不隐藏
                    - value: 1
                      label: 隐藏
                  example: 0
            example:
              filters: {}
              mode: 0
              ext: csv
              file_name: ''
              remark: ''
              down_fields: []
              ticket_content: ''
              ticket_preview_url: ''
              hide: 0
      responses:
        '200':
          description: 成功时返回「可疑事件列表导出」任务信息。同步导出直接提供下载地址；异步导出提供用于后续查询的 `file_download_id`。
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。

                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`
                      判断具体结果。

                      - `401`：未登录。
                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。
                    x-enum-details:
                      - value: 0
                        label: 成功
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      url:
                        type: string
                        description: '同步模式（`mode: 0`）下返回，异步模式下为空'
                      file_download_id:
                        type: string
                        description: |-
                          异步模式（`mode: 1`）下返回，即 `GET /v1/datasets/download/{id}` /
                          `DELETE /v1/datasets/download/{id}` 路径中的 id：GET 获取最终下载地址，DELETE 删除该导出记录。
                      ticket_id:
                        type: string
                        description: '**返回值：** 审批工单 ID。仅在本次操作触发审批流程时返回。'
              example:
                code: 0
                message: success
                data:
                  url: https://b-api.longbridge.xyz/download/export_result.csv
                  file_download_id: ''
                  ticket_id: ''
        '400':
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登录或登录状态已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 当前账号未获得该功能授权。请在 User Permission 中为该账号开通相应权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
