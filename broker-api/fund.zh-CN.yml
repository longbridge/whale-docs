        - fund.reject_order
      x-lbonly: false
      description: |-
        批量拒绝渠道订单。

        ### 请求参数

        - 必填：`channel_order_ids`（渠道订单 ID 列表）
        - 可选：`reason`（拒绝原因）、`remark`（备注）
        - 各字段的格式、取值范围和业务含义见对应字段说明。

        ### 处理结果

        返回批量操作中处理失败的渠道订单 ID 列表。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - channel_order_ids
              properties:
                channel_order_ids:
                  type: array
                  description: 渠道订单 ID 列表. 用于指定「渠道订单 ID 列表」。此字段为必填项。
                  items:
                    type: integer
                reason:
                  type: string
                  description: 拒绝原因. 用于指定「拒绝原因」。
                remark:
                  type: string
                  description: 备注. 用于指定「备注」。
