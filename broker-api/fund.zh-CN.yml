        每条记录对应某个公司主体（`account_channel`）在某个基金渠道（`company_channel`）、某个交易日期（`dt`）下持有的一只基金份额情况。

        包含基金代码（`counter_id`）、外部基金代码（`external_fund_class_id`）、客户份额（`client_shares`）、大账号持仓份额（`holdings`）以及当日净值（`nav`）。

