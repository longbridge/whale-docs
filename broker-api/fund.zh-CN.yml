                  message:
                    type: string
                  data:
                    type: object
                    required:
                      - list
                      - total
                    properties:
                      list:
                        type: array
                        description: 列表. **返回值：** 符合查询条件的记录列表。
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: 主键. **返回值：** 当前记录的唯一标识。
                            account_channel:
                              type: string
                              description: 公司主体. **返回值：** 公司主体。
                            company_channel:
                              type: string
                              description: 基金渠道. **返回值：** 基金渠道。
                            counter_id:
                              type: string
                              description: 基金代码. **返回值：** 基金代码。
                            external_fund_class_id:
                              type: string
                              description: 外部基金代码. **返回值：** 外部基金代码。
                            dt:
                              type: string
                              description: 交易日. **返回值：** 交易日。
                            nav:
                              type: string
                              description: 基金净值. **返回值：** 基金净值。
                            client_shares:
                              type: string
                              description: 基金公司总份额. **返回值：** 基金公司总份额。
                            holdings:
                              type: string
                              description: 客户累计总份额. **返回值：** 客户累计总份额。
                      total:
                        type: integer
                        description: 总条数. **返回值：** 符合查询条件的记录总数，用于计算分页。
              example:
