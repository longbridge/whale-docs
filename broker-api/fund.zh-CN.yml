                        endpoint: GET /v1/datasets/refs/fund_company_channels
                      example: private-gaoteng
                    counter_id:
                      type: string
                      description: 基金代码. 用于按「基金代码」筛选结果。
                      example: PE/FD/TEST202504232235
                    external_fund_class_id:
                      type: string
                      description: 外部基金代码. 用于按「外部基金代码」筛选结果。
                      example: TEST202504232235
                    dt:
                      type: object
                      description: 交易日期. 用于按「交易日期」筛选结果。
                      properties:
                        gte:
                          type: string
                          description: 大于等于. 筛选范围的下限，匹配值包含该值。
                          format: date
                        lte:
                          type: string
                          description: 小于等于. 筛选范围的上限，匹配值包含该值。
                          format: date
                page:
                  type: integer
                  description: 页码. 要查询的页码，从 `1` 开始。
                page_size:
                  type: integer
                  description: 每页数量. 每页返回的记录数量。
                orderBy:
                  type: array
                  description: 排序参数. 排序规则数组；每一项定义一个排序字段及排序方向。
                  items:
                    type: object
            example:
              filters: {}
              page: 1
              page_size: 20
              orderBy: []
