  /portfolio/funds/batch/reject_channelorder:
    post:
      operationId: batch_reject_channelorder
      summary: 批量拒绝渠道订单
      tags:
        - 基金管理
      x-permission-key:
        - fund.reject_order
      x-lbonly: false
      description: |-
        批量拒绝所选的渠道订单。

        ### 请求参数

        - 必填：`channel_order_ids`（渠道订单 ID 列表）
        - 可选：`reason`（拒绝原因）、`remark`（备注）
        - 各字段的格式、取值范围和业务含义见对应字段说明。

        ### 业务说明

        对 `channel_order_ids` 中的每一笔渠道订单执行拒绝；处理失败的订单会在返回中单独列出。

        ### 风险提示

        此操作会变更渠道订单状态，调用前请确认订单列表无误。

        ### 处理结果

        成功时返回批量操作中处理失败的渠道订单 ID 列表。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - channel_order_ids
              properties:
                channel_order_ids:
                  type: array
                  description: 渠道订单 ID 列表. 用于指定「渠道订单 ID 列表」。此字段为必填项。
                  items:
                    type: integer
                reason:
                  type: string
                  description: 拒绝原因. 用于指定「拒绝原因」。
                remark:
                  type: string
                  description: 备注. 用于指定「备注」。
            example:
              channel_order_ids: []
              reason: ''
              remark: ''
      responses:
        '200':
          description: 请求处理成功。`data.failed_ids` 为批量操作中处理失败的渠道订单 ID 列表。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。

                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`
                      判断具体结果。

                      - `401`：未登录。
                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      failed_ids:
                        type: array
                        description: 处理失败的订单 ID 列表. 批量操作中处理失败的渠道订单 ID 列表。
                        items:
                          type: integer
              example:
                code: 0
                message: success
                data:
                  failed_ids: []
        '400':
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登录或登录状态已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 当前账号未获得该功能授权。请在 User Permission 中为该账号开通相应权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 请求处理超时。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
      x-mint:
        href: /zh-CN/api-reference/batch_reject_channelorder
        metadata:
          sidebarTitle: 批量拒绝渠道订单
  /funds/admin/add-funds:
    post:
      operationId: add_funds
      summary: 添加公募基金
      tags:
        - 基金管理
      x-permission-key:
        - fund.fund_product
      x-lbonly: false
      description: |-
        按 ISIN 新增一只公募基金到基金库。

        ### 请求参数

        - 必填：`isin`（ISIN 代码）
        - 可选：`channel`（基金渠道）、`channel_name`（渠道名称）
        - 各字段的格式、取值范围和业务含义见对应字段说明。

        ### 业务说明

        以 `isin` 唯一标识基金，可选指定基金渠道及渠道名称。

        ### 处理结果

        成功时完成基金新增，具体返回内容见 `200` 响应定义。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - isin
              properties:
                isin:
                  type: string
                  description: ISIN 代码. 用于指定「ISIN 代码」。此字段为必填项。
                channel:
                  type: integer
                  description: 基金渠道. 用于指定「基金渠道」。
                channel_name:
                  type: string
                  description: 渠道名称. 用于指定「渠道名称」。
            example:
              isin: ''
              channel: 0
              channel_name: ''
      responses:
        '200':
          description: 请求处理成功。响应的 `data` 不包含额外业务字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。

