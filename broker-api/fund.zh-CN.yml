      x-lbonly: false
      description: |-
        统计基金清算订单在各处理状态下的数量，用于基金日间清算核对时快速掌握各状态订单的分布。

        ### 请求参数

        - 本数据集不提供业务过滤字段，`filters` 传空对象即可；仍可使用 `page`、`page_size`、`orderBy` 控制分页与排序。

