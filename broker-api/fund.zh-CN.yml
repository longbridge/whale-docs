                      - `401`：未登录。
                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      currencies:
                        type: array
                        description: 币种列表. 该 ISIN 对应的可交易币种列表。
                        items:
                          type: string
              example:
                code: 0
                message: success
                data:
                  currencies:
                    - HKD
                    - USD
        '400':
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
