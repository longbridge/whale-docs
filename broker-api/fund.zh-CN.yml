components:
  schemas:
    BrokerGatewayErrorEnvelope:
      type: object
      description: Broker API Gateway 返回的错误响应结构。`code` 为业务错误码，`message` 为错误信息，`data` 通常为空。
      required:
        - code
        - message
        - data
      properties:
        code:
          type: integer
          description: '`0` 表示成功;非 0 为业务错误码(此时 `data` 通常为空)。下方为常见错误码,具体接口可能只返回其中一部分;需结合 HTTP status 判断。'
          enum:
            - 0
            - 401010
            - 403000
            - 3001001
            - 3001004
            - 3001006
            - 408
            - 404000
          x-enum-details:
            - value: 0
              label: 成功
            - value: 401010
              label: token 无效或已过期
            - value: 403000
              label: 无权限(具体权限码见 message)
            - value: 3001001
              label: 服务繁忙，请稍后重试
            - value: 3001004
              label: 过滤条件格式无法识别
            - value: 3001006
              label: 缺少必填参数(message 含字段名)
            - value: 408
              label: 请求超时
            - value: 404000
              label: 路由不存在
        message:
          type: string
        data: {}
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Broker ACCESS_TOKEN，通过 `Authorization: Bearer <token>` 发送。'
