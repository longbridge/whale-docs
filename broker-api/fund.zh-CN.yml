                            return_pct_rank_5y:
                              type: string
                              description: 近 5 年收益率同类排名. 用于指定「近 5 年收益率同类排名」。
                            status:
                              type: integer
                              description: 命中状态. 用于指定「命中状态」。
                              enum:
                                - 0
                                - 1
                      total_count:
                        type: integer
                        description: 总数量. 用于指定「总数量」。
                      real_count:
                        type: integer
                        description: 有效数量. 用于指定「有效数量」。
              example:
