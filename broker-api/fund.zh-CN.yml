        - fund.strategy_update
      x-lbonly: false
      description: |-
        策略命中基金列表。

        ### 请求参数

        - 必填：`sort`（排序字段）
        - 可选：`strategy_id`（策略包 ID）、`fund_attr`（基金属性筛选）、`stats_filter`（统计指标过滤）
        - 各字段的格式、取值范围和业务含义见对应字段说明。

