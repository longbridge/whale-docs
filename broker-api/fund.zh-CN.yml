openapi: 3.1.1
info:
  title: Longport Whale 券商 API
  description: 面向使用 Longport Whale 的券商提供机构级服务端 API。
  version: 2.0.0
servers:
  - url: https://b-api.longbridge.xyz
    description: 测试环境
  - url: https://b-api.lbkrs.com
    description: 生产环境
security:
  - bearerAuth: []
tags:
  - name: 基金管理
paths:
  /portfolio/funds/batch/reject_saasorder:
    post:
      operationId: reject_saasorder
      summary: 批量拒绝基金渠道订单
      tags:
        - 基金管理
      x-permission-key:
        - fund.reject_order
      x-lbonly: false
      description: |-
        批量拒绝所选的基金渠道（SaaS）客户订单，并记录客户可见的拒绝理由与内部备注。

        ### 请求参数

        - 必填：`ut_ids`（订单ID列表）、`reason`（拒绝理由，客户可见）、`remark`（内部备注）
        - `reason` 与 `remark` 均为多语言对象 `{zh-CN, zh-HK, en}` 序列化后的字符串。
        - 各字段的格式、取值范围和业务含义见对应字段说明。

        ### 业务说明

        对 `ut_ids` 中的每一笔订单执行拒绝，`reason` 会展示给客户，`remark` 仅供内部留存。

        ### 风险提示

        此操作会变更订单状态并对客户可见，调用前请确认订单列表与理由无误。

        ### 处理结果

        成功时完成批量拒绝，具体返回内容见 `200` 响应定义。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - ut_ids
                - reason
                - remark
              properties:
                ut_ids:
                  type: array
                  description: 订单ID列表. 被批量拒绝的渠道订单 id 列表，元素为 string，取自勾选行
                  items:
                    type: string
                reason:
                  type: string
                  description: 拒绝理由（客户可见）. 拒绝理由，多语言对象 {zh-CN, zh-HK, en} 序列化后的字符串（可从预设备注库快捷选择）
                remark:
                  type: string
                  description: 内部备注. 内部备注，多语言对象 {zh-CN, zh-HK, en} 序列化后的字符串，仅内部可见
            example:
              ut_ids:
                - '10086'
                - '10087'
              reason: '{"zh-CN":"渠道方拒绝","zh-HK":"渠道方拒絕","en":"Rejected by channel"}'
              remark: '{"zh-CN":"内部备注：额度不足","zh-HK":"內部備註：額度不足","en":"Internal note: insufficient quota"}'
      responses:
        '200':
          description: 请求处理成功。响应的 `data` 不包含额外业务字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。

                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`
                      判断具体结果。

                      - `401`：未登录。
                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登录或登录状态已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 当前账号未获得该功能授权。请在 User Permission 中为该账号开通相应权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 请求处理超时。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
      x-mint:
        href: /zh-CN/api-reference/reject_saasorder
        metadata:
          sidebarTitle: 批量拒绝基金渠道订单
  /portfolio/funds/nav/save:
    post:
      operationId: funds_nav_save
      summary: 新建基金净值
      tags:
        - 基金管理
      x-permission-key:
        - lb_hk_fund_orders_verification.fund_orders_verification_query
      x-lbonly: false
      description: |-
        为指定基金新建一条基金净值记录。

        ### 请求参数

        - 必填：`counter_id`（基金代码/柜台ID）、`nav_value`（基金净值）、`nav_date`（净值日期）
        - 各字段的格式、取值范围和业务含义见对应字段说明。

        ### 业务说明

        按 `nav_date` 为 `counter_id` 对应基金登记净值，用于后续估值、收益与交易计算。

        ### 风险提示

        净值数据会影响估值与交易计算，调用前请核对基金代码、净值与日期。

        ### 处理结果

        成功时完成净值新建，具体返回内容见 `200` 响应定义。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - counter_id
                - nav_value
                - nav_date
              properties:
                counter_id:
                  type: string
                  description: 基金代码/柜台ID. 基金代码/柜台ID，用于标识本次请求关联的业务对象。此字段为必填项。
                nav_value:
                  type: string
                  description: 基金净值. 用于指定「基金净值」。此字段为必填项。
                nav_date:
                  type: string
                  description: 净值日期. 格式：YYYY-MM-DD
            example:
              counter_id: F00001
              nav_value: '1.0523'
              nav_date: 2026-07-10
      responses:
        '200':
          description: 请求处理成功。响应的 `data` 不包含额外业务字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。

                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`
                      判断具体结果。

                      - `401`：未登录。
                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登录或登录状态已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 当前账号未获得该功能授权。请在 User Permission 中为该账号开通相应权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 请求处理超时。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
      x-mint:
        href: /zh-CN/api-reference/funds_nav_save
        metadata:
          sidebarTitle: 新建基金净值
