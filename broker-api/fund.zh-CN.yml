      description: |-
        对某笔渠道持仓进行手动份额调整（校准）。

        ### 请求参数

        - 必填：`channel_holding_id`（渠道持仓 ID）、`calibrated_shares`（校准目标份额）
        - 可选：`counter_id`（基金代码）、`ledger_date`（账务日期）、`reason`（校准原因）、`attachments`（校准凭证）、`current_shares`（当前份额）、`audit_frontend_resource`（审计上下文）
        - 各字段的格式、取值范围和业务含义见对应字段说明。

        ### 业务说明

        将 `channel_holding_id` 对应持仓的份额校准为 `calibrated_shares`；`reason` 与 `attachments` 用于记录调整依据与凭证。

        ### 风险提示

        此操作会直接变更真实渠道持仓份额，影响持仓与估值，调用前请务必确认目标持仓、当前份额与校准份额无误。

        ### 处理结果

        成功时返回本次调整记录 ID。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - channel_holding_id
                - calibrated_shares
              properties:
                channel_holding_id:
                  type: integer
                  description: 渠道持仓 ID. 用于指定「渠道持仓 ID」。此字段为必填项。
                counter_id:
                  type: string
                  description: 基金代码. 用于指定「基金代码」。
                calibrated_shares:
                  type: string
                  description: 校准目标份额. 用于指定「校准目标份额」。此字段为必填项。
                ledger_date:
                  type: integer
                  description: 账务日期. 账务日期，格式 `YYYYMMDD`。
                  x-format: date-int-yyyymmdd
                reason:
                  type: string
                  description: 校准原因. 用于指定「校准原因」。
                attachments:
                  type: array
                  description: 校准凭证. 用于指定「校准凭证」。
                  items:
                    type: object
                    properties:
                      file_key:
                        type: string
                        description: 文件 Key. 用于指定「文件 Key」。
                      file_name:
                        type: string
                        description: 文件名. 用于指定「文件名」。
                current_shares:
                  type: string
                  description: 当前份额. 用于指定「当前份额」。
                audit_frontend_resource:
                  type: object
                  description: 审计上下文. 调用方提交的审计上下文，用于记录本次操作。
            example:
