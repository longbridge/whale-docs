              properties:
                strategy_id:
                  type: integer
                  description: 策略包 ID. 大于 `0` 时从已保存策略加载命中基金；否则按传入的筛选条件实时计算。
                fund_attr:
                  type: object
                  description: 基金属性筛选. 用于指定「基金属性筛选」。
                  properties:
                    asset_class:
                      type: array
                      description: 资产类别. 用于指定「资产类别」。
                      items:
                        type: integer
                    currency:
                      type: array
                      description: 币种. 用于指定「币种」。
                      items:
                        type: string
                    risk_level:
                      type: array
                      description: 风险等级. 用于指定「风险等级」。
                      items:
                        type: integer
                    industry:
                      type: array
                      description: 行业. 用于指定「行业」。
                      items:
                        type: string
                    fund_company:
                      type: array
                      description: 基金公司. 用于指定「基金公司」。
                      items:
                        type: integer
                    star:
                      type: array
                      description: 评级星级. 用于指定「评级星级」。
                      items:
                        type: integer
                    areas:
                      type: array
                      description: 投资地区. 用于指定「投资地区」。
                      items:
                        type: string
                    asset_ranges:
                      type: array
                      description: 资产规模区间列表. 用于指定「资产规模区间列表」。
                      items:
                        type: object
                        properties:
                          min:
                            type: integer
                            description: 下界. 用于指定「下界」。
                          max:
                            type: integer
                            description: 上界. 上界，`-1` 表示不限。
                    launch_ranges:
                      type: array
                      description: 成立时间区间列表. 用于指定「成立时间区间列表」。
                      items:
                        type: object
                        properties:
                          after:
                            type: integer
                            description: 起始时间. 下界（含），Unix 秒，`0` 表示不限。
                          before:
                            type: integer
                            description: 结束时间. 上界（不含），Unix 秒，`0` 表示不限。
                stats_filter:
                  type: object
                  description: 统计指标过滤. 用于指定「统计指标过滤」。
                  properties:
                    return_period:
                      type: string
                      description: 收益率统计周期. 用于指定「收益率统计周期」。
                    return_min:
                      type: string
                      description: 收益率下界. 用于指定「收益率下界」。
                    return_max:
                      type: string
                      description: 收益率上界. 用于指定「收益率上界」。
                    return_rank_period:
                      type: string
                      description: 收益率同类排名周期. 用于指定「收益率同类排名周期」。
                    return_rank_min:
                      type: string
                      description: 收益率同类排名下界. 用于指定「收益率同类排名下界」。
                    return_rank_max:
                      type: string
                      description: 收益率同类排名上界. 用于指定「收益率同类排名上界」。
                    max_drawdown_period:
                      type: string
                      description: 最大回撤周期. 用于指定「最大回撤周期」。
                    max_drawdown_min:
                      type: string
                      description: 最大回撤下界. 用于指定「最大回撤下界」。
                    max_drawdown_max:
                      type: string
                      description: 最大回撤上界. 用于指定「最大回撤上界」。
                    max_drawdown_rank_period:
                      type: string
                      description: 最大回撤同类排名周期. 用于指定「最大回撤同类排名周期」。
                    max_drawdown_rank_min:
                      type: string
                      description: 最大回撤同类排名下界. 用于指定「最大回撤同类排名下界」。
                    max_drawdown_rank_max:
                      type: string
                      description: 最大回撤同类排名上界. 用于指定「最大回撤同类排名上界」。
                    sharpe_rank_period:
                      type: string
                      description: 夏普比率同类排名周期. 用于指定「夏普比率同类排名周期」。
                    sharpe_rank_min:
                      type: string
                      description: 夏普比率同类排名下界. 用于指定「夏普比率同类排名下界」。
                    sharpe_rank_max:
                      type: string
                      description: 夏普比率同类排名上界. 用于指定「夏普比率同类排名上界」。
                sort:
                  type: string
                  description: 排序字段. 排序字段，例如 `return_3y`。此字段为必填项。
            example:
              strategy_id: 0
              fund_attr: {}
              stats_filter: {}
              sort: ''
      responses:
        '200':
          description: 请求处理成功。`data` 包含命中的基金列表及计数。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。

                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`
                      判断具体结果。

                      - `401`：未登录。
                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      funds:
                        type: array
                        description: 命中基金列表. 用于指定「命中基金列表」。
                        items:
                          type: object
                          properties:
                            counter_id:
                              type: string
                              description: 基金代码. 用于指定「基金代码」。
                            code:
                              type: string
                              description: 基金编码. 用于指定「基金编码」。
                            name:
                              type: string
                              description: 基金名称. 用于指定「基金名称」。
                            return_1m:
                              type: string
                              description: 近 1 月收益率. 用于指定「近 1 月收益率」。
                            return_3m:
                              type: string
                              description: 近 3 月收益率. 用于指定「近 3 月收益率」。
                            return_6m:
                              type: string
                              description: 近 6 月收益率. 用于指定「近 6 月收益率」。
                            return_1y:
                              type: string
                              description: 近 1 年收益率. 用于指定「近 1 年收益率」。
                            return_3y:
                              type: string
                              description: 近 3 年收益率. 用于指定「近 3 年收益率」。
                            return_5y:
                              type: string
                              description: 近 5 年收益率. 用于指定「近 5 年收益率」。
                            return_since_inception:
                              type: string
                              description: 成立以来收益率. 用于指定「成立以来收益率」。
                            return_pct_rank_6m:
