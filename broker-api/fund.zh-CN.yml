  /v1/datasets/fund_saas_orders:
    post:
      operationId: fund_saas_orders
      summary: 基金 saas 订单
      tags:
        - 基金管理
      x-permission-key:
        - fund.ut_order
      x-lbonly: false
      description: |-
        查询公募基金客户（会员）交易订单流水，用于运营侧跟踪申购、赎回订单的全生命周期与同步状态。

        ### 请求参数

        - 通过 `filters` 组合业务筛选条件（可选字段见下方 filters 字段说明），并使用 `page`、`page_size`、`orderBy` 控制分页与排序。

        ### 业务说明

        数据来自基金 SaaS 交易服务的客户订单，不含现金管理类产品（`asset_class` 为 `8` 的记录已排除）。

        每条记录代表一笔客户基金订单，包含订单编号、证券账号、客户编号、基金代码 / 名称 / `ISIN`、币种、订单类型（申购 / 赎回）、订单状态、订单来源、是否系统自动生成、提交金额与份额、确认份额与确认金额、手续费、成交净值、下单与完成时间、交易日等。

        同时携带同步状态与同步时间、拒单原因与备注，以及关联的任务与工单编号，便于排查订单同步异常与拒单情况。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 过滤条件. 组合业务过滤条件。省略某个过滤字段时，不按该字段筛选。
                  properties:
                    member_id:
                      type: string
                      description: 客户编号. 用于按「客户编号」筛选结果。
                    origin_id:
                      type: string
                      description: 证券账号. 用于按「证券账号」筛选结果。
                      example: H16992480
                    counter_id:
                      type: string
                      description: 基金代码. 用于按「基金代码」筛选结果。
                      example: UT/FD/LU1894109211
                    id:
                      type: string
                      description: 订单编号. 用于按「订单编号」筛选结果。
                      example: '7446179'
                    created_at:
                      type: object
                      description: 下单时间. 用于按「下单时间」筛选结果。
                      properties:
                        gte:
                          type: string
                          description: 大于等于. 筛选范围的下限，匹配值包含该值。
                          format: date
                        lte:
                          type: string
                          description: 小于等于. 筛选范围的上限，匹配值包含该值。
                          format: date
                    extend_info:
                      type: string
                      description: 生成类型. 用于按「生成类型」筛选结果。
                      enum:
                        - 'true'
                        - 'false'
                      x-enum-details:
                        - value: 'true'
                          label: 自动订单
                        - value: 'false'
                          label: 手动订单
                      example: 'true'
                    state:
                      type: string
                      description: 订单状态. 用于按「订单状态」筛选结果。
                      enum:
                        - Init
                        - Cutoff
                        - Submitted
                        - FundsSettled
                        - Done
                        - Canceled
                        - Confirmed
                        - Rejected
                      x-enum-details:
                        - value: Init
                          label: 初始态
                        - value: Cutoff
                          label: 已日切
                        - value: Submitted
                          label: 已提交
                        - value: FundsSettled
                          label: 赎回货交收
                        - value: Done
                          label: 已完成
                        - value: Canceled
                          label: 已撤单
                        - value: Confirmed
                          label: 已确认
                        - value: Rejected
                          label: 拒单
                      example: Done
                    trade_source:
                      type: string
                      description: |-
                        订单来源. 用于按「订单来源」筛选结果。

                        **可选值：** `Normal`（普通订单）、`Admin`（后台下单）、`OB`（OB 订单）、`WTT`、`AIP`（定投）、`ATM`（ATM 出金自动下单）、`RMS`、`Import`（导入）
                      enum:
                        - Normal
                        - Admin
                        - OB
                        - WTT
                        - AIP
                        - ATM
                        - RMS
                        - Import
                      example: Normal
                    fund_name:
                      type: string
                      description: 基金名称. 用于按「基金名称」筛选结果。
                    action:
                      type: string
                      description: 订单类型. 用于按「订单类型」筛选结果。
                      enum:
                        - BUY
                        - SELL
                      x-enum-details:
                        - value: BUY
                          label: 申购
                        - value: SELL
                          label: 赎回
                      example: Subscription
                    currency:
                      type: string
                      description: |-
                        币种. 用于按「币种」筛选结果。

                        候选值会动态变化。请调用 `GET /v1/datasets/refs/tenant_currencies` 获取当前可用的数据字典，并使用返回项的 `key` 作为本参数值。
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/tenant_currencies
                      example: HKD
                    settle_at:
                      type: object
                      description: 完成时间. 用于按「完成时间」筛选结果。
                      properties:
                        gte:
                          type: string
                          description: 大于等于. 筛选范围的下限，匹配值包含该值。
                          format: date
                        lte:
                          type: string
                          description: 小于等于. 筛选范围的上限，匹配值包含该值。
                          format: date
                    trading_day:
                      type: object
                      description: 交易日. 用于按「交易日」筛选结果。
                      properties:
                        gte:
                          type: string
                          description: 大于等于. 筛选范围的下限，匹配值包含该值。
                          format: date
                        lte:
                          type: string
                          description: 小于等于. 筛选范围的上限，匹配值包含该值。
                          format: date
                page:
                  type: integer
                  description: 页码. 要查询的页码，从 `1` 开始。
                page_size:
                  type: integer
                  description: 每页数量. 每页返回的记录数量。
                orderBy:
                  type: array
                  description: 排序参数. 排序规则数组；每一项定义一个排序字段及排序方向。
                  items:
                    type: object
            example:
              filters: {}
              page: 1
              page_size: 20
              orderBy: []
