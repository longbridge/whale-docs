      x-lbonly: false
      description: |-
        查询渠道交易记录，用于核对基金在各上手渠道发生的份额（权益）变动流水。

        ### 请求参数

        - 通过 `filters` 组合业务筛选条件（可选字段见下方 filters 字段说明），并使用 `page`、`page_size`、`orderBy` 控制分页与排序。

        ### 业务说明

        数据来源于渠道权益变动流水，一条记录对应一笔渠道侧的份额增减。

        每条记录包含账务日、证券代码、基金渠道、基金账号、来源、变动份额、关联 ID、附件与创建时间等信息，可据此追溯每笔变动的归属与凭证。

        常用于对账场景：按基金代码、渠道、账号或来源筛选，核对某段账务日或创建时间内的份额变动明细。

        ### 返回结果

        成功时返回匹配的记录列表及分页信息。返回列含义见响应定义。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 过滤条件
                  properties:
                    counter_id:
                      type: string
                      description: 基金代码
                    company_channel:
                      type: string
                      description: 基金渠道
                    related_id:
                      type: string
                      description: 关联 id
                    name:
                      type: string
                      description: 基金账号
                    created_at:
                      type: object
                      description: 创建时间. 区间过滤，两端均可省略（省略表示该侧不限）
                      properties:
                        gte:
                          type: string
                          description: 大于等于
                          format: date
                        lte:
                          type: string
                          description: 小于等于
                          format: date
                    ledger_date:
                      type: object
                      description: 账务日. 区间过滤，两端均可省略（省略表示该侧不限）；不传时默认固定为 今天（相对当天滚动）
                      properties:
                        gte:
                          type: string
                          description: 大于等于
                          format: date
                        lte:
                          type: string
                          description: 小于等于
                          format: date
                    source:
                      type: string
                      description: 来源. 多选，提交时以逗号拼接成字符串；可选值见 enum
                      enum:
                        - '1'
                        - '2'
                        - '3'
                        - '4'
                      example: '1'
                page:
                  type: integer
                  description: 页码
                page_size:
                  type: integer
                  description: 每页数量
                orderBy:
