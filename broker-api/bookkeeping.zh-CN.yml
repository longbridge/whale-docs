openapi: 3.1.1
info:
  title: Longport Whale 券商 API
  version: 1.0.0
servers:
  - url: https://b-api.longbridge.xyz
    description: 测试环境
  - url: https://b-api.lbkrs.com
    description: 生产环境
security:
  - bearerAuth: []
tags:
  - name: 会计中台
    description: 记账凭证、总账查询、往来核对等会计中台相关的后台管理接口。
paths:
  /book/createAccountDetailsV2:
    post:
      operationId: create_account_details_v2
      summary: 新建会计分录
      tags:
        - 会计中台
      x-permission-key:
        - lb_hk_book.book_detail_update
      x-lbonly: false
      description: |-
        新建一条会计分录，记录一笔借贷方科目之间的记账。也支持按 `copy_id` 复制一条已有分录预填后再新建。

        ### 请求参数

        - 必填：`bookingTypeId`（记账业务类型）、`txNo`（交易流水号）、`name`（摘要说明）、`accountAt`（记账日期）、`ledgerDate`（分类账日期）、`objectCode`（对象币种）、`debitFirstSubjectCode`、`debitSecondSubjectCode`、`debitSubjectCode`（借方一/二/三级科目编码）、`creditFirstSubjectCode`、`creditSecondSubjectCode`、`creditSubjectCode`（贷方一/二/三级科目编码）、`amount`（金额）
        - 各字段的格式、取值范围和业务含义见对应字段说明。

        ### 业务说明

        借贷双方科目均需逐级选择，二、三级科目依赖上一级联动。`objectCode` 的可用取值随渠道变化，请调用 `GET /v1/datasets/refs/tenant_currencies_by_channel` 获取当前可用值。

        ### 风险提示

        此操作会写入真实会计分录数据，影响账务核算结果。调用前请确认借贷科目、币种和金额无误。

        ### 处理结果

        成功时创建对应会计分录，具体返回内容见 `200` 响应定义。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - bookingTypeId
                - txNo
                - name
                - accountAt
                - ledgerDate
                - objectCode
                - debitFirstSubjectCode
                - debitSecondSubjectCode
                - debitSubjectCode
                - creditFirstSubjectCode
                - creditSecondSubjectCode
                - creditSubjectCode
                - amount
              properties:
                sourceId:
                  type: number
                  description: |-
                    分录数据源，从可选值中选择；候选值随业务变化，非固定；请调用 `GET /v1/datasets/refs/book_source` 获取当前可用取值

                    请调用 `GET /v1/datasets/refs/book_source` 获取当前可用的数据字典，并使用返回项的 `key` 作为本字段值。
                  x-value-source:
                    endpoint: GET /v1/datasets/refs/book_source
                bookingTypeId:
                  type: string
                  description: |-
                    记账业务类型，从可选值中选择（依赖数据源联动）；候选值随业务变化，非固定；请调用 `GET /v1/datasets/refs/book_business_types_by_source` 获取当前可用取值

                    请调用 `GET /v1/datasets/refs/book_business_types_by_source` 获取当前可用的数据字典，并使用返回项的 `key` 作为本字段值。
                  x-value-source:
                    endpoint: GET /v1/datasets/refs/book_business_types_by_source
                aaid:
                  type: string
                  description: 关联账户 AAID（部分场景不适用，可不传）
                txNo:
                  type: string
                  description: 用于指定「交易流水号」。此字段为必填项。
                name:
                  type: string
                  description: 用于指定「摘要说明」。此字段为必填项。
                accountAt:
                  type: string
                  description: 记账时间，格式 YYYY-MM-DD 00:00:00
                ledgerDate:
                  type: string
                  description: 账务日期，格式 YYYY-MM-DD HH:mm:ss
                objectCode:
                  type: string
                  description: |-
                    对象币种，从可选值中选择；候选值随业务变化，非固定；请调用 `GET /v1/datasets/refs/tenant_currencies_by_channel` 获取当前可用取值

                    请调用 `GET /v1/datasets/refs/tenant_currencies_by_channel` 获取当前可用的数据字典，并使用返回项的 `key` 作为本字段值。
                  x-value-source:
                    endpoint: GET /v1/datasets/refs/tenant_currencies_by_channel
                debitFirstSubjectCode:
                  type: string
                  description: 用于指定「借方一级科目编码」。此字段为必填项。
                debitSecondSubjectCode:
                  type: string
                  description: 借方二级科目，依赖一级科目联动
                debitSubjectCode:
                  type: string
                  description: 借方明细科目，依赖二级科目联动
                creditFirstSubjectCode:
                  type: string
                  description: 用于指定「贷方一级科目编码」。此字段为必填项。
                creditSecondSubjectCode:
                  type: string
                  description: 贷方二级科目，依赖一级科目联动
                creditSubjectCode:
                  type: string
                  description: 贷方明细科目，依赖二级科目联动
                amount:
                  type: string
                  description: 本次业务处理涉及的金额。此字段为必填项。
                remark:
                  type: string
                  description: 备注，最长 100 字符
                debitName:
                  type: string
                  description: 借方科目名称，随借方明细科目自动带出
                creditName:
                  type: string
                  description: 贷方科目名称，随贷方明细科目自动带出
                objectType:
                  type: string
                  description: |-
                    用于指定「对象类型」。
                  enum:
                    - '0'
                    - '1'
                    - '2'
                    - '3'
                  x-enum-details:
                    - value: '0'
                      label: 未知
                    - value: '1'
                      label: 现金标的
                    - value: '2'
                      label: 股票标的
                    - value: '3'
                      label: 基金标的
                  example: '0'
                audit_frontend_resource:
                  type: object
                  description: 审计用数据快照（复制场景为原始记录快照，纯新增为空对象），供后端审计对比，非用户填写字段
            example:
              sourceId: 1
              bookingTypeId: '2'
              aaid: H00000000
              txNo: TX20260710002
              name: 手工调账-测试分录
              accountAt: '2026-07-10 00:00:00'
              ledgerDate: '2026-07-10 10:00:00'
              objectCode: USD
              debitFirstSubjectCode: '1001'
              debitSecondSubjectCode: '100101'
              debitSubjectCode: '10010101'
              creditFirstSubjectCode: '2001'
              creditSecondSubjectCode: '200101'
              creditSubjectCode: '20010101'
              amount: '100.00'
              remark: 新增备注
              debitName: 库存现金/美元/xxx
              creditName: 应付账款/美元/xxx
              objectType: account
      responses:
        '200':
          description: 请求处理成功。响应的 `data` 不包含额外业务字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。

                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`
                      判断具体结果。

                      - `401`：未登录。
                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。
                    x-enum-details:
                      - value: 0
                        label: 成功
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登录或登录状态已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 当前账号未获得该功能授权。请在 User Permission 中为该账号开通相应权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 请求处理超时。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
  /book/deleteAccountDetail:
    delete:
      operationId: delete_account_detail
      summary: 删除会计分录
      tags:
        - 会计中台
      x-permission-key:
        - lb_hk_book.book_detail_update
      x-lbonly: false
      description: |-
        删除一条会计分录。

        ### 请求参数

        - 必填：`id`（分录 ID）
        - 各字段的格式、取值范围和业务含义见对应字段说明。

        ### 业务说明

        按 `id` 定位并删除对应的会计分录记录，涉及真实账务数据。

        ### 风险提示

        此操作会删除真实会计分录数据，删除后不可恢复。调用前请确认目标分录无误。

        ### 处理结果

        成功时删除对应会计分录，后续状态和返回数据以 `200` 响应定义为准。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
              properties:
                id:
                  type: string
                  description: 分录ID，用于标识本次请求关联的业务对象。此字段为必填项。
            example:
              id: '123'
      responses:
        '200':
          description: 请求处理成功。响应的 `data` 不包含额外业务字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。

                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`
                      判断具体结果。

                      - `401`：未登录。
                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。
                    x-enum-details:
                      - value: 0
                        label: 成功
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登录或登录状态已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 当前账号未获得该功能授权。请在 User Permission 中为该账号开通相应权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 请求处理超时。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
  /book/account_detail/update:
    post:
      operationId: modify_account_detail_v2
      summary: 编辑会计分录
      tags:
        - 会计中台
      x-permission-key:
        - lb_hk_book.book_detail_update
      x-lbonly: false
      description: |-
        编辑一条已有会计分录。请求结构与新建接口一致，仅额外要求传入 `id` 指定待修改的分录。

        ### 请求参数

        - 必填：`id`（会计分录 ID）、`bookingTypeId`（记账业务类型）、`txNo`（交易流水号）、`name`（摘要说明）、`accountAt`（记账日期）、`ledgerDate`（分类账日期）、`objectCode`（对象币种）、`debitFirstSubjectCode`、`debitSecondSubjectCode`、`debitSubjectCode`（借方一/二/三级科目编码）、`creditFirstSubjectCode`、`creditSecondSubjectCode`、`creditSubjectCode`（贷方一/二/三级科目编码）、`amount`（金额）
        - 各字段的格式、取值范围和业务含义见对应字段说明。

        ### 业务说明

        借贷科目逐级联动，末级科目选定后其全称将作为对应的借/贷方科目名称。`objectCode` 的可用取值随渠道变化，请调用 `GET /v1/datasets/refs/tenant_currencies_by_channel` 获取当前可用值。

        ### 风险提示

        此操作会覆盖真实会计分录数据，影响账务核算结果。调用前请确认目标分录及各科目、币种、金额无误。

        ### 处理结果

        成功时更新对应会计分录，具体返回内容见 `200` 响应定义。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
                - bookingTypeId
                - txNo
                - name
                - accountAt
                - ledgerDate
                - objectCode
                - debitFirstSubjectCode
                - debitSecondSubjectCode
                - debitSubjectCode
                - creditFirstSubjectCode
                - creditSecondSubjectCode
                - creditSubjectCode
                - amount
              properties:
                id:
                  type: string
                  description: 编辑场景下传入的分录 id，仅编辑接口有此字段
                sourceId:
                  type: number
                  description: |-
                    - 从可选值中选择，候选值随业务变化；请调用 `GET /v1/datasets/refs/book_source` 获取当前可用取值
                    - 编辑时禁用不可修改
                    - 提交前转为数字

                    请调用 `GET /v1/datasets/refs/book_source` 获取当前可用的数据字典，并使用返回项的 `key` 作为本字段值。
                  x-value-source:
                    endpoint: GET /v1/datasets/refs/book_source
                bookingTypeId:
                  type: string
                  description: |-
                    从可选值中选择，候选值随业务变化（依赖来源字段联动加载）；当来源为 0 时该项隐藏，不传；请调用 `GET /v1/datasets/refs/book_business_types_by_source` 获取当前可用取值

                    请调用 `GET /v1/datasets/refs/book_business_types_by_source` 获取当前可用的数据字典，并使用返回项的 `key` 作为本字段值。
                  x-value-source:
                    endpoint: GET /v1/datasets/refs/book_business_types_by_source
                aaid:
                  type: string
                  description: 自定义组件选取关联账户；当来源为 0 时隐藏，不传
                txNo:
                  type: string
                  description: 用于指定「交易流水号」。此字段为必填项。
                name:
                  type: string
                  description: 用于指定「摘要说明」。此字段为必填项。
                accountAt:
                  type: string
                  description: 日期，提交前转为 'YYYY-MM-DD 00:00:00' 格式
                ledgerDate:
                  type: string
                  description: 日期，提交前转为 'YYYY-MM-DD HH:mm:ss' 格式
                objectCode:
                  type: string
                  description: |-
                    从可选值中选择，候选值随业务变化；请调用 `GET /v1/datasets/refs/tenant_currencies_by_channel` 获取当前可用取值

                    请调用 `GET /v1/datasets/refs/tenant_currencies_by_channel` 获取当前可用的数据字典，并使用返回项的 `key` 作为本字段值。
                  x-value-source:
                    endpoint: GET /v1/datasets/refs/tenant_currencies_by_channel
                debitFirstSubjectCode:
                  type: string
                  description: 从可选值中选择，借方一级科目，取值来自科目查询联动接口
                debitSecondSubjectCode:
                  type: string
                  description: 从可选值中选择，借方二级科目，依赖借方一级科目联动加载
                debitSubjectCode:
                  type: string
                  description: 从可选值中选择，借方末级科目，依赖借方二级科目联动加载；选中后取该项全称作为借方科目名称
                creditFirstSubjectCode:
                  type: string
                  description: 从可选值中选择，贷方一级科目，取值来自科目查询联动接口
                creditSecondSubjectCode:
                  type: string
                  description: 从可选值中选择，贷方二级科目，依赖贷方一级科目联动加载
                creditSubjectCode:
                  type: string
                  description: 从可选值中选择，贷方末级科目，依赖贷方二级科目联动加载；选中后取该项全称作为贷方科目名称
                amount:
                  type: string
                  description: 本次业务处理涉及的金额。此字段为必填项。
                remark:
                  type: string
                  description: 自由文本，最长 100 字符
                debitName:
                  type: string
                  description: 非请求项，选中借方末级科目时从选项全称取值并随提交附带
                creditName:
                  type: string
                  description: 非请求项，选中贷方末级科目时从选项全称取值并随提交附带
                objectType:
                  type: string
                  description: |-
                    用于指定「对象类型」。
                  enum:
                    - '0'
                    - '1'
                    - '2'
                    - '3'
                  x-enum-details:
                    - value: '0'
                      label: 未知
                    - value: '1'
                      label: 现金标的
                    - value: '2'
                      label: 股票标的
                    - value: '3'
                      label: 基金标的
                  example: '0'
                audit_frontend_resource:
                  type: object
                  description: 编辑前拉取的原始数据快照，用于后端审计对比，非用户可编辑字段
            example:
              id: '10086'
              sourceId: 1
              bookingTypeId: '2'
              aaid: H00000000
              txNo: TX20260710001
              name: 手工调账-测试分录
              accountAt: '2026-07-10 00:00:00'
              ledgerDate: '2026-07-10 10:00:00'
              objectCode: USD
              debitFirstSubjectCode: '1001'
              debitSecondSubjectCode: '100101'
              debitSubjectCode: '10010101'
              creditFirstSubjectCode: '2001'
              creditSecondSubjectCode: '200101'
              creditSubjectCode: '20010101'
              amount: '100.00'
              remark: 编辑备注
              debitName: 库存现金/美元/xxx
              creditName: 应付账款/美元/xxx
              objectType: account
      responses:
        '200':
          description: 请求处理成功。响应的 `data` 不包含额外业务字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。

                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`
                      判断具体结果。

                      - `401`：未登录。
                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。
                    x-enum-details:
                      - value: 0
                        label: 成功
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登录或登录状态已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 当前账号未获得该功能授权。请在 User Permission 中为该账号开通相应权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 请求处理超时。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
  /book/addBookRemarks:
    post:
      operationId: add_book_remarks
      summary: 新增会计备注
      tags:
        - 会计中台
      x-permission-key:
        - accounting.deposit_transit_details
      x-lbonly: false
      description: |-
        为某个账务业务对象新增一条会计备注。

        ### 请求参数

        - 必填：`ref_id`（关联业务对象 ID）、`ref_no`（关联单号）、`biz_type`（业务类型）、`remarks`（备注内容）
        - 各字段的格式、取值范围和业务含义见对应字段说明。

        ### 业务说明

        备注通过 `ref_id`、`ref_no` 与 `biz_type` 关联到具体业务对象，用于对该记录附加说明。

        ### 处理结果

