        ### 导出模式

        - `mode: 0`：同步导出，成功后直接返回下载地址。
        - `mode: 1`：异步导出，先返回 `file_download_id`；随后调用 `GET /v1/datasets/download/{id}` 获取下载地址。
        - 不再需要导出记录时，可调用 `DELETE /v1/datasets/download/{id}` 删除。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 字段同 booking_other_bills.yaml（query 能力）里的 filters
                  properties:
                    id:
                      type: string
                      description: 用于按「费用编号」筛选结果。
                    contract_no:
                      type: string
                      description: 用于按「合约号」筛选结果。
                    account_at:
                      type: object
                      description: 用于按「账务日期」筛选结果。
                      properties:
                        gte:
                          type: string
                          format: date
                          description: 筛选范围的下限，匹配值包含该值。
                        lte:
                          type: string
                          format: date
                          description: 筛选范围的上限，匹配值包含该值。
                    currency:
                      type: string
                      description: 用于按「币种」筛选结果。
                    ledger_date:
                      type: object
                      description: 用于按「交易日期」筛选结果。
                      properties:
                        gte:
                          type: string
                          format: date
                          description: 筛选范围的下限，匹配值包含该值。
                        lte:
                          type: string
                          format: date
                          description: 筛选范围的上限，匹配值包含该值。
                    business_type:
                      type: string
                      description: |-
                        用于按「业务类型」筛选结果。

                        候选值会动态变化。请调用 `GET /v1/datasets/refs/book_other_bills_business_type` 获取当前可用的数据字典，并使用返回项的 `key` 作为本参数值。
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/book_other_bills_business_type
                mode:
                  type: integer
                  default: 0
                  description: 不传时默认 0（同步）
                  enum:
                    - 0
