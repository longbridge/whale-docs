openapi: 3.1.1
info:
  title: Whale OpenAPI (whale-openapi-docs 自动生成)
  version: 1.0.0
servers:
- url: https://b-api.longbridge.xyz
  description: 测试环境
- url: https://b-api.lbkrs.com
  description: 生产环境
security:
- bearerAuth: []
tags:
- name: 会计中台
  description: 记账凭证、总账查询、往来核对等会计中台相关的后台管理接口。
paths:
  /book/createAccountDetailsV2:
    post:
      operationId: create_account_details_v2
      summary: 新建会计分录
      tags:
      - 会计中台
      x-permission-key:
      - lb_hk_book.book_detail_update
      x-lbonly: false
      description: '新建会计分录（也支持按 copy_id 复制预填后新建）。涉及真实会计分录数据变更。


        ### 请求参数


        - 必填：`bookingTypeId`（记账类型）、`txNo`（交易流水号）、`name`（摘要说明）、`accountAt`（记账日期）、`ledgerDate`（分类账日期）、`objectCode`（币种/结算对象）、`debitFirstSubjectCode`（借方一级科目编码）、`debitSecondSubjectCode`（借方二级科目编码）、`debitSubjectCode`（借方三级科目编码）、`creditFirstSubjectCode`（贷方一级科目编码）、`creditSecondSubjectCode`（贷方二级科目编码）、`creditSubjectCode`（贷方三级科目编码）、`amount`（金额）

        - 可选：`sourceId`（账务来源）、`aaid`（关联账户ID）、`remark`（备注）、`debitName`（借方科目全称）、`creditName`（贷方科目全称）、`objectType`（对象类型）、`audit_frontend_resource`（审计追溯调用方快照）

        - 各字段的格式、取值范围、默认行为和业务含义见对应字段说明。


        ### 处理结果


        成功时完成所述业务操作，具体返回内容见 `200` 响应定义。'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - bookingTypeId
              - txNo
              - name
              - accountAt
              - ledgerDate
              - objectCode
              - debitFirstSubjectCode
              - debitSecondSubjectCode
              - debitSubjectCode
              - creditFirstSubjectCode
              - creditSecondSubjectCode
              - creditSubjectCode
              - amount
              properties:
                sourceId:
                  type: number
                  description: '分录数据源，下拉选择；取值来自 book_source 动态枚举，非固定


                    请调用 `GET /v1/datasets/refs/book_source` 获取当前可用的数据字典，并使用返回项的 `key` 作为本字段值。'
                  x-value-source:
                    endpoint: GET /v1/datasets/refs/book_source
                bookingTypeId:
                  type: string
                  description: '记账业务类型，下拉选择（依赖数据源联动）；取值来自 book_business_types_by_source 动态枚举，非固定


                    请调用 `GET /v1/datasets/refs/book_business_types_by_source` 获取当前可用的数据字典，并使用返回项的 `key`
                    作为本字段值。'
                  x-value-source:
                    endpoint: GET /v1/datasets/refs/book_business_types_by_source
                aaid:
                  type: string
                  description: 关联账户 AAID（部分场景不适用，可不传）
                txNo:
                  type: string
                  description: 用于指定「交易流水号」。此字段为必填项。
                name:
                  type: string
                  description: 用于指定「摘要说明」。此字段为必填项。
                accountAt:
                  type: string
                  description: 记账时间，格式 YYYY-MM-DD 00:00:00
                ledgerDate:
                  type: string
                  description: 账务日期，格式 YYYY-MM-DD HH:mm:ss
                objectCode:
                  type: string
                  description: '对象币种，下拉选择；取值来自 tenant_currencies_by_channel 动态枚举，非固定


                    请调用 `GET /v1/datasets/refs/tenant_currencies_by_channel` 获取当前可用的数据字典，并使用返回项的 `key`
                    作为本字段值。'
                  x-value-source:
                    endpoint: GET /v1/datasets/refs/tenant_currencies_by_channel
                debitFirstSubjectCode:
                  type: string
                  description: 用于指定「借方一级科目编码」。此字段为必填项。
                debitSecondSubjectCode:
                  type: string
                  description: 借方二级科目，依赖一级科目联动
                debitSubjectCode:
                  type: string
                  description: 借方明细科目，依赖二级科目联动
                creditFirstSubjectCode:
                  type: string
                  description: 用于指定「贷方一级科目编码」。此字段为必填项。
                creditSecondSubjectCode:
                  type: string
                  description: 贷方二级科目，依赖一级科目联动
                creditSubjectCode:
                  type: string
                  description: 贷方明细科目，依赖二级科目联动
                amount:
                  type: string
                  description: 本次业务处理涉及的金额。此字段为必填项。
                remark:
                  type: string
                  description: 备注，最长 100 字符
                debitName:
                  type: string
                  description: 借方科目名称，随借方明细科目自动带出
                creditName:
                  type: string
                  description: 贷方科目名称，随贷方明细科目自动带出
                objectType:
                  type: string
                  description: 用于指定「对象类型」。
                audit_frontend_resource:
                  type: object
                  description: 审计用数据快照（复制场景为原始记录快照，纯新增为空对象），供后端审计对比，非用户填写字段
            example:
              sourceId: 1
              bookingTypeId: '2'
              aaid: H00000000
              txNo: TX20260710002
              name: 手工调账-测试分录
              accountAt: '2026-07-10 00:00:00'
              ledgerDate: '2026-07-10 10:00:00'
              objectCode: USD
              debitFirstSubjectCode: '1001'
              debitSecondSubjectCode: '100101'
              debitSubjectCode: '10010101'
              creditFirstSubjectCode: '2001'
              creditSecondSubjectCode: '200101'
              creditSubjectCode: '20010101'
              amount: '100.00'
              remark: 新增备注
              debitName: 库存现金/美元/xxx
              creditName: 应付账款/美元/xxx
              objectType: account
      responses:
        '200':
          description: 请求处理成功。响应的 `data` 不包含额外业务字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: '0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。


                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`

                      判断具体结果。


                      - `401`：未登录。

                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。'
                    x-enum-details:
                    - value: 0
                      label: 成功
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登录或登录状态已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 当前账号未获得该功能授权。请在 User Permission 中为该账号开通相应权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 请求处理超时。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
