                  description: 字段同 booking_stock_bills.yaml（query 能力）里的 filters
                  properties:
                    business_type:
                      type: string
                      description: 用于按「业务类型」筛选结果。
                    account_at:
                      type: object
                      description: 用于按「账务日期」筛选结果。
                      properties:
                        gte:
                          type: string
                          format: date
                          description: 筛选范围的下限，匹配值包含该值。
                        lte:
                          type: string
                          format: date
                          description: 筛选范围的上限，匹配值包含该值。
                    currency:
                      type: string
                      description: 用于按「币种」筛选结果。
                    id:
                      type: string
                      description: 用于按「编号」筛选结果。
                mode:
                  type: integer
                  default: 0
                  description: '不传时默认 0（同步）


                    **可选值：**

                    - `0` - 表示同步

                    - `1` - 表示异步'
                  enum:
                  - 0
                  - 1
                  x-enum-details:
                  - value: 0
                    label: 同步
                  - value: 1
                    label: 异步
                ext:
                  type: string
                  description: '下载文件格式。不传时默认为 `csv`。


                    **可选值：**

                    - `csv` - 表示 CSV

                    - `xlsx` - 表示 Excel'
                  enum:
                  - csv
                  - xlsx
                file_name:
                  type: string
                  description: 导出文件名称。不传时由服务端生成。
                down_fields:
                  type: array
                  description: 不传时导出全部字段；取值范围见 items.enum（同查询接口 data.list.items 的字段列表）
                  items:
                    type: string
