                  enum:
                    - csv
                    - xlsx
                  x-enum-details:
                    - value: csv
                      label: CSV
                    - value: xlsx
                      label: Excel
                  example: csv
                file_name:
                  type: string
                  description: 导出文件名称。不传时由服务端生成。
                down_fields:
                  type: array
                  description: 不传时导出全部字段；取值范围见 items.enum（同查询接口 data.list.items 的字段列表）
                  items:
                    type: string
                    enum:
                      - id
                      - account_at
                      - ledger_date
                      - business_type
                      - business_type_val
                      - currency
                      - amount
                      - custodian_id
                      - custodian_id_val
                      - direction
                      - direction_val
                      - contract_no
                      - company_datasource
                      - company_datasource_val
                      - market
                      - counter_id
                      - trade_quantity
                      - trade_amount
                      - created_at
                      - updated_at
                    example: id
                ticket_content:
                  type: string
                  description: 模板配置了下载审核工单时，供审批人查看
                ticket_preview_url:
                  type: string
                  description: 导出审批详情地址；仅在导出需要审批时使用。
                hide:
                  type: integer
                  description: 是否在下载记录列表中隐藏本次导出记录。
                  enum:
                    - 0
                    - 1
                  x-enum-details:
                    - value: 0
                      label: 不隐藏
                    - value: 1
                      label: 隐藏
                  example: 0
            example:
              filters: {}
              mode: 0
              ext: csv
              file_name: ''
              remark: ''
              down_fields: []
              ticket_content: ''
              ticket_preview_url: ''
              hide: 0
