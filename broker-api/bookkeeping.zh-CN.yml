  /book/account_detail/update:
    post:
      operationId: modify_account_detail_v2
      summary: 编辑会计分录
      tags:
      - 会计中台
      x-permission-key:
      - lb_hk_book.book_detail_update
      x-lbonly: false
      description: '编辑会计分录（与新建共用同一请求，区别在于额外传入 id）。涉及真实会计分录数据变更。


        ### 请求参数


        - 必填：`id`（会计分录ID）、`bookingTypeId`（记账类型）、`txNo`（交易流水号）、`name`（摘要说明）、`accountAt`（记账日期）、`ledgerDate`（分类账日期）、`objectCode`（币种/结算对象）、`debitFirstSubjectCode`（借方一级科目编码）、`debitSecondSubjectCode`（借方二级科目编码）、`debitSubjectCode`（借方三级科目编码）、`creditFirstSubjectCode`（贷方一级科目编码）、`creditSecondSubjectCode`（贷方二级科目编码）、`creditSubjectCode`（贷方三级科目编码）、`amount`（金额）

        - 可选：`sourceId`（账务来源）、`aaid`（关联账户ID）、`remark`（备注）、`debitName`（借方科目全称）、`creditName`（贷方科目全称）、`objectType`（对象类型）、`audit_frontend_resource`（审计追溯调用方快照）

        - 各字段的格式、取值范围、默认行为和业务含义见对应字段说明。


        ### 处理结果


        成功时完成所述业务操作，具体返回内容见 `200` 响应定义。'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              - bookingTypeId
              - txNo
              - name
              - accountAt
              - ledgerDate
              - objectCode
              - debitFirstSubjectCode
              - debitSecondSubjectCode
              - debitSubjectCode
              - creditFirstSubjectCode
              - creditSecondSubjectCode
              - creditSubjectCode
              - amount
              properties:
                id:
                  type: string
                  description: 编辑场景下传入的分录 id，仅编辑接口有此字段
                sourceId:
                  type: number
                  description: '- 下拉选择，取值来自 book_source 动态枚举

                    - 编辑时禁用不可修改

                    - 提交前转为数字


                    请调用 `GET /v1/datasets/refs/book_source` 获取当前可用的数据字典，并使用返回项的 `key` 作为本字段值。'
                  x-value-source:
                    endpoint: GET /v1/datasets/refs/book_source
                bookingTypeId:
                  type: string
                  description: '下拉选择，取值来自 book_business_types_by_source 动态枚举（依赖来源字段联动加载）；当来源为 0 时该项隐藏，不传


                    请调用 `GET /v1/datasets/refs/book_business_types_by_source` 获取当前可用的数据字典，并使用返回项的 `key`
                    作为本字段值。'
                  x-value-source:
                    endpoint: GET /v1/datasets/refs/book_business_types_by_source
                aaid:
                  type: string
                  description: 自定义组件选取关联账户；当来源为 0 时隐藏，不传
                txNo:
                  type: string
                  description: 用于指定「交易流水号」。此字段为必填项。
                name:
                  type: string
                  description: 用于指定「摘要说明」。此字段为必填项。
                accountAt:
                  type: string
                  description: 日期，提交前转为 'YYYY-MM-DD 00:00:00' 格式
                ledgerDate:
                  type: string
                  description: 日期，提交前转为 'YYYY-MM-DD HH:mm:ss' 格式
                objectCode:
                  type: string
                  description: '下拉选择，取值来自 tenant_currencies_by_channel 动态枚举


                    请调用 `GET /v1/datasets/refs/tenant_currencies_by_channel` 获取当前可用的数据字典，并使用返回项的 `key`
                    作为本字段值。'
                  x-value-source:
                    endpoint: GET /v1/datasets/refs/tenant_currencies_by_channel
                debitFirstSubjectCode:
                  type: string
                  description: 下拉选择，借方一级科目，取值来自科目查询联动接口
                debitSecondSubjectCode:
                  type: string
                  description: 下拉选择，借方二级科目，依赖借方一级科目联动加载
                debitSubjectCode:
                  type: string
                  description: 下拉选择，借方末级科目，依赖借方二级科目联动加载；选中后取该项全称作为借方科目名称
                creditFirstSubjectCode:
                  type: string
                  description: 下拉选择，贷方一级科目，取值来自科目查询联动接口
                creditSecondSubjectCode:
                  type: string
                  description: 下拉选择，贷方二级科目，依赖贷方一级科目联动加载
                creditSubjectCode:
                  type: string
                  description: 下拉选择，贷方末级科目，依赖贷方二级科目联动加载；选中后取该项全称作为贷方科目名称
                amount:
                  type: string
                  description: 本次业务处理涉及的金额。此字段为必填项。
                remark:
                  type: string
                  description: 自由文本，最长 100 字符
                debitName:
                  type: string
                  description: 非请求项，选中借方末级科目时从选项全称取值并随提交附带
                creditName:
                  type: string
                  description: 非请求项，选中贷方末级科目时从选项全称取值并随提交附带
                objectType:
                  type: string
                  description: 用于指定「对象类型」。
                audit_frontend_resource:
                  type: object
                  description: 编辑前拉取的原始数据快照，用于后端审计对比，非用户可编辑字段
            example:
              id: '10086'
              sourceId: 1
              bookingTypeId: '2'
              aaid: H00000000
              txNo: TX20260710001
              name: 手工调账-测试分录
              accountAt: '2026-07-10 00:00:00'
              ledgerDate: '2026-07-10 10:00:00'
              objectCode: USD
              debitFirstSubjectCode: '1001'
              debitSecondSubjectCode: '100101'
              debitSubjectCode: '10010101'
              creditFirstSubjectCode: '2001'
              creditSecondSubjectCode: '200101'
              creditSubjectCode: '20010101'
              amount: '100.00'
              remark: 编辑备注
              debitName: 库存现金/美元/xxx
              creditName: 应付账款/美元/xxx
              objectType: account
      responses:
        '200':
          description: 请求处理成功。响应的 `data` 不包含额外业务字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: '0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。


                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`

                      判断具体结果。


                      - `401`：未登录。

                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。'
                    x-enum-details:
                    - value: 0
                      label: 成功
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登录或登录状态已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 当前账号未获得该功能授权。请在 User Permission 中为该账号开通相应权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 请求处理超时。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
  /book/addBookRemarks:
