                    - id
                    - business_type
                    - business_type_val
                    - amount
                    - currency
                    - origin_business_type
                    - origin_business_type_val
                    - account_at
                    - state
                    - state_val
                    - channel
                    - member_id
                    - display_no
                    - counter_id
                    - pick_quantity
                    - pick_amount
                    - lottery_quantity
                    - created_at
                    - updated_at
