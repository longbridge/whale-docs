        - 不再需要导出记录时，可调用 `DELETE /v1/datasets/download/{id}` 删除。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  description: 字段同 booking_account_details_cash.yaml（query 能力）里的 filters
                  required:
                    - account_at
                  properties:
                    tx_no:
                      type: string
                      description: 用于按「原始凭证号」筛选结果。
                    origin:
                      type: string
                      description: 用于按「来源」筛选结果。
                      enum:
                        - '1'
                        - '0'
                        - '2'
                      x-enum-details:
                        - value: '1'
                          label: 人工
                        - value: '0'
                          label: 自动
                        - value: '2'
                          label: 人工修改
                      example: '1'
                    source_id:
                      type: string
                      description: |-
                        用于按「分录数据源」筛选结果。

                        候选值会动态变化。请调用 `GET /v1/datasets/refs/book_source` 获取当前可用的数据字典，并使用返回项的 `key` 作为本参数值。
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/book_source
                    object_code:
                      type: string
                      description: |-
                        用于按「币种」筛选结果。

                        候选值会动态变化。请调用 `GET /v1/datasets/refs/tenant_currencies_by_channel` 获取当前可用的数据字典，并使用返回项的 `key` 作为本参数值。
                      x-value-source:
                        endpoint: GET /v1/datasets/refs/tenant_currencies_by_channel
                    account_at:
                      type: object
                      description: 用于按「账务日期」筛选结果。
                      properties:
                        gte:
                          type: string
                          format: date
                          description: 筛选范围的下限，匹配值包含该值。
                        lte:
                          type: string
                          format: date
                          description: 筛选范围的上限，匹配值包含该值。
                mode:
                  type: integer
                  default: 0
                  description: 不传时默认 0（同步）
                  enum:
                    - 0
                    - 1
                  x-enum-details:
                    - value: 0
                      label: 同步
                    - value: 1
                      label: 异步
                  example: 0
                ext:
                  type: string
                  description: 下载文件格式。不传时默认为 `csv`。
                  enum:
                    - csv
                    - xlsx
                  x-enum-details:
                    - value: csv
                      label: CSV
                    - value: xlsx
                      label: Excel
                  example: csv
                file_name:
                  type: string
                  description: 导出文件名称。不传时由服务端生成。
                down_fields:
                  type: array
                  description: 不传时导出全部字段；取值范围见 items.enum（同查询接口 data.list.items 的字段列表）
                  items:
                    type: string
                    enum:
                      - id
                      - account_entry_id
                      - tx_no
                      - source_id
                      - source_id_val
                      - origin
                      - origin_val
                      - account_at
                      - name
                      - debit_subject_code
                      - debit_name
                      - debit_broker
                      - credit_subject_code
                      - credit_name
                      - credit_broker
                      - object_code
                      - amount
                      - ledger_date
                      - created_at
                      - remark_multi
                    example: id
                ticket_content:
                  type: string
                  description: 模板配置了下载审核工单时，供审批人查看
                ticket_preview_url:
                  type: string
                  description: 导出审批详情地址；仅在导出需要审批时使用。
                hide:
                  type: integer
                  description: 是否在下载记录列表中隐藏本次导出记录。
                  enum:
                    - 0
                    - 1
                  x-enum-details:
                    - value: 0
                      label: 不隐藏
                    - value: 1
                      label: 隐藏
                  example: 0
            example:
              filters: {}
              mode: 0
              ext: csv
              file_name: ''
              remark: ''
              down_fields: []
              ticket_content: ''
              ticket_preview_url: ''
              hide: 0
      responses:
        '200':
          description: 成功时返回「会计分录 - 明细导出」任务信息。同步导出直接提供下载地址；异步导出提供用于后续查询的 `file_download_id`。
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。

                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`
                      判断具体结果。

                      - `401`：未登录。
