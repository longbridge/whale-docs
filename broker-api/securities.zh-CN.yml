                      format: date
                page:
                  type: integer
                  description: 页码. 要查询的页码，从 `1` 开始。
                page_size:
                  type: integer
                  description: 每页数量. 每页返回的记录数量。
                orderBy:
                  type: array
                  description: 排序参数. 排序规则数组；每一项定义一个排序字段及排序方向。
                  items:
                    type: object
            example:
              filters: {}
              page: 1
              page_size: 20
              orderBy: []
      responses:
        '200':
          description: 成功时分页返回「私有库行情 EOD 管理」记录，以及页码、每页数量和总记录数等分页信息。
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。

                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`
                      判断具体结果。

                      - `401`：未登录。
                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。
                  message:
                    type: string
                  data:
                    type: object
                    required:
                      - list
                      - total
                    properties:
                      list:
                        type: array
                        description: 列表. **返回值：** 符合查询条件的记录列表。
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: id. **返回值：** 当前记录的唯一标识。
                            symbol_name:
                              type: string
                              description: 标的名称/代码. **返回值：** 标的名称/代码。
                            trade_day:
                              type: string
                              description: 交易日. **返回值：** 交易日。
                            close:
                              type: string
                              description: 收盘价. **返回值：** 收盘价。
                            suspension_indicator:
                              type: string
                              description: 是否暂停交易. **返回值：** 是否暂停交易。
                            high:
                              type: string
                              description: 高. **返回值：** 高。
                            open:
                              type: string
                              description: 开. **返回值：** 开。
                            low:
                              type: string
                              description: 低. **返回值：** 低。
                            updated_at:
                              type: string
                              description: 更新时间. **返回值：** 更新时间；时间或日期格式以接口实际返回值为准。
                      total:
                        type: integer
                        description: 总条数. **返回值：** 符合查询条件的记录总数，用于计算分页。
              example:
                code: 0
                message: success
                data:
                  list:
                    - id: '16729'
                      symbol_name: AIKO CORP [9909.JP]
                      trade_day: 2026-07-15
                      close: '2350'
                      suspension_indicator: ''
                      high: '0'
                      open: '0'
                      low: '0'
                      updated_at: '2026-07-16 06:01:20'
                  total: 6248
        '400':
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登录或登录状态已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 当前账号未获得该功能授权。请在 User Permission 中为该账号开通相应权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 请求处理超时。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
      x-dataset-download:
        method: POST
        path: /v1/datasets/quote_eod_private/download
        operationId: quote_eod_private_download
      x-mint:
        href: /zh-CN/api-reference/quote_eod_private
        metadata:
          sidebarTitle: 私有库行情 EOD 管理
      x-post-fallback: true
components:
  schemas:
    BrokerGatewayErrorEnvelope:
      type: object
      description: Broker API Gateway 返回的错误响应结构。`code` 为业务错误码，`message` 为错误信息，`data` 通常为空。
      required:
        - code
        - message
        - data
      properties:
        code:
          type: integer
        message:
          type: string
        data: {}
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Broker ACCESS_TOKEN，通过 `Authorization: Bearer <token>` 发送。'
