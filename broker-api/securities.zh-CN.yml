  /gemini-tenant/eod-add:
    post:
      operationId: add_update_private_eod
      summary: 新建/编辑私有行情
      tags:
        - 证券管理
      x-lbonly: false
      description: |-
        行情维护 (Daily Quote) 用于新建或编辑行情记录；不传 `id` 时新建，携带 `id` 时编辑。

        ### 请求参数

        - 必填：`counter_id`（标的代码）、`trade_day`（交易日）、`suspension_indicator`（牌标值）、`close`（收盘价）
        - 可选：`id`（行情记录ID）、`open`（开盘价）、`high`（最高价）、`low`（最低价）、`volume`（成交量）、`turnover`（成交额）、`audit_frontend_resource`（审计上下文）
        - 各字段的格式、取值范围、默认行为和业务含义见对应字段说明。

        ### 处理结果

        成功时完成所述业务操作，具体返回内容见 `200` 响应定义。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - counter_id
                - trade_day
                - suspension_indicator
                - close
              properties:
                id:
                  type: string
                  description: 行情记录ID. 行情记录ID，用于标识本次请求关联的业务对象。
                counter_id:
                  type: string
                  description: 标的代码. 标的代码；创建后不可修改。
                trade_day:
                  type: string
                  description: 交易日. 格式 YYYY-MM-DD
                suspension_indicator:
                  type: string
                  description: |-
                    牌标值. 停牌标记，默认值为 `N`。

                    **可选值：**
                    - `Y` - 表示是
                    - `N` - 表示否
                  enum:
                    - Y
                    - N
                close:
                  type: number
                  description: 收盘价. 用于指定「收盘价」。此字段为必填项。
                open:
                  type: number
                  description: 开盘价. 用于指定「开盘价」。
                high:
                  type: number
                  description: 最高价. 用于指定「最高价」。
                low:
                  type: number
                  description: 最低价. 用于指定「最低价」。
                volume:
                  type: number
                  description: 成交量. 用于指定「成交量」。
                turnover:
                  type: number
                  description: 成交额. 用于指定「成交额」。
                audit_frontend_resource:
                  type: object
                  description: 审计上下文. 调用方提交的审计上下文，用于记录本次操作。
            example:
              id: '10086'
              counter_id: 700.HK
              trade_day: 2026-07-13
              suspension_indicator: N
              close: 100
              open: 99
              high: 101
              low: 98
              volume: 123456
              turnover: 12345600
              audit_frontend_resource: {}
      responses:
        '200':
          description: 请求处理成功。响应的 `data` 不包含额外业务字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。

                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`
                      判断具体结果。

                      - `401`：未登录。
                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登录或登录状态已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 当前账号未获得该功能授权。请在 User Permission 中为该账号开通相应权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 请求处理超时。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
