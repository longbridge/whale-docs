openapi: 3.1.1
info:
  title: Longport Whale 券商 API
  description: 面向使用 Longport Whale 的券商提供机构级服务端 API。
  version: 2.0.0
servers:
  - url: https://b-api.longbridge.xyz
    description: 测试环境
  - url: https://b-api.lbkrs.com
    description: 生产环境
security:
  - bearerAuth: []
tags:
  - name: 证券管理
paths:
  /atm/create/rollover/stock/limit:
    post:
      operationId: create_rollover_stock_limit
      summary: 新建存入限制标的
      tags:
        - 证券管理
      x-permission-key:
        - atm.rollover_stock_limit_update
      x-lbonly: false
      description: |-
        新增证券存入限制，仅需传入 `counter_id`。

        ### 请求参数

        - 必填：`counter_id`（标的代码）
        - 各字段的格式、取值范围、默认行为和业务含义见对应字段说明。

        ### 处理结果

        成功时完成所述业务操作，具体返回内容见 `200` 响应定义。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - counter_id
              properties:
                counter_id:
                  type: string
                  description: 标的代码. 要限制存入的标的代码。
            example:
              counter_id: 700.HK
      responses:
        '200':
          description: 请求处理成功。响应的 `data` 不包含额外业务字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。

                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`
                      判断具体结果。

                      - `401`：未登录。
                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登录或登录状态已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 当前账号未获得该功能授权。请在 User Permission 中为该账号开通相应权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 请求处理超时。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
      x-mint:
        href: /zh-CN/api-reference/create_rollover_stock_limit
        metadata:
          sidebarTitle: 新建存入限制标的
  /atm/create_modify_brokers_my_v3:
    post:
      operationId: create_modify_brokers_my_v3
      summary: 新建/编辑我方券商信息
      tags:
        - 证券管理
      x-permission-key:
        - cmbc.broker_my
      x-lbonly: false
      description: |-
        当前使用 V3 版本接口。传入 id 时为编辑、否则为新增。涉及真实券商配置数据变更。

        ### 请求参数

        - 必填：`market`（市场）、`code`（券商 code）、`name`（渠道券商名称）、`company_name`（柜台公司名称）、`contact`（联系人）、`contact_email`（联系邮箱）、`contact_phones`（联系电话）
        - 可选：`id`（券商记录ID）、`account`（券商账号）、`audit_frontend_resource`（审计上下文）
        - 各字段的格式、取值范围、默认行为和业务含义见对应字段说明。

        ### 处理结果

        成功时完成所述业务操作，具体返回内容见 `200` 响应定义。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - market
                - code
                - name
                - company_name
                - contact
                - contact_email
                - contact_phones
              properties:
                id:
                  type: string
                  description: 券商记录ID. 仅编辑已有记录时传入；新建时不传该字段
                market:
                  type: string
                  description: |-
                    市场. 下拉选择；编辑时该字段禁用不可修改

                    **可选值：**
                    - `us` - 表示美国市场
                    - `cn` - 表示沪深市场
                    - `hk` - 表示香港市场
                    - `sg` - 表示新加坡市场
                  enum:
                    - us
                    - cn
                    - hk
                    - sg
                code:
                  type: string
                  description: 券商 code. 用于指定「券商 code」。此字段为必填项。
                name:
                  type: string
                  description: 渠道券商名称. 用于指定「渠道券商名称」。此字段为必填项。
                company_name:
                  type: string
                  description: 柜台公司名称. 用于指定「柜台公司名称」。此字段为必填项。
                account:
                  type: string
                  description: 券商账号. 用于指定「券商账号」。
                contact:
                  type: string
                  description: 联系人. 用于指定「联系人」。此字段为必填项。
                contact_email:
                  type: string
                  description: 联系邮箱. 用于指定「联系邮箱」。此字段为必填项。
                contact_phones:
                  type: array
                  description: '联系电话. 数组，每项为 { contact_phone: string }，可动态增删多个联系电话，格式需匹配正则 ^[A-Za-z0-9,.\-+\s]+$'
                  items:
                    type: string
                audit_frontend_resource:
                  type: object
                  description: 审计上下文. 审计留痕字段，由调用方生成并随提交请求，含 $action/$behavior 及编辑前的原始字段值，非业务参数
            example:
              market: HK
              code: HKG001
              name: 示例渠道券商
              company_name: 示例柜台公司
              account: ACC00001
              contact: 张三
              contact_email: user@example.com
              contact_phones:
                - contact_phone: 85200000000
      responses:
        '200':
          description: 请求处理成功。响应的 `data` 不包含额外业务字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。

                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`
                      判断具体结果。

                      - `401`：未登录。
                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登录或登录状态已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 当前账号未获得该功能授权。请在 User Permission 中为该账号开通相应权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 请求处理超时。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
      x-mint:
        href: /zh-CN/api-reference/create_modify_brokers_my_v3
        metadata:
          sidebarTitle: 新建/编辑我方券商信息
  /atm/stand_up_down_brokers_my:
    post:
      operationId: stand_up_down_brokers_my
      summary: 上架/下架我方券商
      tags:
        - 证券管理
      x-permission-key:
        - cmbc.broker_my
      x-lbonly: false
      description: |-
        点击后弹出二次确认（popconfirm）后调用。涉及真实券商上下架状态变更。

        ### 请求参数

        - 必填：`brokers_my_id`（我方券商记录ID）、`is_valid`（是否上架）
        - 可选：`audit_frontend_resource`（审计上下文）
        - 各字段的格式、取值范围、默认行为和业务含义见对应字段说明。

        ### 处理结果

        成功时完成所述业务操作，具体返回内容见 `200` 响应定义。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - brokers_my_id
                - is_valid
              properties:
                brokers_my_id:
                  type: string
                  description: 我方券商记录ID. 对应列表行 record.id
                is_valid:
                  type: integer
                  description: |-
                    是否上架. 1=上架 (Stand up)，0=下架 (Stand down)

                    **可选值：**
                    - `1` - 表示上架
                    - `0` - 表示下架
                  enum:
                    - '1'
                    - '0'
                audit_frontend_resource:
                  type: object
                  description: 审计上下文. 由调用方生成并随提交请求，仅含 $behavior 文案（上架/下架提示语），非业务字段
            example:
              brokers_my_id: '1'
              is_valid: 1
      responses:
        '200':
          description: 请求处理成功。响应的 `data` 不包含额外业务字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。

                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`
                      判断具体结果。

                      - `401`：未登录。
                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登录或登录状态已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 当前账号未获得该功能授权。请在 User Permission 中为该账号开通相应权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 请求处理超时。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
      x-mint:
        href: /zh-CN/api-reference/stand_up_down_brokers_my
        metadata:
          sidebarTitle: 上架/下架我方券商
  /atm/create_modify_brokers_v2:
    post:
      operationId: create_modify_brokers_v2
      summary: 新建/编辑对手方券商信息
      tags:
        - 证券管理
      x-permission-key:
        - cmbc.broker_rival
      x-lbonly: false
      description: |-
        请结合审计模板核对请求。`name` 和 `app_name` 为多语言字段，提交前会拆分为 `_en`、`_cn`、`_hk` 三个字段。`is_has_attachment` 使用 `atm_brokers_attachment` 动态枚举。仅编辑时传 `id`。此操作会更改真实券商配置。

        ### 请求参数

        - 必填：`market`（市场）、`name_en`（渠道券商（英文））、`name_cn`（渠道券商（简体中文））、`name_hk`（渠道券商（繁体中文））、`app_name_en`（券商 App 名称（英文））、`app_name_cn`（券商 App 名称（简体中文））、`app_name_hk`（券商 App 名称（繁体中文））、`stock_limit`（转仓股票数量限制）、`code`（券商 code）、`contact`（联系人）、`is_has_attachment`（有无附件）、`tpl_email`（转仓邮箱模版 key）、`show_name`（我方券商名称展示）、`priority`（优先级）、`state`（状态）
        - 可选：`id`（对手方券商记录ID）、`contact_phone`（联系电话）、`contact_email`（联系邮箱）、`icon`（券商 logo）、`website`（官网地址）、`file_list`（附件文件列表）、`audit_frontend_resource`（审计上下文）
        - 各字段的格式、取值范围、默认行为和业务含义见对应字段说明。

        ### 处理结果

        成功时完成所述业务操作，具体返回内容见 `200` 响应定义。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - market
                - name_en
                - name_cn
                - name_hk
                - app_name_en
                - app_name_cn
                - app_name_hk
                - stock_limit
                - code
                - contact
                - is_has_attachment
                - tpl_email
                - show_name
                - priority
                - state
              properties:
                id:
                  type: string
                  description: 对手方券商记录ID. 仅编辑已有记录时传入；新建时不传
                market:
                  type: string
                  description: |-
                    市场. 下拉选择，来自 select，编辑时该字段禁用不可修改

                    **可选值：**
                    - `us` - 表示美国市场
                    - `cn` - 表示沪深市场
                    - `hk` - 表示香港市场
                    - `sg` - 表示新加坡市场
                  enum:
                    - us
                    - cn
                    - hk
                    - sg
                name_en:
                  type: string
                  description: 渠道券商（英文）. 用于指定「渠道券商（英文）」。此字段为必填项。
                name_cn:
                  type: string
                  description: 渠道券商（简体中文）. 用于指定「渠道券商（简体中文）」。此字段为必填项。
                name_hk:
                  type: string
                  description: 渠道券商（繁体中文）. 用于指定「渠道券商（繁体中文）」。此字段为必填项。
                app_name_en:
                  type: string
                  description: 券商 App 名称（英文）. 用于指定「券商 App 名称（英文）」。此字段为必填项。
                app_name_cn:
                  type: string
                  description: 券商 App 名称（简体中文）. 用于指定「券商 App 名称（简体中文）」。此字段为必填项。
                app_name_hk:
                  type: string
                  description: 券商 App 名称（繁体中文）. 用于指定「券商 App 名称（繁体中文）」。此字段为必填项。
                stock_limit:
                  type: integer
                  description: 转仓股票数量限制. 用于指定「转仓股票数量限制」。此字段为必填项。
                code:
                  type: string
                  description: 券商 code. 用于指定「券商 code」。此字段为必填项。
                contact:
                  type: string
                  description: 联系人. 用于指定「联系人」。此字段为必填项。
                is_has_attachment:
                  type: string
                  description: |-
                    有无附件. 单选框，取值来自 ref atm_brokers_attachment 的 key（如 1=有附件/0=无附件，具体枚举以 ref 下发为准）；为 1 时 website
                    非必填， contact_phone/contact_email 必填，为其他值时相反

                    **可选值：**
                    - `1` - 表示是
                    - `0` - 表示否
                  enum:
                    - '1'
                    - '0'
                contact_phone:
                  type: string
                  description: 联系电话. is_has_attachment 为有附件时必填，需匹配正则 ^[A-Za-z0-9,.\-+\s]+$
                contact_email:
                  type: string
                  description: 联系邮箱. is_has_attachment 为有附件时必填，需符合邮箱格式
                tpl_email:
                  type: string
                  description: 转仓邮箱模版 key. 用于指定「转仓邮箱模版 key」。此字段为必填项。
                icon:
                  type: string
                  description: 券商 logo. 用于指定「券商 logo」。
                show_name:
                  type: string
                  description: |-
                    我方券商名称展示. 单选框。

                    **可选值：**
                    - `1` - 表示柜台公司名称
                    - `0` - 表示渠道券商名称
                  enum:
                    - '1'
                    - '0'
                website:
                  type: string
                  description: 官网地址. is_has_attachment 为无附件时必填
                priority:
                  type: integer
                  description: 优先级. 处理优先级；数值含义及排序方向以可选值定义为准。此字段为必填项。
                state:
                  type: string
                  description: |-
                    状态. 1=启用 (Enable)，2=停用 (Disable)，默认为 1

                    **可选值：**
                    - `1` - 表示启用
                    - `2` - 表示停用
                  enum:
                    - '1'
                    - '2'
                file_list:
                  type: array
                  description: 附件文件列表. 文件上传完成后取得的文件 `key` 数组
                  items:
                    type: string
                audit_frontend_resource:
                  type: object
                  description: 审计上下文. 由调用方生成并随提交请求，用于审计日志展示，非业务字段
            example:
              market: HK
              name_en: Sample Broker
              name_cn: 示例券商
              name_hk: 示例券商
              app_name_en: Sample App
              app_name_cn: 示例应用
              app_name_hk: 示例應用
              stock_limit: 100
              code: HKG001
              contact: 李四
              is_has_attachment: '1'
              contact_phone: 85200000000
              contact_email: user@example.com
              tpl_email: user@example.com
              icon: https://example.com/logo.png
              show_name: '1'
              website: https://example.com
              priority: 10
              state: '1'
              file_list:
                - upload_key_1
      responses:
        '200':
          description: 请求处理成功。响应的 `data` 不包含额外业务字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: |-
                      0 表示成功；非 0 为业务错误码，此时 `data` 通常为空。

                      HTTP status 使用标准语义：成功时通常为 `200`，异常时可能为 `400`、`401`、`403`、`408` 等，需结合业务 `code`
                      判断具体结果。

                      - `401`：未登录。
                      - `403`：当前账号未获得该功能授权，需通过 User Permission 授权。
                  message:
                    type: string
                  data:
                    type: object
              example:
                code: 0
                message: success
                data: {}
        '400':
          description: 请求无效。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '401':
          description: 未登录或登录状态已失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '403':
          description: 当前账号未获得该功能授权。请在 User Permission 中为该账号开通相应权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
        '408':
          description: 请求处理超时。具体原因请查看响应体中的业务错误码 `code` 和错误信息 `message`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerGatewayErrorEnvelope'
      x-mint:
        href: /zh-CN/api-reference/create_modify_brokers_v2
        metadata:
          sidebarTitle: 新建/编辑对手方券商信息
  /atm/delete_brokers:
    post:
      operationId: delete_brokers
      summary: 删除对手方券商
      tags:
        - 证券管理
